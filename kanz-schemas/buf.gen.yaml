# Code generation for the Kanz schemas.
#
# Generated code is never committed to this repo (see .gitignore). The
# schema-release workflow runs `buf generate` on a version tag and publishes
# each language's SDK as its own module/package — for Go, the companion module
# repo github.com/kanz-eng/kanz-schemas-go (EVT-15a); for Python, the
# `kanz-schemas` package on PyPI (EVT-15b); for TypeScript, the
# `@kanz-eng/kanz-schemas` package on npm (EVT-15c).
#
# The .proto files carry no `option go_package`; managed mode supplies it,
# appending each file's module-relative directory to the prefix below.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/kanz-eng/kanz-schemas-go
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt: paths=source_relative
  # Python: no clean standalone local plugin exists, so the pinned buf.build
  # remote plugins are used — protocolbuffers/python for *_pb2.py and
  # protocolbuffers/pyi for the *_pb2.pyi type stubs.
  - remote: buf.build/protocolbuffers/python:v32.0
    out: gen/python
  - remote: buf.build/protocolbuffers/pyi:v32.0
    out: gen/python
  # TypeScript: Protobuf-ES, the buf-maintained TS runtime. target=js+dts emits
  # ES modules with .d.ts declarations, so the published package needs no
  # separate `tsc` compile step.
  - remote: buf.build/bufbuild/es:v2.10.0
    out: gen/ts
    opt: target=js+dts

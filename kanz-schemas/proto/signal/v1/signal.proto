syntax = "proto3";

// Package signal.v1 defines the automated-strategy signal domain — the entry
// point of the automated fund-management loop. A StrategySignal is the FACT that
// a proprietary quantitative strategy (running on TradingView via Pine Script)
// fired an actionable alert for a fund. It is the immutable audit root every
// downstream order, fill, and capital effect chains its causation_id to, so the
// durable log tells the whole story: signal -> orders -> fills -> capital -> P&L.
//
// A signal is ADVISORY intent, not a command. services/webhook-ingest validates
// it (HMAC over the raw body, IP allowlist, nonce replay window), records this
// FACT, then — per the fund's venue-allocation policy — emits the concrete
// order.v1.SubmitOrder COMMANDS the OMS executes. The signal itself mutates no
// state and is never executed directly; treating it as a command would skip the
// pre-trade gates the OMS owns.
//
// The signal aggregate identity is signal_id; it is the envelope partition_key,
// and the envelope idempotency_key is derived from (strategy_id, nonce) so a
// re-delivered TradingView webhook dedups to the same signal rather than firing
// a second set of orders.
//
// proto3 cannot enforce field presence; the "Required" notes are invariants the
// ingest service and the bus client library enforce on publish. Sizes and
// leverage are exact common.v1.Decimal — double is banned for anything that
// moves capital. CODEOWNERS: @eighred/execution.
package signal.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "common/v1/decimal.proto";

// SignalAction is the directional intent a strategy expresses. Direction is
// carried here, not by the sign of size (which is strictly positive).
enum SignalAction {
  SIGNAL_ACTION_UNSPECIFIED = 0;
  // BUY opens or increases a long (or reduces/closes a short).
  SIGNAL_ACTION_BUY = 1;
  // SELL opens or increases a short (or reduces/closes a long).
  SIGNAL_ACTION_SELL = 2;
  // CLOSE flattens the fund's entire position in the instrument.
  SIGNAL_ACTION_CLOSE = 3;
}

// SizeType tells the translator how to interpret StrategySignal.size, so
// webhook-ingest can resolve it to an absolute order quantity against live fund
// state. Institutional strategies rarely signal in absolute units; percent-of-
// NAV and quote-notional are the common cases.
enum SizeType {
  SIZE_TYPE_UNSPECIFIED = 0;
  // ABSOLUTE_QTY: size is already the quantity in the instrument's natural
  // units (e.g. 0.1 BTC). No resolution needed.
  SIZE_TYPE_ABSOLUTE_QTY = 1;
  // PCT_OF_EQUITY: size is a fraction of the fund's net asset value (e.g. 5 =
  // 5% of NAV). Resolved as (size/100 × NAV) / price, from the live accounting
  // NAV projection and the latest mark.
  SIZE_TYPE_PCT_OF_EQUITY = 2;
  // QUOTE_NOTIONAL: size is a nominal amount in the quote currency (e.g. 5000
  // USDT). Resolved as size / price, from the latest mark.
  SIZE_TYPE_QUOTE_NOTIONAL = 3;
}

// SignalSource records the provenance of a signal — which brain produced it.
// Kanz is a hybrid brain: signals arrive both from external proprietary
// strategies (TradingView webhooks) and from Kanz's own native alpha engines
// (order-book imbalance, cross-venue arbitrage) running in services/market-
// ingest. Provenance is first-class so risk, audit, and venue-allocation policy
// can treat a native low-latency signal differently from an external advisory
// one — never inferred from the subject or the strategy_id string.
enum SignalSource {
  SIGNAL_SOURCE_UNSPECIFIED = 0;
  // TRADINGVIEW_WEBHOOK: an external Pine strategy fired via services/webhook-
  // ingest (HMAC-authenticated webhook).
  SIGNAL_SOURCE_TRADINGVIEW_WEBHOOK = 1;
  // NATIVE_ENGINE: a Kanz-internal alpha engine emitted the signal from the
  // off-bus L2 book (services/market-ingest). No external webhook is involved.
  SIGNAL_SOURCE_NATIVE_ENGINE = 2;
}

// MarginMode carries the leverage regime for a derivatives signal. Present from
// day 1 so the schema is leverage-ready (the leverage-ready / spot-first
// decision); Phase 1 executes spot-only (MARGIN_MODE_UNSPECIFIED, leverage 1),
// so liquidation logic is isolated from execution bugs during bring-up.
enum MarginMode {
  MARGIN_MODE_UNSPECIFIED = 0; // spot / no leverage
  MARGIN_MODE_CROSS = 1;       // cross-margin (shared collateral)
  MARGIN_MODE_ISOLATED = 2;    // isolated-margin (per-position collateral)
}

// StrategySignal is the FACT that a strategy fired an actionable alert for a
// fund. Emitted by services/webhook-ingest on the subject
// `strategy.signal.received` after validation. It is advisory intent; the OMS's
// pre-trade compliance/risk gates still apply to the orders it produces.
message StrategySignal {
  // signal_id is this signal's unique, idempotent identity — deterministic from
  // (strategy_id, nonce) so a re-delivered webhook dedups to the same signal
  // rather than firing a second set of orders. Required.
  string signal_id = 1;

  // strategy_id identifies the proprietary strategy that fired (the Pine
  // script / alert source). It is also the command issuer principal on the
  // orders this signal produces, formatted "strategy:{strategy_id}". Required.
  string strategy_id = 2;

  // fund_id is the fund whose capital this signal trades. It scopes ownership
  // and maps (via the venue-allocation policy) to the exchange accounts that
  // execute. The envelope tenant_id is derived from it. Required.
  string fund_id = 3;

  // instrument_id is the canonical Kanz instrument the signal targets, resolved
  // by ingest from source_symbol. It is what the SubmitOrder commands trade.
  // Required.
  string instrument_id = 4;

  // source_symbol is the raw ticker as it arrived from TradingView (e.g.
  // "BINANCE:BTCUSDT"), retained for audit and exchange reconciliation.
  // Optional.
  string source_symbol = 5;

  // action is the directional intent. Required; must not be UNSPECIFIED.
  SignalAction action = 6;

  // size is the intended order size BEFORE venue allocation, interpreted per
  // size_type, strictly positive. The translator resolves it to an absolute
  // quantity (against live NAV/price for PCT_OF_EQUITY/QUOTE_NOTIONAL); the
  // allocation policy then scales it per venue weight into the per-venue
  // SubmitOrder quantities. Required.
  common.v1.Decimal size = 7;

  // leverage is the requested leverage multiple (1 = spot / unlevered). Present
  // from day 1 for leverage-readiness; Phase 1 runs leverage = 1. Required.
  common.v1.Decimal leverage = 8;

  // margin_mode is the leverage regime for a derivatives signal; UNSPECIFIED for
  // spot. Optional.
  MarginMode margin_mode = 9;

  // source_ts is the alert time as reported by TradingView (from the webhook
  // body). Advisory only — never trusted for ordering or replay defense.
  // Optional.
  google.protobuf.Timestamp source_ts = 10;

  // received_ts is when webhook-ingest received and validated the signal — the
  // authoritative receipt time. Required.
  google.protobuf.Timestamp received_ts = 11;

  // size_type tells the translator how to interpret size. Required; must not be
  // UNSPECIFIED.
  SizeType size_type = 12;

  // source is the signal's provenance (which brain produced it). Required going
  // forward; a zero value (UNSPECIFIED) is read as TRADINGVIEW_WEBHOOK for
  // backward compatibility with signals recorded before this field existed.
  SignalSource source = 13;

  // alpha_score is the strategy's stated confidence AND THE CLAIM IT IS ABOUT
  // (#416 C2). Optional: a signal may be a rule with no probabilistic claim, and
  // a CLOSE that flattens a position is not a forecast.
  //
  // RECORDING IT ON THE FACT IS WHAT MAKES IT FALSIFIABLE. A score that lives
  // only inside the engine can never be scored against what happened, so nobody
  // can say whether a given 0.7 was right — which is the whole objection to "9.8
  // out of 10". Persisted here, beside the instrument and the receipt time, a
  // calibration run is a join against realized returns rather than a rebuild of
  // history.
  AlphaScore alpha_score = 14;
}

// AlphaScore is a probability WITH THE CLAIM IT IS THE PROBABILITY OF.
//
// # Why the claim travels with the number
//
// "Confidence 0.8" is unfalsifiable: nobody can say whether a given 0.8 was
// right, so it cannot be backtested, attributed, or debugged when it loses
// money. A probability is only meaningful against a stated event, so this message
// carries the event — return >= return_threshold within horizon — and the model
// that made the claim.
//
// # The asymmetry between the two numeric fields is deliberate
//
// probability is a double because it is an ESTIMATE: nothing groups by its exact
// value, and float64 is the working shape of every calibration statistic
// computed from it.
//
// return_threshold is a common.v1.Decimal because it is an IDENTITY: calibration
// buckets scores by the claim they make, and two thresholds that differ in the
// last bits of a float are two buckets where there should be one. It is a
// fraction, not a percentage — 0.005 is "up 0.5%".
message AlphaScore {
  // probability that the claim below holds, in [0,1]. A value outside that range
  // is not a strong opinion; it is a defect, and a consumer must refuse it rather
  // than clamp — clamping turns a broken model into a maximally confident one.
  double probability = 1;

  // return_threshold is the X in "return >= X", as a fraction of the current
  // price. Required: without it the probability states nothing.
  common.v1.Decimal return_threshold = 2;

  // horizon is the H in "within H". Required, for the same reason: P(up 0.5%) is
  // near 1 over a year and near 0.5 over a second.
  google.protobuf.Duration horizon = 3;

  // model_id identifies the model AND ITS VERSION, because calibration is a
  // property of a version rather than of a name. A retrained model that inherits
  // its predecessor's calibration record is claiming evidence it does not have.
  string model_id = 4;
}

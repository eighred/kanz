syntax = "proto3";

// Package collateral.v1 is the collateral / margin / financing schema (COLL-01a)
// — the cash-and-collateral plane that turns positions into FUNDED positions
// (ROI #33). It carries the agreements that govern margining (CollateralAgreement
// + its EligibilitySchedule of haircuts), the MarginCall a margin run produces,
// and the FinancingTrade (repo / securities-lending) that funds the book. It is
// the downstream of the XVA-01 CSA: the same collateral terms that REDUCE
// counterparty exposure are what a margin call MOVES.
//
// # Money is Decimal, rates/haircuts are double
//
// Call amounts, thresholds, principals are money ⇒ common.v1.Decimal (the EVT-14
// exact-money rule). Haircuts, repo rates, and SIMM risk weights are
// dimensionless fractions/rates ⇒ double.
package collateral.v1;

import "google/protobuf/timestamp.proto";
import "common/v1/decimal.proto";
import "domain/v1/measure.proto";

// MarginType distinguishes variation margin (against MtM moves) from initial
// margin (the SIMM/grid potential-future-exposure buffer).
enum MarginType {
  MARGIN_TYPE_UNSPECIFIED = 0;
  MARGIN_TYPE_VARIATION = 1;
  MARGIN_TYPE_INITIAL = 2;
}

// EligibilityScheduleItem is one collateral asset's terms under an agreement: is
// it eligible, and at what haircut.
message EligibilityScheduleItem {
  // asset_id is the canonical id of the collateral asset (cash currency, a bond,
  // an equity). Required.
  string asset_id = 1;

  // eligible marks whether the asset may be posted under this agreement.
  bool eligible = 2;

  // haircut is the valuation haircut applied when posting (e.g. 0.02 for 2%);
  // post-value = market-value × (1 − haircut). Required for an eligible asset.
  double haircut = 3;
}

// CollateralAgreement is a CSA-style agreement governing margining with one
// counterparty — the threshold/MTA economics plus the eligibility schedule.
message CollateralAgreement {
  // agreement_id is the canonical id. Required.
  string agreement_id = 1;

  // counterparty_id references the xva.v1.Counterparty. Required.
  string counterparty_id = 2;

  // threshold is the unsecured amount below which no collateral is posted;
  // minimum_transfer_amount is the smallest call made; independent_amount is
  // always-posted over-collateralization. Money. Required (IA optional).
  common.v1.Decimal threshold = 3;
  common.v1.Decimal minimum_transfer_amount = 4;
  common.v1.Decimal independent_amount = 5;

  // rounding is the increment calls are rounded to (money). Optional.
  common.v1.Decimal rounding = 6;

  // currency_code is the base currency of the agreement. Required.
  string currency_code = 7;

  // schedule is the per-asset eligibility/haircut schedule. Required; non-empty.
  repeated EligibilityScheduleItem schedule = 8;
}

// MarginCall is the result of a margin run against one agreement — the amount to
// be moved and which way.
message MarginCall {
  // agreement_id references the CollateralAgreement. Required.
  string agreement_id = 1;

  // as_of is the valuation time of the margin run. Required.
  google.protobuf.Timestamp as_of = 2;

  // margin_type is variation or initial. Required.
  MarginType margin_type = 3;

  // call_amount is the (signed) collateral movement: positive = the counterparty
  // posts to us, negative = we post. Money in the agreement currency. Required.
  common.v1.Decimal call_amount = 4;

  // required_amount is the total collateral that should be held post-call;
  // held_amount is what is already held. Money. Required.
  common.v1.Decimal required_amount = 5;
  common.v1.Decimal held_amount = 6;
}

// FinancingKind is the kind of financing trade.
enum FinancingKind {
  FINANCING_KIND_UNSPECIFIED = 0;
  // REPO: borrow cash, pledge a security as collateral.
  FINANCING_KIND_REPO = 1;
  // REVERSE_REPO: lend cash, take a security as collateral.
  FINANCING_KIND_REVERSE_REPO = 2;
  // SEC_LENDING: lend a security for a fee.
  FINANCING_KIND_SEC_LENDING = 3;
  // SEC_BORROW: borrow a security against collateral.
  FINANCING_KIND_SEC_BORROW = 4;
}

// FinancingTrade is a repo or securities-lending trade — the funding leg of a
// position. Its cash flows extend the portfolio's forward cash ladder (COLL-01d).
message FinancingTrade {
  // financing_id is the canonical id. Required.
  string financing_id = 1;

  // kind is the financing kind. Required.
  FinancingKind kind = 2;

  // collateral_asset_id is the security pledged/borrowed. Required.
  string collateral_asset_id = 3;

  // principal is the cash amount (money). Required.
  common.v1.Decimal principal = 4;

  // rate is the annualized financing rate (repo rate / lending fee), decimal.
  // Required.
  double rate = 5;

  // haircut is the collateral haircut on the trade, decimal. Optional.
  double haircut = 6;

  // start_date is when cash/securities are exchanged; end_date when the trade
  // unwinds (principal + financing returned). Both required.
  google.protobuf.Timestamp start_date = 7;
  google.protobuf.Timestamp end_date = 8;

  // currency_code is the ISO 4217 currency of the cash leg. Required.
  string currency_code = 9;
}

// VenueMarginState is the EXCHANGE'S OWN margin state for one venue account,
// OBSERVED rather than computed (#408, control 1).
//
// # Why this is not derived from our book
//
// Everything else on this platform that could be called "margin" is a projection
// of FACTs Kanz folded from its own fills: internal/collateral's VariationMargin
// and the SIMM initial-margin grid model what a margin call SHOULD be under an
// agreement we hold. None of that is what the exchange will act on. The exchange
// margins with its own maintenance-margin tiers, its own mark price and its own
// index, and it liquidates on its own schedule without asking. #408 names the
// failure exactly: "the exchange sold our collateral while we were reading stale
// books". A reconstruction of the venue's margin maths IS that stale book, so
// this message carries only numbers the venue itself reported, and carries
// NOTHING where it reported nothing.
//
// # Keyed by ACCOUNT, not by portfolio, and that is deliberate
//
// A venue adapter deployment holds one API credential and therefore IS one
// exchange account; it does not know which portfolio is bound to it — the
// bindings are OMS deploy-time configuration (execution.ParseBindings). So the
// publisher states what it can actually witness. The consumer resolves
// portfolio → account through those bindings, and that resolution is
// single-valued because ErrAccountShared refuses to start the OMS on an account
// with two owners (#415). Control 2 is what makes control 1 addressable per
// portfolio; stamping a portfolio_id here would be the adapter guessing.
message VenueMarginState {
  // venue is the MIC/venue label the adapter publishes under ("OKX"). Required.
  string venue = 1;

  // venue_account_id is the exchange account this credential spends from — the
  // unit the exchange margins and LIQUIDATES per. Required.
  string venue_account_id = 2;

  // maintenance_margin is the collateral the exchange requires this account to
  // keep, in the account's own valuation currency, as the exchange reported it.
  //
  // ABSENT MEANS UNKNOWN AND NEVER ZERO. A zero here is a claim that the account
  // needs no collateral at all, byte-identical to the answer for an account
  // holding no leveraged position — and it is exactly the answer an empty venue
  // field would produce if this were a scalar. A consumer gating on it must
  // REFUSE on absence, not substitute.
  common.v1.Decimal maintenance_margin = 3;

  // margin_ratio is the exchange's own current margin ratio for the account, as
  // it reported it. Absent ⇒ UNKNOWN (see maintenance_margin).
  //
  // ITS SCALE AND DIRECTION ARE THE VENUE'S, NOT OURS. OKX's mgnRatio rises as
  // the account gets SAFER; a Binance-style margin level and an
  // equity/maintenance-margin ratio agree on neither the units nor which way
  // danger lies. Nothing here normalizes them, because normalizing would mean
  // asserting a venue's convention on its behalf — the same class of claim #408
  // rules out for cross-margin offsets. A limit written against this must be
  // written per venue; control 4's liquidation-distance measure is where a
  // venue-comparable number belongs.
  common.v1.Decimal margin_ratio = 4;

  // liquidation_prices are the exchange's liquidation price per open position on
  // this account. A position the venue reported WITHOUT a liquidation price is
  // absent from this list and present in coverage.exclusions — it is not carried
  // at zero, which would read as "liquidates at any price above zero".
  repeated VenueLiquidationPrice liquidation_prices = 5;

  // observed_at is when this state was TRUE AT THE VENUE — the exchange's own
  // update stamp where it publishes one, and the adapter's fetch time only where
  // it does not. knowledge_time is when Kanz learned it. Both required.
  //
  // STALENESS IS FIRST-CLASS HERE, not an annotation. A margin ratio from ten
  // minutes ago during a fast move is not a margin ratio: it is the number that
  // was true before the move that is about to liquidate the account. Consumers
  // bound the age far more tightly than they bound a cash balance and treat an
  // aged-out value as UNKNOWN, which every control in the #408 set fails closed
  // on.
  google.protobuf.Timestamp observed_at = 6;
  google.protobuf.Timestamp knowledge_time = 7;

  // coverage says which of the quantities above the venue actually reported.
  //
  // PRESENCE IS THE SIGNAL, exactly as on domain.v1.RiskMeasure: absent means
  // this publisher does not report coverage; present with excluded_count = 0
  // means it reports and the venue answered everything asked of it. The type is
  // shared with the risk measures rather than re-declared, so a consumer that
  // already refuses an uncovered VaR refuses an uncovered margin ratio by the
  // same code path (#408 control 3, #527).
  domain.v1.InputCoverage coverage = 8;
}

// VenueLiquidationPrice is one open position's liquidation price at the venue.
message VenueLiquidationPrice {
  // venue_symbol is the exchange's own instrument id ("BTC-USDT-SWAP"). It is
  // the venue's spelling and NOT a Kanz instrument_id: the adapter's symbol map
  // is a one-way instrument → symbol table, so a position the map does not cover
  // would otherwise be dropped — silently losing the liquidation price of
  // exactly the position nobody is watching. Required.
  string venue_symbol = 1;

  // price is the exchange's liquidation price for the position, in the
  // instrument's quote currency. Required — a position whose liquidation price
  // the venue did not report is EXCLUDED from the list, never carried at zero.
  common.v1.Decimal price = 2;
}

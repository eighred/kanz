syntax = "proto3";

// Package compliance.v1 defines the mandate/compliance domain — the rulesets a
// portfolio is governed by and the verdicts produced by evaluating a book
// against them. It is the schema layer behind the COMP-01 engine: the pre-trade
// gate the OMS calls before admitting an order (OMS-01f) and the post-trade
// monitor that re-evaluates live books (COMP-01d).
//
// A Mandate is tenant/portfolio-scoped and versioned; a mandate change is a new
// version carried on a lifecycle.v1.ConfigChanged FACT (COMP-01f), so "which
// mandate applied when" is point-in-time reconstructable. CODEOWNERS:
// @eighred/compliance.
//
// Deny-by-default is the engine invariant, not a schema one: an unknown
// RuleType or an unparseable rule MUST evaluate to BREACH, never PASS. proto3
// cannot enforce field presence; the "Required" notes are invariants the bus
// client library and the COMP-01 engine enforce.
package compliance.v1;

import "google/protobuf/timestamp.proto";
import "common/v1/decimal.proto";

// ComplianceStatus is the verdict of a rule or of a whole evaluation. It is a
// total order PASS < WARN < BREACH; an evaluation's status is the worst across
// its rules. Reused as a rule's violation severity (WARN advises, BREACH
// denies).
enum ComplianceStatus {
  // Default zero value; never set explicitly on a result.
  COMPLIANCE_STATUS_UNSPECIFIED = 0;

  // PASS: the rule (or evaluation) is satisfied.
  COMPLIANCE_STATUS_PASS = 1;

  // WARN: a soft limit is exceeded; advisory, does not block a trade.
  COMPLIANCE_STATUS_WARN = 2;

  // BREACH: a hard limit is violated; pre-trade this rejects the order,
  // post-trade it emits a ComplianceBreach FACT.
  COMPLIANCE_STATUS_BREACH = 3;
}

// RuleType selects which rule a Rule carries. Each value pairs with one params
// variant in Rule.params. Additive — new rule types are appended, never
// repurposed; an engine that does not recognize a value denies by default.
enum RuleType {
  // Default zero value; never set explicitly. Treated as an unknown rule
  // (deny-by-default) by the engine.
  RULE_TYPE_UNSPECIFIED = 0;

  // Concentration cap: a bucket's share of gross exposure must not exceed a
  // maximum weight. Pairs with ConcentrationLimit.
  RULE_TYPE_CONCENTRATION = 1;

  // Asset-class / sector restriction: a dimension's values are forbidden
  // (deny) or are the only ones permitted (allow-only). Pairs with
  // RestrictionList.
  RULE_TYPE_RESTRICTION = 2;

  // Issuer exclusion list: holdings in any listed issuer are forbidden. Pairs
  // with IssuerExclusion.
  RULE_TYPE_ISSUER_EXCLUSION = 3;

  // Gross-leverage cap: gross exposure / NAV must not exceed a maximum. Pairs
  // with LeverageCap.
  RULE_TYPE_GROSS_LEVERAGE = 4;

  // Currency restriction: holdings may only be denominated in an allowed set
  // of currencies. Pairs with CurrencyRestriction.
  RULE_TYPE_CURRENCY = 5;

  // RULE_TYPE_BUYING_POWER caps what an order may SPEND: the portfolio's cash
  // after the trade must not fall below a floor (#415).
  //
  // Every other rule here bounds the SHAPE of the book — how concentrated, how
  // levered, which instruments and currencies. None of them asks whether the
  // fund can afford the order. Margin sufficiency was discovered from the
  // exchange, after dispatch.
  RULE_TYPE_BUYING_POWER = 6;

  // RULE_TYPE_RISK_MEASURE caps a measure the RISK ENGINE computes — VaR,
  // expected shortfall, a factor exposure, a stress loss (#438).
  //
  // It is the first rule here whose input the OMS cannot derive from the book it
  // holds. Every other rule bounds the shape of the holdings; this one asks the
  // risk engine what those holdings are WORTH LOSING, which is the question a
  // pre-trade gate exists to ask and the one this platform could not.
  RULE_TYPE_RISK_MEASURE = 7;

  // RULE_TYPE_VENUE_MARGIN declares that this portfolio trades on MARGIN at a
  // venue, and gates every order that would take or increase a position there
  // on the EXCHANGE'S OWN margin state for the account it trades from (#408,
  // control 3).
  //
  // IT IS THE ONLY RULE HERE THAT REFUSES BY DEFAULT RATHER THAN ON A BREACH.
  // Every other rule computes something and compares it, and absent inputs make
  // one or two of them fail closed as an edge case. This one is fail-closed as
  // its WHOLE PURPOSE. The number it needs is the venue's, it ages in seconds,
  // and the cost of acting on a wrong one is not a bad trade — it is the
  // exchange selling the fund's collateral while the books read fine. So an
  // order is admitted only while the margin state is READ, CURRENT and
  // COMPLETE, and refused on every other state, including the states that look
  // like answers.
  //
  // ORDERS THAT REDUCE THE POSITION ARE NOT GATED. A control that blocked
  // de-risking while margin was unknown would trap the fund in exactly the
  // position it needs to leave. See VenueMarginRule.
  RULE_TYPE_VENUE_MARGIN = 8;
}

// Dimension is the portfolio axis a concentration or restriction rule buckets
// on. INSTRUMENT and CURRENCY resolve from the position itself; ISSUER, SECTOR,
// and ASSET_CLASS resolve via the reference classifier the engine is given.
enum Dimension {
  // Default zero value; never set explicitly.
  DIMENSION_UNSPECIFIED = 0;

  DIMENSION_INSTRUMENT = 1;
  DIMENSION_ISSUER = 2;
  DIMENSION_SECTOR = 3;
  DIMENSION_ASSET_CLASS = 4;
  DIMENSION_CURRENCY = 5;
}

// RestrictionMode is how a RestrictionList's values are interpreted.
enum RestrictionMode {
  // Default zero value; never set explicitly. Treated as deny-by-default by
  // the engine (an unconfigured restriction admits nothing it lists).
  RESTRICTION_MODE_UNSPECIFIED = 0;

  // DENY: the listed values are forbidden; everything else is allowed.
  RESTRICTION_MODE_DENY = 1;

  // ALLOW_ONLY: only the listed values are allowed; everything else is
  // forbidden.
  RESTRICTION_MODE_ALLOW_ONLY = 2;
}

// ConcentrationLimit caps a bucket's share of gross exposure. When bucket is
// empty the limit applies to every bucket on the dimension (e.g. "no single
// issuer over 5%"); when bucket is set it applies only to that bucket
// (e.g. "tech sector under 30%").
message ConcentrationLimit {
  // dimension is the axis to bucket exposure on. Required.
  Dimension dimension = 1;

  // bucket optionally narrows the rule to one bucket key on the dimension.
  // Empty ⇒ the cap applies to each bucket independently. Optional.
  string bucket = 2;

  // max_weight is the maximum fraction of portfolio gross exposure, e.g.
  // 0.10 for 10%. Required; must be in (0, 1].
  common.v1.Decimal max_weight = 3;
}

// RestrictionList forbids (or exclusively permits) a set of values on a
// dimension — the asset-class / sector restriction rule.
message RestrictionList {
  // dimension is the axis the values are matched on (e.g. SECTOR,
  // ASSET_CLASS, CURRENCY). Required.
  Dimension dimension = 1;

  // values are the bucket keys to deny or to exclusively allow, per mode.
  // Required (a non-empty list).
  repeated string values = 2;

  // mode interprets values. Required; UNSPECIFIED denies by default.
  RestrictionMode mode = 3;
}

// IssuerExclusion forbids any holding in a listed issuer — the issuer exclusion
// list (sanctions, restricted counterparties).
message IssuerExclusion {
  // issuer_ids are the canonical issuer identifiers that may not be held.
  // Required (a non-empty list).
  repeated string issuer_ids = 1;
}

// LeverageCap bounds portfolio gross leverage (gross exposure / net asset
// value).
message LeverageCap {
  // max_gross_leverage is the maximum gross-exposure-to-NAV ratio, e.g. 2.0
  // for 200%. Required; must be > 0.
  common.v1.Decimal max_gross_leverage = 1;
}

// CurrencyRestriction limits the currencies positions may be denominated in.
message CurrencyRestriction {
  // allowed_currencies is the ISO 4217 set permitted. Required (a non-empty
  // list); a holding in any other currency breaches.
  repeated string allowed_currencies = 1;
}

// Rule is one mandate constraint. type selects which params variant is set; an
// engine matches the two and denies by default if they disagree or the type is
// unknown.
message Rule {
  // rule_id is the stable identity of this rule within its mandate — the key a
  // Violation refers back to. Required.
  string rule_id = 1;

  // type selects the params variant. Required; must not be
  // RULE_TYPE_UNSPECIFIED.
  RuleType type = 2;

  // on_violation is the severity to record when this rule is violated. A WARN
  // rule advises without blocking; a BREACH rule denies. UNSPECIFIED is
  // treated as BREACH (deny-by-default). Optional.
  ComplianceStatus on_violation = 3;

  // params carries the rule's typed parameters, matched to type.
  oneof params {
    ConcentrationLimit concentration = 10;
    RestrictionList restriction = 11;
    IssuerExclusion issuer_exclusion = 12;
    LeverageCap leverage_cap = 13;
    CurrencyRestriction currency_restriction = 14;
    BuyingPowerLimit buying_power = 15;
    RiskMeasureLimit risk_measure = 16;
    VenueMarginLimit venue_margin = 17;
  }
}

// BuyingPowerLimit bounds what an order may spend (#415).
//
// THE FLOOR IS EXPLICIT AND HAS NO DEFAULT, deliberately. An absent limit means
// "no buying-power rule", which is what every portfolio has today. A limit whose
// min_cash_after is unset means the floor is ZERO — the portfolio may spend down
// to nothing and no further. A positive value keeps a reserve: cash the fund
// declines to commit, which is the usual shape for a margin buffer.
//
// It is denominated in the portfolio's BASE CURRENCY, like NAV. A per-currency
// floor is a different rule and a bigger one — it needs the FX layer to compare
// a USDT balance against a USD order — and inventing it here would make the
// simple case wrong in a way nobody could see.
message BuyingPowerLimit {
  // min_cash_after is the lowest post-trade cash balance the mandate permits,
  // in the portfolio's base currency. Unset ⇒ zero.
  common.v1.Decimal min_cash_after = 1;
}

// RiskMeasureLimit bounds a RISK measure the risk engine computes — VaR, expected
// shortfall, a factor exposure, a stress loss (#438).
//
// # This is the gap that separates a compliance gate from a pre-trade RISK gate
//
// Every other rule here bounds the SHAPE of the book from the book itself:
// how concentrated, how levered, which instruments and currencies. All of them
// are computable from the holdings the OMS already has.
//
// A risk measure is not. VaR, expected shortfall and factor decomposition come
// from internal/risk — a model, a covariance estimate and a history — and until
// this rule existed, order admission could not ask for any of them. An order
// could sit inside every mandate rule on this platform and still take the
// portfolio through its VaR limit, and the platform would admit it, execute it,
// and only then compute how bad it was.
//
// # measure_name is the risk engine's own name, deliberately
//
// It matches compute.MeasureName ("VaR99", "ExpectedShortfall97", a factor id)
// rather than an enum mirrored here. An enum would have to be extended in this
// schema every time the quant library adds a measure, and the two would drift —
// with the failure mode that a mandate declares a limit on a measure nothing
// computes, and the rule reports "unknown" forever while reading as configured.
//
// A limit naming a measure the engine does not produce is therefore a REFUSAL,
// not a pass: see RiskLimitRule.
message RiskMeasureLimit {
  // measure_name is the risk engine's measure, e.g. "VaR99". Required.
  string measure_name = 1;

  // max_value is the ceiling. The measure must not EXCEED it after the order.
  //
  // NO DEFAULT, and no "unlimited" spelling. An absent limit means the mandate
  // declares no risk rule, which is what every portfolio has today. A limit that
  // is present but empty would be a control that admits everything while
  // appearing configured — the failure this platform refuses everywhere else.
  common.v1.Decimal max_value = 2;
}

// VenueMarginLimit declares that a portfolio trades on MARGIN and gates its
// orders on the exchange's own margin state for the account behind them (#408,
// control 3).
//
// # What DECLARING it means, and why the declaration is the trigger
//
// order.v1.SubmitOrder carries no leverage and no margin mode: #408's ruling
// keeps that field blocked (#417) until controls 1-3 exist, precisely so the
// platform cannot take a leveraged position before it can see one. An ORDER
// therefore cannot say "this is leveraged", and the mandate is where it is
// said. A portfolio whose mandate carries this rule is one an operator has
// declared margin-enabled, and its orders are gated on the venue's own numbers.
//
// That is DELIBERATELY WIDER than "leveraged orders only". It gates spot orders
// on a margin-enabled account too, and that is the correct direction of error:
// on a cross-margin account a spot buy consumes the same collateral pool the
// exchange will liquidate from. When #417 lands, the trigger can narrow to the
// orders that carry leverage. It must not be narrowed before then by guessing.
//
// # min_margin_ratio is IN THE VENUE'S OWN UNITS AND DIRECTION
//
// OKX's mgnRatio rises as the account gets SAFER. A Binance-style margin level
// and an equity/maintenance-margin ratio agree on neither the units nor on
// which way danger lies, and nothing on this platform normalizes them, because
// normalizing would mean asserting a venue's convention on its behalf — the
// same class of claim #408 rules out for cross-margin offsets. So a floor is
// only meaningful once the venue is named, and a floor WITHOUT a venue is
// REFUSED rather than applied to whichever venue an order happens to reach. A
// venue-comparable liquidation distance is control 4's job, not this one's.
message VenueMarginLimit {
  // venue is the MIC this rule governs. It matches order.v1.SubmitOrder.venue
  // and the venue label collateral.v1.VenueMarginState is published under —
  // both are the adapter's MIC, so a mandate and an observation cannot disagree
  // about which exchange is meant.
  //
  // EMPTY MEANS EVERY VENUE: the rule then demands a readable, current, complete
  // margin state wherever the order routes. That is the safe default, because an
  // empty venue can only ever gate MORE orders, never fewer. It is also the one
  // spelling under which min_margin_ratio is refused, because a floor whose
  // direction is unknown is not a floor.
  string venue = 1;

  // min_margin_ratio is the lowest margin ratio, IN THE VENUE'S UNITS AND
  // DIRECTION, at which an order may still take or increase a position.
  //
  // ABSENT IS NOT ZERO AND NOT "NO LIMIT". Absent means the rule checks only
  // that the margin state is readable, current and complete — which is already
  // the control #408 asks for. A floor of zero would instead be an active claim
  // that any positive ratio is acceptable, asserted on a venue whose ratio may
  // not even rise with safety.
  common.v1.Decimal min_margin_ratio = 2;
}

// Mandate is the tenant/portfolio-scoped ruleset a book is governed by. It is
// versioned: a change is a new version (COMP-01f), and the version that applied
// at a point in time is what a decision is audited against.
message Mandate {
  // mandate_id is the mandate's stable identity. Required.
  string mandate_id = 1;

  // tenant_id scopes the mandate to a tenant. Required.
  string tenant_id = 2;

  // portfolio_id is the portfolio this mandate governs. Required.
  string portfolio_id = 3;

  // version is monotonic; each mandate change increments it. Required.
  uint64 version = 4;

  // rules is the constraint set evaluated against a candidate book. An empty
  // ruleset trivially passes (no constraints declared).
  repeated Rule rules = 5;

  // effective_at is the domain time this mandate version takes effect.
  // Required.
  google.protobuf.Timestamp effective_at = 6;
}

// MandateSet is what a portfolio's mandate subject CARRIES, and it is a set
// rather than one mandate because the stream retains exactly one message per
// (tenant, portfolio) subject.
//
// THE STREAM KEEPS THE NEWEST MESSAGE, NOT THE ONE IN FORCE. A mandate carries
// effective_at and an operator may legitimately schedule one: publish v2 today,
// dated next month. With a single Mandate on the wire that publish EVICTED v1 —
// the version actually governing the portfolio — from a compacted, never-aging
// stream. The next replica to boot read only v2, found nothing in effect, and
// resolved the portfolio as UNGOVERNED; with OMS_REQUIRE_MANDATE unset that is
// admitted with no constraints rather than refused. A routine, correct operator
// action silently disarmed the pre-trade control (#916).
//
// Carrying the SET makes "keep the newest message" correct by construction: the
// newest message is the whole answer, so there is nothing for compaction to lose.
// The members are the versions a lookup can still choose — the single latest
// version in force at publish time, plus every version dated later (#884) — so
// the count is 1 + the mandate changes an operator has scheduled and not yet
// reached, and a republish collapses rather than accumulates.
message MandateSet {
  // mandates is ordered ascending by (effective_at, version) and is never empty
  // on the wire. A reader resolves the version in force by taking the last
  // member whose effective_at is at or before the query time.
  repeated Mandate mandates = 1;
}

// Violation is one rule that failed in an evaluation, with the evidence that
// reconstructs why.
message Violation {
  // rule_id and rule_type identify the failed rule. Required.
  string rule_id = 1;
  RuleType rule_type = 2;

  // severity is WARN or BREACH (the rule's on_violation). Required.
  ComplianceStatus severity = 3;

  // message is a human-readable explanation. Required.
  string message = 4;

  // evidence are the structured facts behind the verdict — e.g.
  // {"observed":"0.12","limit":"0.10","bucket":"TECH"} — so an auditor sees
  // the numbers, not just the verdict. May be empty.
  map<string, string> evidence = 5;
}

// ComplianceResult is the verdict of evaluating one candidate book against one
// mandate. status is the worst severity across the rules; PASS with no
// violations is a clean book.
message ComplianceResult {
  // status is the overall verdict. Required.
  ComplianceStatus status = 1;

  // portfolio_id, mandate_id, and mandate_version pin what was evaluated and
  // against which mandate version (the point-in-time anchor). Required.
  string portfolio_id = 2;
  string mandate_id = 3;
  uint64 mandate_version = 4;

  // violations lists every rule that did not pass. Empty when status is PASS.
  repeated Violation violations = 5;

  // evaluated_at is the domain time the evaluation ran. Required.
  google.protobuf.Timestamp evaluated_at = 6;
}

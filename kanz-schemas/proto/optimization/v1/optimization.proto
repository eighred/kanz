syntax = "proto3";

// Package optimization.v1 is the portfolio construction & optimization schema
// (OPT-01a): the objective + constraints a quant/PM specifies, and the
// RebalanceProposal the optimizer produces — target weights plus the trade list
// to get there. The portfolio-manager's forward workflow (ROI #29): construct
// under the SAME mandate constraints COMP-01 enforces, propose trades a human
// approves, then materialize OMS-01 orders (OPT-01e).
//
// # Weights/returns are statistics
//
// Every weight / expected-return / risk number is a dimensionless derived
// statistic, so it is `double` — the EVT-14 rule (double for metrics, exact
// Decimal for money/prices/sizes). A trade's notional, when it lands as an
// order, is Decimal in order.v1; here the proposal carries the target weight and
// the trade direction/size as analytics.
package optimization.v1;

import "google/protobuf/timestamp.proto";

// ObjectiveType is what the optimizer maximizes/minimizes.
enum ObjectiveType {
  // Default zero value; never set explicitly.
  OBJECTIVE_TYPE_UNSPECIFIED = 0;

  // MAX_RETURN: maximize expected return μᵀw (an LP over the constraints).
  OBJECTIVE_TYPE_MAX_RETURN = 1;

  // MIN_VARIANCE: minimize portfolio variance wᵀΣw (the min-variance portfolio).
  OBJECTIVE_TYPE_MIN_VARIANCE = 2;

  // MAX_SHARPE: maximize the Sharpe ratio (μᵀw − rf)/√(wᵀΣw) (the tangency
  // portfolio).
  OBJECTIVE_TYPE_MAX_SHARPE = 3;

  // RISK_PARITY: equalize each asset's risk contribution (the equal-risk-
  // contribution portfolio) — no expected returns needed.
  OBJECTIVE_TYPE_RISK_PARITY = 4;

  // HRP: hierarchical risk parity — clustering-based allocation from the
  // covariance alone (no expected returns), robust to an ill-conditioned Σ
  // because it never inverts it. Long-only, fully-invested; does not honor
  // per-asset box bounds (mandate compliance is validated downstream).
  OBJECTIVE_TYPE_HRP = 5;
}

// ObjectiveSpec parameterizes the optimization objective.
message ObjectiveSpec {
  // objective_type selects the objective. Required.
  ObjectiveType objective_type = 1;

  // risk_aversion λ trades return against variance in a mean-variance blend
  // (maximize μᵀw − λ·wᵀΣw); used only as a refinement, 0 ⇒ the pure objective.
  double risk_aversion = 2;

  // risk_free_rate is the per-period risk-free rate for MAX_SHARPE. Optional.
  double risk_free_rate = 3;
}

// WeightBound is a per-instrument weight box constraint.
message WeightBound {
  // instrument_id the bound applies to. Required.
  string instrument_id = 1;

  // min_weight / max_weight bound this instrument's portfolio weight. A min of 0
  // with long_only is the no-short floor.
  double min_weight = 2;
  double max_weight = 3;
}

// SectorCap is a maximum aggregate weight for a sector bucket (taxonomy:code).
message SectorCap {
  // sector is the "taxonomy:code" bucket (e.g. "GICS:40"). Required.
  string sector = 1;

  // max_weight is the cap on the bucket's summed weight.
  double max_weight = 2;
}

// ConstraintSet is the feasible region the optimizer is restricted to — the
// optimization mirror of a COMP-01 mandate (OPT-01c derives these from the
// mandate so a book you can't hold, you can't optimize into).
message ConstraintSet {
  // long_only forbids negative weights (no shorting). The common default.
  bool long_only = 1;

  // min_weight / max_weight are the global per-instrument bounds applied when no
  // per-instrument WeightBound overrides them.
  double min_weight = 2;
  double max_weight = 3;

  // bounds are per-instrument overrides of the global bounds.
  repeated WeightBound bounds = 4;

  // sector_caps cap aggregate sector weights.
  repeated SectorCap sector_caps = 5;

  // max_turnover caps the one-way turnover (Σ|target − current|/2) of a
  // rebalance. 0 ⇒ unconstrained.
  double max_turnover = 6;
}

// TargetWeight is one instrument's optimized target weight.
message TargetWeight {
  string instrument_id = 1;
  double weight = 2;
}

// TradeSide is the direction of a proposed trade.
enum TradeSide {
  TRADE_SIDE_UNSPECIFIED = 0;
  TRADE_SIDE_BUY = 1;
  TRADE_SIDE_SELL = 2;
}

// MandateStatus is the outcome of the COMP-01 mandate check on a proposal, in
// THREE states because two cannot hold the answer (#646, #675).
//
// This field was `bool mandate_feasible`, and a bool cannot tell "no mandate was
// ever consulted" from "consulted, and it passed". It defaulted to the second.
// In the Go implementation that meant Rebalance stamped every proposal it built
// as feasible, no caller on the service's route ever ran CheckMandate, and the
// bridge turning a proposal into live order commands used that stamp as its only
// gate. The check had never once executed, and every proposal was certified
// compliant by its own constructor.
//
// Go was repaired in #646 with a tri-state whose zero value is MandateUnchecked.
// The WIRE kept the boolean, so the trap survived where the Go type could not
// protect anyone — and the first consumer to adopt this message would inherit
// it, plausibly a non-Go one with no tri-state to fall back on. That is why this
// landed with zero consumers rather than waiting for one: it costs a
// regeneration now and a migration later.
//
// THE ZERO VALUE IS THE POINT. proto3 cannot distinguish an unset enum from one
// explicitly set to 0, which is precisely the property wanted here: a proposal
// that nobody evaluated and a proposal whose verdict was never transmitted are
// the same fact, and neither may read as a pass.
enum MandateStatus {
  // Nothing has evaluated this proposal against a mandate.
  //
  // NOT A SOFT PASS, and not merely "the sender omitted it": it is the state
  // every proposal starts in, and it must never become order commands. Named
  // _UNSPECIFIED to satisfy the STANDARD lint rule every other enum here
  // follows; it means UNCHECKED, and the Go tri-state it mirrors says so.
  MANDATE_STATUS_UNSPECIFIED = 0;

  // The mandate check ran against a real mandate and found no BREACH. The ONLY
  // state that may be materialized into orders.
  MANDATE_STATUS_FEASIBLE = 1;

  // The mandate check ran and found at least one BREACH; violations carries the
  // reasons. The proposal is still returned so the PM sees why, never silently
  // dropped.
  MANDATE_STATUS_INFEASIBLE = 2;
}

// ProposedTrade is one leg of the rebalance trade list — the weight change
// translated to a direction and size. It is materialized into an
// order.v1.SubmitOrder by the OPT-01e bridge; kept schema-independent of
// order.v1 (the proposal is pre-order, human-in-the-loop).
message ProposedTrade {
  // instrument_id the trade is in. Required.
  string instrument_id = 1;

  // side is buy or sell. Required.
  TradeSide side = 2;

  // current_weight / target_weight are the before/after portfolio weights.
  double current_weight = 3;
  double target_weight = 4;

  // quantity is the number of units to trade (sign-free; side carries the
  // direction). Derived from the weight change × NAV / price.
  double quantity = 5;

  // notional is the trade's approximate cash value (|target − current| × NAV).
  double notional = 6;
}

// RebalanceProposal is the optimizer's output: the target weights and the
// minimal trade list to reach them, PROPOSED for human approval (the AUTO-01
// conservative stance — never auto-executed). Approval materializes OMS-01
// orders (OPT-01e).
message RebalanceProposal {
  // portfolio_id the proposal is for. Required.
  string portfolio_id = 1;

  // objective is the objective that produced it.
  ObjectiveSpec objective = 2;

  // targets are the optimized target weights.
  repeated TargetWeight targets = 3;

  // trades are the minimal trade list (instruments whose weight changed beyond
  // the rebalance threshold).
  repeated ProposedTrade trades = 4;

  // expected_return / expected_risk are the proposal's ex-ante μᵀw and
  // √(wᵀΣw). turnover is the one-way turnover.
  double expected_return = 5;
  double expected_risk = 6;
  double turnover = 7;

  // as_of is the knowledge horizon the inputs (covariance, prices, holdings)
  // were read at. Required.
  google.protobuf.Timestamp as_of = 8;

  // mandate_status is the COMP-01 mandate verdict (OPT-01c). INFEASIBLE ⇒
  // violations carries the breached rules. See MandateStatus for why this is
  // three states and not the bool it replaced (#675).
  MandateStatus mandate_status = 11;
  repeated string violations = 10;

  // 9 was `bool mandate_feasible`. RESERVED RATHER THAN REUSED FOR THE ENUM:
  // the two encode differently on the wire (varint 1 vs varint 1 is a
  // coincidence, but `true` and FEASIBLE agreeing is exactly what would make a
  // mistake here invisible), and reusing the number would let a message written
  // by an old producer decode as a NEW verdict rather than fail. Number and
  // name are both reserved so neither can return.
  reserved 9;
  reserved "mandate_feasible";
}

// ProposalMaterialized is the FACT that a rebalance proposal became order
// commands (#409).
//
// IT EXISTS BECAUSE THE PLATFORM CAN NOW DO THIS WITHOUT A PERSON. The default
// posture is that the optimizer proposes and a human approves; with
// OPTIMIZATION_AUTO_PUBLISH the approval step becomes the act of setting a
// configuration flag, and the caller who triggered the materialization is the
// only human in the loop. That is a capital action taken on the platform's own
// recommendation, and an automated capital action that leaves no record of who
// authorized it is not auditable.
//
// ONE FACT PER MATERIALIZATION, not one per order. The orders themselves are
// COMMANDS on order.order.submit and each carries its own issuer; this records
// the DECISION that produced them — which proposal, which principal, what was
// admitted and what was refused — so the set can be reconstructed even if a
// command is later rejected downstream.
//
// It is emitted whether or not anything was published. A materialization that
// produced zero orders, or whose every order the gate refused, is a fact about
// the portfolio worth keeping: it is the difference between "nobody asked" and
// "we asked and nothing was tradeable".
message ProposalMaterialized {
  // portfolio_id the proposal was built for. Required.
  string portfolio_id = 1;

  // issuer is the AUTHENTICATED principal that triggered this, taken from the
  // api-gateway's injected identity and never from a request body — the
  // AUTH-01c forged-issuer stance. It is the same value stamped on every emitted
  // command's CommandMetadata.issuer.
  string issuer = 2;

  // published is whether the orders actually reached the bus. FALSE is the
  // default deployment posture (a dry run: the commands were built and returned
  // to the caller, and nothing was sent), and recording it is the point — a
  // reader must be able to tell a dry run from a live one without consulting the
  // deployment's environment.
  bool published = 3;

  // submitted_order_ids are the commands that were emitted, in order. Ids are
  // deterministic per (portfolio, instrument), so a re-materialization of the
  // same proposal repeats them and the OMS dedups.
  repeated string submitted_order_ids = 4;

  // rejected are the orders the pre-trade gate refused, with the reason it gave.
  // An empty list when submitted_order_ids is also empty means the proposal
  // produced no trades at all — not that everything succeeded.
  repeated RejectedOrder rejected = 5;

  // as_of is when the materialization happened. Required.
  google.protobuf.Timestamp as_of = 6;

  // proposal_as_of is the knowledge horizon the PROPOSAL's inputs were read at —
  // RebalanceProposal.as_of, carried through (#970).
  //
  // IT IS NOT as_of ABOVE, AND THE PAIR IS THE POINT. as_of is when this
  // materialization happened; this is when the book it was computed against was
  // read. The gap between them is the drift the decision was exposed to, and
  // until #970 it was unrecoverable: the FACT stamped only the materialization
  // instant, so an auditor asking "how stale was the book this rebalance was
  // built on" had no answer on the record and no way to reconstruct one.
  //
  // A materialization refused for staleness carries it too, which is what makes
  // the refusal reviewable rather than merely logged.
  google.protobuf.Timestamp proposal_as_of = 7;
}

// RejectedOrder is one command the pre-trade gate refused.
message RejectedOrder {
  string order_id = 1;
  string instrument_id = 2;
  // reason is the gate's own words. It distinguishes a rule breach from
  // "nothing was evaluated" (ungoverned, unpriced, unvaluable, unscoped), which
  // the gate reports under their own codes precisely so the two are not
  // conflated.
  string reason = 3;
}

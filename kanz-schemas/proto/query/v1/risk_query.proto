syntax = "proto3";

// Risk query service — the external READ surface over the risk engine
// (API-01a). It is the proto mirror of kanz/internal/risk/api/v1.Engine:
// query + scenario + health ONLY, with no Apply/Mutate/Command method.
// State changes are event-driven (the KANZ_BRAIN anti-decision "all state
// changes must be event-driven"); callers needing risk-output notifications
// subscribe to the bus, not this service.
//
// # Consumers
//
// The risk-engine implements the server, reading from durable state
// (API-01b, PERS-01). The api-gateway BFF (API-01c) is the only governed
// client: it forwards over mTLS (SEC-01b) and transcodes REST. No other
// service should dial this directly.
//
// # Reuse, not redefinition
//
// Responses carry the SAME domain payloads the bus publishes —
// domain.v1.ExposureSet (exposure.proto) and domain.v1.RiskMeasureSet
// (measure.proto) — so a value read over this RPC is byte-identical to the
// same value seen as a FACT on the bus. Only the request envelopes, the
// scenario shock taxonomy, and the query-trust signals are new here.
//
// # Versioning
//
// query.v1, additive-only within the version under the same discipline as
// the api/v1 Go surface and envelope-policy §1 — a removed/retyped field or
// RPC breaks every client and requires a sibling query/v2.
package query.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "common/v1/decimal.proto";
import "common/v1/log_position.proto";
import "domain/v1/exposure.proto";
import "domain/v1/measure.proto";

// RiskQueryService is the gRPC read surface. RPC names match the Engine
// interface methods (Exposure/Measures/EvaluateScenario/Health) so the
// API-01b server is a thin adapter over the in-process engine.
service RiskQueryService {
  // Exposure returns the latest computed exposure aggregate for a
  // portfolio. NOT_FOUND when the portfolio is unknown to the engine.
  rpc Exposure(ExposureRequest) returns (ExposureResponse);

  // Measures returns the latest computed risk measures. The
  // MeasuresRequest.measures filter narrows the set; empty ⇒ all.
  rpc Measures(MeasuresRequest) returns (MeasuresResponse);

  // EvaluateScenario applies the request's shocks to a transient copy of
  // the current state and returns the projected measures. State is never
  // mutated — a scenario is a pure function of (state, shocks).
  rpc EvaluateScenario(EvaluateScenarioRequest) returns (EvaluateScenarioResponse);

  // Health reports the engine's mode + staleness so a caller that cannot
  // tolerate degraded data branches before reading the query methods.
  rpc Health(HealthRequest) returns (HealthResponse);

  // ListPortfolios names the portfolios this engine can answer for.
  //
  // IT IS NOT A PORTFOLIO DIRECTORY, AND THE DIFFERENCE MATTERS TO ANYONE
  // BUILDING ON IT. The engine's store holds the portfolios it has folded state
  // for; a portfolio the fund has opened but that no event has reached yet is
  // absent. That is the honest scope for a read surface whose every other RPC
  // answers "what is this portfolio's risk" — you can only pick something the
  // engine can then answer about. A caller wanting the fund's book of record is
  // asking a different service a different question.
  rpc ListPortfolios(ListPortfoliosRequest) returns (ListPortfoliosResponse);
}

// Mode is the engine's operational mode (mirrors api/v1.Mode).
enum Mode {
  MODE_UNSPECIFIED = 0;
  // NORMAL: ingestion is current; measures come from the latest state.
  MODE_NORMAL = 1;
  // DEGRADED: serving cached / last-known values because ingestion stalled
  // or a dependency is unavailable. Responses still come back — callers
  // must check the mode / quality flags before acting.
  MODE_DEGRADED = 2;
}

// QualityFlag annotates a response with trust signals (mirrors
// api/v1.QualityFlag). Distinct from envelope.v1.QualityFlag, which carries
// event-stream concerns (REPLAYED/LATE); these are query-result concerns.
enum QualityFlag {
  QUALITY_FLAG_UNSPECIFIED = 0;
  // DEGRADED: the engine was in MODE_DEGRADED when the response was
  // computed; the values are cached / last-known.
  QUALITY_FLAG_DEGRADED = 1;
  // STALE: the data is older than the request's as_of budget, though the
  // engine itself is not degraded.
  QUALITY_FLAG_STALE = 2;

  // CURRENCY_EXCLUDED: the response was computed over a SUBSET of the
  // portfolio. The risk engine has no FX layer (RISK-06), so positions whose
  // market value is not denominated in the portfolio's base currency are left
  // out of every base-currency measure. A concentration or exposure limit
  // checked against such a number can pass when the full book would breach, so
  // a gate that must not under-report MUST refuse to act on a response
  // carrying this flag rather than treat it as a number.
  //
  // This comment used to say the measures were "understated — never
  // overstated". That was true of the four sum-of-market-value measures it was
  // written for and is false of the rest: a ratio (HHI, the duration averages)
  // moves either way when an element is dropped, and a quantile of a portfolio
  // P&L path (VaR99, ES99) goes UP when one leg of a hedged pair is excluded,
  // because the offset goes with it. Refuse to gate; do not assume a direction.
  QUALITY_FLAG_CURRENCY_EXCLUDED = 3;

  // INPUTS_UNRESOLVED: at least one measure on this response was computed over
  // positions whose pricing inputs could not be resolved — possibly over none
  // of them, in which case the value is a zero that MEASURED NOTHING rather
  // than a zero that measured a flat book. Distinct from CURRENCY_EXCLUDED,
  // which is a filter the engine applies on purpose; this one means reference
  // or market data the engine expected was absent (contract terms nobody
  // loaded, a discount curve never calibrated, an instrument outside the
  // fitted factor universe, a return series the price store does not hold).
  //
  // The affected measure is still present on the response and its value is not
  // a claim about the book. The Go surface carries the per-measure evidence
  // (which positions, and why) as api/v1 Measure.Coverage; the wire carries
  // the flag, which is the part a gate needs. Same instruction as above: a
  // caller that gates on a risk number must treat this as a refusal to answer.
  QUALITY_FLAG_INPUTS_UNRESOLVED = 4;
}

// ExposureRequest scopes an exposure query.
message ExposureRequest {
  // portfolio_id is the portfolio to query. Required; empty ⇒
  // INVALID_ARGUMENT.
  string portfolio_id = 1;

  // as_of is RESERVED AND NOT HONOURED. Unset ⇒ latest, which is the only
  // query the engine can answer; ANY OTHER VALUE IS REFUSED with
  // INVALID_ARGUMENT (#859).
  //
  // It used to read "pins the query to a point in time", and that was a
  // promise nothing kept: the field was parsed by the gateway, forwarded
  // here, and never read by the engine, which answered every query from
  // live state and stamped the response with the live timestamp. A caller
  // pinning last Tuesday got today's book, internally consistent and
  // wrong, with nothing flagged. The refusal is what makes the gap
  // visible; honouring it needs a point-in-time read of risk state that
  // does not exist yet.
  //
  // The field is RETAINED rather than reserved-in-the-proto-sense because
  // v1 is additive-only and clients already send it — a removed field
  // would be dropped silently by old clients, which is the same silence
  // one layer down.
  google.protobuf.Timestamp as_of = 2;
}

// ExposureResponse is the reply to ExposureRequest.
message ExposureResponse {
  string portfolio_id = 1;
  // as_of is the state timestamp the response was computed against. It is
  // always the LATEST applied state: the request as_of is refused rather
  // than honoured (#859), so this reports what the answer is, never what
  // the caller asked for.
  google.protobuf.Timestamp as_of = 2;
  // set is the exposure aggregate, the same payload exposure FACTs carry.
  domain.v1.ExposureSet set = 3;
  repeated QualityFlag quality_flags = 4;

  // owner_tenant is the tenant that owns the queried portfolio (WIRE-02a).
  // It is the deny-by-default authz-gate input a governed client checks the
  // caller against before returning risk state — without it a query.v1-only
  // client cannot enforce cross-tenant isolation and the gate always passes.
  // Empty ⇒ the engine has no ownership record for the portfolio, which a
  // deny-by-default gate must treat as a denial, not an allow.
  string owner_tenant = 5;

  // source_position is the durable-log coordinate the served state was folded
  // up to (WIRE-02a) — the citation seed: it lets a consumer cite the exact
  // point in the log the risk figure was derived from, and reproduce it by
  // replaying to that position. Unset ⇒ the state is not log-anchored (e.g. an
  // in-memory engine with no durable log).
  common.v1.LogPosition source_position = 6;
}

// MeasuresRequest scopes a risk-measure query.
message MeasuresRequest {
  string portfolio_id = 1;
  // as_of is RESERVED AND NOT HONOURED — see ExposureRequest.as_of. Unset ⇒
  // latest; any other value is REFUSED with INVALID_ARGUMENT (#859).
  google.protobuf.Timestamp as_of = 2;
  // measures narrows the response to a named subset (e.g. ["VaR99",
  // "Delta"]); empty ⇒ all measures the engine computes.
  repeated string measures = 3;
}

// MeasuresResponse is the reply to MeasuresRequest.
message MeasuresResponse {
  string portfolio_id = 1;
  // as_of is the latest applied state timestamp — see ExposureResponse.as_of.
  google.protobuf.Timestamp as_of = 2;
  domain.v1.RiskMeasureSet set = 3;
  repeated QualityFlag quality_flags = 4;

  // owner_tenant is the tenant that owns the queried portfolio (WIRE-02a) —
  // the authz-gate input; see ExposureResponse.owner_tenant.
  string owner_tenant = 5;

  // source_position is the durable-log coordinate the served state was folded
  // up to (WIRE-02a) — the citation seed; see ExposureResponse.source_position.
  common.v1.LogPosition source_position = 6;
}

// EvaluateScenarioRequest evaluates a what-if scenario against current state.
//
// A request names its perturbation ONE of two ways, and exactly one:
// `shocks` (the caller assembles them) or `scenario_name` (the engine resolves
// a curated catalog entry). Both set is refused, and so is neither — see the
// field docs below for why each of those is a refusal rather than a default.
message EvaluateScenarioRequest {
  string portfolio_id = 1;
  // shocks describe the hypothetical perturbations. A shock against an
  // instrument the portfolio does not hold is a silent no-op (so large
  // watchlist batches succeed regardless of holdings).
  repeated ScenarioShock shocks = 2;

  // scenario_name selects a curated stress from the engine's named catalog
  // ("GFC_2008", "COVID_2020", "DISORDERLY_TRANSITION", "HOT_HOUSE_PHYSICAL")
  // and the engine expands it into the shocks above, server-side.
  //
  // WHY THE CATALOG IS RESOLVED HERE AND NOT IN EACH CLIENT (#1004). A named
  // historical stress is an eleven-point GICS sector curve — financials −55%
  // against staples −15% in 2008 — because a crisis is not uniform. Every
  // client that "knows" GFC_2008 would carry its own copy of those eleven
  // magnitudes, and two desks stressing the same book with the same name would
  // then get different answers with nothing to say which was right. One
  // versionable definition, on the server, is the only shape in which the name
  // means something.
  //
  // An unknown name is INVALID_ARGUMENT naming the catalog, never an empty
  // shock list: a scenario the engine could not resolve must not come back as
  // the unshocked book wearing the scenario's name (#640 is that failure, one
  // layer in).
  string scenario_name = 3;
}

// EvaluateScenarioResponse carries the projected measures under the shocks.
message EvaluateScenarioResponse {
  string portfolio_id = 1;
  domain.v1.RiskMeasureSet projected = 2;
  repeated QualityFlag quality_flags = 3;

  // owner_tenant is the tenant that owns the queried portfolio (WIRE-02a) —
  // the authz-gate input; see ExposureResponse.owner_tenant.
  //
  // ADDED LATE, AND THAT IS THE POINT. Exposure and Measures have carried this
  // since WIRE-02a; the scenario reply did not, so the gate the field exists to
  // feed could not be applied uniformly. A gate written against all three routes
  // would have 404'd every scenario call, and one written only where the field
  // existed would have left POST /v1/portfolios/{id}/scenario silently ungated
  // while the route table looked fully covered — the worse of the two, because a
  // what-if projection discloses the same portfolio risk as the exposure it is
  // derived from. Moving no capital is not the same as disclosing nothing.
  //
  // Field 4 rather than 5: 4 is the next free number here. Numbers need not
  // match across messages, and renumbering the siblings would be a wire break
  // for the sake of symmetry nobody reads.
  string owner_tenant = 4;
}

// ScenarioShock is one perturbation. The oneof is the proto mirror of the
// api/v1 concrete shock types; new shock kinds are added as new oneof
// members (additive-only).
//
// THE MIRROR WAS TWO MEMBERS SHORT FOR AS LONG AS IT EXISTED, AND THAT MADE THE
// WHOLE STRESS CAPABILITY UNREACHABLE (#1004). api/v1 declared SectorShock and
// VolShock, the scenario engine applied both, the factor classifier that
// resolves a sector was wired at the risk-engine composition root, and a
// catalog of historical and climate scenarios built entirely out of sector
// curves was written and unit-tested — and none of it could be asked for,
// because the wire carried only "drop instrument X" and "drop everything".
// The richest external stress on an institutional risk platform was the
// textbook sanity check. test/arch/every_shock_kind_reaches_the_wire_test.go
// now derives the api/v1 implementor set from the AST and fails the build if a
// member here is missing again, so this cannot be a silent gap a second time.
message ScenarioShock {
  oneof shock {
    PriceShock price = 1;
    ParallelShift parallel_shift = 2;
    SectorShock sector = 3;
    VolShock vol = 4;
  }
}

// PriceShock applies a fractional price change to one instrument's market
// value (pct = -0.10 ⇒ drop 10%; coefficient -10, exponent -2).
message PriceShock {
  string instrument_id = 1;
  common.v1.Decimal pct = 2;
}

// ParallelShift applies the same fractional change to every position with a
// market value — the textbook "everything drops 5%" stress test.
message ParallelShift {
  common.v1.Decimal pct = 1;
}

// SectorShock applies a fractional price change to every position whose
// instrument classifies into one sector — taxonomy + code, e.g. {"GICS","40"}
// for financials. It mirrors api/v1.SectorShock and carries the same strings
// reference.v1.SectorClassification does.
//
// This is the shock a differentiated stress is made of: a 2008 replay is one
// SectorShock per GICS sector, so financials fall further than staples. A
// ParallelShift cannot express that dispersion, and a stress that cannot
// express dispersion tells a PM nothing they did not already know from gross
// exposure.
//
// Sector membership is resolved SERVER-SIDE at apply time against the factor
// model the engine is wired with, never supplied by the caller. A position the
// engine cannot classify is not silently left unshocked: it is recorded in the
// response's input coverage and the whole request is refused with
// FAILED_PRECONDITION, because a shock that did not land makes the projection
// a lie (#640).
message SectorShock {
  // taxonomy is the classification scheme, e.g. "GICS". Empty taxonomy or code
  // is a malformed shock and refuses the request — it is not "shock nothing".
  string taxonomy = 1;
  string code = 2;
  common.v1.Decimal pct = 3;
}

// VolShock bumps implied volatility by an ABSOLUTE amount (abs_bump = 0.05 ⇒
// +5 vol points), the vega leg of an option-book stress.
//
// It only moves numbers under full revaluation, where option positions are
// repriced; on the linear market-value path it is a recognized no-op rather
// than an unknown shock, so a caller pairing it with a price move gets the
// price move applied and no silent rejection.
message VolShock {
  common.v1.Decimal abs_bump = 1;
  // underlying_id scopes the bump to one underlying; empty applies it to every
  // underlying — the "vol up 5 points across the book" stress.
  string underlying_id = 2;
}

// HealthRequest takes no arguments; the engine reports its global state.
message HealthRequest {}

// HealthResponse reports the engine's operational state.
message HealthResponse {
  Mode mode = 1;
  // as_of is the latest applied state-event time across all aggregates.
  google.protobuf.Timestamp as_of = 2;
  // staleness is the gap between as_of and the engine's wall clock when
  // sampled. Callers compare it against their own freshness budget.
  google.protobuf.Duration staleness = 3;
}

// ListPortfoliosRequest is empty: the engine serves exactly one tenant
// (MT-01d), so there is nothing for a caller to select by. A tenant field here
// would be a caller-supplied identity — the one thing a tenant boundary must
// never be.
message ListPortfoliosRequest {}

// ListPortfoliosResponse is the reply to ListPortfoliosRequest.
message ListPortfoliosResponse {
  repeated PortfolioSummary portfolios = 1;

  // owner_tenant is the tenant that owns every portfolio listed (WIRE-02a) —
  // the same deny-by-default authz-gate input the per-portfolio replies carry,
  // and it is on THIS message for the same reason.
  //
  // A LIST INVERTS THE GATE WITHOUT WEAKENING IT. The per-id replies let a
  // governed client check one portfolio's owner against the caller; here every
  // element shares one owner because the engine is single-tenant, so the field
  // gates the whole reply at once. Empty ⇒ the engine has no ownership record,
  // which a deny-by-default gate must treat as a denial, not an allow — an
  // ungated list is a worse disclosure than an ungated read, because it names
  // portfolios the caller could not otherwise have guessed.
  string owner_tenant = 2;
}

// PortfolioSummary is one row of the list: enough to choose a portfolio, and
// deliberately no more.
//
// NO MONEY HERE, ON PURPOSE. cash_balance and total_market_value are held on
// the aggregate and are exactly what an exposure read returns; putting them on
// a list means every caller who wanted a picker also receives the fund's
// valuations, and a screen that only needed names starts carrying figures it
// must then be careful with. Ask for the portfolio you chose.
message PortfolioSummary {
  string portfolio_id = 1;
  string display_name = 2;
  string base_currency = 3;

  // as_of is the state timestamp this portfolio was last folded to. It is the
  // staleness signal a picker needs: a portfolio last updated days ago is a
  // different proposition from one updated seconds ago, and the list is where
  // that is visible without opening each one.
  google.protobuf.Timestamp as_of = 4;

  uint32 position_count = 5;
}

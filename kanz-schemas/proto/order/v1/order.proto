syntax = "proto3";

// Package order.v1 defines the order/execution domain — the platform's first
// first-class COMMAND flow (see kanz-schemas/README.md § Event Class Rules §2
// and the command.v1 generic layer). It owns two halves:
//
//   - this file: the concrete order COMMANDS (submit/amend/cancel), each
//     embedding command.v1.CommandMetadata as field 1 per the command-class
//     contract;
//   - order_events.proto: the order-aggregate lifecycle FACTs and the Fill
//     records they carry.
//
// The order aggregate identity is order_id; it is the metadata.target_id of
// every command and the envelope partition_key, so all commands and lifecycle
// FACTs for one order are totally ordered. CODEOWNERS: @eighred/execution.
//
// proto3 cannot enforce field presence; the "Required" notes are invariants the
// bus client library and the OMS command handlers enforce on publish.
package order.v1;

import "google/protobuf/timestamp.proto";
import "common/v1/decimal.proto";
import "command/v1/command.proto";

// SubmitOrder requests a new order be admitted and worked. Its outcome is a
// command.v1.CommandOutcome (ACCEPTED on admission; REJECTED on validation,
// authority, or compliance failure) plus the correlation-linked lifecycle FACTs
// the working order produces (OrderAccepted, then routing/fills).
message SubmitOrder {
  // metadata is the command-common envelope. metadata.target_id MUST equal
  // order_id. Required.
  command.v1.CommandMetadata metadata = 1;

  // order_id is the client-assigned, idempotent identity of the new order — the
  // aggregate id. A re-submission with the same order_id is the envelope
  // idempotency-key dedup case, not a second order. Required.
  string order_id = 2;

  // portfolio_id is the portfolio the order trades for — the account whose
  // positions a fill will move and whose mandate pre-trade compliance checks.
  // Required.
  string portfolio_id = 3;

  // instrument_id is the canonical Kanz instrument identifier to trade.
  // Required.
  string instrument_id = 4;

  // side is buy or sell. Required; must not be SIDE_UNSPECIFIED.
  Side side = 5;

  // quantity is the order size in the instrument's natural units, strictly
  // positive (direction is carried by side, not the sign). Required.
  common.v1.Decimal quantity = 6;

  // order_type selects how the order is priced/triggered. Required; must not be
  // ORDER_TYPE_UNSPECIFIED.
  OrderType order_type = 7;

  // limit_price is the worst acceptable price. Required for ORDER_TYPE_LIMIT and
  // ORDER_TYPE_STOP_LIMIT; ignored otherwise.
  common.v1.Decimal limit_price = 8;

  // stop_price is the trigger price that activates the order. Required for
  // ORDER_TYPE_STOP and ORDER_TYPE_STOP_LIMIT; ignored otherwise.
  common.v1.Decimal stop_price = 9;

  // time_in_force governs how long the order rests. Required; must not be
  // TIME_IN_FORCE_UNSPECIFIED.
  TimeInForce time_in_force = 10;

  // expire_at is the expiry instant for TIME_IN_FORCE_GTD. Required when
  // time_in_force is GTD; ignored otherwise.
  google.protobuf.Timestamp expire_at = 11;

  // venue is the target execution venue's ISO 10383 MIC (e.g. "BINANCE",
  // "OKX"). The multi-venue allocation matrix stamps it on each fanned-out
  // order so the router sends it to that specific venue implementation. Empty ⇒
  // the router falls back to its smart-order-routing default (best single
  // venue). Optional.
  string venue = 12;

  // execution_schedule asks for this order to be WORKED OVER TIME rather than
  // sent to a venue whole (#435). Optional; unset ⇒ the order is sent whole,
  // which is what every order on this platform did before it existed.
  //
  // WHEN SET, THE ORDER ITSELF NEVER REACHES A VENUE. It is admitted, checked
  // for entitlement and compliance exactly as any other order, and then RESTS at
  // ORDER_STATUS_WORKING_SCHEDULED while child orders derived from it are
  // submitted on the schedule. The parent is a container for the decision; the
  // children are what trade.
  ExecutionSchedule execution_schedule = 13;

  // parent_order_id names the working parent this order is a slice of (#435).
  // Optional; unset ⇒ an ordinary order somebody asked for directly.
  //
  // SET ONLY BY THE PLATFORM, NEVER BY A CLIENT. It is on the command because
  // children are admitted through the ordinary command path — one admission
  // implementation, not a second one for slices — and the child has to carry the
  // relation in the same message that creates it. A client that sets it is
  // claiming its order is a slice of somebody else's, which admission refuses.
  //
  // The child's own order_id is DERIVED from this and its slice index, so the
  // slice number is recoverable from the id and is deliberately not a second
  // field that could disagree with it.
  string parent_order_id = 14;

  // leverage is the requested multiple; 1 (or absent) is unlevered spot (#417).
  //
  // WHY THIS FIELD EXISTS AT ALL, since the platform still places only spot
  // orders. Before it, a strategy asking for 10x had its leverage parsed,
  // bounds-checked and written onto the StrategySignal FACT — the immutable
  // audit root — and then DROPPED, because SubmitOrder had nowhere to put it.
  // The fund's audit trail permanently asserted a 10x position against an
  // unlevered spot order the venue actually held. That is #240, and the estate's
  // answer until now was internal/signal/translate refusing leverage outright:
  // correct, and a hardcode that could only ever say no.
  //
  // Carrying it converts that into a CONTRACT. The adapter declares which margin
  // modes it can express (venue.v1 supported_margin_modes), the OMS refuses at
  // admission what no adapter can place, and the refusal names the venue and the
  // mode instead of naming a missing schema field. Nothing here makes a levered
  // order placeable — both connectors are spot-only and say so — but the term
  // now survives from the signal to the state, so the audit root and the venue
  // instruction can no longer disagree.
  //
  // Decimal, never a double: it is a multiplier on capital at risk.
  common.v1.Decimal leverage = 15;

  // margin_mode is the collateral regime this order is worked under. Absent ⇒
  // MARGIN_MODE_UNSPECIFIED ⇒ spot, which is what every caller predating this
  // field already meant.
  MarginMode margin_mode = 16;
}

// ExecutionAlgo names the algorithm that turns a parent order into a schedule of
// child orders (#435).
enum ExecutionAlgo {
  // Default zero value; never set explicitly. An ExecutionSchedule carrying it
  // is REFUSED at admission rather than defaulted to any algorithm: "work this
  // order somehow" is not an instruction anybody can be held to, and picking one
  // silently would put a schedule nobody chose in front of a venue.
  EXECUTION_ALGO_UNSPECIFIED = 0;

  // Time-weighted average price: equal quantity at equal intervals across the
  // window, indifferent to volume and to price.
  //
  // IT IS FIRST BECAUSE IT IS PROVABLE. TWAP's expected output is a closed-form
  // value — N equal slices at N equal times — so the platform can assert exactly
  // what it will do before it does it. Every other algorithm's output is a
  // distribution, and a distribution cannot be asserted against a venue that
  // does not exist yet.
  EXECUTION_ALGO_TWAP = 1;

  // Volume-weighted average price: the parent is divided across the window in
  // proportion to the volume expected to trade in each slice's own interval, so
  // it is large when the market is and small when it is not (#869).
  //
  // IT REFUSES ON AN UNKNOWN VOLUME PROFILE RATHER THAN DEGRADING TO TWAP, and
  // that is the property this value promises. A flat curve is not a neutral
  // default: a flat curve IS TWAP, so a VWAP order scheduled against one is a
  // TWAP order wearing this name, and the execution attribution would decompose
  // the shortfall of an algorithm that never ran.
  EXECUTION_ALGO_VWAP = 2;

  // Percent of volume: the same proportional allocation, under a HARD
  // participation cap that the schedule may never exceed (#869).
  //
  // THE CAP IS REQUIRED. A schedule naming this algorithm without
  // max_participation_rate is REFUSED, because an uncapped POV is not a
  // conservative POV — it is VWAP with a different label. What the cap bounds is
  // self-signalling on a thin instrument, where a perfectly small child is still
  // the whole print and max_slice_quantity cannot see it.
  EXECUTION_ALGO_POV = 3;
}

// ExecutionSchedule is HOW a parent order is worked (#435).
//
// EVERY FIELD HERE IS AN INPUT TO A PURE FUNCTION, and that is the design rather
// than an accident. The schedule is never stored: it is recomputed from these
// fields — which the order already persists — every time anything needs it. So a
// pod that has just booted derives byte-identical children to the pod it
// replaced, and there is no schedule state to be lost in between.
//
// The alternative, a stored schedule with a cursor, is the failure this shape
// exists to avoid: a counter that must be advanced in the same breath as a venue
// message. Advance it first and a crash loses a child; advance it second and a
// crash duplicates one. Nothing can do both atomically, so nothing here counts.
message ExecutionSchedule {
  // algo selects the algorithm. Required; must not be
  // EXECUTION_ALGO_UNSPECIFIED.
  ExecutionAlgo algo = 1;

  // window_start and window_end bound the period the order is worked over. Both
  // required; window_end MUST be strictly after window_start.
  //
  // A ZERO-LENGTH WINDOW IS REFUSED, NOT READ AS "SEND IT ALL NOW". The two are
  // opposite instructions, and defaulting to the second is how an order that
  // somebody asked to be worked carefully goes to a venue in one message.
  google.protobuf.Timestamp window_start = 2;
  google.protobuf.Timestamp window_end = 3;

  // slice_count is how many child orders the parent is worked as. Required;
  // strictly positive.
  //
  // The children divide the parent's quantity EXACTLY — as rationals, not as
  // rounded decimals — so they sum to the parent with no remainder. A schedule
  // that loses a remainder leaves a parent resting part-filled forever, with no
  // child left to send and nothing raising an error.
  uint32 slice_count = 4;

  // max_slice_quantity caps any single child. Optional; unset ⇒ uncapped.
  //
  // IT IS A SIZE, NOT A FRACTION OF VOLUME, and the distinction is deliberate. A
  // true participation cap is a fraction of the volume that trades WHILE the
  // order works, which is not knowable when the schedule is computed — it is
  // knowable per bar, at send time, and that is a different algorithm. What this
  // bounds is the largest single message the platform will put in front of a
  // venue.
  //
  // A schedule whose slices would exceed it is REFUSED WHOLE at admission,
  // naming the slice count that would honour it. Trimming each child would leave
  // the remainder unworked; raising the slice count silently would run a
  // schedule nobody chose, at a message rate the operator never sized for.
  common.v1.Decimal max_slice_quantity = 5;

  // max_participation_rate is the largest fraction of the volume expected to
  // trade in a slice's interval that any child may be. Required by
  // EXECUTION_ALGO_POV; ignored by every other algorithm (#869).
  //
  // A FRACTION IN (0, 1], WHERE max_slice_quantity IS A SIZE, and the two bound
  // different things. A size cap bounds the largest single message the platform
  // puts in front of a venue; this bounds how much of the tape that message IS.
  // A cap of 0 permits no child at all and a cap above 1 permits more than
  // everything that trades — both are spellings of "no cap" that read as a
  // configured control, so both are REFUSED rather than clamped.
  //
  // A parent the forecast says cannot be worked inside its cap is refused WHOLE
  // at admission, naming the largest parent that window and that cap could have
  // worked. Trimming the children would leave the remainder unworked; exceeding
  // the cap on one slice is the single outcome a participation limit exists to
  // prevent.
  //
  // WHAT IT IS BOUND AGAINST IS A FORECAST, stated so the control is not
  // overread: the cap binds against the volume profile's expectation, not
  // against the tape as it actually prints. A realised-volume control is a
  // send-time decision beside the driver, which is a different thing from a
  // schedule derived from the order.
  common.v1.Decimal max_participation_rate = 6;
}

// AmendOrder requests a change to a resting order's quantity and/or limit
// price. Only the set fields change; an amend that would reduce quantity below
// the already-filled amount is REJECTED.
//
// IT CHANGES THE PLATFORM'S RECORD AND NOTHING ELSE. No adapter in this module
// sends an amend or replace to any exchange — venue.v1.VenueAdapterService has
// no such RPC, and neither connector wires one — so an order a venue is already
// working CANNOT be amended: the OMS refuses it with VENUE_CANNOT_AMEND rather
// than rewriting terms the exchange will never hear (#740).
//
// This comment used to say the opposite ("an amend resets the order's working
// priority at the venue"). It was read as a promise the code never made, and
// the gap it described is the whole reason the refusal exists: a down-amend the
// venue never receives fills the ORIGINAL quantity, and the platform books the
// amended one. Amending is therefore available only BEFORE the order is routed.
message AmendOrder {
  // metadata.target_id MUST equal order_id. Required.
  command.v1.CommandMetadata metadata = 1;

  // order_id identifies the resting order to amend. Required.
  string order_id = 2;

  // new_quantity, when set, replaces the order quantity. Must be strictly
  // positive and not below filled_quantity. Optional.
  common.v1.Decimal new_quantity = 3;

  // new_limit_price, when set, replaces the limit price. Valid only for a
  // priced (LIMIT/STOP_LIMIT) order. Optional.
  common.v1.Decimal new_limit_price = 4;
}

// CancelOrder requests a resting order be withdrawn. A cancel races the venue:
// it may land after a final fill, in which case the outcome is REJECTED
// (too-late) and the order is already terminal.
message CancelOrder {
  // metadata.target_id MUST equal order_id. Required.
  command.v1.CommandMetadata metadata = 1;

  // order_id identifies the order to cancel. Required.
  string order_id = 2;
}

// ApproveOrder gives the SECOND SIGNATURE on an order the OMS is holding
// (#539, #410 act three).
//
// An order at or above OMS_DUAL_CONTROL_MIN_NOTIONAL with the control armed is
// written to order_proposals and NOT admitted. It becomes a live order the
// moment a DIFFERENT authenticated subject approves it — under the SAME
// order_id, with the ORDER_ACCEPTED that follows. This is that command.
//
// # Why a command and not an RPC on OrderQueryService
//
// Approving CAUSES A SUBMISSION. order_query.proto says it plainly: a gRPC
// surface that could cause one would be "a second door into the capital path
// with none of the admission gate, the compliance gate or the outbox behind
// it". So the approval arrives on the bus beside submit, amend and cancel, and
// re-enters the one admission path every order comes into existence through.
//
// # Why it is NOT a field on SubmitOrder
//
// The approval is a different command with its own metadata, and necessarily a
// different issuer — the approver is by definition not the proposer. The order
// digest deliberately excludes metadata for exactly this reason: hashing it
// would make EVERY approval fail as a payload change.
message ApproveOrder {
  // metadata is the command-common envelope. metadata.target_id MUST equal
  // order_id. Required.
  //
  // ITS ISSUER IS THE APPROVER, bound by the api-gateway from the
  // authenticated principal and never self-asserted — the forged-actor defect
  // #444 fixed on the override path arrived by exactly that route. Dual
  // control over a forgeable identity is theatre: one person would propose as
  // alice and approve as bob without ever holding a second credential.
  command.v1.CommandMetadata metadata = 1;

  // order_id identifies the held order this approval releases. Required.
  string order_id = 2;

  // digest is the value this signature COVERS — approval.Terms.Digest over the
  // proposed command, carried on OrderPendingApproval and re-derived by the
  // approver's client rather than trusted from it.
  //
  // IT IS REQUIRED, AND SENDING IT IS WHAT MAKES THE SIGNATURE MEAN SOMETHING.
  // An approval naming only an order_id lets the payload change after the
  // second signature: propose a defensible order, collect the approval, apply a
  // different one. The OMS re-derives the digest from the command it stored and
  // refuses a mismatch, so the approver signs the VALUE and not merely the
  // request.
  string digest = 3;
}

// Side is the direction of an order or fill.
enum Side {
  // Default zero value; never set explicitly.
  SIDE_UNSPECIFIED = 0;

  // Buy / long.
  SIDE_BUY = 1;

  // Sell / short.
  SIDE_SELL = 2;
}

// MarginMode is the collateral regime an order is worked under (#417).
//
// THERE IS A SECOND MarginMode IN signal.v1, AND THAT IS DELIBERATE. This one
// is what the VENUE IS INSTRUCTED to do; that one is what a STRATEGY ASKED FOR,
// recorded on StrategySignal — an immutable audit FACT. They are the two ends of
// internal/signal/translate, which is where the mapping is written down and
// reviewed, and it is the same shape SignalAction and Side already have:
// SignalAction carries CLOSE, which is not an order side at all but a position
// instruction that resolves against the book. A signal vocabulary and an
// execution vocabulary are not the same vocabulary, even where today their
// values coincide.
//
// Retyping signal.v1's field to point here was tried and rejected. It is
// wire-identical (both encode as the same varints) but it edits the schema of an
// immutable audit root to save a mapping function, and it forces two `buf
// breaking` exemptions — ENUM_NO_DELETE and FIELD_SAME_TYPE — onto a FACT.
//
// What keeps the two honest is a guard, not this paragraph: test/arch's
// TestTheTwoMarginModeVocabulariesAgree fails if one gains a regime the other
// cannot express, so drift is a build failure rather than an order placed under
// a regime the audit root cannot name.
//
// THE ZERO VALUE IS SPOT, and that is load-bearing rather than incidental. An
// order that says nothing about margin is unlevered, which is the conservative
// reading and the one every existing caller already means — so adding this
// field changes the meaning of no message that predates it.
enum MarginMode {
  // Spot / no leverage. The zero value, and what an absent field means.
  MARGIN_MODE_UNSPECIFIED = 0;

  // Cross-margin: collateral is shared across the account's positions.
  MARGIN_MODE_CROSS = 1;

  // Isolated-margin: collateral is committed per position.
  MARGIN_MODE_ISOLATED = 2;
}

// OrderType selects how an order is priced and triggered.
enum OrderType {
  // Default zero value; never set explicitly.
  ORDER_TYPE_UNSPECIFIED = 0;

  // Execute immediately at the best available price; no price protection.
  ORDER_TYPE_MARKET = 1;

  // Execute at limit_price or better; rests until filled, cancelled, or
  // expired.
  ORDER_TYPE_LIMIT = 2;

  // Becomes a market order once stop_price trades.
  ORDER_TYPE_STOP = 3;

  // Becomes a limit order (at limit_price) once stop_price trades.
  ORDER_TYPE_STOP_LIMIT = 4;
}

// TimeInForce governs how long an order rests before it is cancelled or
// expired by the venue.
enum TimeInForce {
  // Default zero value; never set explicitly.
  TIME_IN_FORCE_UNSPECIFIED = 0;

  // Day: expires at the end of the trading session.
  TIME_IN_FORCE_DAY = 1;

  // Good-til-cancelled: rests until explicitly cancelled.
  TIME_IN_FORCE_GTC = 2;

  // Immediate-or-cancel: fill what is available now, cancel the remainder.
  TIME_IN_FORCE_IOC = 3;

  // Fill-or-kill: fill the entire quantity immediately or cancel the whole
  // order.
  TIME_IN_FORCE_FOK = 4;

  // Good-til-date: rests until expire_at, then expires.
  TIME_IN_FORCE_GTD = 5;
}

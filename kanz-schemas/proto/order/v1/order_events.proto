syntax = "proto3";

// Package order.v1 (events half) defines the order-aggregate lifecycle FACTs
// and the Fill records they carry — the observable effects of the order
// COMMANDS in order.proto.
//
// These are FACTs (event-class-rules.md §1): per-aggregate ordering (partition
// by order_id) is a correctness requirement, and each is self-contained —
// order_id and the resulting OrderState travel with it. The command that
// produced a FACT is followed via the envelope causation_id (set to the
// command's event_id); the order's full disposition is always carried as the
// embedded OrderState snapshot so a consumer never has to re-derive it.
package order.v1;

import "google/protobuf/timestamp.proto";
import "common/v1/decimal.proto";
import "common/v1/money.proto";
import "order/v1/order.proto";

// OrderStatus is the lifecycle state of an order aggregate. It moves
// monotonically toward a terminal state (FILLED/CANCELLED/REJECTED/EXPIRED);
// PARTIALLY_FILLED may repeat as fills arrive, and WORKING_SCHEDULED persists
// for as long as a parent order is being worked as a schedule.
enum OrderStatus {
  // Default zero value; never set explicitly.
  ORDER_STATUS_UNSPECIFIED = 0;

  // Admitted and validated, not yet working at a venue.
  ORDER_STATUS_PENDING_NEW = 1;

  // Working at an execution venue, unfilled.
  ORDER_STATUS_ROUTED = 2;

  // Working, with one or more fills but quantity remaining.
  ORDER_STATUS_PARTIALLY_FILLED = 3;

  // Terminal: fully filled.
  ORDER_STATUS_FILLED = 4;

  // Terminal: cancelled before fully filling.
  ORDER_STATUS_CANCELLED = 5;

  // Terminal: refused before any effect (validation, authority, compliance).
  ORDER_STATUS_REJECTED = 6;

  // Terminal: time-in-force elapsed before fully filling.
  ORDER_STATUS_EXPIRED = 7;

  // Working as a SCHEDULE: admitted, and being sliced into child orders over a
  // window rather than sent to a venue (#435).
  //
  // NOT TERMINAL, AND NOT AT A VENUE — which is why it is its own state rather
  // than a flag on PENDING_NEW. An order in this state has passed every gate and
  // is deliberately resting; an order in PENDING_NEW is one nothing has got to
  // yet. Reconciliation treats those opposite ways, and conflating them would
  // make the schedule driver and the interrupted-order sweep fight over the same
  // orders.
  //
  // THE PARENT ITSELF NEVER FILLS. Its children do, and it reaches a terminal
  // state on what they DID — not on what was sent to them. A consumer that folds
  // fills must therefore ignore parents, or it double-counts every slice against
  // the quantity the parent already represents.
  ORDER_STATUS_WORKING_SCHEDULED = 8;
}

// OrderState is the full materialized state of one order — the payload embedded
// in every lifecycle FACT and the element of an order STATE_SNAPSHOT. Its
// aggregate identity is order_id.
message OrderState {
  // order_id is the aggregate identity. Required.
  string order_id = 1;

  // portfolio_id is the trading account. Required.
  string portfolio_id = 2;

  // instrument_id is the traded instrument. Required.
  string instrument_id = 3;

  // side, order_type, and time_in_force restate the order's static terms so the
  // state is self-contained. Required.
  Side side = 4;
  OrderType order_type = 5;
  TimeInForce time_in_force = 6;

  // ordered_quantity is the current order size (post-amend). Required.
  common.v1.Decimal ordered_quantity = 7;

  // limit_price is the working limit (post-amend), set for priced orders.
  common.v1.Decimal limit_price = 8;

  // stop_price is the TRIGGER price of a STOP or STOP_LIMIT order — the level
  // that turns a resting instruction into a live one. Set exactly when
  // order_type is one of those two; unset otherwise.
  //
  // IT WAS VALIDATED AND THEN DROPPED (#405). SubmitOrder.stop_price has always
  // existed and admission has always required it — "stop_price required for a
  // stop order" — but OrderState had no field to carry it, so the trigger was
  // checked at the perimeter and never reached the wire. OrderState is what
  // Venue.Execute receives, so a connector implementing Binance
  // STOP_LOSS_LIMIT or OKX's conditional-order endpoint had NOTHING to send as
  // the trigger; it could place an order that would never fire, at whatever
  // price the venue defaulted to.
  //
  // THIS IS THE SECOND TIME, not a coincidence. Closed #240 is the same defect
  // one field over: `leverage` was parsed, bounds-checked, written to the
  // immutable FACT, and then dropped before the order — so the audit root
  // asserted 10x on a spot position. The shape is "a field the perimeter
  // accepts and the wire never carries", and test/arch/submit_fields_reach_
  // state_test.go now fails the build for any third instance.
  //
  // Field 21 and not 9: the numbers are wire identity, and 9 has been
  // OrderStatus since this message existed.
  common.v1.Decimal stop_price = 21;

  // expire_at is WHEN A GTD ORDER STOPS BEING GOOD — required whenever
  // time_in_force is TIME_IN_FORCE_GTD, unset otherwise.
  //
  // THE THIRD INSTANCE OF THE SAME DEFECT, found by writing the guard for the
  // first two. Admission has always rejected a GTD order without it —
  // "expire_at required for GTD" — and OrderState had no field, so before this
  // the identifier `ExpireAt` appeared in exactly ONE place in the whole Go
  // tree: the line that validates it. The adapters DO read time_in_force and
  // pass it to the venue, so a Good-Til-Date order was routed as good-till-date
  // with no date. What the venue does with that is the venue's choice, not the
  // trader's — which is the same failure as a stop with no trigger, one field
  // over.
  google.protobuf.Timestamp expire_at = 22;

  // arrival_price is the reference mark for this instrument AT ADMISSION, and
  // arrival_at is when that mark was observed (#436).
  //
  // THIS IS THE ONE TCA INPUT THAT CANNOT BE RECONSTRUCTED LATER, which is why
  // it is stamped before anything measures it. Transaction-cost analysis
  // compares what an order actually paid against what the market showed when the
  // decision was made; a mark read at analysis time is a mark from AFTER the
  // order moved the market. That does not merely add noise — it biases every
  // measure flatter, always in the flattering direction, and a cost number that
  // understates cost is worse than no cost number because it will be believed.
  //
  // So every order admitted without this is permanently unmeasurable. The damage
  // is retroactive in the same way #432's trade_count was: nothing reads this
  // field today, and the orders being admitted now are the history the first TCA
  // report will be computed over.
  //
  // BOTH FIELDS ARE UNSET WHEN NO MARK WAS AVAILABLE, and unset is not zero. A
  // zero arrival price makes implementation shortfall infinite or nonsensical
  // depending on which way it is divided, and "we could not see the market"
  // is a real, common state — a thinly-quoted instrument, a cold start before
  // the price spine has delivered, a mark aged out past OMS_PRICE_MAX_AGE. A
  // consumer must skip those orders, not score them as zero-cost.
  //
  // arrival_at is carried separately rather than assumed equal to accepted_at:
  // the mark has its own observation time, and the GAP between them is itself a
  // cost input — an order priced against a mark from thirty seconds ago is
  // measured against a market that has already moved.
  common.v1.Decimal arrival_price = 23;
  google.protobuf.Timestamp arrival_at = 24;

  // execution_schedule is how this order is being WORKED OVER TIME, when it is a
  // parent order rather than something sent to a venue whole (#435). Set exactly
  // when status is ORDER_STATUS_WORKING_SCHEDULED; unset for every ordinary
  // order and for every child.
  //
  // IT IS THE WHOLE DURABLE SCHEDULE, and it is here rather than in a table of
  // its own for the reason ExecutionSchedule's own comment gives: the schedule is
  // a pure function of these fields, so storing them on the order is storing the
  // schedule, and there is no second record that can disagree with the order it
  // describes. What has actually been SENT is durable separately and needs no
  // record either — a child is an order, so the children that exist are the ones
  // that were sent.
  ExecutionSchedule execution_schedule = 25;

  // parent_order_id names the working parent this order is a slice of (#435).
  // Set on every child; unset on parents and on ordinary orders.
  //
  // IT IS THE RELATION IN THE DIRECTION THAT CAN BE INDEXED. A child's id also
  // encodes its parent — the id is derived, which is what makes creating it
  // idempotent — but an id is not a query. The driver asks "which children of
  // this parent exist", every tick, and that has to be an index scan rather than
  // a scan of every order ever placed.
  //
  // IT IS ALSO WHAT KEEPS FILLS FROM DOUBLE-COUNTING. A consumer aggregating by
  // order must fold the children and skip the parent, and this is the field that
  // tells it which is which.
  string parent_order_id = 26;

  // status is the current lifecycle state. Required; must not be
  // ORDER_STATUS_UNSPECIFIED.
  OrderStatus status = 9;

  // filled_quantity is the cumulative executed quantity; leaves_quantity is the
  // remaining open quantity (ordered_quantity - filled_quantity). Required.
  common.v1.Decimal filled_quantity = 10;
  common.v1.Decimal leaves_quantity = 11;

  // average_fill_price is the quantity-weighted average price of all fills so
  // far. Unset until the first fill.
  common.v1.Decimal average_fill_price = 12;

  // as_of is the domain time this state is effective at — the event_time of the
  // change that produced it. Required.
  google.protobuf.Timestamp as_of = 13;

  // venue is the target execution venue MIC carried from the SubmitOrder — the
  // multi-venue allocation matrix's routing key (M4). The router sends the order
  // to the venue whose MIC matches; empty ⇒ smart-order-routing default. Once
  // routed, OrderRouted.venue records the acknowledged venue. Optional.
  string venue = 14;

  // venue_account_id is the exchange account this order executes against — the
  // COLLATERAL BOUNDARY (see SubmitOrder.venue_account_id). Stamped by the OMS at
  // admission from the (tenant, portfolio, venue) binding, and carried on every
  // state transition so the account that bore the risk is on the record, not
  // reconstructed later from config that has since changed.
  string venue_account_id = 15;

  // venue_ack_at is WHEN THE VENUE CONFIRMED IT HELD THIS ORDER — the one fact
  // that separates a recovering OMS from a guessing one.
  //
  // It is stamped only after Venue.Execute returns WITHOUT error, which is the
  // venue saying "I have it". Unset means the OMS saved the order as ROUTED and
  // never received that confirmation — the venue may hold it, or may never have
  // seen it, and a FAILED Execute does not tell those apart.
  //
  // Reconciliation reads it in exactly ONE place: when the venue answers "I do
  // not know this order". Unset then means the venue genuinely never got it and
  // working it now is safe. SET means the venue confirmed it and is now denying
  // it — not a recoverable state but a contradiction between two authorities —
  // and the order is quarantined rather than re-driven. Re-driving that case is
  // a double trade.
  google.protobuf.Timestamp venue_ack_at = 16;

  // quarantine is set when reconciliation could not safely establish what the
  // venue did with this order. A quarantined order is FROZEN: nothing re-drives
  // it, nothing cancels it, and clearing it takes a human. Unset on every
  // healthy order.
  OrderQuarantine quarantine = 17;

  // cancel_announced_at is WHEN THE CANCELLATION WAS NOT MERELY PERSISTED BUT
  // ANNOUNCED — the ORDER_CANCELLED FACT and the command outcome both
  // published. It plays the same role for cancellation that venue_ack_at plays
  // for routing: the one fact that separates a recovering OMS from a guessing
  // one.
  //
  // Without it, a redelivery of a cancel whose announcement failed after the
  // order was already saved CANCELLED is indistinguishable from a genuine
  // second cancel of an already-cancelled order. The handler would take the
  // terminal-refusal branch: the ORDER_CANCELLED FACT is never published, so
  // tv-sync's projection, accounting, and audit never learn the cancel
  // happened — and the caller is told REJECTED for a cancel that in fact
  // succeeded. Unset means the store write landed but the announcement did
  // not; the handler must complete the announcement, not refuse it. Set means
  // this order's cancellation was already told to the world, and a further
  // cancel command is a genuine duplicate.
  // RETIREMENT CONDITION (#292): when the cancel pair is converted to the
  // outbox — that is, when handleCancel commits the ORDER_CANCELLED FACT and
  // its CommandOutcome in the same transaction as the CANCELLED state, the way
  // admission, the fill folds, routing and amends already do.
  //
  // It converts WITH completeCancelAnnouncement, not separately: that function
  // is this marker's only reader-of-record, and converting one without the
  // other leaves a compensator looking for a marker nobody stamps.
  //
  // DO NOT REMOVE THIS FIELD BEFORE THEN. It is live: service.go:944 reads it
  // to tell an interrupted cancel from a genuine duplicate, and deleting it
  // does not merely change the wire — it deletes the only thing standing
  // between a succeeded cancel and a caller told REJECTED.
  google.protobuf.Timestamp cancel_announced_at = 18;

  // outcome_announced_at is WHEN A TERMINAL SUBMIT-FLOW OUTCOME WAS NOT MERELY
  // PERSISTED BUT ANNOUNCED — the order's final lifecycle FACT (OrderFilled or
  // OrderRejected) and its CommandOutcome both published. It plays the same
  // role for the submit flow's terminal transitions that venue_ack_at plays
  // for routing and cancel_announced_at plays for cancellation: the one fact
  // that separates a recovering OMS from a guessing one.
  //
  // Without it, a redelivery of a SubmitOrder whose terminal announcement was
  // interrupted — a fill that made the order FILLED, or a permanent reject,
  // Saved and then never announced because EmitFill/EmitRejected or the
  // trailing EmitOutcome failed — is indistinguishable from a genuine
  // duplicate of an order that finished cleanly. resume()'s terminal check
  // would ack it on sight: the order is FILLED or REJECTED in the store, its
  // FACT was never published, and nothing ever mentions it again. Unset means
  // the store write landed but the announcement did not; the handler must
  // complete the announcement, not treat the redelivery as a duplicate. Set
  // means this order's terminal outcome was already told to the world.
  //
  // It does NOT cover cancellation — cancel_announced_at owns that
  // transition on its own, because the cancel command's own redelivery path
  // (handleCancel) is what completes it, not a SubmitOrder redelivery.
  // RETIREMENT CONDITION (#292): when BOTH remaining submit-flow terminal
  // pairs are converted — handleSubmit's ErrUnpriced branch (Save(rejected)
  // then refuse()) and the trailing CommandOutcome that follows work().
  //
  // The second of those is not a mechanical conversion: it follows state
  // committed in EARLIER transactions (admission's Create, the fill folds), so
  // retiring this marker requires first deciding which transaction that outcome
  // belongs to. That decision is the work, not the deletion.
  //
  // DO NOT REMOVE THIS FIELD BEFORE THEN. service.go:1430
  // (orderOutcomeAnnounced) reads it to drive completeTerminalOutcome; without
  // it, a redelivery of an interrupted terminal announcement is acked on sight
  // and the FACT is never published.
  google.protobuf.Timestamp outcome_announced_at = 19;

  // accepted_announced_at is WHEN THE ADMISSION ITSELF WAS NOT MERELY COMMITTED
  // BUT ANNOUNCED — the ORDER_ACCEPTED FACT published. It is the same fact
  // cancel_announced_at and outcome_announced_at record for their own
  // transitions, applied to the FIRST one, which had no marker at all (#238).
  //
  // Admission is two independent writes with no outbox between them: the store
  // commits the order, then the FACT is published. When the publish fails the
  // row is durable at PENDING_NEW and NOTHING downstream has heard of the order
  // — risk carries no exposure for it, and tv-sync's projection drops the
  // ORDER_ROUTED that follows, because transition() ignores a FACT for an order
  // it never admitted. Without this field that order is INDISTINGUISHABLE from
  // an order resting normally at PENDING_NEW in a deployment with no venue
  // wired, so no compensator can re-announce the one without re-announcing the
  // other on every pass. Unset means the world may never have been told this
  // order exists and a compensator must say so; set means it was told.
  //
  // It is stamped only after EmitAccepted returns without error, and only for
  // an order whose acceptance THIS process announced. It is deliberately NOT
  // consulted for any status other than PENDING_NEW: it is an ADDITIVE field, so
  // every order written before it existed reads back unset, and re-announcing
  // ACCEPTED for an order that has since moved to ROUTED or PARTIALLY_FILLED
  // would push a consumer's view of it BACKWARDS to a pre-routing snapshot. See
  // resume() for where that restriction is enforced.
  // RETIREMENT CONDITION (#292), AND IT IS THE ONE THAT IS NOT ABOUT CODE.
  //
  // The admission pair IS converted — store.Create takes the ACCEPTED record,
  // so a live admission can no longer be committed-and-unannounced. What keeps
  // this field is the population it was built for: orders admitted BEFORE
  // 0006_outbox.sql existed carry it unset with NO outbox record behind them,
  // and a direct re-publish is the only thing that can announce them.
  //
  // So it retires when no order predating that migration can still be in a
  // non-terminal state — an operational claim about the DATA, which no test can
  // make and no code change can bring about. Establishing it means querying the
  // estate, not reading the tree, and until someone does, "it is probably fine"
  // is the whole risk.
  //
  // DO NOT REMOVE THIS FIELD BEFORE THEN. service.go:1340 reads it in resume(),
  // which is where broker redelivery, kanz-redrive off the DLQ, and the sweep
  // all converge — so deleting it silently drops the repair for every one of
  // those paths at once.
  google.protobuf.Timestamp accepted_announced_at = 20;

  // leverage and margin_mode are the collateral terms the order was admitted
  // under, copied from SubmitOrder and never re-derived (#417).
  //
  // THEY ARE HERE BECAUSE OrderState IS WHAT Venue.Execute RECEIVES. A term the
  // command accepts and the state does not carry is a term the venue can never
  // be told, which is #240/#405/#486's defect family four times over: leverage
  // written to the audit root and dropped; stop_price required at admission and
  // discarded, so a STOP_LOSS_LIMIT connector had no trigger to send; expire_at
  // required for GTD and discarded, so a good-till-date order reached the venue
  // with no date; and a hardcoded good-til-cancelled that made an
  // IMMEDIATE-OR-CANCEL order REST. test/arch's TestSubmitFieldsReachState is
  // the guard that now refuses the fifth instance, and it is why these two
  // fields are not optional to add.
  //
  // Absent ⇒ unlevered spot, matching SubmitOrder, so every order stored before
  // this field means exactly what it meant when it was written.
  common.v1.Decimal leverage = 27;
  MarginMode margin_mode = 28;
}

// OrderQuarantine records an order whose true state at the venue could not be
// established.
//
// It exists because the only alternative to freezing is guessing, and both
// guesses are unacceptable on the capital path: re-driving may trade the fund
// twice, and abandoning may leave a live exchange order nobody is watching. The
// platform states that it does not know, loudly, and stops.
message OrderQuarantine {
  // at is when the order was quarantined. Required when quarantine is set.
  google.protobuf.Timestamp at = 1;

  // reason is the human-readable account of what could not be established, and
  // it is what an operator reads first. It must name the venue's answer and the
  // venue_ack_at state that made the pair irreconcilable.
  string reason = 2;

  // last_query_at is when the venue was last asked about this order — so an
  // operator can tell a fresh contradiction from a stale one.
  google.protobuf.Timestamp last_query_at = 3;
}

// Fill is one atomic execution against an order — the execution-report payload
// (FIX ExecType=TRADE). A partial order produces several Fills, each its own
// FACT; their quantities sum to OrderState.filled_quantity.
message Fill {
  // fill_id is the unique, idempotent identity of this execution (the
  // venue/EMS execution id). Replays and dedup key on it. Required.
  string fill_id = 1;

  // order_id is the order this fill belongs to. Required.
  string order_id = 2;

  // instrument_id is the executed instrument. Required.
  string instrument_id = 3;

  // side is the fill direction (equals the order side). Required.
  Side side = 4;

  // quantity is this fill's executed size, strictly positive. Required.
  common.v1.Decimal quantity = 5;

  // price is this fill's execution price. Required.
  common.v1.Decimal price = 6;

  // fee is the commission/fees charged on this fill, in the execution currency.
  // Drives realized P&L. Optional (zero when none).
  common.v1.Money fee = 7;

  // venue is the ISO 10383 MIC of the execution venue. Required.
  string venue = 8;

  // venue_account_id is the exchange account this fill SETTLED AGAINST — the
  // account whose collateral moved. Required.
  //
  // It is stamped by the venue that executed the fill, not copied from intent: the
  // account that actually bore the trade is the one the ledger must post to, and
  // the whole point of segregating collateral is lost if the books record where the
  // cash was SUPPOSED to go.
  string venue_account_id = 11;

  // venue_execution_id is the venue's own execution reference, retained for
  // reconciliation against POST-01 confirmations. Optional.
  string venue_execution_id = 9;

  // executed_at is the venue execution timestamp. Required.
  google.protobuf.Timestamp executed_at = 10;
}

// OrderAccepted is the FACT that an order passed validation, authority, and
// pre-trade compliance and was admitted (status PENDING_NEW).
message OrderAccepted {
  string order_id = 1;
  OrderState state = 2;
}

// OrderPendingApproval is the FACT that an order was HELD for a second
// signature instead of being admitted (#410, act three).
//
// # Why a held order needs a FACT of its own
//
// An order at or above OMS_DUAL_CONTROL_MIN_NOTIONAL with the control armed is
// deliberately NOT written to the order book — it is not an admitted order, and
// a ninth OrderStatus would have made it one to every consumer that folds
// status. So without this FACT nothing downstream hears of it at all: the trader
// who submitted it sees neither an ORDER_ACCEPTED nor an ORDER_REJECTED, which
// is precisely the failure #410's acceptance names — "an order that neither
// executes nor reports why".
//
// # It is NOT terminal, and that is what separates it from OrderRejected
//
// The order still exists, as a proposal, and becomes a live order the moment a
// DIFFERENT authenticated subject approves it — under the SAME order_id, with
// the ORDER_ACCEPTED that follows. A consumer must not fold this as an end
// state, and must not treat the later ORDER_ACCEPTED as a duplicate.
//
// A proposal that nobody approves EXPIRES rather than resting forever looking
// like a decision that was made; expires_at below is that deadline.
message OrderPendingApproval {
  string order_id = 1;

  // command is the exact order proposed — the payload digest below covers.
  //
  // CARRIED IN FULL so an approver can be SHOWN what they are signing for. An
  // approval bound to an id the approver cannot inspect is a signature on
  // something unread, and the whole value of the second person is that they
  // looked.
  SubmitOrder command = 2;

  // proposer is the AUTHENTICATED subject that submitted the order, taken from
  // the command's issuer and never self-asserted — the forged-actor defect #444
  // fixed on the override path arrived by exactly that route. The approver must
  // be a different person (internal/dualcontrol), so this is the half of the
  // pair that is knowable now.
  string proposer = 3;

  // act is the dual-control act constant, "ORDER_SUBMISSION". Carried rather
  // than assumed so an approval collected for a pricing override or a mandate
  // change can never be replayed against an order.
  string act = 4;

  // digest is the value an approval must cover — approval.Terms.Digest over the
  // command above. It is on the wire because it is what CHANGING the order
  // would change: a consumer showing a trader their pending order shows this,
  // and an approver's client re-derives it rather than trusting it.
  string digest = 5;

  // proposed_at and expires_at bound the window in which the second signature
  // can still be given.
  google.protobuf.Timestamp proposed_at = 6;
  google.protobuf.Timestamp expires_at = 7;
}

// OrderApproved is the FACT that a held order received its SECOND SIGNATURE
// (#410, act three, acceptance clause (d): "the approval is recorded as a FACT
// carrying both identities").
//
// # Why the admission FACT could not carry this
//
// The two other acts under this control already announce their approval:
// master.v1.ExceptionOverridden carries actor + approver, and
// lifecycle.v1.ConfigChanged carries changed_by + approved_by. The order path
// had nothing. ORDER_ACCEPTED carries an OrderState, which records the ORDER and
// not who released it, and the ACCEPTED command.v1.CommandOutcome is keyed on
// order_id and names neither party. So "who countersigned this order" was
// answerable only from the OMS's own order_proposals row — and services/audit
// folds bus FACTs and cannot read another service's tables. The trail could show
// that an order was approved and could not say by whom, on the one act where the
// capital actually moves.
//
// A ROW IS NOT A FACT. That is the whole of this message.
//
// # It rides the claim, not the admission
//
// This is published from the SAME transaction that writes the second signature
// onto the proposal (ProposalStore.Claim), not from the one that admits the
// order. Two reasons, and both are about what an examiner can be told:
//
//   - There must be no instant in which an order has been released and the trail
//     cannot yet name who released it. Announcing at admission would open exactly
//     that window, and a crash inside it loses the approval and keeps the order.
//   - The approval is a decision in its own right. An approved order can still be
//     refused on the replay that follows — compliance, the mandate and the venue
//     are all re-checked against TODAY — and that refusal does not unmake the
//     fact that a second person signed.
//
// So this FACT does not imply an ORDER_ACCEPTED. It says a second signature was
// given; the order's own outcome follows under the same order_id.
//
// # Every field comes off the approval evidence
//
// The producer builds this from a dualcontrol.Approval — a value obtainable only
// by passing the self-approval, digest and expiry checks, whose fields are
// unexported so no other package can forge one by composite literal. Nothing
// here is assembled from strings a caller chose independently, which is the
// property that makes both names on one FACT worth reading: they arrived
// together, out of a check that had already run.
message OrderApproved {
  string order_id = 1;

  // proposer is the AUTHENTICATED subject that submitted the order, and approver
  // is the DIFFERENT authenticated subject that released it.
  //
  // BOTH, ON ONE FACT, IS THE POINT. Either name alone is compatible with one
  // person holding both signatures, which is the record an auditor is least able
  // to check and the most valuable one to forge. They are refused as equal —
  // normalised for case and surrounding space — by internal/dualcontrol before
  // this message can be built, and again by a CHECK constraint on the row.
  string proposer = 2;
  string approver = 3;

  // act is the dual-control act constant, "ORDER_SUBMISSION". Carried rather
  // than assumed so an approval collected for a pricing override or a mandate
  // change can never be read as one for an order — the same reason
  // OrderPendingApproval carries it.
  string act = 4;

  // digest is the value this approval covers: approval.Terms.Digest over the
  // command, byte-identical to the digest on the ORDER_PENDING_APPROVAL that
  // announced the hold. It is what TIES the two FACTs together, and it is what
  // an order edited between proposal and approval would change — so a consumer
  // holding both can prove the thing signed is the thing proposed.
  string digest = 5;

  // approved_at is when the second signature was given, which is not the same
  // instant as the admission that may follow it. An examiner dating the decision
  // against the book needs this one.
  google.protobuf.Timestamp approved_at = 6;
}

// OrderRejected is the FACT that an order was refused before any effect. No
// state changed; the order is terminal (status REJECTED).
message OrderRejected {
  string order_id = 1;

  // reason is human-readable; error_code is a stable machine code mirroring the
  // command.v1 outcome vocabulary (e.g. "COMPLIANCE_BREACH", "AUTHORITY_DENIED",
  // "INVALID_PRICE"). Required.
  string reason = 2;
  string error_code = 3;
}

// OrderRouted is the FACT that an admitted order was sent to an execution
// venue and is working (status ROUTED).
message OrderRouted {
  string order_id = 1;

  // venue is the ISO 10383 MIC the order was routed to. Required.
  string venue = 2;

  // venue_order_id is the venue's acknowledgement id, for amend/cancel routing
  // and reconciliation. Optional.
  string venue_order_id = 3;
}

// OrderPartiallyFilled is the FACT of a fill that leaves quantity remaining
// (status PARTIALLY_FILLED). It carries both the atomic fill and the resulting
// order state.
message OrderPartiallyFilled {
  string order_id = 1;
  Fill fill = 2;
  OrderState state = 3;
}

// OrderFilled is the FACT of the fill that completes an order (status FILLED,
// terminal). It carries the final fill and the resulting order state.
message OrderFilled {
  string order_id = 1;
  Fill fill = 2;
  OrderState state = 3;
}

// OrderCancelled is the FACT that a resting order was withdrawn before fully
// filling (status CANCELLED, terminal).
message OrderCancelled {
  string order_id = 1;

  // cancelled_quantity is the open quantity withdrawn (the leaves at cancel
  // time). Required.
  common.v1.Decimal cancelled_quantity = 2;
}

// OrderExpired is the FACT that an order's time-in-force elapsed before it
// fully filled (status EXPIRED, terminal).
message OrderExpired {
  string order_id = 1;

  // unfilled_quantity is the open quantity that went unfilled at expiry.
  // Required.
  common.v1.Decimal unfilled_quantity = 2;
}

// StateHealed is the FACT emitted by the exchange reconciliation loop (M3.4)
// when it detects that Kanz's internal order state has drifted from the venue's
// truth — a missed websocket frame, a fill seen only on the periodic REST poll.
// The exchange is the source of truth: the reconciler NEVER edits state
// directly, it emits this correcting FACT carrying the venue-truth OrderState,
// and the journal/projection fold it to restore parity. It should ride the
// envelope with QUALITY_FLAG_REVISED and a causation_id back to the order.
message StateHealed {
  // order_id is the order whose state was healed. Required.
  string order_id = 1;

  // venue is the ISO 10383 MIC / venue code the truth came from. Required.
  string venue = 2;

  // state is the reconciled, venue-truth OrderState the reader should adopt
  // (it supersedes the drifted internal state). Required.
  OrderState state = 3;

  // reason is a human-readable description of the drift that was healed (e.g.
  // "REST poll found filled_quantity 2 vs internal 1"). Required.
  string reason = 4;

  // detected_at is when reconciliation observed the divergence. Required.
  google.protobuf.Timestamp detected_at = 5;
}

// TransactionCostRecorded is what ONE fill actually cost, measured against the
// decision-time mark (#436).
//
// # Why this is a FACT and not only a metric
//
// The per-venue histograms answer "which venue should we have used" for a HUMAN
// reading a dashboard. They cannot answer it for a MACHINE: Prometheus is not
// queryable from the routing path, it is aggregated and lossy by construction,
// and its retention is measured in weeks. A venue ranking (#437) has to read
// cost per venue over a long window, joined to the orders it came from — which
// is a durable, archived record or it is nothing.
//
// It is also the only form in which this survives. The metric is derived state
// that a pod restart resets and a scrape gap loses; this lands on the EXECUTION
// stream and is archived to Kafka by the existing order.> rule, alongside the
// fills it was computed from.
//
// # Per FILL, deliberately
//
// The individual Fill — and therefore its FEE — exists only on the fill FACT;
// OrderState keeps a cumulative quantity and an average price and no fee total.
// A per-ORDER record would have to accumulate fees across deliveries, and an
// in-memory accumulator is lost on restart and wrong across replicas. Per fill
// is stateless, and it is the better grain anyway: an order can fill across
// several venues, and a per-order record blends exactly the thing being compared.
//
// # It records; it decides nothing
//
// Nothing on the trading path reads this. That is the property that lets it be
// published from the OMS at all — a measurement that could refuse or reroute an
// order would put an analytic on the capital path.
message TransactionCostRecorded {
  // order_id and fill_id identify what was measured. fill_id is what makes this
  // idempotent: the same fill measured twice is the same record.
  string order_id = 1;
  string fill_id = 2;

  string instrument_id = 3;
  // venue is the exchange this fill executed at — the dimension the whole
  // measurement exists to compare.
  string venue = 4;
  Side side = 5;

  // filled_quantity and fill_price are this fill, not the parent order.
  common.v1.Decimal filled_quantity = 6;
  common.v1.Decimal fill_price = 7;

  // arrival_price is the reference mark stamped on the order at ADMISSION
  // (OrderState.arrival_price). It cannot be reconstructed later: a mark read
  // after the fact is a mark from after this order moved the market, which
  // biases every cost measure flatter and always in the flattering direction.
  common.v1.Decimal arrival_price = 8;

  // fee is what the venue charged, as the venue reported it. A negative amount
  // is a maker rebate and reduces cost.
  common.v1.Money fee = 9;

  // shortfall_bps is the headline: implementation shortfall against arrival, in
  // basis points of arrival notional, INCLUDING fees. Positive cost money;
  // negative beat the benchmark. The sign is from the fund's point of view for
  // both sides, so a report cannot average a good sell against a bad buy to zero.
  common.v1.Decimal shortfall_bps = 10;

  // price_shortfall_bps is the same measure EXCLUDING fees, so a venue's
  // execution quality and its fee schedule can be told apart. A venue can be
  // good at one and bad at the other, and a single blended figure hides which.
  common.v1.Decimal price_shortfall_bps = 11;

  // measured_at is when this measurement was taken, which is NOT when the fill
  // happened. A backlogged or replayed consumer produces a late measurement of
  // an old fill, and a reader comparing venues over a window needs to know which
  // clock it is looking at.
  google.protobuf.Timestamp measured_at = 12;

  // arrival_at and executed_at bound the interval this fill was worked over:
  // when the benchmark mark was observed, and when the venue executed.
  //
  // THEY ARE THE VWAP WINDOW, and without them this record cannot be joined to a
  // bar series at all. Implementation shortfall answers "what did the decision
  // cost"; slippage against interval VWAP answers the separate question "did we
  // trade worse than the market did over the same window" — and an order can
  // beat arrival because the market moved in its favour while still being worked
  // worse than every other participant.
  //
  // THIS RECORD SHIPPED WITHOUT THEM, which is the same defect one layer over:
  // a value present upstream (OrderState.arrival_at, Fill.executed_at) and
  // dropped at a boundary, exactly as stop_price, expire_at and leverage were.
  // A consumer holding only measured_at knows when the measurement ran and
  // nothing about the market it should be compared against.
  //
  // Both are UNSET when their source was — an order admitted with no usable mark
  // has no arrival_at, and unset is not the epoch. A consumer must skip that
  // window rather than compute a VWAP from 1970.
  google.protobuf.Timestamp arrival_at = 13;
  google.protobuf.Timestamp executed_at = 14;

  // parent_order_id names the working parent this fill's order is a slice of
  // (#435). Set on every child's cost record; unset for an ordinary order.
  //
  // WITHOUT IT ONE DECISION READS AS N UNRELATED ONES. order_id here is the
  // CHILD, because that is the order that filled — but the decision whose cost
  // is being measured was the parent's, and an order worked in fifty slices
  // produces fifty records with nothing tying them together. A consumer asking
  // "what did this order cost" would get fifty answers to a question with one.
  //
  // It is also what lets a cost consumer WEIGHT correctly. Fifty slices of one
  // decision are not fifty independent pieces of evidence about a venue, and a
  // ranker that counts them as such crosses its evidence floor fifty times
  // faster for whichever venue happens to be worked with an algorithm — then
  // feeds that back into where the next order is sent.
  string parent_order_id = 15;
}

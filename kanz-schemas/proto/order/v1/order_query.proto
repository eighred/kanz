// Order history, read (#399).
//
// WHY THE OMS GROWS A READ SURFACE AT ALL. It had none: internal/server serves
// /healthz, /readyz and /metrics, and order/v1 declared messages with no service
// in sight. Everything downstream learned about orders from FACTs on the bus, and
// that is still how the estate folds them — tv-sync projects, accounting books,
// audit records. What no consumer could answer was the question a person asks in
// front of a portfolio: what has this portfolio traded. A fold is not a query.
//
// THIS IS NOT A SECOND BOOK. It reads the OMS's own orders table, which is the
// same row the aggregate is stored in, and returns the same order.v1.OrderState
// the FACTs carry. There is deliberately no projection behind it: a projection
// would be a second copy of the order book, and the day it disagreed with the
// OMS nobody would know which one the fund had actually traded — the reasoning
// tv-sync's own migration gives for holding no independent state.
syntax = "proto3";

package order.v1;

import "google/protobuf/timestamp.proto";
import "order/v1/order.proto";
import "order/v1/order_events.proto";

// OrderQueryService is the OMS's read surface. It answers about orders it holds;
// it never accepts one — commands arrive on the bus and nowhere else, so that
// the admission gate, the compliance gate and the outbox stay on one path.
service OrderQueryService {
  // ListOrders returns one portfolio's orders, newest first.
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);

  // ListPendingApprovals returns the orders HELD for a second signature (#410),
  // oldest first.
  //
  // WITHOUT THIS THE CONTROL IS A DROP. A held order is deliberately not in the
  // orders table, so ListOrders above cannot see it and no blotter built on that
  // route ever will. #410's acceptance is explicit that an unapproved act must
  // be VISIBLY PENDING rather than silently dropped — "an order that neither
  // executes nor reports why is the failure mode this platform refuses
  // everywhere else" — and the pricing-override path answers it with exactly
  // this shape (datamaster's handlePendingOverrides).
  //
  // IT IS A READ AND STAYS A READ. Approving is a COMMAND and arrives on the
  // bus, never here; a gRPC surface that could cause a submission would be a
  // second door into the capital path with none of the admission gate, the
  // compliance gate or the outbox behind it.
  rpc ListPendingApprovals(ListPendingApprovalsRequest) returns (ListPendingApprovalsResponse);
}

message ListOrdersRequest {
  // portfolio_id is required. An empty value is refused rather than treated as
  // "all portfolios": the orders table stores an empty portfolio_id as the
  // NOT-INDEXED marker for rows admitted before migration 0007, so answering it
  // would hand back precisely the orders nobody can attribute.
  string portfolio_id = 1;

  // limit bounds one page. 0 ⇒ the server's own page size; a value above it is
  // clamped. A page is a network payload of marshaled OrderStates, and an
  // unbounded limit over a fund's whole history is a way for one request to
  // exhaust the caller rather than a feature.
  int32 limit = 2;
}

message ListOrdersResponse {
  // orders is the page, newest first.
  repeated OrderState orders = 1;

  // owner_tenant is the tenant that owns every order listed — the same
  // deny-by-default authz-gate input query.v1's portfolio replies carry, and it
  // is here for the same reason.
  //
  // A LIST MAKES THE STAMP MATTER MORE, NOT LESS. A caller naming an order
  // already knows its id; this route hands over a portfolio's whole trading
  // history. Empty ⇒ no ownership record, which a deny-by-default gate must read
  // as a denial rather than an allow.
  string owner_tenant = 2;

  // unindexed is how many of this tenant's orders CANNOT appear in any page of
  // this reply, because they predate migration 0007 and carry no portfolio_id —
  // their real one is inside a marshaled OrderState that no index can see.
  //
  // IT IS PART OF THE ANSWER, NOT A DIAGNOSTIC. Returning the page alone would
  // present a partial history as a complete one, and a person reading an order
  // history is reading it to decide something. A caller must be able to say
  // "these are the orders we can index" rather than "these are the orders".
  //
  // It reaches zero without a migration: every write rewrites portfolio_id from
  // the blob, so an order becomes indexable the moment anything touches it.
  int64 unindexed = 3;
}

message ListPendingApprovalsRequest {
  // portfolio_id narrows the queue to one portfolio. UNLIKE ListOrders, EMPTY IS
  // ALLOWED and means "everything still awaiting a signature".
  //
  // The asymmetry is deliberate and it is not an inconsistency. There, empty is
  // the NOT-INDEXED marker of migration 0007, so answering it would return the
  // orders nobody can attribute. Here the column is written by the OMS itself on
  // every row, there is no such marker, and the whole-queue question is the one
  // an approver actually asks: "what is waiting on me". A pending list that can
  // only be read one portfolio at a time is a queue nobody watches, which is the
  // failure #495 recorded on the override path.
  string portfolio_id = 1;

  // limit bounds one page. 0 ⇒ the server's own page size.
  int32 limit = 2;
}

message ListPendingApprovalsResponse {
  repeated PendingApproval pending = 1;

  // owner_tenant is the tenant that owns every proposal listed — the same
  // deny-by-default authz-gate input ListOrdersResponse carries.
  string owner_tenant = 2;
}

// PendingApproval is one order waiting for its second signature.
//
// It carries the COMMAND rather than an OrderState, because there is no
// OrderState: the order was never admitted, and inventing one would be inventing
// a status the order does not have. The command is what the approver is being
// asked to sign for.
message PendingApproval {
  string order_id = 1;

  // command is the exact order proposed — the payload digest below covers.
  SubmitOrder command = 2;

  // proposer is the AUTHENTICATED subject that submitted it. The approver must
  // be a different person, so a client rendering this queue can and should hide
  // the approve affordance from the proposer rather than let them discover the
  // refusal by pressing it.
  string proposer = 3;

  // act is the dual-control act constant, "ORDER_SUBMISSION".
  string act = 4;

  // digest is the value an approval must cover.
  string digest = 5;

  // proposed_at and expires_at bound the window. EXPIRY IS PART OF THE ANSWER:
  // a queue that does not show how long is left presents an order about to be
  // dropped identically to one proposed a minute ago.
  google.protobuf.Timestamp proposed_at = 6;
  google.protobuf.Timestamp expires_at = 7;

  // state is "PENDING" or "REFUSED" and IS ALWAYS SET (#558).
  //
  // A REFUSED PROPOSAL IS STILL PENDING WORK, and that is why this is one field
  // rather than two lists. Refusing an approval deliberately does NOT decide the
  // proposal — a self-approval attempt must not let one person destroy a
  // colleague's pending decision — so the order is still awaiting a signature
  // somebody else may legitimately give. "REFUSED" narrows "awaiting a
  // signature" to "and the last person who tried was turned away"; it never
  // means "finished".
  //
  // ALWAYS SET, INCLUDING ON UNREFUSED ENTRIES, for the reason datamaster's
  // proposalJSON records for the same field (#563): a field present only on the
  // interesting rows makes absence ambiguous between "not refused" and "this
  // server is too old to say". A client that ignores it reads every entry as
  // work awaiting a signature, which is true of both states — the safe
  // direction, and the reason the refusal is surfaced here rather than by
  // removing the row.
  string state = 8;

  // last_refusal_reason is why the most recent attempt was turned away, from a
  // closed set: "self_approval", "expired", "payload_changed", "malformed",
  // "lost_the_claim", and "unclassified" — which means the OMS refused the
  // approval and could not name the rule, and is a defect to report rather than
  // anything the approver can fix. Empty exactly when state is "PENDING".
  //
  // IT IS A CODE AND NOT A SENTENCE, so a client can branch on it — the approver
  // who was refused for self-approval needs a different affordance (find another
  // approver) from the one refused for a changed payload (the terms moved; the
  // order must be re-proposed).
  string last_refusal_reason = 9;

  // last_refused_by is the subject whose signature was refused, and it is here
  // so a returning approver can tell "my signature was refused" from "somebody
  // else's was". Empty exactly when state is "PENDING".
  string last_refused_by = 10;

  // last_refused_at is when. Unset exactly when state is "PENDING".
  google.protobuf.Timestamp last_refused_at = 11;
}

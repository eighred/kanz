syntax = "proto3";

// Package accounting.v1 is the investment/accounting book-of-record (IBOR/ABOR)
// schema (IBOR-01a) — the system-of-record beneath every number (ROI #36). It
// carries the journal of LedgerEntry events that an event-sourced book folds
// OMS-01 fills and cash movements into, the CorporateAction events that adjust
// positions/cash and restate history, and the NAV / Accrual the book produces.
//
// # Money is Decimal, ratios/rates are double
//
// Cash amounts, prices, NAV, and accruals are money/quantity ⇒ common.v1.Decimal
// (the EVT-14 exact-money rule — a book-of-record never rounds through float).
// Split ratios, dividend-per-share factors, and coupon rates are dimensionless
// ⇒ double.
//
// # Bitemporal
//
// Every event carries both an effective_time (when the economic event happened)
// and a knowledge_time (when the book learned of it). A late-arriving event with
// an earlier effective_time RESTATES history; a point-in-time read is keyed by
// (as_of effective, as_of knowledge) so a prior NAV is reproducible exactly as it
// was known then (IBOR-01c, knowledge-time correct).
package accounting.v1;

import "google/protobuf/timestamp.proto";
import "common/v1/decimal.proto";

// EntryType classifies a ledger journal entry by what produced it.
enum EntryType {
  ENTRY_TYPE_UNSPECIFIED = 0;
  // A trade fill (OMS-01 Fill): a position leg and an offsetting cash leg.
  ENTRY_TYPE_TRADE = 1;
  // A cash movement not tied to a trade: subscription, redemption, transfer.
  ENTRY_TYPE_CASH = 2;
  // A fee/commission cash outflow.
  ENTRY_TYPE_FEE = 3;
  // An entry generated by a corporate action (split/dividend/merger/coupon).
  ENTRY_TYPE_CORPORATE_ACTION = 4;
  // An interest/dividend accrual posting.
  ENTRY_TYPE_ACCRUAL = 5;
}

// LedgerEntry is one immutable journal event in the book-of-record. The book is
// the fold of these entries; the entries are never mutated — a correction is a
// new entry (an offset / restatement), so the journal is append-only and
// replayable to any point in time.
message LedgerEntry {
  // entry_id is the unique, idempotent identity of this journal entry. Replays
  // and dedup key on it. Required.
  string entry_id = 1;

  // portfolio_id is the book this entry belongs to. Required.
  string portfolio_id = 2;

  // entry_type classifies the entry. Required.
  EntryType entry_type = 3;

  // instrument_id is the affected instrument, set for position-affecting entries
  // (trade/corporate-action). Empty for a pure cash entry.
  string instrument_id = 4;

  // quantity is the signed position change (+ increases the holding). Set for
  // position-affecting entries. Decimal.
  common.v1.Decimal quantity = 5;

  // price is the per-unit trade/valuation price. Decimal.
  common.v1.Decimal price = 6;

  // cash is the signed cash leg in cash_currency (+ increases cash). Required for
  // any entry with a cash effect. Decimal.
  common.v1.Decimal cash = 7;

  // cash_currency is the ISO 4217 currency of the cash leg. Required when cash is
  // set.
  string cash_currency = 8;

  // effective_time is the domain time the economic event happened (trade date /
  // ex-date / accrual date). Required.
  google.protobuf.Timestamp effective_time = 9;

  // knowledge_time is when the book learned of the entry. A later knowledge_time
  // with an earlier effective_time is a restatement. Required.
  google.protobuf.Timestamp knowledge_time = 10;

  // source_ref links back to the producing fact (the OMS Fill fill_id, the
  // CorporateAction id). Optional, for lineage.
  string source_ref = 11;

  // venue_account_id is the exchange account whose collateral this entry moved.
  //
  // The ledger has always segregated cash by PORTFOLIO. The exchange does not: it
  // margins and liquidates per ACCOUNT. If two portfolios settle into one account,
  // a per-portfolio ledger reports cash that a liquidation in the other portfolio
  // has already consumed — books that are not merely imprecise but WRONG. So an
  // entry records the account it settled against, and the engine refuses to write
  // one into an account the transaction did not declare (app.venue_account_id).
  //
  // Required for entries derived from a fill. Set on a CASH MOVEMENT that settled
  // against an exchange account — funding okx-sub-1, or paying a fee out of it
  // (#415). Empty for an entry that genuinely touches none: an investor
  // subscription into the fund's own bank, a corporate action.
  //
  // EMPTY IS A CLAIM, NOT AN ABSENCE. Migration 0003 makes '' the positive
  // declaration "this entry touched no exchange account", so leaving it unset on
  // a movement that DID reach one writes a falsehood into the append-only book
  // rather than merely omitting a detail. It is never defaulted or inferred.
  string venue_account_id = 12;
}

// CorporateActionType is the kind of corporate action.
enum CorporateActionType {
  CORPORATE_ACTION_TYPE_UNSPECIFIED = 0;
  // A stock split / reverse split: positions scale by ratio, cost basis
  // inversely — market value is conserved.
  CORPORATE_ACTION_TYPE_SPLIT = 1;
  // A cash dividend: cash += holding × dividend_per_share.
  CORPORATE_ACTION_TYPE_DIVIDEND = 2;
  // A merger / exchange: holdings in instrument_id convert to target_instrument
  // at ratio (shares) plus cash_per_share.
  CORPORATE_ACTION_TYPE_MERGER = 3;
  // A bond coupon: cash += face × coupon_rate.
  CORPORATE_ACTION_TYPE_COUPON = 4;
}

// CorporateAction is an economic event on an instrument that the book applies as
// ledger entries adjusting positions and/or cash. It is bitemporal: a late
// announcement restates history without losing what was previously known.
message CorporateAction {
  // action_id is the unique identity. Required.
  string action_id = 1;

  // action_type is the kind. Required.
  CorporateActionType action_type = 2;

  // instrument_id is the affected instrument. Required.
  string instrument_id = 3;

  // ex_date is the effective (ex-)date the action takes economic effect on.
  // Required.
  google.protobuf.Timestamp ex_date = 4;

  // announced_at is when the action became known (the knowledge time). Required.
  google.protobuf.Timestamp announced_at = 5;

  // ratio is the share-conversion factor: shares-out per share-in for a split
  // (2.0 = 2:1 split) or a merger exchange. double. Set for SPLIT/MERGER.
  double ratio = 6;

  // dividend_per_share / coupon_rate carry the cash factor for DIVIDEND/COUPON.
  // double.
  double dividend_per_share = 7;
  double coupon_rate = 8;

  // target_instrument is the instrument received in a MERGER. Set for MERGER.
  string target_instrument = 9;

  // cash_per_share is cash paid per held share in a MERGER (the cash portion of a
  // cash-and-stock deal). Decimal. Optional.
  common.v1.Decimal cash_per_share = 10;

  // currency_code is the ISO 4217 currency of any cash leg. Required when a cash
  // leg is produced.
  string currency_code = 11;
}

// Accrual is the daily-accreted income (interest on a bond, declared dividend)
// that has economically accrued but not yet been paid in cash — carried in NAV so
// the book reflects earned-not-received income.
message Accrual {
  // instrument_id is the income-bearing instrument. Required.
  string instrument_id = 1;

  // portfolio_id is the book. Required.
  string portfolio_id = 2;

  // accrued_amount is the income accrued to as_of (money). Required.
  common.v1.Decimal accrued_amount = 3;

  // currency_code is the ISO 4217 currency. Required.
  string currency_code = 4;

  // as_of is the date the accrual is computed to. Required.
  google.protobuf.Timestamp as_of = 5;
}

// PnlComponent is one attributed driver of a day's NAV change. The components
// sum to the total NAV change (the IBOR-01d attribution identity).
message PnlComponent {
  // source names the driver: "price", "cash", "fx", "corporate_action".
  string source = 1;
  // amount is the contribution to NAV change (money). Decimal.
  common.v1.Decimal amount = 2;
}

// NAV is the point-in-time net asset value of a book — the headline number the
// whole platform sits beneath — with the P&L attribution of the change since the
// prior valuation.
message NAV {
  // portfolio_id is the book. Required.
  string portfolio_id = 1;

  // total is NAV = Σ position market value + cash + accrued income (money).
  // Required.
  common.v1.Decimal total = 2;

  // cash is the cash component; security_value the marked-position component;
  // accrued the accrued-income component. total = cash + security_value +
  // accrued. Decimal.
  common.v1.Decimal cash = 3;
  common.v1.Decimal security_value = 4;
  common.v1.Decimal accrued = 5;

  // currency_code is the reporting currency. Required.
  string currency_code = 6;

  // as_of is the valuation date. Required.
  google.protobuf.Timestamp as_of = 7;

  // attribution decomposes the change since the prior NAV into drivers; the
  // components sum to (this.total − prior.total).
  repeated PnlComponent attribution = 8;
}

// BalanceReconciled is the FACT emitted by the exchange reconciliation loop
// (M3.4) when a periodic REST poll finds the venue's actual balance for an
// asset differs from Kanz's internal ledger — an unrecorded fee, a fill missed
// by the websocket. The exchange is the source of truth; the reconciler emits
// this correcting FACT (never edits the ledger directly), and the journal folds
// the delta to restore parity bitemporally. Ride the envelope with
// QUALITY_FLAG_REVISED.
message BalanceReconciled {
  // portfolio_id is the account whose balance was reconciled. Required.
  string portfolio_id = 1;

  // venue is the ISO 10383 MIC / venue code the balance was read from. Required.
  string venue = 2;

  // asset is the currency/asset code the balance is denominated in (e.g. "USDT",
  // "BTC"). Required.
  string asset = 3;

  // expected is Kanz's internal balance; actual is the venue's reported balance;
  // delta = actual − expected is the correction the journal folds. Decimal.
  common.v1.Decimal expected = 4;
  common.v1.Decimal actual = 5;
  common.v1.Decimal delta = 6;

  // detected_at is when reconciliation observed the divergence. Required.
  google.protobuf.Timestamp detected_at = 7;
}

// PortfolioCashBalance is what a portfolio CAN SPEND, announced by the book of
// record (#450).
//
// WHY THIS EXISTS AT ALL. The ledger segregates cash by portfolio and is the only
// component that computes it correctly: its fold takes trade legs, cash movements
// and corporate actions, bitemporally, with restatements. Every other consumer
// that needs a balance — the pre-trade buying-power gate (#415), exchange balance
// reconciliation (#418) — was re-deriving it or going without. Two independent
// computations of one number WILL drift, and the drift surfaces as a trading
// control that refuses or admits wrongly.
//
// So accounting announces, and nobody else computes. A consumer folds this FACT
// into a local view; it does not call accounting synchronously, because order
// admission is the hot path and a call there turns a degraded accounting service
// into a trading outage.
//
// IT IS A LEVEL, NOT A DELTA, and that is deliberate. A consumer folding deltas
// re-implements the fold — including the restatement handling that makes the
// bitemporal ledger correct — which is the duplication this message exists to
// prevent. A level is idempotent on redelivery and self-correcting after a gap:
// the next announcement is right regardless of how many were missed.
message PortfolioCashBalance {
  // portfolio_id is the portfolio this balance belongs to. Required.
  string portfolio_id = 1;

  // base_currency is the currency total is denominated in — the portfolio's
  // reporting currency. Required.
  string base_currency = 2;

  // total is uninvested cash across every account, in base_currency: the number a
  // buying-power check compares against. Required.
  common.v1.Decimal total = 3;

  // by_venue_account is cash held per EXCHANGE ACCOUNT, keyed by
  // venue_account_id, for the accounts this portfolio holds cash in.
  //
  // AN EXCHANGE MARGINS AND LIQUIDATES PER ACCOUNT, so the total above is the
  // wrong number to reconcile against a venue: it includes cash sitting in the
  // fund's own bank, and it merges accounts the exchange treats separately. This
  // map is what execution.ExpectedBalances needs (#418) and is carried on the
  // same FACT so one announcement serves both consumers rather than two
  // publishers drifting apart.
  //
  // Entries are per (venue_account_id, asset). An account absent from the map
  // holds nothing this portfolio can see; it is NOT "unknown" — the whole
  // message is a level.
  repeated VenueAccountCash by_venue_account = 4;

  // as_of is the EFFECTIVE time this balance is true at; knowledge_time is when
  // the book learned the last entry folded into it. Both required.
  //
  // A CONSUMER MUST TREAT A STALE BALANCE AS UNKNOWN rather than as current. An
  // announcement can be lost — it is derived state, published after the ledger
  // write it describes, and a publish failure must never fail that write. So the
  // consumer bounds the age and falls back to "cash unavailable", which the
  // buying-power rule already fails closed on. Silence must not read as a
  // balance that has not moved.
  google.protobuf.Timestamp as_of = 5;
  google.protobuf.Timestamp knowledge_time = 6;

  // completeness states WHICH KINDS OF JOURNAL ENTRY the deployment that
  // produced this balance actually feeds (#614).
  //
  // A LEVEL IS ONLY AS COMPLETE AS ITS INPUTS, and this one is not complete
  // today: the ledger folds corporate actions correctly and nothing in this
  // platform publishes one (#588), so every announcement is missing the cash
  // effect of every dividend, coupon and merger the fund has been party to.
  // Without this field a consumer cannot tell that number from a whole one, and
  // the pre-trade buying-power gate that reads it turns the gap into an order
  // refusal that reads exactly like a spending limit being hit.
  //
  // A MESSAGE AND NOT A BARE LIST, because proto3 cannot tell an empty repeated
  // field from an absent one — and "the producer said nothing is missing" must
  // never look like "the producer did not say". An absent completeness means
  // UNSTATED: a consumer has not been shown that this balance is whole, and it
  // must not assume it is.
  BalanceCompleteness completeness = 7;
}

// BalanceCompleteness is a producer's statement of what its balance contains
// (#614) — the difference between "checked, and fine" and "nobody checked".
//
// IT DESCRIBES THE DEPLOYMENT, NOT THE PORTFOLIO. Whether anything publishes a
// corporate action is a property of the estate, so this says the same thing on
// every portfolio's announcement. It rides on the announcement anyway, because
// the consumer that needs it is a pre-trade control reading a local view on the
// order-admission path: a second lookup for the posture is a second thing that
// can be stale, absent or wired to a different accounting deployment than the
// balance came from.
//
// BOTH LISTS ARE SENT, so a message that says nothing is detectable. A
// BalanceCompleteness with both lists empty carries no statement at all and a
// consumer must treat it as UNSTATED, exactly as it treats the absent message.
message BalanceCompleteness {
  // produced_entry_types are the journal entry types something in the producing
  // deployment actually feeds, by ledger entry-type name ("trade", "cash",
  // "fee", ...). Sorted, so the announcement stays byte-stable.
  repeated string produced_entry_types = 1;

  // unproduced_entry_types are the journal entry types the book of record can
  // fold and NOTHING in the producing deployment produces. Each one names cash
  // and position effects the balance above is missing.
  //
  // The direction of the error is NOT knowable from this list. An unfolded
  // dividend understates the cash of a portfolio that is LONG the instrument and
  // overstates the cash of one that is SHORT it (ledger.foldCorpAct pays
  // quantity x per-unit, signed). So a consumer must not correct the number by
  // it — only report that the number is not whole, and say which feed would
  // make it whole.
  repeated string unproduced_entry_types = 2;
}

// VenueAccountCash is one exchange account's holding of one asset (#450).
message VenueAccountCash {
  // venue_account_id is the exchange account — the collateral boundary. Required.
  string venue_account_id = 1;

  // asset is the currency/asset code held (e.g. "USDT", "BTC"). Required, and
  // NOT normalized to the portfolio's base currency: an exchange holds what it
  // holds, and converting here would report a number no venue would agree with.
  string asset = 2;

  // amount is the balance of asset in this account. Required.
  common.v1.Decimal amount = 3;
}

// --- Custody reconciliation (#962) -------------------------------------------
//
// THE ENGINE EXISTED AND THE CONTROL DID NOT. services/accounting/internal/recon
// has compared the folded book against a custodian statement since IBOR-01e, and
// its only caller was an HTTP handler whose statement came from the REQUEST BODY.
// So the platform had a reconciliation ENGINE with no reconciliation CONTROL: an
// operator obtained the custodian's positions by hand, transcribed them into
// JSON, and posted them, per portfolio, per custodian, per day — or did not, and
// nothing said so.
//
// WHY THIS IS THE CONTROL THAT MATTERS MOST. Custody reconciliation detects the
// discrepancies nothing else can see, because every other control on this
// platform READS THE BOOK and therefore inherits whatever the book is wrong
// about: exposure, VaR, mandate limits, margin and NAV are all confidently wrong
// in the same direction when a fill never reached the ledger. The failure is
// silent by construction — a position missing from the book contributes nothing
// to any measure, so no threshold fires. The custodian's statement is the only
// independent view.

// CustodianStatement is the custodian's own view of what it holds for a
// portfolio on a business date — the independent side of the reconciliation.
//
// IT IS A FACT AND NOT A REQUEST BODY, which is the whole point of #962. As a
// fact it is replayable, auditable, and attributable to the custodian that
// asserted it, and the reconciliation no longer depends on who called an
// endpoint. It is a LEVEL, exactly as PortfolioCashBalance is: the custodian
// states what it holds, not what changed, so a redelivery is idempotent and a
// gap is self-correcting on the next statement.
//
// AN ABSENT INSTRUMENT IS A POSITIVE CLAIM OF ZERO, not silence. A statement
// lists what the custodian holds; anything it omits, the custodian says it does
// not hold, and that is precisely what makes MISSING_AT_CUSTODIAN detectable. A
// producer that can only render a PARTIAL statement must not publish one — a
// partial level read as complete manufactures a break for every position it
// omitted, which is worse than no reconciliation at all because it buries the
// real breaks in noise.
message CustodianStatement {
  // statement_id is the custodian's identity for this statement, and the
  // idempotency key: a redelivered statement replaces, never accumulates.
  // Required.
  string statement_id = 1;

  // custodian_id is the institution asserting it (a custodian, prime broker or
  // fund administrator). Required, and part of the reconciliation's identity —
  // a portfolio custodied in two places reconciles against each separately, and
  // merging them would net a break at one against a holding at the other.
  string custodian_id = 2;

  // portfolio_id is the book this statement is reconciled against. Required.
  string portfolio_id = 3;

  // business_date is the close-of-business date the statement states holdings
  // AS OF — the economic date, not the transmission date. Required.
  //
  // IT IS THE RECONCILIATION'S IDENTITY together with (portfolio, custodian).
  // A statement that arrives late still reconciles the date it describes, and a
  // restated statement for a date already reconciled produces a NEW run for that
  // date rather than mutating the old one: the history must reconstruct what was
  // known and when, and a rewritten run destroys exactly that.
  google.protobuf.Timestamp business_date = 4;

  // positions are the holdings the custodian asserts, by instrument. A quantity
  // of zero and an absent instrument mean the same thing — not held.
  repeated StatementPosition positions = 5;

  // cash are the cash balances the custodian asserts, by currency.
  repeated StatementCash cash = 6;

  // received_at is when the platform learned of the statement (the knowledge
  // time to business_date's effective time). Required.
  google.protobuf.Timestamp received_at = 7;

  // transactions are the trade lines the custodian reports for this business
  // date (#1049). OPTIONAL, and an empty list is NOT "no transactions occurred"
  // -- see grain, which is the field that says which.
  repeated StatementTransaction transactions = 8;

  // grain declares what this feed supplies, and it is what makes an empty
  // transactions list readable. A custodian that sends only balances must produce
  // a statement that SAYS SO (BALANCES_ONLY) rather than one that reads as a
  // complete trade-level statement with nothing in it.
  //
  // UNSPECIFIED IS THE ZERO VALUE AND IT MEANS UNKNOWN. Every statement written
  // before this field existed decodes to it, which is honest: nobody asserted a
  // grain for those, and the transaction leg does not run on them.
  StatementGrain grain = 9;
}

// StatementPosition is one instrument holding the custodian asserts.
message StatementPosition {
  // instrument_id is the held instrument, in the platform's canonical id space.
  // Required.
  //
  // THE ADAPTER TRANSLATES, NOT THIS MESSAGE. A custodian names instruments in
  // its own space (SEDOL, CUSIP, an internal code); mapping that to the
  // canonical id is the feed adapter's job, for the same reason venue shapes
  // terminate at the venue adapter. An unmappable identifier must fail IN THE
  // ADAPTER — publishing the custodian's raw code here reconciles it against an
  // instrument the book has never heard of and reports MISSING_IN_IBOR for a
  // position the book holds perfectly well under its real id.
  string instrument_id = 1;

  // quantity is the holding the custodian asserts. Signed: a short position is
  // negative. Decimal — a book of record never rounds through float.
  common.v1.Decimal quantity = 2;
}

// StatementCash is one currency balance the custodian asserts.
message StatementCash {
  // currency_code is the ISO 4217 currency. Required.
  string currency_code = 1;

  // balance is the cash the custodian asserts it holds in that currency.
  // Signed: an overdrawn balance is negative. Decimal.
  common.v1.Decimal balance = 2;
}

// StatementGrain is what a custodian's feed actually supplies (#1049).
//
// IT EXISTS BECAUSE AN EMPTY transactions LIST IS AMBIGUOUS, and the ambiguity is
// the dangerous kind: "this custodian sends balances only" and "this custodian
// sends trade lines and there were none on that date" are the same empty list,
// and reading the first as the second reports every execution the book holds as
// one the custodian never saw. That is the platform's rule that an empty
// capability set means "the venue did not assert support" rather than
// "unsupported", applied to the control that guards the book of record.
//
// SO THE TRANSACTION LEG RUNS ONLY ON TRANSACTIONS. Under BALANCES_ONLY and under
// UNSPECIFIED it is skipped and the run says so; it does not fall back to
// comparing against an empty set, and it does not report a clean transaction pass
// it never performed.
enum StatementGrain {
  // UNSPECIFIED: the producer asserted nothing. NOT a synonym for balances-only
  // -- it is the third value, and it means the grain of this feed is UNKNOWN. The
  // zero value, so a producer that says nothing says "unknown" rather than
  // accidentally claiming its statement is complete at trade level.
  STATEMENT_GRAIN_UNSPECIFIED = 0;
  // BALANCES_ONLY: the custodian supplies positions and cash and no trade lines.
  // A POSITIVE CLAIM, and a legitimate one -- many custody feeds are exactly this
  // -- but it is SAID rather than inferred from an empty list, so an operator can
  // read that no execution is being matched anywhere.
  STATEMENT_GRAIN_BALANCES_ONLY = 1;
  // TRANSACTIONS: the transactions below are the COMPLETE set of trade lines the
  // custodian reports for this business date. Completeness is what makes an
  // absent reference a break rather than a gap, exactly as an absent instrument
  // in positions is a positive claim of zero.
  STATEMENT_GRAIN_TRANSACTIONS = 2;
}

// StatementTransaction is ONE trade line the custodian reports for the business
// date -- the grain at which "which of my executions has the custodian never
// seen?" becomes answerable (#1049).
//
// # Why a netted position is not enough
//
// A position-and-cash comparison cannot distinguish a genuine break from two
// offsetting errors of equal size, nor a wrongly-booked execution from a missing
// one when both touch the same instrument. An institutional custody control runs
// a position pass AND a transaction pass precisely because the first is blind to
// the internal composition of a correct-looking total.
//
// # It is matched on external_ref, and it does not re-price
//
// The transaction pass answers IDENTITY -- did both sides see this execution --
// and leaves quantity and price agreement to the netted pass, which already
// covers it at the grain an operator books against. The figures below are carried
// so a break names an amount somebody can act on, not so a second tolerance
// regime can be invented beside the first.
message StatementTransaction {
  // external_ref is the custodian's identity for the execution, in the SAME
  // reference space the book stamps on the journal entry (ledger.Event.SourceRef,
  // set from the venue fill id). Required -- a line with no reference cannot be
  // matched against anything, and admitting one would make a feed that omits the
  // field reconcile as though every trade were missing.
  //
  // THE ADAPTER TRANSLATES, exactly as it does for StatementPosition's
  // instrument_id: a custodian naming trades in its own space maps them in the
  // feed adapter, and an unmappable reference must fail THERE rather than arrive
  // here to be reported as an execution the book never made.
  string external_ref = 1;

  // trade_date is when the execution happened and settlement_date is when its
  // legs change (or changed) hands -- the SAME two economic dates the journal has
  // carried since #1043 (ledger.Event.SettlementBasis / SettlementDate), which is
  // why this message names both rather than one "date".
  //
  // A STATEMENT'S BUSINESS DATE IS A SETTLEMENT DATE for most custody feeds and a
  // TRADE DATE for some, and the book side of the comparison is windowed by
  // whichever the entry asserts. Carrying both is what lets the two sides be
  // windowed consistently instead of by a convention nobody wrote down.
  google.protobuf.Timestamp trade_date = 2;
  google.protobuf.Timestamp settlement_date = 3;

  // instrument_id is the traded instrument in the platform's canonical id space,
  // under StatementPosition.instrument_id's rule: the adapter translates.
  string instrument_id = 4;

  // quantity is the SIGNED traded quantity -- negative for a sale -- and price
  // the per-unit price. Decimal, never float: a book of record does not round.
  common.v1.Decimal quantity = 5;
  common.v1.Decimal price = 6;

  // cash is the signed cash leg of the execution (+ increases cash) in
  // currency_code, signed the way the journal's cash leg is. A break can then
  // state the custodian's figure beside the book's with no convention change in
  // between.
  common.v1.Decimal cash = 7;
  string currency_code = 8;
}

// ReconciliationOutcome is what a run concluded.
//
// THE UNSUCCESSFUL VALUES ARE THE REASON THIS ENUM EXISTS. A run that found
// nothing and a run that never happened must not produce the same telemetry —
// that is the "nothing configured and checked-and-fine must never look the same"
// rule applied to the control that guards the book of record.
enum ReconciliationOutcome {
  RECONCILIATION_OUTCOME_UNSPECIFIED = 0;
  // CLEAN: the book and the statement agreed within tolerance. A real, positive
  // result — the control ran and the book is confirmed.
  RECONCILIATION_OUTCOME_CLEAN = 1;
  // BREAKS: the run completed and found discrepancies. The breaks are attached
  // and each one is a working item with a lifecycle, not a log line.
  RECONCILIATION_OUTCOME_BREAKS = 2;
  // NO_STATEMENT: the run was due and the custodian had said nothing for that
  // business date.
  //
  // THIS IS THE VALUE THAT MAKES ABSENCE LOUD. Before #962 a custodian that
  // simply stopped sending statements produced no event of any kind, so the
  // estate looked identical to one reconciling cleanly every day. A scheduled
  // run emits this instead of staying silent, so the gap has a timestamp, a
  // counter and an alert.
  RECONCILIATION_OUTCOME_NO_STATEMENT = 3;
  // FAILED: the run could not be completed — the book could not be
  // materialized, or a figure was not representable. It is NOT a clean book and
  // must never be read as one; the failure_reason says which.
  RECONCILIATION_OUTCOME_FAILED = 4;
}

// ReconciliationBreakKind classifies a discrepancy. The values mirror
// recon.BreakKind, which is the engine that produces them; the guard
// test/arch/break_kinds_match_the_engine_test.go derives one set from the other
// so a kind added to the engine cannot silently fail to reach the wire.
enum ReconciliationBreakKind {
  RECONCILIATION_BREAK_KIND_UNSPECIFIED = 0;
  // QUANTITY: both sides hold the instrument, the quantities differ beyond
  // tolerance.
  RECONCILIATION_BREAK_KIND_QUANTITY = 1;
  // MISSING_AT_CUSTODIAN: the book holds it, the custodian does not. The
  // direction that most often means a settlement failed or never happened.
  RECONCILIATION_BREAK_KIND_MISSING_AT_CUSTODIAN = 2;
  // MISSING_IN_IBOR: the custodian holds it, the book does not. The direction
  // that most often means a fill never reached the ledger — the case no other
  // control on this platform can detect, because a position absent from the book
  // contributes to no measure and crosses no threshold.
  RECONCILIATION_BREAK_KIND_MISSING_IN_IBOR = 3;
  // CASH: a currency balance differs beyond tolerance.
  RECONCILIATION_BREAK_KIND_CASH = 4;

  // THE TWO BELOW ARE THE TRANSACTION GRAIN (#1049), and they exist because the
  // four above are a NETTED comparison and a netted comparison is blind to the
  // internal composition of a correct-looking total. Twelve executions on one
  // instrument, one of them booked against an execution the custodian never
  // settled and one the custodian settled that the book never heard of, produce
  // identical position and cash totals: the four kinds above report the line as
  // fully correct. These two are the only ones that can name WHICH execution.

  // EXECUTION_MISSING_AT_CUSTODIAN: the book holds an execution whose reference
  // appears on no transaction line the custodian reported for the business date.
  // The key is the execution's external reference (ledger.Event.SourceRef, the
  // venue fill id), not an instrument.
  RECONCILIATION_BREAK_KIND_EXECUTION_MISSING_AT_CUSTODIAN = 5;
  // EXECUTION_MISSING_IN_IBOR: the custodian reported a transaction whose
  // reference matches no journal entry in the comparison basis. THE DIRECTION
  // THAT MEANS A FILL NEVER REACHED THE BOOK, observed rather than inferred from
  // a balance -- which is the whole of #1049.
  RECONCILIATION_BREAK_KIND_EXECUTION_MISSING_IN_IBOR = 6;
}

// BreakStatus is where a break has got to in the investigation.
//
// A BREAK NOBODY CAN AGE IS A BREAK NOBODY CHASES, which is why this exists at
// all. Detection without a lifecycle produces a list that regenerates identically
// every day: an operator cannot tell a break they have already explained from one
// that appeared this morning, so after a week nobody reads the list. The status
// and its timestamp are what make the control operational rather than
// informational.
//
// It is deliberately the same shape as the settlement lifecycle in
// services/oms/internal/posttrade — modelled on it rather than invented, because
// a second aggregate idiom for "a working item that moves through states" is a
// second thing to learn and to get wrong.
enum BreakStatus {
  BREAK_STATUS_UNSPECIFIED = 0;
  // OPEN: detected, unassigned. The state every break is born in.
  BREAK_STATUS_OPEN = 1;
  // ASSIGNED: an operator owns the investigation.
  BREAK_STATUS_ASSIGNED = 2;
  // EXPLAINED: the cause is known and recorded, and the break is expected to
  // clear on its own — a trade that settles tomorrow, a fee the custodian books
  // on a different day.
  //
  // IT IS NOT TERMINAL, and that is deliberate. An explanation is a claim about
  // the future, and a break that is still there a week after being explained is
  // a WORSE signal than an unexplained one, because somebody looked at it and
  // was wrong. Only RESOLVED, which requires the difference to actually be gone,
  // ends the lifecycle.
  BREAK_STATUS_EXPLAINED = 3;
  // RESOLVED: the discrepancy is gone — the book and the custodian now agree.
  // Terminal.
  BREAK_STATUS_RESOLVED = 4;
}

// ReconciliationBreak is one discrepancy between the book and the custodian,
// carried as a working item with an owner, an explanation and an age.
message ReconciliationBreak {
  // break_id is the break's stable identity ACROSS RUNS, derived from
  // (portfolio, custodian, kind, key). Required.
  //
  // STABLE, BECAUSE THE AGE IS THE POINT. A break that got a fresh id on every
  // daily run would be permanently one day old, and "this position has
  // disagreed with the custodian for three weeks" — the single most useful thing
  // a reconciliation can tell an operator — would be unrepresentable.
  string break_id = 1;

  // kind classifies the discrepancy. Required.
  ReconciliationBreakKind kind = 2;

  // key is the instrument id for a position break, or the currency code for a
  // cash break. Required.
  string key = 3;

  // ibor is the book's figure, custodian the custodian's, and difference is
  // (ibor - custodian). Decimal, all three.
  //
  // ALL THREE ARE CARRIED RATHER THAN TWO PLUS ARITHMETIC. A consumer that
  // recomputed the difference would be a second implementation of the
  // comparison, and the run is evidence of what the engine actually concluded —
  // including at what tolerance — not an invitation to re-derive it.
  common.v1.Decimal ibor = 4;
  common.v1.Decimal custodian = 5;
  common.v1.Decimal difference = 6;

  // status is where the investigation has got to. Required.
  BreakStatus status = 7;

  // assignee is the operator who owns it, set from ASSIGNED onward. Empty in
  // OPEN.
  string assignee = 8;

  // explanation is the recorded cause, set from EXPLAINED onward.
  string explanation = 9;

  // first_seen_at is when this break was FIRST detected, carried forward across
  // every subsequent run that still finds it. It is what the age is measured
  // from, and it is never advanced by a redetection.
  google.protobuf.Timestamp first_seen_at = 10;

  // last_seen_at is the completed_at of the most recent run that still found it.
  // Together with first_seen_at it separates "disagreed once, three weeks ago"
  // from "has disagreed every day for three weeks".
  google.protobuf.Timestamp last_seen_at = 11;

  // status_changed_at is when status last moved. Required.
  google.protobuf.Timestamp status_changed_at = 12;
}

// ReconciliationRun is the record that a reconciliation happened — emitted
// WHETHER OR NOT it found breaks, and whether or not a statement arrived.
//
// A RUN THAT FOUND NOTHING IS EVIDENCE; SILENCE IS NOT. The pre-#962 design
// could only ever produce output when a human ran it and it found something, so
// "reconciled clean today" and "nobody ran it" were the same observable event.
// This FACT is what separates them, and the age of the newest run per
// (portfolio, custodian) is what the staleness alert reads.
message ReconciliationRun {
  // run_id is this run's unique identity, and the idempotency key for the
  // consumers that fold it. Required.
  string run_id = 1;

  // portfolio_id, custodian_id and business_date are the run's subject — the
  // triple a scheduled reconciliation is defined over. Required.
  string portfolio_id = 2;
  string custodian_id = 3;
  google.protobuf.Timestamp business_date = 4;

  // outcome is what the run concluded. Required.
  ReconciliationOutcome outcome = 5;

  // statement_id is the custodian statement reconciled against. Empty when
  // outcome is NO_STATEMENT — which is the only case where its absence is a
  // statement rather than an omission.
  string statement_id = 6;

  // breaks are the discrepancies found, deterministically ordered. Empty for
  // CLEAN.
  repeated ReconciliationBreak breaks = 7;

  // tolerance is the absolute difference at or below which the two sides were
  // treated as agreeing. Decimal.
  //
  // IT IS CARRIED ON THE RUN BECAUSE IT CHANGES WHAT "CLEAN" MEANT. A run
  // reconciled at a loose tolerance and one reconciled exactly are not
  // comparable evidence, and an auditor asking why a break was not raised on a
  // given date must be able to read the answer off the run rather than infer it
  // from whatever the configuration says today.
  common.v1.Decimal tolerance = 8;

  // completed_at is when the run finished. Required — it is what the staleness
  // alert ages.
  google.protobuf.Timestamp completed_at = 9;

  // failure_reason names why a FAILED run could not complete. Empty otherwise.
  string failure_reason = 10;
}

// CustodyActionState is the lifecycle evidence at one revision. A revision
// advances for reconciliation observations as well as operator actions.
message CustodyActionState {
  BreakStatus status = 1;
  string assignee = 2;
  string explanation = 3;
  int64 revision = 4;
}

// CustodyActionRecorded is committed atomically with an authenticated operator
// action. It never establishes that the book and custodian agree.
message CustodyActionRecorded {
  string request_id = 1;
  string break_id = 2;
  string actor = 3;
  string action = 4;
  CustodyActionState before = 5;
  CustodyActionState after = 6;
  google.protobuf.Timestamp recorded_at = 7;
}

syntax = "proto3";

// Operator service — the control-plane surface over the Kubernetes estate for the
// root@universe operator plane. Reads: ListNodes / ListClusters. Writes (S2a):
// AddNode provisions a new host (one-shot k3s-join Job) and ListProvisions reports
// its status. Further node operations (drain, key material) arrive in later
// subsystems as their own RPCs.
//
// # Consumers
//
// The `operator` service implements the server, reading Node objects from the
// Kubernetes API via client-go under a get/list-nodes ClusterRole. The
// `universe` TUI is the only client, dialing over a kubeconfig-gated
// port-forward. No other service dials this.
//
// # Versioning
//
// operator.v1, additive-only within the version — a removed/retyped field or
// RPC breaks every client and requires a sibling operator/v2.
package operator.v1;

import "google/protobuf/timestamp.proto";

// OperatorService is the gRPC read surface over the estate.
service OperatorService {
  // ListNodes returns every Node the operator can see, with the status,
  // roles, region and version the Kubernetes API reports.
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);

  // ListClusters groups those nodes by region into the Europe/Asia/USA view,
  // with online/offline counts.
  rpc ListClusters(ListClustersRequest) returns (ListClustersResponse);

  // AddNode provisions a new host into the estate: it creates a one-shot Job
  // that SSHes to the target once, installs the k3s agent, and joins. Async —
  // returns a provision_id immediately; poll ListProvisions for progress and
  // watch ListNodes for the joined node.
  rpc AddNode(AddNodeRequest) returns (AddNodeResponse);

  // ListProvisions reports in-flight and recent node provisions.
  rpc ListProvisions(ListProvisionsRequest) returns (ListProvisionsResponse);

  // TestConnection is a pre-flight TCP reachability probe of a candidate host's
  // SSH port — it does NOT authenticate (the key is validated at provision time).
  rpc TestConnection(TestConnectionRequest) returns (TestConnectionResponse);
}

// NodeStatus is the node's readiness. UNSPECIFIED (the zero value) is the
// deny-by-default state: a node whose Ready condition is absent or Unknown
// maps here and must render as not-ready, never silently as ready.
enum NodeStatus {
  NODE_STATUS_UNSPECIFIED = 0;
  NODE_STATUS_READY = 1;
  NODE_STATUS_NOT_READY = 2;
}

message ListNodesRequest {}

message ListNodesResponse {
  repeated Node nodes = 1;
}

message Node {
  string name = 1;
  NodeStatus status = 2;
  // roles are the node-role.kubernetes.io/<role> label suffixes.
  repeated string roles = 3;
  // region is the topology.kubernetes.io/region label value; empty if unset.
  string region = 4;
  string kubelet_version = 5;
  // created_at is the node's CreationTimestamp. Age is derived client-side —
  // the server does not render a duration string against its own clock.
  google.protobuf.Timestamp created_at = 6;
}

message ListClustersRequest {}

message ListClustersResponse {
  repeated Cluster clusters = 1;
}

message Cluster {
  // region is the grouping key (topology.kubernetes.io/region value); nodes
  // with no region label group under the empty region.
  string region = 1;
  int32 online = 2;
  int32 offline = 3;
}

// ProvisionStatus is derived from the provisioning Job's status.
enum ProvisionStatus {
  PROVISION_STATUS_UNSPECIFIED = 0;
  PROVISION_STATUS_PENDING = 1;     // Job created, not yet running
  PROVISION_STATUS_INSTALLING = 2;  // Job active (SSH + k3s install underway)
  PROVISION_STATUS_JOINED = 3;      // Job succeeded — node installed k3s and joined
  PROVISION_STATUS_FAILED = 4;      // Job failed
}

message AddNodeRequest {
  string hostname = 1;
  string ip = 2;
  int32 ssh_port = 3;   // 0 ⇒ 22
  string ssh_user = 4;
  // ssh_private_key is the PEM bootstrap key, used ONCE to install k3s. It is
  // never stored beyond the Job-owned Secret, never returned, never logged.
  bytes ssh_private_key = 5;
}

message AddNodeResponse {
  string provision_id = 1;
  ProvisionStatus status = 2;
}

message ListProvisionsRequest {}

message ListProvisionsResponse {
  repeated Provision provisions = 1;
}

message Provision {
  string id = 1;
  string hostname = 2;
  ProvisionStatus status = 3;
  string message = 4;  // failure reason when FAILED; empty otherwise
}

message TestConnectionRequest {
  string ip = 1;
  int32 ssh_port = 2;  // 0 ⇒ 22
}

message TestConnectionResponse {
  bool reachable = 1;
  int64 latency_ms = 2;  // dial latency when reachable; 0 otherwise
  string message = 3;    // dial error when unreachable; empty when reachable
}

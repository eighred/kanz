syntax = "proto3";

// Operator service — the control-plane surface over the Kubernetes estate for the
// root@universe operator plane. Reads: ListNodes / ListClusters. Writes (S2a):
// AddNode provisions a new host (one-shot k3s-join Job) and ListProvisions reports
// its status. Key material is written via SetVenueKeys (S4a, API Manager).
//
// # Consumers
//
// The `operator` service implements the server, reading Node objects from the
// Kubernetes API via client-go under a get/list-nodes ClusterRole. The
// `universe` TUI is the only client, dialing over a kubeconfig-gated
// port-forward. No other service dials this.
//
// # Versioning
//
// operator.v1, additive-only within the version — a removed/retyped field or
// RPC breaks every client and requires a sibling operator/v2.
package operator.v1;

import "google/protobuf/timestamp.proto";

// OperatorService is the gRPC read surface over the estate.
service OperatorService {
  // ListNodes returns every Node the operator can see, with the status,
  // roles, region and version the Kubernetes API reports.
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);

  // ListClusters groups those nodes by region into the Europe/Asia/USA view,
  // with online/offline counts.
  rpc ListClusters(ListClustersRequest) returns (ListClustersResponse);

  // AddNode provisions a new host into the estate: it creates a one-shot Job
  // that SSHes to the target once, installs the k3s agent, and joins. Async —
  // returns a provision_id immediately; poll ListProvisions for progress and
  // watch ListNodes for the joined node.
  rpc AddNode(AddNodeRequest) returns (AddNodeResponse);

  // ListProvisions reports in-flight and recent node provisions.
  rpc ListProvisions(ListProvisionsRequest) returns (ListProvisionsResponse);

  // TestConnection is a pre-flight TCP reachability probe of a candidate host's
  // SSH port — it does NOT authenticate (the key is validated at provision time).
  rpc TestConnection(TestConnectionRequest) returns (TestConnectionResponse);

  // Cordon marks a node unschedulable (Maintenance Mode). Reversible via Uncordon.
  rpc Cordon(CordonRequest) returns (CordonResponse);
  // Uncordon marks a node schedulable again.
  rpc Uncordon(UncordonRequest) returns (UncordonResponse);
  // Drain cordons a node and evicts its (non-DaemonSet, non-mirror) pods via the
  // Eviction API, honoring PodDisruptionBudgets. Async: returns once cordoned;
  // eviction proceeds in the background. Poll ListNodes for the derived status.
  rpc Drain(DrainRequest) returns (DrainResponse);

  // SetNodeRegion relabels a node's topology.kubernetes.io/region — the "Move Node"
  // action: it moves the node between the region groupings the Clusters view shows.
  // Non-destructive (relabel only, no eviction). Poll ListNodes/ListClusters for the
  // new grouping.
  rpc SetNodeRegion(SetNodeRegionRequest) returns (SetNodeRegionResponse);

  // SetVenueKeys registers an exchange API key set (api_key, api_secret, and for
  // OKX a passphrase) into the venue's secret location. Write-only: the operator
  // can set a venue's keys but can never read them back. The value never appears
  // in a response, and the platform's venue adapters consume it via their existing
  // CSI/Vault mount.
  rpc SetVenueKeys(SetVenueKeysRequest) returns (SetVenueKeysResponse);

  // ListVenueKeys reports which venues have a key set configured — presence ONLY,
  // never the key material.
  rpc ListVenueKeys(ListVenueKeysRequest) returns (ListVenueKeysResponse);
}

// NodeStatus is the node's readiness. UNSPECIFIED (the zero value) is the
// deny-by-default state: a node whose Ready condition is absent or Unknown
// maps here and must render as not-ready, never silently as ready.
enum NodeStatus {
  NODE_STATUS_UNSPECIFIED = 0;
  NODE_STATUS_READY = 1;
  NODE_STATUS_NOT_READY = 2;
}

message ListNodesRequest {}

message ListNodesResponse {
  repeated Node nodes = 1;
}

message Node {
  string name = 1;
  NodeStatus status = 2;
  // roles are the node-role.kubernetes.io/<role> label suffixes.
  repeated string roles = 3;
  // region is the topology.kubernetes.io/region label value; empty if unset.
  string region = 4;
  string kubelet_version = 5;
  // created_at is the node's CreationTimestamp. Age is derived client-side —
  // the server does not render a duration string against its own clock.
  google.protobuf.Timestamp created_at = 6;
  // schedulable is false when the node is cordoned (spec.unschedulable).
  bool schedulable = 7;
  // evictable_pods is the count of ordinary (non-DaemonSet, non-mirror,
  // non-terminating) pods still on the node — the drain-progress signal.
  int32 evictable_pods = 8;
}

message ListClustersRequest {}

message ListClustersResponse {
  repeated Cluster clusters = 1;
}

message Cluster {
  // region is the grouping key (topology.kubernetes.io/region value); nodes
  // with no region label group under the empty region.
  string region = 1;
  int32 online = 2;
  int32 offline = 3;
}

// ProvisionStatus is derived from the provisioning Job's status.
enum ProvisionStatus {
  PROVISION_STATUS_UNSPECIFIED = 0;
  PROVISION_STATUS_PENDING = 1;     // Job created, not yet running
  PROVISION_STATUS_INSTALLING = 2;  // Job active (SSH + k3s install underway)
  PROVISION_STATUS_JOINED = 3;      // Job succeeded — node installed k3s and joined
  PROVISION_STATUS_FAILED = 4;      // Job failed
}

message AddNodeRequest {
  string hostname = 1;
  string ip = 2;
  int32 ssh_port = 3;   // 0 ⇒ 22
  string ssh_user = 4;
  // ssh_private_key is the PEM bootstrap key, used ONCE to install k3s. It is
  // never stored beyond the Job-owned Secret, never returned, never logged.
  bytes ssh_private_key = 5;
  // ssh_host_key is the TARGET's PUBLIC host key, in authorized_keys format —
  // the verbatim contents of its /etc/ssh/ssh_host_ed25519_key.pub, or a line
  // of `ssh-keyscan` output with the leading host field removed.
  //
  // IT AUTHENTICATES THE HOST TO US, which is the opposite direction from
  // ssh_private_key above, and it is required for the same reason that one is:
  // the join session pipes K3S_TOKEN — the cluster-admission credential — into
  // a shell on the far end. Without this the provisioner has no way to tell the
  // machine the operator meant from whatever answered the dial (an on-path
  // attacker, a stale DHCP or DNS lease, a reassigned IP, a mistyped octet),
  // and hands that token over in plaintext.
  //
  // Unlike ssh_private_key this is PUBLIC material: it needs no Secret, is safe
  // to log, and is safe to return. Whoever put the bootstrap key's public half
  // into the target's authorized_keys can read this off the same machine.
  string ssh_host_key = 6;
}

message AddNodeResponse {
  string provision_id = 1;
  ProvisionStatus status = 2;
}

message ListProvisionsRequest {}

message ListProvisionsResponse {
  repeated Provision provisions = 1;
}

message Provision {
  string id = 1;
  string hostname = 2;
  ProvisionStatus status = 3;
  string message = 4;  // failure reason when FAILED; empty otherwise
}

message TestConnectionRequest {
  string ip = 1;
  int32 ssh_port = 2;  // 0 ⇒ 22
}

message TestConnectionResponse {
  bool reachable = 1;
  int64 latency_ms = 2;  // dial latency when reachable; 0 otherwise
  string message = 3;    // dial error when unreachable; empty when reachable
}

message CordonRequest { string name = 1; }
message CordonResponse {}
message UncordonRequest { string name = 1; }
message UncordonResponse {}
message DrainRequest { string name = 1; }
message DrainResponse {}

message SetNodeRegionRequest {
  string name = 1;
  string region = 2;
}
message SetNodeRegionResponse {}

message SetVenueKeysRequest {
  string venue      = 1; // "okx" | "binance"
  string api_key    = 2;
  string api_secret = 3;
  string passphrase = 4; // OKX requires it; Binance must leave it empty
}
message SetVenueKeysResponse {
  // exchange_account_id is the exchange's own id for the account these credentials
  // spend, as the exchange itself reported it during the pre-write proof (S4b).
  // Empty when the deployment has no proof configured — the keys were written
  // unproven. It is a public fact (it is what a venue account label binds TO), never
  // key material.
  string exchange_account_id = 1;
}

message ListVenueKeysRequest {}
message ListVenueKeysResponse {
  repeated VenueKeyStatus venues = 1;
}
message VenueKeyStatus {
  string venue      = 1;
  bool   configured = 2; // presence only — NEVER key material
}

syntax = "proto3";

// gRPC interface for OUT-OF-PROCESS venue adapters (INFRA-M7a).
//
// Today the exchange connectors are compiled INTO the OMS behind build tags
// (services/oms/cmd/oms/venues_binance.go, `//go:build binance`). That puts
// third-party client code, request signing, and vendor websocket loops inside the
// address space of the process that owns order state. This interface moves them
// out: an adapter becomes its own deployment, reached over mTLS, and the OMS
// holds no vendor code at all.
//
// # Why this speaks order.v1 and not its own types
//
// The obvious shape for a venue RPC is a bespoke request — symbol, side, price,
// quantity — with its own field types. That shape is a trap here. Money, sizes,
// and prices in this platform are EXACT base-10 (common.v1.Decimal, backed by
// big.Rat); `double` is banned on any path that moves capital (KANZ_BRAIN,
// EVT-14). A hand-rolled venue message re-declares those fields, and every
// re-declaration is a chance to widen a decimal into a float or to invent a
// second encoding of "BUY".
//
// So the wire carries the platform's OWN types: OrderState in, Fill out. The
// decimals inside them are already common.v1.Decimal; side and order type are
// already enums that `buf breaking` guards. There is exactly one representation
// of a price in this system, and an adapter cannot introduce a second.
//
// It also keeps the adapter honest about what the OMS actually needs back. The
// OMS aggregate folds FILLS — it does not consume a status string. An adapter
// that reports "FILLED" without saying what filled, at what price, cannot drive
// the state machine.
package venue.v1;

import "order/v1/order.proto";
import "order/v1/order_events.proto";

// VenueAdapterService is one exchange, out of process. One adapter serves one venue;
// the OMS holds a client per MIC and routes by the MIC on the order.
//
// A MIC with no registered adapter is a HARD ERROR at the router — never a
// silent fall back to the simulator. An OMS that quietly simulates while
// believing it is trading is the worst failure this system has.
service VenueAdapterService {
  // Execute works the order and returns the fills it produced.
  //
  // Zero fills is a VALID, non-error response: a resting limit order that did
  // not trade. It leaves the order working. The error return is for "I could not
  // work this order", not "it did not fill" — conflating them either loses orders
  // or invents trades.
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);

  // CancelOrder withdraws a working order AT the exchange, addressed by
  // state.order_id — our deterministic clOrdId, the same identity the submit
  // used, so a cancel is idempotent at the venue.
  //
  // A nil (OK) response means the venue CONFIRMED the withdrawal. ANY error —
  // including an ambiguous timeout — means the close is still in flight and
  // belongs to the healing watchdog (EXEC-M4c). Never assume a cancel landed.
  // This is why the response carries no `success` field: a bool invites
  // `success=false` with an OK status, which is exactly the ambiguity the
  // healing seam exists to prevent.
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);

  // Describe reports WHO THIS ADAPTER IS: the venue it trades and, more
  // importantly, the EXCHANGE ACCOUNT its API credential belongs to.
  //
  // The account is the collateral boundary (EXEC-M16). An exchange margins, nets
  // and LIQUIDATES per account, so a fill posted against the wrong account's
  // ledger rows is not imprecise — it is wrong in the direction that spends
  // another fund's margin. The OMS used to learn the account from a string in its
  // own manifest (OMS_VENUE_ENDPOINTS="MIC/account=addr"), which means a typo
  // there posted fills to the wrong fund's books while the exchange debited the
  // right one, and NOTHING could see it: the OMS had no way to ask.
  //
  // The adapter is the only process that HOLDS the credential, so it is the only
  // one that can be asked. The OMS calls this at DIAL TIME and refuses to start
  // when the answer disagrees with what it was told — a mismatch is not a typo to
  // paper over, it is a false statement about whose money moves.
  rpc Describe(DescribeRequest) returns (DescribeResponse);

  // ListInstruments reports WHAT THIS ADAPTER CAN ACTUALLY TRADE: every canonical
  // instrument_id it holds a venue symbol for, with that symbol (#406).
  //
  // Nothing on this platform could enumerate the tradeable set. datamaster
  // answers GET /v1/securities/{id} and has no List; the gateway proxies the same
  // three single-key reads. So an operator could not answer "what can this
  // deployment trade?" without reading a manifest, and no UI could offer a choice
  // of pairs — which is the same un-askable-configuration problem Describe was
  // added to solve for the ACCOUNT, one field over.
  //
  // THIS REPORTS CONFIGURATION, NOT THE EXCHANGE'S CATALOGUE. The set is the
  // adapter's own symbol map (BINANCE_SYMBOLS / OKX_SYMBOLS), so every entry is a
  // pair this deployment can route today. Calling the exchange's exchangeInfo or
  // instruments endpoint instead would answer a DIFFERENT question — "what could
  // we trade if configured" — and would list pairs with no symbol mapping, which
  // a picker would then offer and admission would refuse. An operator reads that
  // refusal as a platform fault, so a pair the platform cannot route must never
  // appear here.
  rpc ListInstruments(ListInstrumentsRequest) returns (ListInstrumentsResponse);
}

message DescribeRequest {}

message DescribeResponse {
  // ISO 10383 venue code this adapter trades.
  string mic = 1;

  // The exchange account this adapter's API credential belongs to — the platform's
  // OWN name for the collateral pool (e.g. "binance-main", "okx-sub-1"), the same
  // identity stamped on every OrderState, Fill and LedgerEntry as venue_account_id.
  string account = 2;

  // Whether the EXCHANGE confirmed that this adapter's API key really belongs to
  // `account`, by answering with the account id below at startup.
  //
  // False means NOBODY has verified it: the adapter is asserting an account it was
  // configured with, and a mis-configured deployment is indistinguishable from a
  // correct one. It is a bool and not an enum because there are exactly two states
  // — the exchange said so, or nobody did.
  bool account_verified = 3;

  // The EXCHANGE'S OWN id for the account behind the credential (a Binance/OKX
  // uid), as reported by the exchange. This is what `account` is a label FOR: the
  // operator binds the two, and the adapter proves the binding against the venue.
  // Empty when unverified.
  string exchange_account_id = 4;

  // The order types this adapter can actually place at its exchange (#405).
  //
  // WHY THE ADAPTER HAS TO SAY, rather than the OMS assuming. order.v1 declares
  // MARKET, LIMIT, STOP and STOP_LIMIT, and the OMS validates and ADMITS all
  // four — but the spot adapters implement only the first two and refuse the
  // rest inside Execute. So a stop-loss was accepted, stored, and announced with
  // an ORDER_ACCEPTED FACT, and only then failed at the venue: risk carried
  // exposure for it and the caller had been told it was working, for the one
  // order type whose whole purpose is to act when nobody is watching.
  //
  // This is the same gap `account` above was added to close, one field over. The
  // OMS used to learn the account from a string in its own manifest because it
  // "had no way to ask"; it had no way to ask about capability either, and the
  // answer belongs to the process holding the credential.
  //
  // EMPTY MEANS "DID NOT SAY", NOT "SUPPORTS NOTHING". An adapter predating this
  // field returns nothing, and refusing every order for it would be a trading
  // outage caused by a schema addition. The OMS warns, counts it, and refuses
  // only when OMS_REQUIRE_ORDER_TYPE_SUPPORT is set — the same stance, for the
  // same reason, as OMS_REQUIRE_VERIFIED_ACCOUNT: a control is armed WITH the
  // list in hand, never as a default.
  repeated order.v1.OrderType supported_order_types = 5;

  // supported_time_in_force is which time-in-force instructions this adapter can
  // actually express (#486). Same contract as supported_order_types above, and
  // added for the same defect one field over.
  //
  // TIME-IN-FORCE WAS THE FOURTH INSTANCE OF #240/#405's DEFECT FAMILY, AND THE
  // WORST OF THEM. The earlier three produced an order that did NOTHING; this
  // one produced an order that did the WRONG THING. Both spot connectors sent a
  // hard-coded good-til-cancelled whatever the trader asked for, so an
  // IMMEDIATE-OR-CANCEL order RESTED at the exchange — a trader who asked to
  // hold no exposure was holding it, indefinitely, and nothing said so. A
  // FILL-OR-KILL could rest partially filled, which is the single outcome that
  // instruction exists to forbid.
  //
  // The connectors now carry it and REFUSE what they cannot express. This field
  // is what moves that refusal to admission, where an order that can never be
  // placed is rejected before it is stored and announced — which is exactly what
  // supported_order_types did for #405.
  //
  // EMPTY MEANS "DID NOT SAY", NOT "SUPPORTS NOTHING", for the same reason as
  // above: an adapter predating this field returns nothing, and refusing every
  // order for it would be a trading outage caused by a schema addition.
  repeated order.v1.TimeInForce supported_time_in_force = 6;

  // supported_margin_modes is which collateral regimes this adapter can actually
  // express (#417). Same contract as the two fields above, added for the FIFTH
  // instance of the same defect family.
  //
  // WHAT MAKES THIS ONE DIFFERENT FROM THE OTHER FOUR is that it was never
  // reached: internal/signal/translate refused leverage and margin_mode outright
  // because SubmitOrder had nowhere to carry them, so no levered order was ever
  // built to be silently downgraded. That refusal was right, and it was a
  // hardcode that could only say no — it could not say "OKX cannot, this other
  // venue can", because nothing described what an adapter can do.
  //
  // This field is what turns the answer into a capability contract. Both spot
  // connectors declare CASH only (`tdMode: cash` at OKX, /api/v3/order at
  // Binance) and refuse what they cannot express, and the OMS moves that refusal
  // to admission — where an order that can never be placed is rejected before it
  // is stored and announced, exactly as supported_order_types did for #405.
  //
  // EMPTY MEANS "DID NOT SAY", NOT "SUPPORTS NOTHING", for the same reason as
  // the two fields above: an adapter predating this field returns nothing, and
  // refusing every order for it would be a trading outage caused by a schema
  // addition. Unlevered spot is therefore always admissible.
  repeated order.v1.MarginMode supported_margin_modes = 7;
}

message ExecuteRequest {
  // Owning tenant (MT-01a). The adapter stamps it on anything it emits and
  // scopes its own credentials by it.
  string tenant_id = 1;
  // The order to work. Carries instrument, side, quantity, and limit price as
  // common.v1.Decimal — the platform's exact base-10 type.
  order.v1.OrderState state = 2;
}

message ExecuteResponse {
  // Fills produced, each strictly within the order's open quantity. Empty means
  // the order rests, unfilled — not an error.
  repeated order.v1.Fill fills = 1;
}

message CancelOrderRequest {
  string tenant_id = 1;
  // Addressed by state.order_id (the clOrdId used at submit).
  order.v1.OrderState state = 2;
}

// Deliberately empty. OK ⇒ the withdrawal is CONFIRMED; an error ⇒ the close is
// in flight. There is no third answer, so there is no field to carry one.
message CancelOrderResponse {}

message ListInstrumentsRequest {}

message ListInstrumentsResponse {
  // ISO 10383 venue code these instruments trade on — the same MIC Describe
  // reports, repeated here so an aggregated list cannot lose which venue an
  // entry came from.
  string mic = 1;

  // Every instrument this adapter is configured to trade, ordered by
  // instrument_id so the answer is stable between calls.
  //
  // EMPTY IS A REAL ANSWER AND A LOUD ONE: an adapter with no symbol map can
  // route nothing. It is not the same as an adapter that was never asked, and a
  // caller must not render the two the same way.
  repeated VenueInstrument instruments = 2;
}

// VenueInstrument is one tradeable pair as this adapter holds it.
message VenueInstrument {
  // The platform's canonical id, e.g. "BTC-USD". This is what an order carries.
  string instrument_id = 1;

  // What the EXCHANGE calls the same thing, e.g. "BTCUSDT" on Binance or
  // "BTC-USDT" on OKX.
  //
  // IT IS REPORTED BECAUSE IT DOES NOT ALWAYS AGREE WITH THE ID. The canonical
  // "BTC-USD" was mapped to a USDT-quoted symbol on both live venues — the
  // platform traded a stablecoin-quoted instrument while calling it USD, and
  // nothing in the data said so (#407).
  string venue_symbol = 2;

  // base_asset and quote_asset decompose the pair, DERIVED FROM venue_symbol
  // rather than from instrument_id (#407).
  //
  // THE SYMBOL IS THE SOURCE OF TRUTH AND THE ID IS A LABEL. The symbol is what
  // the adapter sends to the exchange, so it is what determines what is actually
  // bought; the id is what a human typed beside it in a symbol map. Deriving
  // these from the id would re-record the same claim in two more fields and
  // prove nothing.
  //
  // BOTH EMPTY MEANS "COULD NOT TELL", NEVER "NO QUOTE". A venue that uses its
  // own ticker for the asset (XBT for BTC) yields a symbol this platform cannot
  // decompose, and a confident wrong answer there would refuse a correctly
  // configured venue. A caller must not render empty as a fact about the pair.
  string base_asset = 3;
  string quote_asset = 4;

  // quote_mismatch is true when instrument_id CLAIMS one quote and venue_symbol
  // shows another — "BTC-USD" trading as BTCUSDT.
  //
  // IT IS ON THE WIRE BECAUSE IT IS A CORRECTNESS PROBLEM, NOT A COSMETIC ONE. A
  // USDT-quoted position carries USDT credit exposure; recording it as USD
  // assumes a peg this platform never states and cannot monitor, and
  // EXPOSURE_DIMENSION_CURRENCY then aggregates it into the USD bucket where a
  // concentration limit silently covers something else.
  //
  // False when the quote could not be determined at all — an unreadable symbol
  // is not evidence of a mismatch.
  bool quote_mismatch = 5;
}

// VenueQueryService is the OMS's read surface over every adapter it holds (#406).
//
// It is served by the OMS, not by an adapter. The OMS is the only component that
// dials all of them, so it is the only one that can answer "what can this
// DEPLOYMENT trade" rather than "what can this one venue trade" — and asking it
// costs no fan-out, because the OMS asked each adapter once at dial time and
// holds the answer.
//
// THAT ALSO KEEPS ONE UNREACHABLE VENUE FROM TAKING DOWN A LIST OF NAMES. A
// picker that fanned out to every adapter on every page load would fail whenever
// any one of them was restarting, for a screen that shows no prices and moves no
// capital.
service VenueQueryService {
  rpc ListTradeableInstruments(ListTradeableInstrumentsRequest) returns (ListTradeableInstrumentsResponse);
}

message ListTradeableInstrumentsRequest {}

message ListTradeableInstrumentsResponse {
  // Every pair this deployment can route, ordered by (instrument_id, mic).
  //
  // EMPTY MEANS THIS DEPLOYMENT CAN TRADE NOTHING, which is a real state — an
  // OMS running against the simulator, or one whose adapters hold no symbol map.
  // A caller must render it as that and never as "still loading".
  repeated TradeableInstrument instruments = 1;

  // The tenant that owns this deployment, as the deny-by-default authz input a
  // governed client checks the caller against. Empty fails CLOSED.
  string owner_tenant = 2;
}

// TradeableInstrument is one pair at one venue.
message TradeableInstrument {
  // The platform's canonical id — what an order carries.
  string instrument_id = 1;

  // What the exchange calls it. See VenueInstrument.venue_symbol.
  string venue_symbol = 2;

  // The venue this pair trades on. An order names a venue, so a pair without one
  // cannot be acted on.
  string mic = 3;

  // The pair, derived from venue_symbol — what is actually being bought and what
  // it is actually paid in. Both empty means the platform could not tell, which
  // a caller must not render as a fact. See VenueInstrument (#407).
  string base_asset = 4;
  string quote_asset = 5;

  // quote_mismatch says instrument_id disagrees with the exchange about the
  // quote asset. A pair picker MUST surface this: it is the difference between
  // buying dollars and buying a stablecoin, and the user choosing the pair is
  // the person who should know.
  bool quote_mismatch = 6;
}

version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  ignore_only:
    # inference.v1 deliberately transports the SAME payloads on the sync gRPC path
    # and the async streaming path — FeatureVector in, PredictionEnvelope out (see
    # that file's header). A FeatureVector logged from the streaming path replays
    # into this RPC without field migration. Renaming them to PredictRequest /
    # PredictResponse to satisfy the naming rule would BREAK that symmetry and the
    # wire compatibility of a published SDK, to gain nothing. The design is the
    # exception, so the exception is recorded here rather than the design bent.
    RPC_REQUEST_STANDARD_NAME:
      - proto/inference/v1/inference_service.proto
    RPC_RESPONSE_STANDARD_NAME:
      - proto/inference/v1/inference_service.proto
breaking:
  use:
    - FILE
  ignore_only:
    # PaymentFrequency MOVED to reference/v1/conventions.proto (#509); it was not
    # deleted. Same proto package, same fully-qualified name
    # (reference.v1.PaymentFrequency), same generated Go type — nothing on the
    # wire or in any SDK changes.
    #
    # The FILE category is stricter than wire compatibility on purpose: it treats
    # a declaration leaving a file as a break, because per-file generated output
    # matters in some languages. That stance is right in general and it forbids
    # EVERY structural fix here — moving the enum, hoisting BondTerms the other
    # way, or retyping BondTerms.coupon_frequency are all breaking under it. The
    # remaining alternatives were duplicating BondTerms into contract.proto, or
    # storing two message types in one column. Both trade a one-line exception
    # for a second definition of one concept, which is the thing AGENTS.md's
    # one-implementation rule exists to prevent.
    #
    # WHY THE MOVE WAS NEEDED: contract.proto had to import fixed_income.proto to
    # give ContractTerms a BOND variant, and fixed_income.proto imported
    # contract.proto for this enum. A cycle protoc rejects.
    #
    # THIS IS NARROWER THAN IT LOOKS, and that is what makes it acceptable. It
    # exempts ONE file from ENUM_NO_DELETE, and the enum's real home,
    # conventions.proto, carries no exception.
    #
    # Checked rather than assumed: deleting PaymentFrequency from
    # conventions.proto does not merely fail the breaking gate, it fails to
    # COMPILE — "cannot find `PaymentFrequency` in this scope" in all three files
    # that use it, before the breaking check runs at all. So the enum cannot
    # disappear while anything references it, which is a stronger guarantee than
    # the rule this exempts was providing. What is permitted is exactly the thing
    # that happened: one file no longer declaring an enum that still exists.
    ENUM_NO_DELETE:
      - proto/reference/v1/contract.proto

# LATENCY-01a — ephemeral load-test stack.
#
# The minimal slice of the platform needed to exercise the read path under
# load: NATS spine + risk-engine (in-memory state, gRPC query server) +
# api-gateway (auth/signing OFF, plaintext upstream). No Postgres/Kafka — the
# engine runs with in-memory state (RISK_ENGINE_DATABASE_URL unset ⇒ no
# bootstrap/snapshot) and re-derives everything from the seeded snapshot on the
# live spine. Seeded by `go run ./test/load/seed` (one PortfolioSnapshot for PF1).
#
# Build context is the repo ROOT (../../..): the service Dockerfiles COPY the
# generated kanz-schemas Go SDK (kanz-schemas/gen/go, EVT-15a generated-not-
# committed), so `buf generate` must run before `docker compose build`. See
# .github/workflows/latency.yml and README.md "CI gate".
#
#   docker compose -f kanz/test/load/docker-compose.yml up -d --build
#   (cd kanz && go run ./test/load/seed)
#   k6 run -e BASE_URL=http://localhost:8080 kanz/test/load/smoke.js
#   docker compose -f kanz/test/load/docker-compose.yml down -v
name: kanz-load

services:
  # NATS with JetStream — the live spine. Single node (replicas=1 stream), file
  # storage under a writable tmp dir. 8222 is the monitoring/health port.
  nats:
    image: nats:2.10-alpine
    command: ["--jetstream", "--store_dir=/tmp/nats", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  # One-shot stream provisioning: create the RISK stream ("risk.>") the engine
  # subscribes to and the seed publishes onto. nats-box has a shell (unlike the
  # distroless services), so it retries until NATS is reachable, then exits 0.
  # Mirrors infra/nats/bootstrap-job.yaml, replicas=1 for the single node.
  nats-init:
    image: natsio/nats-box:0.14.5
    depends_on:
      nats:
        condition: service_started
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        for i in $$(seq 1 30); do
          if nats --server nats://nats:4222 stream info RISK >/dev/null 2>&1; then
            echo "stream RISK already exists"; exit 0
          fi
          if nats --server nats://nats:4222 stream add RISK --defaults \
               --subjects="risk.>" --storage=file --retention=limits \
               --replicas=1 --discard=old --dupe-window=2m --max-age=24h; then
            echo "stream RISK created"; exit 0
          fi
          echo "waiting for nats ($$i)..."; sleep 2
        done
        echo "nats did not become ready"; exit 1

  # risk-engine: ingests the seeded snapshot from NATS into in-memory state and
  # serves the query.v1 gRPC API on :8081. Probes on :8082. Single tenant
  # (load-test) matches the seed's tenant_id.
  risk-engine:
    build:
      context: ../../..
      dockerfile: kanz/services/risk-engine/Dockerfile
    depends_on:
      nats-init:
        condition: service_completed_successfully
    environment:
      RISK_ENGINE_LISTEN: ":8082"
      RISK_ENGINE_GRPC_LISTEN: ":8081"
      RISK_ENGINE_NATS_URL: "nats://nats:4222"
      RISK_ENGINE_SOURCE: "risk-engine/load"
      RISK_ENGINE_TENANT: "load-test"
      RISK_ENGINE_LOG_LEVEL: "warn"
    ports:
      - "8082:8082"

  # api-gateway: the read surface under load. Auth, signing, and per-tenant
  # quotas are all unset ⇒ disabled (local/dev paths), so the smoke measures the
  # transcoding + forwarding hot path, not edge rejections. Plaintext upstream
  # (no SPIFFE socket).
  api-gateway:
    build:
      context: ../../..
      dockerfile: kanz/services/api-gateway/Dockerfile
    depends_on:
      risk-engine:
        condition: service_started
    environment:
      API_GATEWAY_LISTEN: ":8080"
      API_GATEWAY_RISK_ENGINE_ADDR: "risk-engine:8081"
      API_GATEWAY_SOURCE: "api-gateway/load"
      API_GATEWAY_LOG_LEVEL: "warn"
      # SEC-M1: the gateway no longer starts unauthenticated, so the harness must
      # authenticate — which is also the honest thing to measure, since the auth
      # middleware is in the hot path of every request production will ever serve.
      # Mint the TOKEN the k6 script sends (test/load/config.js):
      #
      #   TOKEN=$(go run ./cmd/kanz-devtoken --secret load-secret --tenant load-test) \
      #     k6 run test/load/smoke.js
      #
      # THE TENANT IS load-test, not PF1-anything. It must match SEED_TENANT in
      # test/load/seed and RISK_ENGINE_TENANT above, because the token's tenant
      # is the RLS scope the query runs under — a mismatched one authenticates
      # cleanly and then finds nothing, which reads as "the seed did not land".
      # PF1 is the PORTFOLIO id. This example said `--tenant PF1-tenant` and was
      # wrong on both counts.
      API_GATEWAY_JWT_SECRET: "load-secret"
      # Required since #242: the dev HS256 arm is not a valid configuration
      # without an explicit opt-in, so it cannot be reached by omitting the OIDC
      # issuer. See dev/docker-compose.yml for the failure that motivated it.
      API_GATEWAY_ALLOW_DEV_HS256: "true"
      API_GATEWAY_REQUIRED_ROLE: "kanz-user"
      # SEC-M2: only this role reaches POST /v1/orders. It MUST differ from the
      # baseline role above — the gateway refuses to start if they match, because
      # every authenticated caller carries the baseline one.
      API_GATEWAY_TRADE_ROLE: "kanz-trader"
    ports:
      - "8080:8080"

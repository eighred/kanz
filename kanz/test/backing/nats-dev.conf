# The DEV/CI broker's routing semantics (MT-02, #358/#360).
#
# Production isolates tenants by ACCOUNT: the gateway and webhook-ingest publish
# `tenant.<t>.order.order.submit` into __system__, and each tenant account
# imports its own prefix, remapping it back to the logical subject before any
# workload sees it (infra/nats/tenancy.yaml).
#
# THIS BROKER HAS NO ACCOUNTS — it is `nats:2 -js`, one account, no TLS — so
# none of that applies, and without the mapping below every order published by
# either service lands on a subject nothing subscribes. The OMS subscribes
# `order.order.submit`; the M1 loop certification and
# internal/signal/translate's integration test both go quiet, with the publish
# reporting success.
#
# The wildcard is the honest single-account equivalent of what __system__ does
# for itself: on a broker with one account, every tenant IS the same tenant.
# It does NOT weaken the isolation proof — that runs against the real
# multi-account config on the mTLS broker
# (pkg/bus/tenant_bridge_integration_test.go), which is the only place isolation
# can be proven at all.
port: 4222
jetstream: enabled
mappings = {
  "tenant.*.order.order.submit": "order.order.submit"
  "tenant.*.order.order.cancel": "order.order.cancel"
}

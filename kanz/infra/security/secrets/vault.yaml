---
# SEC-01d secrets backend — HashiCorp Vault.
#
# Bootstrap posture mirrors the NATS / SPIRE single-StatefulSet stance: 1
# replica on a PVC. The two production hardening knobs are wired here, not
# deferred, because they are what make Vault safe to run at all:
#
#   * KMS auto-unseal — the unseal key never exists as plaintext. Vault wraps
#     its root key with a cloud KMS key (seal "awskms"/"gcpckms"/"azurekeyvault"),
#     so a restarted pod unseals itself with no human-held key share. This is
#     also the same KMS root that backs the SPIRE UpstreamAuthority
#     (spire-upstream.yaml) — one managed root of trust for the whole platform.
#   * SPIFFE/JWT auth — workloads authenticate to Vault with their SPIFFE
#     JWT-SVID (SEC-01a's default_jwt_svid_ttl=5m), validated against the SPIRE
#     OIDC discovery endpoint. Secret access is gated on the SAME attested
#     identity as mTLS transport (SEC-01b), not a second static credential.
#
# HA (≥3 Raft peers) is a documented follow-up; the storage backend below is
# Integrated Storage (Raft) so scaling out is a replica bump, not a migration.
apiVersion: v1
kind: Namespace
metadata:
  name: vault
  labels:
    app.kubernetes.io/part-of: kanz
    # Vault is itself a mesh workload (mTLS to clients) — give it an SVID.
    kanz.internal/spiffe: enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: vault
  labels:
    app.kubernetes.io/part-of: kanz
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: vault
  labels:
    app.kubernetes.io/part-of: kanz
data:
  vault.hcl: |
    ui = false
    # Listener is TLS-only; the cert is the Vault pod's SPIFFE SVID delivered by
    # the spiffe-helper sidecar (same bridge SEC-01c uses for NATS/Kafka, which
    # aren't SPIFFE-aware). No plaintext listener.
    listener "tcp" {
      address       = "0.0.0.0:8200"
      tls_cert_file = "/run/spiffe/certs/tls.crt"
      tls_key_file  = "/run/spiffe/certs/tls.key"
      tls_client_ca_file = "/run/spiffe/certs/bundle.crt"
    }

    storage "raft" {
      path    = "/vault/data"
      node_id = "vault-0"
    }

    # Auto-unseal via cloud KMS — no Shamir key shares, no human unseal. Swap the
    # seal stanza for gcpckms / azurekeyvault on the matching cloud. Region/key
    # come from the pod's workload-identity env (IRSA / Workload Identity), so no
    # static cloud credentials live here either.
    seal "awskms" {
      kms_key_id = "alias/kanz-vault-unseal"
    }

    api_addr     = "https://vault.vault.svc:8200"
    cluster_addr = "https://vault.vault.svc:8201"
    disable_mlock = false
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  selector:
    app: vault
  ports:
    - { name: https, port: 8200, targetPort: 8200 }
    - { name: cluster, port: 8201, targetPort: 8201 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: vault
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  serviceName: vault
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
        app.kubernetes.io/part-of: kanz
    spec:
      serviceAccountName: vault
      shareProcessNamespace: true
      initContainers:
        # Fetch the first SVID before Vault's listener boots (SEC-01c pattern).
        - name: spiffe-helper-init
          image: ghcr.io/spiffe/spiffe-helper:0.8.0
          args: ["-config", "/run/spiffe/helper/helper.conf", "-daemon-mode=false"]
          volumeMounts:
            - { name: spiffe-helper-config, mountPath: /run/spiffe/helper, readOnly: true }
            - { name: spiffe-certs, mountPath: /run/spiffe/certs }
            - { name: spiffe-socket, mountPath: /run/spiffe, readOnly: true }
      containers:
        - name: vault
          image: hashicorp/vault:1.16.2
          args: ["server", "-config=/vault/config/vault.hcl"]
          ports:
            - { containerPort: 8200, name: https }
            - { containerPort: 8201, name: cluster }
          env:
            - { name: VAULT_ADDR, value: "https://127.0.0.1:8200" }
          livenessProbe:
            httpGet: { path: "/v1/sys/health?standbyok=true", port: 8200, scheme: HTTPS }
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: "/v1/sys/health?standbyok=true&sealedcode=204", port: 8200, scheme: HTTPS }
            initialDelaySeconds: 10
            periodSeconds: 5
          securityContext:
            capabilities: { add: ["IPC_LOCK"] }
          volumeMounts:
            - { name: vault-config, mountPath: /vault/config, readOnly: true }
            - { name: vault-data, mountPath: /vault/data }
            - { name: spiffe-certs, mountPath: /run/spiffe/certs, readOnly: true }
        # Sidecar: renew the SVID + reload Vault's TLS on rotation.
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.8.0
          args: ["-config", "/run/spiffe/helper/helper.conf"]
          volumeMounts:
            - { name: spiffe-helper-config, mountPath: /run/spiffe/helper, readOnly: true }
            - { name: spiffe-certs, mountPath: /run/spiffe/certs }
            - { name: spiffe-socket, mountPath: /run/spiffe, readOnly: true }
      volumes:
        - name: vault-config
          configMap: { name: vault-config }
        - name: spiffe-helper-config
          configMap: { name: vault-spiffe-helper }
        - name: spiffe-certs
          emptyDir: { medium: Memory }
        - name: spiffe-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
  volumeClaimTemplates:
    - metadata:
        name: vault-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
# spiffe-helper config: write the Vault SVID PEMs the listener reads above.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-spiffe-helper
  namespace: vault
  labels:
    app.kubernetes.io/part-of: kanz
data:
  helper.conf: |
    agent_address = "/run/spiffe/spire-agent.sock"
    cert_dir      = "/run/spiffe/certs"
    svid_file_name        = "tls.crt"
    svid_key_file_name    = "tls.key"
    svid_bundle_file_name = "bundle.crt"
    # SIGHUP Vault to reload TLS on each rotation (~30m half-life).
    cmd        = "kill"
    cmd_args   = "-HUP 1"
    renew_signal = ""

---
# SEC-01d secrets backend — HashiCorp Vault.
#
# Bootstrap posture mirrors the NATS / SPIRE single-StatefulSet stance: 1
# replica on a PVC. The two production hardening knobs are wired here, not
# deferred, because they are what make Vault safe to run at all:
#
#   * KMS auto-unseal — the unseal key never exists as plaintext. Vault wraps
#     its root key with a cloud KMS key (seal "awskms"/"gcpckms"/"azurekeyvault"),
#     so a restarted pod unseals itself with no human-held key share. This is
#     also the same KMS root that backs the SPIRE UpstreamAuthority
#     (spire-upstream.yaml) — one managed root of trust for the whole platform.
#   * Bounded Kubernetes auth — the CSI provider requests a short-lived token
#     for the consuming pod's ServiceAccount. Vault binds each role to the exact
#     namespace and ServiceAccount. SPIFFE remains the independent mTLS identity
#     boundary; Vault OSS does not claim unavailable native SPIFFE auth.
#
# HA (≥3 Raft peers) is a documented follow-up; the storage backend below is
# Integrated Storage (Raft) so scaling out is a replica bump, not a migration.
apiVersion: v1
kind: Namespace
metadata:
  name: vault
  labels:
    app.kubernetes.io/part-of: kanz
    # Vault is itself a mesh workload (mTLS to clients) — give it an SVID.
    kanz.internal/spiffe: enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: vault
  labels:
    app.kubernetes.io/part-of: kanz
---
# Vault validates audience-bound workload tokens through TokenReview. This
# standard aggregate role grants no Secret access and is bound only to Vault's
# own ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-tokenreview
  labels:
    app.kubernetes.io/part-of: kanz
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: vault
  labels:
    app.kubernetes.io/part-of: kanz
data:
  vault.hcl: |
    ui = false
    # Listener is TLS-only; the cert is the Vault pod's SPIFFE SVID delivered by
    # the spiffe-helper sidecar (same bridge SEC-01c uses for NATS/Kafka, which
    # aren't SPIFFE-aware). No plaintext listener.
    listener "tcp" {
      address       = "0.0.0.0:8200"
      tls_cert_file = "/run/spire/certs/tls.crt"
      tls_key_file  = "/run/spire/certs/tls.key"
      tls_client_ca_file = "/run/spire/certs/bundle.crt"
    }

    storage "raft" {
      path    = "/vault/data"
      node_id = "vault-0"
    }

    # spiffe-helper re-reads this file on every SVID renewal and signals the
    # exact Vault process. PID 1 belongs to the Kubernetes sandbox when process
    # namespace sharing is enabled and must never be assumed to be Vault.
    pid_file = "/vault/run/vault.pid"

    # Auto-unseal via cloud KMS — no Shamir key shares, no human unseal. Swap the
    # seal stanza for gcpckms / azurekeyvault on the matching cloud. Region/key
    # come from the EC2 instance profile. Only this host-networked pod can reach
    # IMDSv2 while the node hop limit remains 1; no static cloud credentials live
    # here or in a Kubernetes Secret.
    seal "awskms" {
      kms_key_id = "alias/kanz-vault-unseal"
    }

    api_addr     = "https://vault.vault.svc:8200"
    cluster_addr = "https://vault.vault.svc:8201"
    disable_mlock = false
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  selector:
    app: vault
  ports:
    - { name: https, port: 8200, targetPort: 8200 }
    - { name: cluster, port: 8201, targetPort: 8201 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: vault
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  serviceName: vault
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
        app.kubernetes.io/part-of: kanz
    spec:
      serviceAccountName: vault
      shareProcessNamespace: true
      # The EC2 node keeps IMDSv2 hop_limit=1. Vault alone joins the host network
      # to obtain the node role's narrowly scoped KMS credentials; ordinary pods
      # remain unable to reach instance metadata.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        # Local-path PVCs begin root-owned. Grant only Vault's data directory to
        # the non-root Vault UID; do not use a pod-wide fsGroup that weakens Raft
        # file modes and every other mounted volume.
        - name: vault-data-permissions
          image: hashicorp/vault:1.21.4@sha256:6c77f568e6b6310d5bc68befb5711b9215c574de7da489e7c24332581176888b
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              chown -R 100:1000 /vault/data &&
              find /vault/data -type d -exec chmod 0700 {} + &&
              find /vault/data -type f -exec chmod 0600 {} +
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
          volumeMounts:
            - { name: vault-data, mountPath: /vault/data }
        # Fetch the first SVID before Vault's listener boots (SEC-01c pattern).
        - name: spiffe-helper-init
          image: ghcr.io/spiffe/spiffe-helper:0.11.0@sha256:2759b3a699bb63b91cc5896f46cd6f70b9e3dfed9f7f4355a3a0a4e702984f9c
          args: ["-config", "/run/spire/helper/helper-init.conf", "-daemon-mode=false"]
          securityContext:
            runAsUser: 100
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - { name: spiffe-helper-config, mountPath: /run/spire/helper, readOnly: true }
            - { name: spiffe-certs, mountPath: /run/spire/certs }
            - { name: spiffe-socket, mountPath: /run/spire/socket, readOnly: true }
      containers:
        - name: vault
          image: hashicorp/vault:1.21.4@sha256:6c77f568e6b6310d5bc68befb5711b9215c574de7da489e7c24332581176888b
          # The official entrypoint injects -config=/vault/config. Passing a
          # second -config loads this HCL twice and creates two enabled seals.
          args: ["server"]
          ports:
            - { containerPort: 8200, name: https }
            - { containerPort: 8201, name: cluster }
          env:
            - { name: VAULT_ADDR, value: "https://127.0.0.1:8200" }
            - { name: AWS_REGION, value: "ap-northeast-1" }
            - { name: SKIP_CHOWN, value: "true" }
            - { name: SKIP_SETCAP, value: "true" }
          livenessProbe:
            # A sealed or not-yet-initialized process is alive but must remain
            # unready. Accept those states here; readiness below still excludes
            # the default uninitialized status (501).
            httpGet: { path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204", port: 8200, scheme: HTTPS }
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: "/v1/sys/health?standbyok=true&sealedcode=204", port: 8200, scheme: HTTPS }
            initialDelaySeconds: 10
            periodSeconds: 5
          securityContext:
            runAsUser: 100
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["IPC_LOCK"]
          volumeMounts:
            - { name: vault-config, mountPath: /vault/config, readOnly: true }
            - { name: vault-data, mountPath: /vault/data }
            - { name: vault-run, mountPath: /vault/run }
            - { name: spiffe-certs, mountPath: /run/spire/certs, readOnly: true }
        # Sidecar: renew the SVID + reload Vault's TLS on rotation.
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.11.0@sha256:2759b3a699bb63b91cc5896f46cd6f70b9e3dfed9f7f4355a3a0a4e702984f9c
          args: ["-config", "/run/spire/helper/helper.conf"]
          securityContext:
            runAsUser: 100
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - { name: spiffe-helper-config, mountPath: /run/spire/helper, readOnly: true }
            - { name: spiffe-certs, mountPath: /run/spire/certs }
            - { name: spiffe-socket, mountPath: /run/spire/socket, readOnly: true }
            - { name: vault-run, mountPath: /vault/run, readOnly: true }
      volumes:
        - name: vault-config
          configMap: { name: vault-config }
        - name: spiffe-helper-config
          configMap: { name: vault-spiffe-helper }
        - name: spiffe-certs
          emptyDir: { medium: Memory }
        - name: spiffe-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: vault-run
          emptyDir: { medium: Memory }
  volumeClaimTemplates:
    - metadata:
        name: vault-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
# spiffe-helper config: write the Vault SVID PEMs the listener reads above.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-spiffe-helper
  namespace: vault
  labels:
    app.kubernetes.io/part-of: kanz
data:
  helper-init.conf: |
    agent_address = "/run/spire/socket/spire-agent.sock"
    cert_dir      = "/run/spire/certs"
    svid_file_name        = "tls.crt"
    svid_key_file_name    = "tls.key"
    svid_bundle_file_name = "bundle.crt"
    cert_file_mode        = 0644
    key_file_mode         = 0600
  helper.conf: |
    agent_address = "/run/spire/socket/spire-agent.sock"
    cert_dir      = "/run/spire/certs"
    svid_file_name        = "tls.crt"
    svid_key_file_name    = "tls.key"
    svid_bundle_file_name = "bundle.crt"
    cert_file_mode        = 0644
    key_file_mode         = 0600
    # Re-read Vault's explicit PID file and signal that process on every SVID
    # rotation. Never infer a cross-container PID.
    pid_file_name = "/vault/run/vault.pid"
    renew_signal  = "SIGHUP"

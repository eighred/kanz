---
# SEC-01d closes the two plaintext-config follow-ups SEC-01a deferred on the
# SPIRE server:
#
#   1. KeyManager "disk" wrote the CA signing key to keys.json in plaintext on
#      the PVC — the last plaintext root key in the platform. Replaced by an
#      UpstreamAuthority backed by the SAME cloud KMS that auto-unseals Vault,
#      so the root never exists as recoverable plaintext and rotates in KMS.
#   2. DataStore "sqlite3" pinned the server to one replica. The postgres
#      datastore (reuse the PERS-01 / schema-registry cluster) unblocks HA; its
#      DSN is a CSI-mounted secret (the spire-server SecretProviderClass below),
#      never a plaintext connection_string in the ConfigMap.
#
# This is a drop-in replacement for the `plugins`/`KeyManager`/`DataStore`
# blocks in spire/spire-server.yaml — apply as a kustomize patch over that
# ConfigMap, then bump the StatefulSet to the secret mount + replicas >= 2.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-server-upstream
  namespace: spire-system
  labels:
    app.kubernetes.io/part-of: kanz
data:
  # Patch fragment: the production plugin set. CA TTLs stay as SEC-01a set them.
  plugins.conf: |
    plugins {
      DataStore "sql" {
        plugin_data {
          database_type = "postgres"
          # DSN read from the CSI-mounted file, not inlined here.
          connection_string = "${SPIRE_DB_DSN}"
        }
      }

      NodeAttestor "k8s_psat" {
        plugin_data {
          clusters = {
            "kanz" = { service_account_allow_list = ["spire-system:spire-agent"] }
          }
        }
      }

      # KMS-backed root: SPIRE's own CA is an intermediate signed by a key that
      # lives only in cloud KMS. No keys.json, no plaintext root on disk.
      UpstreamAuthority "awssecretsmanager" {
        plugin_data {
          region        = ""    # from the pod's workload-identity (IRSA)
          cert_file_arn = "arn:aws:secretsmanager:::secret:kanz/spire/upstream-ca-cert"
          key_file_arn  = "arn:aws:secretsmanager:::secret:kanz/spire/upstream-ca-key"
        }
      }

      KeyManager "memory" {}    # leaf keys in memory only; root is upstream/KMS
      Health {}
    }
---
# spire-server's own DSN secret — same CSI/Vault path as the app services.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: spire-server-db
  namespace: spire-system
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  provider: vault
  parameters:
    vaultAddress: "https://vault.vault.svc:8200"
    vaultAuthMountPath: "kubernetes"
    roleName: "spire-server"
    audience: "vault"
    vaultCACertPath: "/run/spire/bundle/bundle.crt"
    objects: |
      - objectName: "dsn"
        secretPath: "kv/data/kanz/spire-server"
        secretKey: "dsn"

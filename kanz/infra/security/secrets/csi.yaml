---
# SEC-01d delivery mechanism — Secrets Store CSI Driver + Vault provider.
#
# Secrets reach a pod as files on a tmpfs volume, NOT as Kubernetes Secret
# objects and NOT as env vars:
#   * a k8s Secret sits in etcd base64-encoded (plaintext at rest unless
#     etcd encryption + KMS is also configured) and is visible to anyone with
#     `get secret` RBAC;
#   * env vars leak into `/proc/<pid>/environ`, crash dumps, and child procs.
# A CSI tmpfs mount is scoped to the consuming pod, never persisted, and is
# torn down with the pod. The Go services read the file via the <VAR>_FILE
# convention (config.secret(), SEC-01d code change).
#
# The CSI driver CRDs are vendored in crds/. This DaemonSet, its RBAC and every
# image digest are kept together so a fresh cluster does not fetch mutable
# installation YAML at deploy time.
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: secrets-store.csi.k8s.io
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  podInfoOnMount: true
  attachRequired: false
  volumeLifecycleModes:
    - Ephemeral
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-store-csi-driver
  namespace: spire-system
  labels:
    app.kubernetes.io/part-of: kanz
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kanz-secrets-store-csi
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
  - apiGroups: ["secrets-store.csi.x-k8s.io"]
    resources: ["secretproviderclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["secrets-store.csi.x-k8s.io"]
    resources: ["secretproviderclasspodstatuses"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["secrets-store.csi.x-k8s.io"]
    resources: ["secretproviderclasspodstatuses/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resourceNames: ["secrets-store.csi.k8s.io"]
    resources: ["csidrivers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kanz-secrets-store-csi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kanz-secrets-store-csi
subjects:
  - kind: ServiceAccount
    name: secrets-store-csi-driver
    namespace: spire-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-csi-hmac
  namespace: spire-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["vault-csi-provider-hmac-key"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-csi-hmac
  namespace: spire-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-csi-hmac
subjects:
  - kind: ServiceAccount
    name: secrets-store-csi-driver
    namespace: spire-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: csi-secrets-store
  namespace: spire-system
  labels:
    app.kubernetes.io/part-of: kanz
    app: csi-secrets-store
spec:
  selector:
    matchLabels:
      app: csi-secrets-store
  template:
    metadata:
      labels:
        app: csi-secrets-store
        app.kubernetes.io/part-of: kanz
    spec:
      serviceAccountName: secrets-store-csi-driver
      containers:
        - name: secrets-store
          image: registry.k8s.io/csi-secrets-store/driver:v1.6.0@sha256:6f9dcaa06df8603b07145326cedbd8eb1802308730450a2de873172fca71ab3e
          args:
            - --endpoint=$(CSI_ENDPOINT)
            - --nodeid=$(KUBE_NODE_NAME)
            - --provider-volume=/etc/kubernetes/secrets-store-csi-providers
            # No periodic rotation poll: the Vault SVID is 5m and secrets are
            # pulled fresh on each pod (re)start. Long-lived rotation is the
            # provider's `--rotation-poll-interval`, enabled in the runbook.
          env:
            - { name: CSI_ENDPOINT, value: unix:///csi/csi.sock }
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef: { fieldPath: spec.nodeName }
          securityContext:
            privileged: true
          volumeMounts:
            - { name: socket-dir, mountPath: /csi }
            - { name: mountpoint-dir, mountPath: /var/lib/kubelet/pods, mountPropagation: Bidirectional }
            - { name: providers-dir, mountPath: /etc/kubernetes/secrets-store-csi-providers }
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.16.0@sha256:aeecba5b171b50558bab359fdb8e28b9da185f666cef35cd87ac9784e51956c5
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/csi-secrets-store/csi.sock
          volumeMounts:
            - { name: socket-dir, mountPath: /csi }
            - { name: registration-dir, mountPath: /registration }
        # Vault provider: uses the requesting pod's audience-bound Kubernetes
        # ServiceAccount token. Vault binds that identity to one narrow role.
        - name: vault-provider
          image: hashicorp/vault-csi-provider:1.7.4@sha256:3e5c5198f8c5b3020cf0cd49379123128c3022a2bc50e6cb034cd9b6f1f1e3a2
          args: ["--endpoint=/etc/kubernetes/secrets-store-csi-providers/vault.sock"]
          volumeMounts:
            - { name: providers-dir, mountPath: /etc/kubernetes/secrets-store-csi-providers }
            - { name: spire-bundle, mountPath: /run/spire/bundle, readOnly: true }
      volumes:
        - name: socket-dir
          hostPath: { path: /var/lib/kubelet/plugins/csi-secrets-store, type: DirectoryOrCreate }
        - name: mountpoint-dir
          hostPath: { path: /var/lib/kubelet/pods, type: DirectoryOrCreate }
        - name: registration-dir
          hostPath: { path: /var/lib/kubelet/plugins_registry, type: Directory }
        - name: providers-dir
          hostPath: { path: /etc/kubernetes/secrets-store-csi-providers, type: DirectoryOrCreate }
        - name: spire-bundle
          configMap: { name: spire-bundle }

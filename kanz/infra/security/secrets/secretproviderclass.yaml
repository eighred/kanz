---
# SEC-01d — one SecretProviderClass per (namespace, secret-consumer). It is the
# only place a secret's Vault path is named; the consuming pod just mounts the
# CSI volume and reads the file. Rotating the secret in Vault changes nothing
# here.
#
# The risk-engine + schema-registry Postgres DSN is the one genuine runtime
# secret in the platform today (everything else — peer auth, broker transport —
# is mTLS, where the SVID is the credential, so there is no password to store).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: risk-engine-db
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  provider: vault
  parameters:
    vaultAddress: "https://vault.vault.svc:8200"
    # Auth via the workload's SPIFFE JWT-SVID against the Vault `jwt` backend
    # (runbook step 4). The role's bound_subject = the consumer's SPIFFE ID, so
    # only the risk-engine SA can read this path — deny-by-default, same as the
    # SEC-01b AuthorizeServices allow-list.
    vaultAuthMountPath: "jwt-spiffe"
    role: "risk-engine"
    objects: |
      - objectName: "database-url"
        secretPath: "kv/data/kanz/risk-engine"
        secretKey: "dsn"
      # INFRA-M6a: the kanz-migrate initContainer's DDL-capable DSN, separate
      # from the app's non-superuser credential (same rationale as oms-db).
      - objectName: "migrate-database-url"
        secretPath: "kv/data/kanz/risk-engine"
        secretKey: "migrate_dsn"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: schema-registry-db
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  provider: vault
  parameters:
    vaultAddress: "https://vault.vault.svc:8200"
    vaultAuthMountPath: "jwt-spiffe"
    role: "schema-registry"
    objects: |
      - objectName: "database-url"
        secretPath: "kv/data/kanz/schema-registry"
        secretKey: "dsn"
      # INFRA-M6a: the kanz-migrate initContainer's DDL-capable DSN, separate from
      # the app's non-superuser credential.
      - objectName: "migrate-database-url"
        secretPath: "kv/data/kanz/schema-registry"
        secretKey: "migrate_dsn"
---
# The OMS order-store DSN (EXEC-M7c). This one is load-bearing for correctness,
# not just durability: order.Postgres is the admission gate that decides which
# delivery of an order reaches a live venue, and it only holds across replicas
# while the pods share a database. An OMS pod that cannot read this secret falls
# back to the in-memory store, whose gate is a process-local mutex — so a
# multi-replica OMS without this DSN double-trades. oms-deploy.yaml pins the two
# together.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: oms-db
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  provider: vault
  parameters:
    vaultAddress: "https://vault.vault.svc:8200"
    vaultAuthMountPath: "jwt-spiffe"
    role: "oms"
    objects: |
      - objectName: "database-url"
        secretPath: "kv/data/kanz/oms"
        secretKey: "dsn"
      # INFRA-M6a: the kanz-migrate initContainer's DSN. A SEPARATE credential
      # from the app's, deliberately: the OMS connects as a non-superuser (that
      # is what makes FORCE RLS apply to it), while migrations need rights to
      # create tables and policies. Keeping them apart means a leaked app
      # credential cannot run DDL.
      - objectName: "migrate-database-url"
        secretPath: "kv/data/kanz/oms"
        secretKey: "migrate_dsn"
---
# wealth: the durable store DSN (its postgres.go shipped in PARITY-02b and sat
# unused until nothing constructed it). Losing this secret is not a capital bug
# like the OMS's — the service degrades to the in-memory store — but it silently
# discards every write on restart, so it is wired the same way.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: wealth-db
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  provider: vault
  parameters:
    vaultAddress: "https://vault.vault.svc:8200"
    vaultAuthMountPath: "jwt-spiffe"
    role: "wealth"
    objects: |
      - objectName: "database-url"
        secretPath: "kv/data/kanz/wealth"
        secretKey: "dsn"
      - objectName: "migrate-database-url"
        secretPath: "kv/data/kanz/wealth"
        secretKey: "migrate_dsn"
---
# datamaster: the golden store + the pricing-oversight exception queue. Its
# postgres.go shipped with MASTER-01 and nothing ever constructed it, so every
# operator override — a named human's signed decision to accept a price the system
# had flagged — lived in a map and was destroyed by the next restart. Losing this
# secret degrades the service to that in-memory store, which means silently
# deleting a compliance record on a rolling update.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: datamaster-db
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  provider: vault
  parameters:
    vaultAddress: "https://vault.vault.svc:8200"
    vaultAuthMountPath: "jwt-spiffe"
    role: "datamaster"
    objects: |
      - objectName: "database-url"
        secretPath: "kv/data/kanz/datamaster"
        secretKey: "dsn"
      - objectName: "migrate-database-url"
        secretPath: "kv/data/kanz/datamaster"
        secretKey: "migrate_dsn"
---
# alternatives: the durable store DSN (its postgres.go shipped in PARITY-02b and sat

        secretPath: "kv/data/kanz/alternatives"
        secretKey: "migrate_dsn"
---
# venue-binance's own order view DB (INFRA-M7a-2). Losing it does not lose money
# directly, but it blinds the healing watchdog across a restart: the adapter can
# no longer enrich a fill for an order it worked, nor tell its reconciler what
# should be open at the exchange.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: venue-binance-db
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  provider: vault
  parameters:
    vaultAddress: "https://vault.vault.svc:8200"
    vaultAuthMountPath: "jwt-spiffe"
    role: "venue-binance"
    objects: |
      - objectName: "database-url"
        secretPath: "kv/data/kanz/venue-binance"
        secretKey: "dsn"
      - objectName: "migrate-database-url"
        secretPath: "kv/data/kanz/venue-binance"
        secretKey: "migrate_dsn"
---
# The Binance API key + secret. These are the most dangerous credentials in the
# platform: they move the fund's money at a real exchange. They exist in exactly
# one process now (venue-binance) instead of inside the OMS, which is the security
# half of why the connector was extracted at all.
#
# The role's bound_subject is the venue-binance SPIFFE ID, so ONLY that workload's
# ServiceAccount can read this path — deny-by-default (SEC-01b).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: venue-binance-keys
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  provider: vault
  parameters:
    vaultAddress: "https://vault.vault.svc:8200"
    vaultAuthMountPath: "jwt-spiffe"
    role: "venue-binance"
    objects: |
      - objectName: "api-key"
        secretPath: "kv/data/kanz/venue-binance"
        secretKey: "api_key"
      - objectName: "api-secret"
        secretPath: "kv/data/kanz/venue-binance"
        secretKey: "api_secret"
---
# venue-okx's own order view DB (INFRA-M7a-3). Same role as venue-binance's: lose
# it and the healing watchdog is blind across a restart.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: venue-okx-db
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz

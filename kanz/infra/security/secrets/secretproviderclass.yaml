  provider: vault
  parameters:
    vaultAddress: "https://vault.vault.svc:8200"
    vaultAuthMountPath: "jwt-spiffe"
    role: "venue-okx"
    objects: |
      - objectName: "database-url"
        secretPath: "kv/data/kanz/venue-okx"
        secretKey: "dsn"
      - objectName: "migrate-database-url"
        secretPath: "kv/data/kanz/venue-okx"
        secretKey: "migrate_dsn"
---
# The OKX API credentials. THREE of them: OKX signs with key + secret + a
# passphrase (OK-ACCESS-PASSPHRASE) chosen when the key was created. All three are
# required; a missing passphrase rejects every signed request.
#
# Like Binance's, these move the fund's money and now live in exactly one process.
# The role's bound_subject is the venue-okx SPIFFE ID, so ONLY that workload can
# read them — the OMS cannot, which is the security half of the extraction.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: venue-okx-keys
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  provider: vault
  parameters:
    vaultAddress: "https://vault.vault.svc:8200"
    vaultAuthMountPath: "jwt-spiffe"
    role: "venue-okx"
    objects: |
      - objectName: "api-key"
        secretPath: "kv/data/kanz/venue-okx"
        secretKey: "api_key"
      - objectName: "api-secret"
        secretPath: "kv/data/kanz/venue-okx"
        secretKey: "api_secret"
      - objectName: "api-passphrase"
        secretPath: "kv/data/kanz/venue-okx"
        secretKey: "api_passphrase"
---

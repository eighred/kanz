---
# Runtime network hardening (SEC-02a): default-deny + explicit allows for the
# kanz-services namespace. Zero-trust at the network layer to complement the
# zero-trust IDENTITY layer (SEC-01 mTLS/SPIFFE): even a compromised pod can only
# reach the few peers its function requires, and can only be reached by them.
#
# Ordering: NetworkPolicy is additive — a pod selected by ANY policy is
# default-deny for that direction except where a policy explicitly allows. The
# first policy below selects every pod and allows nothing, making the namespace
# deny-by-default; the rest open the minimum each flow needs. Requires a CNI that
# enforces NetworkPolicy (Cilium/Calico) — the kind the INFRA-01a cluster runs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  podSelector: {} # every pod
  policyTypes: [Ingress, Egress]
  # No ingress/egress rules ⇒ deny all in both directions until a policy allows.
---
# DNS is the one egress every pod needs (service discovery resolves the
# kanz-messaging / OTLP service names below). Allow only to kube-dns, only 53.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Every service talks to the messaging spine (NATS 4222, Kafka 9094) in
# kanz-messaging. Scope egress to that namespace + those ports only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-messaging-egress
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kanz-messaging
      ports:
        - { protocol: TCP, port: 4222 } # NATS
        - { protocol: TCP, port: 9094 } # Kafka
        # Redis (EXEC-M22): webhook-ingest's cross-pod replay defence, and the bus dedup.
        # It is spine infrastructure in the same namespace and the same trust class as NATS
        # and Kafka — a store every service may reach, none of which is a tenant boundary.
        - { protocol: TCP, port: 6379 } # Redis
---
# Telemetry: allow egress to the OTLP collector (OBS-01) on 4317. Scoped to the
# observability namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-otlp-egress
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kanz-observability
      ports:
        - { protocol: TCP, port: 4317 }
---
# The gateway → risk-engine gRPC query call (API-01c, over mTLS). The ONLY
# ingress risk-engine accepts on 8081, and only from the api-gateway pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-risk-engine
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  podSelector:
    matchLabels:
      app: risk-engine
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - { protocol: TCP, port: 8081 }
    # Prometheus scrape of /metrics (OBS-01) from the observability namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kanz-observability
      ports:
        - { protocol: TCP, port: 8081 }
  # The gateway → risk-engine egress half (the same flow, egress side on the
  # gateway pods).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-risk-engine-egress-from-gateway
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: risk-engine
      ports:
        - { protocol: TCP, port: 8081 }
---
# External clients reach the gateway through the ingress controller only. Allow
# ingress to api-gateway:8080 from the ingress-nginx namespace + scrape.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-gateway
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - { protocol: TCP, port: 8080 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kanz-observability
      ports:
        - { protocol: TCP, port: 8080 }
---
# EXEC-M15 — the trading loop's entry point. TradingView reaches webhook-ingest
# through the ingress controller and NOTHING else does. This is the pod-level half
# of the perimeter: webhook-ingest's own IP allowlist is checked against the
# connection peer, and behind an L7 Ingress the peer is always the nginx pod — so
# the peer check is expressed HERE, against pod identity, and the CLIENT-IP check
# lives on the Ingress (whitelist-source-range), the only layer that sees the client.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-webhook-ingest
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  podSelector:
    matchLabels:
      app: webhook-ingest
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - { protocol: TCP, port: 8090 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kanz-observability
      ports:
        - { protocol: TCP, port: 8090 }
---
# EXEC-M15 — the gateway's READ upstreams: tv-sync (the Broker API a TradingView
# chart reads to see the orders Kanz opened) and the Phase-7 services.
#
# THE NAMESPACE IS DEFAULT-DENY IN BOTH DIRECTIONS. Until this policy existed the
# gateway could reach exactly one peer — risk-engine — so every proxied route
# (/v1/households, /v1/securities, /v1/ask, and now /v1/broker/*) was DEAD at the
# network layer on any cluster with a CNI that enforces NetworkPolicy. It was not
# visible in kind: kindnetd does not enforce NetworkPolicy, so the policy set in this
# file has never actually been executed. test/arch/edge_test.go asserts every proxied
# upstream appears below — a check on the FILES, not on a running cluster.
#
# tv-sync accepts NOTHING but this. It trusts X-Kanz-Principal-Tenant and serves the
# named tenant's book, so the gateway being its only ingress is what makes that trust
# sound. It has no Ingress, and it must not get one.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-read-upstreams
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: tv-sync
      ports:
        - { protocol: TCP, port: 8091 }
    - to:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [wealth, datamaster, copilot]
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-tv-sync
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  podSelector:
    matchLabels:
      app: tv-sync
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - { protocol: TCP, port: 8091 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kanz-observability
      ports:
        - { protocol: TCP, port: 8091 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-phase7
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [wealth, datamaster, copilot]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - { protocol: TCP, port: 8080 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kanz-observability
      ports:
        - { protocol: TCP, port: 8080 }
---
# AI-M1 — who may ask the model.
#
# The inference service scores the risk engine's features. Nothing else on the platform has a
# reason to call it, and a prediction surface reachable by everything is a prediction surface
# whose callers nobody can enumerate. Deny-by-default holds: the namespace policy denies all,
# and this admits exactly one caller.
#
# The trading path is NOT here, and that is the point. A prediction is an observation, never
# an order: webhook-ingest and the OMS cannot reach this service, so a model cannot start or
# stop a trade even if it wanted to. The safety boundary is enforced by the network, not by a
# comment in a handler.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-risk-engine-to-inference
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  podSelector:
    matchLabels:
      app: inference
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: risk-engine
      ports:
        - { protocol: TCP, port: 50051 }

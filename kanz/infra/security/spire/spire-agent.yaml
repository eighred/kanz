---
# SPIRE agent config. One agent per node (DaemonSet). The agent attests to the
# server with a projected SA token, then issues + auto-rotates SVIDs to local
# workloads over the Workload API unix socket. The SPIFFE CSI driver mounts that
# socket read-only into each workload pod; SEC-01b's go-spiffe client dials it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-agent
  namespace: spire-system
  labels:
    app.kubernetes.io/part-of: kanz
data:
  agent.conf: |
    agent {
      data_dir    = "/run/spire/data"
      log_level   = "INFO"
      server_address = "spire-server"
      server_port    = "8081"
      trust_domain   = "kanz.internal"
      # Bundle bootstrapped from the controller-manager-published ConfigMap,
      # mounted at this path. After first contact the agent tracks rotation
      # automatically.
      trust_bundle_path = "/run/spire/bundle/bundle.crt"
      # Expose the Workload API on a host socket the CSI driver shares.
      socket_path = "/run/spire/agent-sockets/spire-agent.sock"
    }

    plugins {
      NodeAttestor "k8s_psat" {
        plugin_data {
          cluster = "kanz"
        }
      }

      # Workload attestation: derive selectors (ns, sa, pod labels) from the
      # kubelet so the server can match the ClusterSPIFFEID registration.
      WorkloadAttestor "k8s" {
        plugin_data {
          # Read pod info from the read-only kubelet port via the node's
          # in-cluster credentials.
          skip_kubelet_verification = true
        }
      }

      KeyManager "memory" {}

      Health {}
    }

    health_checks {
      listener_enabled = true
      bind_address     = "0.0.0.0"
      bind_port        = "8083"
      live_path        = "/live"
      ready_path       = "/ready"
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spire-agent
  namespace: spire-system
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  selector:
    matchLabels:
      app: spire-agent
  template:
    metadata:
      labels:
        app: spire-agent
        app.kubernetes.io/part-of: kanz
    spec:
      serviceAccountName: spire-agent
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        # Block until the server is reachable so the agent doesn't crash-loop
        # on a cold start.
        #
        # ghcr.io/spiffe/wait-for-it is not anonymously pullable (ghcr 403s the
        # token request), so a cluster without ghcr credentials could never start
        # the agent. A pinned busybox does the same TCP wait with an image that
        # pulls everywhere; the semantics (poll spire-server:8081, give up after
        # ~120s) are unchanged.
        - name: wait-for-server
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              for i in $(seq 1 120); do
                nc -z spire-server 8081 && exit 0
                sleep 1
              done
              echo "timed out waiting for spire-server:8081" >&2
              exit 1
      containers:
        - name: spire-agent
          image: ghcr.io/spiffe/spire-agent:1.9.6
          args: ["-config", "/run/spire/config/agent.conf"]
          livenessProbe:
            httpGet: { path: /live, port: 8083 }
            initialDelaySeconds: 15
            periodSeconds: 60
          readinessProbe:
            httpGet: { path: /ready, port: 8083 }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - { name: spire-config, mountPath: /run/spire/config, readOnly: true }
            - { name: spire-bundle, mountPath: /run/spire/bundle, readOnly: true }
            - { name: spire-agent-socket-dir, mountPath: /run/spire/agent-sockets }
            - { name: spire-token, mountPath: /var/run/secrets/tokens }
        # SPIFFE CSI driver: presents the agent socket as a CSI volume so
        # workloads mount it without a hostPath of their own.
        - name: spiffe-csi-driver
          image: ghcr.io/spiffe/spiffe-csi-driver:0.2.6
          # -node-id is required; the driver refuses to start without it
          # ("node ID is required"). It comes from the node the DaemonSet pod
          # landed on, via the downward API.
          env:
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          args:
            - "-node-id=$(MY_NODE_NAME)"
            - "-workload-api-socket-dir=/spire-agent-socket"
            - "-csi-socket-path=/spiffe-csi/csi.sock"
          securityContext:
            privileged: true
          volumeMounts:
            - { name: spire-agent-socket-dir, mountPath: /spire-agent-socket }
            - { name: spiffe-csi-socket-dir, mountPath: /spiffe-csi }
            - { name: mountpoint-dir, mountPath: /var/lib/kubelet/pods, mountPropagation: Bidirectional }
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.10.0
          args:
            - "--csi-address=/spiffe-csi/csi.sock"
            - "--kubelet-registration-path=/var/lib/kubelet/plugins/csi.spiffe.io/csi.sock"
          volumeMounts:
            - { name: spiffe-csi-socket-dir, mountPath: /spiffe-csi }
            - { name: kubelet-plugin-registration-dir, mountPath: /registration }
      volumes:
        - name: spire-config
          configMap: { name: spire-agent }
        - name: spire-bundle
          configMap:
            name: spire-bundle
            optional: true
        # Projected SA token audience-scoped to SPIRE for node attestation.
        - name: spire-token
          projected:
            sources:
              - serviceAccountToken:
                  path: spire-agent
                  expirationSeconds: 7200
                  audience: spire-server
        - name: spire-agent-socket-dir
          hostPath: { path: /run/spire/agent-sockets, type: DirectoryOrCreate }
        - name: spiffe-csi-socket-dir
          hostPath: { path: /var/lib/kubelet/plugins/csi.spiffe.io, type: DirectoryOrCreate }
        - name: mountpoint-dir
          hostPath: { path: /var/lib/kubelet/pods, type: Directory }
        - name: kubelet-plugin-registration-dir
          hostPath: { path: /var/lib/kubelet/plugins_registry, type: Directory }
---
# CSI driver registration object.
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: csi.spiffe.io
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  # SVID is per-pod ephemeral; no persistent volume semantics.
  attachRequired: false
  fsGroupPolicy: None
  volumeLifecycleModes:
    - Ephemeral

# DR-01b — Postgres primary clusters with continuous backup + PITR.
#
# The stateful Postgres databases as CloudNativePG clusters with continuous WAL
# archiving to a cross-region object store: PERS-01 risk state, the EVT-16 schema
# registry, the PARITY-02 books, and the OMS order store. Continuous WAL =
# point-in-time recovery (restore to any instant in the retention window), and it
# is the source the DR-region replica clusters (replica.yaml) replay from.
#
# This sentence said "the two stateful Postgres databases" while defining four.
# It was already wrong when kanz-books landed. The count is deliberately gone
# rather than corrected: the guard in test/arch/dr_postgres_coverage_test.go
# derives coverage from services/*/migrations on every run, so a number written
# here is a second answer that can only drift from it — and a DR document that
# disagrees with the estate is read during an incident, when nobody re-derives it.
#
# Why CloudNativePG: a K8s-native operator with built-in barman WAL archiving,
# PITR, and replica-cluster DR — no bespoke backup cron, and the same SVID/CSI
# secret pattern the services already use. A managed cloud Postgres (RDS/Cloud
# SQL) with cross-region read replicas + PITR is the equivalent if not self-
# hosting; the RPO/restore semantics documented in the README are identical.
#
# archive_timeout=30s bounds the object-store RPO to ≤30s even on an idle DB
# (a WAL segment is forced out at least that often); the streaming replica
# (replica.yaml) trails by far less. Both inside the DR-01e RPO ≤ 1min target.
#
# Secrets (SEC-01d, provided out-of-band, never in-repo):
#   kanz-dr-s3  — ACCESS_KEY_ID / SECRET_ACCESS_KEY for the backup bucket
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kanz-risk
  namespace: kanz-data
  labels: { app.kubernetes.io/part-of: kanz, app.kubernetes.io/component: dr }
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised
  postgresql:
    parameters:
      archive_timeout: "30s"   # RPO bound for the archived-WAL path
      wal_level: logical
  storage:
    size: 50Gi
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://kanz-dr-backups/risk
      s3Credentials:
        accessKeyId: { name: kanz-dr-s3, key: ACCESS_KEY_ID }
        secretAccessKey: { name: kanz-dr-s3, key: SECRET_ACCESS_KEY }
      wal: { compression: gzip }
      data: { compression: gzip }
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: kanz-risk-daily
  namespace: kanz-data
  labels: { app.kubernetes.io/part-of: kanz }
spec:
  schedule: "0 0 2 * * *"      # 02:00 daily base backup; WAL fills the gaps (PITR)
  backupOwnerReference: self
  cluster: { name: kanz-risk }
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kanz-registry
  namespace: kanz-data
  labels: { app.kubernetes.io/part-of: kanz, app.kubernetes.io/component: dr }
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised
  postgresql:
    parameters:
      archive_timeout: "30s"
  storage:
    size: 20Gi
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://kanz-dr-backups/registry
      s3Credentials:
        accessKeyId: { name: kanz-dr-s3, key: ACCESS_KEY_ID }
        secretAccessKey: { name: kanz-dr-s3, key: SECRET_ACCESS_KEY }
      wal: { compression: gzip }
      data: { compression: gzip }
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: kanz-registry-daily
  namespace: kanz-data
  labels: { app.kubernetes.io/part-of: kanz }
spec:
  schedule: "0 30 2 * * *"
  backupOwnerReference: self
  cluster: { name: kanz-registry }
---
# PARITY-02 durable book-of-record stores. One cluster hosts a database per
# service (accounting/IBOR ledger, alternatives/fund journal, wealth/household
# book, datamaster/golden records + exception queue) — all event-sourced or
# replace-on-write projections whose source of truth is the append-only journal,
# so the same continuous-WAL + daily-base-backup PITR contract the risk state
# uses applies unchanged. Migrations live in each service's migrations/ dir and
# are applied in lexical order at deploy (see services/*/migrations + the README).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kanz-books
  namespace: kanz-data
  labels: { app.kubernetes.io/part-of: kanz, app.kubernetes.io/component: dr }
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised
  postgresql:
    parameters:
      archive_timeout: "30s"   # RPO bound for the archived-WAL path
  storage:
    size: 50Gi
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://kanz-dr-backups/books
      s3Credentials:
        accessKeyId: { name: kanz-dr-s3, key: ACCESS_KEY_ID }
        secretAccessKey: { name: kanz-dr-s3, key: SECRET_ACCESS_KEY }
      wal: { compression: gzip }
      data: { compression: gzip }
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: kanz-books-daily
  namespace: kanz-data
  labels: { app.kubernetes.io/part-of: kanz }
spec:
  schedule: "0 0 3 * * *"      # 03:00 daily base backup; WAL fills the gaps (PITR)
  backupOwnerReference: self
  cluster: { name: kanz-books }
---
# The OMS order store — `orders`, `positions`, `position_fills`: the money path.
#
# Its own cluster, NOT a database inside kanz-books, and the reason is the
# restore, not the write volume. PITR is per-cluster: recovering an order book to
# an instant before a bad sweep rewinds EVERY database in the cluster to that
# instant. Sharing kanz-books would make "roll the order book back ten minutes"
# also roll back the IBOR ledger, the fund journal, the household book and the
# golden records — a correction to the trading path silently rewriting the books
# of record it feeds. Isolated, the blast radius of an order-store restore is the
# order store, and the ledger keeps whatever it had already recorded.
#
# It is also the store whose absence is silent: after a failover against an empty
# order store the OMS logs SweepInterrupted count=0, the same line a healthy
# clean start produces (#60). Backup here is what keeps that line honest.
#
# The DSN this cluster must serve is NOT set anywhere in this repository — it
# comes from Vault at kv/kanz/oms. See the README: declaring this cluster is not
# the same as the running OMS being bound to it (#59).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kanz-orders
  namespace: kanz-data
  labels: { app.kubernetes.io/part-of: kanz, app.kubernetes.io/component: dr }
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised
  postgresql:
    parameters:
      archive_timeout: "30s"   # RPO bound for the archived-WAL path
  storage:
    # 100Gi — twice kanz-books, and kanz-books holds four databases. position_fills
    # grows per execution, not per order, so it is the fastest-growing table in the
    # estate and it is append-only: no update path reclaims the space. Sizing it at
    # the ledger's 50Gi would put the highest-write store on the tightest headroom,
    # and a full volume on the order path stalls order acceptance, not a report.
    size: 100Gi
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://kanz-dr-backups/orders
      s3Credentials:
        accessKeyId: { name: kanz-dr-s3, key: ACCESS_KEY_ID }
        secretAccessKey: { name: kanz-dr-s3, key: SECRET_ACCESS_KEY }
      wal: { compression: gzip }
      data: { compression: gzip }
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: kanz-orders-daily
  namespace: kanz-data
  labels: { app.kubernetes.io/part-of: kanz }
spec:
  schedule: "0 30 3 * * *"     # 03:30 daily base backup; WAL fills the gaps (PITR)
  backupOwnerReference: self
  cluster: { name: kanz-orders }

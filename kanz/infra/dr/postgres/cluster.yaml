# DR-01b — Postgres primary clusters with continuous backup + PITR.
#
# The stateful Postgres databases as CloudNativePG clusters with continuous WAL
# archiving to a cross-region object store: PERS-01 risk state, the EVT-16 schema
# registry, the PARITY-02 books, the order path (OMS + the venue adapters), and
# the REG-02 compliance evidence chain. Continuous WAL = point-in-time recovery
# (restore to any instant in the retention window), and it is the source the
# DR-region replica clusters (replica.yaml) replay from.
#
# A cluster boundary here is a RESTORE-TIMELINE boundary, not a tidiness one:
# PITR rewinds every database in a cluster together. So things that must restore
# to the SAME instant share a cluster (the order path), and things that must be
# able to restore INDEPENDENTLY of each other do not (compliance evidence).
#
# This sentence said "the two stateful Postgres databases" while defining four.
# It was already wrong when kanz-books landed. The count is deliberately gone
# rather than corrected: the guard in test/arch/dr_postgres_coverage_test.go
# derives coverage from services/*/migrations on every run, so a number written
# here is a second answer that can only drift from it — and a DR document that
# disagrees with the estate is read during an incident, when nobody re-derives it.
#
# Why CloudNativePG: a K8s-native operator with built-in barman WAL archiving,
# PITR, and replica-cluster DR — no bespoke backup cron, and the same SVID/CSI
# secret pattern the services already use. A managed cloud Postgres (RDS/Cloud
# SQL) with cross-region read replicas + PITR is the equivalent if not self-
# hosting; the RPO/restore semantics documented in the README are identical.
#
# archive_timeout=30s bounds the object-store RPO to ≤30s even on an idle DB
# (a WAL segment is forced out at least that often); the streaming replica
# (replica.yaml) trails by far less. Both inside the DR-01e RPO ≤ 1min target.
#
# max_connections IS DERIVED PER CLUSTER, AND A GUARD RE-DERIVES IT (#228).
#
# No cluster here set it, so every one of them ran whatever the operator's default
# is. That is not "the default, which is fine": nothing in this repository pins a
# CloudNativePG version — no install manifest, no Helm chart, no terraform, only
# `apiVersion: postgresql.cnpg.io/v1` and the kubectl plugin in the runbooks — so
# the value that applied could not be read from here at all. Meanwhile no pool was
# sized either, and pgx defaults MaxConns to max(4, runtime.NumCPU()), which in a
# container with no CPU quota is the NODE's core count. Neither half fails at
# startup, because pools are lazy; the first symptom is `FATAL: sorry, too many
# clients already` on a QUERY, in whichever pod warmed last.
#
# The demand is a PARTITION, not the estate's total, and the cluster boundary
# above is exactly what partitions it: a service reaches only the cluster holding
# its own database. test/arch/pool_budget_test.go recomputes each one from
# infra/deploy plus internal/pg on every run —
#
#   ceiling(w) = max(spec.replicas, the KEDA ScaledObject's maxReplicaCount)
#   pools(w)   = pg.New*Pool calls in that service's composition root, routed to
#                the cluster of the database each one actually opens
#   need       = Σ ceiling(w) x pools(w) x pg.ServiceMaxConns(4)
#                + the largest single rolling update while at ceiling
#                + 13 reserved (superuser_reserved_connections, an operator, a DR
#                  restore, a human with psql)
#
# — giving, per cluster: risk 73, registry 25, books 129, orders 33,
# compliance 25. Each value below is that number with room, bounded above at 2x
# so it stays a decision rather than a shrug.
#
# EVERY VALUE MUST BE MIRRORED IN replica.yaml, and that is not tidiness. Postgres
# REFUSES to open a hot standby whose max_connections is below the primary whose
# WAL it replays ("hot standby is not possible because max_connections = 100 is a
# lower setting than on the primary server"). Raising a number here and not there
# does not degrade the DR region, it STOPS it — silently, in the region nobody
# watches, discovered at the failover. The guard relates the two files.
#
# NO MEMORY BLOCK IS ADDED WITH THESE, unlike the dev rig, and the reason is
# specific rather than an oversight: postgres-dev.yaml needed one because
# availability.yaml's LimitRange caps every kanz-services container at 1Gi, which
# 400 backends do not fit. These clusters are in kanz-data, and no LimitRange or
# ResourceQuota governs that namespace anywhere in this repository — so there is
# no default limit to OOM against — and the largest value below is 200. That these
# clusters declare no resources AT ALL is a real gap, but it is #231's shape and
# not this change's: sizing it needs measurement from a running estate.
#
# Secrets (SEC-01d, provided out-of-band, never in-repo):
#   kanz-dr-s3  — ACCESS_KEY_ID / SECRET_ACCESS_KEY for the backup bucket
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kanz-risk
  namespace: kanz-data
  labels: { app.kubernetes.io/part-of: kanz, app.kubernetes.io/component: dr }
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised
  postgresql:
    parameters:
      archive_timeout: "30s"   # RPO bound for the archived-WAL path
      wal_level: logical
      # risk-engine only. Its SECOND pool (the market-data price store) does NOT
      # land here — it reads price_observations, which is another service's
      # database — so this cluster is charged ONE pool at risk-engine's KEDA
      # ceiling of 12, not two. need 73.
      max_connections: "100"
  storage:
    size: 50Gi
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://kanz-dr-backups/risk
      s3Credentials:
        accessKeyId: { name: kanz-dr-s3, key: ACCESS_KEY_ID }
        secretAccessKey: { name: kanz-dr-s3, key: SECRET_ACCESS_KEY }
      wal: { compression: gzip }
      data: { compression: gzip }
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: kanz-risk-daily
  namespace: kanz-data
  labels: { app.kubernetes.io/part-of: kanz }
spec:
  schedule: "0 0 2 * * *"      # 02:00 daily base backup; WAL fills the gaps (PITR)
  backupOwnerReference: self
  cluster: { name: kanz-risk }
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kanz-registry
  namespace: kanz-data
  labels: { app.kubernetes.io/part-of: kanz, app.kubernetes.io/component: dr }
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised
  postgresql:
    parameters:
      archive_timeout: "30s"
      # schema-registry only. need 25 — a registry read is a point lookup, and the
      # service is pinned at replicas: 2 with no ScaledObject raising its ceiling.
      max_connections: "40"
  storage:
    size: 20Gi
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://kanz-dr-backups/registry
      s3Credentials:
        accessKeyId: { name: kanz-dr-s3, key: ACCESS_KEY_ID }
        secretAccessKey: { name: kanz-dr-s3, key: SECRET_ACCESS_KEY }
      wal: { compression: gzip }
      data: { compression: gzip }
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: kanz-registry-daily
  namespace: kanz-data
  labels: { app.kubernetes.io/part-of: kanz }
spec:
  schedule: "0 30 2 * * *"
  backupOwnerReference: self
  cluster: { name: kanz-registry }
---
# PARITY-02 durable book-of-record stores, plus the TradingView fact log. One
# cluster hosts a database per service (accounting/IBOR ledger, alternatives/fund
# journal, wealth/household book, datamaster/golden records + exception queue,
# tv-sync/tv_facts) — all event-sourced or replace-on-write projections whose
# source of truth is the append-only journal, so the same continuous-WAL +
# daily-base-backup PITR contract the risk state uses applies unchanged.
# Migrations live in each service's migrations/ dir and are applied in lexical
# order at deploy (see services/*/migrations + the README).
#
# WHY tv-sync IS HERE AND NOT EXCLUDED. Its own comments call tv_facts
# rebuildable from the event log; the config does not support that after a region
# loss, and the difference only shows up when it is needed. Three settings decide
# it. The NATS EXECUTION stream carrying order.> has max_age 24h
# (infra/nats/bootstrap-job.yaml). Kafka DOES retain order.order for 30d
# (infra/kafka/topics-job.yaml, retention.ms=2592000000) — but the DR rebuild
# reads a bounded recent window of it: infra/dr/nats/rebuild-job.yaml sets
# NATS_REBUILD_SINCE=24h and order.order is not a STATE topic, so it takes the
# window rather than offset 0. At most 24h of the 30d log returns. And the
# rebuild's only sink is the BUS — it restores the spine; nothing re-drives this
# projection, and tv-sync's own Rehydrate reads tv_facts, which is circular when
# the table is empty. Per tenant it is worse: the rebuild job drains only the
# un-prefixed __system__ topics and exits 0 having replayed nothing for anyone
# else. No fill is persisted anywhere but here.
#
# WHY HERE AND NOT kanz-orders. tv_facts is the READ side: nothing on the order
# path reads it, so it has no transactional coupling to `orders` and must not
# share the money path's restore timeline in either direction — neither should a
# bad-sweep rewind of the order book drag the trader's view back, nor should a
# display-side correction touch the order book. It belongs with the other
# journal-derived projections, which is what this cluster already is.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kanz-books
  namespace: kanz-data
  labels: { app.kubernetes.io/part-of: kanz, app.kubernetes.io/component: dr }
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised
  postgresql:
    parameters:
      archive_timeout: "30s"   # RPO bound for the archived-WAL path
      # accounting, alternatives, wealth, datamaster and tv-sync — three of which
      # KEDA scales to 8. The largest demand in the estate outside the dev rig at
      # need 129, and the ONE number here that the postgres:16 default of 100 would
      # not have covered had the operator's default matched it.
      max_connections: "200"
  storage:
    # 75Gi — 50Gi was sized for the four book-of-record databases, whose tables
    # are ledgers and replace-on-write projections: they grow per business event
    # and the projections rewrite in place. tv_facts is different in kind — one
    # append-only row per order FACT (seven subjects are folded), carrying the
    # marshaled payload, with no delete path — so it is the first table here that
    # only ever grows. Adding it without moving the number would be the silent
    # kind of change this file exists to prevent. The figure is a growth budget,
    # not a measurement: revisit it when real fact volume exists.
    size: 75Gi
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://kanz-dr-backups/books
      s3Credentials:
        accessKeyId: { name: kanz-dr-s3, key: ACCESS_KEY_ID }
        secretAccessKey: { name: kanz-dr-s3, key: SECRET_ACCESS_KEY }
      wal: { compression: gzip }
      data: { compression: gzip }
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: kanz-books-daily
  namespace: kanz-data
  labels: { app.kubernetes.io/part-of: kanz }
spec:
  schedule: "0 0 3 * * *"      # 03:00 daily base backup; WAL fills the gaps (PITR)
  backupOwnerReference: self
  cluster: { name: kanz-books }
---
# THE ORDER PATH. One database per service, as kanz-books does:
#
#   oms            — `orders`, `positions`, `position_fills` (the money path)
#   venue-binance  — `venue_orders` (the adapter's own order view)
#   venue-okx      — `venue_orders` (same schema, separate database)
#
# Its own cluster, NOT a database inside kanz-books, and the reason is the
# restore, not the write volume. PITR is per-cluster: recovering an order book to
# an instant before a bad sweep rewinds EVERY database in the cluster to that
# instant. Sharing kanz-books would make "roll the order book back ten minutes"
# also roll back the IBOR ledger, the fund journal, the household book and the
# golden records — a correction to the trading path silently rewriting the books
# of record it feeds. Isolated, the blast radius of an order-store restore is the
# order store, and the ledger keeps whatever it had already recorded.
#
# THE SAME PROPERTY IS WHY THE VENUE ADAPTERS BELONG *IN* HERE RATHER THAN IN
# CLUSTERS OF THEIR OWN. `venue_orders` is not an independent store: the OMS
# admits an order at its own primary key and only THEN calls the adapter, which
# writes the row that ties the exchange order back to it (see
# services/venue-*/migrations/0001_venue_orders.sql). The two writes are one
# logical transaction on the order path. Because PITR is per-cluster, separate
# clusters would mean separate restore timelines — restore `orders` to T while
# `venue_orders` sits at T' and you get orphan venue mappings, or, worse, orders
# with no mapping back to the exchange order at all. That mapping is exactly what
# the idempotency and recovery path reads: the user-data websocket delivers an
# execution report carrying only a clOrdId, and without the row there is nothing
# to enrich it from and nothing to tell the reconciler what should be open. One
# cluster is one timeline, so the order path restores coherently or not at all.
#
# It is also the store whose absence is silent: after a failover against an empty
# order store the OMS logs SweepInterrupted count=0, the same line a healthy
# clean start produces (#60). Backup here is what keeps that line honest.
#
# The DSNs this cluster must serve are NOT set anywhere in this repository — they
# come from Vault at kv/kanz/oms, kv/kanz/venue-binance and kv/kanz/venue-okx.
# See the README: declaring this cluster is not the same as the running services
# being bound to it (#59).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kanz-orders
  namespace: kanz-data
  labels: { app.kubernetes.io/part-of: kanz, app.kubernetes.io/component: dr }
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised
  postgresql:
    parameters:
      archive_timeout: "30s"   # RPO bound for the archived-WAL path
      # oms, venue-binance and venue-okx. Small because the order path is PINNED —
      # no ScaledObject targets any of the three, so the ceiling is the replica
      # count. need 33. The money path is the least connection-hungry cluster here,
      # which is worth knowing before anyone raises it "to be safe".
      max_connections: "50"
  storage:
    # 100Gi — twice kanz-books, and kanz-books holds four databases. position_fills
    # grows per execution, not per order, so it is the fastest-growing table in the
    # estate and it is append-only: no update path reclaims the space. Sizing it at
    # the ledger's 50Gi would put the highest-write store on the tightest headroom,
    # and a full volume on the order path stalls order acceptance, not a report.
    # The two venue_orders databases add one replace-on-write row per order (their
    # PK is (tenant_id, order_id) and `state` is updated in place), so they add
    # roughly the order count, not the execution count — a second-order term next
    # to position_fills, which is why the figure is unchanged.
    size: 100Gi
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://kanz-dr-backups/orders
      s3Credentials:
        accessKeyId: { name: kanz-dr-s3, key: ACCESS_KEY_ID }
        secretAccessKey: { name: kanz-dr-s3, key: SECRET_ACCESS_KEY }
      wal: { compression: gzip }
      data: { compression: gzip }
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: kanz-orders-daily
  namespace: kanz-data
  labels: { app.kubernetes.io/part-of: kanz }
spec:
  schedule: "0 30 3 * * *"     # 03:30 daily base backup; WAL fills the gaps (PITR)
  backupOwnerReference: self
  cluster: { name: kanz-orders }
---
# REG-02 compliance evidence — the regulatory service's `audit_chain_links`: the
# durable AUDIT-01 hash chain each filing signature is a position in.
#
# ITS OWN CLUSTER, AND DELIBERATELY NOT CO-LOCATED WITH ANYTHING IT ATTESTS TO.
# This is the one placement in this file argued from INDEPENDENCE rather than
# from coherence. Every other boundary here asks "what must restore together";
# this one asks "what must be able to restore SEPARATELY".
#
# audit_chain_links is evidence ABOUT the trading path and the books — each row
# is a filing's signature folded into its predecessor, plus the exact canonical
# bytes that were signed, so the chain is independently walk-verifiable
# (services/regulatory/migrations/0001_audit_links.sql). PITR is per-cluster, so
# putting it in kanz-orders or kanz-books would mean any point-in-time restore of
# the thing being attested to ALSO rewinds the attestation. Evidence that gets
# rewound whenever the thing it attests to gets rewound is not evidence: a chain
# that silently loses the links covering the rewound window cannot distinguish
# "those filings never happened" from "the record of them was rolled back", which
# is precisely the discrimination a tamper-evidence structure exists to make.
# Independent, the chain outlives the restore and the gap is visible in it.
#
# The same reason it must not be excluded: losing it does not corrupt the chain,
# it makes the chain UNVERIFIABLE, and the canonical signed bytes exist nowhere
# else — there is no upstream to re-derive them from, so this store is not
# rebuildable at any price.
#
# The DSN this cluster must serve is NOT set anywhere in this repository — it
# comes from Vault at kv/kanz/regulatory (#59). See the README.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kanz-compliance
  namespace: kanz-data
  labels: { app.kubernetes.io/part-of: kanz, app.kubernetes.io/component: dr }
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised
  postgresql:
    parameters:
      archive_timeout: "30s"   # RPO bound for the archived-WAL path
      # regulatory only, and filings are periodic per fund rather than per
      # execution. need 25.
      max_connections: "40"
  storage:
    # 20Gi — the registry's size, not the order path's, because the write RATE is
    # per FILING: FRTB, Form PF, AIFMD, TCFD and SFDR are periodic per-fund
    # submissions (services/regulatory/internal/server/server.go), orders of
    # magnitude below anything driven by executions or events.
    #
    # It is a GROWTH BUDGET rather than a steady state, and that is the part to
    # revisit: the table is append-only with no delete path by construction (a
    # deleted link breaks the chain), and each row carries the filing's full
    # canonical bytes, so it only ever grows. Revisit this number when real filing
    # volume exists; the estate has none yet, so a larger figure here would be a
    # guess wearing more digits.
    size: 20Gi
  backup:
    # 30d, unchanged from every other cluster here — and NOT a regulatory
    # record-retention window. This is how far back PITR can restore TO. The
    # long-horizon regulatory retention window is explicitly the lakehouse's job,
    # not a retention setting on the operational plane: see
    # infra/deploy/lake-sink-deploy.yaml:9-14 ("P&L-since-inception, the
    # regulatory retention window ... read the LAKEHOUSE, not the Kafka log's
    # retention window"). Nothing in this repository states a years-scale number,
    # so inventing one here would put a figure an auditor may act on into a file
    # whose author could not source it.
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://kanz-dr-backups/compliance
      s3Credentials:
        accessKeyId: { name: kanz-dr-s3, key: ACCESS_KEY_ID }
        secretAccessKey: { name: kanz-dr-s3, key: SECRET_ACCESS_KEY }
      wal: { compression: gzip }
      data: { compression: gzip }
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: kanz-compliance-daily
  namespace: kanz-data
  labels: { app.kubernetes.io/part-of: kanz }
spec:
  # 04:00, the next free slot after risk 02:00 / registry 02:30 / books 03:00 /
  # orders 03:30 — the 30-minute spacing keeps base backups from contending for
  # the same object-store bandwidth, which is why the slot is picked rather than
  # shared. LAST is also the right ORDER for this one specifically: the evidence
  # chain is backed up AFTER the stores it attests to, so its snapshot covers at
  # least everything already captured in theirs. Backing it up first would produce
  # the one combination worth avoiding — books restored to a state the chain has
  # no link for.
  schedule: "0 0 4 * * *"      # 04:00 daily base backup; WAL fills the gaps (PITR)
  backupOwnerReference: self
  cluster: { name: kanz-compliance }

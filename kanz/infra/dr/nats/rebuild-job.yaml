# DR-01c — NATS spine reconstruction.
#
# After a region failover the DR NATS cluster is empty (NATS is the short-
# retention live tier, not a system of record). This Job rebuilds the live spine
# from the DR-replicated Kafka log of record (DR-01a): it drains a bounded recent
# window of each log-of-record topic back onto the LIVE subjects, then exits.
# Re-runnable — the stream dedup window + idempotent handlers make a partial
# rebuild safe to repeat.
#
# Order in the DR cutover (DR-01d): (1) NATS up + streams provisioned
# (bootstrap-job), (2) THIS Job, (3) start consumers. Kafka is read plaintext
# in-cluster (kafka:9092); NATS publish is SEC-01c mTLS (the rebuild's SVID).
#
# Scope is TENANT x TOPIC: NATS_REBUILD_TENANTS crossed with NATS_REBUILD_TOPICS
# (issue #93). A requested tenant whose topics are not in Kafka fails the Job
# rather than draining nothing and exiting 0.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nats-rebuild
  namespace: kanz-messaging
  labels:
    app.kubernetes.io/part-of: kanz
    app.kubernetes.io/component: dr
imagePullSecrets:
  - name: ghcr-pull
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nats-rebuild
  namespace: kanz-messaging
  labels:
    app: nats-rebuild
    app.kubernetes.io/part-of: kanz
    app.kubernetes.io/component: dr
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: nats-rebuild
        app.kubernetes.io/part-of: kanz
    spec:
      serviceAccountName: nats-rebuild
      restartPolicy: Never
      containers:
        - name: nats-rebuild
          # Built from kanz/tools/natsrebuild/cmd/nats-rebuild/Dockerfile
          # (distroless static), by both build.yml's and release.yml's image
          # matrices — service: nats-rebuild is present in each. The :latest
          # tag below and its mutableTagExempt entry in
          # kanz/test/arch/supplychain_test.go retire together on the first
          # pin-digests run after a tagged release publishes this image's
          # digest.
          image: ghcr.io/eighred/nats-rebuild@sha256:70d5351ad3fcb0344f55659ca381dd9a551964e46fddb43dafc9efd6e80ec926
          env:
            - { name: NATS_REBUILD_KAFKA_BROKERS, value: "kafka:9092" }
            - { name: NATS_REBUILD_NATS_URL, value: "nats://nats:4222" }
            # THE ARCHIVER'S PRODUCED SET — what is in Kafka, and therefore the
            # only thing that can be rebuilt from it. Held to
            # infra/kafka/topics-job.yaml x the archiver's DefaultSubjects by
            # TestArchivedTopicConsumersMatchTheArchiverProducedSet; the same
            # guard holds lake-sink's LAKE_SINK_TOPICS to the same set.
            #
            # This list USED to be the pre-36a9ba1 dead table (market.equity,
            # execution.order, platform.model, data.market_stream, ...): eight
            # topics that do not exist and NOT ONE of the money path. A DR
            # rebuild would have restored no orders, no fills, no accounting,
            # no positions and no mandates, and exited 0.
            #
            # Not restored, each deliberately: market.book/market.crypto are
            # unarchived by design (highest volume, re-fetchable from the
            # venue), dlq.archiver holds poison messages that must never go
            # back on the live spine, and wealth/alternatives have no archiver
            # subscription so nothing was ever written to them.
            #
            # TENANT SCOPE: this list stays UN-PREFIXED. It is the archiver's
            # produced set as {domain}.{entity}, and the per-tenant Kafka topic
            # names are DERIVED from it x NATS_REBUILD_TENANTS below, using the
            # archiver's own rule (topic.go:61-64 — __system__ un-prefixed,
            # every other tenant "{tenant}.{domain}.{entity}"). A hand-written
            # prefixed list here would be a second copy of this table, which is
            # exactly how the pre-36a9ba1 dead table survived unnoticed.
            - { name: NATS_REBUILD_TOPICS, value: "order.order,order.cost,strategy.signal,optimization.proposal,accounting.balance,accounting.margin,settlement.instruction,compliance.breach,compliance.mandate,risk.portfolio,risk.position,platform.authz,platform.compliance,platform.mode,inference.feature,inference.prediction,data.feature,data.exception,platform.model" }
            # WHICH TENANTS TO RESTORE (issue #93). Each name is crossed with
            # the topic list above to produce the topics actually read:
            # __system__ -> order.order, acme -> acme.order.order, and so on,
            # matching what infra/kafka/tenancy.yaml provisions per tenant.
            #
            # This value is the DR SCOPE OF THE ESTATE, not a tuning knob. A
            # tenant absent from this list is a tenant whose archived topics
            # nothing replays after a region failover. Add an onboarded tenant
            # here as part of onboarding it, not after the failover.
            #
            # The un-prefixed __system__ default keeps the historical
            # single-tenant run byte-identical, so the DR runbook is unchanged
            # for the estate as it stands today.
            #
            # A tenant named here whose topics do not exist in Kafka now FAILS
            # the Job (exit 1, outcome=missing per topic). That is the fix: the
            # previous version of this comment said per-tenant reconstruction
            # was "a separate future capability" and the Job drained nothing for
            # a tenant while still exiting 0 — a rebuild that restored nothing
            # was indistinguishable from one that restored everything. A topic
            # that exists but held nothing in the window is a distinct,
            # non-fatal outcome=empty, logged at WARN per topic and rolled up
            # per tenant, so "quiet tenant" and "wrong NATS_REBUILD_SINCE" are
            # visible instead of hiding inside a zero.
            #
            # NATS subjects are NOT tenant-prefixed (infra/nats/bootstrap-job
            # binds order.>, market.>, …): tenancy rides in the envelope, so a
            # tenant's events republish onto the same live subjects with their
            # tenant_id intact.
            - { name: NATS_REBUILD_TENANTS, value: "__system__" }
            # COMPACTED STATE — read IN FULL, never through the time window.
            # Compaction keeps the latest record per key regardless of age, so
            # a mandate armed last week is older than any recent window and
            # would simply not come back. A mandate that does not come back is
            # a compliance control that returns DISARMED (topics-job.yaml says
            # so in writing). Must equal exactly the `compact` rows of the
            # derived set — the guard asserts it.
            - { name: NATS_REBUILD_STATE_TOPICS, value: "compliance.mandate,risk.position" }
            # The recent window for EVENT topics only. 24h matches the longest
            # live-tier max-age (infra/nats/README §Streams).
            - { name: NATS_REBUILD_SINCE, value: "24h" }
            # SEC-01c: SVID socket so NATS (verify:true) accepts the publisher.
            - { name: NATS_REBUILD_SPIFFE_SOCKET, value: "/run/spiffe/spire-agent.sock" }
          volumeMounts:
            - { name: spiffe, mountPath: /run/spiffe, readOnly: true }
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits: { memory: "1Gi" }
      volumes:
        - name: spiffe
          csi:
            driver: csi.spiffe.io
            readOnly: true

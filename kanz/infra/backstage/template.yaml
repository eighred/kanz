# Backstage software template (DEVX-01c): "Create a new Kanz service" from the
# portal. It runs the DEVX-01b scaffold generator (the same on-convention
# EVT-16a skeleton) and opens a PR — so a new service is one form, not a
# copy-paste-an-existing-service ritual. Register via catalog.locations.
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: kanz-service
  title: New Kanz service
  description: Scaffold an on-convention Kanz service (EVT-16a layout) and open a PR.
spec:
  owner: event-platform
  type: service
  parameters:
    - title: Service
      required: [name, owner]
      properties:
        name:
          title: Name
          type: string
          description: lowercase, dashes (e.g. risk-engine)
          pattern: '^[a-z][a-z0-9-]{1,30}[a-z0-9]$'
        owner:
          title: Owner
          type: string
          description: owning team (Backstage group)
          ui:field: OwnerPicker
          ui:options: { catalogFilter: { kind: Group } }
  steps:
    - id: fetch
      name: Clone repo
      action: fetch:plain
      input:
        url: https://github.com/kanz-eng/kanz.git

    # Runs `go run ./tools/scaffold/cmd/scaffold -name <name>` in the checkout —
    # the single source of truth for the skeleton (DEVX-01b).
    - id: scaffold
      name: Generate service
      action: run:command
      input:
        command: go
        args: ["run", "./kanz/tools/scaffold/cmd/scaffold", "-root", "./kanz", "-name", "${{ parameters.name }}"]

    - id: pr
      name: Open PR
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=kanz-eng&repo=kanz
        branchName: scaffold/${{ parameters.name }}
        title: "Scaffold ${{ parameters.name }} service (DEVX-01b)"
        description: "Generated by the Backstage `kanz-service` template."

  output:
    links:
      - title: Pull request
        url: ${{ steps.pr.output.remoteUrl }}

# INFRA-01b — app-of-apps via a matrix ApplicationSet: one Application per
# (environment × component). Adding a component = one list entry; adding an
# environment = one list entry.
#
# Components are the in-cluster k8s workloads (the data planes + delivery). The
# Terraform foundation (INFRA-01a) is NOT here, and Prometheus-rule/Grafana
# artifacts (infra/observability) ship as their own PrometheusRule/ConfigMap
# wrapping, not raw-synced.
#
# TWO SENTENCES WERE REMOVED FROM THIS HEADER BECAUSE THEY DESCRIBED A
# MECHANISM THAT WAS NEVER BUILT (#153). They said each env "carries its own
# destination cluster and a `valuesEnv` the component path can branch on (e.g.
# DR Postgres = replicas, not primaries)", and "The DR Postgres split is handled
# by the env branch."
#
# `valuesEnv` appeared nowhere in this file except that sentence. `{{.env}}`
# reaches only the Application's NAME and a LABEL — nothing functional branches
# on it — and infra/dr/ is not in the component list at all, so the DR Postgres
# split is applied by the runbook, by hand. The header was describing intent as
# though it were behaviour, which is the more expensive kind of wrong: it reads
# like a mechanism someone can rely on.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kanz
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  goTemplate: true
  generators:
    - matrix:
        generators:
          - list:
              elements:
                # ONE ENVIRONMENT, BECAUSE THERE IS ONE CLUSTER (#153).
                #
                # A second entry lived here — `{ env: dr, server:
                # "https://kubernetes.default.svc" }` — and that URL is the
                # cluster Argo CD is RUNNING IN. It was not a DR region; it was
                # the primary under a second name.
                #
                # The matrix crosses every env with every component, so it
                # produced kanz-primary-<component> AND kanz-dr-<component> from
                # the same `path` into the same `namespace`, both with
                # automated{prune,selfHeal}. Every workload in kanz-services,
                # kanz-messaging and the security tree was claimed by two
                # auto-syncing, auto-pruning Applications at once — each
                # entitled to prune what the other had just reconciled.
                #
                # Deleting it is the honest interim state, not a downgrade in
                # coverage. The `dr` Application never reconciled a DR region,
                # so nothing that exists stops existing; what stops is this file
                # asserting a topology the estate does not have. Per #98 the
                # only estate is a kind rig, so the entry could not yet have
                # been true.
                #
                # RESTORING IT TAKES THREE THINGS, NOT ONE: a real DR cluster
                # (#106); that cluster registered via `argocd cluster add` so
                # its API server URL is genuinely distinct from this one; and an
                # Argo CD IN the DR region to do the reconciling — a DR entry
                # reconciled from the primary's Argo is worth nothing during the
                # region loss it exists for. Until all three, failover.sh keeps
                # the explicit `kubectl scale` #149 left it: manual scaling is
                # load-bearing precisely because no reconciler runs in the
                # failed region.
                #
                # Removal is safe to apply: the template sets no
                # `resources-finalizer.argocd.argoproj.io`, so deleting the
                # kanz-dr-* Applications does not cascade to their resources.
                # kanz-primary-* already manages those same objects and keeps
                # doing so.
                - { env: primary, server: "https://kubernetes.default.svc" }
          - list:
              elements:
                - { component: messaging-nats, path: kanz/infra/nats, namespace: kanz-messaging }
                - { component: messaging-kafka, path: kanz/infra/kafka, namespace: kanz-messaging }
                # MT-02: per-tenant OMS compute (infra/deploy/tenants/<tenant>/
                # oms-<tenant>.yaml) is plain, rendered YAML under this same tree —
                # directory.recurse below picks it up for free. No separate
                # generator, no kustomize, no ArgoCD-side flag: what is in git is
                # exactly what deploys. See internal/tenantgen's package doc.
                - { component: workloads, path: kanz/infra/deploy, namespace: kanz-services }
                - { component: security, path: kanz/infra/security, namespace: kanz-services }
  template:
    metadata:
      name: "kanz-{{.env}}-{{.component}}"
      labels:
        app.kubernetes.io/part-of: kanz
        kanz.io/environment: "{{.env}}"
    spec:
      project: kanz
      source:
        repoURL: https://github.com/eighred/kanz.git
        targetRevision: main
        path: "{{.path}}"
        directory:
          recurse: true
          # Templated/instructional manifests are applied by their own tooling
          # (tenantctl, smoke tests), not raw-synced.
          #
          # EXCLUDE BY NAME, NEVER BY `*-job.yaml` (#92). That glob was here, and it
          # selected exactly the wrong files. `bootstrap-job.yaml` — the SPIFFE
          # bootstrap that CREATES EVERY JETSTREAM STREAM — ends in `-job.yaml`, so
          # GitOps never applied it: the spine's provisioning was a command a human
          # had to remember, which is the "no re-provisioning path" half of #92.
          # Meanwhile `bootstrap-job-dev-plaintext.yaml` does NOT end in `-job.yaml`,
          # so the glob let it through — and it is the one file here whose own header
          # says "NEVER apply this to a cluster that has SPIRE". The pattern excluded
          # the manifest that must be applied and admitted the one that must not.
          #
          # A name-shaped rule cannot express "is this safe to sync"; only the list
          # can. test/arch asserts every Job in a synced path is either a re-runnable
          # hook or named here, so a new one cannot inherit the old silence.
          #
          # postgres-dev.yaml and rig-dev-secrets.yaml are the rig's two DEV-ONLY
          # manifests (#224). Their headers already said "do not apply to any cluster
          # that trades real money" and test/arch already pinned that they carry
          # kanz.eighred.com/posture: dev-only — but nothing connected the label to
          # this list, so both were inside a recursive sync with prune + selfHeal.
          # The moment a real cluster is registered (#98) that sync stands up a
          # postgres/postgres database in the TRADING namespace, labelled
          # app: postgres — which is exactly the selector allow-postgres-egress and
          # allow-services-to-postgres grant every pod in that namespace — and
          # applies the gateway's committed HS256 signing secret beside the gateway,
          # self-healing both back if anyone deletes them.
          #
          # TestEveryDevOnlyManifestIsExcludedFromGitOpsSync now derives this
          # requirement from the label itself, for every ApplicationSet and every
          # path, so a third dev-only manifest cannot be added without appearing here.
          exclude: "{tenancy.yaml,smoke-test.sh,bootstrap-job-dev-plaintext.yaml,postgres-dev.yaml,rig-dev-secrets.yaml}"
      destination:
        server: "{{.server}}"
        namespace: "{{.namespace}}"
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true

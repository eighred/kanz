# INFRA-01b — the Argo CD project that scopes what the kanz GitOps may deploy.
# Deny-by-default in spirit (matches the AUTH-01b/MT-01c posture): an allowlist
# of source repo, destination namespaces, and cluster-scoped kinds the platform
# legitimately installs — so a compromised or fat-fingered Application can't sync
# arbitrary cluster resources.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kanz
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  description: Kanz platform
  sourceRepos:
    - https://github.com/eighred/kanz.git
  destinations:
    - { server: "*", namespace: kanz-services }
    - { server: "*", namespace: kanz-messaging }
    - { server: "*", namespace: kanz-data }
    # kanz-observability, NOT observability (#625). This entry read
    # `observability` from the day it was written, while every manifest in
    # infra/observability declares `kanz-observability` — node-exporter.yaml's
    # Namespace, and apply-rules.sh's own `-n`.
    #
    # Nothing compared the two, because nothing had ever tried to sync that tree:
    # an AppProject destination is consulted only when an Application targets it,
    # and until #625 none did. Argo CD REFUSES a destination outside this list, so
    # the component would never have synced — and the only place that says so is
    # Argo's own UI, not this repository.
    #
    # TestEveryComponentNamespaceIsAllowedByTheAppProject now compares every
    # component's namespace against this list, so the pair cannot drift again.
    - { server: "*", namespace: kanz-observability }
  clusterResourceWhitelist:
    - { group: "", kind: Namespace }
    - { group: rbac.authorization.k8s.io, kind: ClusterRole }
    - { group: rbac.authorization.k8s.io, kind: ClusterRoleBinding }
    - { group: scheduling.k8s.io, kind: PriorityClass }
  namespaceResourceWhitelist:
    - { group: "*", kind: "*" } # within the allowed namespaces, the platform owns everything

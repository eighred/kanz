# INFRA-01b — the Argo CD project that scopes what the kanz GitOps may deploy.
# Deny-by-default in spirit (matches the AUTH-01b/MT-01c posture): an allowlist
# of source repo, destination namespaces, and cluster-scoped kinds the platform
# legitimately installs — so a compromised or fat-fingered Application can't sync
# arbitrary cluster resources.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kanz
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  description: Kanz platform
  sourceRepos:
    - https://github.com/kanz-eng/kanz.git
  destinations:
    - { server: "*", namespace: kanz-services }
    - { server: "*", namespace: kanz-messaging }
    - { server: "*", namespace: kanz-data }
    - { server: "*", namespace: observability }
  clusterResourceWhitelist:
    - { group: "", kind: Namespace }
    - { group: rbac.authorization.k8s.io, kind: ClusterRole }
    - { group: rbac.authorization.k8s.io, kind: ClusterRoleBinding }
    - { group: scheduling.k8s.io, kind: PriorityClass }
  namespaceResourceWhitelist:
    - { group: "*", kind: "*" } # within the allowed namespaces, the platform owns everything

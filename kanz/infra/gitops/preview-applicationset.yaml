# DEVX-01d — ephemeral preview environments per PR, the GitOps-native way.
#
# Argo CD's PullRequest generator discovers open PRs labeled `preview` and
# materializes one Application per PR into its own namespace
# (kanz-preview-{number}), synced to the PR's head commit. When the PR is closed
# or the label removed, the generator drops the Application and `prune` tears the
# namespace down — so previews are automatically created AND destroyed, no
# teardown job to forget. Pair with .github/workflows/preview.yml, which builds
# the PR's images so the cluster has something to pull.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kanz-preview
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  goTemplate: true
  generators:
    - pullRequest:
        github:
          owner: eighred
          repo: kanz
          tokenRef:
            secretName: argocd-github-token
            key: token
        # Only PRs explicitly labeled `preview` get an environment — previews
        # cost cluster capacity, so they are opt-in, not every PR.
        filters:
          - labels: ["preview"]
        requeueAfterSeconds: 120
  template:
    metadata:
      name: "kanz-preview-{{.number}}"
      labels:
        app.kubernetes.io/part-of: kanz
        kanz.io/preview-pr: "{{.number}}"
    spec:
      project: kanz
      source:
        repoURL: https://github.com/eighred/kanz.git
        # Deploy the PR's code, not main.
        targetRevision: "{{.head_sha}}"
        path: kanz/infra/deploy
        directory:
          recurse: true
          # NOT the same list as the main app-of-apps, and it does not need to be:
          # this Application syncs only kanz/infra/deploy. Every entry here names a
          # file that is actually under that path, because an exclusion that names
          # nothing protects nothing while making the list look considered — and this
          # list was entirely that. `tenancy.yaml`, `smoke-test.sh` and `*-job.yaml`
          # matched no file under kanz/infra/deploy; they were kept as "a floor in
          # case one arrives", which is a claim nobody exercises and a preview
          # environment is exactly where nobody notices it went stale (#224).
          #
          # `*-job.yaml` was also the one shape #92 forbids outright: that glob
          # excluded bootstrap-job.yaml (which creates every JetStream stream) while
          # admitting bootstrap-job-dev-plaintext.yaml, whose header says never to
          # apply it to a cluster with SPIRE. It was inert here only by accident of
          # which files happen to live under this path — the main app-of-apps names
          # files, and so does this one now.
          #
          # What DOES need excluding are the rig's two DEV-ONLY manifests. Both pin
          # `namespace: kanz-services` in their own metadata, so a preview sync does
          # not put them in kanz-preview-<n> at all — it writes a postgres/postgres
          # database and the gateway's committed HS256 signing secret into the
          # TRADING namespace, from a per-PR Application with prune + selfHeal.
          exclude: "{postgres-dev.yaml,rig-dev-secrets.yaml}"
        kustomize:
          # Pin every image to the PR build (preview.yml pushes :pr-{number});
          # the namePrefix keeps preview objects from colliding cluster-wide.
          namePrefix: "pr-{{.number}}-"
          images:
            - "ghcr.io/eighred/risk-engine:pr-{{.number}}"
            - "ghcr.io/eighred/api-gateway:pr-{{.number}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "kanz-preview-{{.number}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true

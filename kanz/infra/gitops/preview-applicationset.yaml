# DEVX-01d — ephemeral preview environments per PR, the GitOps-native way.
#
# Argo CD's PullRequest generator discovers open PRs labeled `preview` and
# materializes one Application per PR into its own namespace
# (kanz-preview-{number}), synced to the PR's head commit. When the PR is closed
# or the label removed, the generator drops the Application and `prune` tears the
# namespace down — so previews are automatically created AND destroyed, no
# teardown job to forget. Pair with .github/workflows/preview.yml, which builds
# the PR's images so the cluster has something to pull.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kanz-preview
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  goTemplate: true
  generators:
    - pullRequest:
        github:
          owner: eighred
          repo: kanz
          tokenRef:
            secretName: argocd-github-token
            key: token
        # Only PRs explicitly labeled `preview` get an environment — previews
        # cost cluster capacity, so they are opt-in, not every PR.
        filters:
          - labels: ["preview"]
        requeueAfterSeconds: 120
  template:
    metadata:
      name: "kanz-preview-{{.number}}"
      labels:
        app.kubernetes.io/part-of: kanz
        kanz.io/preview-pr: "{{.number}}"
    spec:
      project: kanz
      source:
        repoURL: https://github.com/eighred/kanz.git
        # Deploy the PR's code, not main.
        targetRevision: "{{.head_sha}}"
        path: kanz/infra/deploy
        directory:
          recurse: true
          # NOT the same list as the main app-of-apps any more, and it does not need
          # to be: this Application syncs only kanz/infra/deploy, which contains no
          # Job, no tenancy.yaml and no smoke-test.sh — every pattern here matches
          # nothing. It is kept as a floor in case one arrives.
          #
          # The main app-of-apps dropped `*-job.yaml` because that glob excluded
          # bootstrap-job.yaml (which creates every JetStream stream) while admitting
          # bootstrap-job-dev-plaintext.yaml (#92). Neither file is under this path,
          # so the same glob is inert here rather than dangerous. The old comment
          # claimed these lists were identical, which stopped being true the moment
          # the main one was fixed — a preview environment is exactly where nobody
          # would notice a stale claim.
          exclude: "{tenancy.yaml,smoke-test.sh,*-job.yaml}"
        kustomize:
          # Pin every image to the PR build (preview.yml pushes :pr-{number});
          # the namePrefix keeps preview objects from colliding cluster-wide.
          namePrefix: "pr-{{.number}}-"
          images:
            - "ghcr.io/eighred/risk-engine:pr-{{.number}}"
            - "ghcr.io/eighred/api-gateway:pr-{{.number}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "kanz-preview-{{.number}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true

---
# JetStream-enabled NATS server config. server_name is per-pod (env expansion);
# cluster routes are the stable headless-service DNS of the 3 replicas.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: kanz-messaging
data:
  nats.conf: |
    server_name: $POD_NAME
    listen: 0.0.0.0:4222
    http: 0.0.0.0:8222

    # SEC-01c: mutual TLS on the client listener. Certs are the broker's own
    # SPIRE SVID, written to /etc/nats-certs by the spiffe-helper sidecar and
    # rotated under it (SEC-01a). verify: true requires + verifies a client
    # cert chaining to the trust bundle — so a plaintext or untrusted client is
    # rejected at the TLS layer, and the peer's SPIFFE identity is authenticated.
    tls {
      cert_file: "/etc/nats-certs/svid.pem"
      key_file:  "/etc/nats-certs/svid_key.pem"
      ca_file:   "/etc/nats-certs/bundle.pem"
      verify: true
      # MT-01c: map the verified client cert's SPIFFE URI SAN to a NATS user, so
      # the connection lands in that user's tenant account (tenancy.yaml).
      verify_and_map: true
      timeout: 5
    }

    # MT-01c: per-tenant accounts + SYS/__system__ (mounted from the
    # nats-tenants ConfigMap). Path is relative to this file's dir (/etc/nats).
    include "tenants.conf"

    jetstream {
      store_dir: /data/jetstream
      max_memory_store: 256MB
      max_file_store: 10GB
    }

    cluster {
      name: kanz
      listen: 0.0.0.0:6222
      routes: [
        nats://nats-0.nats-headless.kanz-messaging.svc:6222
        nats://nats-1.nats-headless.kanz-messaging.svc:6222
        nats://nats-2.nats-headless.kanz-messaging.svc:6222
      ]
    }

    # Drain client connections gracefully on shutdown (see preStop hook).
    lame_duck_duration: 30s
---
# SEC-01c: dedicated ServiceAccount so the SPIRE ClusterSPIFFEID (SEC-01a)
# issues NATS its own identity — spiffe://kanz.internal/ns/kanz-messaging/sa/nats.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nats
  namespace: kanz-messaging
  labels:
    app.kubernetes.io/part-of: kanz
---
# spiffe-helper config: fetch the SVID from the agent socket (mounted by the
# SPIFFE CSI driver) and write PEM files NATS reads. In daemon mode it renews
# before expiry and signals NATS (SIGHUP ⇒ config reload) so rotation needs no
# restart; the init-container run (daemon_mode=false) blocks startup until the
# first SVID exists.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-spiffe-helper
  namespace: kanz-messaging
  labels:
    app.kubernetes.io/part-of: kanz
data:
  helper.conf: |
    agent_address       = "/run/spiffe/spire-agent.sock"
    cert_dir            = "/etc/nats-certs"
    svid_file_name      = "svid.pem"
    svid_key_file_name  = "svid_key.pem"
    svid_bundle_file_name = "bundle.pem"
    # On renewal, reload NATS in the shared process namespace.
    cmd       = "nats-server"
    cmd_args  = "--signal reload"
    # REQUIRED whenever cmd (or pid_file_name) is set: spiffe-helper 0.9.0 — the tag
    # pinned on both containers below — validates this at STARTUP, in daemon mode and
    # init mode alike, and exits 1 with "Must specify renew_signal when using cmd or
    # pid_file_name". Without it the init container CrashLoopBackOffs and NATS never
    # starts, so the whole bus is down; the failure is a config rejection and looks
    # nothing like one from the pod's perspective.
    #
    # SIGHUP is what nats-server reloads on. There is no pid_file_name here, so this
    # signal is not itself delivered to anything — cmd above is what performs the
    # reload. It is the value the validator demands and the one that is correct if a
    # pid_file_name is ever added.
    renew_signal = "SIGHUP"
---
# Headless service: stable per-pod DNS for cluster routes. publishNotReadyAddresses
# lets peers resolve each other before JetStream reports ready.
apiVersion: v1
kind: Service
metadata:
  name: nats-headless
  namespace: kanz-messaging
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: nats
  ports:
    - { name: client, port: 4222 }
    - { name: cluster, port: 6222 }
    - { name: monitor, port: 8222 }
---
# Client-facing service. Producers/consumers connect here (nats://nats:4222).
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: kanz-messaging
spec:
  selector:
    app: nats
  ports:
    - { name: client, port: 4222, targetPort: 4222 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: kanz-messaging
spec:
  serviceName: nats-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      terminationGracePeriodSeconds: 45
      serviceAccountName: nats
      # SEC-01c: shared PID namespace lets the spiffe-helper sidecar signal
      # nats-server to reload certs on SVID rotation.
      shareProcessNamespace: true
      initContainers:
        # Block startup until the first SVID is written, so the TLS listener
        # has certs the moment nats-server boots.
        - name: spiffe-helper-init
          image: ghcr.io/spiffe/spiffe-helper:0.9.0
          args: ["-config", "/etc/spiffe-helper/helper.conf", "-daemon-mode=false"]
          volumeMounts:
            - { name: spiffe-helper-config, mountPath: /etc/spiffe-helper, readOnly: true }
            - { name: nats-certs, mountPath: /etc/nats-certs }
            - { name: spiffe, mountPath: /run/spiffe, readOnly: true }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: nats
      containers:
        - name: nats
          image: nats:2.10-alpine
          args: ["--config=/etc/nats/nats.conf"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - { name: client, containerPort: 4222 }
            - { name: cluster, containerPort: 6222 }
            - { name: monitor, containerPort: 8222 }
          volumeMounts:
            # Both nats.conf and tenants.conf arrive here from one PROJECTED volume
            # (see `config` below). They must share a directory: nats.conf resolves
            # `include "tenants.conf"` relative to its own location, which is the
            # same shape test/mtls/up.sh reproduces when it extracts the two files
            # side by side.
            - { name: config, mountPath: /etc/nats }
            - { name: data, mountPath: /data }
            - { name: nats-certs, mountPath: /etc/nats-certs, readOnly: true }
          livenessProbe:
            httpGet: { path: "/healthz", port: 8222 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: "/healthz?js-enabled-only=true", port: 8222 }
            initialDelaySeconds: 5
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["nats-server", "--signal", "ldm=1"]
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { memory: "1Gi" }
        # SEC-01c: keeps the SVID renewed + reloads NATS on rotation.
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.9.0
          args: ["-config", "/etc/spiffe-helper/helper.conf"]
          volumeMounts:
            - { name: spiffe-helper-config, mountPath: /etc/spiffe-helper, readOnly: true }
            - { name: nats-certs, mountPath: /etc/nats-certs }
            - { name: spiffe, mountPath: /run/spiffe, readOnly: true }
      volumes:
        # PROJECTED, not two volumes. nats.conf does `include "tenants.conf"`, which
        # NATS resolves relative to nats.conf's own directory — so both files have to
        # land in /etc/nats.
        #
        # The obvious way to do that fails: mounting `config` as a directory at
        # /etc/nats and then subPath-mounting tenants.conf INSIDE it asks runc to bind
        # a file onto a path that does not exist in the parent (a read-only ConfigMap
        # volume projects only its own keys). The kubelet reports
        #   error mounting ... to rootfs at "/etc/nats/tenants.conf": not a directory
        # and the nats container CrashLoopBackOffs — a message that describes the
        # mount machinery rather than the manifest, and reads like a corrupt image.
        #
        # A projected volume merges both ConfigMaps into ONE directory, so each file
        # is a real entry rather than an overlay. tenancy.yaml still owns nats-tenants
        # (tenant provisioning rewrites it); this only changes how it is delivered.
        - name: config
          projected:
            sources:
              - configMap:
                  name: nats-config
              - configMap:
                  name: nats-tenants
        - name: spiffe-helper-config
          configMap:
            name: nats-spiffe-helper
        # Shared cert dir written by spiffe-helper, read by nats. Memory-backed
        # so private keys never touch disk.
        - name: nats-certs
          emptyDir:
            medium: Memory
        # SEC-01a SPIFFE CSI volume — presents the agent Workload API socket.
        - name: spiffe
          csi:
            driver: csi.spiffe.io
            readOnly: true
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 12Gi
---
# Protect JetStream quorum during voluntary disruptions (node drains, upgrades).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nats
  namespace: kanz-messaging
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: nats

---
# JetStream-enabled NATS server config. server_name is per-pod (env expansion);
# cluster routes are the stable headless-service DNS of the 3 replicas.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: kanz-messaging
data:
  nats.conf: |
    server_name: $POD_NAME
    listen: 0.0.0.0:4222
    http: 0.0.0.0:8222

    # SEC-01c: mutual TLS on the client listener. Certs are the broker's own
    # SPIRE SVID, written to /etc/nats-certs by the spiffe-helper sidecar and
    # rotated under it (SEC-01a). verify: true requires + verifies a client
    # cert chaining to the trust bundle — so a plaintext or untrusted client is
    # rejected at the TLS layer, and the peer's SPIFFE identity is authenticated.
    tls {
      cert_file: "/etc/nats-certs/svid.pem"
      key_file:  "/etc/nats-certs/svid_key.pem"
      ca_file:   "/etc/nats-certs/bundle.pem"
      verify: true
      # MT-01c: map the verified client cert's SPIFFE URI SAN to a NATS user, so
      # the connection lands in that user's tenant account (tenancy.yaml).
      verify_and_map: true
      timeout: 5
    }

    # MT-01c: per-tenant accounts + SYS/__system__ (mounted from the
    # nats-tenants ConfigMap). Path is relative to this file's dir (/etc/nats).
    include "tenants.conf"

    jetstream {
      store_dir: /data/jetstream
      max_memory_store: 256MB
      max_file_store: 10GB
    }

    cluster {
      name: kanz
      listen: 0.0.0.0:6222
      routes: [
        nats://nats-0.nats-headless.kanz-messaging.svc:6222
        nats://nats-1.nats-headless.kanz-messaging.svc:6222
        nats://nats-2.nats-headless.kanz-messaging.svc:6222
      ]
    }

    # Drain client connections gracefully on shutdown (see preStop hook).
    lame_duck_duration: 30s

    # The pid the spiffe-helper sidecar signals (SIGHUP) when it rotates the SVID, so
    # this server reloads its config and with it the TLS material in /etc/nats-certs.
    # Without this file the helper has no way to reach this process: it does not carry
    # the nats-server binary, only the shared process namespace. See the long comment
    # on pid_file_name in the nats-spiffe-helper ConfigMap for the outage this fixes.
    pid_file: "/var/run/nats/nats.pid"
---
# SEC-01c: dedicated ServiceAccount so the SPIRE ClusterSPIFFEID (SEC-01a)
# issues NATS its own identity — spiffe://kanz.internal/ns/kanz-messaging/sa/nats.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nats
  namespace: kanz-messaging
  labels:
    app.kubernetes.io/part-of: kanz
---
# spiffe-helper config: fetch the SVID from the agent socket (mounted by the
# SPIFFE CSI driver) and write PEM files NATS reads. In daemon mode it renews
# before expiry and signals NATS (SIGHUP ⇒ config reload) so rotation needs no
# restart; the init-container run (daemon_mode=false) blocks startup until the
# first SVID exists.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-spiffe-helper
  namespace: kanz-messaging
  labels:
    app.kubernetes.io/part-of: kanz
data:
  helper.conf: |
    agent_address       = "/run/spiffe/spire-agent.sock"
    cert_dir            = "/etc/nats-certs"
    svid_file_name      = "svid.pem"
    svid_key_file_name  = "svid_key.pem"
    svid_bundle_file_name = "bundle.pem"
    # On renewal, signal nats-server to reload so it picks up the new cert.
    #
    # BY PID, NOT BY BINARY. The previous shape here was cmd = "nats-server" with
    # cmd_args = "--signal reload", and it could never work in any environment:
    # `cmd` is exec'd INSIDE THIS CONTAINER, and the nats-server binary lives in the
    # nats container's filesystem. shareProcessNamespace (set on the pod below) shares
    # the PROCESS namespace, not the filesystem, so the lookup failed every time with
    #   Unable to signal process: exec: "nats-server": executable file not found in $PATH
    # while the line immediately above it cheerfully logged "X.509 certificates updated".
    #
    # The consequence was silent and severe: the helper rotated the SVID on disk every
    # ~28 minutes and nats-server went on serving the cert it loaded at boot. Roughly an
    # hour after any NATS restart that cert expired, and from then on EVERY NEW mTLS
    # connection to the bus was rejected while established ones kept working — so the
    # estate looked healthy and simply stopped being able to admit new workloads. It was
    # found after ~7 hours in that state, diagnosed from an unrelated-looking
    # CrashLoopBackOff in a freshly rolled api-gateway.
    #
    # pid_file_name needs no binary: the helper reads the pid and sends renew_signal to
    # it directly, which works across containers precisely BECAUSE the process namespace
    # is shared. nats-server writes that pid file (pid_file in nats.conf above) into the
    # nats-run volume, which both containers mount.
    pid_file_name = "/var/run/nats/nats.pid"
    # REQUIRED whenever cmd or pid_file_name is set: spiffe-helper 0.9.0 — the tag
    # pinned on both containers below — validates this at STARTUP, in daemon mode and
    # init mode alike, and exits 1 with "Must specify renew_signal when using cmd or
    # pid_file_name". Without it the init container CrashLoopBackOffs and NATS never
    # starts, so the whole bus is down; the failure is a config rejection and looks
    # nothing like one from the pod's perspective.
    #
    # SIGHUP is what nats-server reloads its config — and therefore its TLS material —
    # on. Unlike before, this signal is now actually delivered to something.
    renew_signal = "SIGHUP"

  # The INIT container gets its own config, deliberately WITHOUT pid_file_name.
  #
  # It runs once (-daemon-mode=false) to place the first SVID before nats-server starts,
  # so at that moment there is no pid file and no process to signal. Pointing it at one
  # would ask it to signal a pid that cannot exist yet — a startup-ordering failure in the
  # one component whose whole job is to make startup possible. Nothing to reload here: the
  # cert is being placed, not replaced.
  helper-init.conf: |
    agent_address       = "/run/spiffe/spire-agent.sock"
    cert_dir            = "/etc/nats-certs"
    svid_file_name      = "svid.pem"
    svid_key_file_name  = "svid_key.pem"
    svid_bundle_file_name = "bundle.pem"
---
# Headless service: stable per-pod DNS for cluster routes. publishNotReadyAddresses
# lets peers resolve each other before JetStream reports ready.
apiVersion: v1
kind: Service
metadata:
  name: nats-headless
  namespace: kanz-messaging
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: nats
  ports:
    - { name: client, port: 4222 }
    - { name: cluster, port: 6222 }
    - { name: monitor, port: 8222 }
---
# Client-facing service. Producers/consumers connect here (nats://nats:4222).
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: kanz-messaging
spec:
  selector:
    app: nats
  ports:
    - { name: client, port: 4222, targetPort: 4222 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: kanz-messaging
spec:
  serviceName: nats-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      terminationGracePeriodSeconds: 45
      serviceAccountName: nats
      # SEC-01c: shared PID namespace lets the spiffe-helper sidecar signal
      # nats-server to reload certs on SVID rotation.
      shareProcessNamespace: true
      initContainers:
        # Block startup until the first SVID is written, so the TLS listener
        # has certs the moment nats-server boots.
        - name: spiffe-helper-init
          image: ghcr.io/spiffe/spiffe-helper:0.9.0
          # helper-init.conf, not helper.conf: the one-shot fetch must not carry
          # pid_file_name — see that key's comment in the ConfigMap.
          args: ["-config", "/etc/spiffe-helper/helper-init.conf", "-daemon-mode=false"]
          volumeMounts:
            - { name: spiffe-helper-config, mountPath: /etc/spiffe-helper, readOnly: true }
            - { name: nats-certs, mountPath: /etc/nats-certs }
            - { name: spiffe, mountPath: /run/spiffe, readOnly: true }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: nats
      containers:
        - name: nats
          image: nats:2.10-alpine
          args: ["--config=/etc/nats/nats.conf"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - { name: client, containerPort: 4222 }
            - { name: cluster, containerPort: 6222 }
            - { name: monitor, containerPort: 8222 }
          volumeMounts:
            # Both nats.conf and tenants.conf arrive here from one PROJECTED volume
            # (see `config` below). They must share a directory: nats.conf resolves
            # `include "tenants.conf"` relative to its own location, which is the
            # same shape test/mtls/up.sh reproduces when it extracts the two files
            # side by side.
            - { name: config, mountPath: /etc/nats }
            - { name: data, mountPath: /data }
            - { name: nats-certs, mountPath: /etc/nats-certs, readOnly: true }
            # Writable: nats-server drops its pid here (pid_file in nats.conf) so the
            # spiffe-helper sidecar can signal it on cert renewal without needing the
            # nats-server binary, which it does not have.
            - { name: nats-run, mountPath: /var/run/nats }
          livenessProbe:
            httpGet: { path: "/healthz", port: 8222 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: "/healthz?js-enabled-only=true", port: 8222 }
            initialDelaySeconds: 5
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["nats-server", "--signal", "ldm=1"]
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { memory: "1Gi" }
        # SEC-01c: keeps the SVID renewed + reloads NATS on rotation.
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.9.0
          args: ["-config", "/etc/spiffe-helper/helper.conf"]
          volumeMounts:
            - { name: spiffe-helper-config, mountPath: /etc/spiffe-helper, readOnly: true }
            - { name: nats-certs, mountPath: /etc/nats-certs }
            - { name: spiffe, mountPath: /run/spiffe, readOnly: true }
            # Read-only: the helper only needs to READ the pid nats-server wrote, in
            # order to signal it. It must never write here.
            - { name: nats-run, mountPath: /var/run/nats, readOnly: true }
      volumes:
        # PROJECTED, not two volumes. nats.conf does `include "tenants.conf"`, which
        # NATS resolves relative to nats.conf's own directory — so both files have to
        # land in /etc/nats.
        #
        # The obvious way to do that fails: mounting `config` as a directory at
        # /etc/nats and then subPath-mounting tenants.conf INSIDE it asks runc to bind
        # a file onto a path that does not exist in the parent (a read-only ConfigMap
        # volume projects only its own keys). The kubelet reports
        #   error mounting ... to rootfs at "/etc/nats/tenants.conf": not a directory
        # and the nats container CrashLoopBackOffs — a message that describes the
        # mount machinery rather than the manifest, and reads like a corrupt image.
        #
        # A projected volume merges both ConfigMaps into ONE directory, so each file
        # is a real entry rather than an overlay. tenancy.yaml still owns nats-tenants
        # (tenant provisioning rewrites it); this only changes how it is delivered.
        - name: config
          projected:
            sources:
              - configMap:
                  name: nats-config
              - configMap:
                  name: nats-tenants
        - name: spiffe-helper-config
          configMap:
            name: nats-spiffe-helper
        # Shared cert dir written by spiffe-helper, read by nats. Memory-backed
        # so private keys never touch disk.
        - name: nats-certs
          emptyDir:
            medium: Memory
        # Carries only nats-server's pid file, so the sidecar can signal it across the
        # shared process namespace. Memory-backed and tiny; a stale pid from a previous
        # container cannot survive here, which matters because signalling a recycled pid
        # would be worse than not signalling at all.
        - name: nats-run
          emptyDir:
            medium: Memory
        # SEC-01a SPIFFE CSI volume — presents the agent Workload API socket.
        - name: spiffe
          csi:
            driver: csi.spiffe.io
            readOnly: true
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 12Gi
---
# Protect JetStream quorum during voluntary disruptions (node drains, upgrades).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nats
  namespace: kanz-messaging
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: nats

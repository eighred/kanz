---
# Stream/consumer provisioning script. Idempotent — re-run after taxonomy
# changes. Stream layout follows kanz-schemas/docs/subject-taxonomy.md §4:
# one stream per domain binding "{domain}.>", plus DLQ. Replay streams are
# created per-run by replay tooling (EVT-20), not provisioned here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-bootstrap
  namespace: kanz-messaging
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eu
    NATS_URL="${NATS_URL:-nats://nats:4222}"

    # NATS_REPLICAS exists so CI can run THIS SCRIPT — the one production applies —
    # against a single-node broker. A copy of the stream list in the CI workflow
    # would drift from this one, and the drift would be invisible until a service
    # met a real spine and found its subject unbound.
    NATS_REPLICAS="${NATS_REPLICAS:-3}"

    # ensure_stream NAME SUBJECTS MAX_AGE [extra flags...]
    #
    # EVERY stream goes through this ONE function, including the compacted MANDATE
    # stream below. A second, hand-rolled code path would be invisible to the
    # build-time check that every subject the code names is carried by a stream
    # (test/arch) — which is exactly the check that caught it when I wrote one.
    ensure_stream() {
      name="$1"; subjects="$2"; max_age="$3"; shift 3
      if nats --server "$NATS_URL" stream info "$name" >/dev/null 2>&1; then
        echo "stream $name — updating"
        nats --server "$NATS_URL" stream edit "$name" --force \
          --subjects="$subjects" --max-age="$max_age" "$@"
      else
        echo "stream $name — creating"
        nats --server "$NATS_URL" stream add "$name" --defaults \
          --subjects="$subjects" --storage=file --retention=limits \
          --replicas="$NATS_REPLICAS" --discard=old --dupe-window=2m --max-age="$max_age" "$@"
      fi
    }

    # Domain streams. NATS is the live spine with short retention; Kafka (EVT-09)
    # is the durable log of record. platform/data keep longer (lifecycle +
    # FACT-grade data-quality signals); observability is ephemeral.
    ensure_stream MARKET        "market.>"        24h
    ensure_stream RISK          "risk.>"          24h
    # EXECUTION also carries strategy.> and order.> — the signal→order path.
    # bus.Publish is a JETSTREAM publish, so a subject with no stream bound to it
    # is not "fire and forget", it is a hard publish failure. Both subjects were
    # unbound: every StrategySignal FACT and SubmitOrder COMMAND webhook-ingest and
    # the alpha Runner produced would have been dropped on the floor of a live
    # spine. They are added to EXECUTION rather than renamed under execution.>
    # because a subject rename would break every existing consumer binding and the
    # replay log's subject history; the stream's subject list is the cheap seam.
    ensure_stream EXECUTION     "execution.>,strategy.>,order.>" 24h
    ensure_stream INFERENCE     "inference.>"     24h
    ensure_stream PLATFORM      "platform.>"      168h
    ensure_stream DATA          "data.>"          168h
    ensure_stream OBSERVABILITY "observability.>" 1h

    # THREE DOMAINS WERE UNBOUND, and the paragraph above says exactly why that is
    # fatal — it was written for strategy.>/order.> and the lesson did not travel.
    #
    #   compliance.>  THE OMS SUBSCRIBES TO compliance.mandate.changed. A consumer
    #                 on a subject with no stream does not degrade — it 404s, and it
    #                 takes the OMS's WHOLE consumer group down with it. On a real
    #                 spine the OMS consumed NOTHING: no orders, at all. This was
    #                 found by booting the OMS against a correctly-bootstrapped
    #                 broker for the first time (EXEC-M9), which is also the first
    #                 time anyone had done it.
    #   accounting.>  The venue adapters publish accounting.balance.reconciled and
    #                 the cash-movement FACTs land on accounting.cash.*. Every one
    #                 was a hard publish failure: the ledger's inputs, dropped.
    #   settlement.>  The OMS's post-trade fail sink publishes
    #                 settlement.instruction.fail. A failed settlement that cannot
    #                 be reported is a failed settlement nobody knows about.
    #
    # 168h, not 24h: these carry money, mandates and post-trade obligations. A
    # consumer down over a long weekend must not come back to find its inputs aged
    # out of the stream — that is a silently short ledger, and it looks like nothing.
    ensure_stream ACCOUNTING    "accounting.>"    168h
    ensure_stream COMPLIANCE    "compliance.breach.>" 168h
    ensure_stream SETTLEMENT    "settlement.>"    168h

    # THE MANDATE STREAM IS NOT A LOG. IT IS THE CURRENT STATE.
    #
    # A mandate is what GOVERNS a portfolio — the pre-trade gate in the OMS reads it
    # on every order. The registry that holds it is in-memory and was filled by a
    # durable consumer resuming at its last ack, so a RESTARTED OMS came back with an
    # EMPTY registry and PASSED EVERY ORDER. The control did not fail; it DISARMED,
    # silently, on every rolling update (EXEC-M13).
    #
    # So mandates get their own stream with a different shape:
    #
    #   --max-msgs-per-subject=1  keep exactly the mandate IN FORCE per portfolio
    #                             (one subject per tenant/portfolio), so the stream IS
    #                             the current state and a booting consumer arms itself
    #                             in one read.
    #   no --max-age              A MANDATE MUST NOT AGE OUT. On the 168h streams a
    #                             mandate published nine days ago is deleted, and the
    #                             next restart comes back ungoverned. Retention here is
    #                             the control's memory.
    #
    # COMPLIANCE is narrowed to compliance.breach.> because two streams may not claim
    # overlapping subjects — and a breach FACT is an event (append-only), while a
    # mandate is state (compacted). They are different things and want different
    # streams.
    # 0 = NEVER AGE OUT (the CLI rejects -1 on the edit path); one message per subject
    # = the mandate IN FORCE.
    ensure_stream MANDATE       "compliance.mandate.>" 0 --max-msgs-per-subject=1
    # Dead-letter: poison events need investigation runway.
    ensure_stream DLQ           "dlq.>"           720h

    # Representative durable pull consumer. Per-service consumers are provisioned
    # by their owning service's deploy, following this pattern.
    if ! nats --server "$NATS_URL" consumer info MARKET risk-engine >/dev/null 2>&1; then
      echo "consumer MARKET/risk-engine — creating"
      nats --server "$NATS_URL" consumer add MARKET risk-engine --defaults \
        --pull --filter="market.>" --ack=explicit --deliver=all \
        --max-deliver=5 --max-pending=1000 --replay=instant
    fi

    echo "bootstrap complete"
    nats --server "$NATS_URL" stream ls
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nats-bootstrap
  namespace: kanz-messaging
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: natsio/nats-box:0.14.5
          command: ["sh", "/scripts/bootstrap.sh"]
          env:
            - name: NATS_URL
              value: "nats://nats:4222"
            # The stream replica factor. 3 is the production posture and matches the
            # 3-node NATS cluster. It is surfaced HERE, not buried in the script,
            # because a broker with fewer nodes CANNOT bootstrap at 3 — nats-server
            # refuses with "replicas > 1 not supported in non-clustered mode" and the
            # Job fails outright, taking the whole spine with it. A single-node
            # staging or dev cluster sets this to 1; nothing else changes.
            - name: NATS_REPLICAS
              value: "3"
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
      volumes:
        - name: scripts
          configMap:
            name: nats-bootstrap

---
# SEC-M3b: the bootstrap Job's own identity. The broker requires a client SVID
# (nats.yaml `tls { verify: true, verify_and_map: true }`), and SPIRE issues one
# per ServiceAccount — so the Job that provisions every stream needs an SA of its
# own, admitted by tenancy.yaml's __system__ account. It had none, presented no
# certificate, and was therefore refused at the handshake: the spine could not be
# provisioned at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nats-bootstrap
  namespace: kanz-messaging
  labels:
    app.kubernetes.io/part-of: kanz
---
# spiffe-helper config for the bootstrap Job. The `nats` CLI cannot speak the
# SPIFFE Workload API, so the SVID is materialised as PEM files it reads via
# NATS_CERT/NATS_KEY/NATS_CA. No `cmd` here (unlike the broker's helper, which
# SIGHUPs nats-server on renewal): this runs once, before a short-lived Job, and
# there is nothing to reload.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-bootstrap-spiffe-helper
  namespace: kanz-messaging
  labels:
    app.kubernetes.io/part-of: kanz
data:
  helper.conf: |
    agent_address         = "/run/spiffe/spire-agent.sock"
    cert_dir              = "/etc/nats-certs"
    svid_file_name        = "svid.pem"
    svid_key_file_name    = "svid_key.pem"
    svid_bundle_file_name = "bundle.pem"
---
# Stream/consumer provisioning script. Idempotent — re-run after taxonomy
# changes. Stream layout follows kanz-schemas/docs/subject-taxonomy.md §4:
# one stream per domain binding "{domain}.>", plus DLQ. Replay streams are
# created per-run by replay tooling (EVT-20), not provisioned here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-bootstrap
  namespace: kanz-messaging
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eu
    NATS_URL="${NATS_URL:-nats://nats:4222}"

    # NATS_REPLICAS exists so CI can run THIS SCRIPT — the one production applies —
    # against a single-node broker. A copy of the stream list in the CI workflow
    # would drift from this one, and the drift would be invisible until a service
    # met a real spine and found its subject unbound.
    NATS_REPLICAS="${NATS_REPLICAS:-3}"

    # ensure_stream NAME SUBJECTS MAX_AGE [extra flags...]
    #
    # EVERY stream goes through this ONE function, including the compacted MANDATE
    # stream below. A second, hand-rolled code path would be invisible to the
    # build-time check that every subject the code names is carried by a stream
    # (test/arch) — which is exactly the check that caught it when I wrote one.
    ensure_stream() {
      name="$1"; subjects="$2"; max_age="$3"; shift 3
      if nats --server "$NATS_URL" stream info "$name" >/dev/null 2>&1; then
        echo "stream $name — updating"
        nats --server "$NATS_URL" stream edit "$name" --force \
          --subjects="$subjects" --max-age="$max_age" "$@"
      else
        echo "stream $name — creating"
        nats --server "$NATS_URL" stream add "$name" --defaults \
          --subjects="$subjects" --storage=file --retention=limits \
          --replicas="$NATS_REPLICAS" --discard=old --dupe-window=2m --max-age="$max_age" "$@"
      fi
    }

    # Domain streams. NATS is the live spine with short retention; Kafka (EVT-09)
    # is the durable log of record. platform/data keep longer (lifecycle +
    # FACT-grade data-quality signals); observability is ephemeral.
    ensure_stream MARKET        "market.>"        24h
    # RISK is NARROWED, and deliberately: it used to be the wildcard `risk.>`, which
    # swallowed risk.position.> too. A subject can belong to exactly ONE stream in
    # JetStream, so positions could not be given the compacted, never-ageing stream they
    # need (POSITION, below) while `risk.>` still claimed them.
    #
    # An unbound subject is not a soft failure — a JetStream publish to one is a hard error,
    # and a consumer on one 404s and takes its whole group down. That is why this list is
    # explicit rather than clever: test/arch's TestEverySubjectIsCarriedByAStream walks the
    # AST for every subject the code names and fails the build if any of them is not carried
    # here, so narrowing this is guarded rather than a gamble.
    ensure_stream RISK          "risk.portfolio.>,risk.exposure.>,risk.signal.>,risk.command.>" 24h
    # EXECUTION also carries strategy.> and order.> — the signal→order path.
    # bus.Publish is a JETSTREAM publish, so a subject with no stream bound to it
    # is not "fire and forget", it is a hard publish failure. Both subjects were
    # unbound: every StrategySignal FACT and SubmitOrder COMMAND webhook-ingest and
    # the alpha Runner produced would have been dropped on the floor of a live
    # spine. They are added to EXECUTION rather than renamed under execution.>
    # because a subject rename would break every existing consumer binding and the
    # replay log's subject history; the stream's subject list is the cheap seam.
    ensure_stream EXECUTION     "execution.>,strategy.>,order.>" 24h
    ensure_stream INFERENCE     "inference.>"     24h
    ensure_stream PLATFORM      "platform.>"      168h
    ensure_stream DATA          "data.>"          168h
    ensure_stream OBSERVABILITY "observability.>" 1h

    # THREE DOMAINS WERE UNBOUND, and the paragraph above says exactly why that is
    # fatal — it was written for strategy.>/order.> and the lesson did not travel.
    #
    #   compliance.>  THE OMS SUBSCRIBES TO compliance.mandate.changed. A consumer
    #                 on a subject with no stream does not degrade — it 404s, and it
    #                 takes the OMS's WHOLE consumer group down with it. On a real
    #                 spine the OMS consumed NOTHING: no orders, at all. This was
    #                 found by booting the OMS against a correctly-bootstrapped
    #                 broker for the first time (EXEC-M9), which is also the first
    #                 time anyone had done it.
    #   accounting.>  The venue adapters publish accounting.balance.reconciled and
    #                 the cash-movement FACTs land on accounting.cash.*. Every one
    #                 was a hard publish failure: the ledger's inputs, dropped.
    #   settlement.>  The OMS's post-trade fail sink publishes
    #                 settlement.instruction.fail. A failed settlement that cannot
    #                 be reported is a failed settlement nobody knows about.
    #
    # 168h, not 24h: these carry money, mandates and post-trade obligations. A
    # consumer down over a long weekend must not come back to find its inputs aged
    # out of the stream — that is a silently short ledger, and it looks like nothing.
    ensure_stream ACCOUNTING    "accounting.>"    168h
    ensure_stream COMPLIANCE    "compliance.breach.>" 168h
    ensure_stream SETTLEMENT    "settlement.>"    168h
    ensure_stream ALTERNATIVES  "alternatives.>"  168h

    # THE MANDATE STREAM IS NOT A LOG. IT IS THE CURRENT STATE.
    #
    # A mandate is what GOVERNS a portfolio — the pre-trade gate in the OMS reads it
    # on every order. The registry that holds it is in-memory and was filled by a
    # durable consumer resuming at its last ack, so a RESTARTED OMS came back with an
    # EMPTY registry and PASSED EVERY ORDER. The control did not fail; it DISARMED,
    # silently, on every rolling update (EXEC-M13).
    #
    # So mandates get their own stream with a different shape:
    #
    #   --max-msgs-per-subject=1  keep exactly the mandate IN FORCE per portfolio
    #                             (one subject per tenant/portfolio), so the stream IS
    #                             the current state and a booting consumer arms itself
    #                             in one read.
    #   no --max-age              A MANDATE MUST NOT AGE OUT. On the 168h streams a
    #                             mandate published nine days ago is deleted, and the
    #                             next restart comes back ungoverned. Retention here is
    #                             the control's memory.
    #
    # COMPLIANCE is narrowed to compliance.breach.> because two streams may not claim
    # overlapping subjects — and a breach FACT is an event (append-only), while a
    # mandate is state (compacted). They are different things and want different
    # streams.
    # 0 = NEVER AGE OUT (the CLI rejects -1 on the edit path); one message per subject
    # = the mandate IN FORCE.
    ensure_stream MANDATE       "compliance.mandate.>" 0 --max-msgs-per-subject=1

    # WEALTH — the same shape, for the same reason (WEALTH-01b).
    #
    #   A HouseholdValued is the CURRENT PICTURE, NOT AN EVENT THAT HAPPENED. The
    #   decoder returns a whole Household and the wealth store does Put — last-write-
    #   wins — so a pod booting tomorrow must arm itself with the latest valuation per
    #   household in one read, exactly as the OMS arms its mandate registry and the
    #   compliance monitor arms its position book. This is deliberately the OPPOSITE
    #   of ALTERNATIVES: alternatives is a JOURNAL whose fold is a dated cashflow
    #   series (IRR/TVPI need every cashflow, not just the latest), so it stays
    #   append-only. Compacting it would silently discard every cashflow but the
    #   last per fund.
    #
    #   --max-msgs-per-subject=1 + no max-age makes this stream the CURRENT BOOK: one
    #   retained message per household, forever, so DeliverLastPerSubject gives a
    #   booting consumer every household's latest valuation in one read.
    ensure_stream WEALTH        "wealth.>" 0 --max-msgs-per-subject=1

    # POSITION — the same shape, for the same reason (EXEC-M20).
    #
    #   A POSITION IS STATE, NOT AN EVENT. Every position FACT used to ride the flat
    #   `risk.position.changed` on the 24h RISK stream, which is wrong twice over:
    #
    #     · JetStream compacts PER SUBJECT, so a flat subject retains ONE message for the
    #       whole platform — DeliverLastPerSubject gives a booting consumer one instrument's
    #       position and silence about every other.
    #     · a 24h max-age means a holding that has not traded today AGES OFF THE STREAM, and
    #       the next restart is blind to it. A position must not expire, for the same reason
    #       a mandate must not.
    #
    #   What that cost: the compliance monitor's book is in-memory, filled by a durable
    #   consumer that resumes at its last ack. A restarted monitor came back with a PARTIAL
    #   book — and a fund holding an instrument its mandate FORBIDS looked compliant, because
    #   the holding was not there to see. The control did not fail. It went blind.
    #
    #   --max-msgs-per-subject=1 + no max-age makes this stream the CURRENT BOOK: one
    #   retained message per (tenant, portfolio, instrument), forever, so a consumer arms
    #   itself with the whole thing in one read.
    ensure_stream POSITION      "risk.position.>" 0 --max-msgs-per-subject=1
    # Dead-letter: poison events need investigation runway.
    ensure_stream DLQ           "dlq.>"           720h

    # NO CONSUMERS ARE PROVISIONED HERE, AND THAT IS DELIBERATE (#237).
    #
    # This block used to create one durable, MARKET/risk-engine, above a comment
    # calling it a "representative durable pull consumer" whose pattern
    # "per-service consumers are provisioned by their owning service's deploy"
    # followed. Both halves were false, and the second is the expensive kind of
    # false — a documented pattern nobody implements:
    #
    #   · `grep -rn "consumer add" infra/ services/` returned this line and
    #     nothing else. No deploy provisioned a consumer. There was no pattern.
    #   · the durable it created was named `risk-engine`, but bus.Subscribe binds
    #     one durable per (group, SUBJECT) — `risk-engine-market_>` (durableName,
    #     pkg/bus/nats.go). No service ever bound the consumer this created. It
    #     sat on MARKET accruing pending messages nobody read.
    #   · its --max-deliver=5 --max-pending=1000 read as the platform's answer to
    #     redelivery limits while every real durable in the estate ran on the
    #     server defaults. It was the only place those numbers appeared, and it
    #     applied to nothing.
    #
    # Consumers are created by the services themselves, from code, on first
    # Subscribe: pkg/bus/nats.go calls CreateOrUpdateConsumer with the delivery
    # contract resolved from pkg/bus/tuning.go (AckWait, MaxDeliver,
    # MaxAckPending, per subject class). Provisioning one here would fight that
    # call rather than complement it — CreateOrUpdate is a silent overwrite, so
    # whichever ran last would win and the loser would be invisible. Streams are
    # bootstrapped because a service cannot create the stream it subscribes to;
    # consumers are not, because it can and does.

    echo "bootstrap complete"
    nats --server "$NATS_URL" stream ls
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nats-bootstrap
  namespace: kanz-messaging
  annotations:
    # RE-PROVISIONING WITHOUT A HAND-RUN COMMAND (#92).
    #
    # A plain Job provisions the spine EXACTLY ONCE. Argo CD will not re-run one
    # that has already completed — the object matches git, so a sync is a no-op —
    # so a broker that loses its streams stays broken until a human remembers
    # `kubectl delete job nats-bootstrap`. That is not a theoretical recovery gap:
    # the kind rig reached ~495 restarts on compliance and tv-sync after a host
    # reboot dropped JetStream state, because nothing re-created the streams and
    # every stream-dependent service crash-loops on "stream not found".
    #
    # PostSync + BeforeHookCreation re-asserts the whole stream set on every sync,
    # after the broker StatefulSet reports healthy — which is the ordering this
    # needs, since streams cannot be created against a broker that is not up.
    #
    # Safe to run every time because ensure_stream is idempotent BY CONSTRUCTION:
    # it edits when the stream exists and creates when it does not, and every
    # stream goes through that one function. Re-running is the cheap half of the
    # trade; the expensive half was a spine nobody could rebuild.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      # SEC-M3b: its own identity, so SPIRE issues this Job an SVID that
      # tenancy.yaml's __system__ account admits. Without one the Job is refused at
      # the TLS handshake and NO STREAM IS EVER CREATED — which is where the whole
      # spine starts.
      serviceAccountName: nats-bootstrap
      # spiffe-helper writes the SVID as PEM FILES because the `nats` CLI cannot
      # speak the SPIFFE Workload API — it reads NATS_CERT/NATS_KEY/NATS_CA. Same
      # helper, same file names as the broker's own sidecar (nats.yaml).
      # daemon_mode=false: run once, block until the first SVID exists, exit — a
      # Job needs the certs before its command starts, not renewal.
      initContainers:
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.9.0
          args: ["-config", "/etc/spiffe-helper/helper.conf", "-daemon-mode=false"]
          volumeMounts:
            - { name: spiffe, mountPath: /run/spiffe, readOnly: true }
            - { name: helper-config, mountPath: /etc/spiffe-helper }
            - { name: certs, mountPath: /etc/nats-certs }
      containers:
        - name: bootstrap
          image: natsio/nats-box:0.14.5
          command: ["sh", "/scripts/bootstrap.sh"]
          env:
            # THE HOSTNAME MUST MATCH A DNS SAN, and "nats" does not.
            #
            # This was nats://nats:4222. The broker's SVID carries the SANs SPIRE's
            # dnsNameTemplates issue — `nats-0` and `nats.kanz-messaging.svc` — and
            # the `nats` CLI, unlike a SPIFFE-aware Go client, checks the hostname
            # against them. The short name matches neither, so the CLI would reject
            # the broker's own certificate ("certificate is not valid for any
            # names") even once the certs below are mounted. Verified against a real
            # broker in test/mtls (CI drives this exact script over mTLS).
            - name: NATS_URL
              value: "nats://nats.kanz-messaging.svc:4222"
            # The client SVID the helper wrote. These three are what make the CLI
            # present an identity `verify_and_map` can map to a __system__ user.
            - name: NATS_CERT
              value: "/etc/nats-certs/svid.pem"
            - name: NATS_KEY
              value: "/etc/nats-certs/svid_key.pem"
            - name: NATS_CA
              value: "/etc/nats-certs/bundle.pem"
            # The stream replica factor. 3 is the production posture and matches the
            # 3-node NATS cluster. It is surfaced HERE, not buried in the script,
            # because a broker with fewer nodes CANNOT bootstrap at 3 — nats-server
            # refuses with "replicas > 1 not supported in non-clustered mode" and the
            # Job fails outright, taking the whole spine with it. A single-node
            # staging or dev cluster sets this to 1; nothing else changes.
            - name: NATS_REPLICAS
              value: "3"
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
            - { name: certs, mountPath: /etc/nats-certs, readOnly: true }
      volumes:
        - name: scripts
          configMap:
            name: nats-bootstrap
        - name: helper-config
          configMap:
            name: nats-bootstrap-spiffe-helper
        # The agent socket (SEC-01a). Read-only: the workload only fetches.
        - name: spiffe
          csi:
            driver: csi.spiffe.io
            readOnly: true
        # emptyDir, not a mount: the SVID is short-lived and must never touch
        # durable storage — the memory-only-secrets stance.
        - name: certs
          emptyDir: {}

---
# MT-01c: NATS tenant isolation via ACCOUNTS — the broker-native isolation
# boundary. An account's subjects are physically invisible to other accounts, so
# isolation is enforced by WHICH account a connection lands in, not by the
# subject string. The client's SVID maps to a per-tenant user via
# `tls.verify_and_map` (see nats.yaml), so the bus keeps publishing the
# unchanged 3-segment logical subject (subject-taxonomy §4/§6) and a tenant can
# never see another tenant's `{domain}.>`. Subject prefixing inside one shared
# account would give NO real isolation, hence accounts.
#
# This ConfigMap is mounted at /etc/nats/tenants.conf and `include`d by
# nats.conf. Add a tenant by appending an account + user keyed on the tenant
# workload's SPIFFE URI SAN, then `nats-server --signal reload`. Dynamic JWT
# account-resolver onboarding (no reload) is the MT-01f lifecycle path.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-tenants
  namespace: kanz-messaging
  labels:
    app.kubernetes.io/part-of: kanz
data:
  tenants.conf: |
    # System account: $SYS events (monitoring, JetStream cluster RPC).
    system_account: SYS

    accounts {
      SYS {
        users: [ { user: "spiffe://kanz.internal/ns/kanz-messaging/sa/nats" } ]
      }

      # Reserved platform/legacy tenant (MT-01a __system__). Cross-cutting
      # platform + observability streams AND pre-tenancy (untenanted) events —
      # which the consumer maps to SystemTenant — live here. Platform services
      # connect into it; per-tenant accounts cannot reach its subjects.
      #
      # SEC-M3b: this list held TWO users while THIRTEEN services dialed the
      # spine. `verify_and_map` maps a verified SVID to a user, and a user that is
      # not here maps to NO ACCOUNT — so eleven services would have authenticated
      # and then been unable to publish or subscribe at all. It was invisible for
      # the same reason SEC-M3 was: nothing ever ran a service against this file.
      # test/arch/nats_identity_test.go now fails the build if a NATS-dialing
      # service is missing here, so the list cannot fall behind the code again.
      #
      # Each entry is the SVID infra/security/spire/registration.yaml issues that
      # pod — spiffe://kanz.internal/ns/{namespace}/sa/{serviceAccountName} — from
      # the namespace + serviceAccountName in its own deploy manifest. Adding a
      # service here without a matching ServiceAccount admits nothing.
      __system__ {
        jetstream: enabled

        # ---- MT-02 tenant routing (#358) -------------------------------------
        #
        # THE RULING (#97): tenants get DEDICATED COMPUTE, not a shared pool.
        # internal/pg/pool.go binds a pool to one tenant for the process lifetime
        # (`set_config('app.tenant_id', $1, false)` — session scope, applied once
        # at connect), so a shared OMS would need per-transaction scoping: a
        # rewrite of the one component every service's RLS correctness rests on.
        # Dedicated compute keeps a property that is currently structural — a pool
        # that CANNOT serve the wrong tenant, because it never learned how.
        #
        # WHAT THIS BLOCK IS FOR. The gateway is the sole front door and holds ONE
        # SVID, therefore one account; NATS routes on SUBJECT and cannot dispatch
        # on the envelope's tenant_id. So a shared publisher cannot reach a
        # per-tenant account at all — measured, not assumed: a publish in
        # __system__ is delivered to NOTHING in `acme`, while the same subscriber
        # receives a same-account publish.
        #
        # The tenant therefore has to appear in the subject SOMEWHERE. It appears
        # here and only here: the routing prefix exists inside __system__, and
        # every account resolves it back to the unchanged 3-segment logical name
        # before any workload sees it. So kanz-schemas/docs/subject-taxonomy.md
        # still holds where it matters — inside a tenant account the subject is
        # `order.order.submit`, and oms-deploy.yaml subscribes exactly that.
        exports: [
          { stream: "tenant.*.order.order.submit" }
          { stream: "tenant.*.order.order.cancel" }
        ]

        # __system__ RESOLVES ITS OWN PREFIX, which is what makes the gateway's
        # publish path uniform: it always prefixes, with no runtime branch and no
        # list of "tenants that have accounts" to fall out of date. Without these
        # two lines the CURRENT single-tenant path breaks the moment the gateway
        # starts prefixing — the running OMS subscribes `order.order.submit` and
        # would simply stop receiving orders.
        mappings = {
          "tenant.__system__.order.order.submit": "order.order.submit"
          "tenant.__system__.order.order.cancel": "order.order.cancel"
        }

        users: [
          # The bootstrap Job (bootstrap-job.yaml) — it CREATES the streams, so it
          # is admitted here before any service has anything to connect to. It
          # lives in kanz-messaging beside the broker, not in kanz-services.
          { user: "spiffe://kanz.internal/ns/kanz-messaging/sa/nats-bootstrap" }
          # THE OPERATOR PLANE (SEC-M3c, infra/operator/halt-job.yaml). Four
          # operator CLIs — kanz-halt, kanz-mandate, kanz-altevent,
          # kanz-household — each get their OWN SVID below, one per tool.
          #
          # SEC-M3d: until this change, all four PRESENTED THE SAME SVID
          # (kanz-halt's), AND — the part that actually mattered — nobody here
          # had a `permissions` block, at all, of any kind. Every one of these
          # 17 __system__ users could publish and subscribe on ANY subject in
          # the account. So the shared identity was never the real exposure:
          # even with four distinct SVIDs, an identity with no permissions is
          # exactly as privileged as every other identity in the account. The
          # claim below — "this SVID admits the brake and nothing else" — was
          # FALSE as written for as long as it had no permissions block: any
          # of market-data, archiver, audit, tv-sync, or any other user in
          # this account could equally publish platform.mode.changed. It
          # first becomes true with the `permissions` block added here.
          #
          # SEC-M3e (below) closed the matching gap on the service users: at
          # the time of THIS comment they still had no permissions block and
          # could equally publish platform.mode.changed. That is fixed now —
          # see the SEC-M3e comment ahead of the risk-engine entry.
          #
          # Permission sets below were determined by inspecting the actual
          # publisher (each tool's own subject constant) and PROVEN against a
          # real nats-server + JetStream broker, not guessed — see
          # .superpowers/sdd/operator-svid-split-report.md (repo root) for the
          # transcript. Each publish-only tool needs subscribe access to its own reply inbox
          # (`_INBOX.>`) to receive the JetStream publish ack; it does NOT
          # need `$JS.API.>` — these tools only call jetstream.PublishMsg,
          # which (as of nats.go v1.52.0) publishes directly to the stream
          # subject and never touches the $JS.API management surface. Granting
          # $JS.API.> anyway would hand a "publish one FACT" tool the full
          # JetStream admin API (stream/consumer create, delete, purge) — a
          # far bigger privilege than the tool needs or than least-privilege
          # calls for, so it is deliberately withheld.
          {
            user: "spiffe://kanz.internal/ns/kanz-operator/sa/kanz-halt"
            permissions: {
              publish: { allow: ["platform.mode.changed"] }
              subscribe: { allow: ["_INBOX.>"] }
            }
          }
          # kanz-mandate arms the compliance gate (COMP-01f) by publishing a
          # ConfigChanged FACT per (tenant, portfolio) on
          # compliance.mandate.changed.{tenant}.{portfolio} — see
          # internal/compliance/mandate_codec.go's SubjectMandateFor /
          # SubjectMandateAll. No Job manifest of its own yet (see
          # test/arch/nats_identity_test.go and this file's report); it runs
          # from an operator's shell against a dev broker or reuses the
          # kanz-halt SA's socket today, but the SVID + permissions it needs
          # once it has its own ServiceAccount are declared here now so the
          # broker side does not have to change again when that manifest
          # ships.
          {
            user: "spiffe://kanz.internal/ns/kanz-operator/sa/kanz-mandate"
            permissions: {
              publish: { allow: ["compliance.mandate.changed.>"] }
              subscribe: { allow: ["_INBOX.>"] }
            }
          }
          # kanz-altevent publishes the commitment-lifecycle journal (ALT-01b)
          # on alternatives.> — see internal/alternatives/subject.go. Same
          # no-manifest-yet caveat as kanz-mandate above.
          {
            user: "spiffe://kanz.internal/ns/kanz-operator/sa/kanz-altevent"
            permissions: {
              publish: { allow: ["alternatives.>"] }
              subscribe: { allow: ["_INBOX.>"] }
            }
          }
          # kanz-household publishes the household valuation (WEALTH-01b) on
          # wealth.> — see internal/wealth/subject.go. Same no-manifest-yet
          # caveat as kanz-mandate above.
          {
            user: "spiffe://kanz.internal/ns/kanz-operator/sa/kanz-household"
            permissions: {
              publish: { allow: ["wealth.>"] }
              subscribe: { allow: ["_INBOX.>"] }
            }
          }
          # kanz-redrive is the DLQ DRAIN (#220, cmd/kanz-redrive): it reads
          # messages parked on `dlq.<subject>` and republishes them, byte for
          # byte, onto the subject named in their Kanz-DLQ-Original-Subject
          # header. Without it the DLQ is write-only — a transient Postgres
          # failover parks a SubmitOrder the client already holds a 202 for and
          # nothing can ever get it back.
          #
          # ITS GRANT IS THE BROADEST IN THE OPERATOR PLANE, AND THAT IS
          # INHERENT, NOT AN OVERSIGHT. The other four operator tools publish one
          # subject space each, so their allow-list is that space. This one
          # republishes whatever was parked, and anything with a work-queue
          # consumer can park — so the allow-list is the union of the domains
          # that have one. It is enumerated rather than written `>` so the
          # exposure is reviewable, and so a domain nobody expected to be
          # drainable fails LOUDLY (the publish is denied, Redriver halts and
          # names the subject) instead of being quietly republishable.
          #
          # platform.> IS DELIBERATELY ABSENT, and it is the one exclusion that
          # matters. platform.mode.changed is the kill switch, and kanz-halt's
          # entry above claims that SVID "admits the brake and nothing else" —
          # granting platform.> here would silently make that claim false again
          # and hand a second identity the ability to halt or RESUME trading. It
          # is also unnecessary: the mode FACT is consumed through
          # SubscribeBroadcast, and pkg/bus/consumer.go's broadcast path never
          # routes to the DLQ at all (see dlqExemptBroadcastOnlyConsumers in
          # test/arch/bus_dlq_test.go), so `dlq.platform.mode.changed` cannot
          # exist to be drained.
          #
          # $JS.API.> + $JS.ACK.> because the drain binds a DURABLE consumer on
          # the dlq.> stream — the cursor is what stops a redriven message being
          # redriven twice — and must ack what it has successfully republished.
          { user: "spiffe://kanz.internal/ns/kanz-operator/sa/kanz-redrive"
            permissions: {
              publish: {
                allow: [
                  "$JS.API.>", "$JS.ACK.>",
                  "order.>", "execution.>", "strategy.>",
                  "risk.>", "market.>", "inference.>",
                  "accounting.>", "compliance.>", "settlement.>",
                  "alternatives.>", "wealth.>", "data.>"
                ]
              }
              subscribe: { allow: ["dlq.>", "_INBOX.>"] }
            }
          }
          # READ-ONLY OBSERVER (kanz-monitor, test/arch/nats_identity_test.go's
          # readOnlyObserverSVIDs). It streams order.> and risk.position.> to a
          # terminal via SubscribeBroadcast and publishes NO business subject.
          # The publish allow-list holds ONLY the JetStream consumer machinery its
          # ephemeral consumer binds ($JS.API.> to resolve the stream + create the
          # consumer, $JS.ACK.> to ack) — with an allow-list present, every other
          # subject (order.*, risk.*, everything) is denied by default, so this
          # identity provably cannot move capital. NOT `deny: [">"]`: that trap
          # (see the risk-engine header above) would also deny $JS.API.>/$JS.ACK.>,
          # breaking the consumer and silently failing every ack forever.
          # Manifest half (a kanz-operator ServiceAccount for kanz-monitor) is not
          # yet shipped — like the other operator tools, the broker-side half is
          # declared here ready for when that manifest lands.
          { user: "spiffe://kanz.internal/ns/kanz-operator/sa/kanz-monitor"
            permissions: {
              publish: { allow: ["$JS.API.>", "$JS.ACK.>"] }
              subscribe: { allow: ["order.>", "risk.position.>", "_INBOX.>"] }
            }
          }
          # SEC-M3e: the 15 service users below (risk-engine .. webhook-ingest —
          # the operator-svid-split report and this file's own header called them
          # "13"; the actual count in this list has been 15 since alternatives and
          # wealth joined as real dialers, and nobody updated the number) went
          # through the SAME exposure as the four operator users above: NO
          # `permissions` block, so any one of them could publish or subscribe on
          # ANYTHING in __system__ — including platform.mode.changed. Every
          # publish/subscribe set below was DERIVED FROM CODE (bus.Event{Subject:
          # ...} literals, Subject*/EventType* constants, consumer.Subscribe /
          # SubscribeBroadcast(Ready) call sites, and each service's own config
          # defaults for an env-overridable subject list), not guessed — see
          # .superpowers/sdd/service-user-permissions-report.md for the full
          # per-service table and citations.
          #
          # TWO SHAPES REPEAT BELOW, factored here instead of in every entry:
          #
          # 1. DLQ. bus.WithDLQ makes a consumer PUBLISH to `dlq.<original-
          #    subject>` on terminal failure (pkg/bus/retry.go's dlqSubject).
          #    Only plain `consumer.Subscribe` calls route to DLQ —
          #    SubscribeBroadcast(Ready) explicitly does NOT (pkg/bus/consumer.go:
          #    a broadcast control signal must nak and hold state, never park
          #    silently). A service that subscribes via Subscribe but has no
          #    `dlq.*` publish grant authenticates fine and then fails every
          #    terminal-failure path at the worst possible moment: the message
          #    that already exhausted retries also can't be parked, so
          #    publishDLQ's own error surfaces and the event goes right back on
          #    the broker for redelivery forever.
          #
          # 2. JETSTREAM CONSUMER PERMISSIONS — proven empirically against a real
          #    nats-server + JetStream broker (.superpowers/sdd/service-user-
          #    permissions-report.md), because a JS CONSUMER is NOT the same case
          #    as a JS PUBLISHER (operator-svid-split-report.md proved a publisher
          #    needs no `$JS.API.>`). A consumer's `StreamNameBySubject` and
          #    `CreateOrUpdateConsumer`/`CreateConsumer` calls (pkg/bus/nats.go)
          #    publish under `$JS.API.>`, and — the part that is NOT documented
          #    anywhere and was found only by running it — `jetstream.Msg.Ack()`
          #    publishes to a THIRD, separate subject space, `$JS.ACK.>`, that
          #    `$JS.API.>` does NOT cover. Withholding `$JS.ACK.>` from a consumer
          #    does not fail loudly: pkg/bus/nats.go's Subscribe calls `_ =
          #    m.Ack()` and discards the error, so the consumer silently never
          #    acks, the delivery redelivers after AckWait, and the handler
          #    re-runs forever — a duplicate-processing bug with no visible
          #    error anywhere. The proven-minimal set for ANY service that calls
          #    consumer.Subscribe, SubscribeBroadcast, or SubscribeBroadcastReady
          #    is `publish: ["$JS.API.>", "$JS.ACK.>"]` / `subscribe:
          #    ["_INBOX.>"]` — no wider grant is needed, and (the negative
          #    control that matters) `subscribe` does NOT also need `$JS.API.>`;
          #    replies to API calls arrive on the caller's own inbox.
          #
          # A NATS TRAP FOUND WHILE PROVING THE ABOVE: `permissions: { publish: {
          # allow: [] } }` — an explicitly present but EMPTY allow list — does
          # NOT deny publish. It was proven empirically to behave as
          # UNRESTRICTED, identically to omitting the permissions block
          # entirely. A service with genuinely nothing to publish on NATS would
          # need `publish: { deny: [">"] }` to actually be denied, not an empty
          # `allow` array (a no-op that reads as one) — but no user below is
          # actually in that position: every __system__ user that reaches
          # pkg/bus/nats.go's Subscribe at all (every consumer, not just every
          # domain publisher) needs $JS.API.>/$JS.ACK.> to run its own
          # JetStream machinery, so `deny: [">"]` is now a trap to recognize on
          # sight, not a pattern to reach for. archiver's entry below used to be
          # exactly this mistake — see its own comment for the failure mode
          # that produced.
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/risk-engine"
            permissions: {
              # RISK-10's Publisher (internal/risk/publish/publish.go) emits the
              # engine's own two output FACTs. It subscribes the three RISK-04
              # state subjects it ingests (internal/risk/app/ingest.go's
              # stateSubjects: EventTypePortfolioRevalued,
              # subject.PositionAll wildcard, EventTypePortfolioSnapshot) and,
              # when calibration is enabled (RISK_ENGINE_CALIBRATION_RATES),
              # the market quote spine (RISK_ENGINE_MARKET_SUBJECTS, default
              # market.>) into a live-quote cache. All three subscriptions go
              # through bus.NewConsumer(..., bus.WithDLQ(client)), so each needs
              # its own dlq.* grant.
              publish: {
                allow: [
                  "risk.portfolio.exposure_recomputed", "risk.portfolio.measures_computed",
                  "dlq.risk.portfolio.revalued", "dlq.risk.position.changed.>", "dlq.risk.portfolio.snapshot",
                  "dlq.market.>", "$JS.API.>", "$JS.ACK.>",
                ]
              }
              subscribe: {
                allow: [
                  "risk.portfolio.revalued", "risk.position.changed.>", "risk.portfolio.snapshot",
                  "market.>", "_INBOX.>",
                ]
              }
            }
          }
          # api-gateway publishes on TWO paths, and never subscribes to anything —
          # so it needs neither a DLQ grant nor JetStream consumer permissions,
          # only the reply inbox for the synchronous publish ack.
          #
          #   · order.order.submit / .cancel — services/api-gateway/internal/
          #     orders/orders.go, COMMANDs, the sole write path onto the order
          #     book (OMS-01d).
          #   · platform.authz.decision — the AUTH-01d capability decisions this
          #     gateway makes, as OBSERVATIONs (#352). WITHOUT THIS ENTRY THE
          #     BROKER DENIES EVERY ONE OF THEM. That failure is loud rather than
          #     silent — kanz_api_gateway_auth_decisions_lost_total{reason=
          #     "publish_error"} climbs and the error is logged — but the audit
          #     trail is empty for as long as it lasts, so this line is part of
          #     the feature, not an optimisation of it.
          #
          # The two are deliberately enumerated rather than widened: the gateway
          # is the platform's sole identity authority, and `platform.>` would hand
          # it platform.mode.changed — the kill switch that kanz-halt's entry
          # above claims is its alone.
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/api-gateway"
            permissions: {
              publish: {
                allow: [
                  # MT-02 (#358): the gateway publishes the TENANT-PREFIXED subject
                  # so the broker can route it to that tenant's account. The
                  # unprefixed names stay granted because nothing else has moved
                  # yet — webhook-ingest still publishes them directly, and
                  # revoking them here would only make this grant disagree with
                  # the estate rather than tighten it.
                  "tenant.*.order.order.submit", "tenant.*.order.order.cancel",
                  "order.order.submit", "order.order.cancel",
                  "platform.authz.decision",
                ]
              }
              subscribe: { allow: ["_INBOX.>"] }
            }
          }
          # copilot publishes ONE thing and subscribes to NOTHING (#352): the
          # AUTH-01d decisions its deny-by-default tool gate makes, as
          # OBSERVATIONs on platform.authz.decision. So it needs no DLQ grant and
          # no JetStream consumer permissions — only the reply inbox for the
          # synchronous publish ack.
          #
          # It had no entry here at all until the recorder was wired, because it
          # had no bus at all. WITHOUT THIS THE BROKER DENIES EVERY DECISION —
          # loudly (kanz_copilot_auth_decisions_lost_total{reason="publish_error"})
          # but denied, leaving the audit trail empty while the service looks
          # healthy.
          #
          # Enumerated rather than `platform.>`: that would additionally grant
          # platform.mode.changed, the kill switch kanz-halt's entry above claims
          # is its alone. An AI agent is the last identity that should hold it.
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/copilot"
            permissions: {
              publish: { allow: ["platform.authz.decision"] }
              subscribe: { allow: ["_INBOX.>"] }
            }
          }
          # inference is the PYTHON service (kanz-py), and until #241 it had no
          # entry here at all — because it had no way to present an SVID. Its
          # streaming worker is the WIRED half: risk-engine publishes
          # inference.feature.computed, kanz_inference/streaming/worker.py drains
          # it and publishes inference.prediction.scored back.
          #
          # WITHOUT THIS ENTRY THE PATH IS DEAD ON A REAL BROKER. nats.yaml sets
          # verify: true + verify_and_map, so a client with no admitted SVID is
          # refused at the TLS handshake — not denied per-subject, refused
          # outright — and nothing scores a single FeatureVector.
          #
          # $JS.API.> + $JS.ACK.> because the worker binds a DURABLE pull consumer
          # (kanz_bus/nats.py's pull_subscribe(durable=group)) and acks what it
          # has scored. No dlq.* grant: kanz_inference constructs Consumer(client)
          # with the default config, so dlq is None and a retry-exhausted message
          # surfaces to the broker rather than being republished.
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/inference"
            permissions: {
              publish: {
                allow: [
                  "inference.prediction.scored",
                  # THE MODEL REGISTRY'S APPEND LOG (#112). kanz-py's
                  # BusRegistryPublisher writes every register / unregister /
                  # record_validation here, and it is the source of truth a
                  # replica replays from offset 0 to rebuild.
                  #
                  # WITHOUT THIS GRANT the service authenticates fine and is
                  # DENIED at publish time — which reads as a broken feature
                  # rather than a missing permission. No Go guard could have
                  # caught it: they all key on services/ packages and this
                  # service is Python. test/arch's new
                  # TestPythonPublishedSubjectsAreGranted now does.
                  "platform.model.registered",
                  "dlq.platform.model.registered",
                  "$JS.API.>", "$JS.ACK.>",
                ]
              }
              # SUBSCRIBE TO platform.model IS DELIBERATELY NOT HERE YET. Every
              # replica is meant to consume the log to converge, but no consumer
              # is wired on either side (#112 step 3) — and a grant for a
              # consumer that does not exist is a permission nobody can point at
              # a caller for. It lands with the consumer.
              subscribe: { allow: ["inference.feature.computed", "_INBOX.>"] }
            }
          }
          # accounting folds order fills (order.order.filled /
          # .partially_filled, ACCOUNTING_FILL_SUBJECTS) and its own cash-
          # movement FACTs (accounting.cash.>, ACCOUNTING_CASH_SUBJECTS) into
          # the ledger, and separately PUBLISHES those same cash-movement FACTs
          # (internal/cashmove — subscription/redemption/fee) when an operator
          # records one via the server's HTTP surface — the publish and the
          # fold are two ends of the same durable journal, not a mistake. It
          # also folds the FX spine (market.fx.>, ACCOUNTING_FX_SUBJECTS) for
          # its live-rate cache. All three subscriptions use
          # bus.NewConsumer(..., bus.WithDLQ(client)).
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/accounting"
            permissions: {
              publish: {
                allow: [
                  "accounting.cash.>",
                  # THE BOOK OF RECORD ANNOUNCES WHAT A PORTFOLIO CAN SPEND
                  # (#450). accounting is the only component that folds trade
                  # legs, cash movements and corporate actions bitemporally, so
                  # it is the only one that may compute a balance — the
                  # pre-trade buying-power gate (#415) and exchange balance
                  # reconciliation (#418) both consume this rather than
                  # re-deriving a second number that would drift from it.
                  "accounting.balance.portfolio",
                  "dlq.order.order.filled", "dlq.order.order.partially_filled",
                  "dlq.accounting.cash.>", "dlq.market.fx.>",
                  "$JS.API.>", "$JS.ACK.>",
                ]
              }
              subscribe: {
                allow: [
                  "order.order.filled", "order.order.partially_filled",
                  "accounting.cash.>", "market.fx.>", "_INBOX.>",
                ]
              }
            }
          }
          # optimization materializes an APPROVED rebalance proposal into OMS order
          # COMMANDS (#409). It had NO account and NO permissions block at all —
          # not because anyone decided that, but because notDeployed listed it as
          # "deliberately not deployed" while its manifest declared replicas: 2,
          # and four guards including this one SKIP a service on that list. The
          # exemption looked like a decision, so the gap looked like a choice.
          #
          # UNDER NATS SEMANTICS A PUBLISHER WITH NO PERMISSIONS BLOCK IS
          # UNRESTRICTED within its account. For this service that means
          # unrestricted publish rights for the process whose entire job is to
          # emit order commands — the single worst place in the estate for that
          # to be true, and it was true silently.
          #
          # TWO SUBJECTS, both from services/optimization/internal/publish:
          # order.order.submit is the capital path itself, and
          # optimization.proposal.materialized is the FACT recording WHO
          # authorized an automated capital action — the audit record that makes
          # auto-publish accountable, and therefore the one that must not be
          # droppable by a broker refusal.
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/optimization"
            permissions: {
              publish: {
                allow: [
                  "order.order.submit",
                  "optimization.proposal.materialized",
                  # MT-02 tenant routing: the same two subjects, prefixed, for a
                  # non-__system__ tenant. Omitting these authenticates fine and
                  # is DENIED at publish time — which reads as a broken feature
                  # rather than a missing grant, and only for tenants that are
                  # not the default one.
                  "tenant.*.order.order.submit",
                  "tenant.*.optimization.proposal.materialized",
                  "dlq.order.order.submit",
                  "dlq.optimization.proposal.materialized",
                  "$JS.API.>", "$JS.ACK.>",
                ]
              }
              subscribe: {
                allow: [ "_INBOX.>" ]
              }
            }
          }
          # datamaster became a real bus.DialNATS caller when the pricing-override
          # FACT was wired (#410). It PUBLISHES ONE SUBJECT and consumes nothing:
          # the override is committed to its own outbox in the same transaction
          # as the audit row, and an in-process relay drains that outbox onto the
          # spine.
          #
          # THE ALLOW LIST IS ONE ENTRY ON PURPOSE. A publisher with no
          # permissions block is UNRESTRICTED within its account under NATS
          # semantics, which is the SEC-M3e exposure this file exists to close —
          # and an over-broad list is the same exposure written down. This
          # service has no reason to publish anything else, so anything else it
          # publishes is a defect, and the broker is the cheapest place to find
          # out.
          #
          # dlq.> is included because the relay's publish path carries the
          # standard DLQ fallback; without it a poison record cannot be parked
          # and the relay retries it forever, holding the backlog behind it.
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/datamaster"
            permissions: {
              publish: {
                allow: [
                  "data.exception.overridden",
                  "dlq.data.exception.overridden",
                  "$JS.API.>", "$JS.ACK.>",
                ]
              }
              subscribe: {
                allow: [ "_INBOX.>" ]
              }
            }
          }
          # alternatives became a real bus.DialNATS caller when its commitment-
          # journal consumer was wired (ALT-01b): it folds capital-call,
          # distribution and NAV-mark FACTs into fund.Store. SEC-M3b requires
          # every dialer to be admitted here; test/arch/nats_identity_test.go's
          # TestNATSDialersHaveBrokerAccounts caught the gap before it shipped.
          #
          # It only CONSUMES the four internal/alternatives/subject.go subjects
          # kanz-altevent publishes (alternatives.commitment.>) — no service
          # code publishes to NATS on its own account (the fund.Store fold is
          # queried over gRPC). ALTERNATIVES_SUBJECTS defaults to
          # alternatives.AllSubjects(), consumed via bus.NewConsumer(...,
          # bus.WithDLQ(client)).
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/alternatives"
            permissions: {
              publish: { allow: ["dlq.alternatives.commitment.>", "$JS.API.>", "$JS.ACK.>"] }
              subscribe: { allow: ["alternatives.commitment.>", "_INBOX.>"] }
            }
          }
          # archiver drains NATS into KAFKA (DATA-M1) — its "DLQ" (DLQSubject =
          # "dlq.archiver") is a Kafka topic, published via a.cfg.Kafka.Publish,
          # never a NATS subject. It calls a.cfg.NATS.Subscribe directly (the
          # *bus.NATSClient method), not bus.Consumer.Subscribe, so it never
          # constructs a bus.WithDLQ NATS publisher and PUBLISHES NO DOMAIN
          # EVENT of its own, ever.
          #
          # THAT IS NOT THE SAME AS PUBLISHING NOTHING, and `publish: { deny:
          # [">"] }` — this entry's previous value — was wrong for exactly that
          # conflation. A JetStream CONSUMER publishes to the broker even when
          # it emits zero domain events: pkg/bus/nats.go's Subscribe resolves
          # the stream and creates/binds the durable consumer under
          # `$JS.API.>`, and separately, Msg.Ack() publishes to `$JS.ACK.>` —
          # a THIRD, undocumented subject space `$JS.API.>` does not cover.
          # `deny: [">"]` denies both, which means it denies archiver's OWN
          # ACKNOWLEDGEMENTS. Subscribe's error path only LOGS a failed Ack
          # (logAckFailure) rather than surfacing it, so this failure is
          # completely silent: archiver would authenticate fine, subscribe
          # fine, process every message successfully, have every Ack denied,
          # and the broker would redeliver the SAME message after AckWait
          # forever — INFINITE SILENT REDELIVERY, with every health check
          # archiver exports reporting green throughout, and duplicate Kafka
          # produces on every redelivery (this consumer's WithDLQ absence and
          # at-least-once design tolerate duplicates, but not this volume of
          # them, and the real damage is that lag/pending metrics would show
          # a permanently stuck consumer with no error anywhere pointing at
          # tenancy.yaml).
          #
          # The correct grant is therefore an ALLOW-LIST of exactly the
          # JetStream machinery a consumer needs — `$JS.API.>` and
          # `$JS.ACK.>` — and NOTHING else: archiver's domain events genuinely
          # do go to Kafka, not NATS, so no domain subject belongs here. (The
          # trap noted elsewhere in this account still applies in principle —
          # an explicitly empty `allow: []` was proven not to restrict
          # anything on this nats-server version — but it is moot here since
          # this allow-list is non-empty.)
          #
          # Its subscribe set (services/archiver/internal/config/config.go's
          # DefaultSubjects, ARCHIVER_SUBJECTS) is deliberately broad BY DESIGN
          # — DATA-M1 exists to archive everything with irreplaceable history
          # — not because it could not be narrowed: market.> is already
          # excluded (re-fetchable from the venue) and so is observability.>
          # (ephemeral, no subject declared on it).
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/archiver"
            permissions: {
              publish: { allow: ["$JS.API.>", "$JS.ACK.>"] }
              subscribe: {
                allow: [
                  "order.>", "strategy.>", "execution.>", "accounting.>", "settlement.>",
                  "compliance.breach.>", "compliance.mandate.>", "risk.portfolio.>", "risk.exposure.>",
                  "risk.signal.>", "risk.command.>", "risk.position.>", "inference.>", "platform.>",
                  "data.>", "_INBOX.>", "$JS.API.>",
                ]
              }
            }
          }
          # audit materializes services/audit/internal/config/config.go's
          # DefaultSubjects = [">"] — EVERY subject in the account,
          # DELIBERATELY ("audit completeness over economy", narrowed only via
          # AUDIT_SUBJECTS with a documented reason). This is the one entry
          # below where `subscribe: [">"]` is the CORRECT, code-derived answer,
          # not an unnarrowed leftover — it already covers _INBOX.> and $JS.*
          # as a subset. It publishes nothing itself except dlq.<whatever it
          # was subscribed to>, which for a ">" subscription is only bounded by
          # dlq.> in turn.
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/audit"
            permissions: {
              publish: { allow: ["dlq.>", "$JS.API.>", "$JS.ACK.>"] }
              subscribe: { allow: [">"] }
            }
          }
          # compliance PUBLISHES platform.compliance.decision (the durable
          # decision-audit FACT, services/compliance/internal/audit/audit.go)
          # and compliance.breach.detected (internal/compliance's SubjectBreach,
          # the post-trade monitor's emitter). It SUBSCRIBES the compacted
          # position stream (subject.PositionAll) and the mandate stream
          # (comp.SubjectMandateAll) — both via SubscribeBroadcast /
          # SubscribeBroadcastReady, which never route to DLQ (see above), so
          # no dlq.* grant is needed here.
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/compliance"
            permissions: {
              publish: {
                allow: [
                  "platform.compliance.decision", "compliance.breach.detected",
                  "$JS.API.>", "$JS.ACK.>",
                ]
              }
              subscribe: { allow: ["risk.position.changed.>", "compliance.mandate.changed.>", "_INBOX.>"] }
            }
          }
          # market-data both PUBLISHES (services/market-data/internal/feed/
          # bussink.go: market.<assetClass>.<variant>, one deploy per asset
          # class) and SUBSCRIBES (MARKET_DATA_SUBJECTS, default market.>) —
          # the subject taxonomy's domain wildcard is the honest boundary for
          # both directions here, not an unnarrowed guess: assetClass and
          # variant are runtime-configured per deployment and the ingest
          # subscription is explicitly the whole market.> wildcard by default.
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/market-data"
            permissions: {
              publish: { allow: ["market.>", "dlq.market.>", "$JS.API.>", "$JS.ACK.>"] }
              # order.cost.recorded (#436): market-data OWNS the bar series, so
              # the join between an execution's cost and what the market did over
              # the same window belongs here. SUBSCRIBE ONLY, and deliberately not
              # in the publish list above — the cost record is the OMS's, and this
              # adds a second reading of it rather than publishing back into the
              # loop that produced it.
              subscribe: { allow: ["market.>", "order.cost.recorded", "_INBOX.>"] }
            }
          }
          # market-ingest (services/market-ingest/cmd/market-ingest, the open
          # binary this image builds — infra/deploy/market-ingest-deploy.yaml)
          # registers NO alpha engines, so pkg/alpha.Runner never wires
          # internal/signal/translate's Translator and PUBLISHES ONLY the
          # bounded book snapshot (internal/marketedge/ingest/engine.go's
          # SubjectBookSnapshot = market.book.snapshot) via its health-wrapped
          # producer. It never subscribes to anything. NOTE: the package
          # comment on pkg/alpha.Runner.New documents a separate "restricted
          # layer" that imports pkg/alpha and CAN register engines, which would
          # additionally publish strategy.signal.received / order.order.submit
          # through the same Translator webhook-ingest uses — that layer is not
          # in this repository and is not what infra/deploy's image builds, so
          # it is out of scope for this derivation; if it is ever run under
          # this SVID, this grant will deny it at publish time and this
          # comment is the pointer to why.
          #
          # SECOND PUBLISHER, ADDED WITH #425: internal/marketedge/bars folds the
          # same trade feeds into 1-minute candles and publishes
          # market.crypto.bar — the producer ohlcv_bars was missing, without
          # which that table stays empty. It rides the existing market.crypto.*
          # subject space (market.crypto.trade already uses it), so it needs no
          # new Kafka topic and no new archival decision. The grant is derived by
          # test/arch's TestServicePublishesOnlySubjectsItsTenancyPermissionsAllow
          # from internal/marketedge/bars, which had to be added to that test's
          # package list: the derivation is per-package and was passing by not
          # looking, which would have surfaced as a NATS permissions denial in
          # production behind a green suite.
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/market-ingest"
            permissions: {
              publish: { allow: ["market.book.snapshot", "market.crypto.bar"] }
              subscribe: { allow: ["_INBOX.>"] }
            }
          }
          # oms is the trading core: it CONSUMES order commands
          # (order.order.submit/.amend/.cancel, config.CommandSubjects) and
          # fill FACTs (order.order.filled/.partially_filled,
          # config.FillSubjects) via bus.NewConsumer(..., bus.WithDLQ(client))
          # — "WithDLQ is load-bearing on this path, not hygiene" per the
          # service's own main.go comment — plus the price spine
          # (OMS_PRICE_SUBJECTS, default market.*.trade,market.*.quote) and the
          # mandate stream (comp.SubjectMandateAll) via SubscribeBroadcast(Ready),
          # which do not route to DLQ. It PUBLISHES the full order lifecycle
          # (services/oms/internal/order/events.go's EventType* constants:
          # accepted/rejected/routed/filled/partially_filled/cancelled/expired/
          # outcome/pending_approval), the position projections at both grains EXEC-M19a/M20
          # established (subject.PositionFor → risk.position.changed.>,
          # subject.VenuePositionFor → risk.position.venue.changed.>), and
          # settlement failures (posttrade.BusFailSink's
          # eventTypeSettlementFail = settlement.instruction.fail).
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/oms"
            permissions: {
              publish: {
                allow: [
                  "order.order.accepted", "order.order.rejected", "order.order.routed",
                  "order.order.filled", "order.order.partially_filled", "order.order.cancelled",
                  "order.order.expired", "order.order.outcome",
                  # AN ORDER HELD FOR A SECOND SIGNATURE (#410). It is the ONLY
                  # thing the estate hears about an order the maker-checker gate
                  # held: such an order is deliberately not in the book, so
                  # without this grant a held order would be durable in
                  # order_proposals and announced to nobody — the silent drop
                  # #410 exists to end, reintroduced by a missing line in a
                  # permissions file. It rides the EXECUTION stream and the
                  # archiver's existing order.> rule with no new mapping.
                  "order.order.pending_approval",
                  # REALIZED EXECUTION COST, PER FILL (#436). Derived from the
                  # OMS's own fills and the arrival mark stamped at admission, so
                  # it belongs to the order domain the OMS already owns — the
                  # EXECUTION stream carries it under order.>, and the archiver's
                  # default subject list archives it with no new mapping.
                  #
                  # PUBLISH ONLY, and nothing on the trading path subscribes. A
                  # measurement that could be read back into a routing decision
                  # would put an analytic on the capital path; the venue ranking
                  # that will consume this (#437) is a separate reader.
                  "order.cost.recorded",
                  "risk.position.changed.>", "risk.position.venue.changed.>",
                  "settlement.instruction.fail",
                  "dlq.order.order.submit", "dlq.order.order.amend", "dlq.order.order.cancel",
                  "dlq.order.order.filled", "dlq.order.order.partially_filled",
                  "$JS.API.>", "$JS.ACK.>",
                ]
              }
              subscribe: {
                allow: [
                  "order.order.submit", "order.order.amend", "order.order.cancel",
                  "order.order.filled", "order.order.partially_filled",
                  "market.*.trade", "market.*.quote", "compliance.mandate.changed.>",
                  # WHAT THE PORTFOLIO CAN SPEND (#450), for the pre-trade
                  # buying-power gate. SUBSCRIBE ONLY, and that asymmetry is the
                  # point: accounting is the book of record for cash and the OMS
                  # must never publish a balance, or there are two computations
                  # of one number and they will disagree at the worst moment.
                  "accounting.balance.portfolio",
                  # WHAT THE RISK ENGINE HAS COMPUTED (#438), for the risk half of
                  # the pre-trade gate. SUBSCRIBE ONLY, and the asymmetry is the
                  # same one cash carries: the risk engine is the authority on
                  # these numbers and the OMS must never publish one, or there are
                  # two computations of a VaR and they will disagree at the worst
                  # possible moment.
                  "risk.portfolio.measures_computed",
                  "_INBOX.>",
                ]
              }
            }
          }
          # tv-sync SUBSCRIBES ONLY — it folds the OMS order/fill FACT stream
          # (internal/projection.Subjects(): accepted/routed/partially_filled/
          # filled/rejected/cancelled/expired) and the price spine
          # (TV_SYNC_PRICE_SUBJECTS, default market.*.trade,market.*.quote)
          # into its read-only TradingView projection; it never publishes a
          # FACT of its own. Unlike oms/compliance, ALL of tv-sync's subjects —
          # including the price spine — go through plain consumer.Subscribe
          # (bus.NewConsumer(..., bus.WithDLQ(client))), not
          # SubscribeBroadcast, so every one of them needs a dlq.* grant too.
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/tv-sync"
            permissions: {
              publish: {
                allow: [
                  "dlq.order.order.accepted", "dlq.order.order.routed", "dlq.order.order.partially_filled",
                  "dlq.order.order.filled", "dlq.order.order.rejected", "dlq.order.order.cancelled",
                  "dlq.order.order.expired", "dlq.market.*.trade", "dlq.market.*.quote",
                  "$JS.API.>", "$JS.ACK.>",
                ]
              }
              subscribe: {
                allow: [
                  "order.order.accepted", "order.order.routed", "order.order.partially_filled",
                  "order.order.filled", "order.order.rejected", "order.order.cancelled",
                  "order.order.expired", "market.*.trade", "market.*.quote", "_INBOX.>",
                ]
              }
            }
          }
          # venue-binance / venue-okx are venue adapters: they receive order
          # commands over gRPC directly from OMS (internal/venueadapter/server),
          # never over NATS, so neither ever calls consumer.Subscribe — no
          # dlq.* grant and no JetStream consumer permissions. They PUBLISH raw
          # crypto trade ticks (market.crypto.trade, {binance,okx}_connector.go),
          # reconciliation healing FACTs (internal/execution's
          # SubjectStateHealed = order.order.healed, SubjectBalanceRecon =
          # accounting.balance.reconciled — {binance,okx}_recon.go), and fills
          # observed on the exchange's own user-data stream
          # (order.order.partially_filled / .filled — {binance,okx}_userdata.go).
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/venue-binance"
            permissions: {
              publish: {
                allow: [
                  "market.crypto.trade", "order.order.healed", "accounting.balance.reconciled",
                  "order.order.partially_filled", "order.order.filled",
                  # The DLQ for the cash spine it consumes (#418). The broadcast
                  # path never routes here, but the consumer is wired WithDLQ like
                  # every other on the estate — so the grant exists rather than
                  # becoming a publish denial the day a queue subscription is added
                  # beside it, which would lose the event it was meant to park.
                  "dlq.accounting.balance.portfolio",
                  # JETSTREAM MACHINERY, required from the moment this service
                  # became a CONSUMER (#418). $JS.API.> resolves the stream and
                  # binds the consumer — without it every Subscribe fails at
                  # startup. $JS.ACK.> is the separate subject space Msg.Ack()
                  # publishes to, and its absence is the silent one: the handler
                  # processes every message, the ack is denied, and the broker
                  # redelivers the same message forever while every health check
                  # stays green.
                  "$JS.API.>", "$JS.ACK.>",
                ]
              }
              subscribe: {
                allow: [
                  # WHAT KANZ BELIEVES THIS ACCOUNT HOLDS (#418/#450). The adapter
                  # folds only the entries carrying its own venue_account_id and
                  # reconciles the exchange against them. SUBSCRIBE ONLY: an adapter
                  # that could publish a balance would be a second computation of a
                  # number only the ledger may compute.
                  "accounting.balance.portfolio",
                  "_INBOX.>",
                ]
              }
            }
          }
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/venue-okx"
            permissions: {
              publish: {
                allow: [
                  "market.crypto.trade", "order.order.healed", "accounting.balance.reconciled",
                  "order.order.partially_filled", "order.order.filled",
                  # The DLQ for the cash spine it consumes (#418). The broadcast
                  # path never routes here, but the consumer is wired WithDLQ like
                  # every other on the estate — so the grant exists rather than
                  # becoming a publish denial the day a queue subscription is added
                  # beside it, which would lose the event it was meant to park.
                  "dlq.accounting.balance.portfolio",
                  # JETSTREAM MACHINERY, required from the moment this service
                  # became a CONSUMER (#418). $JS.API.> resolves the stream and
                  # binds the consumer — without it every Subscribe fails at
                  # startup. $JS.ACK.> is the separate subject space Msg.Ack()
                  # publishes to, and its absence is the silent one: the handler
                  # processes every message, the ack is denied, and the broker
                  # redelivers the same message forever while every health check
                  # stays green.
                  "$JS.API.>", "$JS.ACK.>",
                ]
              }
              subscribe: {
                allow: [
                  # WHAT KANZ BELIEVES THIS ACCOUNT HOLDS (#418/#450). The adapter
                  # folds only the entries carrying its own venue_account_id and
                  # reconciles the exchange against them. SUBSCRIBE ONLY: an adapter
                  # that could publish a balance would be a second computation of a
                  # number only the ledger may compute.
                  "accounting.balance.portfolio",
                  "_INBOX.>",
                ]
              }
            }
          }
          # wealth became a real bus.DialNATS caller when its household-valuation
          # consumer was wired (WEALTH-01b): the Folder.Handle fold had been
          # bus-handler-shaped and unreachable since it was written, because
          # nothing in this service ever called bus.NewConsumer. SEC-M3b requires
          # every dialer to be admitted here; test/arch/nats_identity_test.go's
          # TestNATSDialersHaveBrokerAccounts caught the gap before it shipped.
          #
          # It only CONSUMES kanz-household's wealth.household.valued.>
          # (internal/wealth's SubjectHouseholdAll, WEALTH_SUBJECTS) via
          # bus.NewConsumer(..., bus.WithDLQ(client)) — no service code
          # publishes to NATS on this account.
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/wealth"
            permissions: {
              publish: { allow: ["dlq.wealth.household.valued.>", "$JS.API.>", "$JS.ACK.>"] }
              subscribe: { allow: ["wealth.household.valued.>", "_INBOX.>"] }
            }
          }
          # webhook-ingest PUBLISHES the audit-root signal FACT
          # (internal/signal/translate's SubjectSignal =
          # strategy.signal.received) and the order COMMAND its Translator fans
          # out per venue (SubjectSubmit = order.order.submit) — the second
          # governed write path onto the order book alongside api-gateway. It
          # SUBSCRIBES the kill-switch (translate.SubjectModeChanged =
          # platform.mode.changed) and the per-venue position spine
          # (subject.VenuePositionAll = risk.position.venue.changed.>, EXEC-
          # M19a) so its CLOSE path can flatten what is actually held at each
          # venue — both via SubscribeBroadcast(Ready), never plain Subscribe,
          # so neither needs a dlq.* grant.
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/webhook-ingest"
            permissions: {
              publish: {
                allow: [
                  # MT-02 (#360): signal-originated orders carry the tenant
                  # routing prefix, resolved per signal from TenantOf(fund_id) —
                  # one endpoint serves many funds, so a service-level tenant
                  # would be the wrong one for all but a single fund.
                  "tenant.*.order.order.submit",
                  "strategy.signal.received", "order.order.submit",
                  "$JS.API.>", "$JS.ACK.>",
                ]
              }
              subscribe: { allow: ["platform.mode.changed", "risk.position.venue.changed.>", "_INBOX.>"] }
            }
          }
        ]
      }

      # ---- tenant template — one account per tenant ------------------------
      # Per-account JetStream quota (noisy-neighbor bound; MT-01e tightens it).
      # Streams are provisioned per-account by running the nats-bootstrap script
      # connected on this account (see README "Per-tenant streams").
      acme {
        jetstream { max_memory: 64MB, max_file: 2GB, max_streams: 16, max_consumers: 256 }

        # The other half of the bridge (#358). `to:` remaps the prefixed subject
        # onto the logical one, so this tenant's OMS subscribes
        # `order.order.submit` unchanged and never learns a prefix exists.
        #
        # It imports ONLY its own prefix. A wildcard here would hand this tenant
        # every other tenant's orders, which is the isolation boundary this whole
        # epic exists to establish — test/arch/tenant_bridge_test.go fails the
        # build if an account's import does not match its own name.
        imports: [
          { stream: { account: __system__, subject: "tenant.acme.order.order.submit" }
            to: "order.order.submit" }
          { stream: { account: __system__, subject: "tenant.acme.order.order.cancel" }
            to: "order.order.cancel" }
        ]

        users: [
          # The tenant's workloads present this SVID; verify_and_map binds the
          # URI SAN to this user → account, scoping all its pub/sub.
          { user: "spiffe://kanz.internal/ns/tenant-acme/sa/risk-engine" }
          # MT-02 compute: the per-tenant OMS pod's ServiceAccount is
          # oms-acme in kanz-services (not tenant-acme — the compute layer is
          # a name-suffixed platform ServiceAccount, not a per-tenant
          # namespace; see kanz/infra/deploy/tenants/README.md). Added by
          # provision-tenant.sh's `compute` step per its printed instruction;
          # without this the pod authenticates but cannot reach any account
          # (SEC-M3). test/arch/tenant_compute_test.go fails the build if
          # this and kanz/infra/deploy/tenants/acme/ ever drift apart.
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/oms-acme" }
        ]
      }
    }

          # it emits zero domain events: pkg/bus/nats.go's Subscribe resolves
          # the stream and creates/binds the durable consumer under
          # `$JS.API.>`, and separately, Msg.Ack() publishes to `$JS.ACK.>` —
          # a THIRD, undocumented subject space `$JS.API.>` does not cover.
          # `deny: [">"]` denies both, which means it denies archiver's OWN
          # ACKNOWLEDGEMENTS. Subscribe's error path only LOGS a failed Ack
          # (logAckFailure) rather than surfacing it, so this failure is
          # completely silent: archiver would authenticate fine, subscribe
          # fine, process every message successfully, have every Ack denied,
          # and the broker would redeliver the SAME message after AckWait
          # forever — INFINITE SILENT REDELIVERY, with every health check
          # archiver exports reporting green throughout, and duplicate Kafka
          # produces on every redelivery (this consumer's WithDLQ absence and
          # at-least-once design tolerate duplicates, but not this volume of
          # them, and the real damage is that lag/pending metrics would show
          # a permanently stuck consumer with no error anywhere pointing at
          # tenancy.yaml).
          #
          # The correct grant is therefore an ALLOW-LIST of exactly the
          # JetStream machinery a consumer needs — `$JS.API.>` and
          # `$JS.ACK.>` — and NOTHING else: archiver's domain events genuinely
          # do go to Kafka, not NATS, so no domain subject belongs here. (The
          # trap noted elsewhere in this account still applies in principle —
          # an explicitly empty `allow: []` was proven not to restrict
          # anything on this nats-server version — but it is moot here since
          # this allow-list is non-empty.)
          #
          # Its subscribe set (services/archiver/internal/config/config.go's
          # DefaultSubjects, ARCHIVER_SUBJECTS) is deliberately broad BY DESIGN
          # — DATA-M1 exists to archive everything with irreplaceable history
          # — not because it could not be narrowed: market.> is already
          # excluded (re-fetchable from the venue) and so is observability.>
          # (ephemeral, no subject declared on it).
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/archiver"
            permissions: {
              publish: { allow: ["$JS.API.>", "$JS.ACK.>"] }
              subscribe: {
                allow: [
                  "order.>", "strategy.>", "execution.>", "accounting.>", "settlement.>",
                  "compliance.breach.>", "compliance.mandate.>", "risk.portfolio.>", "risk.exposure.>",
                  "risk.signal.>", "risk.command.>", "risk.position.>",
                  "risk.curve.>", "risk.factor.>", "inference.>", "platform.>",
                  "data.>", "_INBOX.>", "$JS.API.>",
                ]
              }
            }
          }
          # audit materializes services/audit/internal/config/config.go's
          # DefaultSubjects = [">"] — EVERY subject in the account,
          # DELIBERATELY ("audit completeness over economy", narrowed only via
          # AUDIT_SUBJECTS with a documented reason). This is the one entry
          # below where `subscribe: [">"]` is the CORRECT, code-derived answer,
          # not an unnarrowed leftover — it already covers _INBOX.> and $JS.*
          # as a subset. It publishes nothing itself except dlq.<whatever it
          # was subscribed to>, which for a ">" subscription is only bounded by
          # dlq.> in turn.
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/audit"
            permissions: {
              publish: { allow: ["dlq.>", "$JS.API.>", "$JS.ACK.>"] }
              subscribe: { allow: [">"] }
            }
          }
          # compliance PUBLISHES platform.compliance.decision (the durable
          # decision-audit FACT, services/compliance/internal/audit/audit.go)
          # and compliance.breach.detected (internal/compliance's SubjectBreach,
          # the post-trade monitor's emitter). It SUBSCRIBES the compacted
          # position stream (subject.PositionAll) and the mandate stream
          # (comp.SubjectMandateAll) — both via SubscribeBroadcast /
          # SubscribeBroadcastReady, which never route to DLQ (see above), so
          # no dlq.* grant is needed here.
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/compliance"
            permissions: {
              publish: {
                allow: [
                  "platform.compliance.decision", "compliance.breach.detected",
                  "$JS.API.>", "$JS.ACK.>",
                ]
              }
              subscribe: {
                allow: [
                  "risk.position.changed.>", "compliance.mandate.changed.>", "_INBOX.>",
                  # WHAT THE POST-TRADE BOOK IS WORTH (#787). Position FACTs carry
                  # holdings and nothing else, so the monitor's book was a positions
                  # total valued at average cost — and gross exposure is the sum of
                  # the same values, which made a max_gross_leverage cap score 1.0
                  # for any long-only book and bind on nothing (#780).
                  #
                  # These two are the rest of the equity: what accounting says the
                  # portfolio can spend, and what its holdings are worth now. SAME
                  # SUBJECTS THE OMS SUBSCRIBES TO, deliberately — the pre-trade and
                  # post-trade halves of one leverage cap must not be valued off
                  # different feeds.
                  #
                  # SUBSCRIBE ONLY, and both asymmetries are load-bearing: accounting
                  # is the book of record for cash and market-data owns the price
                  # spine. A compliance service that could publish either would be a
                  # second computation of a number that already has an authority.
                  "accounting.balance.portfolio",
                  "market.*.trade", "market.*.quote",
                ]
              }
            }
          }
          # market-data both PUBLISHES (services/market-data/internal/feed/
          # bussink.go: market.<assetClass>.<variant>, one deploy per asset
          # class) and SUBSCRIBES (MARKET_DATA_SUBJECTS, default market.>) —
          # the subject taxonomy's domain wildcard is the honest boundary for
          # both directions here, not an unnarrowed guess: assetClass and
          # variant are runtime-configured per deployment and the ingest
          # subscription is explicitly the whole market.> wildcard by default.
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/market-data"
            permissions: {
              publish: { allow: ["market.>", "dlq.market.>", "$JS.API.>", "$JS.ACK.>"] }
              # order.cost.recorded (#436): market-data OWNS the bar series, so
              # the join between an execution's cost and what the market did over
              # the same window belongs here. SUBSCRIBE ONLY, and deliberately not
              # in the publish list above — the cost record is the OMS's, and this
              # adds a second reading of it rather than publishing back into the
              # loop that produced it.
              subscribe: { allow: ["market.>", "order.cost.recorded", "_INBOX.>"] }
            }
          }
          # market-ingest (services/market-ingest/cmd/market-ingest, the open
          # binary this image builds — infra/deploy/market-ingest-deploy.yaml)
          # registers NO alpha engines, so pkg/alpha.Runner never wires
          # internal/signal/translate's Translator and PUBLISHES ONLY the
          # bounded book snapshot (internal/marketedge/ingest/engine.go's
          # SubjectBookSnapshot = market.book.snapshot) via its health-wrapped
          # producer. It never subscribes to anything. NOTE: the package
          # comment on pkg/alpha.Runner.New documents a separate "restricted
          # layer" that imports pkg/alpha and CAN register engines, which would
          # additionally publish strategy.signal.received / order.order.submit
          # through the same Translator webhook-ingest uses — that layer is not
          # in this repository and is not what infra/deploy's image builds, so
          # it is out of scope for this derivation; if it is ever run under
          # this SVID, this grant will deny it at publish time and this
          # comment is the pointer to why.
          #
          # SECOND PUBLISHER, ADDED WITH #425: internal/marketedge/bars folds the
          # same trade feeds into 1-minute candles and publishes
          # market.crypto.bar — the producer ohlcv_bars was missing, without
          # which that table stays empty. It rides the existing market.crypto.*
          # subject space (market.crypto.trade already uses it), so it needs no
          # new Kafka topic and no new archival decision. The grant is derived by
          # test/arch's TestServicePublishesOnlySubjectsItsTenancyPermissionsAllow
          # from internal/marketedge/bars, which had to be added to that test's
          # package list: the derivation is per-package and was passing by not
          # looking, which would have surfaced as a NATS permissions denial in
          # production behind a green suite.
          #
          # THIRD PUBLISHER, ADDED WITH #591: internal/marketedge/coverage
          # publishes market.crypto.ingestion_coverage — the record of which
          # intervals this platform was actually OBSERVING, attested by the
          # process holding the venue subscriptions. It rides market.crypto.*
          # for the same reason the candle does, so again no new Kafka topic and
          # no new archival decision. It is the same per-package derivation trap:
          # the package is listed in that test's crossPackagePublishSurfaces, and
          # WITHOUT THE GRANT BELOW every attestation is denied at publish time
          # while the feeds keep running — which reads downstream as "the
          # platform was never looking", the exact conclusion the record exists
          # to make impossible. Coverage cannot be reconstructed afterwards, so a
          # denial here is not a delay, it is permanent loss.
          #
          # FOURTH PUBLISHER, ADDED WITH #897: internal/volprofilefeed publishes
          # market.crypto.volume_profile - the per-(instrument, venue) intraday
          # volume profile, versioned so a parent order can pin the exact curve
          # its schedule was derived against. It rides market.crypto.* for the
          # reason the candle and the coverage record do, so again no new stream,
          # no new Kafka topic and no new archival decision.
          #
          # IT IS THE SAME PER-PACKAGE DERIVATION TRAP the two above record: the
          # bus.Event is built inside the shared package, so the package is listed
          # in crossPackagePublishSurfaces in
          # test/arch/nats_service_permissions_test.go. WITHOUT THE GRANT BELOW
          # every profile is denied at publish time while the fold keeps running -
          # and the OMS then refuses every VWAP and POV order under
          # NO_VOLUME_PROFILE, a refusal whose text names the MARKET rather than a
          # missing line in this file.
          #
          # FIFTH PUBLISHER, ADDED WITH #876: internal/marketedge/ingest also
          # publishes market.crypto.quote - the TOP OF THE BOOK it is already
          # folding, as a canonical market.v1 Quote, on the same tick and from
          # the same Book.Snapshot read as the book snapshot above.
          #
          # IT IS THE ONLY PRODUCER OF A TWO-SIDED QUOTE IN THE ESTATE. Both
          # venue adapters poll a last-price REST ticker and publish
          # market.crypto.trade; market-data's feed loop is not started in the
          # shipped manifest; datamaster emits Quote{BidPrice: p, AskPrice: p},
          # a mid dressed as a quote that internal/marketdata/mark refuses
          # correctly. So a trade print has no width, no width means no spread
          # leg, and every execution-cost attribution the platform publishes
          # comes back quality = TOTAL_ONLY - which is what OMSQuoteCoverageAbsent
          # fires on today.
          #
          # WITHOUT THE GRANT BELOW THAT STATE IS UNCHANGED AND LOOKS IDENTICAL.
          # The fold keeps running, the snapshots keep landing, and the quote is
          # denied at publish time - which reaches an operator as "the desk's
          # instruments are not quoted", the exact condition being fixed. It is
          # the same per-package derivation trap the four publishers above
          # record: the bus.Event is built inside internal/marketedge/ingest,
          # already listed in crossPackagePublishSurfaces in
          # test/arch/nats_service_permissions_test.go.
          #
          # It rides market.crypto.* like the candle, the coverage record and the
          # volume profile, so it needs no new stream (MARKET is provisioned as
          # market.>) and no new Kafka topic. The consumer half already exists:
          # OMS_PRICE_SUBJECTS and TV_SYNC_PRICE_SUBJECTS default to
          # market.*.trade,market.*.quote and both accounts already hold the
          # matching subscribe grant.
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/market-ingest"
            permissions: {
              publish: { allow: ["market.book.snapshot", "market.crypto.bar",
                                 "market.crypto.ingestion_coverage", "market.crypto.volume_profile",
                                 "market.crypto.quote"] }
              subscribe: { allow: ["_INBOX.>"] }
            }
          }
          # oms is the trading core: it CONSUMES order commands
          # (order.order.submit/.amend/.cancel/.approve, config.CommandSubjects)
          # and fill FACTs (order.order.filled/.partially_filled,
          # config.FillSubjects) via bus.NewConsumer(..., bus.WithDLQ(client))
          # — "WithDLQ is load-bearing on this path, not hygiene" per the
          # service's own main.go comment — plus the price spine
          # (OMS_PRICE_SUBJECTS, default market.*.trade,market.*.quote) and the
          # mandate stream (comp.SubjectMandateAll) via SubscribeBroadcast(Ready),
          # which do not route to DLQ. It PUBLISHES the full order lifecycle
          # (services/oms/internal/order/events.go's EventType* constants:
          # accepted/rejected/routed/filled/partially_filled/cancelled/expired/
          # outcome/pending_approval), the position projections at both grains EXEC-M19a/M20
          # established (subject.PositionFor → risk.position.changed.>,
          # subject.VenuePositionFor → risk.position.venue.changed.>), and
          # settlement failures (posttrade.BusFailSink's
          # eventTypeSettlementFail = settlement.instruction.fail).
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/oms"
            permissions: {
              publish: {
                allow: [
                  "order.order.accepted", "order.order.rejected", "order.order.routed",
                  "order.order.filled", "order.order.partially_filled", "order.order.cancelled",
                  "order.order.expired", "order.order.outcome",
                  # AN ORDER HELD FOR A SECOND SIGNATURE (#410). It is the ONLY
                  # thing the estate hears about an order the maker-checker gate
                  # held: such an order is deliberately not in the book, so
                  # without this grant a held order would be durable in
                  # order_proposals and announced to nobody — the silent drop
                  # #410 exists to end, reintroduced by a missing line in a
                  # permissions file. It rides the EXECUTION stream and the
                  # archiver's existing order.> rule with no new mapping.
                  "order.order.pending_approval",
                  # THE SECOND SIGNATURE ON A HELD ORDER (#410, clause (d)). It
                  # is the ONLY thing on the bus that names the approver —
                  # ORDER_ACCEPTED carries an OrderState with no approver field
                  # and the ACCEPTED CommandOutcome names neither party — so
                  # without this grant "who countersigned this order" is
                  # answerable only from the OMS's own order_proposals table,
                  # which services/audit cannot read. A missing line here does
                  # not stop the order: the claim commits, the FACT sits in the
                  # outbox failing to publish, and the audit trail is short one
                  # approval with the trade already live. It rides the EXECUTION
                  # stream and the archiver's existing order.> rule with no new
                  # mapping, exactly as pending_approval above does.
                  "order.order.approved",
                  # REALIZED EXECUTION COST, PER FILL (#436). Derived from the
                  # OMS's own fills and the arrival mark stamped at admission, so
                  # it belongs to the order domain the OMS already owns — the
                  # EXECUTION stream carries it under order.>, and the archiver's
                  # default subject list archives it with no new mapping.
                  #
                  # PUBLISH ONLY, and nothing on the trading path subscribes. A
                  # measurement that could be read back into a routing decision
                  # would put an analytic on the capital path; the venue ranking
                  # that will consume this (#437) is a separate reader.
                  "order.cost.recorded",
                  # WHAT ONE DECISION COST, DECOMPOSED (#866). Emitted ONCE per
                  # parent order — or per unsliced order — at the moment it
                  # reaches a terminal status, in the same transaction as the
                  # state change. It is the per-DECISION grain of the same
                  # measurement order.cost.recorded carries per FILL, which is
                  # why it shares that subject's first two tokens: the Kafka
                  # topic is derived from them (internal/topic.For), so both land
                  # on order.cost, partitioned by the same order id, and a report
                  # reads one topic instead of interleaving two.
                  #
                  # A MISSING LINE HERE IS SILENT AND EXPENSIVE. The OMS commits
                  # the record to its outbox inside the terminal transaction and
                  # the relay then fails to publish it forever — the order is
                  # correct, the trade is booked, and the execution-quality
                  # report is short one decision with nothing saying so (#787).
                  #
                  # PUBLISH ONLY. Nothing on the trading path may read it: a
                  # measurement that could reroute or refuse an order would put
                  # an analytic on the capital path.
                  "order.cost.attributed",
                  "risk.position.changed.>", "risk.position.venue.changed.>",
                  # GRANTED, AND NOTHING PUBLISHES IT (#589). posttrade.BusFailSink
                  # is defined and never constructed, so this grant is exercised by
                  # no process and the SETTLEMENT stream is empty everywhere. The
                  # grant stays — revoking it would make wiring the plane a
                  # tenancy change as well as a code change — but it must not be
                  # read as evidence that settlement fails are being reported. The
                  # OMS composition root WARNs the posture at startup and exports
                  # kanz_oms_settlement_plane_running{stage="fail_publication"}=0,
                  # which is the only thing separating "not running on this
                  # deployment" from "running, and nothing has failed".
                  "settlement.instruction.fail",
                  # THE PRE-TRADE COMPLIANCE DECISION (#713). Every order this
                  # gate admits OR refuses is published as an
                  # observation.v1.DecisionLog, so AUDIT-01's append-only,
                  # hash-chained projection can answer "why was this trade
                  # allowed" about the enforcement point that decides whether
                  # capital MOVES. Until #713 the OMS recorded nowhere, and the
                  # platform could say a breach had been OBSERVED while being
                  # unable to say an order had been CHECKED.
                  #
                  # THE SAME SUBJECT THE COMPLIANCE SERVICE PUBLISHES, deliberately:
                  # one trail, two enforcement points, distinguished by the record's
                  # own `phase` attribute rather than by two subjects an auditor
                  # would have to know to union. The publisher is the shared
                  # internal/compliancebus, which is why services/oms names this
                  # subject nowhere in its own tree — see
                  # crossPackagePublishSurfaces in
                  # test/arch/nats_service_permissions_test.go, without which this
                  # grant would be present and unverified.
                  #
                  # NO dlq.platform.compliance.decision GRANT, and none is wanted.
                  # The OMS's recorder is ASYNCHRONOUS: it publishes from a
                  # background worker rather than inside a delivery, so there is no
                  # message to park and no consumer to redeliver it. A publish that
                  # fails is counted (kanz_compliance_decisions_dropped_total) and
                  # logged with the order it gated, which is the honest end state
                  # for a record whose subject has already been acted upon.
                  "platform.compliance.decision",
                  "dlq.order.order.submit", "dlq.order.order.amend", "dlq.order.order.cancel",
                  # The approve command parks like its three siblings (#539): it
                  # is consumed through the same bus.WithDLQ consumer, so without
                  # this grant a retry-exhausted approval cannot be parked —
                  # publishDLQ's own error surfaces and the message goes straight
                  # back on the broker for redelivery forever.
                  "dlq.order.order.approve",
                  "dlq.order.order.filled", "dlq.order.order.partially_filled",
                  "$JS.API.>", "$JS.ACK.>",
                ]
              }
              subscribe: {
                allow: [
                  "order.order.submit", "order.order.amend", "order.order.cancel",
                  # THE SECOND SIGNATURE (#539) joined config.CommandSubjects with
                  # the maker-checker gate. A subscriber with no matching entry is
                  # refused by the broker at RUNTIME: the OMS starts fine, never
                  # receives an approval, and every order it holds stays held with
                  # nothing anywhere reporting an error.
                  "order.order.approve",
                  "order.order.filled", "order.order.partially_filled",
                  "market.*.trade", "market.*.quote", "compliance.mandate.changed.>",
                  # THE INTRADAY VOLUME PROFILE (#897), which is what makes a VWAP
                  # or POV order placeable at all. It is folded by SubscribeReplay
                  # rather than SubscribeBroadcast, because this registry is
                  # version-ADDRESSED: a parent order pins the profile version its
                  # schedule was derived against, and delivering only the last
                  # message per subject would leave a cold pod holding one curve
                  # for one instrument.
                  #
                  # A DENIED SUBSCRIPTION IS SILENT (#787/#788). The OMS starts
                  # fine, folds nothing, and answers "no volume profile" to every
                  # question - which is also its honest answer for an instrument
                  # nobody measures, so a missing line here reads as a market
                  # rather than as a permission. SUBSCRIBE ONLY: the market-data
                  # edge is the authority on this curve and an OMS that published
                  # one would be a second measurement of the same market.
                  "market.crypto.volume_profile",
                  # THE REALISED CANDLE SERIES (#1007), which is what makes a
                  # participation cap MEASURABLE rather than merely declared. POV
                  # enforces its cap against the forecast profile above; this is
                  # the tape as it actually printed, and the OMS is the only
                  # process that also holds the decision and its children's fills.
                  # Folded by SubscribeReplay for the same reason: a participation
                  # measurement covers a parent's whole working window, and
                  # delivering only the last message per subject would hand a pod
                  # one candle for one instrument.
                  #
                  # A DENIED SUBSCRIPTION IS SILENT (#787/#788), and here it is
                  # silent in the worst available way: the OMS starts fine, folds
                  # nothing, and publishes every worked order's participation as
                  # UNOBSERVABLE - which is also its honest answer for a market
                  # nobody measures, so a missing line here reads as a thin tape
                  # rather than as a permission. SUBSCRIBE ONLY: market-ingest
                  # folds the candle and an OMS that published one would be a
                  # second measurement of the same market.
                  "market.crypto.bar",
                  # WHAT THE PORTFOLIO CAN SPEND (#450), for the pre-trade
                  # buying-power gate. SUBSCRIBE ONLY, and that asymmetry is the
                  # point: accounting is the book of record for cash and the OMS
                  # must never publish a balance, or there are two computations
                  # of one number and they will disagree at the worst moment.
                  "accounting.balance.portfolio",
                  # THE EXCHANGE'S OWN MARGIN STATE (#408 control 3, granted #788).
                  # The venue adapters publish it per ACCOUNT and the OMS folds it
                  # BROADCAST — every replica needs the whole picture, because a
                  # durable group would leave each pod holding a different margin
                  # state, and the same order would then be admitted by one pod and
                  # refused by another on a control whose whole purpose is to fail
                  # closed.
                  #
                  # THE SUBSCRIPTION SHIPPED WITHOUT THIS GRANT. Denied, the fold
                  # receives nothing and VenueMarginRule answers UNKNOWN for every
                  # account — which is also its honest answer for an account nobody
                  # has bound, so a mandate declaring margin trading refuses every
                  # order for a reason that looks exactly right. risk-engine has
                  # carried the identical grant since #408 and nothing compared the
                  # two.
                  #
                  # SUBSCRIBE ONLY, and no dlq.accounting.margin.observed grant: a
                  # broadcast subscription never routes to a DLQ.
                  "accounting.margin.observed",
                  # WHAT THE RISK ENGINE HAS COMPUTED (#438), for the risk half of
                  # the pre-trade gate. SUBSCRIBE ONLY, and the asymmetry is the
                  # same one cash carries: the risk engine is the authority on
                  # these numbers and the OMS must never publish one, or there are
                  # two computations of a VaR and they will disagree at the worst
                  # possible moment.
                  "risk.portfolio.measures_computed",
                  # THE PLATFORM KILL-SWITCH (#635). The OMS is the chokepoint
                  # every order on this platform passes through — the gateway's,
                  # webhook-ingest's, optimization's — so this one subscription is
                  # what makes a declared halt refuse ALL of them rather than the
                  # webhook channel alone. Consumed with SubscribeBroadcast, never
                  # a queue group: a durable group would hand the operator's
                  # resume to ONE replica and leave the others latched shut, and
                  # it therefore needs no dlq.platform.mode.changed grant.
                  #
                  # SUBSCRIBE ONLY. Publishing this subject is kanz-halt's alone
                  # (see its entry above); an OMS that could declare a halt could
                  # declare a resume.
                  "platform.mode.changed",
                  "_INBOX.>",
                ]
              }
            }
          }
          # tv-sync SUBSCRIBES ONLY — it folds the OMS order/fill FACT stream
          # (internal/projection.Subjects(): accepted/routed/partially_filled/
          # filled/rejected/cancelled/expired) and the price spine
          # (TV_SYNC_PRICE_SUBJECTS, default market.*.trade,market.*.quote)
          # into its read-only TradingView projection; it never publishes a
          # FACT of its own. Unlike oms/compliance, ALL of tv-sync's subjects —
          # including the price spine — go through plain consumer.Subscribe
          # (bus.NewConsumer(..., bus.WithDLQ(client))), not
          # SubscribeBroadcast, so every one of them needs a dlq.* grant too.
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/tv-sync"
            permissions: {
              publish: {
                allow: [
                  "dlq.order.order.accepted", "dlq.order.order.routed", "dlq.order.order.partially_filled",
                  "dlq.order.order.filled", "dlq.order.order.rejected", "dlq.order.order.cancelled",
                  "dlq.order.order.expired", "dlq.market.*.trade", "dlq.market.*.quote",
                  "$JS.API.>", "$JS.ACK.>",
                ]
              }
              subscribe: {
                allow: [
                  "order.order.accepted", "order.order.routed", "order.order.partially_filled",
                  "order.order.filled", "order.order.rejected", "order.order.cancelled",
                  "order.order.expired", "market.*.trade", "market.*.quote", "_INBOX.>",
                ]
              }
            }
          }
          # venue-binance / venue-okx are venue adapters: they receive order
          # commands over gRPC directly from OMS (internal/venueadapter/server),
          # never over NATS, so neither ever calls consumer.Subscribe — no
          # dlq.* grant and no JetStream consumer permissions. They PUBLISH raw
          # crypto trade ticks (market.crypto.trade, {binance,okx}_connector.go),
          # reconciliation healing FACTs (internal/execution's
          # SubjectStateHealed = order.order.healed, SubjectBalanceRecon =
          # accounting.balance.reconciled — {binance,okx}_recon.go), and fills
          # observed on the exchange's own user-data stream
          # (order.order.partially_filled / .filled — {binance,okx}_userdata.go).
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/venue-binance"
            permissions: {
              publish: {
                allow: [
                  "market.crypto.trade", "order.order.healed", "accounting.balance.reconciled",
                  "order.order.partially_filled", "order.order.filled",
                  # THE EXCHANGE'S OWN MARGIN STATE for the account this adapter's
                  # credential spends from (#408, control 1) — maintenance margin,
                  # the venue's margin ratio and the liquidation price per open
                  # position, observed rather than computed. On the ACCOUNTING
                  # spine because it is venue truth about the same account
                  # accounting.balance.reconciled already reports on. WITHOUT THIS
                  # GRANT the adapter authenticates fine and every margin
                  # observation is denied at publish — and the symptom is a margin
                  # control that refuses every order for want of a number nobody
                  # can see was blocked.
                  "accounting.margin.observed",
                  # The DLQ for the cash spine it consumes (#418). The broadcast
                  # path never routes here, but the consumer is wired WithDLQ like
                  # every other on the estate — so the grant exists rather than
                  # becoming a publish denial the day a queue subscription is added
                  # beside it, which would lose the event it was meant to park.
                  "dlq.accounting.balance.portfolio",
                  # JETSTREAM MACHINERY, required from the moment this service
                  # became a CONSUMER (#418). $JS.API.> resolves the stream and
                  # binds the consumer — without it every Subscribe fails at
                  # startup. $JS.ACK.> is the separate subject space Msg.Ack()
                  # publishes to, and its absence is the silent one: the handler
                  # processes every message, the ack is denied, and the broker
                  # redelivers the same message forever while every health check
                  # stays green.
                  "$JS.API.>", "$JS.ACK.>",
                ]
              }
              subscribe: {
                allow: [
                  # WHAT KANZ BELIEVES THIS ACCOUNT HOLDS (#418/#450). The adapter
                  # folds only the entries carrying its own venue_account_id and
                  # reconciles the exchange against them. SUBSCRIBE ONLY: an adapter
                  # that could publish a balance would be a second computation of a
                  # number only the ledger may compute.
                  "accounting.balance.portfolio",
                  # THE PLATFORM KILL-SWITCH (#635). This adapter is the LAST
                  # process between a command and a live exchange, and it heard
                  # nothing about a declared halt until this line: kanz-halt
                  # stopped webhook signals while this kept placing whatever the
                  # OMS routed. It refuses venue.v1 Execute while halted and still
                  # serves CancelOrder — a halt is not a cancel, and it must never
                  # jam the exits.
                  #
                  # Consumed with SubscribeBroadcast (no dlq.* grant needed) and
                  # SUBSCRIBE ONLY: publishing this subject is kanz-halt's alone.
                  "platform.mode.changed",
                  "_INBOX.>",
                ]
              }
            }
          }
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/venue-okx"
            permissions: {
              publish: {
                allow: [
                  "market.crypto.trade", "order.order.healed", "accounting.balance.reconciled",
                  "order.order.partially_filled", "order.order.filled",
                  # THE EXCHANGE'S OWN MARGIN STATE for the account this adapter's
                  # credential spends from (#408, control 1) — maintenance margin,
                  # the venue's margin ratio and the liquidation price per open
                  # position, observed rather than computed. On the ACCOUNTING
                  # spine because it is venue truth about the same account
                  # accounting.balance.reconciled already reports on. WITHOUT THIS
                  # GRANT the adapter authenticates fine and every margin
                  # observation is denied at publish — and the symptom is a margin
                  # control that refuses every order for want of a number nobody
                  # can see was blocked.
                  "accounting.margin.observed",
                  # The DLQ for the cash spine it consumes (#418). The broadcast
                  # path never routes here, but the consumer is wired WithDLQ like
                  # every other on the estate — so the grant exists rather than
                  # becoming a publish denial the day a queue subscription is added
                  # beside it, which would lose the event it was meant to park.
                  "dlq.accounting.balance.portfolio",
                  # JETSTREAM MACHINERY, required from the moment this service
                  # became a CONSUMER (#418). $JS.API.> resolves the stream and
                  # binds the consumer — without it every Subscribe fails at
                  # startup. $JS.ACK.> is the separate subject space Msg.Ack()
                  # publishes to, and its absence is the silent one: the handler
                  # processes every message, the ack is denied, and the broker
                  # redelivers the same message forever while every health check
                  # stays green.
                  "$JS.API.>", "$JS.ACK.>",
                ]
              }
              subscribe: {
                allow: [
                  # WHAT KANZ BELIEVES THIS ACCOUNT HOLDS (#418/#450). The adapter
                  # folds only the entries carrying its own venue_account_id and
                  # reconciles the exchange against them. SUBSCRIBE ONLY: an adapter
                  # that could publish a balance would be a second computation of a
                  # number only the ledger may compute.
                  "accounting.balance.portfolio",
                  # THE PLATFORM KILL-SWITCH (#635). This adapter is the LAST
                  # process between a command and a live exchange, and it heard
                  # nothing about a declared halt until this line: kanz-halt
                  # stopped webhook signals while this kept placing whatever the
                  # OMS routed. It refuses venue.v1 Execute while halted and still
                  # serves CancelOrder — a halt is not a cancel, and it must never
                  # jam the exits.
                  #
                  # Consumed with SubscribeBroadcast (no dlq.* grant needed) and
                  # SUBSCRIBE ONLY: publishing this subject is kanz-halt's alone.
                  "platform.mode.changed",
                  "_INBOX.>",
                ]
              }
            }
          }
          # wealth became a real bus.DialNATS caller when its household-valuation
          # consumer was wired (WEALTH-01b): the Folder.Handle fold had been
          # bus-handler-shaped and unreachable since it was written, because
          # nothing in this service ever called bus.NewConsumer. SEC-M3b requires
          # every dialer to be admitted here; test/arch/nats_identity_test.go's
          # TestNATSDialersHaveBrokerAccounts caught the gap before it shipped.
          #
          # It only CONSUMES — no service code publishes to NATS on this
          # account. TWO subjects, with DELIBERATELY OPPOSITE delivery:
          #
          #   · kanz-household's wealth.household.valued.> (SubjectHouseholdAll,
          #     WEALTH_SUBJECTS) through the DURABLE QUEUE GROUP, so a valuation
          #     is folded once across the deployment's two replicas.
          #   · kanz-model's wealth.model.published.> (SubjectModelAll,
          #     WEALTH_MODEL_SUBJECT) through SubscribeBroadcastReady, because
          #     the model catalogue is PER-PROCESS state and every replica needs
          #     every model. Under a queue group the two pods would hold disjoint
          #     catalogues and a household's drift would resolve or not depending
          #     on which pod the Service picked (#1010).
          #
          # Both are bus.NewConsumer(..., bus.WithDLQ(client)), so BOTH dlq.
          # subjects must be publishable: a model that fails validation is the
          # LAST message on its compacted subject and is redelivered on every
          # boot, so it must land somewhere inspectable rather than vanish.
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/wealth"
            permissions: {
              publish: { allow: ["dlq.wealth.household.valued.>", "dlq.wealth.model.published.>", "$JS.API.>", "$JS.ACK.>"] }
              subscribe: { allow: ["wealth.household.valued.>", "wealth.model.published.>", "_INBOX.>"] }
            }
          }
          # webhook-ingest PUBLISHES the audit-root signal FACT
          # (internal/signal/translate's SubjectSignal =
          # strategy.signal.received) and the order COMMAND its Translator fans
          # out per venue (SubjectSubmit = order.order.submit) — the second
          # governed write path onto the order book alongside api-gateway. It
          # SUBSCRIBES the kill-switch (halt.SubjectModeChanged =
          # platform.mode.changed) and the per-venue position spine
          # (subject.VenuePositionAll = risk.position.venue.changed.>, EXEC-
          # M19a) so its CLOSE path can flatten what is actually held at each
          # venue — both via SubscribeBroadcast(Ready), never plain Subscribe,
          # so neither needs a dlq.* grant.
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/webhook-ingest"
            permissions: {
              publish: {
                allow: [
                  # MT-02 (#360): signal-originated orders carry the tenant
                  # routing prefix, resolved per signal from the service's
                  # strategy->fund->tenant binding table (translate.FundAuthority)
                  # — one endpoint serves many funds, so a service-level tenant
                  # would be the wrong one for all but a single fund.
                  #
                  # THE WILDCARD IS NOT NARROWED, and #632 is where that was
                  # weighed rather than assumed. The grant reads as "any tenant",
                  # and it is: this account may publish an order command onto
                  # every tenant's prefix. Narrowing it to the tenants this
                  # deployment actually serves is not expressible here — the
                  # tenant set lives in webhook-ingest's bootstrap file, which the
                  # broker never sees, and enumerating it in this file would put
                  # the same list in two places with the drift surfacing as orders
                  # that authenticate and are then denied at publish. It would
                  # also fail test/arch/nats_service_permissions_test.go, which
                  # resolves bus.TenantRoutedSubject to the literal
                  # "tenant.*.order.order.submit" and requires the grant to cover
                  # it. api-gateway carries the identical wildcard for the
                  # identical reason (see its block above).
                  #
                  # SO THE BROKER IS NOT THE CONTROL HERE. What bounds this
                  # service to one tenant per signal is that Emit refuses any
                  # (strategy, fund) pair its configured binding table does not
                  # grant, before anything is published — not this line. An
                  # `allow: []` would not help either: an explicitly empty allow
                  # list is a NO-OP in this format, not a deny (see the note at
                  # the head of this file).
                  "tenant.*.order.order.submit",
                  "strategy.signal.received", "order.order.submit",
                  "$JS.API.>", "$JS.ACK.>",
                ]
              }
              subscribe: { allow: ["platform.mode.changed", "risk.position.venue.changed.>", "_INBOX.>"] }
            }
          }
        ]
      }

      # ---- tenant template — one account per tenant ------------------------
      # Per-account JetStream quota (noisy-neighbor bound; MT-01e tightens it).
      # Streams are provisioned per-account by running the nats-bootstrap script
      # connected on this account (see README "Per-tenant streams").
      acme {
        jetstream { max_memory: 64MB, max_file: 2GB, max_streams: 16, max_consumers: 256 }

        # THE RETURN PATH (#668). Everything above this line carries COMMANDS IN;
        # nothing carried anything back, and NATS accounts are isolated by
        # construction — so every FACT this tenant's OMS published was visible to
        # nobody. It accepted an order, wrote its rows, published the accepted
        # FACT and the fills into an account no platform service is a member of:
        # no audit trail, with every service healthy and Ready throughout,
        # because "this tenant produced no events" and "this tenant's events
        # cannot reach me" are the same observable state.
        #
        # WHAT THIS EXPORT IS AND IS NOT. It offers this tenant's FACT subject
        # spaces to the platform account, which imports them under a `tfact.acme.`
        # PREFIX (see __system__ above). It is remedy 2 in
        # test/arch/tenant_bridge_parity_test.go, and it is honest for exactly one
        # consumer — audit, which takes TenantID off the ENVELOPE rather than from
        # a *_TENANT env var. accounting and risk-engine are tenant-pinned by
        # internal/pg.NewTenantPool (#97) and subscribe the LOGICAL names, so a
        # prefixed subject reaches them as nothing; they need remedy 1 and the
        # guard refuses to credit them for this.
        #
        # EXPORTING order.> DOES NOT LOOP THE COMMANDS BACK OUT, and that is
        # measured rather than assumed. The commands imported below land on
        # `order.order.submit` INSIDE this account — the same space this exports —
        # so a re-export would send every command back to the platform as though
        # the tenant had emitted it, double-counting the audit trail. Verified
        # against nats-server v2.14.5 with both halves configured: publishing
        # tenant.acme.order.order.submit into __system__ delivered it here as
        # order.order.submit and left the platform's TENANT_FACT stream holding
        # exactly ONE message — the genuine FACT, not two. NATS does not
        # re-export what arrived by import.
        exports: [
          # ORDER FACTS ONLY, NAMED ONE BY ONE — `order.>` HERE FORMS A CYCLE AND
          # THE BROKER REFUSES THE WHOLE CONFIG.
          #
          # This account IMPORTS its order COMMANDS from __system__ and remaps
          # them onto the logical names (`to: "order.order.submit"` and its
          # siblings below). Those land inside `order.>`, so exporting that space
          # re-offers to __system__ the very subjects it just sent here, and
          # nats-server reports:
          #
          #   Error adding stream import "order.>": import forms a cycle
          #
          # IT IS NON-DETERMINISTIC, which is what made it dangerous rather than
          # merely wrong: the check runs while imports are added and its outcome
          # depends on iteration order, so the same file was accepted most of the
          # time and rejected the rest. Measured on the committed config: 1 in 8
          # `nats-server -t` runs rejected it, and
          # internal/platform/halt's tenancy integration test failed 3 runs in 6.
          # A broker that starts most of the time is a broker that will not start
          # during the one rollout nobody wants to be debugging.
          #
          # So the export names the FACTs and only the FACTs. The four command
          # subjects — submit, cancel, approve, amend — are deliberately absent:
          # three are what this account imports, and a command is not a fact the
          # tenant produces in any case.
          #
          # test/arch/TestNoTenantExportsWhatItImports holds this deterministically,
          # because the broker's own check cannot be relied on to fire.
          { stream: "order.order.accepted" }
          { stream: "order.order.submitted" }
          { stream: "order.order.routed" }
          { stream: "order.order.filled" }
          { stream: "order.order.partially_filled" }
          { stream: "order.order.cancelled" }
          { stream: "order.order.rejected" }
          { stream: "order.order.expired" }
          { stream: "order.order.healed" }
          { stream: "order.order.outcome" }
          { stream: "order.order.approved" }
          { stream: "order.order.pending_approval" }
          { stream: "execution.>" }
          { stream: "risk.position.>" }
          { stream: "risk.portfolio.>" }
          { stream: "risk.exposure.>" }
          # THE MODEL ARTIFACTS THE TENANT'S OWN NUMBERS WERE COMPUTED FROM
          # (#1039). Exported for the same reason risk.portfolio.> is: without a
          # matching export the tenant's calibrated curves and fitted models cross
          # no boundary, audit never records them, and every pod stays Ready while
          # that tenant's risk history becomes unreproducible. The import half in
          # the __system__ account names exactly this pair — both sides must name
          # the same set or the bridge is one-directional and silent.
          { stream: "risk.curve.>" }
          { stream: "risk.factor.>" }
          { stream: "accounting.>" }
          { stream: "compliance.breach.>" }
          { stream: "compliance.mandate.>" }
          { stream: "settlement.>" }
          { stream: "wealth.>" }
          { stream: "alternatives.>" }
          # A DROPPED EVENT IS AN AUDIT FACT OF ITS OWN. Without this the one
          # record that says "this tenant's event could not be processed" is the
          # one the compliance trail never receives.
          { stream: "dlq.>" }
        ]

        # The other half of the bridge (#358). `to:` remaps the prefixed subject
        # onto the logical one, so this tenant's OMS subscribes
        # `order.order.submit` unchanged and never learns a prefix exists.
        #
        # It imports ONLY its own prefix. A wildcard here would hand this tenant
        # every other tenant's orders, which is the isolation boundary this whole
        # epic exists to establish — test/arch/tenant_bridge_test.go fails the
        # build if an account's import does not match its own name.
        imports: [
          { stream: { account: __system__, subject: "tenant.acme.order.order.submit" }
            to: "order.order.submit" }
          { stream: { account: __system__, subject: "tenant.acme.order.order.cancel" }
            to: "order.order.cancel" }
          # The second signature (#539) crosses the bridge as its own subject.
          # Without this line this tenant's OMS subscribes order.order.approve,
          # receives nothing, and a held order stays held — the silent case the
          # comment above describes, applied to the release path rather than the
          # submit path.
          { stream: { account: __system__, subject: "tenant.acme.order.order.approve" }
            to: "order.order.approve" }
          # THE HALT (#635). No `to:` — the subject is the same on both sides
          # because there is only ever ONE of these, for the whole platform.
          #
          # This account's own PLATFORM stream (`platform.>`, created by running
          # nats-bootstrap on this account — see README "Per-tenant streams")
          # captures the imported FACT, which is what lets this tenant's OMS bind
          # a JetStream consumer to it. Without the import, halt.Arm cannot even
          # resolve a stream: the OMS starts, latches its gate CLOSED, refuses
          # every order and says so — which is fail-closed working, and still a
          # total outage for this tenant. The line is not optional.
          { stream: { account: __system__, subject: "platform.mode.changed" } }

          # THE PUBLIC PRICE SPINE (#955). No `to:` — the subject is identical on
          # both sides, because there is one book and every account names it the
          # same way. See the matching export in __system__ for why a price
          # crosses this boundary when an order does not.
          #
          # WHAT IT REPAIRS. This account granted oms-acme a SUBSCRIBE on
          # market.*.trade and market.*.quote and gave it nothing to subscribe
          # TO: no user in here publishes a market subject, and there was no
          # import. A denied grant would at least error; a granted subscription
          # over an empty subject space does not. The pod authenticated, reported
          # Ready, logged "oms subscribing to the price spine (broadcast)" for
          # both subjects, and folded nothing — for as long as the deployment
          # lived. Every MARKET and STOP order refused PRICE_UNAVAILABLE, no
          # arrival price on any order, and the coverage gauges pinned at zero,
          # which is the one reading OMSQuoteCoverageAbsent cannot fire on.
          #
          # This account's own MARKET stream (`market.>`, created by running
          # nats-bootstrap on this account — see README "Per-tenant streams")
          # captures the imported events, which is what lets this tenant's OMS
          # bind its ephemeral JetStream consumer to them — the same mechanism
          # the halt import above relies on, and the reason neither needs a new
          # stream. It also means these events now count against this account's
          # `max_file` quota for the MARKET stream's 24h retention.
          #
          # NO CYCLE. This account's exports are its own FACT spaces (order
          # FACTs, execution.>, risk.*, accounting.>, compliance.*, settlement.>,
          # wealth.>, alternatives.>, dlq.>); none of them overlaps where these
          # land, so nats-server has nothing to reject. That is checked
          # deterministically by test/arch/TestNoTenantExportsWhatItImports
          # rather than left to the broker, whose own cycle check fires roughly
          # 1 run in 8.
          { stream: { account: __system__, subject: "market.*.trade" } }
          { stream: { account: __system__, subject: "market.*.quote" } }
        ]

        users: [
          # The tenant's workloads present this SVID; verify_and_map binds the
          # URI SAN to this user → account, scoping all its pub/sub.
          # THE TENANT'S RISK ENGINE (#630). It had no permissions block, so it
          # was unrestricted WITHIN this account — and this account is the one
          # whose entire purpose is that its OMS subscribes order.order.submit.
          # An unrestricted user inside it publishes onto that subject directly.
          #
          # That matters most for THIS service: risk-engine is the one component
          # this repository has a guard asserting cannot issue commands
          # (test/arch/risk_engine_is_query_only_test.go, "THE RISK ENGINE'S API
          # TAKES QUERIES, NEVER COMMANDS"). That guard checks the gRPC surface.
          # On the bus, in its own tenant's account, it was unconstrained — so
          # the property held on one face of the service and not the other.
          #
          # The allow-lists MIRROR the platform risk-engine's entry above,
          # because a tenant's risk engine is the same binary reading the same
          # subjects; the subjects are logical here since the account's imports
          # remap the prefix away before any workload sees them. Deriving them
          # rather than inventing them is what keeps this template correct as the
          # platform entry changes.
          { user: "spiffe://kanz.internal/ns/tenant-acme/sa/risk-engine"
            permissions: {
              publish: {
                allow: [
                  "risk.portfolio.exposure_recomputed", "risk.portfolio.measures_computed",
                  "risk.curve.calibrated", "risk.factor.model_fitted",
                  "dlq.risk.portfolio.revalued", "dlq.risk.position.changed.>", "dlq.risk.portfolio.snapshot",
                  "dlq.market.>", "$JS.API.>", "$JS.ACK.>",
                ]
              }
              subscribe: {
                allow: [
                  "risk.portfolio.revalued", "risk.position.changed.>", "risk.portfolio.snapshot",
                  "market.>",
                  "platform.model.registered",
                  # The exchange's own margin state for the accounts this tenant's
                  # portfolios are liquidated in (#408 control 4) — see the platform
                  # entry above for what its absence costs.
                  "accounting.margin.observed",
                  "_INBOX.>",
                  "compliance.breach.detected",
                ]
              }
            }
          }
          # THE SAME ENGINE, THE OTHER DEPLOYMENT MODEL (#668). The entry above is
          # the TENANT'S OWN risk engine, running in the tenant-acme namespace
          # tenantctl.sh mints for a tenant's workloads (its `principal()`). This
          # one is MT-02 COMPUTE: internal/tenantgen renders risk-engine-acme
          # into kanz-services, and SPIRE templates its SVID from that pod's
          # namespace and ServiceAccount, so it presents a DIFFERENT string
          # (tenantctl.sh's `compute_principal()`). Both are legitimate and the
          # two must not be conflated — admitting only the first leaves the
          # rendered pod authenticating into NO account, consuming nothing, with
          # every probe green (SEC-M3).
          #
          # Its grants are IDENTICAL to the entry above, and deliberately so:
          # same binary, same subjects, same account. They are the platform
          # risk-engine's, derived rather than invented, and
          # TestEveryTenantNATSUserMirrorsItsPlatformPermissions holds all three
          # in step — it named an extra subscribe on my first draft of the
          # accounting entry.
          #
          # WITHOUT THIS the tenant's positions are published into this account
          # and no engine folds them: exposure, VaR and every measure report on
          # an empty book, which is indistinguishable from a flat one.
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/risk-engine-acme"
            permissions: {
              publish: {
                allow: [
                  "risk.portfolio.exposure_recomputed", "risk.portfolio.measures_computed",
                  "risk.curve.calibrated", "risk.factor.model_fitted",
                  "dlq.risk.portfolio.revalued", "dlq.risk.position.changed.>", "dlq.risk.portfolio.snapshot",
                  "dlq.market.>", "$JS.API.>", "$JS.ACK.>",
                ]
              }
              subscribe: {
                allow: [
                  "risk.portfolio.revalued", "risk.position.changed.>", "risk.portfolio.snapshot",
                  "market.>",
                  "platform.model.registered",
                  # The exchange's own margin state for the accounts this tenant's
                  # portfolios are liquidated in (#408 control 4) — see the platform
                  # entry above for what its absence costs.
                  "accounting.margin.observed",
                  "_INBOX.>",
                  "compliance.breach.detected",
                ]
              }
            }
          }
          # MT-02 compute: the per-tenant OMS pod's ServiceAccount is
          # oms-acme in kanz-services (not tenant-acme — the compute layer is
          # a name-suffixed platform ServiceAccount, not a per-tenant
          # namespace; see kanz/infra/deploy/tenants/README.md). Added by
          # provision-tenant.sh's `compute` step per its printed instruction;
          # without this the pod authenticates but cannot reach any account
          # (SEC-M3). test/arch/tenant_compute_test.go fails the build if
          # this and kanz/infra/deploy/tenants/acme/ ever drift apart.
          # THE TENANT'S OMS (#630). Unrestricted until now, in the account
          # built to carry this tenant's order flow — so the one identity that
          # most needed a boundary had none.
          #
          # THE ALLOW-LISTS ARE THE PLATFORM OMS's, AND THAT IS NOT A GUESS:
          # infra/deploy/tenants/acme/oms-acme.yaml pins the same digest-pinned
          # OMS image the platform deployment does — the SAME BINARY, by the
          # MT-02 per-tenant-compute design, which is why
          # test/arch/tenant_compute_test.go asserts the tenant manifest has not
          # drifted from infra/deploy/oms-deploy.yaml. Same binary, same
          # subjects. The account's imports remap tenant.acme.order.* onto the
          # logical names before this pod sees them, which is why the subscribe
          # list below is the unprefixed one and not a tenant-scoped copy.
          #
          # Keeping them derived from the platform entry rather than hand-copied
          # is the point: this account is the template every future tenant is
          # provisioned from, so a hole here is duplicated once per onboarding —
          # which is exactly how three users came to be unrestricted at once.
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/oms-acme"
            permissions: {
              publish: {
                allow: [
                  "order.order.accepted", "order.order.rejected", "order.order.routed",
                  "order.order.filled", "order.order.partially_filled", "order.order.cancelled",
                  "order.order.expired", "order.order.outcome",
                  "order.order.pending_approval",
                  "order.order.approved",
                  "order.cost.recorded",
                  # The per-decision execution attribution (#866) — mirrors the
                  # platform grant above; the pod runs the same binary and will
                  # name it.
                  "order.cost.attributed",
                  "risk.position.changed.>", "risk.position.venue.changed.>",
                  "settlement.instruction.fail",
                  # The pre-trade compliance decision (#713) — mirrors the platform
                  # grant above; the pod runs the same binary and will name it.
                  "platform.compliance.decision",
                  "dlq.order.order.submit", "dlq.order.order.amend", "dlq.order.order.cancel",
                  "dlq.order.order.approve",
                  "dlq.order.order.filled", "dlq.order.order.partially_filled",
                  "$JS.API.>", "$JS.ACK.>",
                ]
              }
              subscribe: {
                allow: [
                  "order.order.submit", "order.order.amend", "order.order.cancel",
                  "order.order.approve",
                  "order.order.filled", "order.order.partially_filled",
                  "market.*.trade", "market.*.quote", "compliance.mandate.changed.>",
                  # The intraday volume profile (#897) - mirrors the platform
                  # grant above; the pod runs the same binary and folds the same
                  # spine, and without this line its VWAP and POV orders are
                  # refused while the platform tenant's are admitted.
                  "market.crypto.volume_profile",
                  # The realised candle series (#1007) - mirrors the platform
                  # grant above; the pod runs the same binary and folds the same
                  # spine, and without this line its worked orders' participation
                  # is UNOBSERVABLE while the platform tenant's is measured.
                  "market.crypto.bar",
                  "accounting.balance.portfolio",
                  "risk.portfolio.measures_computed",
                  "platform.mode.changed",
                  "_INBOX.>",
                  "accounting.margin.observed",
                ]
              }
            }
          }
          # THE TENANT'S DURABLE LOG OF RECORD (#637). Until this entry existed
          # the account above was a one-way street: the bridge carried order
          # COMMANDS in, oms-acme published its FACTs back onto these same
          # subjects, and NOTHING in the estate could hear them. Accounts are
          # isolated by construction — the header of this file says so — and
          # every platform consumer is a __system__ user. So an order was
          # accepted, a fill happened, a position moved, and the events aged off
          # this account's streams at their max-age with no copy anywhere.
          #
          # THAT IS A DR HOLE, NOT AN INTEGRATION GAP, which is why the archiver
          # is the first consumer moved rather than the ledger or the risk
          # engine. CLAUDE.md's one sequencing rule that outlives any issue is
          # that real orders must never be placed against a store that may not be
          # backed up; a tenant provisioned without this pod can place them, and
          # every health check in the estate reads green while it does.
          #
          # AN EXPORT BACK TO __system__ WOULD NOT HAVE WORKED, and it is worth
          # stating because it is the obvious fix. The platform archiver is
          # pinned to ARCHIVER_TENANT=__system__ and internal/topic.For REFUSES
          # any envelope whose tenant_id differs — it NACKs rather than misfiling
          # into another tenant's Kafka prefix. Exporting acme's FACTs into
          # __system__ would therefore produce an infinite redelivery loop at the
          # Kafka boundary, not an archive. The archiver has to run INSIDE the
          # account, serving that tenant, which is what ARCHIVER_TENANT and
          # topic.Qualify were built for and never wired.
          #
          # THE ALLOW-LISTS ARE THE PLATFORM ARCHIVER'S, DERIVED NOT COPIED, for
          # the same reason the two entries above say so: infra/deploy/tenants/
          # acme/archiver-acme.yaml is rendered by internal/tenantgen from
          # infra/deploy/archiver-deploy.yaml, so it is the SAME digest-pinned
          # binary reading the same ARCHIVER_SUBJECTS defaults. Publish is the
          # JetStream machinery and nothing else: archiver's own DLQ
          # ("dlq.archiver") is a KAFKA topic, never a NATS subject, so no domain
          # subject belongs here — and `deny: [">"]` would deny its own acks,
          # which fails SILENTLY as infinite redelivery (see the platform entry).
          #
          # KAFKA IS THE OTHER HALF AND IT IS NOT IN THIS FILE. This pod produces
          # to the tenant's PREFIXED topics (topic.Qualify -> "acme.order.order"),
          # and Kafka auto-create is disabled, so without the prefixed ACL granted
          # to this same SVID the publish fails hard and the consumer NACKs.
          # infra/tenancy/tenantctl.sh's COMPUTE_KAFKA_SAS grants it;
          # test/arch/tenant_compute_test.go fails the build if that list and
          # internal/tenantgen's KafkaProducer set ever disagree.
          # THE TENANT'S BOOK OF RECORD (#668). Without this user, acme's fills are
          # published into acme's account and NO LEDGER ENTRY IS POSTED for them:
          # NAV, cash and the pre-trade buying-power gate are all computed over an
          # empty book, and every service reports Ready throughout, because "this
          # tenant traded nothing" and "this tenant's fills reach no accountant"
          # are the same observable state.
          #
          # REMEDY 1, NOT THE EXPORT BRIDGE, and the distinction is enforced by
          # test/arch/tenant_bridge_parity_test.go. accounting is pinned to one
          # tenant for the process lifetime by ACCOUNTING_TENANT and
          # internal/pg.NewTenantPool (#97), and it subscribes the LOGICAL subject
          # names — so the tfact.<tenant>. space that carries this tenant's FACTs
          # to audit reaches accounting as nothing at all. Account membership IS
          # its return path.
          #
          # THE ALLOW-LISTS ARE THE PLATFORM ACCOUNTING'S, DERIVED NOT COPIED, for
          # the reason the archiver entry below gives: infra/deploy/tenants/acme/
          # accounting-acme.yaml is rendered by internal/tenantgen from
          # infra/deploy/accounting-deploy.yaml, so it is the SAME digest-pinned
          # binary reading the same subject defaults. The subjects are LOGICAL
          # inside this account — the isolation is the account boundary, not the
          # subject string — so they are identical to the platform user's above,
          # which is what makes a drift between them a bug rather than a variant.
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/accounting-acme"
            permissions: {
              publish: {
                allow: [
                  "accounting.cash.>",
                  "accounting.balance.portfolio",
                  "dlq.order.order.filled", "dlq.order.order.partially_filled",
                  # The custody reconciliation run FACT (#962); see the
                  # platform accounting entry above for why it is published on
                  # every outcome.
                  "accounting.custody.reconciled",
                  "dlq.accounting.cash.>", "dlq.market.fx.>",
                  "dlq.accounting.custody.statement",
                  "$JS.API.>", "$JS.ACK.>",
                ]
              }
              subscribe: {
                allow: [
                  "order.order.filled", "order.order.partially_filled",
                  "accounting.cash.>", "market.fx.>", "_INBOX.>",
                  # The custodian statement feed (#962); see the platform
                  # accounting entry above.
                  "accounting.custody.statement",
                ]
              }
            }
          }
          { user: "spiffe://kanz.internal/ns/kanz-services/sa/archiver-acme"
            permissions: {
              publish: { allow: ["$JS.API.>", "$JS.ACK.>"] }
              subscribe: {
                allow: [
                  "order.>", "strategy.>", "execution.>", "accounting.>", "settlement.>",
                  "compliance.breach.>", "compliance.mandate.>", "risk.portfolio.>", "risk.exposure.>",
                  "risk.signal.>", "risk.command.>", "risk.position.>",
                  "risk.curve.>", "risk.factor.>", "inference.>", "platform.>",
                  "data.>", "_INBOX.>", "$JS.API.>",
                ]
              }
            }
          }
        ]
      }
    }

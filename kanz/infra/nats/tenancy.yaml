---
# MT-01c: NATS tenant isolation via ACCOUNTS — the broker-native isolation
# boundary. An account's subjects are physically invisible to other accounts, so
# isolation is enforced by WHICH account a connection lands in, not by the
# subject string. The client's SVID maps to a per-tenant user via
# `tls.verify_and_map` (see nats.yaml), so the bus keeps publishing the
# unchanged 3-segment logical subject (subject-taxonomy §4/§6) and a tenant can
# never see another tenant's `{domain}.>`. Subject prefixing inside one shared
# account would give NO real isolation, hence accounts.
#
# This ConfigMap is mounted at /etc/nats/tenants.conf and `include`d by
# nats.conf. Add a tenant by appending an account + user keyed on the tenant
# workload's SPIFFE URI SAN, then `nats-server --signal reload`. Dynamic JWT
# account-resolver onboarding (no reload) is the MT-01f lifecycle path.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-tenants
  namespace: kanz-messaging
  labels:
    app.kubernetes.io/part-of: kanz
data:
  tenants.conf: |
    # System account: $SYS events (monitoring, JetStream cluster RPC).
    system_account: SYS

    accounts {
      SYS {
        users: [ { user: "spiffe://kanz.internal/ns/kanz-messaging/sa/nats" } ]
      }

      # Reserved platform/legacy tenant (MT-01a __system__). Cross-cutting
      # platform + observability streams AND pre-tenancy (untenanted) events —
      # which the consumer maps to SystemTenant — live here. Platform services
      # connect into it; per-tenant accounts cannot reach its subjects.
      #
      # SEC-M3b: this list held TWO users while THIRTEEN services dialed the
      # spine. `verify_and_map` maps a verified SVID to a user, and a user that is
      # not here maps to NO ACCOUNT — so eleven services would have authenticated
      # and then been unable to publish or subscribe at all. It was invisible for
      # the same reason SEC-M3 was: nothing ever ran a service against this file.
      # test/arch/nats_identity_test.go now fails the build if a NATS-dialing
      # service is missing here, so the list cannot fall behind the code again.
      #
      # Each entry is the SVID infra/security/spire/registration.yaml issues that
      # pod — spiffe://kanz.internal/ns/{namespace}/sa/{serviceAccountName} — from
      # the namespace + serviceAccountName in its own deploy manifest. Adding a
      # service here without a matching ServiceAccount admits nothing.
      __system__ {
        jetstream: enabled

        # ---- MT-02 tenant routing (#358) -------------------------------------
        #
        # THE RULING (#97): tenants get DEDICATED COMPUTE, not a shared pool.
        # internal/pg/pool.go binds a pool to one tenant for the process lifetime
        # (`set_config('app.tenant_id', $1, false)` — session scope, applied once
        # at connect), so a shared OMS would need per-transaction scoping: a
        # rewrite of the one component every service's RLS correctness rests on.
        # Dedicated compute keeps a property that is currently structural — a pool
        # that CANNOT serve the wrong tenant, because it never learned how.
        #
        # WHAT THIS BLOCK IS FOR. The gateway is the sole front door and holds ONE
        # SVID, therefore one account; NATS routes on SUBJECT and cannot dispatch
        # on the envelope's tenant_id. So a shared publisher cannot reach a
        # per-tenant account at all — measured, not assumed: a publish in
        # __system__ is delivered to NOTHING in `acme`, while the same subscriber
        # receives a same-account publish.
        #
        # The tenant therefore has to appear in the subject SOMEWHERE. It appears
        # here and only here: the routing prefix exists inside __system__, and
        # every account resolves it back to the unchanged 3-segment logical name
        # before any workload sees it. So kanz-schemas/README.md
        # § Subject Taxonomy still holds where it matters — inside a tenant
        # account the subject is `order.order.submit`, and oms-deploy.yaml
        # subscribes exactly that.
        exports: [
          { stream: "tenant.*.order.order.submit" }
          { stream: "tenant.*.order.order.cancel" }
          # The SECOND SIGNATURE on a held order (#539) is a COMMAND on the same
          # write path, so it crosses the same bridge. Without this export every
          # tenant's import of it resolves to nothing, the broker accepts the
          # config, and an approval that tenant sends is delivered NOWHERE.
          { stream: "tenant.*.order.order.approve" }
          # THE PLATFORM KILL-SWITCH CROSSES THE SAME BOUNDARY (#635), and it is
          # the one subject here that is NOT tenant-prefixed — deliberately. A
          # halt is platform-wide by definition: one FACT, published once by
          # cmd/kanz-halt, and every account that runs an order path must receive
          # THAT one. Prefixing it per tenant would make the operator's single
          # break-glass command reach only the platform account, which is the
          # defect this export exists to close one account further out.
          #
          # WITHOUT THIS EXPORT a per-tenant OMS cannot resolve a stream for
          # platform.mode.changed at all, halt.Arm fails, and — because the gate
          # is deny-by-default — that tenant's OMS refuses every order. Loud, and
          # a total outage for that tenant. The export and the per-account import
          # below are both load-bearing.
          { stream: "platform.mode.changed" }

          # THE PUBLIC PRICE SPINE (#955), AND THE SECOND THING ON THIS LIST
          # THAT IS NOT TENANT-PREFIXED — for the same reason the halt above is
          # not. There is ONE book. Every fund on the estate values BTC-USDT off
          # the same last trade and the same top of book, so a per-tenant copy
          # would not be isolation, it would be two answers to a question that
          # has one — and a mark is what values an order at admission, an
          # exposure at recompute and a position at close. Two tenants
          # disagreeing about a price is a control failure, not a privacy
          # property.
          #
          # A PRICE IS NOT TENANT DATA, AND THAT IS THE ARGUMENT FOR CROSSING THE
          # BOUNDARY WITH IT. Tenant isolation here covers portfolios, accounts,
          # orders, positions, strategies, risk state, mandates, credentials,
          # audit and AI capabilities — everything that says what a tenant DID.
          # market.*.trade and market.*.quote say what the MARKET did: they carry
          # no order, no size and no holding that belongs to anybody, and
          # pkg/alpha stamps MarketDataTenant (__system__) on them precisely
          # because the observation has no tenant. The export is one-directional
          # — it offers the platform's public price spine to a tenant account —
          # and no tenant workload holds a market.* PUBLISH grant, so nothing a
          # tenant does can travel back along it.
          #
          # WITHOUT IT A TENANT-DEDICATED OMS CANNOT TRADE AT MARKET AT ALL. Its
          # OMS_PRICE_SUBJECTS default is internal/marketdata/mark.DefaultSubjects
          # — these two subjects — and no workload inside a tenant account
          # publishes a market subject: market-data and market-ingest are
          # __system__ services. The tenant's own MARKET stream exists and stays
          # EMPTY, so the fold holds nothing, every MARKET and STOP order is
          # refused PRICE_UNAVAILABLE, no arrival price is stamped on any order,
          # and both coverage gauges sit at zero — the one state
          # OMSQuoteCoverageAbsent is structurally unable to fire in, because it
          # requires marks > 0 to tell a dead feed from a cold pod.
          # OMSPriceSpineNeverFolded (operational.rules.yaml) is the signal that
          # covers that hole; this export is the repair.
          #
          # NARROWED TO THE PRICE SPINE, not `market.>`. The domain also carries
          # book snapshots, bars, ingestion-coverage FACTs and the volume profile,
          # and a tenant folding those is a separate decision with its own cost —
          # see #959. test/arch/tenant_bridge_test.go derives this list from
          # mark.DefaultSubjects, so the export and the fold cannot drift.
          { stream: "market.*.trade" }
          { stream: "market.*.quote" }
        ]

        # THE RETURN PATH'S PLATFORM HALF (#668). The tenant account exports its
        # FACT subject spaces; these land them here under `tfact.<tenant>.`, and
        # the TENANT_FACT stream (bootstrap-job.yaml) binds `tfact.*.>` so audit
        # can consume them.
        #
        # A SECOND PREFIX, NOT `tenant.`, AND THE REASON IS A COLLISION. The
        # inbound command bridge already owns `tenant.*.order.>` — that is
        # TENANT_ORDER's subject set. Importing a tenant's order FACTs under the
        # same prefix would land `tenant.acme.order.order.accepted` inside the
        # COMMAND stream: facts and commands sharing one log, one 24h retention,
        # and no way to tell the direction of travel from the subject. `tfact.`
        # says outbound in the name, leaves the working command bridge untouched,
        # and needs no per-domain enumeration on the platform side.
        #
        # IT MUST NOT BE IMPORTED UNPREFIXED. The logical names are what
        # __system__'s OWN consumers subscribe: the platform archiver would NACK
        # forever (internal/topic.For refuses an envelope whose tenant_id is not
        # its own) and platform accounting would fold another tenant's event into
        # __system__'s book (#223). An unprefixed import is WORSE than none, and
        # test/arch/tenant_bridge_parity_test.go does not read one as a repair.
        #
        # ONE ENTRY PER TENANT, never a wildcard `account:`. An account is named
        # explicitly here for the same reason a tenant imports only its own
        # prefix: the import is the boundary, and a wildcard would make adding an
        # account to this file silently widen what the platform ingests.
        imports: [
          # ORDER FACTS, NAMED ONE BY ONE, MIRRORING acme's EXPORT. `order.>` here
          # cannot be used: this account SENDS order commands to acme, so acme
          # cannot offer that whole space back without forming a cycle the broker
          # refuses — see the export block in the acme account for the measured
          # detail. An import may not be wider than the export behind it either:
          # `order.>` here against a narrower export is "stream import not
          # authorized", which is the same outage with a different message.
          { stream: { account: acme, subject: "order.order.accepted" }, prefix: "tfact.acme" }
          { stream: { account: acme, subject: "order.order.submitted" }, prefix: "tfact.acme" }
          { stream: { account: acme, subject: "order.order.routed" }, prefix: "tfact.acme" }
          { stream: { account: acme, subject: "order.order.filled" }, prefix: "tfact.acme" }
          { stream: { account: acme, subject: "order.order.partially_filled" }, prefix: "tfact.acme" }
          { stream: { account: acme, subject: "order.order.cancelled" }, prefix: "tfact.acme" }
          { stream: { account: acme, subject: "order.order.rejected" }, prefix: "tfact.acme" }
          { stream: { account: acme, subject: "order.order.expired" }, prefix: "tfact.acme" }
          { stream: { account: acme, subject: "order.order.healed" }, prefix: "tfact.acme" }
          { stream: { account: acme, subject: "order.order.outcome" }, prefix: "tfact.acme" }
          { stream: { account: acme, subject: "order.order.approved" }, prefix: "tfact.acme" }
          { stream: { account: acme, subject: "order.order.pending_approval" }, prefix: "tfact.acme" }
          { stream: { account: acme, subject: "execution.>" },          prefix: "tfact.acme" }
          { stream: { account: acme, subject: "risk.position.>" },      prefix: "tfact.acme" }
          { stream: { account: acme, subject: "risk.portfolio.>" },     prefix: "tfact.acme" }
          { stream: { account: acme, subject: "risk.exposure.>" },      prefix: "tfact.acme" }
          { stream: { account: acme, subject: "risk.curve.>" },         prefix: "tfact.acme" }
          { stream: { account: acme, subject: "risk.factor.>" },        prefix: "tfact.acme" }
          { stream: { account: acme, subject: "accounting.>" },         prefix: "tfact.acme" }
          { stream: { account: acme, subject: "compliance.breach.>" },  prefix: "tfact.acme" }
          { stream: { account: acme, subject: "compliance.mandate.>" }, prefix: "tfact.acme" }
          { stream: { account: acme, subject: "settlement.>" },         prefix: "tfact.acme" }
          { stream: { account: acme, subject: "wealth.>" },             prefix: "tfact.acme" }
          { stream: { account: acme, subject: "alternatives.>" },       prefix: "tfact.acme" }
          { stream: { account: acme, subject: "dlq.>" },                prefix: "tfact.acme" }
        ]

        # __system__ RESOLVES ITS OWN PREFIX, which is what makes the gateway's
        # publish path uniform: it always prefixes, with no runtime branch and no
        # list of "tenants that have accounts" to fall out of date. Without these
        # two lines the CURRENT single-tenant path breaks the moment the gateway
        # starts prefixing — the running OMS subscribes `order.order.submit` and
        # would simply stop receiving orders.
        mappings = {
          "tenant.__system__.order.order.submit": "order.order.submit"
          "tenant.__system__.order.order.cancel": "order.order.cancel"
          # Same for the approve command (#539): the gateway prefixes
          # unconditionally, so without this line the platform tenant's own
          # approvals land on a subject nothing subscribes and every order held
          # for dual control stays held, with no error on either side.
          "tenant.__system__.order.order.approve": "order.order.approve"
        }

        users: [
          # The bootstrap Job (bootstrap-job.yaml) — it CREATES the streams, so it
          # is admitted here before any service has anything to connect to. It
          # lives in kanz-messaging beside the broker, not in kanz-services.
          # THE PROVISIONING JOB, NARROWED TO THE TWO SUBJECTS IT USES (#630).
          #
          # It had NO permissions block, which by this file's own rule — stated
          # twice above — makes it UNRESTRICTED inside __system__. That is the
          # broadest identity in the estate held by the least-supervised thing in
          # it: a Job. Unrestricted, this SVID could publish order.order.submit,
          # platform.mode.changed (the halt primitive), and
          # compliance.mandate.changed.> — the subject whose two-signature
          # protection #562 exists to enforce.
          #
          # bootstrap-job.yaml runs `nats stream info|add|edit|ls` and nothing
          # else, and every one of those is JetStream's management API with the
          # reply on an inbox. So these two grants are the whole job, and with an
          # allow-list present every other subject is denied — the same argument
          # kanz-monitor's entry makes for the read-only operator identity.
          #
          # NO $JS.ACK.>, deliberately: this Job never consumes a message, so it
          # never acks one. Granting it would be copying a shape rather than
          # stating a need.
          { user: "spiffe://kanz.internal/ns/kanz-messaging/sa/nats-bootstrap"
            permissions: {
              publish: { allow: ["$JS.API.>"] }
              subscribe: { allow: ["_INBOX.>"] }
            }
          }
          # THE OPERATOR PLANE (SEC-M3c, infra/operator/halt-job.yaml). Four
          # operator CLIs — kanz-halt, kanz-mandate, kanz-altevent,
          # kanz-household — each get their OWN SVID below, one per tool.
          #
          # SEC-M3d: until this change, all four PRESENTED THE SAME SVID
          # (kanz-halt's), AND — the part that actually mattered — nobody here
          # had a `permissions` block, at all, of any kind. Every one of these
          # 17 __system__ users could publish and subscribe on ANY subject in
          # the account. So the shared identity was never the real exposure:
          # even with four distinct SVIDs, an identity with no permissions is
          # exactly as privileged as every other identity in the account. The
          # claim below — "this SVID admits the brake and nothing else" — was
          # FALSE as written for as long as it had no permissions block: any
          # of market-data, archiver, audit, tv-sync, or any other user in
          # this account could equally publish platform.mode.changed. It
          # first becomes true with the `permissions` block added here.
          #
          # SEC-M3e (below) closed the matching gap on the service users: at
          # the time of THIS comment they still had no permissions block and
          # could equally publish platform.mode.changed. That is fixed now —
          # see the SEC-M3e comment ahead of the risk-engine entry.
          #
          # Permission sets below were determined by inspecting the actual
          # publisher (each tool's own subject constant) and PROVEN against a
          # real nats-server + JetStream broker, not guessed — see
          # .superpowers/sdd/operator-svid-split-report.md (repo root) for the
          # transcript. Each publish-only tool needs subscribe access to its own reply inbox
          # (`_INBOX.>`) to receive the JetStream publish ack; it does NOT
          # need `$JS.API.>` — these tools only call jetstream.PublishMsg,
          # which (as of nats.go v1.52.0) publishes directly to the stream
          # subject and never touches the $JS.API management surface. Granting
          # $JS.API.> anyway would hand a "publish one FACT" tool the full
          # JetStream admin API (stream/consumer create, delete, purge) — a
          # far bigger privilege than the tool needs or than least-privilege
          # calls for, so it is deliberately withheld.
          #
          # kanz-mandate IS NO LONGER PUBLISH-ONLY, and it is the one exception
          # (#916). Its publish is a READ-MODIFY-WRITE of a compacted subject:
          # see its entry below. It gets THREE NAMED READ SUBJECTS under
          # $JS.API, not `$JS.API.>` — the paragraph above still holds, and the
          # admin API is still withheld.
          {
            user: "spiffe://kanz.internal/ns/kanz-operator/sa/kanz-halt"
            permissions: {
              publish: { allow: ["platform.mode.changed"] }
              subscribe: { allow: ["_INBOX.>"] }
            }
          }
          # kanz-mandate arms the compliance gate (COMP-01f) by publishing a
          # ConfigChanged FACT per (tenant, portfolio) on
          # compliance.mandate.changed.{tenant}.{portfolio} — see
          # internal/compliance/mandate_codec.go's SubjectMandateFor /
          # SubjectMandateAll. No Job manifest of its own yet (see
          # test/arch/nats_identity_test.go and this file's report); it runs
          # from an operator's shell against a dev broker or reuses the
          # kanz-halt SA's socket today, but the SVID + permissions it needs
          # once it has its own ServiceAccount are declared here now so the
          # broker side does not have to change again when that manifest
          # ships.
          #
          # IT ALSO READS THE SUBJECT IT IS ABOUT TO WRITE (#916), which is why
          # this is the only operator CLI with anything under $JS.API. The
          # MANDATE stream keeps ONE message per (tenant, portfolio) subject and
          # never ages it out, and that message now carries the mandate IN FORCE
          # plus every mandate an operator has SCHEDULED. Writing it therefore
          # means merging into it: publishing only the mandate in --file deleted
          # the rest, and scheduling a change that way left the portfolio
          # UNGOVERNED at the next restart — admitted with no constraints under
          # OMS_REQUIRE_MANDATE=false.
          #
          # THE FOUR SUBJECTS ARE NAMED, NOT `$JS.API.>`. They are what
          # bus.NATSClient.LastOnSubject issues and nothing else:
          #
          #   $JS.API.STREAM.NAMES              which stream owns the subject
          #   $JS.API.STREAM.INFO.MANDATE       bind that stream
          #   $JS.API.DIRECT.GET.MANDATE.>      fetch its last message
          #   $JS.API.STREAM.MSG.GET.MANDATE    the same, without AllowDirect
          #
          # THE LIST WAS MEASURED, NOT REASONED. Its first version omitted
          # DIRECT.GET and was WRONG: nats.go routes GetLastMsgForSubject to
          # $JS.API.DIRECT.GET.{stream}.{subject} whenever the stream advertises
          # AllowDirect, and MANDATE does (allow_direct: true). Against a broker
          # carrying exactly the three-subject list, every mandate publish
          # refused. STREAM.MSG.GET stays because it is the path taken on a
          # stream without AllowDirect, and a grant that only works while one
          # stream flag holds is a grant that breaks when somebody clears it.
          #
          # All four are READS of one stream in this account. None creates,
          # deletes, purges, or consumes anything, so the least-privilege
          # argument above is intact — the admin API is still withheld.
          #
          # OMITTING ANY OF THEM DOES NOT FAIL QUIETLY, and that is by design
          # (#787/#788). The read is refused, the publisher refuses to write a
          # set it could not merge, and `kanz-mandate approve` exits non-zero
          # naming the subject — rather than publishing a set that deletes the
          # mandate in force. It surfaces as a TIMEOUT rather than an error,
          # because NATS reports a permissions violation asynchronously on the
          # connection and the request never gets an answer; LastOnSubject bounds
          # the read by PublishTimeout so that is seconds, not the operator's
          # whole deadline.
          {
            user: "spiffe://kanz.internal/ns/kanz-operator/sa/kanz-mandate"
            permissions: {
              publish: {
                allow: [
                  "compliance.mandate.changed.>",
                  "$JS.API.STREAM.NAMES",
                  "$JS.API.STREAM.INFO.MANDATE",
                  "$JS.API.DIRECT.GET.MANDATE.>",
                  "$JS.API.STREAM.MSG.GET.MANDATE",
                ]
              }
              subscribe: { allow: ["_INBOX.>"] }
            }
          }
          # kanz-altevent publishes the commitment-lifecycle journal (ALT-01b)
          # on alternatives.> — see internal/alternatives/subject.go. Same
          # no-manifest-yet caveat as kanz-mandate above.
          {
            user: "spiffe://kanz.internal/ns/kanz-operator/sa/kanz-altevent"
            permissions: {
              publish: { allow: ["alternatives.>"] }
              subscribe: { allow: ["_INBOX.>"] }
            }
          }
          # kanz-household publishes the household valuation (WEALTH-01b) on
          # wealth.> — see internal/wealth/subject.go. Same no-manifest-yet
          # caveat as kanz-mandate above.
          {
            user: "spiffe://kanz.internal/ns/kanz-operator/sa/kanz-household"
            permissions: {
              publish: { allow: ["wealth.>"] }
              subscribe: { allow: ["_INBOX.>"] }
            }
          }
          # kanz-model publishes the MODEL PORTFOLIO (WEALTH-01d, #1010) on
          # wealth.> — see internal/wealth/subject.go's SubjectModelFor. It is
          # the only producer of a target allocation on this platform: before it,
          # wealth.v1.ModelPortfolio was specified in proto and constructed by no
          # Go code, so no household's drift from its model could be computed at
          # all. Same no-manifest-yet caveat as kanz-mandate above.
          {
            user: "spiffe://kanz.internal/ns/kanz-operator/sa/kanz-model"
            permissions: {
              publish: { allow: ["wealth.>"] }
              subscribe: { allow: ["_INBOX.>"] }
            }
          }
          # kanz-redrive is the DLQ DRAIN (#220, cmd/kanz-redrive): it reads
          # messages parked on `dlq.<subject>` and republishes them, byte for
          # byte, onto the subject named in their Kanz-DLQ-Original-Subject
          # header. Without it the DLQ is write-only — a transient Postgres
          # failover parks a SubmitOrder the client already holds a 202 for and
          # nothing can ever get it back.
          #
          # ITS GRANT IS THE BROADEST IN THE OPERATOR PLANE, AND THAT IS
          # INHERENT, NOT AN OVERSIGHT. The other four operator tools publish one
          # subject space each, so their allow-list is that space. This one
          # republishes whatever was parked, and anything with a work-queue
          # consumer can park — so the allow-list is the union of the domains
          # that have one. It is enumerated rather than written `>` so the
          # exposure is reviewable, and so a domain nobody expected to be
          # drainable fails LOUDLY (the publish is denied, Redriver halts and
          # names the subject) instead of being quietly republishable.
          #
          # platform.> IS DELIBERATELY ABSENT, and it is the one exclusion that
          # matters. platform.mode.changed is the kill switch, and kanz-halt's
          # entry above claims that SVID "admits the brake and nothing else" —
          # granting platform.> here would silently make that claim false again
          # and hand a second identity the ability to halt or RESUME trading. It
          # is also unnecessary: the mode FACT is consumed through
          # SubscribeBroadcast, and pkg/bus/consumer.go's broadcast path never
          # routes to the DLQ at all (see dlqExemptBroadcastOnlyConsumers in
          # test/arch/bus_dlq_test.go), so `dlq.platform.mode.changed` cannot
          # exist to be drained.
          #
          # $JS.API.> + $JS.ACK.> because the drain binds a DURABLE consumer on
          # the dlq.> stream — the cursor is what stops a redriven message being
          # redriven twice — and must ack what it has successfully republished.
          { user: "spiffe://kanz.internal/ns/kanz-operator/sa/kanz-redrive"
            permissions: {
              publish: {
                allow: [
                  "$JS.API.>", "$JS.ACK.>",
                  "order.>", "execution.>", "strategy.>",
                  "risk.>", "market.>", "inference.>",
                  "accounting.>", "compliance.>", "settlement.>",
                  "alternatives.>", "wealth.>", "data.>"
                ]
              }
              subscribe: { allow: ["dlq.>", "_INBOX.>"] }
            }
          }
          # READ-ONLY OBSERVER (kanz-monitor, test/arch/nats_identity_test.go's
          # readOnlyObserverSVIDs). It streams order.> and risk.position.> to a
          # terminal via SubscribeBroadcast and publishes NO business subject.
          # The publish allow-list holds ONLY the JetStream consumer machinery its
          # ephemeral consumer binds ($JS.API.> to resolve the stream + create the
          # consumer, $JS.ACK.> to ack) — with an allow-list present, every other
          # subject (order.*, risk.*, everything) is denied by default, so this
          # identity provably cannot move capital. NOT `deny: [">"]`: that trap
          # (see the risk-engine header above) would also deny $JS.API.>/$JS.ACK.>,
          # breaking the consumer and silently failing every ack forever.
          # Manifest half (a kanz-operator ServiceAccount for kanz-monitor) is not
          # yet shipped — like the other operator tools, the broker-side half is
          # declared here ready for when that manifest lands.
          { user: "spiffe://kanz.internal/ns/kanz-operator/sa/kanz-monitor"
            permissions: {
              publish: { allow: ["$JS.API.>", "$JS.ACK.>"] }
              subscribe: { allow: ["order.>", "risk.position.>", "_INBOX.>"] }
            }
          }
          # SEC-M3e: the 15 service users below (risk-engine .. webhook-ingest —
          # the operator-svid-split report and this file's own header called them
          # "13"; the actual count in this list has been 15 since alternatives and
          # wealth joined as real dialers, and nobody updated the number) went
          # through the SAME exposure as the four operator users above: NO
          # `permissions` block, so any one of them could publish or subscribe on
          # ANYTHING in __system__ — including platform.mode.changed. Every
          # publish/subscribe set below was DERIVED FROM CODE (bus.Event{Subject:
          # ...} literals, Subject*/EventType* constants, consumer.Subscribe /
          # SubscribeBroadcast(Ready) call sites, and each service's own config
          # defaults for an env-overridable subject list), not guessed — see
          # .superpowers/sdd/service-user-permissions-report.md for the full

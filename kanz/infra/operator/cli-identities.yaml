---
# Operator CLI identities, continuously reconciled by the GitOps operator component.
# halt-identity.yaml owns the namespace and halt identity; halt-job.yaml remains
# a separate human invocation. These ServiceAccounts and NetworkPolicies provision
# identities and egress only. They do not launch any operator command.
#
# The namespace's kanz.internal/spiffe label selects the namespace-wide SPIRE
# ClusterSPIFFEID template in infra/security/spire/registration.yaml. Each
# ServiceAccount below therefore names a distinct SVID, matched to its own
# tenancy.yaml __system__ permission block. TestOperatorCLIsHaveServiceAccounts
# checks those source bindings; live SVID issuance remains operational evidence.

# kanz-mandate arms the compliance gate (COMP-01f): it publishes a
# ConfigChanged FACT per (tenant, portfolio) on
# compliance.mandate.changed.{tenant}.{portfolio} (internal/compliance/mandate_codec.go).
# This ServiceAccount is issued spiffe://kanz.internal/ns/kanz-operator/sa/kanz-mandate;
# tenancy.yaml grants that exact SVID publish rights to compliance.mandate.changed.>
# and nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kanz-mandate
  namespace: kanz-operator
  labels:
    app.kubernetes.io/part-of: kanz
---
# kanz-mandate reaches the broker and nothing else — same posture as
# kanz-halt-egress in halt-identity.yaml, egress restricted to the NATS spine plus
# the DNS needed to resolve it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kanz-mandate-egress
  namespace: kanz-operator
spec:
  podSelector:
    matchLabels:
      app: kanz-mandate
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kanz-messaging
          podSelector:
            matchLabels:
              app: nats
      ports:
        - { protocol: TCP, port: 4222 }
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---

---
# Topic provisioning script. Idempotent — re-run after taxonomy changes. Topic
# layout follows kanz-schemas/docs/subject-taxonomy.md §5: topic = {domain}.
# {entity}; event_type is discriminated within the topic. STATE_SNAPSHOT events
# use a separate compacted {domain}.{entity}.snapshot topic. Every delete-policy
# event topic gets a paired dlq.{name} for poison events.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-topics
  namespace: kanz-messaging
data:
  topics.sh: |
    #!/bin/bash
    set -euo pipefail
    BOOTSTRAP="${KAFKA_BOOTSTRAP:-kafka:9092}"
    BIN="${KAFKA_BIN:-/opt/kafka/bin}"

    ensure_topic() {
      name="$1"; partitions="$2"; cleanup="$3"; retention="$4"
      "$BIN/kafka-topics.sh" --bootstrap-server "$BOOTSTRAP" \
        --create --if-not-exists --topic "$name" \
        --partitions "$partitions" --replication-factor 3
      "$BIN/kafka-configs.sh" --bootstrap-server "$BOOTSTRAP" \
        --alter --topic "$name" \
        --add-config "cleanup.policy=${cleanup},retention.ms=${retention},min.insync.replicas=2"
      echo "  topic ${name}: ${partitions} parts, ${cleanup}, retention.ms=${retention}"
    }

    # name                     partitions  cleanup  retention_ms  dlq
    while read -r name partitions cleanup retention dlq; do
      case "$name" in ''|\#*) continue ;; esac
      ensure_topic "$name" "$partitions" "$cleanup" "$retention"
      if [ "$dlq" = "yes" ]; then
        ensure_topic "dlq.${name}" 3 delete 2592000000
      fi
    done <<'EOF'
    market.equity              12  delete   604800000   yes
    market.option              6   delete   604800000   yes
    risk.portfolio             6   delete   2592000000  yes
    risk.portfolio.snapshot    6   compact  -1          no
    execution.order            6   delete   2592000000  yes
    execution.order.snapshot   6   compact  -1          no
    inference.feature          6   delete   604800000   yes
    inference.prediction       6   delete   2592000000  yes
    platform.model             3   delete   -1          no
    platform.config            3   compact  -1          no
    data.market_stream         3   delete   2592000000  yes
    data.feature               3   delete   2592000000  yes
    observability.model        3   delete   604800000   no
    EOF

    echo "topic provisioning complete"
    "$BIN/kafka-topics.sh" --bootstrap-server "$BOOTSTRAP" --list
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  namespace: kanz-messaging
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topics
          image: apache/kafka:3.9.0
          command: ["bash", "/scripts/topics.sh"]
          env:
            - { name: KAFKA_BOOTSTRAP, value: "kafka:9092" }
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
      volumes:
        - name: scripts
          configMap:
            name: kafka-topics

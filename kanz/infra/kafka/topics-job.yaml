---
# Topic provisioning script. Idempotent — re-run after taxonomy changes. Topic
# layout follows kanz-schemas/README.md § Subject Taxonomy §5:
# topic = {domain}.
# {entity}; event_type is discriminated within the topic. STATE_SNAPSHOT events
# use a separate compacted {domain}.{entity}.snapshot topic. Every delete-policy
# event topic gets a paired dlq.{name} for poison events.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-topics
  namespace: kanz-messaging
data:
  topics.sh: |
    #!/bin/bash
    set -euo pipefail
    BOOTSTRAP="${KAFKA_BOOTSTRAP:-kafka:9092}"
    BIN="${KAFKA_BIN:-/opt/kafka/bin}"

    ensure_topic() {
      name="$1"; partitions="$2"; cleanup="$3"; retention="$4"
      "$BIN/kafka-topics.sh" --bootstrap-server "$BOOTSTRAP" \
        --create --if-not-exists --topic "$name" \
        --partitions "$partitions" --replication-factor 3
      "$BIN/kafka-configs.sh" --bootstrap-server "$BOOTSTRAP" \
        --alter --topic "$name" \
        --add-config "cleanup.policy=${cleanup},retention.ms=${retention},min.insync.replicas=2"
      echo "  topic ${name}: ${partitions} parts, ${cleanup}, retention.ms=${retention}"
    }

    # name                     partitions  cleanup  retention_ms  dlq
    while read -r name partitions cleanup retention dlq; do
      case "$name" in ''|\#*) continue ;; esac
      ensure_topic "$name" "$partitions" "$cleanup" "$retention"
      if [ "$dlq" = "yes" ]; then
        ensure_topic "dlq.${name}" 3 delete 2592000000
      fi
    done <<'EOF'
    # name                     partitions  cleanup  retention_ms  dlq
    #
    # GROUND TRUTH, NOT THE TAXONOMY DOC'S EXAMPLES. This table used to name
    # execution.order, market.equity, market.option, data.market_stream,
    # observability.model, platform.model and platform.config — NOT ONE of which is
    # published by any service. Meanwhile the entire money path (orders, fills,
    # accounting, settlement, mandates, positions) had no topic at all. Auto-create
    # is disabled, so those events had nowhere to land. TestEverySubjectHasAKafkaTopic
    # now fails the build if this table and the code ever drift apart again.
    #
    # STATE, NOT EVENTS -> compact, keyed by partition_key. A mandate that ages out
    # of the log is a control that comes back DISARMED after a restart (EXEC-M13);
    # a position that ages out is a book that rebuilds wrong. Their NATS streams
    # already know this (--max-msgs-per-subject=1, no max-age); Kafka must not be
    # the place the lesson is forgotten.
    # These two carry a DLQ even though they are COMPACTED, and the pairing is
    # not symmetric with them: the topic holds state, the DLQ holds the poison
    # message that could not be turned into state. lake-sink consumes both, and
    # a consumer wired with WithDLQ has nowhere to park a failure on a topic with
    # no `dlq.` sibling — Kafka auto-create is disabled, so the publish fails and
    # the error surfaces.
    #
    # THIS COMMENT USED TO SAY the event then "goes back to the broker for the
    # redelivery loop the DLQ exists to end". It does not: Kafka has no
    # per-message nack, and #219 reproduced what the code actually did — skip the
    # message and commit past it on the next success, losing it permanently and
    # silently. pkg/bus/kafka.go now HALTS the subscription at that offset
    # instead, so the sink stops (kanz_bus_consume_halted_total, and a non-nil
    # error out of runSink) rather than deleting what it could not park. A
    # missing `dlq.` sibling in this table is therefore an outage, not a leak —
    # which is the failure mode we want, but it is why every `yes` below must
    # stay a `yes`.
    #
    # The DLQ itself stays delete/30d: a poison message is an incident to
    # investigate, not state to retain forever.
    compliance.mandate         3   compact  -1          yes
    risk.position              6   compact  -1          yes
    wealth.household            3   compact  -1          yes
    wealth.model                3   compact  -1          yes

    # MONEY AND OBLIGATIONS -> 30d + a DLQ. 30 days is what the ARCHIVER buys;
    # permanence is the lakehouse's job (DATA-M2), not a retention setting here.
    order.order                6   delete   2592000000  yes
    # REALIZED EXECUTION COST, PER FILL (#436). Same partition count as
    # order.order because it is partitioned by the SAME key — the order id — so a
    # consumer summing an order's cost reads its fills in the order they
    # happened. Same 30d retention: it is the measurement of a money event and
    # ages with the fills it was computed from; permanence is the lakehouse's job.
    order.cost                 6   delete   2592000000  yes
    strategy.signal            6   delete   2592000000  yes
    # optimization.proposal (#409): the FACT naming who authorized a rebalance
    # that became live orders. It belongs with the money path, not with the
    # analytics, because it is the audit record for an automated capital action —
    # and losing it would leave the order.order events above with no statement of
    # who released them.
    optimization.proposal      3   delete   2592000000  yes
    accounting.balance         6   delete   2592000000  yes
    # THE EXCHANGE'S OWN MARGIN STATE, PER VENUE ACCOUNT (#408). Money-path
    # retention because of what it is evidence FOR: after a liquidation, the only
    # record of what the venue told us our collateral requirement was — and when
    # it told us — is this topic. Reconstructing it from our own book afterwards
    # is the same mistake that made the control necessary. Partitioned by venue
    # account, which is the unit the exchange margins and liquidates per.
    accounting.margin          6   delete   2592000000  yes
    # THE RECORD THAT THE BOOK WAS RECONCILED AGAINST ITS CUSTODIAN (#962).
    # Money-path retention because of what it is evidence FOR: a ReconciliationRun
    # is the only durable statement that the fund's book of record was checked
    # against an independent view on a given business date — and, when the outcome
    # is no_statement, that it could NOT be. An auditor asking "was this position
    # ever confirmed by the custodian, and at what tolerance" reads the answer
    # here; reconstructing it afterwards from our own book is the same mistake
    # that made the control necessary. Partitioned by (portfolio, custodian),
    # which is the unit a reconciliation is defined over.
    accounting.custody         6   delete   2592000000  yes
    settlement.instruction     3   delete   2592000000  yes
    compliance.breach          3   delete   2592000000  yes
    risk.portfolio             6   delete   2592000000  yes
    alternatives.commitment    3   delete   604800000   yes

    # PLATFORM LIFECYCLE -> 30d + a DLQ. Authz/mode/compliance-config changes are
    # the audit trail of who was allowed to do what, and when.
    platform.authz             3   delete   2592000000  yes
    # WHAT AN AGENT WAS SHOWN (#971). Beside platform.authz above, and on the same
    # 30d retention, because they are two halves of one request: the authz decision
    # says a principal was permitted to read a resource, this says what the model
    # was then shown, which model answered and whether the answer was grounded in
    # it. Aging them differently would leave half a trail, which is worse than
    # either half alone.
    platform.agent            3   delete   2592000000  yes
    platform.compliance        3   delete   2592000000  yes
    platform.mode              3   delete   2592000000  yes

    # INFERENCE / DATA QUALITY. inference.prediction and data.feature are published
    # by kanz-py, not Go — see the arch test's cross-language note.
    inference.feature          6   delete   604800000   yes
    inference.prediction       6   delete   2592000000  yes
    data.feature               3   delete   2592000000  yes
    # PRICING-OVERSIGHT OVERRIDES (#410). A named human's signed decision to
    # accept a price the system flagged, carrying BOTH identities once dual
    # control is armed. 30d + a DLQ like the rest of the money-adjacent path:
    # this is the record an examiner asks for, so a poison message must be parked
    # for investigation rather than skipped.
    #
    # NOT COMPACTED. The override history is APPEND-ONLY and the whole point is
    # that every decision survives; compaction keyed by exception id would keep
    # only the most recent override of each break and silently delete the
    # earlier ones — which are exactly the ones a reviewer is looking for.
    data.exception             3   delete   2592000000  yes
    # THE MODEL REGISTRY'S APPEND LOG (DEBT-02b, #112). It was removed from this
    # table when the cleanup found "NOT ONE of which is published by any
    # service" — correctly, at the time. kanz-py's BusRegistryPublisher now
    # publishes it, so the reason for its absence has gone.
    #
    # INFINITE RETENTION, AND NOT COMPACTED. Both halves matter and they pull in
    # opposite directions from the compacted state topics above.
    #
    # A starting replica REPLAYS THIS FROM OFFSET 0 to rebuild its registry — the
    # topic is the source of truth and the local Registry is the materialized
    # cache — so an event that ages out is a model the fleet silently forgets.
    #
    # And compaction keyed by model_id would keep only the LATEST event per
    # model, which is exactly wrong here: a record_validation must be applied
    # BEFORE the primary register that depends on it, and compaction would
    # discard the validation and keep the promotion. Every replica would then
    # rebuild into a state the MLOPS-01a gate refuses to reach.
    platform.model             3   delete   -1          yes

    # MARKET. Provisioned but NOT ARCHIVED by DATA-M1 (see the spec's scope): ticks
    # are the highest-volume streams by far and are re-fetchable from the venue,
    # unlike a fill. Archiving them is its own capacity and cost decision.
    market.book                12  delete   604800000   yes
    market.crypto              12  delete   604800000   yes

    # ARCHIVER'S OWN DLQ (Task 5b). One sink for every TERMINAL failure the
    # archiver can hit (undecodable body, unroutable event) — un-prefixed because
    # dlq is a reserved leading segment and an unmappable event has no
    # {domain}.{entity} to derive a per-topic DLQ name from. Named directly, not via
    # the `dlq` column above: that column pairs a DLQ with a real topic, and
    # dlq.archiver has no real-topic sibling.
    #
    # NOTHING DRAINS THIS TOPIC (#285). cmd/kanz-redrive is NATS-only, and no
    # consumer subscribes here, so the 30 days below is the window in which a
    # HUMAN can extract a parked event — after that it is deleted, and an event
    # parked here has no other copy once its NATS stream ages out. The retention
    # is deliberately NOT shortened to match the absent reader: every message here
    # is a TERMINAL failure whose recovery needs the defect fixed first (a schema
    # rollback, a corrected ARCHIVER_TENANT), and that is measured in days.
    # Shortening it would convert a recoverable hole into a guaranteed one. What is
    # missing is the reader, not less time — #285 item 3.
    dlq.archiver                3   delete   2592000000  no
    EOF

    echo "topic provisioning complete"
    "$BIN/kafka-topics.sh" --bootstrap-server "$BOOTSTRAP" --list
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  namespace: kanz-messaging
  annotations:
    # Same one-shot defect as nats-bootstrap (#92), and it matters more here:
    # Kafka is the DURABLE LOG OF RECORD, the thing nats-rebuild replays the spine
    # back from. A missing NATS stream is loud — services crash-loop on "stream not
    # found". A missing Kafka topic is quiet: the archiver simply has nowhere to
    # write, and the loss only surfaces at the moment of a DR rebuild, which is the
    # worst possible time to discover the log of record was never provisioned.
    #
    # Idempotent by construction — ensure_topic uses `--create --if-not-exists`
    # and `--alter`, so re-running converges configuration rather than duplicating
    # it, which also means a retention or partition change in git now reaches the
    # cluster instead of waiting for someone to delete the Job.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topics
          image: apache/kafka:3.9.0
          command: ["bash", "/scripts/topics.sh"]
          env:
            - { name: KAFKA_BOOTSTRAP, value: "kafka:9092" }
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
      volumes:
        - name: scripts
          configMap:
            name: kafka-topics

---
# Headless service: per-pod DNS for the KRaft controller quorum and for each
# broker's advertised listener. publishNotReadyAddresses lets the quorum form
# before any single broker reports ready.
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: kanz-messaging
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - { name: broker, port: 9092 }
    - { name: broker-tls, port: 9094 }
    - { name: controller, port: 9093 }
---
# Client bootstrap service. Producers/consumers connect over mTLS on 9094
# (SEC-01c); 9092 stays for the in-cluster bootstrap-job + migration window.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: kanz-messaging
spec:
  selector:
    app: kafka
  ports:
    - { name: broker, port: 9092, targetPort: 9092 }
    - { name: broker-tls, port: 9094, targetPort: 9094 }
---
# SEC-01c: dedicated ServiceAccount → SPIRE identity
# spiffe://kanz.internal/ns/kanz-messaging/sa/kafka (SEC-01a ClusterSPIFFEID).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka
  namespace: kanz-messaging
  labels:
    app.kubernetes.io/part-of: kanz
---
# spiffe-helper config. Writes the SVID PEM files, then (cmd hook, run on first
# fetch + each renewal) concatenates cert+key into the combined keystore PEM
# Kafka's PEM keystore requires. Broker picks up a rotated keystore on restart
# or via a kafka-configs dynamic update — documented in the README.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-spiffe-helper
  namespace: kanz-messaging
  labels:
    app.kubernetes.io/part-of: kanz
data:
  helper.conf: |
    agent_address         = "/run/spiffe/spire-agent.sock"
    cert_dir              = "/etc/kafka-certs"
    svid_file_name        = "svid.pem"
    svid_key_file_name    = "svid_key.pem"
    svid_bundle_file_name = "bundle.pem"
    cmd      = "/bin/sh"
    cmd_args = "-c 'cat /etc/kafka-certs/svid.pem /etc/kafka-certs/svid_key.pem > /etc/kafka-certs/keystore.pem'"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: kanz-messaging
spec:
  serviceName: kafka-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      terminationGracePeriodSeconds: 120
      serviceAccountName: kafka
      # apache/kafka runs as uid 1000; fsGroup makes the fresh PVC writable.
      securityContext:
        fsGroup: 1000
      initContainers:
        # SEC-01c: fetch the first SVID + build the combined keystore before
        # the broker boots so the SSL listener has certs immediately.
        - name: spiffe-helper-init
          image: ghcr.io/spiffe/spiffe-helper:0.9.0
          args: ["-config", "/etc/spiffe-helper/helper.conf", "-daemon-mode=false"]
          volumeMounts:
            - { name: spiffe-helper-config, mountPath: /etc/spiffe-helper, readOnly: true }
            - { name: kafka-certs, mountPath: /etc/kafka-certs }
            - { name: spiffe, mountPath: /run/spiffe, readOnly: true }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: kafka
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          # node id + advertised listener are derived per-pod from the ordinal,
          # then the image's standard entrypoint takes over.
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              export KAFKA_NODE_ID="${HOSTNAME##*-}"
              HOST="${HOSTNAME}.kafka-headless.kanz-messaging.svc"
              export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${HOST}:9092,SSL://${HOST}:9094"
              exec /etc/kafka/docker/run
          ports:
            - { name: broker, containerPort: 9092 }
            - { name: broker-tls, containerPort: 9094 }
            - { name: controller, containerPort: 9093 }
          env:
            - { name: CLUSTER_ID, value: "4L6g3nShT-eMCtK--X86sw" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "0@kafka-0.kafka-headless.kanz-messaging.svc:9093,1@kafka-1.kafka-headless.kanz-messaging.svc:9093,2@kafka-2.kafka-headless.kanz-messaging.svc:9093" }
            # SEC-01c: add the mTLS client listener (SSL:9094). PLAINTEXT:9092
            # stays for inter-broker + the bootstrap-job during migration.
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,SSL://:9094,CONTROLLER://:9093" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SSL:SSL" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            # SVID-backed PEM keystore + bundle truststore (spiffe-helper).
            # client.auth=required ⇒ mutual TLS; a plaintext/untrusted client is
            # rejected. Empty endpoint-identification ⇒ verify the SPIFFE URI
            # SAN, not DNS hostnames.
            - { name: KAFKA_SSL_KEYSTORE_TYPE, value: "PEM" }
            - { name: KAFKA_SSL_KEYSTORE_LOCATION, value: "/etc/kafka-certs/keystore.pem" }
            - { name: KAFKA_SSL_TRUSTSTORE_TYPE, value: "PEM" }
            - { name: KAFKA_SSL_TRUSTSTORE_LOCATION, value: "/etc/kafka-certs/bundle.pem" }
            - { name: KAFKA_SSL_CLIENT_AUTH, value: "required" }
            - { name: KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM, value: "" }
            # MT-01c: tenant isolation via topic-prefix ACLs. KRaft StandardAuthorizer,
            # deny-by-default (matches AUTH-01b posture) so an un-ACL'd principal gets
            # nothing. SVID DNs are empty (identity is the URI SAN), so a SPIFFE-aware
            # principal builder must surface "User:spiffe://..." as the ACL principal —
            # the one broker-side plugin SEC-01 owns (README). Broker + provisioner
            # SVIDs are super-users so inter-broker + topics/tenant Jobs are unrestricted.
            - { name: KAFKA_AUTHORIZER_CLASS_NAME, value: "org.apache.kafka.metadata.authorizer.StandardAuthorizer" }
            - { name: KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND, value: "false" }
            - { name: KAFKA_PRINCIPAL_BUILDER_CLASS, value: "io.kanz.kafka.SpiffePrincipalBuilder" }
            # ANONYMOUS = the PLAINTEXT:9092 principal (inter-broker + in-cluster
            # bootstrap during migration). Kept super until inter-broker SSL lands
            # and 9092 is cut (SEC-01 follow-up, already noted in README).
            - { name: KAFKA_SUPER_USERS, value: "User:spiffe://kanz.internal/ns/kanz-messaging/sa/kafka;User:spiffe://kanz.internal/ns/kanz-messaging/sa/kafka-provisioner;User:ANONYMOUS" }
            - { name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data" }
            # Durability defaults — this cluster is the log of record.
            - { name: KAFKA_DEFAULT_REPLICATION_FACTOR, value: "3" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "3" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "3" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "2" }
            - { name: KAFKA_MIN_INSYNC_REPLICAS, value: "2" }
            # Topics are provisioned explicitly (subject-taxonomy.md §7).
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_NUM_PARTITIONS, value: "3" }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
            - { name: kafka-certs, mountPath: /etc/kafka-certs, readOnly: true }
          readinessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { memory: "2Gi" }
        # SEC-01c: renews the SVID + rebuilds the keystore on rotation.
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.9.0
          args: ["-config", "/etc/spiffe-helper/helper.conf"]
          volumeMounts:
            - { name: spiffe-helper-config, mountPath: /etc/spiffe-helper, readOnly: true }
            - { name: kafka-certs, mountPath: /etc/kafka-certs }
            - { name: spiffe, mountPath: /run/spiffe, readOnly: true }
      volumes:
        - name: spiffe-helper-config
          configMap:
            name: kafka-spiffe-helper
        # Shared cert dir (spiffe-helper writes, kafka reads); Memory-backed so
        # private keys never hit disk.
        - name: kafka-certs
          emptyDir:
            medium: Memory
        # SEC-01a SPIFFE CSI volume — the agent Workload API socket.
        - name: spiffe
          csi:
            driver: csi.spiffe.io
            readOnly: true
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
# Protect the KRaft quorum during voluntary disruptions (node drains, upgrades).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kafka
  namespace: kanz-messaging
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: kafka

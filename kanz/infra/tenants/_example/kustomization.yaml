---
# MT-02 — per-tenant compute overlay, worked example.
#
# `_example` is not a real tenant and can never become one: tenant ids are
# lowercase/dns-safe (provision-tenant.sh: "set TENANT to the new tenant id
# (lowercase, dns-safe)"), and the leading underscore here makes every name
# this overlay renders (oms-_example, ...) an INVALID Kubernetes object name
# (RFC 1123 forbids `_`). If this ever reached `kubectl apply` by accident —
# which must never happen; see the README — the API server would reject it
# outright. That is a deliberate second line of defense, not an oversight.
#
# Copy this directory to kanz/infra/tenants/<tenant>/ for a real tenant and
# replace every `_example` below with `<tenant>`. See ../README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The REAL base, not a copy (see the plan's global constraint: a copy drifts,
# and drift-with-nothing-comparing-it is this repo's signature defect). A new
# env var or field added to oms-deploy.yaml is inherited here for free.
resources:
  - ../../deploy/oms-deploy.yaml

# Renames Deployment/Service/ServiceAccount/PodDisruptionBudget `oms` ->
# `oms-_example`, and — via kustomize's built-in ServiceAccount name-reference
# transformer — updates the Deployment's `serviceAccountName: oms` to
# `serviceAccountName: oms-_example` automatically. The base already declares
# the ServiceAccount object (not just a dangling reference to one), so
# nameSuffix has a real object to rename: verified by rendering below, not
# assumed.
nameSuffix: "-_example"

# includeSelectors: true is load-bearing, not decorative. The base's Service
# selector, Deployment spec.selector/template labels, and PDB selector are all
# `app: oms` — identical across every tenant overlay, because they come from
# the SAME base file. Without this, every tenant's OMS pods would land in the
# same `kanz-services` namespace (ground truth #5) carrying the same `app: oms`
# label, so tenant A's Service would load-balance across tenant B's pods too,
# and tenant A's PodDisruptionBudget would count tenant B's replicas toward its
# own minAvailable. `includeSelectors: true` stamps `tenant: _example` onto
# every one of those selectors as well as onto metadata.labels, so each
# tenant's Service/Deployment/PDB only ever sees its own pods.
labels:
  - pairs:
      tenant: _example
    includeSelectors: true

# The base ships OMS_TENANT=__system__ (platform default). Matched by the
# container's `name: oms` and the env entry's `name: OMS_TENANT` merge keys —
# not a positional index — so it survives the base reordering or growing its
# env list.
patches:
  - target:
      kind: Deployment
      name: oms
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: oms
      spec:
        template:
          spec:
            containers:
              - name: oms
                env:
                  - name: OMS_TENANT
                    value: _example

# SRE-01d — GameDay workflow.
#
# A Chaos Mesh Workflow that runs the SRE-01c experiments as a controlled,
# SERIAL drill: inject one fault, verify the system stayed in steady state,
# clear it, recover, then move to the next. Serial (not parallel) so a single
# failed hypothesis is unambiguously attributable, and so a real on-call can
# follow along against the runbooks in each component's README
# (infra/observability/alerts/, infra/nats/, infra/dr/).
#
# Each `verify-*` step runs the SRE-01c verify.sh from the `chaos-verify`
# ConfigMap (see gamedays/README.md to create it). verify.sh exits non-zero on a
# violated invariant (SLO fast-burn or data loss), which fails the Task and
# ABORTS the workflow — the GameDay gates on resilience, it doesn't just run
# faults. A `pause` step between faults lets the system fully recover and gives
# the on-call a beat to read the dashboard.
apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: kanz-gameday
  namespace: kanz-services
  labels: { app.kubernetes.io/part-of: kanz, chaos.kanz.io/suite: sre-01d }
spec:
  entry: gameday
  templates:
    - name: gameday
      templateType: Serial
      deadline: 60m
      children:
        - broker-kill
        - verify-broker-kill
        - recover
        - partition
        - verify-partition
        - recover
        - latency
        - verify-latency
        - recover
        - pod-eviction
        - verify-pod-eviction

    # --- faults (mirror the SRE-01c manifests; kept inline so the drill is one
    #     self-contained object) ---
    - name: broker-kill
      templateType: PodChaos
      deadline: 3m
      podChaos:
        action: pod-kill
        mode: one
        selector:
          namespaces: [kanz-messaging]
          labelSelectors: { app: nats }

    - name: partition
      templateType: NetworkChaos
      deadline: 9m
      networkChaos:
        action: partition
        mode: all
        direction: both
        selector:
          namespaces: [kanz-services]
          labelSelectors: { app: risk-engine }
        target:
          mode: all
          selector:
            namespaces: [kanz-messaging]
            labelSelectors: { app: nats }
        duration: 8m

    - name: latency
      templateType: NetworkChaos
      deadline: 6m
      networkChaos:
        action: delay
        mode: all
        direction: to
        selector:
          namespaces: [kanz-services]
          labelSelectors: { app: inference }
        delay: { latency: "1500ms", jitter: "200ms", correlation: "50" }
        duration: 5m

    - name: pod-eviction
      templateType: PodChaos
      deadline: 3m
      podChaos:
        action: pod-kill
        mode: one
        selector:
          namespaces: [kanz-services]
          labelSelectors: { app: risk-engine }

    # --- verification gates (verify.sh from the chaos-verify ConfigMap) ---
    - name: verify-broker-kill
      templateType: Task
      deadline: 3m
      task: &verify
        container:
          name: verify
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "/verify/verify.sh"]
          args: ["broker-kill"]
          env:
            - { name: PROM, value: "http://prometheus.kanz-observability.svc:9090" }
          volumeMounts:
            - { name: verify, mountPath: /verify }
        volumes:
          - name: verify
            configMap: { name: chaos-verify, defaultMode: 0755 }
    - name: verify-partition
      templateType: Task
      deadline: 3m
      task:
        <<: *verify
        container:
          name: verify
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "/verify/verify.sh"]
          args: ["network-partition"]
          env: [{ name: PROM, value: "http://prometheus.kanz-observability.svc:9090" }]
          volumeMounts: [{ name: verify, mountPath: /verify }]
    - name: verify-latency
      templateType: Task
      deadline: 3m
      task:
        <<: *verify
        container:
          name: verify
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "/verify/verify.sh"]
          args: ["latency-injection"]
          env: [{ name: PROM, value: "http://prometheus.kanz-observability.svc:9090" }]
          volumeMounts: [{ name: verify, mountPath: /verify }]
    - name: verify-pod-eviction
      templateType: Task
      deadline: 3m
      task:
        <<: *verify
        container:
          name: verify
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "/verify/verify.sh"]
          args: ["pod-eviction"]
          env: [{ name: PROM, value: "http://prometheus.kanz-observability.svc:9090" }]
          volumeMounts: [{ name: verify, mountPath: /verify }]

    # Recovery dwell between faults — let lag drain / staleness clear / pods
    # rejoin before the next blast, and time for the on-call to read the runbook.
    - name: recover
      templateType: Suspend
      deadline: 3m

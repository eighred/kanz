# Prometheus (#61) — the thing that was missing.
#
# WHY THIS FILE EXISTS. infra/observability/ shipped alerts/, dashboards/ and
# slo/ for months while NOTHING scraped. There was no kind: Prometheus, no
# prometheus image, and exactly one prometheus.io/scrape annotation in the
# repository — on node-exporter, which is not one of the services. The SLO
# recording rules computed over series no collector gathered, the burn-rate
# alerts fired on those recordings, and every degraded mode the platform has was
# unobservable. None of it looked broken: the files were present, reviewed and
# tested by promtool. Configuration that is complete and unconnected is the
# hardest kind of gap to see.
#
# WHAT THIS IS NOT. It is not a metrics platform. There is no remote_write, no
# HA pair and no Alertmanager — so alerts are EVALUATED here and delivered
# nowhere. Deploying this makes the platform observable; it does not make it
# alertable. Do not read a running Prometheus as "on-call works".
#
# Storage IS now durable — a 31d PVC rather than the original 15d emptyDir (see
# RETENTION below) — because the 28d error-budget window (#210) cannot be
# computed from a database that is discarded on every pod restart. That fixes
# retention; it does not make this an HA pair, and a single Prometheus on a
# single RWO volume is still a single point of failure for the history.
#
# THAT LAST SENTENCE IS NO LONGER LEFT TO A COMMENT (#230). A comment is read
# once, by whoever deploys; the operator looking at /alerts at 03:00 six months
# later is not reading this file. So the `alerting:` block below DISCOVERS an
# Alertmanager rather than naming one, which makes
# prometheus_notifications_alertmanagers_discovered read 0 while none exists,
# and alerts/operational.rules.yaml's AlertDeliveryNotDelivering fires
# permanently on the /alerts page itself saying so. It clears with no config
# change when #98 provides somewhere to run one.
#
# PLAIN PROMETHEUS, NOT THE OPERATOR, and the reason is the rule files. slo/
# ships slo.recording.rules.yaml and slo.alerts.rules.yaml as ordinary rule
# files with a promtool test harness in slo_test.yaml. The Operator would
# require restating both as PrometheusRule CRDs, which orphans that harness and
# leaves the tests validating a copy nothing loads. Mounting the files unchanged
# keeps one source of truth for the rules and keeps them tested.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: kanz-observability
  labels:
    app.kubernetes.io/part-of: kanz
---
# Pod discovery only. Prometheus needs to LIST pods to find scrape targets and
# nothing else: it does not read secrets, it does not read configmaps, and it
# does not need nodes (node-exporter is discovered as an ordinary annotated pod,
# the same way every service is). A monitoring plane with cluster-wide read is a
# credential-harvesting surface waiting for a Prometheus CVE; this is the
# smallest grant that makes role: pod work.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-pod-discovery
  labels:
    app.kubernetes.io/part-of: kanz
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-pod-discovery
  labels:
    app.kubernetes.io/part-of: kanz
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-pod-discovery
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: kanz-observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: kanz-observability
  labels:
    app.kubernetes.io/part-of: kanz
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    # Every rule file, mounted from the prometheus-rules ConfigMap that
    # apply-rules.sh builds from the tree. This glob matches the MOUNT, so it
    # cannot detect a rule file the ConfigMap omitted — the script is what makes
    # the set complete (#230). They are NOT restated
    # here: infra/observability/slo/ is the one copy, slo_test.yaml tests that
    # copy with promtool, and a second inlined copy would drift from the tested
    # one silently — Prometheus would load rules nobody had tested and promtool
    # would pass against rules nobody ran.
    rule_files:
      - /etc/prometheus/rules/*.rules.yaml

    # WHERE ALERTS GO — DISCOVERED, NOT NAMED, AND TODAY IT FINDS NOTHING (#230).
    #
    # THERE IS NO ALERTMANAGER IN THIS ESTATE. That is issue #98's problem, not
    # this file's: nothing has anywhere to run and no receiver has a real
    # destination. What this block does is make the ABSENCE a discoverable fact
    # instead of a sentence in a comment.
    #
    # It is deliberately NOT a static_config naming
    # `alertmanager.kanz-observability.svc:9093`. Writing down an address for a
    # service that does not exist is the failure this whole issue is about in
    # miniature: the config would read as complete, promtool would pass it, and
    # `prometheus_notifications_alertmanagers_discovered` would report 1 — a
    # configured Alertmanager — for a name that resolves to nothing. Delivery
    # would fail silently into prometheus_notifications_errors_total, which no
    # one is watching, and the estate would look alertable.
    #
    # Kubernetes discovery cannot lie in that direction. With no Alertmanager pod
    # it finds zero, the discovered gauge reads 0, and the AlertDeliveryNotDelivering
    # rule in alerts/operational.rules.yaml fires and STAYS firing on Prometheus's
    # own /alerts page — the one surface a human opens. "Not deployed" is then
    # loud, and cannot be mistaken for "deployed and quiet".
    #
    # AND IT SELF-HEALS. When #98 lands an Alertmanager pod labelled
    # app=alertmanager in this namespace, discovery finds it, delivery starts and
    # that alert resolves — with no edit here. There is no second step to forget.
    #
    # RBAC: role: pod only, which the prometheus-pod-discovery ClusterRole above
    # already grants. No new permission.
    alerting:
      alertmanagers:
        - kubernetes_sd_configs:
            - role: pod
              namespaces: { names: [kanz-observability] }
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_label_app]
              action: keep
              regex: alertmanager
            # The port is fixed rather than annotation-driven, unlike the scrape
            # job below: 9093 is Alertmanager's own default and there is exactly
            # one such workload, so an annotation here would be a configuration
            # surface with no user.
            - source_labels: [__address__]
              action: replace
              regex: ([^:]+)(?::\d+)?
              replacement: $1:9093
              target_label: __address__

    scrape_configs:
      # ANNOTATION-DRIVEN DISCOVERY, not a static target list. A hardcoded list
      # goes stale the moment a service is added or a notDeployed exemption is
      # retired, and it goes stale SILENTLY — the new service is simply absent,
      # and absent targets appear on no dashboard and fire no alert.
      # test/arch/prometheus_scrape_test.go enforces the other half: every
      # deployable service must carry these annotations.
      - job_name: kanz-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Opt-in. A pod without the annotation is not scraped.
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"

          # THE PORT COMES FROM THE ANNOTATION, and it must, because it is not
          # guessable. Ports in this estate run 8080-9090 and several workloads
          # open more than one: venue-binance is grpc 9000 + http 8091,
          # venue-okx is grpc 9000 + http 8092, operator is grpc 9090 + health
          # 8091. Defaulting to the first declared port would aim the scrape at
          # gRPC, which cannot answer GET /metrics — and that failure surfaces
          # as a DOWN row, not an error.
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

          # No prometheus.io/path handling, deliberately. Every service in this
          # estate serves /metrics and the arch guard asserts it, so a path
          # annotation would be a configuration surface with no user and one
          # more thing to get wrong.

          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          # `service` is the label the SLO rules in slo/ join on. It comes from
          # the app label every workload in this estate already sets; without
          # this the recording rules produce series the alerts cannot match.
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: service
          # Argo's AnalysisTemplate scopes its risk queries to the new ReplicaSet.
          # Kubernetes discovery normalizes the Rollout's
          # `rollouts-pod-template-hash` label to this meta label; Prometheus does
          # not retain Kubernetes labels unless a relabel rule copies them.
          # Without this rule both canary queries return an empty vector and an
          # otherwise healthy rollout aborts for lack of evidence.
          - source_labels: [__meta_kubernetes_pod_label_rollouts_pod_template_hash]
            action: replace
            target_label: rollouts_pod_template_hash
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: kanz-observability
  labels:
    app.kubernetes.io/part-of: kanz
    app: prometheus
spec:
  # ONE REPLICA, AND NOT AS AN OVERSIGHT. Two plain Prometheus pods do not form
  # a cluster: they scrape independently, store independently, and disagree.
  # Highly-available Prometheus means a deliberate pair with deduplication in
  # front (Thanos/Mimir), which is a different change. Raising this number
  # without that gives two half-truths instead of one.
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    # Recreate, not RollingUpdate: the TSDB volume below is ReadWriteOnce and
    # owned by one pod, and a rolling update would briefly run two scrapers
    # against the same targets AND two writers against the same TSDB. The second
    # is the worse half — since #210 that volume is a PVC holding a month of
    # history, so a corrupted TSDB is no longer a restart away from clean.
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        app.kubernetes.io/part-of: kanz
      annotations:
        # Prometheus scrapes itself: up{service="prometheus"} is how you learn
        # the scraper is alive from the same surface as everything else.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          # quay.io, matching node-exporter.yaml, rather than Docker Hub: same
          # registry as the sibling component and no Hub rate limit.
          #
          # PINNED BY DIGEST, and the tag is retained only so a human can read
          # which version this is. v3.1.0 is a MUTABLE tag upstream — the digest
          # is what actually determines what runs.
          #
          # THIS IS AN UNMIRRORED THIRD-PARTY BASE. base-image-mirror.yml exists
          # precisely to remove dependencies like this one, and it does not yet
          # cover the observability images (node-exporter has the same gap).
          # Populating the mirror and repointing are deliberately separate
          # changes in that workflow's own comment, and in that order.
          image: quay.io/prometheus/prometheus:v3.1.0@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # RETENTION MUST OUTLAST THE ERROR-BUDGET ACCOUNTING WINDOW (#210).
            #
            # This was 15 days, on an emptyDir. slo.yaml has declared a 28d
            # accounting window since SRE-01a, so the moment anything computed
            # over it the answer would have been assembled from half a month and
            # published as a month — and `rate()` does not fail on a short
            # database, it returns a smaller number. Under-reporting consumption
            # reads as budget REMAINING, which is the reassuring direction and
            # therefore the dangerous one.
            #
            # 31d, not 28d: the window must be fully covered at every instant,
            # including immediately before a block is compacted out, so the
            # retention has to exceed the window rather than equal it.
            #
            # THE SIZE CAP IS NOT OPTIONAL ALONGSIDE A PVC. Time-based retention
            # alone lets the TSDB grow to whatever 31 days happens to cost; if
            # that exceeds the volume, Prometheus does not shed data, it fails to
            # write and crash-loops — and an observability stack that dies when
            # the estate gets busy fails exactly when it is needed. 15GB against
            # the 20Gi claim below leaves headroom for compaction, which needs
            # room for the new block before dropping the old.
            #
            # SIZING, STATED SO IT CAN BE CHECKED RATHER THAN TRUSTED: at ~2
            # bytes/sample compressed and a 30s scrape, 31 days costs roughly
            # 2 × 2 × 60 × 24 × 31 ≈ 5.4MB per active series, so 15GB carries on
            # the order of 2,800 series. That is an ESTIMATE from an estate that
            # has never run this long. Check it against prometheus_tsdb_head_series
            # and prometheus_tsdb_storage_blocks_bytes once it has, and raise both
            # numbers together — the cap is only safe while it stays below the
            # claim.
            - --storage.tsdb.retention.time=31d
            - --storage.tsdb.retention.size=15GB
            - --web.listen-address=:9090
          ports:
            - { name: http, containerPort: 9090 }
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: 9090 }
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 2Gi }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus, readOnly: true }
            - { name: rules, mountPath: /etc/prometheus/rules, readOnly: true }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        # NOT optional. If the prometheus-rules ConfigMap is absent the pod stays
        # in ContainerCreating and says so, which is the whole point: with
        # `optional: true` Prometheus would start clean, load zero rules, serve a
        # green /-/ready, and every alert would simply never fire. "Nothing
        # configured" must not look like "checked, and fine".
        #
        # Create it with the script, which is the ONLY list of what loads:
        #   kanz/infra/observability/apply-rules.sh
        #
        # It was two hand-written --from-file lines here until #230. That is a
        # deployment contract written in prose: a rule file added outside slo/ was
        # not in the ConfigMap, and since `rule_files` below globs the MOUNT it
        # matched whatever the ConfigMap happened to hold — so an incomplete rule
        # set was indistinguishable from a complete one. The script derives the
        # list from the tree; test/arch/observability_rules_reachable_test.go
        # fails the build if CI stages a different set than the script would.
        - name: rules
          configMap: { name: prometheus-rules }
        # A PVC, NOT AN emptyDir (#210). An emptyDir is discarded with the pod,
        # so every restart reset the history to zero — and the error-budget
        # window is 28 days. With ephemeral storage the budget figure would have
        # been unavailable for a month after every routine node drain, image
        # bump or OOM, which is most of the time on any estate that is actually
        # being worked on.
        #
        # The claim is what makes `retention.time=31d` mean anything. Retention
        # is an upper bound on what is KEPT; it says nothing about what survives.
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
# THE TSDB'S VOLUME (#210).
#
# ReadWriteOnce is correct and is not a limitation to route around: the
# Deployment above is deliberately one replica with strategy Recreate, because
# two plain Prometheus pods scrape and store independently and disagree. RWO and
# Recreate together are what stop a rolling update from briefly attaching two
# writers to one TSDB, which corrupts it.
#
# NO storageClassName, deliberately — the cluster's default class binds it. This
# repository is deployed to more than one shape of cluster (kind locally, managed
# elsewhere) and naming a class here would make the manifest bind on one and hang
# Pending on the other, presenting as "Prometheus won't start" with nothing in
# the pod events pointing at this line.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: kanz-observability
  labels:
    app.kubernetes.io/part-of: kanz
    app: prometheus
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      # Must exceed --storage.tsdb.retention.size (15GB) with room for
      # compaction, which writes the new block before dropping the old.
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: kanz-observability
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  selector:
    app: prometheus
  ports:
    - { name: http, port: 9090, targetPort: 9090 }

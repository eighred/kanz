# GENERATED — DO NOT EDIT BY HAND. Regenerate with:
#
#   ./apply-rules.sh --emit > rules-configmap.yaml
#
# THE RULES CONFIGMAP IS A SYNCED MANIFEST (#625). Until this file existed,
# prometheus-rules was created only by apply-rules.sh, and apply-rules.sh had no
# caller: Argo CD did not sync this tree, CI only ran the script's --list to
# stage promtool inputs, and nothing else invoked it. Every alert here was
# validated, guarded, proven-to-fire and loaded by NOTHING.
#
# prometheus.yaml mounts this ConfigMap NON-OPTIONALLY, deliberately: if it is
# absent the pod stays in ContainerCreating and says so, rather than starting
# clean, loading zero rules and serving a green /-/ready with every alert
# silently missing.
#
# EDITING THIS FILE DIRECTLY IS THE ONE THING THAT BREAKS THE ARRANGEMENT — it
# would become a second list, competing with the tree, which is the exact state
# #230 ended. Add or change a *.rules.yaml and regenerate.
# test/arch/observability_rules_reachable_test.go fails the build if this file
# and the tree disagree.
apiVersion: v1
data:
  operational.rules.yaml: |
    # Absolute-threshold operational alerts (#230) — over the metrics the platform
    # ALREADY emits.
    #
    # WHY THESE EXIST AND THE SLO RULES ARE NOT ENOUGH. slo.alerts.rules.yaml is
    # four burn-rate alerts over RATIOS, and a ratio is blind to zero-over-zero. A
    # JetStream/Kafka consumer that stalls at 03:00 stops incrementing
    # kanz_bus_consume_total{result="ok"} AND kanz_bus_consume_total{result="error"}
    # in equal measure — the denominator goes to zero, the SLI is NaN, `NaN > x` is
    # false, and the event-bus delivery-success burn-rate alert stays silent for as
    # long as the stall lasts. The recording rules say so themselves ("a silent
    # service burns no budget, which is correct") — correct for an SLO, useless for
    # an outage. Everything below is an ABSOLUTE value or a THROUGHPUT FLOOR, which
    # is the shape that can see a zero.
    #
    # EVERY THRESHOLD IS DERIVED, NOT PICKED. A rule nobody can justify is silenced
    # on its first false page and is then worse than nothing, so each one states
    # where its number comes from. Where the number could only be invented, the rule
    # is written WITHOUT one instead (see ArchiverNotArchivingWithBacklog, which
    # compares a backlog against a throughput of exactly zero).
    #
    # WHAT IS DELIBERATELY ABSENT: kanz_bus_consumer_lag AND kanz_bus_pending_messages.
    # Both are declared in pkg/bus/metrics.go and both are described there as "the
    # KEDA scale signal", but NOTHING IN THE MODULE EVER SETS EITHER. Their only
    # writers are BusMetrics.SetConsumerLag and BusMetrics.SetPending, and a search
    # of every .go file in the module finds zero call sites for both — the "periodic
    # poller" their doc comments describe was never written. A GaugeVec with no
    # WithLabelValues call exports no series at all, so a rule over them would
    # compare a threshold against an empty vector and could never fire: the exact
    # defect #62 deleted ten data-quality rules for, re-created with different names.
    # (An `absent()` rule would be worse — it would fire continuously and forever,
    # which is how an alerting layer trains its readers to ignore it.)
    # alerts/README.md states the order that was violated to produce that state, and
    # it is the order followed here: INSTRUMENT FIRST, then write the rule. Until a
    # poller exists, BusConsumerStalled below covers the same failure from
    # kanz_bus_consume_total, which is emitted on every dispatch and therefore real.
    #
    # The same absence is a live scaling defect, not just an alerting one:
    # infra/deploy/risk-engine-scaledobject.yaml and market-data-scaledobject.yaml
    # both query these two series from Prometheus as their KEDA trigger, so both
    # ScaledObjects are scaling on a series that does not exist.
    #
    # ALSO DELIBERATELY ABSENT: A RULE OVER kanz_risk_calibration_strip_quoted.
    # #908 instrumented the risk-engine's curve calibration so a strip short of its
    # configured instrument set is visible — kanz_risk_calibration_strip_configured
    # is the denominator from this pod's reference spec,
    # kanz_risk_calibration_strip_quoted is how many reached the last fit, and
    # kanz_risk_calibration_strip_missing splits the gap by reason. The natural rule
    # writes itself and needs no invented threshold, because both sides are the
    # pod's own numbers: quoted < configured.
    #
    # It is not here because NOTHING IN THIS ESTATE EMITS THE SERIES YET. The
    # calibration scheduler starts only when RISK_ENGINE_CALIBRATION_INTERVAL and
    # RISK_ENGINE_CALIBRATION_RATES are both set, and `grep -rn CALIBRATION infra/`
    # finds neither in any manifest — so the gauges have a real producer in the
    # binary and no producer in any RUNNING pod. A rule over them today would
    # compare against an empty vector and could never fire: #62's defect reached
    # from the same direction as the two bus gauges above, and the reason
    # alerts/README.md gives for INSTRUMENT FIRST, then write the rule. The
    # instrumenting is the half that landed.
    #
    # WHAT UNBLOCKS IT IS A RATE QUOTE PRODUCER, NOT THE MANIFEST LINE (#912). This
    # paragraph used to end "what unblocks the rule is a deployment that enables
    # calibration", which reads as one env-var edit away and is wrong in a way that
    # would ship a rule firing forever. #912 measured the estate: the entire market
    # spine is MARKET_INGEST_INSTRUMENTS="BTC-USDT,ETH-USDT", market-data's feed is
    # unset in every manifest, and no deposit, rate future or par swap is quoted
    # anywhere — so RISK_ENGINE_CALIBRATION_RATES has no defensible value to hold.
    # Setting it anyway would give every configured instrument MissingNoQuote from
    # the first refresh: _configured > 0, _quoted == 0, permanently. The rule would
    # then fire on its first evaluation and never clear, which is the same "trains
    # its readers to ignore it" failure this file rejects `absent()` for one
    # paragraph up — an alert that is always firing and an alert that can never fire
    # are the same alert. It would also register the seven FI and structured
    # measures behind the same gate, flagged unmeasured on every response.
    #
    # So the ordering is one step longer than it looked: a rates producer (#104
    # vendor Source bindings, #105 licensed rate data — both blocked-external), THEN
    # a deployment that enables calibration against instruments that producer
    # quotes, THEN this rule. Its `for:` is derivable at that point from that
    # deployment's own RISK_ENGINE_CALIBRATION_INTERVAL (a strip point absent across
    # several consecutive refreshes is not warming up), which is a number nobody can
    # state while the cadence is unset everywhere.
    #
    # THE SECOND HALF OF THAT ORDERING IS ENFORCED, NOT DOCUMENTED.
    # test/arch/calibration_alert_follows_its_producer_test.go derives both sides —
    # whether any workload in infra/ sets both variables, and whether any rule here
    # names the strip-coverage gauges — and fails when they disagree, in either
    # direction. A deployment that turns the producer on without this rule fails the
    # build; so does this rule landing while no pod produces the series. That is
    # what stops the paragraph above from going stale a second time, which is how it
    # got the unblocking condition wrong in the first place.
    #
    # EVERY RULE BELOW IS PROVEN TO FIRE. operational_test.yaml next to this file is
    # a promtool unit-test harness with a firing case for each alert and a
    # must-NOT-fire case for each one where silence is a distinct claim. A rule that
    # parses but can never fire is this file's own subject one level up — an
    # alerting layer that reads as healthy because nothing in it works — so parsing
    # is not the bar. CI runs the harness (the `observability` job discovers every
    # *_test.yaml under infra/observability and executes it from its own directory);
    # test/arch/observability_rules_reachable_test.go fails the build if it stops.
    #
    #   cd infra/observability/alerts
    #   promtool check rules operational.rules.yaml
    #   promtool test rules operational_test.yaml
    groups:
      # ---------------------------------------------------------------------------
      # BUS DELIVERY — is the spine actually moving events?
      # ---------------------------------------------------------------------------
      - name: bus_delivery
        rules:
          # THE ISSUE'S FAILURE SCENARIO, CAUGHT BY A THROUGHPUT FLOOR.
          #
          # A STALLED consumer and a SLOW one look nothing alike and only one of them
          # is this rule's business. Slow is a backlog draining below capacity —
          # KEDA's job, and it is already wired to scale on it. Stopped is a group
          # that delivered traffic and now delivers none, which no ratio can see
          # because both terms fall to zero together.
          #
          # THE SECOND CLAUSE IS THE WHOLE RULE. Without it this pages for every
          # subject that is legitimately quiet at 03:00 — and this estate has plenty
          # (compliance.breach.>, settlement.>, tenant onboarding). Requiring that
          # the SAME (subject, group) delivered at least one message in the preceding
          # 24 hours is what separates "this consumer stopped" from "nothing was
          # sent". 24h and not 6h because a daily batch subject must not be able to
          # go quiet for long enough to disqualify itself from its own alert.
          #
          # KNOWN DECAY, STATED RATHER THAN HIDDEN: a stall lasting more than 24h
          # takes the qualifier to zero too and this alert RESOLVES on its own. That
          # is a deliberate trade for not paging on idle subjects. It is survivable
          # only because an alert that has been firing for a day and resolved without
          # a human is itself the anomaly — and because BusConsumerHalted and
          # KanzScrapeTargetDown catch the two mechanisms that actually produce a
          # day-long stall.
          #
          # 15m window + for: 15m ≈ 30 minutes of total silence before it pages.
          # Deliberately slow: scrape_interval is 30s, a busy subject can go quiet
          # for a minute during a leader election or a rolling restart, and a 3am
          # page that is a coin flip gets the rule deleted. Thirty minutes is still
          # eight hours better than the morning position discrepancy this replaces.
          - alert: BusConsumerStalled
            expr: |
              (
                sum by (subject, group) (rate(kanz_bus_consume_total[15m])) == 0
                and
                sum by (subject, group) (rate(kanz_bus_consume_total[24h])) > 0
              )
            for: 15m
            labels: { severity: critical, layer: operational }
            annotations:
              summary: "Consumer group {{ $labels.group }} has consumed nothing from {{ $labels.subject }} for 30 minutes"
              description: "{{ $labels.group }} delivered messages on {{ $labels.subject }} within the last 24h and has delivered NONE for the last 30 minutes. This is invisible to the event-bus delivery-success SLO: with no deliveries at all the error ratio is 0/0, so no burn-rate alert can fire. Events are accumulating on the spine and the streams that carry them age out (24h on MARKET/RISK/EXECUTION, 168h on the money streams). Check the consumer's pod, then whether it is blocked on Postgres or a venue call."

          # #219's COUNTER, WHICH EXISTS PRECISELY BECAUSE EVERY OTHER SERIES READS
          # NORMAL. A Kafka subscription that could neither handle nor dead-letter a
          # delivery returns WITHOUT committing: kanz_bus_consume_total records the
          # failed dispatch and then stops moving, and the lag is computed from a
          # committed offset that correctly did not advance. Nothing else in the bus
          # exporter distinguishes that from an idle topic.
          #
          # THRESHOLD IS ZERO BECAUSE THE EVENT IS TERMINAL. The subscription does
          # not resume — it has returned, holding the offset, and will not move again
          # until the pod is restarted with the dead-letter path repaired. There is
          # no rate to trend and no volume at which it becomes interesting: one is
          # one stopped consumer.
          #
          # for: 0m for the same reason. A `for:` on a terminal, non-self-healing
          # condition only delays the page. increase() over 10m already absorbs a
          # single-scrape artefact, and holds the alert up for ten minutes after the
          # halt so it cannot flap.
          - alert: BusConsumerHalted
            expr: increase(kanz_bus_consume_halted_total[10m]) > 0
            for: 0m
            labels: { severity: critical, layer: operational }
            annotations:
              summary: "Consumer {{ $labels.group }} HALTED on {{ $labels.subject }} — it refused to skip an event"
              description: "The subscription stopped without committing because a delivery could neither be handled nor dead-lettered: the DLQ path is down and the consumer is holding the offset rather than losing the event. It will not resume on its own. Fix the dead-letter destination, then restart the consumer — this counter is the only signal that it stopped on purpose, and it does not clear itself."

          # AN ARCHIVER FALLING BEHIND IS DATA LOSS WITH A DELAY ON IT.
          # services/archiver/internal/archive/metrics.go says it: "Being down is
          # survivable and self-healing; being slow is not, and it is invisible
          # without this."
          #
          # NO INVENTED THRESHOLD IN THIS ONE. The comparison is a backlog against a
          # throughput of EXACTLY ZERO: there is something pending and nothing has
          # been archived in fifteen minutes. That needs no capacity model to justify
          # and cannot be argued down.
          #
          # THIS RULE WORKS ONLY BECAUSE THE POLLER IS OFF THE MESSAGE PATH. The lag
          # poller in cmd/archiver/main.go ticks every 15s in its own goroutine, "so
          # it keeps reporting even while the archiver itself is stuck (e.g.
          # NACK-looping a produce failure)" — the stuck case is exactly this alert's
          # subject, and the pending gauge is still being published throughout it.
          #
          # `or vector(0)` IS LOAD-BEARING. An archiver that has never archived
          # anything exports no kanz_archiver_archived_total series, sum() of nothing
          # is an EMPTY vector, and `empty == 0` is empty — so without the fallback
          # this rule would go silent for a brand-new or never-working archiver,
          # which is the worst case it has. Failing open here would reproduce the
          # bug the file exists to remove.
          #
          # for: 15m on top of a 15m window: half an hour of a backlog with zero
          # drain. A rolling restart takes under a minute and a Kafka leader election
          # seconds.
          - alert: ArchiverNotArchivingWithBacklog
            expr: |
              (
                max(kanz_archiver_pending_messages) > 0
                and
                (sum(rate(kanz_archiver_archived_total[15m])) or vector(0)) == 0
              )
            for: 15m
            labels: { severity: critical, layer: operational }
            annotations:
              summary: "The archiver has a backlog and has written nothing to Kafka for 30 minutes"
              description: "Events are pending on the spine for the archiver's durable consumer and kanz_archiver_archived_total has not moved. The Kafka log of record is no longer receiving the event stream. NATS streams age out (24h on MARKET/RISK/EXECUTION, 168h on ACCOUNTING/COMPLIANCE/SETTLEMENT), so anything not archived before its stream's max-age is gone permanently — this is a countdown, not a backlog. Check kanz_archiver_failed_total by reason for whether the produce, the routing or the DLQ is what failed."

          # SLOW, NOT STOPPED — the other half, and the one that needs a number.
          #
          # A steady backlog that is draining is not an incident; a backlog that has
          # been GROWING for half an hour ends in data loss on a schedule. Both
          # clauses are required: deriv() alone fires on any transient burst, and a
          # magnitude alone fires on a healthy archiver absorbing a market open.
          #
          # WHERE 1000 COMES FROM. It is the only invented number in this file and it
          # exists purely to suppress small bursts, not to define "behind" — the
          # growth clause does that. test/load/capacity-model.md sizes one
          # risk-engine replica's standing backlog at 500 pending, so 1000 is two
          # replica-loads of work: comfortably above anything the archiver absorbs
          # between its 15s polls, and four orders of magnitude below a 24h stream's
          # volume, so it cannot be mistaken for a loss horizon. If it ever pages
          # falsely, raise it — the growth clause is the part that must not be
          # weakened.
          #
          # max by (subject), not sum: every archiver replica polls the SAME durable
          # consumer's pending count, so summing across pods would multiply one
          # backlog by the replica count.
          - alert: ArchiverBacklogGrowing
            expr: |
              (
                max by (subject) (kanz_archiver_pending_messages) > 1000
                and
                max by (subject) (deriv(kanz_archiver_pending_messages[30m])) > 0
              )
            for: 30m
            labels: { severity: warning, layer: operational }
            annotations:
              summary: "The archiver's backlog on {{ $labels.subject }} has been growing for 30 minutes"
              description: "Pending messages for the archiver's durable consumer are above 1000 and still rising. The archiver is running but slower than the spine is producing, which ends in events ageing off their stream unarchived. Not a page: it has hours of headroom on a 24h stream. Find the bottleneck (Kafka produce latency, or a partition leader move) before it becomes ArchiverNotArchivingWithBacklog."

      # ---------------------------------------------------------------------------
      # DEAD LETTERS — events that left the live path and are now one copy on a
      # write-only stream
      # ---------------------------------------------------------------------------
      #
      # WHY THERE IS NO DEPTH RULE HERE. There is no DLQ depth metric, and #230 asked
      # for one. Depth on `dlq.>` is broker state, so a gauge for it must be fed by a
      # poller over JetStream ConsumerInfo — and pkg/bus has already shipped two
      # poller-fed gauges whose poller was never written (kanz_bus_consumer_lag,
      # kanz_bus_pending_messages; see the header). A third of that shape would make
      # the DLQ look measured while measuring nothing, which is the defect this file
      # exists to remove, so #230's DLQ work landed as an INFLOW counter on the
      # message path instead: kanz_bus_dlq_parked_total, incremented by
      # Consumer.publishDLQ only after the park succeeded. It is real the moment a
      # message is parked, needs no poller, and cannot become an empty vector.
      #
      # Inflow is also the better alerting signal. Depth answers "how much is stuck",
      # which matters when a drain runs continuously; this estate's drain is an
      # operator running cmd/kanz-redrive by hand, so what needs to reach a human is
      # THAT A MESSAGE WAS PARKED AT ALL. The count of what is waiting is a question
      # for the person already responding.
      - name: bus_dead_letters
        rules:
          # THRESHOLD ZERO, BECAUSE PARKING ACKS THE ONLY COPY.
          #
          # Consumer.publishDLQ parks and then ACKS the original delivery, so after
          # this counter moves the message exists in exactly one place: the
          # `dlq.>` stream, which is 720h of retention that nothing subscribes to.
          # Nothing brings it back automatically — recovery is a human running
          # cmd/kanz-redrive. There is no rate at which that becomes routine, and no
          # volume below which it is safe to not know.
          #
          # TRANSIENT SPECIFICALLY, AND THAT IS WHY IT IS CRITICAL RATHER THAN A
          # TICKET. `transient` is pkg/bus's classification for a failure about the
          # WORLD, not the message: a Postgres failover, a NATS reconnect, a venue
          # gate timeout. Retry is MaxAttempts=1 estate-wide and deliberately so
          # (test/arch/bus_dlq_test.go), which means a 200ms infrastructure blip is
          # sufficient to park a capital-path command the client already holds a 202
          # for. So a transient park is not a backlog item — it is evidence of an
          # infrastructure failure that is probably still happening, and the parked
          # message is the receipt.
          #
          # for: 0m, and a 15m increase() window: identical shape and identical
          # reasoning to OMSOrdersQuarantined below. The loss has already happened;
          # a `for:` would only delay the page, while the window holds the alert up
          # long enough to be seen and grouped.
          #
          # by (subject, group): a park is attributable to one consumer group on one
          # subject, and that pair is what the responder types into kanz-redrive.
          # Summing them away would produce one alert saying "something parked".
          - alert: BusMessagesDeadLettered
            expr: sum by (subject, group) (increase(kanz_bus_dlq_parked_total{class="transient"}[15m])) > 0
            for: 0m
            labels: { severity: critical, layer: operational }
            annotations:
              summary: "{{ $labels.group }} parked a message from {{ $labels.subject }} — it is on the DLQ and nothing will bring it back"
              description: "A delivery failed for a reason pkg/bus classified as TRANSIENT (infrastructure, not the message) and was parked on dlq.{{ $labels.subject }}. Parking acks the original, so the DLQ copy is the only copy, and nothing subscribes to dlq.> — it will sit there for the stream's 720h retention until an operator runs kanz-redrive. Transient means whatever broke was probably still broken when this fired: find that first, then redrive. On order.> this is a client-acknowledged order that never reached the OMS."

          # TERMINAL IS A DIFFERENT INCIDENT AND MUST NOT SHARE A RULE.
          #
          # `terminal` means the failure was about the BYTES — unframeable, an
          # envelope that fails validation, a handler panic. A redrive REFUSES these
          # by design (see bus.IsTerminal): re-running a deterministic defect against
          # the same bytes parks them again. So unlike the rule above, there is no
          # operator action that recovers the event, and paging at 03:00 buys nothing
          # — the fix is a producer change or a handler fix, and it ships in a
          # deploy.
          #
          # WARNING, AND NOT BECAUSE IT IS MINOR: the event is permanently lost,
          # which is worse than a transient park. It is a warning because the
          # RESPONSE is a working-hours code change, and a page for something a
          # responder cannot act on at night is how an alerting layer gets muted.
          #
          # 1h window with for: 0m, matching ComplianceUngovernedOrders: exactly one
          # firing period per hour in which it happened. The usual cause is a
          # producer whose payload shape changed, so the first occurrence and the ten
          # thousandth have the same cause and the same fix — a `for:` would only
          # delay a ticket that is already about something unrecoverable.
          - alert: BusTerminalMessagesDeadLettered
            expr: sum by (subject, group) (increase(kanz_bus_dlq_parked_total{class="terminal"}[1h])) > 0
            for: 0m
            labels: { severity: warning, layer: operational }
            annotations:
              summary: "{{ $labels.group }} parked an UNPROCESSABLE message from {{ $labels.subject }} — a redrive will refuse it"
              description: "A delivery failed in a way pkg/bus classified as TERMINAL: unframeable bytes, an envelope that failed validation, or a handler panic. kanz-redrive refuses these deliberately, because re-running a deterministic defect against the same bytes parks them again — so this event is LOST, and no operator action recovers it. Read Kanz-DLQ-Error on the parked message. The usual cause is a producer whose payload shape changed, in which case every message of that type is being lost too; if the cause is a panic, the handler is also crashing on live traffic."

          # -----------------------------------------------------------------------
          # THE ARCHIVER'S DLQ IS A DIFFERENT TRANSPORT AND HAD NO RULE AT ALL (#285).
          #
          # The two rules above are over kanz_bus_dlq_parked_total, which pkg/bus
          # increments on the NATS path. The archiver does not use it: it parks to
          # the KAFKA topic dlq.archiver and counts on kanz_archiver_failed_total,
          # a metric no rule in this file reads.
          #
          # WHY THE TWO EXISTING ARCHIVER RULES CANNOT COVER THIS, WHICH IS THE
          # WHOLE REASON THESE ARE NEEDED. ArchiverNotArchivingWithBacklog and
          # ArchiverBacklogGrowing both key on kanz_archiver_pending_messages — the
          # DEPTH of the durable consumer's queue. deadLetter() parks and then ACKS
          # (services/archiver/internal/archive/archiver.go), so a park makes the
          # backlog go DOWN. An archiver parking every single event it receives
          # drains its queue promptly and keeps a pending count of zero: to both
          # rules above, and to every ratio in slo.alerts.rules.yaml, that is
          # indistinguishable from an archiver doing its job perfectly. The failure
          # this file exists to catch — healthy-looking silence — is the exact shape
          # of the archiver's own worst outcome.
          #
          # AND IT IS WORSE HERE THAN ON THE NATS PATH. kanz-redrive is NATS-only
          # (`grep -in kafka cmd/kanz-redrive/main.go` → nothing), so where
          # BusTerminalMessagesDeadLettered can at least say "a redrive will refuse
          # it", here there is no tool that could even refuse. infra/kafka/topics-job.yaml
          # declares dlq.archiver with `delete` retention at 2592000000ms — 30 days
          # — and says in its own comment that those 30 days are "the window in
          # which a HUMAN can extract a parked event". #285 wrote that window down.
          # Nothing told the human the clock had started. That is what these fix.
          #
          # DELIBERATELY NOT ALERTED: reason="publish". That is the real-topic Kafka
          # produce failing, which is TRANSIENT and NACKed — the event stays on the
          # spine, the backlog grows, and ArchiverNotArchivingWithBacklog above owns
          # it. Adding a rule here would page twice for one incident.
          #
          # NO topic LABEL IN ANY by() BELOW, and that is not an oversight:
          # observeFail's own comment says topic "may be ''" for unframe/route
          # because both fail BEFORE a topic is known, so every series these rules
          # match carries topic="". Grouping by a label that is always empty splits
          # nothing and puts an empty string in the summary.

          # AT LEAST ONE EVENT HAS LEFT THE LOG OF RECORD, AND THE 30-DAY CLOCK IS RUNNING.
          #
          # Threshold zero for the same reason BusMessagesDeadLettered uses zero:
          # the park acked the only live copy. The archiver exists BECAUSE NATS
          # streams age out (24h on MARKET/RISK/EXECUTION, 168h on
          # ACCOUNTING/COMPLIANCE/SETTLEMENT) — so once that happens, the copy on
          # dlq.archiver is the only one anywhere, and it is on a topic with a
          # delete policy and nothing subscribed.
          #
          # WARNING, NOT CRITICAL, AND NOT BECAUSE IT IS MINOR — this is permanent
          # loss from the durable log. It is a warning for the same reason
          # BusTerminalMessagesDeadLettered is: both park reasons are ClassTerminal
          # by a decision deadLetter() argues explicitly ("nothing in the WORLD
          # changes to make either succeed"), so there is no 03:00 action. The
          # response is a producer fix or a topic mapping, and it ships in a deploy.
          # A page a responder cannot act on is how this file gets muted.
          #
          # 1h window, for: 0m — the shape BusTerminalMessagesDeadLettered uses and
          # for its reasoning: the loss already happened, so a `for:` only delays a
          # ticket. The window is what holds the alert up long enough to be grouped.
          # Note the mismatch worth knowing: the alert repeats hourly while the
          # evidence expires in 30 days. If this is still open on day 29 the event
          # is about to be deleted, which is why the description leads with that.
          - alert: ArchiverParkedAnEventWithNoDrain
            expr: sum by (reason) (increase(kanz_archiver_failed_total{reason=~"unframe|route"}[1h])) > 0
            for: 0m
            labels: { severity: warning, layer: operational }
            annotations:
              summary: "The archiver parked an event ({{ $labels.reason }}) on dlq.archiver — nothing drains it and it is deleted in 30 days"
              description: "An event never reached the Kafka log of record: reason={{ $labels.reason }} (unframe = the body never decoded; route = its event_type/tenant maps to no topic). The archiver parked it on dlq.archiver and ACKED the original, so the parked copy becomes the only copy once its NATS stream ages out — 24h on MARKET/RISK/EXECUTION, 168h on ACCOUNTING/COMPLIANCE/SETTLEMENT. dlq.archiver has a 30-day delete retention and NO consumer, and kanz-redrive is NATS-only, so recovery means a human reading the topic by hand inside that window (#285). Note the backlog alerts CANNOT see this: parking acks, so pending stays at zero. Read Kanz-DLQ-Error and Kanz-DLQ-Original-Subject on the parked message."

          # AN ENTIRE EVENT CLASS IS BEING DROPPED RIGHT NOW, AND THIS ONE IS FIXABLE NOW.
          #
          # Split from the rule above because the RESPONSE differs, which is this
          # file's stated reason for splitting terminal from transient. "route"
          # means topic.For found no mapping for an event_type/tenant pair. That is
          # this archiver's static configuration, not the bytes — so unlike
          # "unframe", a human CAN end the loss immediately by adding the mapping,
          # and every event of that type is being lost until they do. #285: "a
          # routing table that does not know a subject is a configuration error, and
          # configuration errors arrive in batches rather than singly."
          #
          # NO COUNT THRESHOLD, DELIBERATELY. The obvious rule is "more than N per
          # window", but N here could only be invented: one route failure and ten
          # thousand have the identical cause (a missing mapping) and the identical
          # fix, so magnitude does not separate an incident from a one-off. What
          # separates them is PERSISTENCE — a mapping that is still missing fifteen
          # minutes later is a live configuration gap, while a single event from a
          # decommissioned producer is not. So the rule is a rate over zero held for
          # 15m, per this file's own instruction to write the rule without a number
          # rather than invent one.
          #
          # OVERLAPS ArchiverParkedAnEventWithNoDrain ON PURPOSE, the same way
          # ArchiverBacklogGrowing and ArchiverNotArchivingWithBacklog overlap: two
          # alerts, two severities, two different things to do. The test harness
          # asserts a lone unframe park does NOT fire this one.
          - alert: ArchiverRoutingTableRejectingEvents
            expr: sum(rate(kanz_archiver_failed_total{reason="route"}[15m])) > 0
            for: 15m
            labels: { severity: critical, layer: operational }
            annotations:
              summary: "The archiver has been unable to route events to a Kafka topic for 15 minutes — every event of that type is being lost"
              description: "kanz_archiver_failed_total{reason=\"route\"} has been rising continuously for 15 minutes: topic.For is finding no mapping for some event_type/tenant pair, so those events are being parked on dlq.archiver instead of written to the log of record, and they keep coming. Unlike an unframeable body this is CONFIGURATION and you can stop the loss now — add the missing mapping to the archiver's topic table and redeploy. The usual causes are a producer shipping a new event_type ahead of its topic mapping, or a tenant onboarded without one. Events already parked are NOT recovered by the fix: dlq.archiver has no drain and a 30-day delete retention (#285)."

          # THE EVENT REACHED NEITHER ITS TOPIC NOR THE DLQ — the archiver's own
          # metrics.go calls this "the most severe outcome".
          #
          # deadLetter() returns an error and NACKs when the DLQ produce fails,
          # precisely so an event is never acked having landed nowhere. That is the
          # correct behaviour and it is why this is survivable — but it means the
          # delivery loop is now cycling a message it cannot place, indefinitely.
          #
          # WHY THE BACKLOG ALERTS DO NOT ALREADY COVER IT. The tempting assumption
          # is that Kafka being unreachable fails "publish" too, growing the backlog
          # until ArchiverNotArchivingWithBacklog fires. dlq.archiver is a SEPARATE
          # topic with its own 3 partitions (infra/kafka/topics-job.yaml), so it can
          # be unavailable on its own — a lost partition leader, or the topics-job
          # never having created it in a fresh environment. In that case the real
          # topic keeps flowing, archived_total keeps rising, pending stays flat,
          # and every other rule in this file stays silent while unframeable events
          # cycle forever. That combination is the specific hole this closes.
          #
          # 10m, shorter than the 15m above: a broker blip that resolves itself
          # needs no page, but this one IS actionable at 03:00 (a Kafka topic is
          # unavailable) — unlike the two rules above, where the fix ships in a
          # deploy. Sustained past ten minutes it is not a blip.
          - alert: ArchiverDeadLetterProduceFailing
            expr: sum(rate(kanz_archiver_failed_total{reason="dlq_publish"}[15m])) > 0
            for: 10m
            labels: { severity: critical, layer: operational }
            annotations:
              summary: "The archiver cannot write to dlq.archiver — events are reaching neither their topic nor the DLQ"
              description: "The DLQ produce itself is failing on top of an unframe or route failure, so these events have landed NOWHERE — services/archiver/internal/archive/metrics.go calls this the most severe outcome. deadLetter() NACKs rather than acking, which is correct and means nothing is lost yet, but the consumer is now cycling messages it cannot place. dlq.archiver is a separate 3-partition topic, so check IT specifically before assuming a broad Kafka outage: a lost partition leader, or the topics-job never having run in this environment, takes it down while the real topics keep flowing — in which case no other alert here will fire."

      # ---------------------------------------------------------------------------
      # OMS — positions whose truth nobody knows
      # ---------------------------------------------------------------------------
      - name: oms_execution_integrity
        rules:
          # THRESHOLD ZERO, AND NOT AS A JUDGEMENT CALL. The Help text on this
          # counter states the contract: "This should be zero; any non-zero value is
          # an incident, not a metric to trend." A quarantine is an order the
          # platform froze because it could not establish what the venue did with it
          # — a position whose true size nobody knows, which "will not be re-driven,
          # cancelled or mentioned again until a human resolves it". There is no
          # tolerable rate of those.
          #
          # for: 0m: the order is already frozen. Waiting adds nothing but delay.
          # increase() over 15m holds the alert long enough to be seen and grouped.
          - alert: OMSOrdersQuarantined
            expr: sum(increase(kanz_oms_orders_quarantined_total[15m])) > 0
            for: 0m
            labels: { severity: critical, layer: operational }
            annotations:
              summary: "The OMS has quarantined an order — a position of unknown size is frozen"
              description: "The platform could not establish what the venue did with an order: the venue denied one it had acknowledged, could not be queried, or reported a fill the order cannot accept. The order is frozen and will NOT be re-driven, cancelled or mentioned again until a human resolves it, while the position may be live at the exchange. Reconcile against the venue before the next session."

          # ALSO ZERO, ALSO FROM THE CODE'S OWN CONTRACT: "Non-zero means a venue
          # call is hanging and somebody's withdrawal did not land; it should be
          # zero." Each timeout is an operator's cancel or amend that went to the DLQ
          # instead of being applied — to an order that is still working at an
          # exchange. That is the worst combination available: the human believes
          # they cancelled, and the order is live.
          - alert: OMSClaimTimeouts
            expr: sum(increase(kanz_oms_claim_timeouts_total[15m])) > 0
            for: 0m
            labels: { severity: critical, layer: operational }
            annotations:
              summary: "An OMS cancel or amend was abandoned — the instruction went to the DLQ, the order is still live"
              description: "A cancel or amend gave up waiting for the goroutine working its order and was dead-lettered, while the order itself is still working at a venue. The usual cause is a venue call that is not returning. Somebody asked to withdraw an order and it did not happen. Check venue adapter latency, then re-issue the instruction."

          # ZERO AGAIN, AND FOR THE SHARPEST REASON OF THE THREE. This counter only
          # moves when a compensator finds an order the store committed and the bus
          # never heard about (#238): admission is store.Create followed by
          # EmitAccepted with no outbox between them, so a failed publish leaves a
          # durable order that risk carries no exposure for, that compliance's book
          # excludes, and that the audit log has no record of. The projection is
          # worse than blind — tv-sync ignores every LATER fact about the order too,
          # because it never admitted it.
          #
          # The increment says the repair HAPPENED, which means the gap happened
          # first. Nothing else records the gap: the store shows a finished order and
          # the bus shows a late FACT, and neither says the fund was mispriced in
          # between. If this fires, find out what the publish path was doing then —
          # the fix is a transactional outbox, and this alert is what says it is
          # still needed.
          - alert: OMSAcceptedFactLostAndRecovered
            expr: sum(increase(kanz_oms_orders_accepted_reannounced_total[15m])) > 0
            for: 0m
            labels: { severity: critical, layer: operational }
            annotations:
              summary: "An OMS order was committed without its ORDER_ACCEPTED FACT — risk was short one order until a sweep repaired it"
              description: "The OMS committed an order to Postgres and its ORDER_ACCEPTED FACT never reached the bus, so for the interval before the compensating sweep ran, no downstream service knew the order existed: risk carried no exposure, compliance's book excluded it, and the audit log had no record. The order has been re-announced, but the gap was real and every calculation made during it was wrong. Investigate the broker or the publish path at the time of the increment."

          # A COMPENSATOR THAT IS NOT COMPENSATING LOOKS EXACTLY LIKE NO DEFECT.
          #
          # The periodic sweep deliberately does NOT kill the pod when it fails —
          # terminating a process that is holding live orders at venues is worse than
          # the unreconciled order it would be reacting to — so a failing sweep is
          # silent everywhere except here and one ERROR log. Sustained failures mean
          # the only remaining compensator is the next restart, which is the state
          # #238 exists to end.
          #
          # for: 15m, not 0m: one failed pass is a blip the next tick retries, and
          # the ticker's default interval is 60s, so 15m is fifteen consecutive
          # chances to succeed.
          - alert: OMSSweepFailing
            expr: sum(increase(kanz_oms_sweep_failures_total[15m])) > 0
            for: 15m
            labels: { severity: warning, layer: operational }
            annotations:
              summary: "The OMS periodic reconciliation has been failing — orders left mid-flight are not being recovered"
              description: "The OMS's periodic in-flight reconciliation has failed on every pass for fifteen minutes. It is the compensator for an order committed without its FACT and for an order stranded mid-flight by a crash; while it fails, the only remaining recovery is the next pod restart. The pod keeps admitting new orders throughout. Check the order store's reachability and the ERROR log line beside this counter for the order it stopped on."

          # THE PRICE FEED, SEEN FROM THE FOLD RATHER THAN FROM THE REFUSALS.
          #
          # ComplianceUnpricedOrdersExpired below only fires when an order ARRIVES,
          # so at 03:00 with no order flow a dead feed is silent until the first
          # order of the morning is refused. This one is independent of order flow.
          #
          # The condition is quoted from the metric author's own Help text: "A fall
          # here with held flat is a stalling feed." live counts instruments whose
          # mark is present and within OMS_PRICE_MAX_AGE; held counts everything the
          # fold has ever seen, including expired tombstones. live == 0 while held > 0
          # is a process that HAD prices and now has none — not a cold start, which
          # has both at zero.
          #
          # by (namespace, pod): the fold is per-process, so a single bad replica
          # must not be masked by a healthy one. Both sides are aggregated to the
          # SAME label set on purpose — an `and` between a bare gauge and another
          # bare gauge never matches, because __name__ differs.
          #
          # for: 10m = twenty times OMS_PRICE_MAX_AGE's 30s default. Long enough that
          # a feed reconnect or a market-data rollout cannot trip it, short enough
          # that it precedes the first refused order of a trading session.
          - alert: OMSPriceFeedStalled
            expr: |
              (
                max by (namespace, pod) (kanz_oms_mark_instruments_live) == 0
                and
                max by (namespace, pod) (kanz_oms_mark_instruments_held) > 0
              )
            for: 10m
            labels: { severity: critical, layer: operational }
            annotations:
              summary: "OMS {{ $labels.pod }} holds no live reference mark — the price feed has stalled"
              description: "Every reference mark in this OMS replica's fold has aged past OMS_PRICE_MAX_AGE while the fold still holds the instruments, so the price spine WAS reaching this pod and has stopped. The pre-trade gate cannot value an order without a mark: every order this replica receives will be refused PRICE_UNAVAILABLE. Check market-data and this pod's price subscription."


          # A PRICE SPINE THAT NEVER DELIVERED ANYTHING — THE STATE NEITHER MARK RULE
          # CAN SEE (#955).
          #
          # OMSPriceFeedStalled above needs held > 0. OMSQuoteCoverageAbsent below
          # needs mark_instruments_live > 0. Both clauses are there to keep a COLD POD
          # from paging and both are right, and together they leave one reading
          # uncovered: a replica that has held nothing, ever. cmd/oms's
          # registerMarkCoverageGauges already names that state — "both zero is a
          # spine that never covered these instruments (a binding question)" — and
          # until now nothing asked the question.
          #
          # IT IS NOT A HYPOTHETICAL SHAPE. The `acme` account granted its OMS a
          # SUBSCRIBE on market.*.trade and market.*.quote while nothing in that
          # account published a market subject and the account imported none, so
          # oms-acme folded an empty source for the life of the deployment: every
          # MARKET and STOP order refused PRICE_UNAVAILABLE, no arrival price on any
          # order, and this pair of gauges pinned at zero — the exact reading that
          # silenced both neighbouring rules. #955 imported the spine; this is the
          # signal that would have said so, and the one that will say so for the next
          # tenant provisioned without it.
          #
          # THE SERIES EXISTS AT ZERO, AND THE RULE DEPENDS ON THAT. These are
          # GaugeFuncs registered unconditionally at startup, not a CounterVec whose
          # label values appear only once incremented — so a pod that folds nothing
          # still exports kanz_oms_mark_instruments_held 0 and `== 0` matches it. A
          # rule over a series that is ABSENT rather than zero is silent in precisely
          # the state it detects (#62, and OMSExecutionAttributionUndecomposable's
          # comment below), so the harness beside this file EXECUTES the absent case
          # as well as the zero one rather than leaving the dependency written down.
          #
          # for: 1h, AND THE DURATION IS THE WHOLE COLD-START ARGUMENT. A live spine
          # fills the fold within one OMS_PRICE_MAX_AGE (30s), so anything past a few
          # minutes is not warm-up. An hour is longer than a rolling restart, a
          # market-data rollout or a vendor reconnect, and it is the point where "this
          # pod has never seen a price" stops being a timing question and becomes a
          # binding one.
          #
          # CRITICAL, LIKE OMSPriceFeedStalled, BECAUSE THE CONSEQUENCE IS THE SAME
          # ONE: every MARKET and STOP order this replica receives is refused. The
          # difference is that it never worked rather than having stopped working,
          # which is worse — there is no last-known-good to point at and nobody saw it
          # break.
          #
          # by (namespace, pod), because a tenant-dedicated OMS has to be nameable
          # beside a healthy platform one: MT-02 runs both from the same image in the
          # same namespace, and they differ only in which NATS account they land in.
          - alert: OMSPriceSpineNeverFolded
            expr: |
              max by (namespace, pod) (kanz_oms_mark_instruments_held) == 0
            for: 1h
            labels: { severity: critical, layer: operational }
            annotations:
              summary: "OMS {{ $labels.pod }} has never folded a single reference mark"
              description: "This replica's mark fold has held nothing at all for an hour — not a live mark, not an expired one. That is neither a stalled feed (OMSPriceFeedStalled needs a mark to have existed first) nor a warm-up. The pre-trade gate cannot value an order without a mark, so every MARKET and STOP order this pod receives is refused PRICE_UNAVAILABLE and nothing it accepts is stamped with an arrival price. Check the NATS ACCOUNT this pod authenticates into before checking the feed: a per-tenant OMS reaches the price spine through an import from __system__ (infra/nats/tenancy.yaml), and a missing import is an error on neither side — the subscription succeeds and delivers nothing forever. Then check OMS_PRICE_SUBJECTS, and that market-data or market-ingest is publishing at all."

          # A STANDING CONFIGURATION STATE, SO AN ABSOLUTE VALUE — NOT increase().
          #
          # This counter is incremented while venue adapters are REGISTERED, at
          # startup. increase() over any window would be non-zero only in the minutes
          # after a restart and zero for the entire time the misconfiguration is
          # live, which is precisely backwards: the risk is that the deployment KEEPS
          # RUNNING this way. `> 0` on the raw counter is true for as long as the
          # process is up, which is what the condition actually is.
          #
          # for: 30m and warning, not critical, and the reason is the response rather
          # than the severity of the consequence. Nothing about this changes between
          # 03:00 and 09:00 — it has been true since the deploy — and a page for a
          # condition a responder cannot act on at night is how a layer gets muted.
          # It is a ticket that must not be closed: an unverified adapter's fills can
          # margin against a different fund's collateral than the ledger books them
          # to.
          - alert: OMSUnverifiedVenueAccount
            expr: sum(kanz_oms_unverified_venue_account_total) > 0
            for: 30m
            labels: { severity: warning, layer: operational }
            annotations:
              summary: "The OMS is trading venue accounts the exchange has not confirmed"
              description: "One or more venue adapters registered with an exchange account that was never confirmed by the exchange itself — the adapter holds the API credential but has not proved which account it belongs to. Its fills could margin against a different fund's collateral than the ledger books them to, and a mis-declared deployment looks exactly like a correct one. Verify each adapter's account against the exchange, or unbind it."

      # ---------------------------------------------------------------------------
      # EXECUTION-QUALITY MEASUREMENT — can the platform still explain its own costs?
      # ---------------------------------------------------------------------------
      #
      # A SEPARATE GROUP FROM oms_execution_integrity ABOVE, AND THE SPLIT IS THE
      # SEVERITY ARGUMENT. Everything in that group is the capital path: an order
      # frozen, a claim timed out, a feed stall that makes the pre-trade gate refuse.
      # Nothing here stops a trade, refuses an order or misprices a book. What breaks
      # is the platform's ability to say WHY an execution cost what it did — which is
      # a warning and a ticket, never a page, and mixing the two would train a
      # responder to treat the group above as noise.
      #
      # BOTH RULES COMPARE AGAINST ZERO, WHICH IS WHY NEITHER CARRIES A PERCENTAGE.
      # "Alert when more than N% of decompositions fail" is the natural shape and it
      # was rejected: this file's own header requires every threshold to be derived,
      # and any N here could only be invented. What IS derivable is the absolute
      # condition — the fold holds no width at all, or not one decision in an hour
      # could be decomposed — and that is the shape used, the same stance
      # ArchiverNotArchivingWithBacklog takes against a throughput of exactly zero.
      #
      # THE TWO ARE NOT REDUNDANT, and each covers the other's blind spot:
      #
      #   - the GAUGE rule sees a dead quote feed with no order flow at all, which is
      #     the state at 03:00 and on any desk between sessions;
      #   - the COUNTER rule sees widths that are held but unusable at the moments
      #     that actually mattered — stale at release, or crossed — which a gauge
      #     reading a healthy level cannot show.
      - name: execution_quality_measurement
        rules:
          # THE PRICE SPINE CARRIES PRICES AND NO QUOTES (#875).
          #
          # #866 decomposes a decision's implementation shortfall into spread, impact
          # and timing. The spread leg is the half-width of the market quoted when
          # each slice was released, and it exists only if the spine carried a Quote
          # for that instrument: a trade print has no width. Where it is missing the
          # decomposition refuses correctly and publishes quality = TOTAL_ONLY with
          # the three legs UNSET — an exact headline number and no attribution.
          #
          # That refusal is right and it is not what this alerts on. What it alerts
          # on is the refusal being ESTATE-WIDE and nobody knowing: a platform
          # measuring every decision perfectly and one measuring none of them both
          # publish attribution FACTs, and the only thing separating them is this
          # ratio. Under it, an execution-algorithm comparison (#869's VWAP and POV
          # against TWAP) would be run against a benchmark that cannot say why either
          # one won — the exact condition #866 exists to end, one layer down.
          #
          # THE SECOND CLAUSE IS WHAT MAKES IT A DEFECT RATHER THAN A COLD START. A
          # freshly started pod holds neither marks nor widths and must stay silent;
          # mark_instruments_live > 0 says the price spine IS reaching this replica
          # and delivering usable prices, so a width of zero beside it is a statement
          # about the FEED's content, not about warm-up. Same shape and same reason as
          # OMSPriceFeedStalled's held > 0 clause above.
          #
          # by (namespace, pod): the fold is per-process, so a replica subscribed to
          # the wrong subject set must not be masked by a healthy sibling. Both sides
          # aggregate to the SAME label set deliberately — an `and` between two bare
          # gauges never matches, because __name__ differs.
          #
          # for: 15m IS DERIVED FROM THE WIDTH'S OWN LIFETIME. A width is usable for
          # OMS_PRICE_MAX_AGE (30s by default) and is swept at most sweepInterval
          # (30s) later, so one minute bounds how long a live quote feed can leave
          # this at zero. 15m is fifteen consecutive such windows: longer than a
          # rolling restart, a market-data rollout or a vendor reconnect, and short
          # enough to be true before the first order of a session is measured.
          #
          # WARNING, NOT CRITICAL, AND IT NOW HAS A PRODUCER TO NAME. It is not the
          # `absent()` trap alerts/README.md records: that fired forever over a series
          # with no producer and could never be fixed, while this names a real, owned
          # condition that clears the moment any feed publishes a market.*.quote for a
          # traded instrument.
          #
          # UNTIL #876 THERE WAS NO SUCH FEED and this fired on arrival, correctly,
          # because the estate genuinely could not decompose a single execution: both
          # venue adapters poll a last-price ticker and publish market.crypto.trade
          # only. market-ingest now publishes market.crypto.quote from the top of the
          # L2 book it was already folding, so the condition is repairable and the
          # repair is bounded — it covers exactly MARKET_INGEST_INSTRUMENTS, and an
          # instrument the desk trades that is not in that list still has no width.
          - alert: OMSQuoteCoverageAbsent
            expr: |
              (
                max by (namespace, pod) (kanz_oms_quote_instruments_live) == 0
                and
                max by (namespace, pod) (kanz_oms_mark_instruments_live) > 0
              )
            for: 15m
            labels: { severity: warning, layer: operational }
            annotations:
              summary: "OMS {{ $labels.pod }} has prices for every instrument and a quoted width for none"
              description: "This replica's mark fold holds live prices but not one usable bid/ask, so the market's width was never observable. Every execution-cost attribution it publishes will be quality = TOTAL_ONLY: an exact implementation shortfall with the spread, impact and timing legs UNSET, which is correct and is also the whole of what the execution-quality programme can say. Any algorithm comparison built on it can rank outcomes and cannot explain them. This is a market-data question, not an OMS one — check which connectors publish market.*.quote for the instruments this desk trades. market-ingest publishes market.crypto.quote from the top of the book it already folds (#876), so a width exists only for the instruments in MARKET_INGEST_INSTRUMENTS: check that market-ingest is running and that every instrument this desk trades is in its list. Nothing else supplies one - both venue adapters publish trade prints only and the market-data feed is disabled."

          # NOT ONE DECISION IN AN HOUR COULD BE DECOMPOSED (#875).
          #
          # The gauge above is a level and this is the outcome, and they fail
          # independently. A fold can hold plenty of live widths while every width
          # that MATTERED — the one at each slice's release — was stale, crossed, or
          # for a different instrument than the one traded. The gauge reads healthy
          # throughout; only the attribution's own verdict shows it.
          #
          # decomposed AND total_only, NOT the other outcomes. no_arrival_mark and
          # no_fills mean there was nothing to measure — a price-spine gap or an order
          # that never traded — and the counter's Help says so. Those have a different
          # owner, so folding them in here would make the rule fire for a reason its
          # description does not name.
          #
          # THIS RULE ONLY WORKS BECAUSE THE COUNTER IS SEEDED AT ZERO, and that is a
          # property of cmd/oms rather than of this file. A CounterVec exports NO
          # series for a label value never incremented, so on the estate this was
          # written for — where nothing is ever decomposed — the second clause would
          # compare against an EMPTY VECTOR, the `and` would never match, and the rule
          # would be silent in exactly the state it detects. That is #62's defect
          # reached from the other direction. executionAttributionCounter seeds every
          # order.AttributionOutcomes value, cmd/oms's TestEveryAttributionOutcomeIsSeededAtZero
          # holds it, and the harness beside this file executes the silent case so the
          # dependency is not merely written down.
          #
          # sum() WITHOUT by: the question is estate-level. Decisions are spread
          # across replicas, so one pod that decomposed nothing is not a finding while
          # another is working — and bare sum() on both sides leaves both with the
          # empty label set, which is what lets the `and` match at all.
          #
          # THRESHOLDS ARE ZERO ON BOTH SIDES. increase(total_only[1h]) > 0 says
          # decisions ARE terminating and being measured, so the estate is not merely
          # idle; increase(decomposed[1h]) == 0 says not one of them yielded a
          # spread/impact/timing split. for: 30m on top means the condition held
          # across at least half an hour of evaluations, so a single quiet hour after
          # a restart cannot produce it.
          - alert: OMSExecutionAttributionUndecomposable
            expr: |
              (
                sum(increase(kanz_oms_execution_attributions_total{outcome="total_only"}[1h])) > 0
                and
                sum(increase(kanz_oms_execution_attributions_total{outcome="decomposed"}[1h])) == 0
              )
            for: 30m
            labels: { severity: warning, layer: operational }
            annotations:
              summary: "Every execution attribution in the last hour was a total, and none was decomposed"
              description: "Terminal decisions ARE being measured — the shortfall against arrival is exact for each — but not one in the last hour could be split into spread, impact and timing, because the market's width was unobservable for at least one slice that traded. The platform can say what its executions cost and cannot say why any of them cost it. Check kanz_oms_quote_instruments_live first: zero means the spine carries no quotes at all (see OMSQuoteCoverageAbsent). Non-zero means widths exist but are stale or crossed at the moments slices are released, which is a feed-latency or feed-quality problem rather than a coverage one."

      # ---------------------------------------------------------------------------
      # COMPLIANCE — how much of the book is trading unchecked
      # ---------------------------------------------------------------------------
      - name: compliance_coverage
        rules:
          # A TICKET, ON PURPOSE, AND WITH A ONE-HOUR WINDOW RATHER THAN A `for:`.
          #
          # The default posture is MANDATE ADVISORY (OMS_REQUIRE_MANDATE unset), under
          # which an order for a portfolio no mandate governs is ADMITTED and
          # unconstrained. An estate mid-onboarding will produce these sporadically —
          # one order every few hours — so a short window plus a `for:` would flap in
          # and out and a `> 0` page would be constant. increase() over 1h with
          # for: 0m gives exactly one firing period per hour in which it happened,
          # which is the right cadence for something fixed by putting a portfolio
          # under mandate during business hours.
          #
          # Warning rather than critical for the same reason, NOT because it is
          # minor: it is the difference between "we forgot to mandate fund X" and
          # "fund X passed compliance", which used to be the same observable event.
          - alert: ComplianceUngovernedOrders
            expr: sum(increase(kanz_compliance_ungoverned_orders_total[1h])) > 0
            for: 0m
            labels: { severity: warning, layer: operational }
            annotations:
              summary: "Orders are being handled for portfolios that NO mandate governs"
              description: "Part of the book is trading with no compliance constraints (or, with OMS_REQUIRE_MANDATE=true, is being refused for want of a mandate). Which of those two it is depends on the posture logged at OMS startup. Put every live portfolio under mandate with kanz-mandate; this counter is how much of the book is currently ungoverned."

          # THE `reason` LABEL SPLITS ONE COUNTER INTO TWO INCIDENTS, AND THE CODE
          # SAYS WHICH IS WHICH: "never_seen" is a cold pod, a thin instrument or a
          # subscription delivering nothing (a warm-up); "expired" is a feed that WAS
          # reporting and has stalled (an outage). Alerting on the sum would give one
          # rule that is either too noisy for the outage or too slow for it.
          #
          # EXPIRED IS A LIVE TRADING OUTAGE: orders are being REFUSED, and the
          # client sees the refusal. Critical.
          #
          # 5m window with for: 10m, not a 10m window with for: 0m. The two are not
          # the same: a 10m window stays true for ten minutes after a SINGLE refusal,
          # so it would page on one stale mark during a feed reconnect. A 5m window
          # held for 10m requires refusals to keep occurring in every window across
          # ten minutes — sustained, which is what an outage looks like and a
          # reconnect does not.
          - alert: ComplianceUnpricedOrdersExpired
            expr: sum(rate(kanz_compliance_unpriced_orders_total{reason="expired"}[5m])) > 0
            for: 10m
            labels: { severity: critical, layer: operational }
            annotations:
              summary: "Orders are being refused because the price feed has stalled"
              description: "The OMS is refusing orders PRICE_UNAVAILABLE against instruments whose reference mark it HAS seen and which has since aged past OMS_PRICE_MAX_AGE — the feed was working and stopped. This is client-visible: those orders did not reach a venue. Check market-data and the OMS price subscription. OMSPriceFeedStalled fires on the same cause without needing order flow."

          # NEVER_SEEN, THE WARM-UP CASE — same counter, different incident.
          #
          # A cold pod warms in seconds and a rollout in a minute or two, so a short
          # duration here would page on every deploy. Thirty unbroken minutes of
          # refusals for instruments no mark has EVER arrived for is not a warm-up:
          # it is a price subscription delivering nothing, or an instrument nothing
          # in the estate quotes. Ticket, because the fix is a subscription or a
          # universe change, not a 3am intervention.
          - alert: ComplianceUnpricedOrdersNeverSeen
            expr: sum(rate(kanz_compliance_unpriced_orders_total{reason="never_seen"}[5m])) > 0
            for: 30m
            labels: { severity: warning, layer: operational }
            annotations:
              summary: "Orders are being refused for instruments no price has ever arrived for"
              description: "For half an hour the OMS has refused orders PRICE_UNAVAILABLE against instruments it has NEVER received a mark for. Past the warm-up window this means a price subscription delivering nothing for those instruments, or a trading universe wider than the market-data subscription. Compare OMS_PRICE_SUBJECTS against what market-data publishes."

      # ---------------------------------------------------------------------------
      # GATEWAY — the platform's front door, shedding
      # ---------------------------------------------------------------------------
      - name: gateway_admission
        rules:
          # DELIBERATELY COMPLEMENTARY TO THE SLO BURN-RATE ALERTS, NOT A DUPLICATE.
          #
          # Admission rejection is a 503, so it already burns the api-gateway
          # availability budget and SLOFastBurn pages when the VOLUME is large enough
          # (>14.4× of a 0.1% budget). What that cannot see is a small, permanent
          # shed: one tenant rejected steadily at a rate that never troubles a
          # platform-wide ratio. Burn rate covers magnitude; this covers PERSISTENCE.
          #
          # 5m window held for 10m: rejections in every window across ten minutes.
          # Shedding for a few seconds during a burst is admission control working as
          # designed and must not page — ten unbroken minutes is capacity, and that
          # tenant is being refused service.
          #
          # Warning: the response is a quota or a replica count, in working hours.
          - alert: GatewayAdmissionShedding
            expr: sum by (tenant) (rate(kanz_gateway_admission_rejected_total[5m])) > 0
            for: 10m
            labels: { severity: warning, layer: operational }
            annotations:
              summary: "The gateway has been shedding requests for tenant {{ $labels.tenant }} for 10 minutes"
              description: "Per-tenant in-flight admission has been returning 503 continuously for ten minutes, so this is saturation rather than a burst. Either the tenant's in-flight limit is too low for their traffic or the upstream they hit is slow enough to hold slots open. Check kanz_gateway_inflight_requests and upstream latency for the same tenant."

          # RATE LIMITING IS BY DESIGN, SO THE THRESHOLD IS DURATION, NOT MAGNITUDE.
          #
          # A tenant hitting their quota during a burst is the quota doing its job
          # and is not an incident at any volume — which is why there is no rate
          # threshold here. What IS an incident is a tenant who cannot get out of it:
          # half an hour of continuous 429s means either the quota is mis-sized for
          # what they bought or a client is in a retry loop. Both need a human, and
          # neither needs one at night.
          - alert: GatewayTenantRateLimitedSustained
            expr: sum by (tenant) (rate(kanz_gateway_rate_limited_total[5m])) > 0
            for: 30m
            labels: { severity: warning, layer: operational }
            annotations:
              summary: "Tenant {{ $labels.tenant }} has been rate limited continuously for 30 minutes"
              description: "Every 5-minute window for the last half hour has contained 429s for this tenant. A burst is expected and fine; half an hour is a quota mis-sized for the tenant's entitlement, or a client stuck in a retry loop. Confirm which before raising the limit."

      # ---------------------------------------------------------------------------
      # GATEWAY IDENTITY — the front door is authenticating on keys it cannot check
      # ---------------------------------------------------------------------------
      - name: gateway_identity
        rules:
          # THE OTHER HALF OF #242'S TRADE, AND THE REASON THAT TRADE IS DEFENSIBLE.
          #
          # pkg/auth deliberately keeps verifying tokens for a bounded 15-minute
          # grace past MaxKeyAge when the IdP cannot be reached, rather than turning
          # a provider blip into an authentication outage on the platform's sole
          # ingress for orders. That WIDENS THE REVOCATION WINDOW FROM 5 MINUTES TO
          # 20 — a key revoked at the provider keeps verifying here for up to twenty
          # minutes after the last successful JWKS fetch. Buying that on purpose is
          # only honest if the estate can see when it is being spent, which is this
          # rule. Delete it and the widening becomes a silent one.
          #
          # A DEADLINE, NOT A TREND, WHICH IS WHY THE THRESHOLD IS ONE AND THE
          # SEVERITY IS CRITICAL. This does not describe degraded performance. It
          # says: in at most fifteen minutes from when it started, EVERY request to
          # this gateway begins failing 503 — no orders, no cancels, no queries —
          # and it will not self-heal, because the thing that would clear it is the
          # IdP coming back. There is nothing to trend and no volume at which it
          # becomes interesting.
          #
          # for: 2m, and the number comes from the window it is racing. The grace is
          # 15 minutes; scrape_interval is 30s. Two minutes rides out a single
          # failed refetch during an IdP rolling restart (the common false positive)
          # while still leaving thirteen of the fifteen minutes to act in. A longer
          # hold would spend the deadline it exists to announce.
          #
          # NO absent() PARTNER, DELIBERATELY. The gauge is registered only on the
          # OIDC arm — the dev HS256 validator has no provider to lose — so a gateway
          # running HS256 exports no series and this stays quiet, which is the truth.
          # An absent() rule would fire permanently on every dev rig, which is
          # exactly the DataQualityMetricsMissing anti-pattern alerts/README.md
          # records deleting.
          #
          # by (namespace, pod): the key cache is per-process. One replica that has
          # lost its IdP path while its siblings are fine is still a real fault and
          # must not be averaged away — and it is the shape that says which pod.
          - alert: GatewayOIDCKeysUnrevalidated
            expr: max by (namespace, pod) (kanz_gateway_oidc_keys_unrevalidated) == 1
            for: 2m
            labels: { severity: critical, layer: operational }
            annotations:
              summary: "Gateway {{ $labels.pod }} is authenticating on OIDC keys it cannot revalidate — authentication fails within 15 minutes"
              description: "This gateway's cached JWKS is past MaxKeyAge (5m) and the identity provider could not be refetched, so it is verifying bearer tokens on key material it can no longer vouch for. This is a deliberate, BOUNDED grace: it buys 15 minutes, and then every request to this pod fails 503 (ErrKeysStale) until the provider answers — no orders, no cancels, no queries. It also means a key REVOKED at the provider is still being honoured here, for up to 20 minutes from the last successful fetch. Restore reachability to the IdP's JWKS endpoint (check egress, DNS and the provider itself); the gauge clears by itself on the first successful refetch."

      # ---------------------------------------------------------------------------
      # LAKEHOUSE — rows that will never land
      # ---------------------------------------------------------------------------
      - name: lakehouse_ingest
        rules:
          # PERMANENT MEANS PERMANENT. services/lake-sink/internal/cdc/sink.go
          # classifies a decode failure as "transient" (retryable) or "permanent",
          # and a permanent one is a row that will NEVER land in the lakehouse. It is
          # almost always a producer that changed a payload shape, which means every
          # subsequent row of that type is also being lost — the first occurrence and
          # the ten thousandth have the same cause and the same fix, so the threshold
          # is the first one.
          #
          # for: 0m with a 15m window, matching the OMS incident counters: the loss
          # has already happened and waiting cannot un-happen it.
          #
          # Critical despite the lakehouse being off the capital path, because the
          # loss is SILENT and UNRECOVERABLE without a replay from Kafka — and a
          # replay is only possible while the source topic still retains the rows.
          - alert: LakeSinkPermanentDecodeErrors
            expr: sum(increase(kanz_lake_sink_decode_errors_total{result="permanent"}[15m])) > 0
            for: 0m
            labels: { severity: critical, layer: operational }
            annotations:
              summary: "lake-sink is permanently dropping rows it cannot decode"
              description: "A payload failed to decode in a way lake-sink classified as PERMANENT, so the row will never land in the lakehouse and no retry will recover it. The usual cause is a producer whose payload shape changed, in which case every row of that type is being lost too. Identify the schema change and replay from Kafka while the source topic still retains the rows."

          # A TRANSIENT ERROR THAT IS STILL HAPPENING AFTER HALF AN HOUR IS NOT
          # TRANSIENT — that is the entire justification for the duration, and there
          # is no magnitude threshold for the same reason as the rate-limit rule:
          # retryable failures at any rate are fine while they are actually being
          # retried away.
          #
          # 5m window held for 30m, so it requires errors in every window rather than
          # one burst thirty minutes ago.
          - alert: LakeSinkTransientDecodeErrorsPersisting
            expr: sum(rate(kanz_lake_sink_decode_errors_total{result="transient"}[5m])) > 0
            for: 30m
            labels: { severity: warning, layer: operational }
            annotations:
              summary: "lake-sink transient decode failures have persisted for 30 minutes"
              description: "Decode failures classified as retryable have occurred in every 5-minute window for half an hour, which means they are not being retried away. Left alone they either become a permanent backlog or start consuming the consumer's throughput. Check kanz_lake_sink_rows_total by result for whether anything is landing at all."

      # ---------------------------------------------------------------------------
      # PLATFORM LIVENESS — the workload is not there at all
      # ---------------------------------------------------------------------------
      - name: platform_liveness
        rules:
          # THE OTHER MECHANISM BEHIND A STALLED CONSUMER, AND BusConsumerStalled
          # CANNOT SEE IT. That rule needs the consumer's series to still be
          # scraped; when the pod is gone the series goes stale, rate() over it
          # returns nothing, and the alert quietly stops evaluating. Absence of a
          # target produces absence of an alert — which is the failure mode this
          # whole file exists to remove, so the gap is covered here rather than
          # documented and left.
          #
          # `up` is Prometheus's own per-target series, not a kanz_* metric, so
          # TestEveryObservabilityMetricExistsInSource cannot check this name. That is a
          # real (small) hole in the guard and is noted at its definition.
          #
          # for: 10m: long enough to sit out a rolling update, a node drain and a
          # CrashLoopBackOff's first few restarts. Warning rather than critical
          # because one replica of many being down is not an outage — the SLO
          # burn-rate alerts page when it becomes one.
          - alert: KanzScrapeTargetDown
            expr: up{job="kanz-pods"} == 0
            for: 10m
            labels: { severity: warning, layer: operational }
            annotations:
              summary: "Prometheus cannot scrape {{ $labels.pod }} in {{ $labels.namespace }}"
              description: "This target has failed to scrape for ten minutes — the process is down, wedged, or not serving /metrics on its annotated port. Every alert built on this pod's series is now evaluating against a stale or absent vector and will stop firing rather than start: for the bus consumers in particular, BusConsumerStalled goes SILENT when the pod disappears, so this rule is the one that speaks."

      # ---------------------------------------------------------------------------
      # THE ALERTING PIPELINE ITSELF — is any of the above reaching a human?
      # ---------------------------------------------------------------------------
      - name: alerting_pipeline
        rules:
          # AN ALERT THAT SAYS THE ALERTS GO NOWHERE.
          #
          # Every rule in this file is EVALUATED and DELIVERED NOWHERE, because there
          # is no Alertmanager in this estate (#98 — nothing has anywhere to run and
          # no receiver has a real destination). prometheus.yaml's `alerting:` block
          # discovers one by pod label rather than naming an address, precisely so
          # that this gauge reads the truth: 0 alertmanagers discovered.
          #
          # THIS RULE IS THE POINT OF THAT CHOICE. Without it, a Prometheus with 19
          # rules loaded and a green /-/ready is indistinguishable from a working
          # on-call setup — the operator sees alerts on /alerts, assumes somebody is
          # being paged, and nobody is. The one surface a human actually opens during
          # an incident then has to say so itself.
          #
          # YES, IT FIRES CONTINUOUSLY, AND THAT IS NOT THE absent() ANTI-PATTERN.
          # alerts/README.md records why DataQualityMetricsMissing was deleted: it
          # fired forever over a series with no producer, describing a gap nobody
          # intended to close, and trained its readers to ignore the layer. This one
          # is different in the way that matters — the condition is TRUE, it is
          # ACTIONABLE (deploy an Alertmanager), and it CLEARS BY ITSELF the moment
          # one appears. It is a permanent banner on a permanent defect, and it stops
          # existing when the defect does.
          #
          # WARNING, NOT CRITICAL, AND NOT BECAUSE IT IS MINOR. Severity here routes
          # a page, and there is nothing to page: the receiver this would page
          # through is the thing that is missing. Marking it critical would be a
          # claim about delivery that this rule exists to deny.
          #
          # for: 15m absorbs an Alertmanager rollout — a Recreate or a node drain
          # takes the pod away for a minute or two, and a delivery gap that short is
          # not worth a permanent alert appearing and disappearing.
          #
          # prometheus_notifications_alertmanagers_discovered is Prometheus's own
          # series, not a kanz_* one, so TestEveryObservabilityMetricExistsInSource
          # cannot check the name — the same (small, known) hole as `up` in
          # KanzScrapeTargetDown above. It is verified instead by
          # operational_test.yaml, which fires this rule from a synthetic series, and
          # by having been read off a live Prometheus 3.1.0 /metrics — the exact
          # version and digest this manifest deploys.
          - alert: AlertDeliveryNotDelivering
            expr: prometheus_notifications_alertmanagers_discovered == 0
            for: 15m
            labels: { severity: warning, layer: operational }
            annotations:
              summary: "Prometheus has found NO Alertmanager — every alert on this page is being delivered to nobody"
              description: "Prometheus is evaluating its rules and discovering zero Alertmanagers, so no alert leaves this process: nothing is paged, nothing is ticketed, and every other alert visible here reached a human only because that human happened to look. This is the known state of the estate (#98 — there is nowhere to run one and no receiver has a real destination), NOT a regression. It clears on its own once a pod labelled app=alertmanager exists in kanz-observability; prometheus.yaml discovers it rather than naming an address, so there is no configuration change to remember."

      # ---------------------------------------------------------------------------
      # INFERENCE — the Python prediction service, saturated
      # ---------------------------------------------------------------------------
      - name: inference_admission
        rules:
          # THE ONLY ONE OF THE SEVEN kanz_inference_* SERIES WHOSE THRESHOLD CAN BE
          # DERIVED TODAY (#334), and the rest are deliberately absent for the reason
          # this file opens with.
          #
          # Saturation is a gauge against a CONFIGURED limit, so the number comes
          # from the service's own admission control rather than from an observation
          # nobody has made: at in_flight == admission_limit the pool is full and the
          # next request is rejected, which the service itself records as
          # kanz_inference_degraded_total{reason="pool_saturated"}. Nothing has to be
          # measured to know that 1.0 is the edge — it is where the limit is.
          #
          # THE OTHER SIX CANNOT BE DERIVED AND ARE THEREFORE NOT WRITTEN.
          # predict_seconds needs an observed p99, degraded_total and
          # stream_events_total need a normal rate, and this service has never run
          # under load with these metrics attached. primary_model is an identity
          # gauge, not a threshold. Writing any of them would mean picking a number,
          # which the header above forbids and which the promtool guard would expose
          # as a rule proven to fire only against a fixture built to fit it.
          #
          # DURATION IS THE DEBOUNCE, NOT THE THRESHOLD — the same shape as
          # GatewayAdmissionShedding above. A pool that touches its limit during a
          # burst is admission control working as designed and must not page; ten
          # unbroken minutes at the limit is capacity, and callers are being refused
          # for that whole period.
          #
          # Warning rather than page: the response is a replica count or a limit
          # change, in working hours. An inference outage degrades a prediction path
          # that the platform already treats as advisory — it does not stop trading.
          - alert: InferencePoolSaturated
            expr: kanz_inference_predict_in_flight / kanz_inference_admission_limit >= 1
            for: 10m
            labels: { severity: warning, layer: operational }
            annotations:
              summary: "The inference prediction pool has been at its admission limit for 10 minutes"
              description: "kanz_inference_predict_in_flight has sat at or above kanz_inference_admission_limit continuously for ten minutes, so this is saturation rather than a burst: every request arriving now is refused and counted as kanz_inference_degraded_total{reason=\"pool_saturated\"}. Either the concurrency limit is too low for the offered load or predictions are taking long enough to hold slots open — compare kanz_inference_predict_seconds over the same window before raising the limit, because raising it against slow predictions moves the queue rather than draining it."

      # ===========================================================================
      - name: dr_recoverability
      # ===========================================================================
      # IS THE BACKUP STILL WORKING? Nothing anywhere answered that (#624).
      #
      # infra/dr/postgres/cluster.yaml declares continuous WAL archiving and PITR for
      # six clusters — the order book, the IBOR ledger, the evidence chain, the venue
      # mappings, the schema registry and the platform's own credentials — and states
      # an RPO of <=30s. Every part of that was a DECLARATION. A WAL archive that
      # stopped and a WAL archive that is healthy produced identical signals: none.
      #
      # The kanz-dr-s3 secret is created out of band, by hand, in two regions
      # (infra/dr/postgres/README.md). Rotate that key, delete the bucket, hit a
      # quota or mistype a path and: the primary keeps serving, every readiness probe
      # stays green, all 32 alerts stay quiet, pg_wal grows against a 10-100Gi volume,
      # and the recoverable window silently ages out to nothing. The first signal is a
      # FAILED RESTORE, which is the moment a signal is worthless.
      #
      # KanzScrapeTargetDown cannot cover it, and the reason is worth stating because
      # it is the general trap: that rule is `up{job="kanz-pods"} == 0`. A pod that
      # was never DISCOVERED has no `up` series at all, so it is not down — it is
      # absent, and absence of a target produces absence of an alert. Until the
      # inheritedMetadata annotations in cluster.yaml landed, no Postgres pod entered
      # the job.
      #
      # THE METRIC NAMES BELOW ARE CloudNativePG'S, AND NOTHING IN THIS REPOSITORY
      # CAN CHECK THEM. No CNPG version is pinned anywhere here (cluster.yaml's own
      # header says so), there is no CNPG in the dev rig, and a rule over a
      # misspelled metric compares a threshold against an empty vector and can never
      # fire — which is precisely the defect #62 deleted ten rules for. That is what
      # PostgresBackupTelemetryMissing at the end of this group exists to catch: if
      # this whole family is absent while kanz-data IS being scraped, the alerting
      # layer says so instead of going quiet. Getting the names wrong is survivable;
      # getting them wrong SILENTLY is not.
        rules:
          # THE BASE BACKUP STOPPED. ScheduledBackup runs at 02:00 daily, so a
          # last-available backup older than 26h means at least one run did not
          # happen or did not complete — two hours of slack for a long base backup on
          # the 100Gi cluster plus clock skew.
          #
          # PITR is base backup + replayed WAL. WAL alone restores nothing, so this
          # is the half that decides whether the archive has anything to replay ONTO.
          - alert: PostgresBackupStale
            expr: time() - max by (namespace, pod) (cnpg_collector_last_available_backup_timestamp) > 93600
            for: 30m
            labels: { severity: critical, layer: operational }
            annotations:
              summary: "No completed Postgres base backup for {{ $labels.pod }} in over 26 hours"
              description: "The daily 02:00 ScheduledBackup has not produced a completed base backup for more than 26 hours. Point-in-time recovery is base backup + replayed WAL, so however healthy the WAL archive is, there is an ageing base to replay onto and the recoverable window is now bounded by whatever the last successful backup was. Check the Backup objects (kubectl -n kanz-data get backup), then the kanz-dr-s3 credentials and the bucket — that secret is created out of band and its rotation is invisible to this cluster until a backup tries to use it."

          # BACKUPS ARE FAILING, AS OPPOSED TO MERELY OLD. Distinct from the rule
          # above and fires sooner: a cluster that is ACTIVELY failing its backups is
          # a different, faster-moving fault than one that quietly stopped, and it
          # names itself before the 26h staleness threshold is reached.
          - alert: PostgresBackupFailing
            expr: max by (namespace, pod) (cnpg_collector_last_failed_backup_timestamp) > max by (namespace, pod) (cnpg_collector_last_available_backup_timestamp)
            for: 15m
            labels: { severity: critical, layer: operational }
            annotations:
              summary: "The most recent Postgres backup attempt for {{ $labels.pod }} FAILED"
              description: "The last failed backup is more recent than the last successful one, so the newest thing this cluster tried to do was fail. Every hour this persists is an hour added to the worst-case recovery point. Read the failure from the Backup object's status (kubectl -n kanz-data describe backup) rather than guessing: the common causes are an expired or rotated kanz-dr-s3 key, a bucket policy change, and the object store rejecting on quota."

          # THE RPO KILLER, AND THE ONE WITH NO OTHER SYMPTOM. archive_command
          # failures do not stop the database — Postgres retries, and pg_wal grows.
          # The declared RPO of <=30s rests entirely on the archive succeeding, so a
          # rising failure count means the true RPO is now "since the archive last
          # worked" while every dashboard still shows a healthy primary.
          #
          # increase() over 15m rather than a rate threshold: ANY sustained archive
          # failure is actionable, and the number of failures says nothing extra.
          - alert: PostgresWALArchiveFailing
            expr: increase(cnpg_pg_stat_archiver_failed_count[15m]) > 0
            for: 15m
            labels: { severity: critical, layer: operational }
            annotations:
              summary: "Postgres WAL archiving is failing on {{ $labels.pod }} — the RPO is no longer bounded"
              description: "pg_stat_archiver reports failed archive attempts over the last 15 minutes and has kept reporting them. cluster.yaml claims archive_timeout=30s bounds the object-store RPO to <=30s; that claim is void while this fires, and the real recovery point is the last WAL segment that reached the bucket. Postgres does NOT stop when archiving fails — it retains WAL in pg_wal and retries, so the second failure mode is the volume filling (10-100Gi depending on the cluster) and taking the primary down with it."

          # THE WINDOW ITSELF, not the freshness of its ends. last_available says the
          # newest restore point exists; first_recoverability_point says how far BACK
          # the archive still reaches. Both can look fine while the span between them
          # collapses — retention pruning too aggressively, or an archive that only
          # recently started working.
          #
          # WARNING, NOT CRITICAL, AND for: 1h, because a legitimately young cluster
          # trips this: a freshly bootstrapped one has less than 24h of reach until
          # its second base backup, and that is not an incident. Against a declared
          # retentionPolicy of 30d, though, a mature cluster reporting under a day of
          # reach has lost most of the recovery it is documented as providing.
          - alert: PostgresPITRWindowShrinking
            expr: (max by (namespace, pod) (cnpg_collector_last_available_backup_timestamp) - max by (namespace, pod) (cnpg_collector_first_recoverability_point)) < 86400
            for: 1h
            labels: { severity: warning, layer: operational }
            annotations:
              summary: "Point-in-time recovery for {{ $labels.pod }} reaches back less than 24 hours"
              description: "The span between the earliest recoverable point and the latest backup is under a day, against a declared retentionPolicy of 30d. Restoring to any instant before that window is no longer possible. On a newly bootstrapped cluster this is expected until the second base backup completes and clears by itself; on an established one it means retention is pruning what the policy says to keep, or the archive only recently began working — in which case the 30d in cluster.yaml is a number nobody can honour."

          # THE STANDBY, which is the OTHER copy and the one nobody watches.
          # The DR drill (infra/dr/README.md) recovers this number by a human running
          # `kubectl cnpg status | grep -i lag` DURING a drill — quarterly. Between
          # drills a standby that stopped replaying is invisible, and the DR-01e RPO
          # target is a claim about exactly this number.
          #
          # A standby that has stopped is not a degraded DR region. It is a DR region
          # holding stale data that will be promoted anyway during the incident that
          # needs it.
          - alert: PostgresStandbyLagging
            expr: max by (namespace, pod) (cnpg_pg_replication_lag) > 300
            for: 15m
            labels: { severity: critical, layer: operational }
            annotations:
              summary: "Postgres standby {{ $labels.pod }} is more than 5 minutes behind its primary"
              description: "Replication lag has exceeded 300s for fifteen minutes. The DR-01e target is an RPO under one minute and the streaming replica is what delivers it, so this is the DR region silently falling outside the objective it exists for. Between quarterly drills nothing else looks at this number. If the standby has stopped entirely rather than fallen behind, the promotion in infra/dr/failover.sh will still succeed and will bring up data this far out of date."

          # THE RULE THAT CATCHES THE OTHER FIVE BEING WRONG.
          #
          # Every expr above names a CloudNativePG collector metric that nothing in
          # this repository can verify: no CNPG version is pinned, and there is no
          # CNPG on the dev rig. A misspelled metric produces an empty vector, and a
          # threshold over an empty vector never fires — so the failure mode of
          # getting these names wrong is SILENCE that is indistinguishable from
          # "backups are fine". That is the exact shape #624 was filed about.
          #
          # THIS IS NOT THE absent() ANTI-PATTERN alerts/README.md records deleting.
          # DataQualityMetricsMissing fired forever over series with NO PRODUCER,
          # describing a gap nobody intended to close. This one is gated on
          # `count(up{namespace="kanz-data"}) > 0` — it can only fire where Postgres
          # pods are actually being scraped, so a dev rig running postgres-dev.yaml
          # (no CNPG, no kanz-data targets) stays silent, and it CLEARS BY ITSELF the
          # moment the exporter reports. True, actionable, self-clearing: the
          # AlertDeliveryNotDelivering test, not the DataQualityMetricsMissing one.
          #
          # for: 30m rides out a CNPG rolling restart without announcing it.
          - alert: PostgresBackupTelemetryMissing
            expr: absent(cnpg_collector_last_available_backup_timestamp) and on() (count(up{namespace="kanz-data"} == 1) > 0)
            for: 30m
            labels: { severity: warning, layer: operational }
            annotations:
              summary: "Postgres pods in kanz-data are being scraped but report no backup telemetry"
              description: "Prometheus has live targets in kanz-data and none of them export cnpg_collector_last_available_backup_timestamp, so every backup and recoverability alert in this group is evaluating an empty vector and CANNOT fire. Recoverability is currently unobserved, and it looks exactly like recoverability being fine. Either the CNPG metrics exporter is not running on 9187, or the metric names in this rule group are wrong for the CloudNativePG version actually deployed — check `kubectl -n kanz-data port-forward <pod> 9187:9187` and read /metrics before trusting any other rule here."

      # ===========================================================================
      - name: bus_connectivity
      # ===========================================================================
      # LOSING THE SPINE SAYS SO (#636). Before this group, it did not.
      #
      # pkg/bus states the requirement in its own doc — "a trading process must
      # learn" — and one service of twenty-one did. The handlers that log a
      # disconnect were installed only when a composition root passed OnDisconnect,
      # and 23 of 24 NATSConfig literals passed nothing, so a nats.Conn could close
      # for good with the process still running, /readyz still answering 200, and
      # nothing written anywhere. MaxReconnects defaults to -1, so there is no crash
      # to notice, and the Go NATS client logs nothing of its own.
      #
      # WHY BusConsumerStalled DOES NOT COVER THIS. That rule reads
      # kanz_bus_consume_total, so it can only speak for a service that CONSUMES —
      # the gateway, market-ingest and the venue adapters emitting fills publish and
      # never consume, and are outside it entirely. It also decays by its own
      # admission: "a stall lasting more than 24h takes the qualifier to zero too and
      # this alert RESOLVES on its own", which is exactly an overnight spine loss on
      # a quiet service.
        rules:
          # THE PROCESS IS DETACHED FROM THE SPINE RIGHT NOW.
          #
          # for: 2m rides out a broker rolling restart — NATS with 3 replicas moves
          # leadership in seconds and the client reconnects — while still leaving a
          # real outage announced long before the 24h window BusConsumerStalled needs.
          - alert: BusDisconnected
            expr: max by (namespace, pod, client) (kanz_bus_connected) == 0
            for: 2m
            labels: { severity: critical, layer: operational }
            annotations:
              summary: "{{ $labels.pod }} has lost the NATS spine ({{ $labels.client }})"
              description: "This process has held no NATS connection for two minutes. It cannot publish, cannot receive fills, and cannot hear a declared halt — so it can no longer know whether it is safe to trade, which is the reason pkg/bus's doc says a trading process must learn about a disconnect. MaxReconnects is -1, so it will keep retrying and will NOT crash: the pod stays Ready and the process stays alive with nothing flowing. Check the broker first (kubectl -n kanz-messaging get pods), then this pod's egress and its NATS credentials."

          # FLAPPING, WHICH THE GAUGE ALONE CANNOT SEE.
          #
          # scrape_interval is 30s. A spine that drops and recovers inside one
          # interval leaves kanz_bus_connected reading 1 at every scrape, so
          # BusDisconnected above is structurally blind to it — and repeated short
          # drops are what precedes a full outage rather than what follows it. A
          # counter cannot miss an edge, which is why both exist.
          #
          # >= 3 in 15m, not > 0: one reconnect is a broker restart or a node moving,
          # and paging on it would train the reader to ignore this rule.
          - alert: BusConnectionFlapping
            expr: increase(kanz_bus_connection_events_total{event="disconnected"}[15m]) >= 3
            for: 5m
            labels: { severity: warning, layer: operational }
            annotations:
              summary: "{{ $labels.pod }} has reconnected to the spine repeatedly ({{ $labels.client }})"
              description: "Three or more disconnects in fifteen minutes. Each one is brief enough that kanz_bus_connected is likely still reading 1 at every scrape, so BusDisconnected cannot fire on this — that rule sees state, this one sees edges. In-flight publishes are being buffered and redelivered across each gap, and consumers are re-establishing their durables each time. Look for a broker under memory pressure, a node draining repeatedly, or an unstable network path before it becomes a full outage."

          # THE DELIVERY PATH FAULTING, WHICH HAS NO OTHER SURFACE ANYWHERE.
          #
          # jetstream reports missed heartbeats, ErrConsumerNotFound after a consumer
          # is deleted, and ErrConsumerLeadershipChanged ONLY to a ConsumeErrHandler.
          # Neither Consume call site registered one, so those errors were discarded
          # and the subscription simply stopped delivering while the process stayed
          # up. That is the mid-run form of the failure that crash-looped compliance
          # and tv-sync to ~495 restarts on "stream not found" — loud when it happens
          # at startup, silent when it arrives after the consumer is established.
          - alert: BusAsyncConsumeErrors
            expr: increase(kanz_bus_consume_errors_total[15m]) > 0
            for: 15m
            labels: { severity: critical, layer: operational }
            annotations:
              summary: "Asynchronous consume errors on {{ $labels.subject }} ({{ $labels.group }})"
              description: "JetStream has reported delivery-path errors on this subscription for fifteen minutes — missed heartbeats, a consumer that no longer exists, or a leadership change that did not settle. Deliveries on this subject may have STOPPED while the process stays healthy and Ready, so nothing else in this alerting layer will say so. Check whether the stream and consumer still exist (nats consumer info), which is the state that crash-looped compliance and tv-sync when it happened at startup instead of mid-run."

          # =====================================================================
          # THE AUDIT HASH CHAIN (#665)
          # =====================================================================
          #
          # The chain had a tamper check and nothing ran it. audit-deploy.yaml
          # granted kanz-monitoring an authority on the strength of a schedule that
          # did not exist, and the manifest's own words name what that left: "tamper
          # detection depending on somebody remembering to look".
          #
          # THE CHECK NOW RUNS IN-PROCESS, on an interval, in services/audit. These
          # three rules are what makes it DETECTION rather than a log line: the
          # issue's own bar is that "a verifier that logs a failure into the same
          # estate nobody is watching is not detection", so the output has to leave
          # the system it attests to.
          #
          # THREE OUTCOMES, THREE RULES, and the separation is the point. An
          # unreadable store is neither a pass nor a tamper: reported as intact it is
          # a check that passes while the database is down, reported as broken it
          # pages somebody to investigate a forgery that has not happened.

          # A TAMPER. The loudest thing in this file.
          #
          # THRESHOLD IS ZERO BECAUSE THE EVENT IS NOT A RATE. One broken
          # verification means a record in the compliance log does not hash to its
          # successor — either the log was altered or the writer has a bug. Neither
          # gets a budget.
          #
          # for: 0m, uniquely in this file. Every other rule here waits to see
          # whether a condition persists, because a transient one is usually a
          # restart. This condition cannot be transient: the verifier reached a
          # verdict over the whole log, and the next scan an hour later would only
          # confirm it. Waiting would delay the page by an hour and change nothing.
          - alert: AuditChainTampered
            expr: increase(kanz_audit_chain_verifications_total{outcome="broken"}[1h]) > 0
            for: 0m
            labels: { severity: critical, layer: operational }
            annotations:
              summary: "The audit hash chain DID NOT VERIFY on {{ $labels.pod }}"
              description: "A scheduled verification found the AUDIT-01b hash chain broken: a record in the compliance log does not hash to its successor. Every attestation derived from this log — SOC2 evidence, regulator reports, the /v1/audit/verify endpoint — is in question until this is explained. The pod's log carries the index of the first break. This is either tampering with the WORM store or a defect in the writer, and both are incidents."

          # NOBODY IS VERIFYING. The rule that makes an in-process scheduler
          # sufficient, and the one that would have caught the original defect.
          #
          # It fires for a verifier that STOPPED, one that is WEDGED, a pod that
          # never started one, and a deployment where the interval was lengthened
          # into silence — a superset of what "the CronJob did not run" would catch.
          #
          # THRESHOLD IS DERIVED FROM THE INTERVAL, not picked: verify.DefaultInterval
          # is 1h, so 3h is three consecutive missed verifications. Two would page on
          # a single slow whole-log scan overlapping a rolling restart; three cannot
          # be one bad hour.
          #
          # THE GAUGE IS SEEDED AT ZERO, which is what makes this fire on a pod that
          # has NEVER verified rather than staying silent for want of a series:
          # time() - 0 is enormous. A gauge seeded with the current time at startup
          # would have claimed a verification that never happened.
          - alert: AuditChainNotBeingVerified
            expr: time() - kanz_audit_chain_last_verified_timestamp_seconds > 10800
            for: 10m
            labels: { severity: critical, layer: operational }
            annotations:
              summary: "No successful audit-chain verification on {{ $labels.pod }} for over three hours"
              description: "The scheduled tamper check has not completed successfully in three hours — three consecutive missed runs at the default hourly interval. A value of exactly 0 means this pod has never completed one at all. The chain is not known to be intact OR broken: nothing is checking it, which is the state this alert exists to end (#665). Check whether the audit pod is healthy, whether its store is reachable, and whether AUDIT_VERIFY_INTERVAL was set longer than this window."

          # THE CHECK ITSELF IS FAILING, which is neither of the above.
          #
          # Separate from AuditChainNotBeingVerified because it names the CAUSE: the
          # staleness rule fires on any absence, this one says the verifier ran and
          # could not read the log. An operator seeing both knows it is the store,
          # not the scheduler.
          #
          # for: 1h — one failed scan is a connection blip during a whole-log read,
          # and report.Verify holds a pool connection for its duration, so a single
          # failure under load is expected rather than alarming.
          - alert: AuditChainVerificationFailing
            expr: increase(kanz_audit_chain_verifications_total{outcome="error"}[3h]) > 0
            for: 1h
            labels: { severity: warning, layer: operational }
            annotations:
              summary: "Audit-chain verification cannot read the log on {{ $labels.pod }}"
              description: "The scheduled tamper check ran and could not read the audit store, so NOTHING was verified — this is not a pass and not a tamper. report.Verify is a whole-log scan holding one pool connection, so this usually means the store is unreachable, the pool is exhausted, or the scan is timing out on a log that has outgrown it. While this persists the chain's integrity is unknown, and AuditChainNotBeingVerified will follow if it continues."

          # THE BOOK OF RECORD IS NOT BEING CHECKED AGAINST ITS CUSTODIAN (#962).
          #
          # # Why this is the staleness rule that matters most
          #
          # Custody reconciliation detects what nothing else on this platform can.
          # Every other control READS THE BOOK — exposure, VaR, mandate limits,
          # margin, NAV — so each inherits whatever the book is wrong about,
          # confidently and in the same direction. And the error is silent by
          # construction: a position missing from the book contributes nothing to any
          # measure, so no threshold is crossed and no alert fires. The custodian's
          # statement is the only independent view, and this rule is what says the
          # comparison has stopped happening.
          #
          # # Why it reads a TIMESTAMP and not a duration
          #
          # kanz_accounting_reconciliation_last_success_timestamp_seconds is set to
          # the completion instant and the subtraction happens HERE. A gauge holding
          # a duration is computed at scrape time by the process that owns it, so a
          # process that has hung — the single most important thing a staleness alert
          # must catch — publishes a duration frozen at whatever it last managed to
          # compute, and the rule reads it as healthy forever. A timestamp cannot lie
          # that way: it stops advancing while time() keeps moving.
          #
          # # Why the series exists before the first run, and why that is load-bearing
          #
          # buildCustodyPlane calls Metrics.SeedPair for EVERY configured
          # (portfolio, custodian) before the scheduler's first tick, which sets this
          # gauge to 0 — the Unix epoch, i.e. an age of five decades. That is
          # deliberate: an estate that has NEVER reconciled is strictly worse than one
          # whose last run is old, and without the seed it would be ABSENT from the
          # vector and silently skipped by this rule. A rule over an absent series is
          # silent in exactly the state it detects (#62 deleted ten data-quality rules
          # for that), so the harness beside this file executes the never-reconciled
          # case as well as the stale one.
          #
          # 26h, not 24h: the scheduler's default interval is 24h and a run that
          # slips by an hour is a scrape gap, not an incident.
          - alert: CustodyReconciliationStale
            expr: |
              (time() - max by (namespace, portfolio, custodian) (kanz_accounting_reconciliation_last_success_timestamp_seconds)) > 93600
            for: 30m
            labels: { severity: critical, layer: operational }
            annotations:
              summary: "Portfolio {{ $labels.portfolio }} has not been reconciled against custodian {{ $labels.custodian }}"
              description: "No reconciliation run for this (portfolio, custodian) has completed AND published in over 26 hours, so the fund's book of record is unverified against the only independent view of what is actually custodied. Every number derived from that book — NAV, exposure, VaR, mandate headroom, margin — inherits whatever it is wrong about, and the failure is silent: a position missing from the book contributes to no measure and crosses no threshold. A value at the Unix epoch means this pair has NEVER reconciled. Check kanz_accounting_reconciliation_runs_total by outcome on the accounting deployment: outcome=no_statement means the custodian sent nothing (or accounting.custody.statement is not granted in infra/nats/tenancy.yaml — a denied subscription delivers nothing and looks identical); outcome=failed means the run could not complete and failure_reason on the ReconciliationRun FACT says why; no increment at all means ACCOUNTING_CUSTODY_PAIRS is empty and nothing is scheduled."

          # THE CUSTODIAN HAS STOPPED SENDING (#962).
          #
          # Distinct from the staleness rule above and deliberately not folded into
          # it. A no_statement run is the control WORKING: it came due, it looked, and
          # the custodian had said nothing — so the platform is healthy and the
          # counterparty (or the subscription grant) is not. Paging the same way for
          # both would tell an operator to check the wrong system.
          #
          # It is a rate over a COUNTER whose zero series is seeded from
          # custody.Outcomes() at wiring time, so "no no_statement runs" is a real 0
          # rather than an absent vector that this rule would never match.
          - alert: CustodyStatementMissing
            expr: |
              increase(kanz_accounting_reconciliation_runs_total{outcome="no_statement"}[26h]) > 0
            for: 1h
            labels: { severity: warning, layer: operational }
            annotations:
              summary: "Custodian {{ $labels.custodian }} sent no statement for a reconciliation that came due"
              description: "A scheduled reconciliation ran and found no custodian statement for the business date it covers, so the book was not compared against anything. This is the control reporting an absence rather than failing — before #962 this state produced no event at all and was indistinguishable from reconciling cleanly. Two causes and they need different owners: the custodian genuinely has not transmitted (chase the counterparty / the feed adapter), or accounting's subscription to accounting.custody.statement is not granted in infra/nats/tenancy.yaml, in which case the subscription is DENIED SILENTLY and delivers nothing (#787/#788). Check the accounting pod's subscribe log line before chasing the custodian."

          # A RECONCILIATION BREAK NOBODY HAS CLOSED (#962).
          #
          # kanz_accounting_break_oldest_age_seconds is measured from when a break was
          # FIRST seen and is never reset by a redetection, so this is genuinely "this
          # position has disagreed with the custodian for N days" rather than "a run
          # found something today".
          #
          # EXPLAINED BREAKS ARE STILL COUNTED, and that is the point of the ageing.
          # An explanation is a claim about the future — "this clears when tomorrow's
          # settlement lands" — not evidence that it has, and a break still present a
          # week after being explained is a WORSE signal than an unexplained one
          # because somebody looked at it and was wrong. Only RESOLVED, which requires
          # the book and the custodian to actually agree, leaves the outstanding set.
          - alert: CustodyBreakAgeing
            expr: |
              max by (namespace, custodian) (kanz_accounting_break_oldest_age_seconds) > 432000
            for: 1h
            labels: { severity: warning, layer: operational }
            annotations:
              summary: "A reconciliation break against {{ $labels.custodian }} has been open for over 5 days"
              description: "The book and the custodian have disagreed about the same instrument or currency for more than five business days without reaching RESOLVED. A break that persists is either a real economic difference nobody has corrected — a fill that never reached the ledger, a settlement that failed — or an explanation that did not hold, which is why an EXPLAINED break keeps ageing rather than dropping out of this gauge. Read kanz_accounting_breaks_open by kind: missing_in_ibor is the direction that most often means a fill never reached the book, and it is the case no other control on this platform can detect."

          # A RUN HAPPENED AND THE ESTATE NEVER HEARD IT (#962).
          #
          # The reconciler advances the staleness gauge ONLY on a successful publish,
          # so a broker outage leaves CustodyReconciliationStale firing correctly — the
          # estate has no record of the run, and "no record" is the honest reading.
          # This rule is what distinguishes that cause from the others, so an operator
          # is not sent to chase a custodian over a NATS problem.
          - alert: CustodyReconciliationUnpublished
            expr: |
              increase(kanz_accounting_reconciliation_publish_failures_total[1h]) > 0
            for: 15m
            labels: { severity: warning, layer: operational }
            annotations:
              summary: "Custody reconciliation runs for {{ $labels.custodian }} completed but could not be published"
              description: "A reconciliation ran and its ReconciliationRun FACT could not be published, so the run exists in accounting's own store and nowhere else. The staleness gauge deliberately does NOT advance on an unpublished run — the estate genuinely has no record that the control ran — so CustodyReconciliationStale will follow and this rule is what names the cause as a publish path rather than a custodian. Check the broker and that accounting.custody.reconciled is in the accounting user's publish allow-list in infra/nats/tenancy.yaml."
  slo.alerts.rules.yaml: |
    # SLO multi-window burn-rate alerts (SRE-01b) — over slo.recording.rules.yaml.
    #
    # One alert per burn-rate pair from slo.yaml defaults.burn_rates, GENERIC over
    # every SLO: each fires for any {service,slo} whose recorded error ratio exceeds
    # `factor × error_budget` on BOTH the long and short window. The short window is
    # the reset guard — it clears the alert quickly once the burn stops, so a long
    # window doesn't keep paging on a spike that already ended. The budget threshold
    # is joined in with on(service,slo) from slo:error_budget:ratio, so an objective
    # change in the recording rules re-points every alert with no edit here.
    #
    # severity routes exactly like the DATA-09 rules (critical ⇒ page, warning ⇒
    # ticket); layer="slo" scopes Alertmanager routing/silences. This EXTENDS the
    # data-quality alerts — same Alertmanager, distinct layer.
    #
    #   promtool check rules slo.alerts.rules.yaml
    #   promtool test rules slo_test.yaml
    groups:
      - name: slo_burn_rate
        rules:
          # Fast burn: 14.4× spends ~2% of a 28d budget in 1h → page now.
          - alert: SLOFastBurn
            expr: |
              (
                slo:sli_error:ratio_rate1h > on(service, slo) (14.4 * slo:error_budget:ratio)
                and
                slo:sli_error:ratio_rate5m > on(service, slo) (14.4 * slo:error_budget:ratio)
              )
            labels: { severity: critical, layer: slo, burn_rate: fast }
            annotations:
              summary: "Fast error-budget burn on {{ $labels.service }}/{{ $labels.slo }}"
              description: "{{ $labels.service }}/{{ $labels.slo }} is burning budget at >14.4× (1h+5m windows) — current 1h error ratio {{ $value | humanizePercentage }}. At this rate the 28d budget is gone in hours."

          # Slow burn: 6× spends ~5% in 6h → page (slower, but still budget-fatal).
          - alert: SLOSlowBurn
            expr: |
              (
                slo:sli_error:ratio_rate6h > on(service, slo) (6 * slo:error_budget:ratio)
                and
                slo:sli_error:ratio_rate30m > on(service, slo) (6 * slo:error_budget:ratio)
              )
            labels: { severity: critical, layer: slo, burn_rate: slow }
            annotations:
              summary: "Sustained error-budget burn on {{ $labels.service }}/{{ $labels.slo }}"
              description: "{{ $labels.service }}/{{ $labels.slo }} is burning at >6× (6h+30m windows) — current 6h error ratio {{ $value | humanizePercentage }}."

          # Ticket: 3× over a day — not a page, but the budget is trending to breach.
          - alert: SLOBudgetBurnTicket
            expr: |
              (
                slo:sli_error:ratio_rate1d > on(service, slo) (3 * slo:error_budget:ratio)
                and
                slo:sli_error:ratio_rate2h > on(service, slo) (3 * slo:error_budget:ratio)
              )
            labels: { severity: warning, layer: slo, burn_rate: elevated }
            annotations:
              summary: "Elevated error-budget burn on {{ $labels.service }}/{{ $labels.slo }}"
              description: "{{ $labels.service }}/{{ $labels.slo }} is burning at >3× (1d+2h windows) — current 1d error ratio {{ $value | humanizePercentage }}. File a reliability ticket before it pages."

          # Ticket: 1× over 3 days — chronic low-grade drain; the budget won't last
          # the window at this rate. Catches slow rot the faster pairs miss.
          - alert: SLOBudgetBurnChronic
            expr: |
              (
                slo:sli_error:ratio_rate3d > on(service, slo) (1 * slo:error_budget:ratio)
                and
                slo:sli_error:ratio_rate6h > on(service, slo) (1 * slo:error_budget:ratio)
              )
            labels: { severity: warning, layer: slo, burn_rate: chronic }
            annotations:
              summary: "Chronic error-budget drain on {{ $labels.service }}/{{ $labels.slo }}"
              description: "{{ $labels.service }}/{{ $labels.slo }} has burned >1× budget over 3d (3d+6h windows) — current 3d error ratio {{ $value | humanizePercentage }}. The 28d budget will not survive the window at this rate."

      # THE ACCOUNTING WINDOW (#210). The four rungs above are rate-of-spend alarms
      # over 1h…3d; none of them integrates, so an SLO can sit under every one of
      # them for a month and still finish it with the budget gone. These two are
      # about the TOTAL, and about whether the total can be trusted at all.
      - name: slo_budget_window
        rules:
          # THE BUDGET FOR THE WINDOW IS SPENT. Not a page: nothing is on fire right
          # now — that is precisely the point, and precisely why the burn-rate rungs
          # are silent. It is the signal that the objective has been missed for the
          # accounting period, which is a release-policy decision (freeze, or accept
          # and reset) rather than an incident.
          - alert: SLOBudgetExhausted
            expr: slo:error_budget_consumed:ratio >= 1
            for: 1h
            labels: { severity: warning, layer: slo, burn_rate: exhausted }
            annotations:
              summary: "28d error budget exhausted for {{ $labels.service }}/{{ $labels.slo }}"
              description: "{{ $labels.service }}/{{ $labels.slo }} has consumed {{ $value | humanizePercentage }} of its 28d error budget. No burn-rate alert need have fired: those measure rate of spend and none of them integrates over the window."

          # THE BUDGET CANNOT BE MEASURED — which must be LOUD, because the series it
          # guards is deliberately ABSENT rather than wrong when this fires.
          #
          # Without this alert the failure mode is a dashboard panel reading "no
          # data" for a month while everyone assumes the panel is broken. With it,
          # "we are not measuring the budget" is itself a reportable state — the
          # distinction between "nothing configured" and "checked, and fine" that
          # this platform refuses to blur.
          #
          # It is expected to fire for ~28 days after any Prometheus restart that
          # loses the TSDB, and that is correct rather than noise: the budget really
          # is unknown for that period.
          - alert: SLOBudgetWindowNotCovered
            expr: slo:budget_window_coverage:ratio < 0.99
            for: 1h
            labels: { severity: warning, layer: slo }
            annotations:
              summary: "Error-budget accounting window is not covered by retained data"
              description: "The TSDB holds {{ $value | humanizePercentage }} of the 28d accounting window, so slo:error_budget_consumed:ratio is NOT being produced — a partial window would understate consumption and read as budget remaining. Check retention (--storage.tsdb.retention.time) and whether the volume survived a restart."
  slo.recording.rules.yaml: |
    # SLO recording rules (SRE-01b) — compiled from slo.yaml (SRE-01a).
    #
    # Three layers:
    #   slo_meta         — per-SLO error budget (1 − objective) as a labeled series.
    #                      Alerts join against these so the burn threshold lives in
    #                      ONE place per SLO.
    #   slo_sli_error    — the SLI ERROR ratio (1 − good/total) per SLO over each of
    #                      the seven burn-rate windows. One metric name,
    #                      `slo:sli_error:ratio_rate<window>`, labeled {service,slo},
    #                      so slo.alerts.rules.yaml stays generic (one alert per
    #                      burn pair covers every SLO via on(service,slo) matching).
    #   slo_budget_28d   — the ACCOUNTING window (#210). Burn RATE was fully covered
    #                      by the seven windows above; burn TOTAL was not, so "how
    #                      much of this month's budget is left" was not answerable
    #                      from anywhere. An SLO can sit inside every burn-rate
    #                      threshold all month and still have spent its whole
    #                      budget, because those alerts are rate-of-spend alarms and
    #                      none of them integrates.
    #
    # Series are the OBS-01 RED contract (kanz_gateway_/kanz_risk_/kanz_bus_*) —
    # the exact names slo.yaml binds. The burn windows match slo.yaml
    # defaults.burn_rates: pairs (1h,5m) (6h,30m) (1d,2h) (3d,6h). The eighth window
    # is 28d, which is slo.yaml `defaults.window` — the accounting period, not a burn
    # pair, which is why it lives in its own group and has its own coverage guard.
    #
    # THE MARKET-DATA FRESHNESS SLO WAS REMOVED, NOT SUSPENDED. It was compiled
    # from kanz_data_staleness_lag_seconds, a DATA-02 gauge emitted by
    # internal/integrity — a package deleted in DATA-M4. Nothing in the Go source
    # has emitted that series since, and services/market-data registers no
    # domain metric at all (only the generic bus metrics), so the SLO could not be
    # re-pointed at a renamed series either. Left in place it computed over an
    # empty vector: every windowed ratio was empty, so the generic burn-rate alerts
    # in slo.alerts.rules.yaml could never fire for market-data/freshness and the
    # gap was invisible on the dashboards. A freshness objective nobody measures
    # reads as a freshness objective being met. Re-introducing it means
    # instrumenting market-data FIRST, then compiling the SLO from the series that
    # actually exists.
    #
    # No-traffic note: with zero denominator rate() yields 0/0 = NaN; the error
    # ratio is NaN and burn-rate alerts (NaN > x is false) simply don't fire — a
    # silent service burns no budget, which is correct.
    #
    #   promtool check rules slo.recording.rules.yaml
    groups:
      - name: slo_meta
        rules:
          # Error budget = 1 − objective, one series per SLO (labels carry the
          # identity; vector() supplies the literal). Edit an objective here AND in
          # slo.yaml together — slo.yaml is the source of truth, this is its compile.
          - record: slo:error_budget:ratio
            expr: vector(0.001)
            labels: { service: api-gateway, slo: availability }
          - record: slo:error_budget:ratio
            expr: vector(0.01)
            labels: { service: api-gateway, slo: query-latency }
          - record: slo:error_budget:ratio
            expr: vector(0.005)
            labels: { service: risk-engine, slo: recompute-success }
          - record: slo:error_budget:ratio
            expr: vector(0.01)
            labels: { service: risk-engine, slo: recompute-latency }
          - record: slo:error_budget:ratio
            expr: vector(0.001)
            labels: { service: event-bus, slo: delivery-success }

      - name: slo_sli_error
        rules:
          # --- 5m ---
          - record: slo:sli_error:ratio_rate5m
            expr: 1 - (sum(rate(kanz_gateway_requests_total{code!~"5.."}[5m])) / sum(rate(kanz_gateway_requests_total[5m])))
            labels: { service: api-gateway, slo: availability }
          - record: slo:sli_error:ratio_rate5m
            expr: 1 - (sum(rate(kanz_gateway_request_duration_seconds_bucket{le="0.5"}[5m])) / sum(rate(kanz_gateway_request_duration_seconds_count[5m])))
            labels: { service: api-gateway, slo: query-latency }
          - record: slo:sli_error:ratio_rate5m
            expr: 1 - (sum(rate(kanz_risk_recompute_total{status="ok"}[5m])) / sum(rate(kanz_risk_recompute_total[5m])))
            labels: { service: risk-engine, slo: recompute-success }
          - record: slo:sli_error:ratio_rate5m
            expr: 1 - (sum(rate(kanz_risk_recompute_duration_seconds_bucket{le="0.5"}[5m])) / sum(rate(kanz_risk_recompute_duration_seconds_count[5m])))
            labels: { service: risk-engine, slo: recompute-latency }
          - record: slo:sli_error:ratio_rate5m
            expr: 1 - (sum(rate(kanz_bus_consume_total{result="ok"}[5m])) / sum(rate(kanz_bus_consume_total[5m])))
            labels: { service: event-bus, slo: delivery-success }
          # --- 30m ---
          - record: slo:sli_error:ratio_rate30m
            expr: 1 - (sum(rate(kanz_gateway_requests_total{code!~"5.."}[30m])) / sum(rate(kanz_gateway_requests_total[30m])))
            labels: { service: api-gateway, slo: availability }
          - record: slo:sli_error:ratio_rate30m
            expr: 1 - (sum(rate(kanz_gateway_request_duration_seconds_bucket{le="0.5"}[30m])) / sum(rate(kanz_gateway_request_duration_seconds_count[30m])))
            labels: { service: api-gateway, slo: query-latency }
          - record: slo:sli_error:ratio_rate30m
            expr: 1 - (sum(rate(kanz_risk_recompute_total{status="ok"}[30m])) / sum(rate(kanz_risk_recompute_total[30m])))
            labels: { service: risk-engine, slo: recompute-success }
          - record: slo:sli_error:ratio_rate30m
            expr: 1 - (sum(rate(kanz_risk_recompute_duration_seconds_bucket{le="0.5"}[30m])) / sum(rate(kanz_risk_recompute_duration_seconds_count[30m])))
            labels: { service: risk-engine, slo: recompute-latency }
          - record: slo:sli_error:ratio_rate30m
            expr: 1 - (sum(rate(kanz_bus_consume_total{result="ok"}[30m])) / sum(rate(kanz_bus_consume_total[30m])))
            labels: { service: event-bus, slo: delivery-success }
          # --- 1h ---
          - record: slo:sli_error:ratio_rate1h
            expr: 1 - (sum(rate(kanz_gateway_requests_total{code!~"5.."}[1h])) / sum(rate(kanz_gateway_requests_total[1h])))
            labels: { service: api-gateway, slo: availability }
          - record: slo:sli_error:ratio_rate1h
            expr: 1 - (sum(rate(kanz_gateway_request_duration_seconds_bucket{le="0.5"}[1h])) / sum(rate(kanz_gateway_request_duration_seconds_count[1h])))
            labels: { service: api-gateway, slo: query-latency }
          - record: slo:sli_error:ratio_rate1h
            expr: 1 - (sum(rate(kanz_risk_recompute_total{status="ok"}[1h])) / sum(rate(kanz_risk_recompute_total[1h])))
            labels: { service: risk-engine, slo: recompute-success }
          - record: slo:sli_error:ratio_rate1h
            expr: 1 - (sum(rate(kanz_risk_recompute_duration_seconds_bucket{le="0.5"}[1h])) / sum(rate(kanz_risk_recompute_duration_seconds_count[1h])))
            labels: { service: risk-engine, slo: recompute-latency }
          - record: slo:sli_error:ratio_rate1h
            expr: 1 - (sum(rate(kanz_bus_consume_total{result="ok"}[1h])) / sum(rate(kanz_bus_consume_total[1h])))
            labels: { service: event-bus, slo: delivery-success }
          # --- 2h ---
          - record: slo:sli_error:ratio_rate2h
            expr: 1 - (sum(rate(kanz_gateway_requests_total{code!~"5.."}[2h])) / sum(rate(kanz_gateway_requests_total[2h])))
            labels: { service: api-gateway, slo: availability }
          - record: slo:sli_error:ratio_rate2h
            expr: 1 - (sum(rate(kanz_gateway_request_duration_seconds_bucket{le="0.5"}[2h])) / sum(rate(kanz_gateway_request_duration_seconds_count[2h])))
            labels: { service: api-gateway, slo: query-latency }
          - record: slo:sli_error:ratio_rate2h
            expr: 1 - (sum(rate(kanz_risk_recompute_total{status="ok"}[2h])) / sum(rate(kanz_risk_recompute_total[2h])))
            labels: { service: risk-engine, slo: recompute-success }
          - record: slo:sli_error:ratio_rate2h
            expr: 1 - (sum(rate(kanz_risk_recompute_duration_seconds_bucket{le="0.5"}[2h])) / sum(rate(kanz_risk_recompute_duration_seconds_count[2h])))
            labels: { service: risk-engine, slo: recompute-latency }
          - record: slo:sli_error:ratio_rate2h
            expr: 1 - (sum(rate(kanz_bus_consume_total{result="ok"}[2h])) / sum(rate(kanz_bus_consume_total[2h])))
            labels: { service: event-bus, slo: delivery-success }
          # --- 6h ---
          - record: slo:sli_error:ratio_rate6h
            expr: 1 - (sum(rate(kanz_gateway_requests_total{code!~"5.."}[6h])) / sum(rate(kanz_gateway_requests_total[6h])))
            labels: { service: api-gateway, slo: availability }
          - record: slo:sli_error:ratio_rate6h
            expr: 1 - (sum(rate(kanz_gateway_request_duration_seconds_bucket{le="0.5"}[6h])) / sum(rate(kanz_gateway_request_duration_seconds_count[6h])))
            labels: { service: api-gateway, slo: query-latency }
          - record: slo:sli_error:ratio_rate6h
            expr: 1 - (sum(rate(kanz_risk_recompute_total{status="ok"}[6h])) / sum(rate(kanz_risk_recompute_total[6h])))
            labels: { service: risk-engine, slo: recompute-success }
          - record: slo:sli_error:ratio_rate6h
            expr: 1 - (sum(rate(kanz_risk_recompute_duration_seconds_bucket{le="0.5"}[6h])) / sum(rate(kanz_risk_recompute_duration_seconds_count[6h])))
            labels: { service: risk-engine, slo: recompute-latency }
          - record: slo:sli_error:ratio_rate6h
            expr: 1 - (sum(rate(kanz_bus_consume_total{result="ok"}[6h])) / sum(rate(kanz_bus_consume_total[6h])))
            labels: { service: event-bus, slo: delivery-success }
          # --- 1d ---
          - record: slo:sli_error:ratio_rate1d
            expr: 1 - (sum(rate(kanz_gateway_requests_total{code!~"5.."}[1d])) / sum(rate(kanz_gateway_requests_total[1d])))
            labels: { service: api-gateway, slo: availability }
          - record: slo:sli_error:ratio_rate1d
            expr: 1 - (sum(rate(kanz_gateway_request_duration_seconds_bucket{le="0.5"}[1d])) / sum(rate(kanz_gateway_request_duration_seconds_count[1d])))
            labels: { service: api-gateway, slo: query-latency }
          - record: slo:sli_error:ratio_rate1d
            expr: 1 - (sum(rate(kanz_risk_recompute_total{status="ok"}[1d])) / sum(rate(kanz_risk_recompute_total[1d])))
            labels: { service: risk-engine, slo: recompute-success }
          - record: slo:sli_error:ratio_rate1d
            expr: 1 - (sum(rate(kanz_risk_recompute_duration_seconds_bucket{le="0.5"}[1d])) / sum(rate(kanz_risk_recompute_duration_seconds_count[1d])))
            labels: { service: risk-engine, slo: recompute-latency }
          - record: slo:sli_error:ratio_rate1d
            expr: 1 - (sum(rate(kanz_bus_consume_total{result="ok"}[1d])) / sum(rate(kanz_bus_consume_total[1d])))
            labels: { service: event-bus, slo: delivery-success }
          # --- 3d ---
          - record: slo:sli_error:ratio_rate3d
            expr: 1 - (sum(rate(kanz_gateway_requests_total{code!~"5.."}[3d])) / sum(rate(kanz_gateway_requests_total[3d])))
            labels: { service: api-gateway, slo: availability }
          - record: slo:sli_error:ratio_rate3d
            expr: 1 - (sum(rate(kanz_gateway_request_duration_seconds_bucket{le="0.5"}[3d])) / sum(rate(kanz_gateway_request_duration_seconds_count[3d])))
            labels: { service: api-gateway, slo: query-latency }
          - record: slo:sli_error:ratio_rate3d
            expr: 1 - (sum(rate(kanz_risk_recompute_total{status="ok"}[3d])) / sum(rate(kanz_risk_recompute_total[3d])))
            labels: { service: risk-engine, slo: recompute-success }
          - record: slo:sli_error:ratio_rate3d
            expr: 1 - (sum(rate(kanz_risk_recompute_duration_seconds_bucket{le="0.5"}[3d])) / sum(rate(kanz_risk_recompute_duration_seconds_count[3d])))
            labels: { service: risk-engine, slo: recompute-latency }
          - record: slo:sli_error:ratio_rate3d
            expr: 1 - (sum(rate(kanz_bus_consume_total{result="ok"}[3d])) / sum(rate(kanz_bus_consume_total[3d])))
            labels: { service: event-bus, slo: delivery-success }

      # THE ERROR-BUDGET ACCOUNTING WINDOW (#210).
      #
      # slo.yaml has declared `defaults.window: 28d` since SRE-01a and described the
      # objectives as commitments over it, and nothing computed anything over 28d.
      # The seven windows above are the union of the burn-rate long/short pairs; they
      # measure the RATE of spend. This group measures the TOTAL.
      #
      # The distinction is not academic: every burn-rate alert can stay silent for a
      # month while the budget is consumed, because each one asks "is it burning fast
      # right now" and none of them integrates. "How much of this month's budget is
      # left" needed a different question.
      - name: slo_budget_28d
        rules:
          # --- 28d error ratio, same compile as the burn windows ---
          - record: slo:sli_error:ratio_rate28d
            expr: 1 - (sum(rate(kanz_gateway_requests_total{code!~"5.."}[28d])) / sum(rate(kanz_gateway_requests_total[28d])))
            labels: { service: api-gateway, slo: availability }
          - record: slo:sli_error:ratio_rate28d
            expr: 1 - (sum(rate(kanz_gateway_request_duration_seconds_bucket{le="0.5"}[28d])) / sum(rate(kanz_gateway_request_duration_seconds_count[28d])))
            labels: { service: api-gateway, slo: query-latency }
          - record: slo:sli_error:ratio_rate28d
            expr: 1 - (sum(rate(kanz_risk_recompute_total{status="ok"}[28d])) / sum(rate(kanz_risk_recompute_total[28d])))
            labels: { service: risk-engine, slo: recompute-success }
          - record: slo:sli_error:ratio_rate28d
            expr: 1 - (sum(rate(kanz_risk_recompute_duration_seconds_bucket{le="0.5"}[28d])) / sum(rate(kanz_risk_recompute_duration_seconds_count[28d])))
            labels: { service: risk-engine, slo: recompute-latency }
          - record: slo:sli_error:ratio_rate28d
            expr: 1 - (sum(rate(kanz_bus_consume_total{result="ok"}[28d])) / sum(rate(kanz_bus_consume_total[28d])))
            labels: { service: event-bus, slo: delivery-success }

          # HOW MUCH OF THE WINDOW THE DATABASE ACTUALLY HOLDS.
          #
          # This is the guard the whole group rests on, and #210 is explicit about
          # why: `rate()` over 28d does not fail on a database holding 15 days. It
          # computes over whatever exists and returns a number indistinguishable
          # from a full month's — which UNDERSTATES consumption and therefore reads
          # as budget remaining. The confidently-wrong direction is the dangerous
          # one.
          #
          # prometheus_tsdb_lowest_timestamp_seconds is the oldest sample in the
          # TSDB; Prometheus scrapes itself (see its pod annotation), so this is
          # available on the same surface as everything else.
          #
          # clamp() BOTH WAYS IS NOT DEFENSIVE PADDING. On an EMPTY database the
          # metric is a max-int sentinel (9.22e15, verified against v3.1.0 — the
          # digest this estate pins), so the subtraction is hugely NEGATIVE rather
          # than zero. Without the lower clamp a fresh Prometheus reports a large
          # negative coverage; with it, it reports 0, which is the truth.
          - record: slo:budget_window_coverage:ratio
            expr: clamp(max(time() - prometheus_tsdb_lowest_timestamp_seconds) / (28 * 24 * 3600), 0, 1)

          # THE ANSWER: fraction of the 28d error budget consumed. 1.0 means the
          # budget for the window is exactly spent; above 1.0 the objective is
          # missed for the window.
          #
          # IT IS GATED ON COVERAGE, AND THE GATE MAKES IT ABSENT RATHER THAN WRONG.
          # If the database does not hold the window, this series does not exist —
          # a dashboard reads "no data" instead of a reassuring number, and
          # SLOBudgetWindowNotCovered says why. That is the platform standard
          # applied literally: "nothing configured" and "checked, and fine" must
          # never look the same. A budget figure computed from half a window is
          # exactly the second wearing the first's clothes.
          #
          # 0.99 rather than 1.0 because coverage is measured against wall-clock and
          # a scrape gap of minutes should not blank the panel; anything materially
          # short of the window does.
          - record: slo:error_budget_consumed:ratio
            expr: |
              (
                slo:sli_error:ratio_rate28d / on(service, slo) slo:error_budget:ratio
              )
              and on() (slo:budget_window_coverage:ratio >= 0.99)
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: kanz-observability

# promtool unit tests for the operational alerts (#230). One firing case per
# rule, plus a must-NOT-fire case wherever silence is a distinct claim.
#
# WHY THIS FILE IS THE DELIVERABLE AND NOT A NICETY. `promtool check rules`
# proves a rule PARSES. It says nothing about whether the expression can ever
# produce a sample, and this repository has shipped an entire alerting layer
# that parsed perfectly and could not fire — ten data-quality rules over series
# with no producer, deleted in #62 (alerts/README.md). Sixteen new rules taken
# on trust is that failure queued up again, so every one of them is fired here
# from a synthetic series.
#
# THE NEGATIVE CASES ARE HALF THE VALUE. Most of the thresholds in
# operational.rules.yaml are justified by what they must STAY QUIET for — an
# idle 03:00 subject, a rolling restart, a rate-limit burst, a cold OMS pod. A
# rule that fires on those gets silenced on its first false page and is then
# worse than nothing, and "it does not fire on a burst" is not checkable by
# reading it. Each `exp_alerts: []` below is one of those arguments, executed.
#
#   cd kanz/infra/observability/alerts && promtool test rules operational_test.yaml
#
# rule_files is RELATIVE, so this must run from its own directory — the same
# constraint slo/slo_test.yaml has. CI's observability job discovers every
# *_test.yaml under infra/observability and runs each from the directory it
# lives in, rather than naming them; test/arch/observability_rules_reachable_test.go
# fails the build if it goes back to an enumeration, because a harness nobody
# executes is the defect #61 fixed and #230 nearly reproduced.
rule_files:
  - operational.rules.yaml

evaluation_interval: 1m

tests:
  # ===========================================================================
  # BusConsumerStalled — the issue's own failure scenario.
  # ===========================================================================
  # A group that delivered 300 messages over the first half hour and then
  # delivered NONE. Both terms of the delivery-success ratio are zero, so no
  # burn-rate alert can see it; the throughput floor can.
  - interval: 1m
    name: a consumer that delivered and then stopped
    input_series:
      - series: 'kanz_bus_consume_total{subject="order.order.submit", group="oms", result="ok"}'
        values: '0+10x30 300x60'
    alert_rule_test:
      - eval_time: 75m
        alertname: BusConsumerStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              layer: operational
              subject: order.order.submit
              group: oms
            exp_annotations:
              summary: "Consumer group oms has consumed nothing from order.order.submit for 30 minutes"
              description: "oms delivered messages on order.order.submit within the last 24h and has delivered NONE for the last 30 minutes. This is invisible to the event-bus delivery-success SLO: with no deliveries at all the error ratio is 0/0, so no burn-rate alert can fire. Events are accumulating on the spine and the streams that carry them age out (24h on MARKET/RISK/EXECUTION, 168h on the money streams). Check the consumer's pod, then whether it is blocked on Postgres or a venue call."

  # THE 24h QUALIFIER, EXECUTED. Without the second clause this rule pages for
  # every subject that is legitimately quiet at 03:00, and this estate has
  # plenty. `compliance.breach.detected` has delivered nothing all night and must
  # stay silent; `market.equity.trade` is still delivering and must too.
  - interval: 1m
    name: an idle subject and a healthy one both stay silent
    input_series:
      - series: 'kanz_bus_consume_total{subject="compliance.breach.detected", group="compliance", result="ok"}'
        values: '0x91'
      - series: 'kanz_bus_consume_total{subject="market.equity.trade", group="lake-sink", result="ok"}'
        values: '0+10x91'
    alert_rule_test:
      - eval_time: 75m
        alertname: BusConsumerStalled
        exp_alerts: []

  # ===========================================================================
  # BusConsumerHalted — #219's counter. One is one stopped consumer.
  # ===========================================================================
  - interval: 1m
    name: a single halt pages immediately
    input_series:
      - series: 'kanz_bus_consume_halted_total{subject="order.order.submit", group="oms"}'
        values: '0x20 1x20'
    alert_rule_test:
      - eval_time: 25m
        alertname: BusConsumerHalted
        exp_alerts:
          - exp_labels:
              severity: critical
              layer: operational
              subject: order.order.submit
              group: oms
            exp_annotations:
              summary: "Consumer oms HALTED on order.order.submit — it refused to skip an event"
              description: "The subscription stopped without committing because a delivery could neither be handled nor dead-lettered: the DLQ path is down and the consumer is holding the offset rather than losing the event. It will not resume on its own. Fix the dead-letter destination, then restart the consumer — this counter is the only signal that it stopped on purpose, and it does not clear itself."
      # A consumer that has never halted must not appear. Stated because this is
      # the one rule in the file with no magnitude and no duration to hide
      # behind: if `increase() > 0` were wrong about a flat counter, every
      # healthy consumer in the estate would page.
      - eval_time: 15m
        alertname: BusConsumerHalted
        exp_alerts: []

  # ===========================================================================
  # ArchiverNotArchivingWithBacklog — including the `or vector(0)` fallback.
  # ===========================================================================
  # THE WORST CASE THIS RULE HAS, AND THE ONE THE FALLBACK EXISTS FOR: an
  # archiver that has never archived anything exports NO kanz_archiver_archived_total
  # series at all. sum() of nothing is an empty vector and `empty == 0` is empty,
  # so without `or vector(0)` this alert would go silent exactly when the
  # archiver has never worked. There is deliberately no archived_total series
  # below.
  - interval: 1m
    name: a backlog with no archiver output at all
    input_series:
      - series: 'kanz_archiver_pending_messages{subject="accounting.journal.posted"}'
        values: '500x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: ArchiverNotArchivingWithBacklog
        exp_alerts:
          - exp_labels:
              severity: critical
              layer: operational
            exp_annotations:
              summary: "The archiver has a backlog and has written nothing to Kafka for 30 minutes"
              description: "Events are pending on the spine for the archiver's durable consumer and kanz_archiver_archived_total has not moved. The Kafka log of record is no longer receiving the event stream. NATS streams age out (24h on MARKET/RISK/EXECUTION, 168h on ACCOUNTING/COMPLIANCE/SETTLEMENT), so anything not archived before its stream's max-age is gone permanently — this is a countdown, not a backlog. Check kanz_archiver_failed_total by reason for whether the produce, the routing or the DLQ is what failed."

  # ===========================================================================
  # ArchiverBacklogGrowing — slow, not stopped.
  # ===========================================================================
  # A backlog above 1000 AND rising, while the archiver IS writing. Both facts
  # matter: the archived counter climbing is what keeps
  # ArchiverNotArchivingWithBacklog quiet, and asserting that here is what proves
  # the two rules split the failure rather than double-paging on it.
  - interval: 1m
    name: a growing backlog on a working archiver
    input_series:
      - series: 'kanz_archiver_pending_messages{subject="accounting.journal.posted"}'
        values: '1100+10x90'
      - series: 'kanz_archiver_archived_total{topic="kanz.accounting.journal"}'
        values: '0+50x90'
    alert_rule_test:
      - eval_time: 70m
        alertname: ArchiverBacklogGrowing
        exp_alerts:
          - exp_labels:
              severity: warning
              layer: operational
              subject: accounting.journal.posted
            exp_annotations:
              summary: "The archiver's backlog on accounting.journal.posted has been growing for 30 minutes"
              description: "Pending messages for the archiver's durable consumer are above 1000 and still rising. The archiver is running but slower than the spine is producing, which ends in events ageing off their stream unarchived. Not a page: it has hours of headroom on a 24h stream. Find the bottleneck (Kafka produce latency, or a partition leader move) before it becomes ArchiverNotArchivingWithBacklog."
      - eval_time: 70m
        alertname: ArchiverNotArchivingWithBacklog
        exp_alerts: []

  # THE GROWTH CLAUSE, EXECUTED. A large but STEADY backlog is a working
  # archiver at its standing depth, not an incident. Magnitude alone would page
  # on it forever.
  - interval: 1m
    name: a large but steady backlog is not an incident
    input_series:
      - series: 'kanz_archiver_pending_messages{subject="accounting.journal.posted"}'
        values: '1500x90'
      - series: 'kanz_archiver_archived_total{topic="kanz.accounting.journal"}'
        values: '0+50x90'
    alert_rule_test:
      - eval_time: 70m
        alertname: ArchiverBacklogGrowing
        exp_alerts: []

  # ===========================================================================
  # OMS incident counters — threshold zero, from the metrics' own Help text.
  # ===========================================================================
  - interval: 1m
    name: one quarantined order and one abandoned cancel
    input_series:
      - series: 'kanz_oms_orders_quarantined_total'
        values: '0x10 1x30'
      - series: 'kanz_oms_claim_timeouts_total'
        values: '0x10 1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: OMSOrdersQuarantined
        exp_alerts:
          - exp_labels:
              severity: critical
              layer: operational
            exp_annotations:
              summary: "The OMS has quarantined an order — a position of unknown size is frozen"
              description: "The platform could not establish what the venue did with an order: the venue denied one it had acknowledged, could not be queried, or reported a fill the order cannot accept. The order is frozen and will NOT be re-driven, cancelled or mentioned again until a human resolves it, while the position may be live at the exchange. Reconcile against the venue before the next session."
      - eval_time: 20m
        alertname: OMSClaimTimeouts
        exp_alerts:
          - exp_labels:
              severity: critical
              layer: operational
            exp_annotations:
              summary: "An OMS cancel or amend was abandoned — the instruction went to the DLQ, the order is still live"
              description: "A cancel or amend gave up waiting for the goroutine working its order and was dead-lettered, while the order itself is still working at a venue. The usual cause is a venue call that is not returning. Somebody asked to withdraw an order and it did not happen. Check venue adapter latency, then re-issue the instruction."

  # ===========================================================================
  # The admission-side divergence (#238), both halves.
  # ===========================================================================
  # One order re-announced, and a sweep failing on every pass. The two are
  # separate incidents: the first says a FACT was lost and repaired late, the
  # second says the thing that would repair it is itself broken.
  - interval: 1m
    name: one lost ORDER_ACCEPTED recovered, and a sweep that keeps failing
    input_series:
      - series: 'kanz_oms_orders_accepted_reannounced_total'
        values: '0x10 1x40'
      - series: 'kanz_oms_sweep_failures_total'
        values: '0+1x50'
    alert_rule_test:
      - eval_time: 20m
        alertname: OMSAcceptedFactLostAndRecovered
        exp_alerts:
          - exp_labels:
              severity: critical
              layer: operational
            exp_annotations:
              summary: "An OMS order was committed without its ORDER_ACCEPTED FACT — risk was short one order until a sweep repaired it"
              description: "The OMS committed an order to Postgres and its ORDER_ACCEPTED FACT never reached the bus, so for the interval before the compensating sweep ran, no downstream service knew the order existed: risk carried no exposure, compliance's book excluded it, and the audit log had no record. The order has been re-announced, but the gap was real and every calculation made during it was wrong. Investigate the broker or the publish path at the time of the increment."
      # 40m clears the rule's own for: 15m on a counter that has been rising
      # since the first sample.
      - eval_time: 40m
        alertname: OMSSweepFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              layer: operational
            exp_annotations:
              summary: "The OMS periodic reconciliation has been failing — orders left mid-flight are not being recovered"
              description: "The OMS's periodic in-flight reconciliation has failed on every pass for fifteen minutes. It is the compensator for an order committed without its FACT and for an order stranded mid-flight by a crash; while it fails, the only remaining recovery is the next pod restart. The pod keeps admitting new orders throughout. Check the order store's reachability and the ERROR log line beside this counter for the order it stopped on."

  # THE QUIET CASE, EXECUTED. A healthy OMS never moves either counter, and a
  # rule that fired on a flat zero would page on every deployment forever.
  - interval: 1m
    name: a healthy OMS moves neither counter
    input_series:
      - series: 'kanz_oms_orders_accepted_reannounced_total'
        values: '0x50'
      - series: 'kanz_oms_sweep_failures_total'
        values: '0x50'
    alert_rule_test:
      - eval_time: 40m
        alertname: OMSAcceptedFactLostAndRecovered
        exp_alerts: []
      - eval_time: 40m
        alertname: OMSSweepFailing
        exp_alerts: []

  # ===========================================================================
  # OMSPriceFeedStalled — a stalling fold, a cold pod, and a healthy pod.
  # ===========================================================================
  # Three replicas in one test, because the by (namespace, pod) grouping is the
  # rule's substance: oms-0's feed has stalled, oms-1 is a cold start (live AND
  # held at zero, which is not a stall), oms-2 is healthy. A rule that aggregated
  # across pods would be masked by oms-2 and would page for oms-1.
  - interval: 1m
    name: one stalled replica among a cold one and a healthy one
    input_series:
      - series: 'kanz_oms_mark_instruments_live{namespace="kanz", pod="oms-0"}'
        values: '0x30'
      - series: 'kanz_oms_mark_instruments_held{namespace="kanz", pod="oms-0"}'
        values: '820x30'
      - series: 'kanz_oms_mark_instruments_live{namespace="kanz", pod="oms-1"}'
        values: '0x30'
      - series: 'kanz_oms_mark_instruments_held{namespace="kanz", pod="oms-1"}'
        values: '0x30'
      - series: 'kanz_oms_mark_instruments_live{namespace="kanz", pod="oms-2"}'
        values: '800x30'
      - series: 'kanz_oms_mark_instruments_held{namespace="kanz", pod="oms-2"}'
        values: '820x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: OMSPriceFeedStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              layer: operational
              namespace: kanz
              pod: oms-0
            exp_annotations:
              summary: "OMS oms-0 holds no live reference mark — the price feed has stalled"
              description: "Every reference mark in this OMS replica's fold has aged past OMS_PRICE_MAX_AGE while the fold still holds the instruments, so the price spine WAS reaching this pod and has stopped. The pre-trade gate cannot value an order without a mark: every order this replica receives will be refused PRICE_UNAVAILABLE. Check market-data and this pod's price subscription."

  # ===========================================================================
  # OMSUnverifiedVenueAccount — a standing state, so a raw counter and no increase().
  # ===========================================================================
  # The counter is incremented at STARTUP while adapters register, so it never
  # moves again while the misconfiguration is live. `> 0` on the raw value stays
  # true for as long as the process is up; an increase() window would be true for
  # a few minutes after a restart and false for the whole time the deployment is
  # actually trading an unconfirmed account.
  - interval: 1m
    name: an adapter registered against an unconfirmed exchange account
    input_series:
      - series: 'kanz_oms_unverified_venue_account_total'
        values: '1x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: OMSUnverifiedVenueAccount
        exp_alerts:
          - exp_labels:
              severity: warning
              layer: operational
            exp_annotations:
              summary: "The OMS is trading venue accounts the exchange has not confirmed"
              description: "One or more venue adapters registered with an exchange account that was never confirmed by the exchange itself — the adapter holds the API credential but has not proved which account it belongs to. Its fills could margin against a different fund's collateral than the ledger books them to, and a mis-declared deployment looks exactly like a correct one. Verify each adapter's account against the exchange, or unbind it."
      # Before the 30-minute hold it must be silent — a deploy that briefly
      # registers and re-registers adapters must not page.
      - eval_time: 20m
        alertname: OMSUnverifiedVenueAccount
        exp_alerts: []

  # ===========================================================================
  # ComplianceUngovernedOrders — one firing period per hour it happened in.
  # ===========================================================================
  - interval: 1m
    name: an order handled for a portfolio no mandate governs
    input_series:
      - series: 'kanz_compliance_ungoverned_orders_total'
        values: '0x10 1x70'
    alert_rule_test:
      - eval_time: 30m
        alertname: ComplianceUngovernedOrders
        exp_alerts:
          - exp_labels:
              severity: warning
              layer: operational
            exp_annotations:
              summary: "Orders are being handled for portfolios that NO mandate governs"
              description: "Part of the book is trading with no compliance constraints (or, with OMS_REQUIRE_MANDATE=true, is being refused for want of a mandate). Which of those two it is depends on the posture logged at OMS startup. Put every live portfolio under mandate with kanz-mandate; this counter is how much of the book is currently ungoverned."

  # ===========================================================================
  # The unpriced-order split — one counter, two incidents, two durations.
  # ===========================================================================
  - interval: 1m
    name: sustained expired-mark refusals are a live trading outage
    input_series:
      - series: 'kanz_compliance_unpriced_orders_total{reason="expired"}'
        values: '0+2x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: ComplianceUnpricedOrdersExpired
        exp_alerts:
          - exp_labels:
              severity: critical
              layer: operational
            exp_annotations:
              summary: "Orders are being refused because the price feed has stalled"
              description: "The OMS is refusing orders PRICE_UNAVAILABLE against instruments whose reference mark it HAS seen and which has since aged past OMS_PRICE_MAX_AGE — the feed was working and stopped. This is client-visible: those orders did not reach a venue. Check market-data and the OMS price subscription. OMSPriceFeedStalled fires on the same cause without needing order flow."
      # THE LABEL SELECTOR, EXECUTED. The never_seen rule must not pick up
      # expired refusals: it holds for 30m rather than 10m precisely because it
      # is about a different incident, and a rule matching the whole counter
      # would be either too noisy for the outage or too slow for it.
      - eval_time: 45m
        alertname: ComplianceUnpricedOrdersNeverSeen
        exp_alerts: []

  # WHY A 5m WINDOW HELD FOR 10m AND NOT A 10m WINDOW HELD FOR 0m. This is the
  # single stale mark during a feed reconnect: one refusal, then nothing. A 10m
  # window would stay true for ten minutes after it and page. The 5m window goes
  # false after five, so the 10m hold is never reached.
  - interval: 1m
    name: one refused order during a reconnect does not page
    input_series:
      - series: 'kanz_compliance_unpriced_orders_total{reason="expired"}'
        values: '0x20 1x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: ComplianceUnpricedOrdersExpired
        exp_alerts: []

  - interval: 1m
    name: half an hour of never-seen refusals is a missing subscription
    input_series:
      - series: 'kanz_compliance_unpriced_orders_total{reason="never_seen"}'
        values: '0+2x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: ComplianceUnpricedOrdersNeverSeen
        exp_alerts:
          - exp_labels:
              severity: warning
              layer: operational
            exp_annotations:
              summary: "Orders are being refused for instruments no price has ever arrived for"
              description: "For half an hour the OMS has refused orders PRICE_UNAVAILABLE against instruments it has NEVER received a mark for. Past the warm-up window this means a price subscription delivering nothing for those instruments, or a trading universe wider than the market-data subscription. Compare OMS_PRICE_SUBJECTS against what market-data publishes."
      - eval_time: 45m
        alertname: ComplianceUnpricedOrdersExpired
        exp_alerts: []

  # THE WARM-UP, EXECUTED. Twenty minutes of never-seen refusals during a
  # rollout, then the subscription warms and they stop. 30m is the number that
  # keeps a deploy from paging.
  - interval: 1m
    name: a cold pod warming up does not page
    input_series:
      - series: 'kanz_compliance_unpriced_orders_total{reason="never_seen"}'
        values: '0+2x20 40x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: ComplianceUnpricedOrdersNeverSeen
        exp_alerts: []

  # ===========================================================================
  # Gateway — persistence, not magnitude.
  # ===========================================================================
  # Two tenants at once: acme is being shed continuously (saturation), burst-co
  # took a single rejection during a spike (admission control working). Only one
  # of them is an incident, and the per-tenant grouping is what tells them apart.
  - interval: 1m
    name: one tenant shed continuously, one shed in a burst
    input_series:
      - series: 'kanz_gateway_admission_rejected_total{tenant="acme"}'
        values: '0+3x60'
      - series: 'kanz_gateway_admission_rejected_total{tenant="burst-co"}'
        values: '0x20 5x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: GatewayAdmissionShedding
        exp_alerts:
          - exp_labels:
              severity: warning
              layer: operational
              tenant: acme
            exp_annotations:
              summary: "The gateway has been shedding requests for tenant acme for 10 minutes"
              description: "Per-tenant in-flight admission has been returning 503 continuously for ten minutes, so this is saturation rather than a burst. Either the tenant's in-flight limit is too low for their traffic or the upstream they hit is slow enough to hold slots open. Check kanz_gateway_inflight_requests and upstream latency for the same tenant."

  - interval: 1m
    name: a tenant stuck against their quota for half an hour
    input_series:
      - series: 'kanz_gateway_rate_limited_total{tenant="acme"}'
        values: '0+5x90'
      - series: 'kanz_gateway_rate_limited_total{tenant="burst-co"}'
        values: '0x20 5x70'
    alert_rule_test:
      - eval_time: 60m
        alertname: GatewayTenantRateLimitedSustained
        exp_alerts:
          - exp_labels:
              severity: warning
              layer: operational
              tenant: acme
            exp_annotations:
              summary: "Tenant acme has been rate limited continuously for 30 minutes"
              description: "Every 5-minute window for the last half hour has contained 429s for this tenant. A burst is expected and fine; half an hour is a quota mis-sized for the tenant's entitlement, or a client stuck in a retry loop. Confirm which before raising the limit."

  # ===========================================================================
  # GatewayOIDCKeysUnrevalidated — #242's grace window, seen from outside.
  # ===========================================================================
  # The IdP becomes unreachable at t=10m and the gateway raises the gauge. It
  # must page: in fifteen minutes this pod stops authenticating anything, and a
  # revoked key is being honoured in the meantime.
  - interval: 1m
    name: a gateway running on keys it cannot revalidate
    input_series:
      - series: 'kanz_gateway_oidc_keys_unrevalidated{namespace="kanz-services", pod="api-gateway-7c9f-abcde"}'
        values: '0x10 1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: GatewayOIDCKeysUnrevalidated
        exp_alerts:
          - exp_labels:
              severity: critical
              layer: operational
              namespace: kanz-services
              pod: api-gateway-7c9f-abcde
            exp_annotations:
              summary: "Gateway api-gateway-7c9f-abcde is authenticating on OIDC keys it cannot revalidate — authentication fails within 15 minutes"
              description: "This gateway's cached JWKS is past MaxKeyAge (5m) and the identity provider could not be refetched, so it is verifying bearer tokens on key material it can no longer vouch for. This is a deliberate, BOUNDED grace: it buys 15 minutes, and then every request to this pod fails 503 (ErrKeysStale) until the provider answers — no orders, no cancels, no queries. It also means a key REVOKED at the provider is still being honoured here, for up to 20 minutes from the last successful fetch. Restore reachability to the IdP's JWKS endpoint (check egress, DNS and the provider itself); the gauge clears by itself on the first successful refetch."

  # THE for: 2m, EXECUTED — and the reason it is not zero. A single failed
  # refetch during an IdP rolling restart raises the gauge for one scrape and it
  # clears on the next; paging for that would page on every provider deploy. The
  # blip below is one minute long and must stay silent, and the healthy gateway
  # beside it must too.
  - interval: 1m
    name: a one-minute refetch blip and a healthy gateway both stay silent
    input_series:
      - series: 'kanz_gateway_oidc_keys_unrevalidated{namespace="kanz-services", pod="api-gateway-blip"}'
        values: '0x10 1 0x19'
      - series: 'kanz_gateway_oidc_keys_unrevalidated{namespace="kanz-services", pod="api-gateway-healthy"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: GatewayOIDCKeysUnrevalidated
        exp_alerts: []

  # ===========================================================================
  # lake-sink — permanent is the first one, transient is the thirtieth minute.
  # ===========================================================================
  - interval: 1m
    name: a single permanent decode failure
    input_series:
      - series: 'kanz_lake_sink_decode_errors_total{result="permanent"}'
        values: '0x10 1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: LakeSinkPermanentDecodeErrors
        exp_alerts:
          - exp_labels:
              severity: critical
              layer: operational
            exp_annotations:
              summary: "lake-sink is permanently dropping rows it cannot decode"
              description: "A payload failed to decode in a way lake-sink classified as PERMANENT, so the row will never land in the lakehouse and no retry will recover it. The usual cause is a producer whose payload shape changed, in which case every row of that type is being lost too. Identify the schema change and replay from Kafka while the source topic still retains the rows."
      - eval_time: 20m
        alertname: LakeSinkTransientDecodeErrorsPersisting
        exp_alerts: []

  - interval: 1m
    name: transient decode failures that are not being retried away
    input_series:
      - series: 'kanz_lake_sink_decode_errors_total{result="transient"}'
        values: '0+2x90'
    alert_rule_test:
      - eval_time: 45m
        alertname: LakeSinkTransientDecodeErrorsPersisting
        exp_alerts:
          - exp_labels:
              severity: warning
              layer: operational
            exp_annotations:
              summary: "lake-sink transient decode failures have persisted for 30 minutes"
              description: "Decode failures classified as retryable have occurred in every 5-minute window for half an hour, which means they are not being retried away. Left alone they either become a permanent backlog or start consuming the consumer's throughput. Check kanz_lake_sink_rows_total by result for whether anything is landing at all."
      # A retryable failure is not a permanent one. If the label selectors were
      # wrong this would page critical for something being retried away.
      - eval_time: 45m
        alertname: LakeSinkPermanentDecodeErrors
        exp_alerts: []

  # ===========================================================================
  # KanzScrapeTargetDown — the case where every other rule goes SILENT.
  # ===========================================================================
  - interval: 1m
    name: one pod down, one pod up
    input_series:
      - series: 'up{job="kanz-pods", namespace="kanz", pod="risk-engine-0", service="risk-engine"}'
        values: '0x30'
      - series: 'up{job="kanz-pods", namespace="kanz", pod="oms-0", service="oms"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: KanzScrapeTargetDown
        exp_alerts:
          - exp_labels:
              severity: warning
              layer: operational
              job: kanz-pods
              namespace: kanz
              pod: risk-engine-0
              service: risk-engine
            exp_annotations:
              summary: "Prometheus cannot scrape risk-engine-0 in kanz"
              description: "This target has failed to scrape for ten minutes — the process is down, wedged, or not serving /metrics on its annotated port. Every alert built on this pod's series is now evaluating against a stale or absent vector and will stop firing rather than start: for the bus consumers in particular, BusConsumerStalled goes SILENT when the pod disappears, so this rule is the one that speaks."
      # A rolling update takes a pod away for well under ten minutes. Asserting
      # the pending window is what makes `for: 10m` a claim rather than a number.
      - eval_time: 5m
        alertname: KanzScrapeTargetDown
        exp_alerts: []

  # ===========================================================================
  # Dead letters — the two classes must never share an alert.
  # ===========================================================================
  - interval: 1m
    name: a transient park is recoverable and pages
    input_series:
      - series: 'kanz_bus_dlq_parked_total{subject="order.order.submit", group="oms", class="transient"}'
        values: '0x10 1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: BusMessagesDeadLettered
        exp_alerts:
          - exp_labels:
              severity: critical
              layer: operational
              subject: order.order.submit
              group: oms
            exp_annotations:
              summary: "oms parked a message from order.order.submit — it is on the DLQ and nothing will bring it back"
              description: "A delivery failed for a reason pkg/bus classified as TRANSIENT (infrastructure, not the message) and was parked on dlq.order.order.submit. Parking acks the original, so the DLQ copy is the only copy, and nothing subscribes to dlq.> — it will sit there for the stream's 720h retention until an operator runs kanz-redrive. Transient means whatever broke was probably still broken when this fired: find that first, then redrive. On order.> this is a client-acknowledged order that never reached the OMS."
      # A transient park is NOT the unrecoverable one. If the class selectors
      # were wrong, the ticket rule would open a ticket for something an operator
      # could have redriven in a minute.
      - eval_time: 20m
        alertname: BusTerminalMessagesDeadLettered
        exp_alerts: []

  - interval: 1m
    name: a terminal park is unrecoverable and tickets
    input_series:
      - series: 'kanz_bus_dlq_parked_total{subject="market.equity.trade", group="lake-sink", class="terminal"}'
        values: '0x10 1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: BusTerminalMessagesDeadLettered
        exp_alerts:
          - exp_labels:
              severity: warning
              layer: operational
              subject: market.equity.trade
              group: lake-sink
            exp_annotations:
              summary: "lake-sink parked an UNPROCESSABLE message from market.equity.trade — a redrive will refuse it"
              description: "A delivery failed in a way pkg/bus classified as TERMINAL: unframeable bytes, an envelope that failed validation, or a handler panic. kanz-redrive refuses these deliberately, because re-running a deterministic defect against the same bytes parks them again — so this event is LOST, and no operator action recovers it. Read Kanz-DLQ-Error on the parked message. The usual cause is a producer whose payload shape changed, in which case every message of that type is being lost too; if the cause is a panic, the handler is also crashing on live traffic."
      # And a terminal park must not page somebody at 03:00 to run a redrive that
      # will refuse it.
      - eval_time: 30m
        alertname: BusMessagesDeadLettered
        exp_alerts: []

  # ===========================================================================
  # The archiver's Kafka DLQ (#285) — a different transport, and until these
  # rules existed, no alert at all.
  # ===========================================================================
  # topic="" on every failed_total series below is what production actually
  # emits, not a shortcut: observeFail's comment says topic "may be ''" for
  # unframe/route because both fail before a topic is known.
  - interval: 1m
    name: one unframeable event is parked and forgotten
    input_series:
      - series: 'kanz_archiver_failed_total{topic="", reason="unframe"}'
        values: '0x10 1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: ArchiverParkedAnEventWithNoDrain
        exp_alerts:
          - exp_labels:
              severity: warning
              layer: operational
              reason: unframe
            exp_annotations:
              summary: "The archiver parked an event (unframe) on dlq.archiver — nothing drains it and it is deleted in 30 days"
              description: "An event never reached the Kafka log of record: reason=unframe (unframe = the body never decoded; route = its event_type/tenant maps to no topic). The archiver parked it on dlq.archiver and ACKED the original, so the parked copy becomes the only copy once its NATS stream ages out — 24h on MARKET/RISK/EXECUTION, 168h on ACCOUNTING/COMPLIANCE/SETTLEMENT. dlq.archiver has a 30-day delete retention and NO consumer, and kanz-redrive is NATS-only, so recovery means a human reading the topic by hand inside that window (#285). Note the backlog alerts CANNOT see this: parking acks, so pending stays at zero. Read Kanz-DLQ-Error and Kanz-DLQ-Original-Subject on the parked message."
      # An undecodable body is a producer defect, not a configuration gap. If
      # the reason selectors were wrong this would page somebody at 03:00 to add
      # a topic mapping that was never missing.
      - eval_time: 30m
        alertname: ArchiverRoutingTableRejectingEvents
        exp_alerts: []
      - eval_time: 30m
        alertname: ArchiverDeadLetterProduceFailing
        exp_alerts: []

  - interval: 1m
    name: a missing topic mapping drops an entire event class
    input_series:
      - series: 'kanz_archiver_failed_total{topic="", reason="route"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: ArchiverRoutingTableRejectingEvents
        exp_alerts:
          - exp_labels:
              severity: critical
              layer: operational
            exp_annotations:
              summary: "The archiver has been unable to route events to a Kafka topic for 15 minutes — every event of that type is being lost"
              description: "kanz_archiver_failed_total{reason=\"route\"} has been rising continuously for 15 minutes: topic.For is finding no mapping for some event_type/tenant pair, so those events are being parked on dlq.archiver instead of written to the log of record, and they keep coming. Unlike an unframeable body this is CONFIGURATION and you can stop the loss now — add the missing mapping to the archiver's topic table and redeploy. The usual causes are a producer shipping a new event_type ahead of its topic mapping, or a tenant onboarded without one. Events already parked are NOT recovered by the fix: dlq.archiver has no drain and a 30-day delete retention (#285)."
      # Both fire, deliberately: the warning says events are unrecoverable, the
      # page says the bleeding can be stopped. Asserting the overlap keeps it a
      # decision rather than something a later edit quietly removes.
      - eval_time: 40m
        alertname: ArchiverParkedAnEventWithNoDrain
        exp_alerts:
          - exp_labels:
              severity: warning
              layer: operational
              reason: route
            exp_annotations:
              summary: "The archiver parked an event (route) on dlq.archiver — nothing drains it and it is deleted in 30 days"
              description: "An event never reached the Kafka log of record: reason=route (unframe = the body never decoded; route = its event_type/tenant maps to no topic). The archiver parked it on dlq.archiver and ACKED the original, so the parked copy becomes the only copy once its NATS stream ages out — 24h on MARKET/RISK/EXECUTION, 168h on ACCOUNTING/COMPLIANCE/SETTLEMENT. dlq.archiver has a 30-day delete retention and NO consumer, and kanz-redrive is NATS-only, so recovery means a human reading the topic by hand inside that window (#285). Note the backlog alerts CANNOT see this: parking acks, so pending stays at zero. Read Kanz-DLQ-Error and Kanz-DLQ-Original-Subject on the parked message."
      # `for: 15m` is the rule's whole substitute for an invented count
      # threshold, so it has to be a claim: at ten minutes it must still be
      # pending, or a single event from a decommissioned producer pages.
      - eval_time: 10m
        alertname: ArchiverRoutingTableRejectingEvents
        exp_alerts: []

  - interval: 1m
    name: the DLQ produce itself fails and the event lands nowhere
    input_series:
      - series: 'kanz_archiver_failed_total{topic="", reason="dlq_publish"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: ArchiverDeadLetterProduceFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              layer: operational
            exp_annotations:
              summary: "The archiver cannot write to dlq.archiver — events are reaching neither their topic nor the DLQ"
              description: "The DLQ produce itself is failing on top of an unframe or route failure, so these events have landed NOWHERE — services/archiver/internal/archive/metrics.go calls this the most severe outcome. deadLetter() NACKs rather than acking, which is correct and means nothing is lost yet, but the consumer is now cycling messages it cannot place. dlq.archiver is a separate 3-partition topic, so check IT specifically before assuming a broad Kafka outage: a lost partition leader, or the topics-job never having run in this environment, takes it down while the real topics keep flowing — in which case no other alert here will fire."
      # THIS NEGATIVE IS THE IMPORTANT ONE. metrics.go counts dlq_publish IN
      # ADDITION to the unframe/route cause underneath it, so a selector that
      # let dlq_publish through would raise the "parked, unrecoverable" warning
      # for events that were never parked — the opposite of what happened, and
      # the reader would go looking on dlq.archiver for something that is not
      # there.
      - eval_time: 30m
        alertname: ArchiverParkedAnEventWithNoDrain
        exp_alerts: []
      # A partition leader election resolves in seconds and the NAK means
      # nothing is lost while it does. `for: 10m` is what separates that from a
      # topic that is genuinely gone.
      - eval_time: 5m
        alertname: ArchiverDeadLetterProduceFailing
        exp_alerts: []

  # THE GAP THESE THREE RULES EXIST TO CLOSE, EXECUTED RATHER THAN ARGUED.
  #
  # An archiver whose routing table is empty parks and ACKS every event it
  # receives. Its queue therefore drains to nothing and stays there, and it
  # writes nothing to Kafka. Both pre-existing archiver rules key on the depth
  # of that queue, so both stay silent — an estate losing 100% of its log of
  # record with a pending count of zero looks exactly like an idle one. If a
  # later edit ever makes ArchiverNotArchivingWithBacklog cover this, these two
  # empty expectations fail and say so.
  - interval: 1m
    name: an archiver parking everything looks healthy to the backlog rules
    input_series:
      # Parking acks, so the queue drains and stays empty.
      - series: 'kanz_archiver_pending_messages{subject="accounting.journal.posted"}'
        values: '0x60'
      # Nothing reaches the log of record.
      - series: 'kanz_archiver_archived_total{topic="kanz.accounting.journal"}'
        values: '0x60'
      # Every event is parked instead.
      - series: 'kanz_archiver_failed_total{topic="", reason="route"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: ArchiverNotArchivingWithBacklog
        exp_alerts: []
      - eval_time: 45m
        alertname: ArchiverBacklogGrowing
        exp_alerts: []
      # And the new rule is the one that speaks.
      - eval_time: 45m
        alertname: ArchiverRoutingTableRejectingEvents
        exp_alerts:
          - exp_labels:
              severity: critical
              layer: operational
            exp_annotations:
              summary: "The archiver has been unable to route events to a Kafka topic for 15 minutes — every event of that type is being lost"
              description: "kanz_archiver_failed_total{reason=\"route\"} has been rising continuously for 15 minutes: topic.For is finding no mapping for some event_type/tenant pair, so those events are being parked on dlq.archiver instead of written to the log of record, and they keep coming. Unlike an unframeable body this is CONFIGURATION and you can stop the loss now — add the missing mapping to the archiver's topic table and redeploy. The usual causes are a producer shipping a new event_type ahead of its topic mapping, or a tenant onboarded without one. Events already parked are NOT recovered by the fix: dlq.archiver has no drain and a 30-day delete retention (#285)."

  # reason="publish" is the real-topic produce failing: TRANSIENT, NACKed, the
  # event stays on the spine and the backlog grows. ArchiverNotArchivingWithBacklog
  # already owns it, and none of the three new rules may claim it too — a second
  # page for one incident is how a responder learns to close them unread.
  - interval: 1m
    name: a failing real-topic produce belongs to the backlog rule alone
    input_series:
      - series: 'kanz_archiver_failed_total{topic="kanz.accounting.journal", reason="publish"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: ArchiverParkedAnEventWithNoDrain
        exp_alerts: []
      - eval_time: 40m
        alertname: ArchiverRoutingTableRejectingEvents
        exp_alerts: []
      - eval_time: 40m
        alertname: ArchiverDeadLetterProduceFailing
        exp_alerts: []

  # ===========================================================================
  # AlertDeliveryNotDelivering — the rule that says the rules go nowhere.
  # ===========================================================================
  # This is the estate's CURRENT state: no Alertmanager exists (#98), and
  # prometheus.yaml discovers one by pod label rather than naming an address
  # precisely so this gauge reads 0 instead of reporting a configured
  # destination that resolves to nothing.
  - interval: 1m
    name: no Alertmanager discovered
    input_series:
      - series: 'prometheus_notifications_alertmanagers_discovered{instance="prometheus:9090", job="kanz-pods"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: AlertDeliveryNotDelivering
        exp_alerts:
          - exp_labels:
              severity: warning
              layer: operational
              instance: prometheus:9090
              job: kanz-pods
            exp_annotations:
              summary: "Prometheus has found NO Alertmanager — every alert on this page is being delivered to nobody"
              description: "Prometheus is evaluating its rules and discovering zero Alertmanagers, so no alert leaves this process: nothing is paged, nothing is ticketed, and every other alert visible here reached a human only because that human happened to look. This is the known state of the estate (#98 — there is nowhere to run one and no receiver has a real destination), NOT a regression. It clears on its own once a pod labelled app=alertmanager exists in kanz-observability; prometheus.yaml discovers it rather than naming an address, so there is no configuration change to remember."

  # AND IT CLEARS BY ITSELF. This is what #98 landing looks like: one
  # Alertmanager discovered, and the banner is gone with no edit to any config.
  # Asserted because a rule that could not resolve would be a permanent alert
  # nobody could ever silence, which is the anti-pattern alerts/README.md
  # records for DataQualityMetricsMissing.
  - interval: 1m
    name: an Alertmanager appears and the banner clears
    input_series:
      - series: 'prometheus_notifications_alertmanagers_discovered{instance="prometheus:9090", job="kanz-pods"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: AlertDeliveryNotDelivering
        exp_alerts: []

  # THE INFERENCE POOL PINNED AT ITS ADMISSION LIMIT (#334).
  #
  # in_flight sits at 8 against a configured limit of 8 for the whole hour, so
  # the ratio is exactly 1.0 — the edge the rule derives from the limit rather
  # than from an observation. Every request arriving in that window is refused.
  - interval: 1m
    name: the inference pool is pinned at its admission limit
    input_series:
      - series: 'kanz_inference_predict_in_flight'
        values: '8x60'
      - series: 'kanz_inference_admission_limit'
        values: '8x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: InferencePoolSaturated
        exp_alerts:
          - exp_labels:
              severity: warning
              layer: operational
            exp_annotations:
              summary: "The inference prediction pool has been at its admission limit for 10 minutes"
              description: "kanz_inference_predict_in_flight has sat at or above kanz_inference_admission_limit continuously for ten minutes, so this is saturation rather than a burst: every request arriving now is refused and counted as kanz_inference_degraded_total{reason=\"pool_saturated\"}. Either the concurrency limit is too low for the offered load or predictions are taking long enough to hold slots open — compare kanz_inference_predict_seconds over the same window before raising the limit, because raising it against slow predictions moves the queue rather than draining it."

  # A BUSY POOL IS NOT A SATURATED ONE, AND A BURST IS NOT AN INCIDENT.
  #
  # This is the half #334 asks for by name — "the rule must also survive the
  # inverse: a healthy ratio must NOT fire, or it is an alert that pages on
  # normal operation and will be muted within a week."
  #
  # Two shapes that must stay silent, in one case so neither can be lost:
  #   · a pool running hot but below its limit (7 of 8) for the whole hour;
  #   · a pool that TOUCHES its limit for five minutes and recedes — admission
  #     control doing exactly what it exists to do. Five minutes is deliberately
  #     inside the 10m `for`, so this case fails the moment someone shortens the
  #     debounce to "make the alert more responsive".
  - interval: 1m
    name: a hot pool and a brief burst are both silent
    input_series:
      - series: 'kanz_inference_predict_in_flight'
        values: '7x20 8x5 7x35'
      - series: 'kanz_inference_admission_limit'
        values: '8x60'
    alert_rule_test:
      # DURING the burst, four minutes in. With `for: 10m` this is PENDING and
      # not firing; with a shortened debounce it fires here. Evaluating only
      # after the burst had receded would have proved nothing about the
      # debounce at all — the first version of this test did exactly that, and
      # the mutation that shortens `for` passed against it.
      - eval_time: 24m
        alertname: InferencePoolSaturated
        exp_alerts: []
      - eval_time: 40m
        alertname: InferencePoolSaturated
        exp_alerts: []

  # ===========================================================================
  # dr_recoverability (#624) — is the backup still working?
  # ===========================================================================
  # Every rule in this group reads a CloudNativePG collector metric that nothing
  # in this repository can verify: no CNPG version is pinned and the dev rig has
  # no CNPG at all. These cases prove the EXPRESSIONS are right — that each fires
  # on the failure it names and stays quiet on the healthy shape beside it. They
  # cannot prove the metric NAMES match the deployed operator, which is what
  # PostgresBackupTelemetryMissing exists to announce at runtime.

  # A cluster whose daily 02:00 base backup stopped 27 hours ago.
  - interval: 5m
    name: the base backup stopped
    input_series:
      # The value is a unix timestamp; promtool starts time() at 0, so a backup
      # recorded at t=0 is exactly as old as the evaluation time.
      - series: 'cnpg_collector_last_available_backup_timestamp{namespace="kanz-data", pod="kanz-orders-1"}'
        values: '0x330'
    alert_rule_test:
      - eval_time: 27h
        alertname: PostgresBackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
              layer: operational
              namespace: kanz-data
              pod: kanz-orders-1
            exp_annotations:
              summary: "No completed Postgres base backup for kanz-orders-1 in over 26 hours"
              description: "The daily 02:00 ScheduledBackup has not produced a completed base backup for more than 26 hours. Point-in-time recovery is base backup + replayed WAL, so however healthy the WAL archive is, there is an ageing base to replay onto and the recoverable window is now bounded by whatever the last successful backup was. Check the Backup objects (kubectl -n kanz-data get backup), then the kanz-dr-s3 credentials and the bucket — that secret is created out of band and its rotation is invisible to this cluster until a backup tries to use it."

  # THE 26h THRESHOLD, EXECUTED. A cluster backed up two hours ago must stay
  # silent — otherwise this rule pages every night for a healthy estate.
  - interval: 5m
    name: a backup from two hours ago is not stale
    input_series:
      - series: 'cnpg_collector_last_available_backup_timestamp{namespace="kanz-data", pod="kanz-books-1"}'
        values: '90000x330'
    alert_rule_test:
      - eval_time: 27h
        alertname: PostgresBackupStale
        exp_alerts: []

  # The newest thing the cluster did was fail a backup.
  - interval: 1m
    name: the most recent backup attempt failed
    input_series:
      - series: 'cnpg_collector_last_available_backup_timestamp{namespace="kanz-data", pod="kanz-books-1"}'
        values: '1000x60'
      - series: 'cnpg_collector_last_failed_backup_timestamp{namespace="kanz-data", pod="kanz-books-1"}'
        values: '2000x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: PostgresBackupFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              layer: operational
              namespace: kanz-data
              pod: kanz-books-1
            exp_annotations:
              summary: "The most recent Postgres backup attempt for kanz-books-1 FAILED"
              description: "The last failed backup is more recent than the last successful one, so the newest thing this cluster tried to do was fail. Every hour this persists is an hour added to the worst-case recovery point. Read the failure from the Backup object's status (kubectl -n kanz-data describe backup) rather than guessing: the common causes are an expired or rotated kanz-dr-s3 key, a bucket policy change, and the object store rejecting on quota."

  # A cluster that failed a backup YESTERDAY and has succeeded since must be
  # silent. Without the ordering this rule would latch on any historical failure.
  - interval: 1m
    name: an older failure followed by a success is not a failing backup
    input_series:
      - series: 'cnpg_collector_last_available_backup_timestamp{namespace="kanz-data", pod="kanz-books-1"}'
        values: '5000x60'
      - series: 'cnpg_collector_last_failed_backup_timestamp{namespace="kanz-data", pod="kanz-books-1"}'
        values: '2000x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: PostgresBackupFailing
        exp_alerts: []

  # archive_command failing: the RPO killer with no other symptom.
  - interval: 1m
    name: WAL archiving is failing
    input_series:
      - series: 'cnpg_pg_stat_archiver_failed_count{namespace="kanz-data", pod="kanz-orders-1"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: PostgresWALArchiveFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              layer: operational
              namespace: kanz-data
              pod: kanz-orders-1
            exp_annotations:
              summary: "Postgres WAL archiving is failing on kanz-orders-1 — the RPO is no longer bounded"
              description: "pg_stat_archiver reports failed archive attempts over the last 15 minutes and has kept reporting them. cluster.yaml claims archive_timeout=30s bounds the object-store RPO to <=30s; that claim is void while this fires, and the real recovery point is the last WAL segment that reached the bucket. Postgres does NOT stop when archiving fails — it retains WAL in pg_wal and retries, so the second failure mode is the volume filling (10-100Gi depending on the cluster) and taking the primary down with it."

  # A counter that recorded failures in the past and has been FLAT since must be
  # silent: the archive recovered, and increase() over the window is what says so.
  - interval: 1m
    name: a flat archiver failure count is a recovered archive
    input_series:
      - series: 'cnpg_pg_stat_archiver_failed_count{namespace="kanz-data", pod="kanz-orders-1"}'
        values: '17x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: PostgresWALArchiveFailing
        exp_alerts: []

  # Both ends of the window look fresh; the span between them has collapsed.
  - interval: 1m
    name: the PITR window has collapsed to under a day
    input_series:
      - series: 'cnpg_collector_last_available_backup_timestamp{namespace="kanz-data", pod="kanz-risk-1"}'
        values: '100000x120'
      - series: 'cnpg_collector_first_recoverability_point{namespace="kanz-data", pod="kanz-risk-1"}'
        values: '50000x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: PostgresPITRWindowShrinking
        exp_alerts:
          - exp_labels:
              severity: warning
              layer: operational
              namespace: kanz-data
              pod: kanz-risk-1
            exp_annotations:
              summary: "Point-in-time recovery for kanz-risk-1 reaches back less than 24 hours"
              description: "The span between the earliest recoverable point and the latest backup is under a day, against a declared retentionPolicy of 30d. Restoring to any instant before that window is no longer possible. On a newly bootstrapped cluster this is expected until the second base backup completes and clears by itself; on an established one it means retention is pruning what the policy says to keep, or the archive only recently began working — in which case the 30d in cluster.yaml is a number nobody can honour."

  # A healthy 30-day window must be silent.
  - interval: 1m
    name: a thirty-day recovery window is healthy
    input_series:
      - series: 'cnpg_collector_last_available_backup_timestamp{namespace="kanz-data", pod="kanz-risk-1"}'
        values: '2600000x120'
      - series: 'cnpg_collector_first_recoverability_point{namespace="kanz-data", pod="kanz-risk-1"}'
        values: '8000x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: PostgresPITRWindowShrinking
        exp_alerts: []

  # The DR region falling outside the RPO it exists for.
  - interval: 1m
    name: the standby has fallen five minutes behind
    input_series:
      - series: 'cnpg_pg_replication_lag{namespace="kanz-data", pod="kanz-orders-2"}'
        values: '600x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: PostgresStandbyLagging
        exp_alerts:
          - exp_labels:
              severity: critical
              layer: operational
              namespace: kanz-data
              pod: kanz-orders-2
            exp_annotations:
              summary: "Postgres standby kanz-orders-2 is more than 5 minutes behind its primary"
              description: "Replication lag has exceeded 300s for fifteen minutes. The DR-01e target is an RPO under one minute and the streaming replica is what delivers it, so this is the DR region silently falling outside the objective it exists for. Between quarterly drills nothing else looks at this number. If the standby has stopped entirely rather than fallen behind, the promotion in infra/dr/failover.sh will still succeed and will bring up data this far out of date."

  # A standby a few seconds behind is a working standby.
  - interval: 1m
    name: a standby seconds behind is healthy
    input_series:
      - series: 'cnpg_pg_replication_lag{namespace="kanz-data", pod="kanz-orders-2"}'
        values: '4x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: PostgresStandbyLagging
        exp_alerts: []

  # THE RULE THAT CATCHES THE OTHER FIVE BEING WRONG. Postgres pods ARE being
  # scraped and none of them export the backup metric — every rule above is
  # evaluating an empty vector and cannot fire.
  - interval: 1m
    name: kanz-data is scraped but exports no backup telemetry
    input_series:
      - series: 'up{namespace="kanz-data", pod="kanz-orders-1", job="kanz-pods"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: PostgresBackupTelemetryMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              layer: operational
            exp_annotations:
              summary: "Postgres pods in kanz-data are being scraped but report no backup telemetry"
              description: "Prometheus has live targets in kanz-data and none of them export cnpg_collector_last_available_backup_timestamp, so every backup and recoverability alert in this group is evaluating an empty vector and CANNOT fire. Recoverability is currently unobserved, and it looks exactly like recoverability being fine. Either the CNPG metrics exporter is not running on 9187, or the metric names in this rule group are wrong for the CloudNativePG version actually deployed — check `kubectl -n kanz-data port-forward <pod> 9187:9187` and read /metrics before trusting any other rule here."

  # THE DEV-RIG CASE, AND THE REASON THIS IS NOT THE absent() ANTI-PATTERN. A rig
  # running postgres-dev.yaml has no CNPG and no kanz-data targets at all, so the
  # gate is false and this stays silent. Without the `count(up{...}) > 0` clause
  # it would fire permanently on every developer's cluster, which is precisely
  # what got DataQualityMetricsMissing deleted.
  - interval: 1m
    name: a rig with no kanz-data targets stays silent
    input_series:
      - series: 'up{namespace="kanz-services", pod="api-gateway-1", job="kanz-pods"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: PostgresBackupTelemetryMissing
        exp_alerts: []

  # And once the exporter reports, it clears by itself.
  - interval: 1m
    name: telemetry present clears the missing-telemetry alert
    input_series:
      - series: 'up{namespace="kanz-data", pod="kanz-orders-1", job="kanz-pods"}'
        values: '1x60'
      - series: 'cnpg_collector_last_available_backup_timestamp{namespace="kanz-data", pod="kanz-orders-1"}'
        values: '90000x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: PostgresBackupTelemetryMissing
        exp_alerts: []

  # ===========================================================================
  # bus_connectivity (#636) — losing the spine says so
  # ===========================================================================

  # A process that lost the spine and has not got it back.
  - interval: 30s
    name: the spine is gone
    input_series:
      - series: 'kanz_bus_connected{namespace="kanz-services", pod="oms-0", client="oms"}'
        values: '1 1 0x20'
    alert_rule_test:
      - eval_time: 8m
        alertname: BusDisconnected
        exp_alerts:
          - exp_labels:
              severity: critical
              layer: operational
              namespace: kanz-services
              pod: oms-0
              client: oms
            exp_annotations:
              summary: "oms-0 has lost the NATS spine (oms)"
              description: "This process has held no NATS connection for two minutes. It cannot publish, cannot receive fills, and cannot hear a declared halt — so it can no longer know whether it is safe to trade, which is the reason pkg/bus's doc says a trading process must learn about a disconnect. MaxReconnects is -1, so it will keep retrying and will NOT crash: the pod stays Ready and the process stays alive with nothing flowing. Check the broker first (kubectl -n kanz-messaging get pods), then this pod's egress and its NATS credentials."

  # THE 2m HOLD, EXECUTED. A broker rolling restart takes the connection away for
  # well under a minute; paging on that would make this rule noise.
  - interval: 30s
    name: a brief reconnect during a broker restart is not an outage
    input_series:
      - series: 'kanz_bus_connected{namespace="kanz-services", pod="oms-0", client="oms"}'
        values: '1 1 0 0 1x20'
    alert_rule_test:
      - eval_time: 8m
        alertname: BusDisconnected
        exp_alerts: []

  # FLAPPING THE GAUGE CANNOT SEE: connected reads 1 at every sample, and the
  # counter still shows three drops.
  - interval: 30s
    name: repeated short drops the gauge misses
    input_series:
      - series: 'kanz_bus_connected{namespace="kanz-services", pod="gw-0", client="api-gateway"}'
        values: '1x40'
      - series: 'kanz_bus_connection_events_total{namespace="kanz-services", pod="gw-0", client="api-gateway", event="disconnected"}'
        values: '0 1 2 3 3x40'
    alert_rule_test:
      # BusDisconnected must stay silent — the gauge never read 0. That is the
      # whole reason the counter exists.
      - eval_time: 12m
        alertname: BusDisconnected
        exp_alerts: []
      - eval_time: 12m
        alertname: BusConnectionFlapping
        exp_alerts:
          - exp_labels:
              severity: warning
              layer: operational
              namespace: kanz-services
              pod: gw-0
              client: api-gateway
              event: disconnected
            exp_annotations:
              summary: "gw-0 has reconnected to the spine repeatedly (api-gateway)"
              description: "Three or more disconnects in fifteen minutes. Each one is brief enough that kanz_bus_connected is likely still reading 1 at every scrape, so BusDisconnected cannot fire on this — that rule sees state, this one sees edges. In-flight publishes are being buffered and redelivered across each gap, and consumers are re-establishing their durables each time. Look for a broker under memory pressure, a node draining repeatedly, or an unstable network path before it becomes a full outage."

  # ONE reconnect is a broker restart, not a flap.
  - interval: 30s
    name: a single reconnect is not flapping
    input_series:
      - series: 'kanz_bus_connection_events_total{namespace="kanz-services", pod="gw-0", client="api-gateway", event="disconnected"}'
        values: '0 1 1x40'
    alert_rule_test:
      - eval_time: 12m
        alertname: BusConnectionFlapping
        exp_alerts: []

  # The delivery path faulting mid-run, which had no surface at all before #636.
  - interval: 1m
    name: asynchronous consume errors
    input_series:
      - series: 'kanz_bus_consume_errors_total{namespace="kanz-services", pod="compliance-0", subject="order.order.filled", group="compliance"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: BusAsyncConsumeErrors
        exp_alerts:
          - exp_labels:
              severity: critical
              layer: operational
              namespace: kanz-services
              pod: compliance-0
              subject: order.order.filled
              group: compliance
            exp_annotations:
              summary: "Asynchronous consume errors on order.order.filled (compliance)"
              description: "JetStream has reported delivery-path errors on this subscription for fifteen minutes — missed heartbeats, a consumer that no longer exists, or a leadership change that did not settle. Deliveries on this subject may have STOPPED while the process stays healthy and Ready, so nothing else in this alerting layer will say so. Check whether the stream and consumer still exist (nats consumer info), which is the state that crash-looped compliance and tv-sync when it happened at startup instead of mid-run."

  # A consumer that hit errors and RECOVERED must go quiet: the counter is flat.
  - interval: 1m
    name: a recovered consumer stops alerting
    input_series:
      - series: 'kanz_bus_consume_errors_total{namespace="kanz-services", pod="compliance-0", subject="order.order.filled", group="compliance"}'
        values: '9x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: BusAsyncConsumeErrors
        exp_alerts: []

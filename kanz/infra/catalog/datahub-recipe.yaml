# Optional metadata-only catalog. projection.py validates exact dataset mappings
# before writing this supported DataHub source. No default steward or PII tag.
source:
  type: file
  config:
    path: "${KANZ_CATALOG_METADATA_FILE}"
sink:
  type: datahub-rest
  config:
    server: "${DATAHUB_GMS_URL}"
    mode: SYNC
    extra_headers:
      Authorization: "${DATAHUB_GMS_AUTHORIZATION}"

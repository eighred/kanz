---
# Progressive delivery for risk-engine (CICD-01e). An Argo Rollouts `Rollout`
# (drop-in for Deployment) does a canary rollout gated by metric analysis, and
# AUTO-ROLLS-BACK (aborts → scales the canary to zero, stable untouched) the
# moment the analysis fails. Replica-based canary — no service mesh required —
# which fits risk-engine: it's a NATS consumer + gRPC query service, not an
# HTTP-traffic-split workload.
#
# Ties the delivery epic to the security epic: the pod runs the CICD-01c/d
# SIGNED image (admission verifies it, CICD-01d), authenticates with its SEC-01a
# SVID (SPIFFE CSI socket + the risk-engine ServiceAccount), and reads its DB
# DSN from the SEC-01d Vault/CSI secret file — never a plaintext env var.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: risk-engine
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
imagePullSecrets:
  - name: ghcr-pull
---
apiVersion: v1
kind: Service
metadata:
  name: risk-engine
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  selector:
    app: risk-engine
  ports:
    - { name: http, port: 8081, targetPort: 8081 }
    # The risk QUERY surface (API-01b) the api-gateway dials for every read route —
    # /v1/portfolios/{id}/exposure and the rest. It was never exposed: the gateway is
    # configured for risk-engine.kanz-services.svc:9090 and this Service published
    # only 8081, so every one of those routes was dead at the network layer.
    - { name: grpc, port: 9090, targetPort: 9090 }
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: risk-engine
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: risk-engine
  strategy:
    canary:
      # Progressive steps: shift a slice of pods to the new revision, hold,
      # then run analysis. A failed analysis aborts the whole rollout =
      # automatic rollback to the stable revision.
      steps:
        - setWeight: 20
        - pause: { duration: 60s }
        - analysis:
            templates:
              - templateName: risk-engine-canary
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 50
        - pause: { duration: 120s }
        - analysis:
            templates:
              - templateName: risk-engine-canary
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 100
  template:
    metadata:
      labels:
        app: risk-engine
        app.kubernetes.io/part-of: kanz
      annotations:
        # Scraped by infra/observability/prometheus.yaml (role: pod discovery).
        # The port is the HTTP surface, NOT the gRPC one: a scrape against gRPC
        # cannot succeed, and the result is a DOWN target rather than an error.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
    spec:
      # Drain budget: DERIVED, and this is the workload that drives it. Everything
      # else here spends the 15s HTTP drain and 5s OTLP flush spelled in its main;
      # risk-engine ALSO spends internal/app/lifecycle.go's DefaultShutdownTimeout,
      # under which the whole ordered drain runs — including the checkpoint. That
      # 20s was invisible to the guard until #264, which is why this file read 45
      # against a path that could take 47. The floor is recomputed from the source
      # by test/arch/pod_disruption_and_drain_test.go on every run; no arithmetic
      # is restated here, because the version that was restated went stale.
      terminationGracePeriodSeconds: 60
      serviceAccountName: risk-engine
      # SEC-02a runtime hardening (pod-level): non-root, default seccomp. The
      # canonical values live in infra/security/runtime/pod-security.yaml; the
      # "restricted" PSS label on the namespace rejects a pod that drops them.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # INFRA-01d: spread replicas across AZs so a single-AZ loss (INFRA-01e)
      # leaves the survivors serving. maxSkew 1 = as even as schedulable;
      # ScheduleAnyway (not DoNotSchedule) so a saturated AZ degrades placement
      # rather than blocking a scale-up (INFRA-01c) or a rollout.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: risk-engine
      # INFRA-M6a: apply 0001_state.sql / 0002_tenant_rls.sql before the engine
      # starts. Nothing applied these before — the tables existed only where a
      # human or a test had created them. All 3 replicas run this against one
      # database simultaneously; kanz-migrate's advisory lock serializes them, so
      # one applies and the others exit 0 with nothing to do.
      #
      # Separate DDL-capable DSN: the engine itself connects as a non-superuser so
      # FORCE RLS applies to it (MT-01d), and therefore cannot create tables.
      initContainers:
        - name: migrate
          image: ghcr.io/eighred/kanz-migrate@sha256:909865997d2e96fd9898c5c34a6f11ade3cd65b71a18f1424d0bcda118e0e689
          args: ["--dir", "/migrations/risk-engine"]
          env:
            - { name: KANZ_MIGRATE_DATABASE_URL_FILE, value: /run/secrets/db/migrate-database-url }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: db, mountPath: /run/secrets/db, readOnly: true }
      containers:
        - name: risk-engine
          # Pinned to a digest in production (set by the GitOps bump); the
          # CICD-01d admission policy rejects it unless cosign-signed.
          image: ghcr.io/eighred/risk-engine@sha256:66441aea5636ca12f1dd59634afa2fc7dcc251a2c8c6a97ce08fc82fd952eca2
          ports:
            - { containerPort: 8081, name: http }
            - { containerPort: 9090, name: grpc }
          env:
            # DSN from the SEC-01d CSI secret file, not a plaintext env.
            - { name: RISK_ENGINE_DATABASE_URL_FILE, value: /run/secrets/db/database-url }
            - { name: RISK_ENGINE_NATS_URL, value: "nats://nats.kanz-messaging.svc:4222" }
            - { name: RISK_ENGINE_KAFKA_BROKERS, value: "kafka.kanz-messaging.svc:9094" }
            - { name: RISK_ENGINE_SOURCE, value: "risk-engine" }
            # THE QUERY SERVER STARTS ONLY WHEN THIS IS SET. cfg.GRPCListen has no
            # default and this manifest never set it, so risk-engine ran "probes +
            # ingestion only" (its own config comment) — the gRPC read surface the
            # gateway exists to proxy was never listening. Combined with the Service
            # not publishing 9090, the gateway's entire risk read path was dead in
            # three independent ways at once.
            - { name: RISK_ENGINE_GRPC_LISTEN, value: ":9090" }
            # RISK_ENGINE_SPIFFE_SOCKET, *not* SPIFFE_ENDPOINT_SOCKET — this service
            # reads the prefixed name (internal/config), as api-gateway and copilot do.
            # The manifest set the unprefixed spelling, so cfg.SPIFFESocket was EMPTY
            # while the variable and the mounted CSI volume both looked correct.
            #
            # Two things degraded silently and neither is visible in a pod listing: the
            # mesh stayed disabled, so this service could not reach the mTLS-only NATS;
            # and its gRPC query surface would serve PLAINTEXT if it were started — an
            # unauthenticated read over the fund's risk positions, logged as a warning.
            #
            # THAT IS WHY BOTH LINES BELONG TOGETHER: the listener the line above starts
            # is only authenticated because of this one. Enabling the query surface
            # without the correct socket name would have exposed it in the clear.
            - { name: RISK_ENGINE_SPIFFE_SOCKET, value: "unix:///run/spiffe/spire-agent.sock" }
            # THE ONE *_REQUIRE_* CONTROL IN THIS ESTATE THAT SHIPS TRUE (#471).
            #
            # It arms the SR 11-7 model-validation gate: an analytic in
            # benchmarks.Inventory() that holds no current, passing, signed
            # validation — and that benchmarks.ValidationExemptions() does not name
            # with a reason — stops this pod at startup instead of pricing the book
            # unchecked. Eleven of the twelve hold one; isda_simm is the single named
            # exemption, because ISDA SIMM's calibration AND aggregation are
            # member-licensed and a case set built from the representative magnitudes
            # this estate ships would grade our arithmetic against our own.
            #
            # WHY NOT "false" LIKE OMS_REQUIRE_MANDATE AND THE REST. Those refuse over
            # ESTATE DATA an operator has to go and fix — unmandated portfolios,
            # unverified accounts — so arming them is a trading outage until a backlog
            # is cleared. This one refuses over the analytics in this same image, and
            # there is no estate state it can trip over, so shipping it false would
            # deploy the exact posture #471 was filed about — a complete gate nobody
            # turned on.
            #
            # THE EVIDENCE IS RECOMPUTED ON EVERY BOOT, NOT BAKED INTO THE IMAGE: the
            # case sets RUN here, against the pricers in this process. That is safe
            # only because every image is single-arch (build.yml passes no
            # `platforms:`) and CI runs the same case sets on the same ubuntu-latest
            # architecture, so IEEE-754 makes the pod's floats the ones CI graded.
            # PUBLISHING A MULTI-ARCH IMAGE BREAKS THAT and can CrashLoopBackOff every
            # replica on the arch CI did not run — see the long comment on
            # Config.RequireValidatedAnalytics before adding `platforms:`.
            #
            # WHAT THIS POD DOES DIFFERENTLY ON THE FIRST BOOT AFTER THIS MERGES:
            # nothing. The eleven pass and the twelfth is exempt, so it logs "risk
            # analytics: VALIDATION REQUIRED" instead of the previous WARN and serves.
            # What CHANGES is the next deploy that adds an analytic without a
            # benchmark, or whose pricer stops reproducing its published value: that
            # one CrashLoopBackOffs every replica rather than moving one series on a
            # gauge nobody alerts on. kanz_risk_analytics_validation_enforced reports
            # which posture is live; the per-analytic zeroes stay on
            # kanz_risk_analytics_validated with state="exempt" for the licensed one.
            #
            # Set to "false" to fall back to counting-and-warning. Anything that is
            # not a boolean refuses the start rather than disarming silently, as does
            # the near-miss spelling RISK_ENGINE_REQUIRE_VALIDATED_ANALYTICS — note
            # this key is NOT prefixed, which is the name #471 gave it.
            - { name: RISK_REQUIRE_VALIDATED_ANALYTICS, value: "true" }
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 5
          # SEC-02a runtime hardening (container-level): read-only rootfs, no
          # privilege escalation, all caps dropped. The static Go binary needs
          # none; writable scratch is the explicit /tmp emptyDir below.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: db, mountPath: /run/secrets/db, readOnly: true }
            - { name: spiffe, mountPath: /run/spiffe, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: db
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: risk-engine-db
        - name: spiffe
          csi:
            driver: csi.spiffe.io
            readOnly: true

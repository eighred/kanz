# INFRA-01d — availability guards for kanz-services: disruption budgets +
# namespace resource governance. Pairs with the multi-AZ topology spread on the
# workloads themselves (risk-engine-rollout.yaml).
#
# PodDisruptionBudget bounds VOLUNTARY disruption (node drain, upgrade, the
# SRE-01c/INFRA-01e chaos) — at least 2 risk-engine replicas stay up, so a drain
# can't take the service below quorum. Involuntary AZ loss is covered by the
# topology spread + the KEDA floor (minReplicaCount 3).
#
# ===== THE ESTATE-WIDE DRAIN POLICY (#234) — read before adding a workload =====
#
# Until #234, four workloads had a PodDisruptionBudget and sixteen did not, and
# NOTHING under infra/deploy set terminationGracePeriodSeconds. Both gaps are now
# default-deny in test/arch/pod_disruption_and_drain_test.go, so a new workload
# cannot be added without answering the two questions below.
#
# 1. WHICH BUDGET SHAPE. Each PDB lives next to the workload it protects, so the
#    replica count and the budget cannot drift into separate files.
#
#    - replicas >= 2  ->  `maxUnavailable: 1`. It bounds the drain to one pod at
#      a time at ANY replica count. `minAvailable: 1` does not: on market-data at
#      the KEDA ceiling of 16 it permits evicting fifteen pods simultaneously.
#      (The PDBs that predate #234 — risk-engine here, oms, wealth, datamaster,
#      copilot, alternatives — still use minAvailable and were left alone; they
#      are protective, just weaker than they read. Converting them is its own
#      change with its own blast radius, not a drive-by.)
#
#    - replicas == 1 as a CORRECTNESS pin (`kanz.io/singleton: "true"`)  ->
#      `minAvailable: 1`, which makes allowed-disruptions ZERO and blocks
#      voluntary eviction outright. THIS IS DELIBERATE, and it is the same call
#      operator-deploy.yaml already made and documented ("Refusing to evict the
#      only replica ... is exactly its job"). The alternative is worse and quiet:
#      drain venue-binance unbounded at 03:00 and Binance's user-data WebSocket,
#      which carries NO replay, drops every fill that lands during the reschedule
#      — the OMS never learns of them and order state diverges from exchange
#      state with nothing reporting it. A stalled drain is loud, bounded and
#      recoverable; a lost fill is none of those. The cost is real and is named
#      here so it is known before the next node upgrade rather than during it: a
#      node running one of these cannot be drained unattended. Drain it with
#      --disable-eviction, or scale the workload to 0 for the window and back to
#      1 after — an operator decision, taken awake.
#
# 2. HOW LONG THE POD NEEDS TO STOP. terminationGracePeriodSeconds: 60 on every
#    workload, and it is derived, not copied from a blog post. A kanz service's
#    shutdown path runs SEQUENTIALLY after SIGTERM, and the terms are:
#        bus drain    DrainGrace + drainStopSlack (pkg/bus/nats.go), estate-wide
#        HTTP         the httpSrv.Shutdown budget in services/*/cmd/*/main.go
#        OTLP flush   the deferred obs.Shutdown in the same main
#        + whatever a main reaches THROUGH a package it calls — for risk-engine,
#          internal/app/lifecycle.go's DefaultShutdownTimeout, which bounds the
#          entire ordered drain including the checkpoint
#    THE TOTAL IS NOT WRITTEN HERE ON PURPOSE. It was, and it said 27 for months
#    after the real figure had grown — first to 37 when #233 added the consumer
#    join, then to 47 once #264 made the guard see risk-engine's lifecycle at all,
#    which is 2s PAST the 45 this file used to mandate. A number restated in
#    twenty-four manifests and one paragraph is a number that will be wrong in
#    twenty-five places. test/arch/pod_disruption_and_drain_test.go recomputes it
#    from the source on every run and fails the build when a manifest no longer
#    covers it; run that test to see today's figure.
#
#    60 rather than the derived floor exactly: the grace period is a DEADLINE, not
#    a sleep — a pod that finishes draining in 3s terminates in 3s — so headroom
#    costs nothing on a healthy drain and buys the next timeout change without a
#    twenty-four-file edit. The same guard bounds it from above at 90, past which
#    a routine node upgrade stops being routine. (infra/nats/nats.yaml:184 is
#    still 45; NATS is outside infra/deploy and drains on its own terms.)
#
#    The derived floor is an UPPER BOUND, not a measurement. The bus term is added
#    to every service, including the two shapes that already contain it inside a
#    larger watchdog — risk-engine's drain and accounting/wealth/alternatives'
#    consumer join — so the strict wall-clock worst case is ~7s below the figure
#    the guard reports. That conservatism is deliberate and stays: proving the bus
#    drain is subsumed requires reasoning about concurrency in twenty-six mains,
#    and an over-stated floor costs headroom while an under-stated one costs a
#    truncated drain.
#
#    Raising the grace, rather than shortening a timeout, is the deliberate call
#    for the workload that drives the floor. risk-engine's largest term is the
#    drain watchdog, and what it is spending that time on is the checkpoint —
#    cutting it to fit a manifest self-inflicts precisely the abandoned checkpoint
#    the grace period exists to prevent.
#
#    NO preStop HOOK IS SET, deliberately. A preStop sleep would close a DIFFERENT
#    hole (kube-proxy still routing to a pod that has already stopped accepting),
#    and the runtime image is distroless-static:nonroot with no shell, so the only
#    available form is the native `lifecycle.preStop.sleep`. That field needs the
#    API server at >= 1.29; the only evidence this estate is there is the `1.30`
#    default in infra/terraform/variables.tf:23, and there is no cluster to check
#    it against. Adding a field the API server may reject would fail the whole
#    manifest's apply. Left out, and named, rather than guessed.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: risk-engine
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: risk-engine
---
# ResourceQuota caps the namespace's total compute, so a runaway scale-out
# (INFRA-01c) or a bad deploy can't starve the cluster / other tenants of the
# shared node pool.
#
# THESE NUMBERS ARE DERIVED, NOT CHOSEN, AND A GUARD RE-DERIVES THEM (#231).
# The previous values (requests.cpu 24 / limits.cpu 48) carried the sentence
# "Sized above the KEDA maxReplicaCount headroom" and were not: the declared
# ceilings sum to 86 pods, which at the LimitRange defaultRequest below is 43
# CPU — nearly double the 24 that was granted. Nothing compared the two numbers,
# so the shortfall was invisible until it mattered. Its failure mode is the worst
# available: a market event drives KEDA up, pod creation starts returning
# `exceeded quota`, and that surfaces ONLY as a ReplicaSet Event. The platform
# refuses to scale during exactly the event scaling exists for, and reports it
# nowhere an alert can see.
#
# test/arch/namespace_quota_headroom_test.go recomputes the whole sum from these
# manifests on every CI run and fails if the quota cannot fund it — so raising a
# maxReplicaCount without raising the quota is a red build, not a 3am surprise:
#
#   ceiling(w)  = max(spec.replicas, the KEDA ScaledObject's maxReplicaCount)
#   surge       = the largest single workload's rolling-update surge (one
#                 rolling update at a time WHILE at ceiling; market-data at 16
#                 with the default 25% maxSurge = 4 pods). Modelling every
#                 workload surging at once would size the quota for a case no
#                 one should ever run, and a quota that funds everything bounds
#                 nothing.
#   pods        = Σ ceiling(w) + surge = 88 + 4 = 92
#
# QUOTA COUNTS CONTAINERS, NOT PODS, and one workload now carries two (#241):
# inference runs a spiffe-helper SIDECAR that materialises its SVID as PEM files,
# because nats-py cannot speak the SPIFFE Workload API. At inference's ceiling of
# 2 that is 2 extra containers. Its spiffe-helper-init container costs nothing
# here — the guard applies Kubernetes' own formula, max(sum(containers),
# max(initContainers)), and an init container that runs to completion before the
# app starts only raises the floor.
#
#   containers  = 92 + 2 = 94
#   requests    = 94 x (500m, 512Mi)  = 47 CPU, 47Gi   ← LimitRange defaults
#   limits      = 94 x (1, 1Gi)       = 94 CPU, 94Gi
#
# ONE WORKLOAD IS NO LONGER ON THE DEFAULTS, and the memory numbers above are
# adjusted for it (#228). postgres-dev.yaml now declares max_connections=400 —
# derived there from the estate's own pool sizing — and 400 backends do not fit
# in the 1Gi default limit, so that container carries an explicit 2Gi/4Gi memory
# block. It is the only container on the estate whose memory is a function of a
# number in its own argv. CPU is untouched, so only the two memory terms move:
#
#   requests.memory = 93 x 512Mi + 2Gi = 49664Mi (48.5Gi)
#   limits.memory   = 93 x 1Gi   + 4Gi = 97Gi
#
# Written in Mi rather than 46.5Gi because a fractional binary quantity is the
# kind of thing that gets "tidied" to 46Gi by someone reading it as a round
# number, and 46Gi does not fund the sum.
#
# The guard also bounds these from ABOVE (2x the derivation): a quota of "1000"
# is indistinguishable from no quota at all, and would silently stop being the
# blast-radius bound this object exists to be.
# Model Portfolios (#409). replicas 2 ⇒ maxUnavailable: 1, which bounds the drain
# at ANY replica count. Nothing here is correctness-pinned to a single instance:
# the service is stateless (every market input arrives in the request), so a
# rescheduled replica loses no state and holds no exchange session.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: optimization
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: optimization
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: kanz-services
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  hard:
    requests.cpu: "47"
    requests.memory: 49664Mi
    limits.cpu: "94"
    limits.memory: 97Gi
    pods: "92"
---
# LimitRange gives every pod sane defaults + a ceiling, so a container with no
# explicit resources still gets requests (schedulable, quota-counted) and can't
# request the whole node.
#
# THESE DEFAULTS ARE UNMEASURED, AND THAT IS THE POINT OF SAYING SO (#231).
# This block used to claim "Defaults match the risk-engine request profile."
# There is no such profile: risk-engine-rollout.yaml declares no `resources:` at
# all, and when #231 was opened neither did any other workload under infra/deploy
# — so the sentence described a referent that never existed, and read as
# "measured" to everyone who has touched this file since. Every kanz-services
# container is sized by the four numbers below and by nothing else. (The one
# workload that now carries its own block is operator, and it is in kanz-operator,
# where no LimitRange reaches it; see its comment.)
#
# The consequence, stated plainly so the next reader does not have to rediscover
# it: a service whose real working set exceeds 1Gi is OOMKilled on a limit nobody
# chose for it, and the kill looks like a crash in the service rather than a
# capacity decision made here. Retiring that needs per-service measurement from a
# running estate, which the repository does not have — so the honest state is one
# declared default with its provenance attached, NOT a copy of the same guess
# pasted into 23 workloads (that is how a wrong number stops being fixable in one
# place). #231 tracks replacing these with measured per-service values.
#
# Two things depend on these numbers being here rather than absent:
#   - the ResourceQuota above is DERIVED from defaultRequest, and
#     test/arch/namespace_quota_headroom_test.go recomputes that derivation;
#   - the same guard requires every container to get a request from SOMEWHERE.
#     A container in a namespace with no LimitRange and no `resources:` block is
#     BestEffort — first evicted under node pressure, invisible to the quota, and
#     indistinguishable from a container that was deliberately sized.
apiVersion: v1
kind: LimitRange
metadata:
  name: kanz-services-defaults
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 1Gi
      defaultRequest:
        cpu: 500m
        memory: 512Mi
      max:
        cpu: "4"
        memory: 4Gi

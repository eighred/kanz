---
# One of the last services that had a database, a schema, and no way to run.
# regulatory shipped a migrations/ directory and a postgres.go and was never
# deployable: no image, no manifest. Nothing ever applied its schema either.
#
# THE SCALE INVARIANT: replicas: 2 is safe -- but only because the DATABASE owns
# the chain head.
#
#   This service was pinned to ONE replica. It read the chain Head() at startup and
#   the SIGNER carried it in-process, chaining each filing off the last one that pod
#   signed. Two pods would both start from the same head and produce two divergent
#   chains of signature links -- a forked audit chain, which is exactly what a
#   regulator would ask about, and the store's ON CONFLICT (hash) could not detect
#   it because the forked hashes differ.
#
#   linkstore.AppendChained now extends the chain ATOMICALLY: read-head -> compute
#   -> insert, inside one transaction holding a pg_advisory_xact_lock. There is no
#   in-process head left to fork. Verified red-green: with the lock removed, 16
#   concurrent writers produced 4 divergent histories.
#
#   That lock is what makes this replica count legal. If it is ever removed, this
#   manifest becomes a chain-forking engine -- put the replica count back to 1 in
#   the same edit.
#
# The DSN arrives as a SEC-01d Vault/CSI secret FILE, never a plaintext env var, and
# the kanz-migrate initContainer applies the schema before the pods start -- with a
# SEPARATE, DDL-capable credential, because the app role is a non-superuser (that is
# what makes FORCE RLS apply to it) and deliberately cannot create tables.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: regulatory
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
imagePullSecrets:
  - name: ghcr-pull
---
apiVersion: v1
kind: Service
metadata:
  name: regulatory
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  selector:
    app: regulatory
  ports:
    # THE FILING API AND /metrics ARE DIFFERENT PORTS (#765). 8083 is admitted
    # across every pod in this namespace by allow-observability-scrape, and a
    # filing appends to the AUDIT-01 hash chain — so the /v1 routes moved to
    # 8103, beside accounting's 8101 and audit's 8102, and 8083 now serves
    # metrics and nothing else.
    - { name: http, port: 8103, targetPort: 8103 }
    - { name: metrics, port: 8083, targetPort: 8083 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: regulatory
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: regulatory
  template:
    metadata:
      labels:
        app: regulatory
        app.kubernetes.io/part-of: kanz
      annotations:
        # Scraped by infra/observability/prometheus.yaml (role: pod discovery).
        # The port is the HTTP surface, NOT the gRPC one: a scrape against gRPC
        # cannot succeed, and the result is a DOWN target rather than an error.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
    spec:
      # Drain budget: DERIVED, and deliberately not restated here. The arithmetic
      # this comment used to carry still read 27s long after the real figure had
      # grown past it (#264), so the number now lives in exactly one place:
      # test/arch/pod_disruption_and_drain_test.go recomputes the floor from the
      # source on every run and fails this file the moment 60 stops covering it.
      # See availability.yaml for what the floor is made of.
      terminationGracePeriodSeconds: 60
      serviceAccountName: regulatory
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # INFRA-01d: spread replicas across AZs.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: regulatory
      # INFRA-M6a: apply the schema BEFORE the service starts. All replicas run this
      # against one database simultaneously; kanz-migrate's advisory lock serializes
      # them, so one applies and the rest exit 0 with nothing to do.
      initContainers:
        - name: migrate
          image: ghcr.io/eighred/kanz-migrate@sha256:909865997d2e96fd9898c5c34a6f11ade3cd65b71a18f1424d0bcda118e0e689
          args: ["--dir", "/migrations/regulatory"]
          env:
            - { name: KANZ_MIGRATE_DATABASE_URL_FILE, value: /run/secrets/db/migrate-database-url }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: db, mountPath: /run/secrets/db, readOnly: true }
      containers:
        - name: regulatory
          # Pinned to a cosign-signed digest by the GitOps bump (CICD-01d).
          image: ghcr.io/eighred/regulatory@sha256:e840c47d9ce4f2f43ff6ffdedadff2ed8958a8023644d554fc904ba64b54d2c9
          ports:
            - { containerPort: 8103, name: http }
            - { containerPort: 8083, name: metrics }
          env:
            # DSN from the SEC-01d CSI secret file, not a plaintext env. It is
            # REQUIRED, and it is what the scale invariant at the top of this file
            # rests on: the DATABASE owns the chain head, so removing this env is
            # exactly the "chain-forking engine" that comment warns about. The pod
            # now REFUSES TO START (exit 2) instead, rather than silently chaining
            # in a map (#261). REGULATORY_ALLOW_EPHEMERAL_CHAIN=true opts back in
            # for a laptop and REGULATORY_SIGNER=hash needs no DSN at all; neither
            # is set here, and either one requires replicas: 1.
            - { name: REGULATORY_DATABASE_URL_FILE, value: /run/secrets/db/database-url }
            - { name: REGULATORY_LISTEN, value: ":8103" }
            - { name: REGULATORY_METRICS_LISTEN, value: ":8083" }
            - { name: SPIFFE_ENDPOINT_SOCKET, value: "unix:///run/spiffe/spire-agent.sock" }
          livenessProbe:
            httpGet: { path: /healthz, port: 8103 }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 8103 }
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: db, mountPath: /run/secrets/db, readOnly: true }
            - { name: spiffe, mountPath: /run/spiffe, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: db
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: regulatory-db
        - name: spiffe
          csi:
            driver: csi.spiffe.io
            readOnly: true
---
# INFRA-01d / #234 — regulatory had no disruption budget at all.
# Two replicas are legal only because linkstore.AppendChained keeps the chain head in
# the database; a drain to zero is not a correctness failure but a DEADLINE one, and
# a missed regulatory window is not recovered by restarting the pod.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: regulatory
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: regulatory

---
# SVCWIRE-01a / EXEC-M7c — deployable workload for the OMS (order management).
#
# The OMS is a NATS consumer (order commands in, lifecycle FACTs out) that routes
# admitted orders to a live execution venue. It is the one service on this board
# where a wrong replica count is a CAPITAL error rather than an availability one,
# so read the invariant below before changing anything in this file.
#
# THE INVARIANT: replicas > 1 REQUIRES the Postgres order store.
#
#   order.Store.Create is the admission gate — the single decision that says
#   "this delivery of this order_id owns it, and may send it to the venue."
#
#     * With OMS_DATABASE_URL set, order.Postgres enforces that gate at the
#       database: INSERT ... ON CONFLICT (tenant_id, order_id) DO NOTHING, and
#       exactly one caller sees RowsAffected=1. This holds ACROSS pods, which is
#       what makes the replicas: 2 below safe.
#     * With it unset, the OMS silently falls back to order.MemoryStore, whose
#       gate is a process-local sync.Mutex. Two pods over two in-memory maps BOTH
#       admit the same order_id and BOTH route it: the order state still converges
#       (Save is an upsert, so it looks idempotent in every dashboard) while the
#       fund trades twice. It is silent, and it costs real money.
#
#   So: dropping the db volume, deleting the OMS_DATABASE_URL_FILE env, or
#   pointing it at an unreadable secret while leaving replicas: 2 does not degrade
#   this service — it double-trades. If you must run without a database, set
#   replicas: 1 in the same edit.
#
#   AND THE SAME DSN CARRIES THE POSITION BOOK (EXEC-M18). The paragraph above was
#   true and INCOMPLETE: the durable order store made the ADMISSION GATE safe across
#   pods, and left the position book an in-process map. The projector consumes fills
#   through a durable consumer GROUP, which LOAD-BALANCES — so each of these two pods
#   folded only the fills it happened to receive, and then PUBLISHED the result as the
#   fund's ABSOLUTE position on risk.position.changed.
#
#   That is worse than a control that fails, because a projection does not merely fail
#   to act — it SPEAKS, and the risk engine, the compliance monitor, tv-sync and the
#   OMS's OWN PRE-TRADE GATE all believed it. A concentration limit evaluated against
#   half a book does not refuse loudly; it quietly says yes. On restart the map came
#   back EMPTY, so the next 0.1 BTC fill published `position = 0.1` while the fund
#   held 5.1.
#
#   Both stores now come from ONE pool and this ONE DSN, and they degrade together:
#   no OMS_DATABASE_URL ⇒ both in-process ⇒ EXACTLY ONE REPLICA, and the OMS says so
#   at WARN on every boot.
#
# Deliberately NO HorizontalPodAutoscaler and NO KEDA ScaledObject (contrast
# phase7-scaling.yaml, which scales the read services on CPU, and
# risk-engine-scaledobject.yaml, which scales on bus backpressure). The static
# dual-replica shape is the point: it exercises the cross-pod admission gate
# under real concurrency without an autoscaler changing the replica count
# underneath us. Autoscaling the OMS is a separate decision, and it is only ever
# safe while the DSN above is present.
#
# The DSN is read from the SEC-01d Vault/CSI secret FILE, never a plaintext env
# var (the risk-engine stance). Its SecretProviderClass is `oms-db`, defined in
# infra/security/secrets/secretproviderclass.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oms
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
imagePullSecrets:
  - name: ghcr-pull
---
apiVersion: v1
kind: Service
metadata:
  name: oms
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  selector:
    app: oms
  ports:
    - { name: http, port: 8090, targetPort: 8090 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oms
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  # CRITICAL: > 1 ONLY because EXEC-M7c (order.Postgres) enforces the admission
  # gate at the database via ON CONFLICT (tenant_id, order_id) DO NOTHING, which
  # holds across pods. Removing the db volume or the OMS_DATABASE_URL_FILE env
  # below drops the OMS back to a process-local in-memory gate, and THIS REPLICA
  # COUNT then double-trades every order. Change both together or neither.
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: oms
  template:
    metadata:
      labels:
        app: oms
        app.kubernetes.io/part-of: kanz
      annotations:
        # Scraped by infra/observability/prometheus.yaml (role: pod discovery).
        # The port is the HTTP surface, NOT the gRPC one: a scrape against gRPC
        # cannot succeed, and the result is a DOWN target rather than an error.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
    spec:
      # Drain budget: DERIVED, and deliberately not restated here. The arithmetic
      # this comment used to carry still read 27s long after the real figure had
      # grown past it (#264), so the number now lives in exactly one place:
      # test/arch/pod_disruption_and_drain_test.go recomputes the floor from the
      # source on every run and fails this file the moment 60 stops covering it.
      # See availability.yaml for what the floor is made of.
      terminationGracePeriodSeconds: 60
      serviceAccountName: oms
      # SEC-02a runtime hardening (pod-level): non-root, default seccomp.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # INFRA-01d: spread replicas across AZs so a single-AZ loss leaves the
      # survivor serving. Both pods share one order store, so either can admit.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: oms
      # INFRA-M6a: apply the schema BEFORE the OMS starts. Without this the pods
      # come up, connect, and fail every order with `relation "orders" does not
      # exist` — the manifest was correct and undeployable until this existed.
      #
      # Both replicas run this against ONE database at the same moment. That is
      # safe: kanz-migrate takes a pg_advisory_lock, so one pod applies and the
      # other waits and then finds nothing to do. Exit 0 with nothing applied is
      # the normal case — for the second pod, and for every restart thereafter.
      #
      # It uses a SEPARATE, DDL-capable DSN (migrate-database-url). The OMS's own
      # credential is a non-superuser, which is what makes FORCE RLS apply to it;
      # it deliberately cannot create tables.
      initContainers:
        - name: migrate
          image: ghcr.io/eighred/kanz-migrate@sha256:43799cfa71cb4ff6d5c290c2941d2f19d76b458d0c2ec0c110ee9294fc588334
          args: ["--dir", "/migrations/oms"]
          env:
            - { name: KANZ_MIGRATE_DATABASE_URL_FILE, value: /run/secrets/db/migrate-database-url }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: db, mountPath: /run/secrets/db, readOnly: true }
      containers:
        - name: oms
          # :latest, and there is only one OMS image now (INFRA-M7a).
          #
          # It used to be :venues, because an untagged OMS compiled in no exchange
          # connector and would silently simulate every order while looking healthy.
          # There are no venue build tags any more: every exchange is an
          # out-of-process adapter selected by OMS_VENUE_ENDPOINTS below, so this
          # image is identical whether it trades Binance, OKX, both, or nothing.
          #
          # What it trades is now a deployment decision, visible in the env below —
          # not a compile-time one hidden in a build arg.
          #
          # Pinned to a cosign-signed digest by the GitOps bump (CICD-01d).
          image: ghcr.io/eighred/oms@sha256:94e500afa9492a360902da2fa249c219dac3a1e158b7904697fb77b5c08a5b74
          ports:
            - { containerPort: 8090, name: http }
          env:
            # DSN from the SEC-01d CSI secret file, not a plaintext env. This is
            # what makes replicas: 2 safe — see the invariant at the top.
            - { name: OMS_DATABASE_URL_FILE, value: /run/secrets/db/database-url }
            # MT-01d: scopes every order row via the app.tenant_id GUC (RLS).
            # IT ALSO ADDRESSES THE SECURITY MASTER: datamaster serves ONE tenant per
            # instance and answers a caller from any other with a no-oracle 404, so
            # this value must match DATAMASTER_TENANT on the instance below.
            - { name: OMS_TENANT, value: "__system__" }
            # THE INSTRUMENT CLASSIFIER (#640). datamaster is the estate's golden
            # security master and the only place a sector, an issuer or an asset class
            # can be resolved from. WITHOUT THIS LINE this pod starts cleanly, logs one
            # WARN, exports kanz_instrument_classifier_wired 0, and every mandate rule naming
            # the SECTOR, ISSUER or ASSET_CLASS dimension is REFUSED as unverifiable.
            #
            # It reads GET /v1/securities/{id} on a background cycle and answers from
            # memory, so nothing on the order-admission path waits on datamaster.
            # allow-classifier-reads-datamaster in
            # infra/security/runtime/network-policies.yaml is the other half: without
            # that rule every lookup fails and the cache stays empty.
            - { name: OMS_DATAMASTER_URL, value: "http://datamaster.kanz-services.svc:8080" }
            # THE MANDATE POSTURE — a deployment decision, and it is stated in the
            # OMS's startup log either way (EXEC-M14).
            #
            #   unset/false  ADVISORY. An order for a portfolio NO MANDATE GOVERNS is
            #                ADMITTED, unconstrained. It is counted
            #                (kanz_compliance_ungoverned_orders_total) and WARNed once
            #                per portfolio — but it trades.
            #   "true"       REQUIRED. That order is REJECTED (MANDATE_MISSING).
            #
            # It defaults to ADVISORY, and that default is uncomfortable on purpose:
            # switching it on refuses every order for every portfolio nobody has run
            # kanz-mandate for yet, which is a trading outage dressed as a control. Turn
            # it on with the list of governed portfolios in front of you — not because
            # deny-by-default sounds right.
            #
            # If the counter above is non-zero, part of your book is trading with no
            # compliance constraints at all. That is the number to watch.
            #
            # THIS SWITCH DOES NOT GOVERN ONE REFUSAL (#243). An order whose mandate
            # cannot be ATTRIBUTED — two tenants have published a mandate for the same
            # portfolio name, and this OMS is asking as the shared __system__ bucket —
            # is rejected (MANDATE_TENANT_UNRESOLVED) whatever this is set to. "Nobody
            # wrote a mandate" is a posture an operator may knowingly trade through;
            # "a mandate exists and we cannot tell whose" is not, because admitting it
            # means clearing one fund's order against another fund's limits. It cannot
            # fire while one tenant uses a given portfolio name; it starts mattering
            # when per-tenant compute (#97) provisions the second.
            - { name: OMS_REQUIRE_MANDATE, value: "false" }
            - { name: OMS_LISTEN, value: ":8090" }
            - { name: OMS_NATS_URL, value: "nats://nats.kanz-messaging.svc:4222" }
            - { name: OMS_SOURCE, value: "oms" }
            # INFRA-M7a: EVERY venue is an out-of-process adapter reached over
            # venue.v1/mTLS. No exchange code of any kind is linked into this image.
            # A MIC with no endpoint here is a HARD ERROR at the router, never a
            # silent fallback to the simulator. This line is what the OMS trades.
            # MIC/ACCOUNT=address. The account is the EXCHANGE ACCOUNT the adapter's
            # API credential belongs to — one adapter, one credential, one account.
            # An exchange margins and LIQUIDATES per account, so it is the collateral
            # boundary; naming it here is what lets a portfolio be BOUND to it and what
            # lets the router refuse to send another portfolio's order to it. Omit the
            # /account and the venue is treated as ONE account shared by every
            # portfolio trading it — the OMS says so at WARN.
            #
            # AND THE ACCOUNT IN THIS STRING IS NOT BELIEVED (SOV-02a). At startup the OMS
            # ASKS each adapter who it is (venue.v1 Describe) and REFUSES TO START if the
            # adapter — which holds the API credential — names a different account than
            # this line does. A typo here used to post fills to one fund's ledger rows
            # while the exchange debited another's, and nothing could see it.
            #
            # EVERY MIC LISTED HERE MUST HAVE ITS ADAPTER DEPLOYED. STRIP THE ONES
            # YOU ARE NOT RUNNING.
            #
            # This line is a two-way contract, and the comment above only states one
            # direction. The other: at startup the OMS DIALS every endpoint listed
            # here and calls venue.v1 Describe on it (services/oms/cmd/oms/venues.go).
            # An adapter that is not deployed cannot answer, so the OMS REFUSES TO
            # START — after a bounded 30s per venue — with
            #
            #   venue XOKX at venue-okx.kanz-services.svc:9000: cannot ask the adapter
            #   which exchange account it holds (is it running?)
            #
            # and the pod crash-loops until the entry is removed or the adapter is
            # deployed. That is deliberate and correct: an endpoint the OMS cannot
            # reach is an account it cannot confirm, and booting without it would
            # route those orders nowhere. It is loud, not silent — but it is only
            # obvious to someone who already knows, which is why it is written here
            # rather than in a runbook. The runbook that used to carry this
            # instruction was deleted, and the instruction went with it (#119).
            #
            # There is no arch guard for this because there is nothing static to
            # check: which adapters a given environment runs is a deployment fact,
            # not a repository one. The startup Describe IS the guard, and it fails
            # closed.
            - { name: OMS_VENUE_ENDPOINTS, value: "XBIN/binance-main=venue-binance.kanz-services.svc:9000,XOKX/okx-sub-1=venue-okx.kanz-services.svc:9000" }
            # WHERE AN ORDER NAMING NO VENUE GOES (#437).
            #
            # THIS RECORDS A CHOICE ALREADY IN FORCE; it does not make a new one.
            # Until #437 the router answered venues[0] — XBIN, because it is listed
            # first above — while calling itself a smart order router. Nobody picked
            # that. Sorting the endpoint list, or adding an adapter ahead of it,
            # would have moved every untargeted order to a different exchange's
            # collateral with no diff that looked like a trading change.
            #
            # Naming XBIN here keeps today's destination EXACTLY as it is, and moves
            # it somewhere a reviewer can see and argue with. Change this line to
            # change the destination.
            #
            # THIS IS NOT A RANKING. Nothing compares price, liquidity or cost
            # between XBIN and XOKX; a real smart order router needs the realized-cost
            # signal #436 builds, and is tracked as #437's option B. Until then the
            # honest description of this field is "the venue we chose by default",
            # and the router refuses rather than guessing when it is unset.
            #
            # Almost nothing takes this path — both fan-out producers stamp a venue
            # on every leg — which is exactly why it stayed wrong unnoticed.
            - { name: OMS_DEFAULT_VENUE_MIC, value: "XBIN" }
            # Deny-by-default for the adapter's account CLAIM. true ⇒ the OMS refuses to
            # start on any adapter that has not PROVED its account against the exchange
            # itself (venue.v1 Describe answering account_verified=false).
            #
            # It ships FALSE for the same reason as the two below: arming it refuses every
            # adapter nobody has bound an exchange uid to yet (*_VENUE_ACCOUNT_UID), which
            # is a trading outage. With it off, an unproven adapter still trades — but it
            # is WARNed by name and counted (kanz_oms_unverified_venue_account_total), so
            # "how much of the book settles against an unproven account" is a number, not
            # an assumption. A MISMATCH is fatal regardless of this flag.
            - { name: OMS_REQUIRE_VERIFIED_ACCOUNT, value: "false" }
            # Deny-by-default for an adapter that never SAID which order types it can
            # place (#405). true ⇒ the OMS refuses to start on any venue adapter whose
            # venue.v1 Describe returns an empty supported_order_types.
            #
            # WHY AN EMPTY ANSWER IS THE DANGEROUS ONE. The OMS refuses an
            # undeclarable order type at admission — but only for an adapter that
            # ANSWERED. An adapter predating supported_order_types answers with an empty
            # list, and empty means "did not say", so the gate stands open for it. A
            # stop order routed there is admitted, stored, and has its ORDER_ACCEPTED
            # FACT published; risk carries the exposure and the caller has been told the
            # order is working — and only the exchange refuses it. For the one order
            # type whose entire purpose is to act when nobody is watching.
            #
            # It ships FALSE for the same reason the three above do: arming it refuses
            # every adapter nobody has upgraded yet, which is a trading outage dressed
            # as a control. With it off the OMS names each silent adapter at startup and
            # counts it, so "nothing configured" and "checked, and fine" do not look the
            # same.
            #
            # WRITTEN DOWN HERE BECAUSE ITS THREE SIBLINGS ARE. It was the only
            # deny-by-default OMS control absent from this manifest — same class, same
            # default, and invisible to anyone reading the deployment to find out what
            # is switched on. test/arch/deny_by_default_is_visible_test.go now fails the
            # build if a fourth one arrives unlisted.
            - { name: OMS_REQUIRE_ORDER_TYPE_SUPPORT, value: "false" }
            # MAKER-CHECKER ON ORDER SUBMISSION (#410, act three). The fifth
            # member of the family above, and the only one that CANNOT BE SET TO
            # TRUE TODAY — the OMS refuses to start if it is.
            #
            # WHY THE REFUSAL RATHER THAN AN OMISSION. Arming needs somewhere to
            # hold an order awaiting a second signature, and whether that is a
            # pending status on the order or a proposal that never becomes a
            # SubmitOrder is #410's open ruling. With nowhere to put one, arming
            # would REJECT every order at or above the threshold instead of
            # holding it — an act that neither takes effect nor can be approved.
            # So the OMS says that at boot and exits, rather than shipping a
            # control that looks armed and refuses trades.
            #
            # THE THRESHOLD IS THE SHIPPED HALF, and it is set BELOW rather than
            # here because it is a number and not a posture. Set it and the
            # control is present but observing: every order is still admitted on
            # one signature, each is classified against the threshold, and
            # kanz_oms_order_signatures_total{signatures="single_signed",
            # posture="at_or_above_threshold"} is how much of the LARGE order flow
            # one person committed alone. That is the number to arm with — the
            # same "build the control, count the gap, arm it with the list in
            # hand" stance as the four flags above, and the same one
            # DATAMASTER_REQUIRE_DUAL_CONTROL took on the override path (#495).
            - { name: OMS_REQUIRE_DUAL_CONTROL, value: "false" }
            # The notional at or above which an order would need two people, as an
            # AMOUNT AND A CURRENCY: "1000000 USD". EMPTY BY DEFAULT, and empty
            # means the control is ABSENT — not "zero", not "everything". Every
            # admitted order is still counted, under posture="absent", so a
            # deployment with no threshold is a series on a dashboard rather than
            # a missing metric.
            #
            # A BARE NUMBER IS REFUSED AT STARTUP, and so is any currency other
            # than OMS_BASE_CURRENCY. This is the estate's first money-denominated
            # config value; there is no FX on the admission path and
            # common.v1.Decimal carries no currency, so "1000000" against JPY
            # notionals would be off by two orders of magnitude in the permissive
            # direction — silently, on the control that exists to catch large
            # orders.
            #
            # A MARKET or STOP order with no fresh reference mark is counted
            # posture="unvaluable", NEVER as below the threshold. A large
            # unvaluable bucket means the threshold cannot be trusted yet.
            - { name: OMS_DUAL_CONTROL_MIN_NOTIONAL, value: "" }
            # WHICH PORTFOLIO MAY SPEND WHICH ACCOUNT (EXEC-M16).
            #
            #   OMS_VENUE_ACCOUNTS="tenant/portfolio@MIC=account,..."
            #
            # An account bound to TWO portfolios is a startup ERROR: they would share
            # one collateral pool while the ledger reported each of them holding its
            # own cash, so a drawdown in one would consume the other's margin and
            # nothing in its books would say so. The OMS refuses to start on it.
            #
            # EMPTY, as shipped: nothing is bound, so every portfolio trades whatever
            # account its adapter holds — ONE pool per venue, shared. The OMS says that
            # at WARN on every boot and counts every such order
            # (kanz_oms_shared_collateral_orders_total). Fill this in, then flip
            # OMS_REQUIRE_VENUE_ACCOUNT.
            - { name: OMS_VENUE_ACCOUNTS, value: "" }
            # Deny-by-default for collateral. true ⇒ an order for a portfolio bound to
            # no account at its venue is REJECTED (VENUE_ACCOUNT_UNBOUND) rather than
            # executed against a shared one.
            #
            # It ships FALSE for the same reason OMS_REQUIRE_MANDATE does: turning it on
            # refuses every order for every portfolio nobody has bound yet — a trading
            # outage dressed as a control. Turn it on WITH the list of accounts in hand.
            - { name: OMS_REQUIRE_VENUE_ACCOUNT, value: "false" }
            # Both pods share one durable consumer group, so a command is
            # delivered to one of them — the admission gate is the backstop for
            # the redelivery case, not the primary path.
            - { name: OMS_CONSUMER_GROUP, value: "oms" }
            - { name: SPIFFE_ENDPOINT_SOCKET, value: "unix:///run/spiffe/spire-agent.sock" }
          livenessProbe:
            httpGet: { path: /healthz, port: 8090 }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 8090 }
            initialDelaySeconds: 5
            periodSeconds: 5
          # SEC-02a runtime hardening (container-level): read-only rootfs, no
          # privilege escalation, all caps dropped.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: db, mountPath: /run/secrets/db, readOnly: true }
            - { name: spiffe, mountPath: /run/spiffe, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
        # Removing this volume silently re-enables the double-trade window.
        - name: db
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: oms-db
        - name: spiffe
          csi:
            driver: csi.spiffe.io
            readOnly: true
---
# INFRA-01d: a voluntary drain (node upgrade, chaos) must not take the OMS to
# zero — order commands would queue on the durable consumer group and admission
# would stall. Sized to the replicas: 2 above, matching the availability.yaml
# discipline for the other workloads.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: oms
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: oms

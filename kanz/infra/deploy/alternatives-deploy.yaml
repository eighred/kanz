---
# SVCWIRE-01a — deployable workload for the alternatives (private-markets)
# service. A stateless HTTP read surface on :8080 that boots on its in-memory
# fund.Store / Sim defaults (no broker, no DB). Same shape + SEC-02a hardening +
# SEC-01a SPIFFE SVID as wealth-deploy.yaml; the Rollout/PDB/KEDA come in
# SVCWIRE-01d.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alternatives
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
imagePullSecrets:
  - name: ghcr-pull
---
apiVersion: v1
kind: Service
metadata:
  name: alternatives
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  selector:
    app: alternatives
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alternatives
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: alternatives
  template:
    metadata:
      labels:
        app: alternatives
        app.kubernetes.io/part-of: kanz
    spec:
      serviceAccountName: alternatives
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: alternatives
      # INFRA-M6a: apply alternatives's schema before the pods start. Both replicas run
      # this against one database simultaneously; kanz-migrate's advisory lock
      # serializes them, so one applies and the other exits 0 with nothing to do.
      initContainers:
        - name: migrate
          image: ghcr.io/eighred/kanz-migrate@sha256:32864eab84f8f183b06fa50b77b71b7ebbfea18eedd1b29a15c62db64c3cbd6c
          args: ["--dir", "/migrations/alternatives"]
          env:
            - { name: KANZ_MIGRATE_DATABASE_URL_FILE, value: /run/secrets/db/migrate-database-url }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: db, mountPath: /run/secrets/db, readOnly: true }
      containers:
        - name: alternatives
          image: ghcr.io/eighred/alternatives@sha256:c6d5a8ecae8bffc653126a339c77694a8941e90fad06ab39215468b2158db622
          ports:
            - { containerPort: 8080, name: http }
          env:
            # DSN from the SEC-01d CSI secret file, not a plaintext env. Without
            # it this service silently falls back to the in-memory store and
            # loses all state on restart.
            - { name: ALTERNATIVES_DATABASE_URL_FILE, value: /run/secrets/db/database-url }
            # MT-01d: scopes every row via the app.tenant_id GUC (RLS).
            - { name: ALTERNATIVES_TENANT, value: "__system__" }
            - { name: ALTERNATIVES_LISTEN, value: ":8080" }
            - { name: SPIFFE_ENDPOINT_SOCKET, value: "unix:///run/spiffe/spire-agent.sock" }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: db, mountPath: /run/secrets/db, readOnly: true }
            - { name: spiffe, mountPath: /run/spiffe, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: db
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: alternatives-db
        - name: spiffe
          csi:
            driver: csi.spiffe.io
            readOnly: true

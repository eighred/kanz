---
# SVCWIRE-01a — deployable workload for the alternatives (private-markets)
# service. An HTTP read surface on :8080 over the durable fund.Store — NOT
# stateless, and it no longer boots without a DB: ALTERNATIVES_DATABASE_URL is
# required and the pod refuses to start without it (#261). Same shape + SEC-02a hardening +
# SEC-01a SPIFFE SVID as wealth-deploy.yaml; the Rollout/PDB/KEDA come in
# SVCWIRE-01d.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alternatives
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
imagePullSecrets:
  - name: ghcr-pull
---
apiVersion: v1
kind: Service
metadata:
  name: alternatives
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  selector:
    app: alternatives
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alternatives
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: alternatives
  template:
    metadata:
      labels:
        app: alternatives
        app.kubernetes.io/part-of: kanz
      annotations:
        # Scraped by infra/observability/prometheus.yaml (role: pod discovery).
        # The port is the HTTP surface, NOT the gRPC one: a scrape against gRPC
        # cannot succeed, and the result is a DOWN target rather than an error.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      # Drain budget: DERIVED, and deliberately not restated here. The arithmetic
      # this comment used to carry still read 27s long after the real figure had
      # grown past it (#264), so the number now lives in exactly one place:
      # test/arch/pod_disruption_and_drain_test.go recomputes the floor from the
      # source on every run and fails this file the moment 60 stops covering it.
      # See availability.yaml for what the floor is made of.
      terminationGracePeriodSeconds: 60
      serviceAccountName: alternatives
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: alternatives
      # INFRA-M6a: apply alternatives's schema before the pods start. Both replicas run
      # this against one database simultaneously; kanz-migrate's advisory lock
      # serializes them, so one applies and the other exits 0 with nothing to do.
      initContainers:
        - name: migrate
          image: ghcr.io/eighred/kanz-migrate@sha256:909865997d2e96fd9898c5c34a6f11ade3cd65b71a18f1424d0bcda118e0e689
          args: ["--dir", "/migrations/alternatives"]
          env:
            - { name: KANZ_MIGRATE_DATABASE_URL_FILE, value: /run/secrets/db/migrate-database-url }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: db, mountPath: /run/secrets/db, readOnly: true }
      containers:
        - name: alternatives
          image: ghcr.io/eighred/alternatives@sha256:14d5d3c0a4edc87343e62d5be93654fa6a87ea5d171e0591965d1c1bdce51f63
          ports:
            - { containerPort: 8080, name: http }
          env:
            # DSN from the SEC-01d CSI secret file, not a plaintext env. It is
            # REQUIRED: without it the pod REFUSES TO START (exit 2) rather than
            # falling back to a map. The journal is append-only because IRR/TVPI
            # need every dated cashflow, and an in-memory one loses all of them on
            # restart with no way to rebuild (the consumer group resumes at its
            # last ack; the ALTERNATIVES stream ages out at 168h). This used to be
            # a silent fallback (#261). ALTERNATIVES_ALLOW_EPHEMERAL_JOURNAL=true
            # opts back in for a laptop; it is deliberately not set here, and a
            # deployment that sets it must drop replicas below to 1.
            - { name: ALTERNATIVES_DATABASE_URL_FILE, value: /run/secrets/db/database-url }
            # MT-01d: scopes every row via the app.tenant_id GUC (RLS).
            - { name: ALTERNATIVES_TENANT, value: "__system__" }
            - { name: ALTERNATIVES_LISTEN, value: ":8080" }
            - { name: SPIFFE_ENDPOINT_SOCKET, value: "unix:///run/spiffe/spire-agent.sock" }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: db, mountPath: /run/secrets/db, readOnly: true }
            - { name: spiffe, mountPath: /run/spiffe, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: db
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: alternatives-db
        - name: spiffe
          csi:
            driver: csi.spiffe.io
            readOnly: true

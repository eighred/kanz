---
# SVCWIRE-01a — deployable workload for the copilot (AI-analytics) service. A
# stateless HTTP surface on :8080 (POST /v1/ask). It boots safely on its defaults:
# the dependency-free StubModel (the real anthropic-sdk-go client wires at the
# composition root, PARITY-04a) and — with no COPILOT_POLICY_PATH — a fail-closed
# deny-all authorizer, so an un-provisioned copilot can never serve data. The
# AUTH-01 Principal it requires is populated by the gateway edge-auth on the way
# in (SVCWIRE-01b); a direct call without it is rejected. COPILOT_MODEL_ID is the
# version knob — the seam is version-agnostic, so a deployment switches Claude
# versions here without a rebuild (default = the MAX/most-capable claude-fable-5).
# Same SEC-02a hardening + SEC-01a SPIFFE SVID as the other read services.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: copilot
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
imagePullSecrets:
  - name: ghcr-pull
---
apiVersion: v1
kind: Service
metadata:
  name: copilot
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  selector:
    app: copilot
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copilot
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: copilot
  template:
    metadata:
      labels:
        app: copilot
        app.kubernetes.io/part-of: kanz
      annotations:
        # Scraped by infra/observability/prometheus.yaml (role: pod discovery).
        # The port is the HTTP surface, NOT the gRPC one: a scrape against gRPC
        # cannot succeed, and the result is a DOWN target rather than an error.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      # Drain budget: 7s bus drain + 15s HTTP shutdown + 5s OTLP flush, run
      # SEQUENTIALLY after SIGTERM = 27s. The k8s default of 30 leaves three
      # seconds and SIGKILLs mid-drain. See availability.yaml for the derivation.
      terminationGracePeriodSeconds: 45
      serviceAccountName: copilot
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: copilot
      containers:
        - name: copilot
          image: ghcr.io/eighred/copilot@sha256:d65759fd162e0fcb303976c4abcd4abc98a22a38f3823eaa3ad72dc7cad62e9b
          ports:
            - { containerPort: 8080, name: http }
          env:
            - { name: COPILOT_LISTEN, value: ":8080" }
            # The version knob — seam is version-agnostic, switch without a rebuild.
            # WHICH PROVIDER ANSWERS, stated rather than inherited from the build
            # (#179). The image links its adapters by build tag; this chooses
            # among them at runtime, and there is deliberately NO default — an
            # unset value refuses to start rather than picking one, the same rule
            # that removed the OKX endpoint default (#147).
            #
            # Changing this line is the whole act of changing model vendor. It is
            # one line, it is reviewable, and it is the line to look at in a diff.
            - { name: COPILOT_PROVIDER, value: "anthropic" }
            - { name: COPILOT_MODEL_ID, value: "claude-fable-5" }
            # SEC-01d: a BILLABLE credential — it arrives as a Vault/CSI secret FILE,
            # never a plaintext env var.
            - { name: COPILOT_ANTHROPIC_API_KEY_FILE, value: /run/secrets/anthropic/api-key }
            # COPILOT_ALLOW_STUB is deliberately ABSENT. Setting it "true" makes this
            # pod serve llm.StubModel, which does not answer a portfolio manager's
            # questions — it FABRICATES answers that read exactly like real ones. The
            # image is built with -tags anthropic so the stub is not even linked; the
            # flag exists for local dev, and it is never the fix for a failing deploy.
            # No COPILOT_POLICY_PATH ⇒ fail-closed deny-all until the AUTH-01b
            # policy bundle is mounted; the Claude API key + governed mTLS client
            # wire at the composition root (PARITY-04a/b).
            # COPILOT_SPIFFE_SOCKET, *not* SPIFFE_ENDPOINT_SOCKET — this service reads
            # the prefixed name (internal/config), as api-gateway does. The manifest set
            # the unprefixed spelling the other services use, so cfg.SPIFFESocket was
            # EMPTY while the variable and the CSI volume both looked correct to a
            # reviewer. Present-and-wrong is worse than absent: the mesh silently stayed
            # disabled rather than failing loudly.
            - { name: COPILOT_SPIFFE_SOCKET, value: "unix:///run/spiffe/spire-agent.sock" }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: anthropic, mountPath: /run/secrets/anthropic, readOnly: true }
            - { name: spiffe, mountPath: /run/spiffe, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: anthropic
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: copilot-anthropic
        - name: spiffe
          csi:
            driver: csi.spiffe.io
            readOnly: true

---
# EXEC-M11 — the LAST HOP of the trading loop, which had no deployment either.
#
# tv-sync folds the OMS's order FACTs into the Broker-API projection TradingView
# reads back. Like webhook-ingest (the first hop), it had no manifest and no image:
# the loop was delivered end to end in code and could not run end to end in a
# cluster.
#
# THE REPLICA INVARIANT: 1, AND IT IS A CORRECTNESS BOUND.
#
#   The projection is an in-process map — tenant → account → positions/orders — and
#   it is fed by a durable CONSUMER GROUP. A group LOAD-BALANCES: each FACT goes to
#   exactly one pod. So with two replicas each pod folds only PART of the stream and
#   EVERY POD'S BOOK IS WRONG. A trader hitting /broker/accounts/{id}/positions gets
#   a different, partial answer depending on which pod the Service happened to pick.
#
#   This is not a capacity trade-off. Scaling this service does not make it faster,
#   it makes it incorrect.
#
#   Recreate, not RollingUpdate: a rolling update runs two pods at once, which is
#   the same defect for as long as the overlap lasts.
#
# COLD BOOK ON RESTART — a real gap, flagged rather than hidden. Readiness flips
# true as soon as the consumer goroutine starts, NOT once the backlog is folded, so
# a fresh pod serves an EMPTY book while reporting Ready. There is no replay-to-
# current gate. Until there is one, a restart of this service means the Broker API
# briefly answers from a book that is missing everything before the durable's last
# ack. Treat a tv-sync restart as a data-visibility event.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tv-sync
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
imagePullSecrets:
  - name: ghcr-pull
---
apiVersion: v1
kind: Service
metadata:
  name: tv-sync
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  selector:
    app: tv-sync
  ports:
    - { name: http, port: 8091, targetPort: 8091 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tv-sync
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
    # DR scales by this label, never `--all` (#149) — see infra/dr/failover.sh step 4.
    kanz.io/singleton: "true"
spec:
  # ONE. See THE REPLICA INVARIANT above: a second replica does not add capacity,
  # it splits the event stream and corrupts both books.
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: tv-sync
  template:
    metadata:
      labels:
        app: tv-sync
        app.kubernetes.io/part-of: kanz
      annotations:
        # Scraped by infra/observability/prometheus.yaml (role: pod discovery).
        # The port is the HTTP surface, NOT the gRPC one: a scrape against gRPC
        # cannot succeed, and the result is a DOWN target rather than an error.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8091"
    spec:
      # Drain budget: DERIVED, and deliberately not restated here. The arithmetic
      # this comment used to carry still read 27s long after the real figure had
      # grown past it (#264), so the number now lives in exactly one place:
      # test/arch/pod_disruption_and_drain_test.go recomputes the floor from the
      # source on every run and fails this file the moment 60 stops covering it.
      # See availability.yaml for what the floor is made of.
      terminationGracePeriodSeconds: 60
      serviceAccountName: tv-sync
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # The fact log's schema (EXEC-M21). kanz-migrate takes a pg_advisory_lock, so a
      # restart finds nothing to do and exits 0 — the normal case. It uses a SEPARATE,
      # DDL-capable DSN: tv-sync's own credential is a non-superuser, which is what
      # makes FORCE RLS apply to it, and it deliberately cannot create tables.
      initContainers:
        - name: migrate
          image: ghcr.io/eighred/kanz-migrate@sha256:43799cfa71cb4ff6d5c290c2941d2f19d76b458d0c2ec0c110ee9294fc588334
          args: ["--dir", "/migrations/tv-sync"]
          env:
            - { name: KANZ_MIGRATE_DATABASE_URL_FILE, value: /run/secrets/db/migrate-database-url }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: db, mountPath: /run/secrets/db, readOnly: true }
      containers:
        - name: tv-sync
          # Pinned to a cosign-signed digest by the GitOps bump (CICD-01d).
          image: ghcr.io/eighred/tv-sync@sha256:ba35f653d2b09d8b0234e4bef9014ed0e02ac3ad3ac492ff672092e170dbd1fd
          ports:
            - { containerPort: 8091, name: http }
          env:
            - { name: TV_SYNC_LISTEN, value: ":8091" }
            - { name: TV_SYNC_NATS_URL, value: "nats://nats.kanz-messaging.svc:4222" }
            - { name: TV_SYNC_SOURCE, value: "tv-sync" }
            # SEC-01a. The bus is mTLS-ONLY (infra/nats/nats.yaml sets tls.verify).
            # Without this socket the mesh stays disabled and the dial fails with
            # "x509: certificate signed by unknown authority" — a CA-shaped error
            # whose actual cause is this missing line. internal/config already reads it.
            - { name: SPIFFE_ENDPOINT_SOCKET, value: "unix:///run/spiffe/spire-agent.sock" }
            # The durable group. One pod (see above), so this shares nothing — but
            # it is the name the OMS FACT durables are created under, and changing
            # it re-reads from the durable's default position, not from the start.
            - { name: TV_SYNC_CONSUMER_GROUP, value: "tv-sync" }
            # The mark source for unrealized P&L. These are the subjects the mark
            # fold actually consumes, not a convenient wildcard: `market.>` also
            # delivers market.book.snapshot, which carries an OrderBookSnapshot —
            # a message WIRE-COMPATIBLE with MarketDataEvent, so a one-sided
            # bids-only snapshot decoded as a Trade at the deepest resting bid and
            # POISONED the mark below mid. The fold now refuses it on the envelope's
            # event type regardless of what is subscribed here, but the subscription
            # should not deliver it either.
            - { name: TV_SYNC_PRICE_SUBJECTS, value: "market.*.trade,market.*.quote" }
            # THE DURABLE FACT LOG (EXEC-M21). Removing this env, or the db volume
            # below, does not degrade tv-sync — it makes the service REFUSE TO START,
            # because the alternative is a book that vanishes on the next pod roll and
            # a trader looking at an empty account while the fund holds positions.
            #
            # DSN from the SEC-01d CSI secret file, never a plaintext env.
            - { name: TV_SYNC_DATABASE_URL_FILE, value: /run/secrets/db/database-url }
            # MT-01d: scopes every fact row via the app.tenant_id GUC (RLS), as it does
            # for every durable service here.
            - { name: TV_SYNC_TENANT, value: "__system__" }
          # THE BOOK IS REBUILT BEFORE THE SERVER BINDS (EXEC-M21), so on a pod with a
          # long fact log there is a window where nothing answers on :8091 at all. The
          # liveness probe would read that as a hung process and RESTART it — into the
          # same replay, from the top: a crashloop that gets slower as the fund trades
          # more. A startupProbe holds liveness off until the first success, giving the
          # replay up to 5 minutes (60 x 5s) before anything is allowed to call it dead.
          startupProbe:
            httpGet: { path: /healthz, port: 8091 }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /healthz, port: 8091 }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 8091 }
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: db, mountPath: /run/secrets/db, readOnly: true }
            - { name: spiffe, mountPath: /run/spiffe, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: {}
        # The SPIFFE Workload API socket the env above points at.
        - name: spiffe
          csi:
            driver: csi.spiffe.io
            readOnly: true
        # Removing this volume does not degrade the book — it stops the pod from starting.
        - name: db
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: tv-sync-db
---
# INFRA-01d / #234 — tv-sync had no disruption budget at all.
# SINGLETON — zero allowed voluntary disruptions, deliberately (availability.yaml).
# The projection is an in-process map with NO replay-to-current gate: a fresh pod
# reports Ready while serving an EMPTY book (see the COLD BOOK note at the top of this
# file). An unattended eviction therefore hands a trader a confidently wrong positions
# answer rather than an error.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tv-sync
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: tv-sync

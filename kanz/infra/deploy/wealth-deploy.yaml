---
# SVCWIRE-01a — deployable workload for the wealth (advisory) service. Unlike
# risk-engine (a NATS consumer + gRPC query service, hence a canary Rollout), the
# Phase-7 read services are HTTP surfaces on :8080 — so a plain Deployment is the
# right shape here. They are NOT stateless and no longer boot on an in-memory
# default: this one requires WEALTH_DATABASE_URL and refuses to start without it
# (#261), which is why the db CSI volume below is not optional. The progressive-delivery Rollout + PDB + KEDA scaling come in
# SVCWIRE-01d. The pod keeps the SEC-02a hardening + the SEC-01a SPIFFE SVID
# (the gateway reaches it over mTLS, SVCWIRE-01c) from risk-engine-rollout.yaml,
# dropping only the DB CSI volume + broker env this service doesn't use.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wealth
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
imagePullSecrets:
  - name: ghcr-pull
---
apiVersion: v1
kind: Service
metadata:
  name: wealth
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  selector:
    app: wealth
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wealth
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: wealth
  template:
    metadata:
      labels:
        app: wealth
        app.kubernetes.io/part-of: kanz
      annotations:
        # Scraped by infra/observability/prometheus.yaml (role: pod discovery).
        # The port is the HTTP surface, NOT the gRPC one: a scrape against gRPC
        # cannot succeed, and the result is a DOWN target rather than an error.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      # Drain budget: DERIVED, and deliberately not restated here. The arithmetic
      # this comment used to carry still read 27s long after the real figure had
      # grown past it (#264), so the number now lives in exactly one place:
      # test/arch/pod_disruption_and_drain_test.go recomputes the floor from the
      # source on every run and fails this file the moment 60 stops covering it.
      # See availability.yaml for what the floor is made of.
      terminationGracePeriodSeconds: 60
      serviceAccountName: wealth
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # INFRA-01d: spread replicas across AZs so a single-AZ loss leaves the
      # survivors serving.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: wealth
      # INFRA-M6a: apply wealth's schema before the pods start. Both replicas run
      # this against one database simultaneously; kanz-migrate's advisory lock
      # serializes them, so one applies and the other exits 0 with nothing to do.
      initContainers:
        - name: migrate
          image: ghcr.io/eighred/kanz-migrate@sha256:43799cfa71cb4ff6d5c290c2941d2f19d76b458d0c2ec0c110ee9294fc588334
          args: ["--dir", "/migrations/wealth"]
          env:
            - { name: KANZ_MIGRATE_DATABASE_URL_FILE, value: /run/secrets/db/migrate-database-url }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: db, mountPath: /run/secrets/db, readOnly: true }
      containers:
        - name: wealth
          # Pinned to a cosign-signed digest by the GitOps bump (CICD-01d).
          image: ghcr.io/eighred/wealth@sha256:6ff554be90cef185d69d8856725f765d6b164f2507e21fa20d55193587497494
          ports:
            - { containerPort: 8080, name: http }
          env:
            # DSN from the SEC-01d CSI secret file, not a plaintext env. It is
            # REQUIRED: without it the pod REFUSES TO START (exit 2) rather than
            # falling back to a map, because an in-memory book is lost on restart
            # and the pod then serves the EMPTY book as an exposure view -- the
            # durable consumer group resumes at its last ack and never re-reads.
            # This used to be a silent fallback (#261). WEALTH_ALLOW_EPHEMERAL_BOOK
            # =true opts back in for a laptop; it is deliberately not set here, and
            # a deployment that sets it must drop replicas below to 1.
            - { name: WEALTH_DATABASE_URL_FILE, value: /run/secrets/db/database-url }
            # MT-01d: scopes every row via the app.tenant_id GUC (RLS).
            - { name: WEALTH_TENANT, value: "__system__" }
            - { name: WEALTH_LISTEN, value: ":8080" }
            - { name: SPIFFE_ENDPOINT_SOCKET, value: "unix:///run/spiffe/spire-agent.sock" }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: db, mountPath: /run/secrets/db, readOnly: true }
            - { name: spiffe, mountPath: /run/spiffe, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: db
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: wealth-db
        - name: spiffe
          csi:
            driver: csi.spiffe.io
            readOnly: true

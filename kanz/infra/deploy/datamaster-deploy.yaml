---
# Deployable workload for the datamaster (golden-source) service: the golden
# security master, the multi-source price arbitration, and the pricing-oversight
# exception queue that a human works.
#
# THE DURABILITY INVARIANT: the exception queue is an audit surface.
#
#   An override is a named human accepting a price the system flagged. Without
#   DATAMASTER_DATABASE_URL that decision is written to a map and is GONE on the
#   next restart — a compliance record silently deleted by a rolling update. The
#   in-memory store is a laptop convenience, never a deployment.
#
# THE SCALE INVARIANT: safe to run 2, and one replica per cycle talks to the vendor.
#
#   Every pod runs the projector. The writes are idempotent and content-identical
#   (golden_records upserts the resolved record; exceptions is ON CONFLICT DO
#   NOTHING on a deterministic id, so a re-detected break keeps the review state a
#   human already gave it), so concurrent projection was never a data hazard. It
#   was a BILLING and RATE-LIMIT hazard: vendor reference data is metered per call,
#   and N pods made N rounds of API requests for one cycle's worth of information.
#
#   A pg_try_advisory_lock now elects ONE replica per cycle; the losers skip and
#   get on with serving reads. TRY, not wait — a loser must not queue behind the
#   winner and then run a redundant refresh the moment the lock frees. The lock
#   dies with the session, so a pod OOM-killed mid-refresh strands nothing (no TTL,
#   no lease reaper). It is keyed PER TENANT: one shared key would let this
#   deployment starve every other tenant's projector forever.
#
#   This means scaling datamaster buys read capacity and availability, NOT faster
#   refreshes. The cycle is DATAMASTER_REFRESH_INTERVAL, whatever the replica count.
#
# THE VENDOR DROP (DATA-M8c).
#
#   The vendors are mounted flat-file extracts — how Bloomberg Data License and
#   Refinitiv DataScope actually deliver a security master. Ops lands the files on
#   the `vendor` volume (an SFTP sync sidecar, a PVC, or a CSI mount of the drop
#   bucket); the projector re-reads them every cycle, so a fresh delivery needs no
#   restart.
#
#   DATAMASTER_VENDOR_PRIORITY has NO DEFAULT and the service refuses to start
#   without one for every reference vendor. It is the survivorship trust rank —
#   whose ISIN wins when two vendors disagree — and that is a decision about who
#   the fund believes. This service will not quietly make it for you.
#
#   With no vendor configured the projector has nothing to project and the master
#   stays EMPTY. That is the honest state, and it is what you get until the files
#   are mounted. DATAMASTER_ALLOW_SIM would fill it from canned data instead —
#   hence the guard below, which is what keeps an invented security book out of a
#   real database.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: datamaster
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
imagePullSecrets:
  - name: ghcr-pull
---
apiVersion: v1
kind: Service
metadata:
  name: datamaster
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  selector:
    app: datamaster
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datamaster
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: datamaster
  template:
    metadata:
      labels:
        app: datamaster
        app.kubernetes.io/part-of: kanz
      annotations:
        # Scraped by infra/observability/prometheus.yaml (role: pod discovery).
        # The port is the HTTP surface, NOT the gRPC one: a scrape against gRPC
        # cannot succeed, and the result is a DOWN target rather than an error.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      # Drain budget: DERIVED, and deliberately not restated here. The arithmetic
      # this comment used to carry still read 27s long after the real figure had
      # grown past it (#264), so the number now lives in exactly one place:
      # test/arch/pod_disruption_and_drain_test.go recomputes the floor from the
      # source on every run and fails this file the moment 60 stops covering it.
      # See availability.yaml for what the floor is made of.
      terminationGracePeriodSeconds: 60
      serviceAccountName: datamaster
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: datamaster
      # INFRA-M6a: apply 0001_master.sql before the pods start. Every replica runs
      # this against one database simultaneously; kanz-migrate's advisory lock
      # serializes them, so one applies and the rest exit 0 with nothing to do.
      initContainers:
        - name: migrate
          image: ghcr.io/eighred/kanz-migrate@sha256:909865997d2e96fd9898c5c34a6f11ade3cd65b71a18f1424d0bcda118e0e689
          args: ["--dir", "/migrations/datamaster"]
          env:
            - { name: KANZ_MIGRATE_DATABASE_URL_FILE, value: /run/secrets/db/migrate-database-url }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: db, mountPath: /run/secrets/db, readOnly: true }
      containers:
        - name: datamaster
          image: ghcr.io/eighred/datamaster@sha256:8da7bc5e913a24d74cc331bf9d4b945e5478bece3410a194e573b7c095bd602f
          ports:
            - { containerPort: 8080, name: http }
          env:
            # DSN from the SEC-01d CSI secret file, not a plaintext env. It is
            # REQUIRED: without it the pod REFUSES TO START (exit 2) rather than
            # writing the golden records and every operator override into a map
            # that dies with it -- and rather than dropping the per-tenant cycle
            # lock, which would put every replica on the metered vendor API (see
            # both invariants at the top of this file). The "laptop convenience,
            # never a deployment" sentence above is now code (#261).
            # DATAMASTER_ALLOW_EPHEMERAL_MASTER=true is that laptop; it is
            # deliberately not set here, and setting it requires replicas: 1.
            - { name: DATAMASTER_DATABASE_URL_FILE, value: /run/secrets/db/database-url }
            # MT-01d: carried as the app.tenant_id GUC on every connection. The
            # tables are FORCE RLS; a wrong or missing tenant does not error, it
            # silently returns nothing (the accounting incident).
            - { name: DATAMASTER_TENANT, value: "__system__" }
            - { name: DATAMASTER_LISTEN, value: ":8080" }
            - { name: DATAMASTER_REFRESH_INTERVAL, value: "5m" }
            # MAKER-CHECKER ON THE PRICING OVERRIDE (#410).
            #
            # A pricing override is a named human's signed decision to accept a price
            # the system flagged. TRUE makes it take two people: the override is
            # recorded as PENDING and applies only when a DIFFERENT authenticated
            # subject approves it, with both names written into the append-only trail.
            #
            # IT SHIPS FALSE, for the same reason OMS_REQUIRE_MANDATE does. Turning it
            # on converts every existing override caller's 200 into a 202 that
            # completes only when a second person acts, and if nobody is watching the
            # queue the exceptions simply stop being resolved: the book goes on being
            # valued off prices the system had already flagged. That is a valuation
            # outage delivered by a security improvement. Turn it on with the list of
            # people holding override entitlement in front of you, and with someone
            # owning the pending queue.
            #
            # OFF IS NOT UNRECORDED. Every override says whether a second person signed
            # it, so arming this later does not make the older rows ambiguous. The
            # number to watch meanwhile is
            # kanz_datamaster_overrides_total{signatures="single_signed"} -- how much of
            # this audit trail one person produced alone. Once armed,
            # kanz_datamaster_override_proposals_total{outcome="refused_self_approval"}
            # is the control actually firing.
            #
            # ARMING THIS WITHOUT DATAMASTER_DATABASE_URL IS A REFUSAL TO START, not a
            # downgrade: there would be nowhere to record a pending override, so every
            # one would be accepted and then lost.
            - { name: DATAMASTER_REQUIRE_DUAL_CONTROL, value: "false" }
            # How long a pending override stays approvable. Long enough for an approver
            # in another timezone; short enough that a signature cannot be collected
            # against a stale view of the book.
            - { name: DATAMASTER_DUAL_CONTROL_TTL, value: "24h" }
            # The vendor drops. Reference and price are separate extracts with
            # separate cadences; a vendor may supply either or both. Adjust to the
            # vendors this fund actually licenses.
            - name: DATAMASTER_REF_FILES
              value: "BLOOMBERG=/vendor/bloomberg/reference.csv,ICE=/vendor/ice/reference.csv"
            - name: DATAMASTER_PRICE_FILES
              value: "BLOOMBERG=/vendor/bloomberg/prices.csv,ICE=/vendor/ice/prices.csv"
            # Survivorship trust rank; LOWER WINS. No default — the service refuses
            # to start if a reference vendor has none, because "whose ISIN do we
            # believe" is not a question infrastructure may answer by accident.
            - name: DATAMASTER_VENDOR_PRIORITY
              value: "BLOOMBERG=0,ICE=1"
            # DATAMASTER_ALLOW_SIM is deliberately absent. Setting it here would
            # let canned vendor data be resolved into golden_records, where it is
            # indistinguishable from mastered reference data and is trusted as the
            # identity of an instrument by every analytic downstream. The service
            # refuses to start with a sim feed unless this is true.
            - { name: SPIFFE_ENDPOINT_SOCKET, value: "unix:///run/spiffe/spire-agent.sock" }
            # THE OVERRIDE FACT REACHES THE ESTATE (#410).
            #
            # A pricing override is a named human's signed decision. services/audit
            # projects bus FACTs into the signed, tamper-evident store an examiner
            # reads, and it cannot see this service's tables — so without this the
            # decision is durable HERE and absent from the platform's audit trail.
            #
            # UNSETTING THIS DOES NOT DISABLE THE FACT, IT CREATES A BACKLOG. The
            # FACT is committed to the outbox in the SAME transaction as the
            # override, so overrides keep working and their announcements pile up in
            # Postgres until a relay drains them. Nothing is lost and nothing is
            # blocked, which is the correct failure mode and the easy one to leave
            # unattended. The number that says so:
            #
            #   kanz_datamaster_outbox_oldest_pending_seconds
            #
            # Zero means drained. A climbing value means the audit trail is behind
            # the decisions by exactly that much.
            - { name: DATAMASTER_NATS_URL, value: "nats://nats.kanz-messaging.svc:4222" }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: db, mountPath: /run/secrets/db, readOnly: true }
            # The vendor drop, read-only: this service consumes an extract, it never
            # writes one. A datamaster that could edit its own vendor file is a
            # datamaster that can invent a security master.
            - { name: vendor, mountPath: /vendor, readOnly: true }
            - { name: spiffe, mountPath: /run/spiffe, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
        # The vendor extract drop. Point this at wherever the licensed feed lands —
        # a PVC an SFTP sync writes, or a CSI mount of the delivery bucket. It is
        # ReadOnlyMany because every replica reads the same delivery.
        - name: vendor
          persistentVolumeClaim:
            claimName: datamaster-vendor-drop
            readOnly: true
        - name: db
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: datamaster-db
        - name: spiffe
          csi:
            driver: csi.spiffe.io
            readOnly: true
---
# The vendor extract drop.
#
# ReadWriteMany because two different things touch it: the ops-side delivery
# (an SFTP sync job / the vendor's scheduled push) WRITES it, and every datamaster
# replica READS it. The datamaster container itself mounts it readOnly — it
# consumes an extract and must never be able to edit one, because a service that
# can rewrite its own vendor file is a service that can invent a security master.
#
# A site that takes delivery into object storage should replace this volume with
# the S3/GCS CSI driver instead of a PVC; nothing in the service changes — it reads
# whatever is at the paths in DATAMASTER_REF_FILES / DATAMASTER_PRICE_FILES.
#
# storageClassName is deliberately unset: it is a site decision, and RWX support
# differs by provider (EFS, Filestore, Azure Files, CephFS).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: datamaster-vendor-drop
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 10Gi

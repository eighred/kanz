---
# One of the last services that had a database, a schema, and no way to run.
# accounting shipped a migrations/ directory and a postgres.go and was never
# deployable: no image, no manifest. Nothing ever applied its schema either.
#
# THE SCALE INVARIANT: replicas: 2 is safe.
#
#   ledger.Postgres.Append is idempotent at the engine -- INSERT ... ON CONFLICT
#   (tenant_id, entry_id) DO NOTHING -- so a redelivered fill folds once no matter
#   which pod handles it. Both pods share one durable consumer group, so a fill goes
#   to one of them; the idempotent append is the backstop for redelivery, not the
#   primary path.
#
# THE TENANT IS LOAD-BEARING, NOT DECORATION.
#
#   0001_ledger.sql runs FORCE ROW LEVEL SECURITY with a policy on
#   current_setting('app.tenant_id'), and Append inserts
#   VALUES (current_setting('app.tenant_id'), ...). Without ACCOUNTING_TENANT set,
#   against the non-superuser role this service MUST run as, every write ERRORS and
#   every read returns ZERO ROWS. The IBOR would hold nothing, quietly.
#
#   This was a REAL bug: the Postgres tests set the GUC on their own pool and
#   passed, while main.go never did. Fixed -- and it is why this env var is not
#   optional.
#
# The DSN arrives as a SEC-01d Vault/CSI secret FILE, never a plaintext env var, and
# the kanz-migrate initContainer applies the schema before the pods start -- with a
# SEPARATE, DDL-capable credential, because the app role is a non-superuser (that is
# what makes FORCE RLS apply to it) and deliberately cannot create tables.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: accounting
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
imagePullSecrets:
  - name: ghcr-pull
---
apiVersion: v1
kind: Service
metadata:
  name: accounting
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  selector:
    app: accounting
  ports:
    # THE API IS NOT THE SCRAPED PORT (#447). 8080 serves /metrics and nothing
    # else; the tenant-scoped routes that move money are on 8101, which
    # allow-observability-scrape does not admit.
    - { name: http, port: 8101, targetPort: 8101 }
    - { name: metrics, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounting
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: accounting
  template:
    metadata:
      labels:
        app: accounting
        app.kubernetes.io/part-of: kanz
      annotations:
        # Scraped by infra/observability/prometheus.yaml (role: pod discovery).
        # The port is the HTTP surface, NOT the gRPC one: a scrape against gRPC
        # cannot succeed, and the result is a DOWN target rather than an error.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      # Drain budget: DERIVED, and deliberately not restated here. The arithmetic
      # this comment used to carry still read 27s long after the real figure had
      # grown past it (#264), so the number now lives in exactly one place:
      # test/arch/pod_disruption_and_drain_test.go recomputes the floor from the
      # source on every run and fails this file the moment 60 stops covering it.
      # See availability.yaml for what the floor is made of.
      terminationGracePeriodSeconds: 60
      serviceAccountName: accounting
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # INFRA-01d: spread replicas across AZs.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: accounting
      # INFRA-M6a: apply the schema BEFORE the service starts. All replicas run this
      # against one database simultaneously; kanz-migrate's advisory lock serializes
      # them, so one applies and the rest exit 0 with nothing to do.
      initContainers:
        - name: migrate
          image: ghcr.io/eighred/kanz-migrate@sha256:43799cfa71cb4ff6d5c290c2941d2f19d76b458d0c2ec0c110ee9294fc588334
          args: ["--dir", "/migrations/accounting"]
          env:
            - { name: KANZ_MIGRATE_DATABASE_URL_FILE, value: /run/secrets/db/migrate-database-url }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: db, mountPath: /run/secrets/db, readOnly: true }
      containers:
        - name: accounting
          # Pinned to a cosign-signed digest by the GitOps bump (CICD-01d).
          image: ghcr.io/eighred/accounting@sha256:30446edaf7b54d58aa16b5652feac01192b6912d43cec1b2dde81c55fd34a89f
          ports:
            - { containerPort: 8101, name: http }
            - { containerPort: 8080, name: metrics }
          env:
            # DSN from the SEC-01d CSI secret file, not a plaintext env. It is
            # REQUIRED: without it the pod REFUSES TO START (exit 2) rather than
            # booking the fund's BOOK OF RECORD into a map that dies with it. The
            # fold cannot be rebuilt -- the consumer group resumes at its last ack
            # and the ACCOUNTING stream ages out at 168h. This used to be a silent
            # fallback (#261). ACCOUNTING_ALLOW_EPHEMERAL_LEDGER=true opts back in
            # for a laptop; it is deliberately not set here, and a deployment that
            # sets it must drop the replica count above to 1.
            - { name: ACCOUNTING_DATABASE_URL_FILE, value: /run/secrets/db/database-url }
            # REQUIRED -- see the note at the top. RLS is fail-closed without it.
            - { name: ACCOUNTING_TENANT, value: "__system__" }
            - { name: ACCOUNTING_LISTEN, value: ":8101" }
            - { name: ACCOUNTING_METRICS_LISTEN, value: ":8080" }
            - { name: ACCOUNTING_NATS_URL, value: "nats://nats.kanz-messaging.svc:4222" }
            # CUSTODY RECONCILIATION IS UNCONFIGURED HERE, AND THAT IS RECORDED RATHER
            # THAN MERELY OMITTED (#962, #1006, #1025) — a control nobody can find in
            # the manifest is a control nobody knows is absent.
            #
            #   ACCOUNTING_CUSTODY_PAIRS=PF1:CUST-A,PF1:CUST-B
            #     the work list: "portfolio:custodian" entries, COMMA-separated.
            #
            #   ACCOUNTING_CUSTODY_ACCOUNTS=PF1:CUST-A:okx-sub-1,okx-sub-2 PF1:CUST-B:bin-main
            #     which exchange accounts each custodian holds: entries WHITESPACE-
            #     separated, one custodian's accounts comma-separated.
            #
            # THE TWO SEPARATORS DIFFER BECAUSE THEY MUST (#1029). A custodian's accounts
            # are the inner list, so the comma is spent there and the entries around them
            # cannot also use it. Read with env.SplitList — comma-only — the entry above
            # was cut at "okx-sub-2" and the pod exited 2 on a fragment the operator never
            # typed, which made #1006's custodian scoping reachable ONLY for custodians
            # holding exactly one account. Whitespace inside a PAIRS entry is now refused
            # for the same reason it is a separator here: swallowed, it became one pair
            # with a custodian id no statement will ever carry.
            #
            # BOTH LINES ABOVE ARE PARSED FROM THIS FILE BY A TEST
            # (custody_declaration_examples_test.go), so the syntax this manifest
            # advertises cannot drift from the syntax the binary accepts.
            #
            # UNSET, THE BOOK OF RECORD IS VERIFIED AGAINST NO CUSTODIAN. Nothing is
            # scheduled (main says so at ERROR on every boot), no ReconciliationRun FACT
            # is ever emitted, and POST /v1/portfolios/{id}/reconcile — routed at the
            # gateway since #1025 — refuses every request naming a custodian, because
            # this deployment declares no pair and a custodian is never inferred.
            #
            # WITH ONE CUSTODIAN, THE ACCOUNTS KEY IS OPTIONAL AND THE COMPARISON IS
            # STILL SCOPED (#1073): the basis is derived from the exchange accounts the
            # portfolio journal touches. Entries that settled against NO exchange account
            # — an investor subscription into the fund own bank — are in no comparison
            # basis under either scope, are reconciled by nothing, and are named per run
            # in the log and per pair by kanz_accounting_custody_comparison_basis.
            #
            # THE ACCOUNTS KEY IS NOT OPTIONAL ONCE A PORTFOLIO HAS TWO CUSTODIANS: the
            # pod REFUSES TO START without it, rather than reporting every position held
            # at the other custodian as a break, twice a day, forever (#1006).
            - { name: SPIFFE_ENDPOINT_SOCKET, value: "unix:///run/spiffe/spire-agent.sock" }
          livenessProbe:
            httpGet: { path: /healthz, port: 8101 }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 8101 }
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: db, mountPath: /run/secrets/db, readOnly: true }
            - { name: spiffe, mountPath: /run/spiffe, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: db
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: accounting-db
        - name: spiffe
          csi:
            driver: csi.spiffe.io
            readOnly: true
---
# INFRA-01d / #234 — accounting had no disruption budget at all.
# A drain must not take both pods: fills then queue on the durable consumer group
# while the IBOR stands still, and NAV is computed from a ledger that is behind the
# book with nothing saying by how much.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: accounting
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: accounting

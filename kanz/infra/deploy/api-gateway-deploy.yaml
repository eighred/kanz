---
# EXEC-M11 — the external REST edge. It had an image and no deployment.
#
# The gateway is the authenticated, rate-limited surface the CLI talks to: it
# transcodes JSON↔proto over the risk-engine's query.v1 gRPC API, proxies the
# Phase-7 read surfaces, and PUBLISHES order.order.submit / order.order.cancel — so
# it is a capital path, not just a read edge.
#
# AUTHENTICATION IS NOT OPTIONAL, AND THE BINARY ENFORCES THAT (SEC-M1).
#
#   This prose used to be the control: the gateway would log "authentication
#   DISABLED" and serve /v1/* — POST /v1/orders included — to anyone, and all that
#   stood between that and production was a warning nobody was obliged to read.
#   It now REFUSES TO START (exit 2) without a credential (API_GATEWAY_OIDC_ISSUER,
#   or API_GATEWAY_JWT_SECRET **plus API_GATEWAY_ALLOW_DEV_HS256=true** for dev),
#   without API_GATEWAY_TRADE_ROLE (SEC-M2: who may move capital), and without
#   API_GATEWAY_REQUIRED_ROLE — auth alone would admit every token the issuer ever
#   minted to the order path. Clearing either below does not open a staging hole;
#   it CrashLoopBackOffs, by design.
#
#   The HS256 opt-in is separate from the secret ON PURPOSE (#242). Deleting the
#   OIDC issuer from this manifest while a jwt-secret happened to be mounted used
#   to leave a running, healthy-looking gateway authenticating the whole estate
#   against a symmetric HMAC key. It now refuses, because a secret arrives by
#   inheritance and a boolean named ALLOW_DEV_HS256 does not.
#
# THE SCALE INVARIANT: safe to scale, and the RATE LIMITS DIVIDE.
#
#   No chain, no sequence, no per-key ordering. A client retry that lands on a
#   different pod cannot double-submit: the order's Idempotency-Key rides as the
#   broker's Nats-Msg-Id and JetStream collapses the duplicate. That is the one
#   thing that would have made scaling dangerous, and it is handled at the bus.
#
#   BUT the token buckets and the in-flight caps are PER POD, in-process. N replicas
#   means N × the configured budget reaching the risk-engine. The values below are
#   PER POD: with replicas: 2, a tenant's real ceiling is twice what they say.
#   Divide by the replica count, or accept the multiple — but do not read these
#   numbers as a platform-wide limit.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
imagePullSecrets:
  - name: ghcr-pull
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  selector:
    app: api-gateway
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        app.kubernetes.io/part-of: kanz
      annotations:
        # Scraped by infra/observability/prometheus.yaml (role: pod discovery).
        # The port is the HTTP surface, NOT the gRPC one: a scrape against gRPC
        # cannot succeed, and the result is a DOWN target rather than an error.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      # Drain budget: DERIVED, and deliberately not restated here. The arithmetic
      # this comment used to carry still read 27s long after the real figure had
      # grown past it (#264), so the number now lives in exactly one place:
      # test/arch/pod_disruption_and_drain_test.go recomputes the floor from the
      # source on every run and fails this file the moment 60 stops covering it.
      # See availability.yaml for what the floor is made of.
      terminationGracePeriodSeconds: 60
      serviceAccountName: api-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: api-gateway
      containers:
        - name: api-gateway
          # Pinned to a cosign-signed digest by the GitOps bump (CICD-01d).
          image: ghcr.io/eighred/api-gateway@sha256:b449965d9b058eb27ef864a518630d0246e59128422d09c0b7ad76ec70460542
          ports:
            - { containerPort: 8080, name: http }
          env:
            - { name: API_GATEWAY_LISTEN, value: ":8080" }
            # REQUIRED: the process exits 2 without it. The dial itself is lazy, so a
            # momentarily-unreachable risk-engine does not fail startup.
            - { name: API_GATEWAY_RISK_ENGINE_ADDR, value: "risk-engine.kanz-services.svc:9090" }
            # AuthN + AuthZ. REQUIRED: the process exits 2 without a credential and
            # without a required role — see the note at the top of this file.
            # THE ISSUER IS THIS PLATFORM'S OWN IdP (#530, and #457 asked for this).
            #
            # It must match IDENTITY_TOKEN_ISSUER in identity-deploy.yaml EXACTLY —
            # pkg/auth/oidc.go compares `iss` by equality, and one mismatched claim
            # refuses every token the estate can mint.
            #
            # WHAT WAS HERE BEFORE, AND WHY IT IS GONE. This line named
            # login.eighred.com, an Eighred SSO that was never built, under a long
            # comment explaining that identity "has no manifest yet — there is no
            # secret store in this estate, so its durable signing key has nowhere to
            # live", and ending "point this at the identity service when it ships".
            #
            # Identity shipped on 2026-08-15 (#364), with exactly the mounted signing
            # key the comment said it lacked, and nobody came back to this line. The
            # argument stayed here reading as current for three days while the
            # deployed estate had no working authenticated path at all. That is the
            # cost of dated evidence, and deleting it is part of the fix rather than
            # tidying after it: a reader who finds a well-argued justification does
            # not re-derive it.
            #
            # test/arch/oidc_issuer_agreement_test.go now fails if this and the
            # issuer identity mints ever disagree again, because the thing that went
            # stale last time was a comment and a comment cannot guard itself.
            - { name: API_GATEWAY_OIDC_ISSUER, value: "https://identity.kanz.internal" }
            # DISCOVERY IS NOT USED IN-CLUSTER. identity serves the key at a fixed
            # path (services/identity/internal/server/server.go: "GET /jwks.json —
            # unauthenticated — the gateway fetches the public key"), and naming it
            # here spends no request on .well-known and leaves no doubt about which
            # URL the egress rule in network-policies.yaml has to permit.
            - { name: API_GATEWAY_OIDC_JWKS_URI, value: "http://identity.kanz-services.svc:8087/jwks.json" }
            # PER-SUBJECT REVOCATION (#532). Without this the gateway refuses to
            # start, and that is the point: disabling an account used to stop the
            # NEXT login and leave the token already in the holder's hands working
            # until it expired — a token exfiltrated from a log, an operator's curl,
            # or a compromised pod included.
            #
            # THE SAME HOST AND PORT AS THE JWKS URI ABOVE, on purpose. It is the
            # same service, reached through the same egress rule
            # (allow-identity-egress-from-gateway, #530), so this adds no
            # NetworkPolicy surface. It is NOT derived from the issuer, because the
            # issuer is a logical name that must match `iss` byte for byte and does
            # not resolve.
            #
            # The ordinary lag from disabling an account to the token being refused
            # is one refresh interval (revocation.DefaultRefreshInterval, 30s). Past
            # revocation.DefaultMaxAge (15m) with no successful fetch, the gateway
            # refuses every request 503 rather than assuming nobody is revoked.
            - { name: API_GATEWAY_REVOCATIONS_URI, value: "http://identity.kanz-services.svc:8087/revocations" }
            - { name: API_GATEWAY_OIDC_AUDIENCE, value: "kanz" }
            - { name: API_GATEWAY_REQUIRED_ROLE, value: "kanz-user" }
            # WHO MAY MOVE CAPITAL (SEC-M2). REQUIRED, and it must DIFFER from the
            # baseline role above: every authenticated caller carries that one, so
            # setting them the same hands order entry to everyone who can read — the
            # exact failure SEC-M2 exists to end, restored by a config edit that looks
            # harmless in a diff. The gateway refuses to start if they match.
            #
            # Only a principal holding this role can reach POST /v1/orders or
            # POST /v1/orders/{id}/cancel. Everything else on /v1 is a read.
            - { name: API_GATEWAY_TRADE_ROLE, value: "kanz-trader" }
            # WHO MAY RUN THE ESTATE (OPS-M2b). These two are a PAIR: with the address
            # set the /v1/control routes are registered and the role becomes REQUIRED,
            # and it must differ from both roles above or the gateway refuses to start.
            # With the address unset the routes are not registered at all, so a gateway
            # that fronts no control plane answers 404 rather than 403 — telling the
            # caller the truth instead of sending them to look for a missing role.
            #
            # This is the ONLY way to reach the operator: its listener demands an SVID
            # and admits this gateway alone (OPS-M2a). An operator therefore
            # authenticates as a PERSON here — OIDC in production — and never holds a
            # kubeconfig. Node provisioning and exchange-credential writes are the two
            # most dangerous things this platform can be asked to do, and they are now
            # behind the same identity authority as everything else.
            - { name: API_GATEWAY_OPERATOR_ADDR, value: "operator.kanz-operator.svc:9090" }
            - { name: API_GATEWAY_OPERATOR_ROLE, value: "kanz-operator" }
            # AuthZ over the mesh: the gateway's CLIENTS (risk-engine gRPC, the
            # Phase-7 HTTP upstreams) present this workload's SVID. Note the
            # NON-STANDARD env name — this service does not read SPIFFE_ENDPOINT_SOCKET.
            # Empty ⇒ the upstream calls silently downgrade to PLAINTEXT.
            - { name: API_GATEWAY_SPIFFE_SOCKET, value: "unix:///run/spiffe/spire-agent.sock" }
            # The order write surface. Unset ⇒ POST /v1/orders* return 503.
            - { name: API_GATEWAY_NATS_URL, value: "nats://nats.kanz-messaging.svc:4222" }
            # Phase-7 read upstreams. Unset ⇒ those routes 503.
            - { name: API_GATEWAY_WEALTH_ADDR, value: "http://wealth.kanz-services.svc:8080" }
            - { name: API_GATEWAY_DATAMASTER_ADDR, value: "http://datamaster.kanz-services.svc:8080" }
            - { name: API_GATEWAY_COPILOT_ADDR, value: "http://copilot.kanz-services.svc:8080" }
            # tv-sync — the Broker API behind /v1/broker/*, which is how an authorized
            # human (or a TradingView chart) sees the orders Kanz opened. It is
            # reachable ONLY through this gateway: it authenticates nothing and serves
            # whatever tenant the principal header names, so a direct route to it would
            # let any caller read any tenant's book. Empty ⇒ those routes 503.
            - { name: API_GATEWAY_TV_SYNC_ADDR, value: "http://tv-sync.kanz-services.svc:8091" }
            # WHO MAY MOVE THE FUND'S OWN CAPITAL (#535). NEITHER KEY IS SET HERE, AND
            # THAT IS THE POSTURE — recorded rather than merely omitted, because a
            # control nobody can find in the manifest is a control nobody knows exists.
            #
            #   API_GATEWAY_ACCOUNTING_ADDR  the book of record (accounting-deploy.yaml,
            #                                allow-gateway-to-accounting in
            #                                infra/security/runtime/network-policies.yaml)
            #   API_GATEWAY_FUND_ROLE        the role carrying authz.Fund
            #
            # A PAIR, like the operator plane above. With the ROLE unset, POST
            # /v1/portfolios/{id}/cash-movements is NOT REGISTERED and this gateway
            # answers 404 — "there is no cash-movement surface here", which is true. With
            # the ADDRESS set the role becomes REQUIRED and the gateway refuses to start
            # without it, so the funding surface can never be exposed with nobody able to
            # reach it. That third state is what #535 found: the route registered,
            # authz.Fund carried by no role, and a 403 to every principal that exists —
            # indistinguishable from a control working exactly as intended.
            #
            # The role must DIFFER from all three above, and the trade one is the point:
            # the person who can move money is never the person who trades it. One
            # credential holding both can bring the fund's cash in and spend it.
            #
            # WHO MAY GIVE THE SECOND SIGNATURE (#539, #410 act one). NOT SET HERE, AND
            # THAT IS THE POSTURE — same reason as the pair above.
            #
            #   API_GATEWAY_APPROVE_ROLE     the role carrying authz.Approve
            #
            # NOT A PAIR, and this is the one place the analogy to funding breaks. The
            # datamaster address above serves securities, prices and the exception list
            # too, so a read-only master-data deployment is legitimate and the address
            # does NOT make this role required. Unset, the three override routes are not
            # registered and this gateway answers 404 to them:
            #
            #   POST /v1/exceptions/{id}/override
            #   POST /v1/exceptions/{id}/override/approve
            #   GET  /v1/exceptions/pending-overrides
            #
            # THE CONFIGURATION TO WATCH IS DATAMASTER ARMED AND THIS UNSET. With
            # DATAMASTER_REQUIRE_DUAL_CONTROL=true (datamaster-deploy.yaml) every
            # override is HELD for a signature that no client can give, so pricing
            # exceptions stop being resolved and the book goes on being valued off prices
            # the system already flagged. That flag is in another service's environment
            # and this gateway cannot read it, so nothing can refuse the combination at
            # boot — the gateway logs a WARN naming it instead. Set both, or neither.
            #
            # The role must DIFFER from all four above; validateAuth refuses to start
            # otherwise. The trade collision is the one that matters and the one that
            # fails silently: it hands every trader the second signature on every other
            # trader's proposal, and because internal/dualcontrol checks only that the
            # approver is a different SUBJECT, the audit trail reads as genuine
            # four-eyes. A control satisfied by two people on the same desk is the thing
            # maker-checker exists to prevent.
            #
            # A FOURTH ROUTE RIDES THIS ROLE, AND IT HAS A SECOND PRECONDITION THIS
            # MANIFEST DOES NOT MEET (#539). Order submission is act three of the same
            # control, and its approve route registers on the role alone — but the queue
            # that tells an approver WHAT to sign is a read off the OMS:
            #
            #   GET /v1/orders/pending-approvals   needs API_GATEWAY_OMS_READ_ADDR
            #
            # That address is NOT set here, so arming the role today gives an approver a
            # signing route and no way to reach it. It is not a soft gap: the approve
            # route refuses an empty digest with 400, a held order is deliberately absent
            # from the orders table, and the digest otherwise rides OrderPendingApproval
            # on NATS. The gateway WARNs on this combination at boot rather than leaving
            # it to a 404 met later.
            #
            # So the order half of maker-checker needs BOTH keys set, and the override
            # half needs only the role. Recorded because the two halves look identical
            # from this file and are not.
            # PER POD, not platform-wide. See THE SCALE INVARIANT above.
            - { name: API_GATEWAY_RATE_LIMIT_PER_SEC, value: "50" }
            - { name: API_GATEWAY_RATE_LIMIT_BURST, value: "100" }
            - { name: API_GATEWAY_MAX_IN_FLIGHT, value: "64" }
            # The request-signing HMAC, from the SEC-01d CSI file (never a plaintext
            # env). The config prefers <VAR>_FILE for exactly this reason.
            - { name: API_GATEWAY_SIGNING_SECRET_FILE, value: /run/secrets/gateway/signing-secret }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            # /readyz — NOT /v1/health. That route exists, but it lives INSIDE the
            # authenticated chain and would answer a kubelet probe with 401.
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: gateway, mountPath: /run/secrets/gateway, readOnly: true }
            - { name: spiffe, mountPath: /run/spiffe, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: gateway
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: api-gateway-secrets
        - name: spiffe
          csi:
            driver: csi.spiffe.io
            readOnly: true
---
# INFRA-01d / #234 — api-gateway had no disruption budget at all.
# This is the ONLY authenticated way in, POST /v1/orders included. A node upgrade
# that evicted both pods would make the estate unreachable from outside while every
# internal probe stayed green — an outage invisible from the inside.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: api-gateway

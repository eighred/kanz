---
# EXEC-M11 — the external REST edge. It had an image and no deployment.
#
# The gateway is the authenticated, rate-limited surface the CLI talks to: it
# transcodes JSON↔proto over the risk-engine's query.v1 gRPC API, proxies the
# Phase-7 read surfaces, and PUBLISHES order.order.submit / order.order.cancel — so
# it is a capital path, not just a read edge.
#
# AUTHENTICATION IS NOT OPTIONAL, AND THE BINARY ENFORCES THAT (SEC-M1).
#
#   This prose used to be the control: the gateway would log "authentication
#   DISABLED" and serve /v1/* — POST /v1/orders included — to anyone, and all that
#   stood between that and production was a warning nobody was obliged to read.
#   It now REFUSES TO START (exit 2) without a credential (API_GATEWAY_OIDC_ISSUER,
#   or API_GATEWAY_JWT_SECRET for dev), without API_GATEWAY_TRADE_ROLE (SEC-M2:
#   who may move capital), and without API_GATEWAY_REQUIRED_ROLE — auth
#   alone would admit every token the issuer ever minted to the order path. Clearing
#   either below does not open a staging hole; it CrashLoopBackOffs, by design.
#
# THE SCALE INVARIANT: safe to scale, and the RATE LIMITS DIVIDE.
#
#   No chain, no sequence, no per-key ordering. A client retry that lands on a
#   different pod cannot double-submit: the order's Idempotency-Key rides as the
#   broker's Nats-Msg-Id and JetStream collapses the duplicate. That is the one
#   thing that would have made scaling dangerous, and it is handled at the bus.
#
#   BUT the token buckets and the in-flight caps are PER POD, in-process. N replicas
#   means N × the configured budget reaching the risk-engine. The values below are
#   PER POD: with replicas: 2, a tenant's real ceiling is twice what they say.
#   Divide by the replica count, or accept the multiple — but do not read these
#   numbers as a platform-wide limit.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
imagePullSecrets:
  - name: ghcr-pull
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  selector:
    app: api-gateway
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        app.kubernetes.io/part-of: kanz
    spec:
      serviceAccountName: api-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: api-gateway
      containers:
        - name: api-gateway
          # Pinned to a cosign-signed digest by the GitOps bump (CICD-01d).
          image: ghcr.io/kanz-eng/api-gateway:latest
          ports:
            - { containerPort: 8080, name: http }
          env:
            - { name: API_GATEWAY_LISTEN, value: ":8080" }
            # REQUIRED: the process exits 2 without it. The dial itself is lazy, so a
            # momentarily-unreachable risk-engine does not fail startup.
            - { name: API_GATEWAY_RISK_ENGINE_ADDR, value: "risk-engine.kanz-services.svc:9090" }
            # AuthN + AuthZ. REQUIRED: the process exits 2 without a credential and
            # without a required role — see the note at the top of this file.
            - { name: API_GATEWAY_OIDC_ISSUER, value: "https://login.eighred.com" }
            - { name: API_GATEWAY_OIDC_AUDIENCE, value: "kanz" }
            - { name: API_GATEWAY_REQUIRED_ROLE, value: "kanz-user" }
            # WHO MAY MOVE CAPITAL (SEC-M2). REQUIRED, and it must DIFFER from the
            # baseline role above: every authenticated caller carries that one, so
            # setting them the same hands order entry to everyone who can read — the
            # exact failure SEC-M2 exists to end, restored by a config edit that looks
            # harmless in a diff. The gateway refuses to start if they match.
            #
            # Only a principal holding this role can reach POST /v1/orders or
            # POST /v1/orders/{id}/cancel. Everything else on /v1 is a read.
            - { name: API_GATEWAY_TRADE_ROLE, value: "kanz-trader" }
            # WHO MAY RUN THE ESTATE (OPS-M2b). These two are a PAIR: with the address
            # set the /v1/control routes are registered and the role becomes REQUIRED,
            # and it must differ from both roles above or the gateway refuses to start.
            # With the address unset the routes are not registered at all, so a gateway
            # that fronts no control plane answers 404 rather than 403 — telling the
            # caller the truth instead of sending them to look for a missing role.
            #
            # This is the ONLY way to reach the operator: its listener demands an SVID
            # and admits this gateway alone (OPS-M2a). An operator therefore
            # authenticates as a PERSON here — OIDC in production — and never holds a
            # kubeconfig. Node provisioning and exchange-credential writes are the two
            # most dangerous things this platform can be asked to do, and they are now
            # behind the same identity authority as everything else.
            - { name: API_GATEWAY_OPERATOR_ADDR, value: "operator.kanz-operator.svc:9090" }
            - { name: API_GATEWAY_OPERATOR_ROLE, value: "kanz-operator" }
            # AuthZ over the mesh: the gateway's CLIENTS (risk-engine gRPC, the
            # Phase-7 HTTP upstreams) present this workload's SVID. Note the
            # NON-STANDARD env name — this service does not read SPIFFE_ENDPOINT_SOCKET.
            # Empty ⇒ the upstream calls silently downgrade to PLAINTEXT.
            - { name: API_GATEWAY_SPIFFE_SOCKET, value: "unix:///run/spiffe/spire-agent.sock" }
            # The order write surface. Unset ⇒ POST /v1/orders* return 503.
            - { name: API_GATEWAY_NATS_URL, value: "nats://nats.kanz-messaging.svc:4222" }
            # Phase-7 read upstreams. Unset ⇒ those routes 503.
            - { name: API_GATEWAY_WEALTH_ADDR, value: "http://wealth.kanz-services.svc:8080" }
            - { name: API_GATEWAY_DATAMASTER_ADDR, value: "http://datamaster.kanz-services.svc:8080" }
            - { name: API_GATEWAY_COPILOT_ADDR, value: "http://copilot.kanz-services.svc:8080" }
            # tv-sync — the Broker API behind /v1/broker/*, which is how an authorized
            # human (or a TradingView chart) sees the orders Kanz opened. It is
            # reachable ONLY through this gateway: it authenticates nothing and serves
            # whatever tenant the principal header names, so a direct route to it would
            # let any caller read any tenant's book. Empty ⇒ those routes 503.
            - { name: API_GATEWAY_TV_SYNC_ADDR, value: "http://tv-sync.kanz-services.svc:8091" }
            # PER POD, not platform-wide. See THE SCALE INVARIANT above.
            - { name: API_GATEWAY_RATE_LIMIT_PER_SEC, value: "50" }
            - { name: API_GATEWAY_RATE_LIMIT_BURST, value: "100" }
            - { name: API_GATEWAY_MAX_IN_FLIGHT, value: "64" }
            # The request-signing HMAC, from the SEC-01d CSI file (never a plaintext
            # env). The config prefers <VAR>_FILE for exactly this reason.
            - { name: API_GATEWAY_SIGNING_SECRET_FILE, value: /run/secrets/gateway/signing-secret }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            # /readyz — NOT /v1/health. That route exists, but it lives INSIDE the
            # authenticated chain and would answer a kubelet probe with 401.
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: gateway, mountPath: /run/secrets/gateway, readOnly: true }
            - { name: spiffe, mountPath: /run/spiffe, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: gateway
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: api-gateway-secrets
        - name: spiffe
          csi:
            driver: csi.spiffe.io
            readOnly: true

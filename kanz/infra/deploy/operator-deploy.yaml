# Operator service (F0+S1): reads the Kubernetes node inventory read-only and
# serves it over operator.v1 gRPC for the universe TUI. Deploys into the
# SEC-M3c kanz-operator namespace. Its gRPC port is deliberately NOT fronted by
# a Service — the TUI reaches it via `kubectl port-forward`, so RBAC on
# pods/portforward is the access gate.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: operator
  namespace: kanz-operator
  labels: { app.kubernetes.io/part-of: kanz }
---
# nodes are cluster-scoped, so node read access MUST be a ClusterRole (a
# namespaced Role cannot grant it). Least privilege: get/list on nodes, nothing
# else. Task 6's arch guard fails the build if a write verb or another resource
# appears here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: operator-node-reader
  labels: { app.kubernetes.io/part-of: kanz }
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: operator-node-reader
  labels: { app.kubernetes.io/part-of: kanz }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: operator-node-reader
subjects:
  - kind: ServiceAccount
    name: operator
    namespace: kanz-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator
  namespace: kanz-operator
  labels: { app.kubernetes.io/part-of: kanz, app: operator }
spec:
  replicas: 1
  selector:
    matchLabels: { app: operator }
  template:
    metadata:
      labels: { app: operator, app.kubernetes.io/part-of: kanz }
    spec:
      serviceAccountName: operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: operator
          image: ghcr.io/kanz-eng/operator:latest
          args: []
          ports:
            - { name: grpc, containerPort: 9090 }
            - { name: health, containerPort: 8091 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8091 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 8091 }
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
          env:
            - name: OPERATOR_PROVISIONER_IMAGE
              value: ghcr.io/kanz-eng/kanz-provisioner:latest
            - name: OPERATOR_K3S_SERVER_URL
              valueFrom: { secretKeyRef: { name: operator-k3s-join, key: server_url, optional: true } }
            - name: OPERATOR_K3S_TOKEN
              valueFrom: { secretKeyRef: { name: operator-k3s-join, key: token, optional: true } }
            # S4b: pre-write venue-key proof. Unset by default (SetVenueKeys writes
            # unproven, S4a behaviour). Setting OPERATOR_VENUE_PROOF=require turns proof
            # on; a venue with no base URL below is then refused, never written unproven.
            # There is deliberately NO default endpoint here — see config.go.
            # - name: OPERATOR_VENUE_PROOF
            #   value: "require"
            # - name: OPERATOR_OKX_BASE_URL
            #   value: "https://www.okx.com"
            # - name: OPERATOR_BINANCE_BASE_URL
            #   value: "https://api.binance.com"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: operator
  namespace: kanz-operator
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: operator }
---
# S2a: the operator service creates one-shot provisioning Jobs + their transient
# Secrets in its OWN namespace. Namespaced Role (never a ClusterRole) — these are
# namespaced resources, and the operator must never gain a verb on cluster-scoped
# nodes (a joining node self-registers).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: operator-provisioner
  namespace: kanz-operator
  labels: { app.kubernetes.io/part-of: kanz }
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: operator-provisioner
  namespace: kanz-operator
  labels: { app.kubernetes.io/part-of: kanz }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: operator-provisioner }
subjects:
  - { kind: ServiceAccount, name: operator, namespace: kanz-operator }
---
# The provisioning Job's identity. It needs NO Kubernetes API access — only outbound
# SSH — so it is bound to nothing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kanz-node-provisioner
  namespace: kanz-operator
  labels: { app.kubernetes.io/part-of: kanz }
automountServiceAccountToken: false
---
# Deny-by-default ingress to the operator pod, closing the F0+S1 residual gap: the
# plaintext gRPC listener (0.0.0.0:9090) was reachable by any in-cluster pod. Only the
# health port is left ingressable (kubelet probes); gRPC is reached solely via
# kubeconfig-gated port-forward, which does not traverse a NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: operator-ingress
  namespace: kanz-operator
  labels: { app.kubernetes.io/part-of: kanz }
spec:
  podSelector: { matchLabels: { app: operator } }
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - { protocol: TCP, port: 8091 }
---
# The provisioner Job egresses to DNS + arbitrary target SSH + the k3s control plane.
# It is ephemeral; this policy scopes what a compromised provisioning run could reach.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: node-provisioner-egress
  namespace: kanz-operator
  labels: { app.kubernetes.io/part-of: kanz }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/component: node-provisioner } }
  policyTypes: ["Egress"]
  egress:
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - ports:
        - { protocol: TCP, port: 22 }
        - { protocol: TCP, port: 6443 }
        - { protocol: TCP, port: 443 }
---
# S3a: node-lifecycle writes. A ClusterRole (nodes are cluster-scoped). Exactly patch
# on nodes (cordon/uncordon) + create on the pods/eviction subresource (drain). NO node
# create/delete, NO pod delete — drain is eviction-only so PodDisruptionBudgets are
# always honored. Separate from the read-only operator-node-reader, which stays read-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: operator-node-writer
  labels: { app.kubernetes.io/part-of: kanz }
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: operator-node-writer
  labels: { app.kubernetes.io/part-of: kanz }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: operator-node-writer }
subjects:
  - { kind: ServiceAccount, name: operator, namespace: kanz-operator }
---
# operator-venue-secret-writer: the S4a API-Manager write path. The operator writes
# venue API-key Secrets into kanz-services (where the venue adapters mount them). It is
# bounded to the secrets resource in this one namespace — never cluster-scoped, never
# another resource or verb. get/create/update mirror KubeStore.SetVenueKeys's actual
# Get-then-Create(IsNotFound)-or-Update sequence (no server-side apply, no list, no
# delete) — the write-only guarantee is the code + this bound.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: operator-venue-secret-writer
  namespace: kanz-services
  labels: { app.kubernetes.io/part-of: kanz }
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: operator-venue-secret-writer
  namespace: kanz-services
  labels: { app.kubernetes.io/part-of: kanz }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: operator-venue-secret-writer }
subjects:
  - { kind: ServiceAccount, name: operator, namespace: kanz-operator }

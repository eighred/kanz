# AI-M1 — the inference service. It had no manifest, so it never ran.
#
# kanz_inference shipped a gRPC servicer with admission control, a bus streaming worker, a
# point-in-time feature store, a permutation-Shapley explainer, a model registry with an
# MLOPS-01a promotion gate, shadow execution, validation and governance. What it did not have
# was an entrypoint, an image, a manifest, or a single concrete model — and on the Go side
# internal/prediction (the resilient client, the feature publisher) had ZERO IMPORTERS outside
# its own tests. Nothing served inference.v1.InferenceService and nothing called it.
#
# The platform's entire AI capability was an exceptionally well-specified contract with no
# traffic on it, and the fifteen-layer AI brief was to be built on top of that.
#
# # It REFUSES TO START without a validated model
#
# KANZ_INFERENCE_MODELS points at the model card. With no card — or a card whose validation
# has EXPIRED — the process exits 2 and this pod crashloops, loudly.
#
# That is deliberate, and it is the same posture as every other gate that matters here: the
# gateway will not start unauthenticated (SEC-M1), webhook-ingest will not start without a
# replay defence (EXEC-M17/M22), tv-sync will not start without a fact log (EXEC-M21). A
# prediction service with no model does not fail — it reports healthy and it ANSWERS. That is
# the one outcome worse than being down.
#
# # A prediction is an OBSERVATION, never an order
#
# Nothing here reaches the trading path. The risk engine publishes features and this service
# scores them; the score is published as a FACT and consumed by whoever wants it. The OMS
# pre-trade gate and webhook-ingest's gate are untouched, and a model that is down or wrong
# cannot stop or start a trade. Wiring a model to capital is a separate decision that has not
# been taken.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inference
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
imagePullSecrets:
  - name: ghcr-pull
---
apiVersion: v1
kind: Service
metadata:
  name: inference
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  selector:
    app: inference
  ports:
    - { name: grpc, port: 50051, targetPort: 50051 }
    # /metrics, /livez, /readyz. Prometheus scrapes the POD, not this Service, so
    # this entry is not what makes the scrape work — the pod-template annotation
    # below is. It is here so the readiness gate has a Service to remove the pod
    # from, and so the port is discoverable by name rather than by number.
    - { name: http, port: 8093, targetPort: 8093 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
  namespace: kanz-services
  labels:
    app: inference
    app.kubernetes.io/part-of: kanz
spec:
  # TWO. The interactive path is stateless (the registry is rebuilt from the mounted model
  # card at boot, identically on every pod), so replicas add availability and nothing else.
  #
  # The STREAMING path shares ONE durable consumer group, so the feature stream is
  # load-balanced across the pods rather than double-scored — and a prediction is idempotent
  # on its feature event anyway (the publisher threads causation_id back to the FeatureVector).
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: inference
  template:
    metadata:
      labels:
        app: inference
        app.kubernetes.io/part-of: kanz
      # #241 — THE FIRST SCRAPE THIS POD HAS EVER HAD. Until the container opened
      # an HTTP port there was no port these annotations could name: the pod had
      # exactly one (grpc 50051), and gRPC answers no GET, so annotating it would
      # have produced a target that is permanently DOWN — a red row in a list
      # nobody reads rather than an alert. Everything the streaming scorer can do
      # wrong (a stalled durable consumer, admission-control rejections, a model
      # that could not be promoted) was visible only in pod logs.
      #
      # Prometheus discovers pods by these three keys (infra/observability/
      # prometheus.yaml, role: pod), and the CNI only lets the scrape through
      # because 8093 is in allow-observability-scrape — both halves are pinned by
      # test/arch (prometheus_scrape_test.go, network_policy_coverage_test.go).
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8093"
        prometheus.io/path: /metrics
    spec:
      # Drain budget: DERIVED, and deliberately not restated here. The arithmetic
      # this comment used to carry still read 27s long after the real figure had
      # grown past it (#264), so the number now lives in exactly one place:
      # test/arch/pod_disruption_and_drain_test.go recomputes the floor from the
      # source on every run and fails this file the moment 60 stops covering it.
      # See availability.yaml for what the floor is made of.
      terminationGracePeriodSeconds: 60
      serviceAccountName: inference
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inference
          # Pinned to a cosign-signed digest by the GitOps bump (CICD-01d).
          image: ghcr.io/eighred/inference@sha256:8573c1568d804d045478a287d8a6ae6cca2b92c6526427f0f486d3d92abac55e
          ports:
            - { containerPort: 50051, name: grpc }
            # The name matters: prometheus_scrape_test.go resolves the annotated
            # port against the port NAMED http (or health) and fails if the
            # annotation points at the gRPC one instead — the mistake that yields
            # a target which can never be scraped.
            - { containerPort: 8093, name: http }
          env:
            # THE MODEL CARD. Weights and validation evidence travel together, because the
            # registry will not promote a model to PRIMARY without a recorded, non-expired,
            # passing validation (MLOPS-01a / SR 11-7). Remove this and the pod does not
            # degrade — it refuses to start.
            - { name: KANZ_INFERENCE_MODELS, value: /etc/kanz/models/models.json }
            # The streaming half: score the FeatureVectors the risk engine publishes.
            - { name: KANZ_INFERENCE_NATS_URL, value: "nats://nats.kanz-messaging.svc:4222" }
            - { name: KANZ_INFERENCE_CONSUMER_GROUP, value: "inference" }
            - { name: KANZ_INFERENCE_SOURCE, value: "inference" }
            - { name: KANZ_INFERENCE_BIND, value: "[::]:50051" }
            # Same bracketed form as the gRPC bind, and for the same reason: the
            # pod is addressed over whichever family the cluster gives it, and a
            # metrics listener bound to the wrong one is a DOWN target plus two
            # failing probes — i.e. a crashloop whose cause is a config default.
            - { name: KANZ_INFERENCE_METRICS_BIND, value: "[::]:8093" }
            # Every served prediction carries its own attribution (permutation Shapley). A
            # risk desk that cannot attribute a number cannot sign off on it.
            - { name: KANZ_INFERENCE_EXPLAIN, value: "true" }
          # WHAT THE OLD tcpSocket PROBES GOT RIGHT, AND WHAT THEY COULD NOT SAY.
          #
          # Their argument held: 50051 is bound only AFTER a PRIMARY model is loaded (the
          # process exits 2 otherwise), so "listening" genuinely meant "has a validated model".
          # That property is KEPT — kanz_inference/__main__.py starts this HTTP surface only
          # after the gRPC server is up, so /livez cannot answer for a modelless process.
          #
          # What a TCP check cannot express is the other end of the pod's life. On SIGTERM the
          # listening socket stays accepted by the kernel until the process exits, so a
          # draining pod PASSES its readiness probe for the whole 60s grace period and keeps
          # being sent work it is about to drop. /readyz goes 503 at the top of shutdown,
          # before the streaming task is cancelled and before the gRPC server stops, which is
          # what removes this pod from its Service while it can still finish what it holds.
          readinessProbe:
            httpGet: { path: /readyz, port: 8093 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /livez, port: 8093 }
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: models, mountPath: /etc/kanz/models, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        # The model card. A ConfigMap, not a secret: weights and validation evidence are
        # auditable artifacts, and a model nobody can inspect is a model nobody can validate.
        #
        # OPERATOR-SUPPLIED, DELIBERATELY NOT IN GIT. This ConfigMap is the OUTPUT of the
        # MLOPS-01g promotion/approval workflow — a specific model, its weights, and its
        # recorded validation evidence — so it is environment-specific and changes when a
        # model is promoted. Committing a placeholder here would put a FABRICATED validation
        # record in the repo, and `require_primary` exists precisely to refuse a model whose
        # validation is absent or expired; a fake one would satisfy the gate and defeat it.
        #
        # It was previously referenced with no explanation anywhere, which reads as an
        # oversight and cost a review cycle. Create it before first rollout:
        #
        #   kubectl -n kanz-services create configmap inference-models --from-file=models.json
        #
        # models.json is one card or a JSON array of cards (kanz_inference/service.py:_spec_from):
        #   REQUIRED  model_id, feature_set_ref, confidence_threshold, weights{name: float}
        #   OPTIONAL  bias, scale, validated_at, expires_at (ISO-8601), validation_passed,
        #             artifact_uri, report_uri
        # A card whose validation is missing/expired/failed is NOT promoted to PRIMARY, and
        # with no PRIMARY the process exits 2 by design (see the header) rather than serving.
        #
        # FAILURE MODE IF ABSENT, and it is NOT the loud exit-2 this file's header advertises:
        # the kubelet cannot mount a missing ConfigMap, so the pod never starts and sits in
        # CreateContainerConfigError — the process never runs to refuse anything.
        - name: models
          configMap:
            name: inference-models
        - name: tmp
          emptyDir: {}
---
# INFRA-01d / #234 — inference had no disruption budget at all.
# The rollout above already refuses to drop below two live pods (maxUnavailable: 0),
# but that governs a ROLLOUT only — a voluntary drain bypassed it entirely. A
# prediction is an observation and never an order, so this is availability rather
# than correctness; it is still how a shadow model quietly stops being evaluated.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inference
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: inference

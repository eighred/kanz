---
# One of the last services that had a database, a schema, and no way to run.
# audit shipped a migrations/ directory and a postgres.go and was never
# deployable: no image, no manifest. Nothing ever applied its schema either.
#
# THE SCALE INVARIANT: replicas: 2 is safe -- but only because of one line.
#
#   This is an append-only HASH CHAIN: every record's prev_hash is the hash of the
#   record before it. A naive implementation would read the head, compute the next
#   hash, and insert -- and two pods doing that concurrently would both chain off the
#   SAME head and FORK the chain, destroying the tamper-evidence this service exists
#   to provide.
#
#   audit.Postgres.Append takes a pg_advisory_xact_lock around read-head -> insert,
#   so the chain is serialized AT THE DATABASE and cannot fork across pods. That lock
#   is what makes this replica count legal. Remove it and this manifest becomes a
#   corruption engine.
#
# The DSN arrives as a SEC-01d Vault/CSI secret FILE, never a plaintext env var, and
# the kanz-migrate initContainer applies the schema before the pods start -- with a
# SEPARATE, DDL-capable credential, because the app role is a non-superuser (that is
# what makes FORCE RLS apply to it) and deliberately cannot create tables.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
imagePullSecrets:
  - name: ghcr-pull
---
apiVersion: v1
kind: Service
metadata:
  name: audit
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  selector:
    app: audit
  ports:
    - { name: http, port: 8083, targetPort: 8083 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: audit
  template:
    metadata:
      labels:
        app: audit
        app.kubernetes.io/part-of: kanz
      annotations:
        # Scraped by infra/observability/prometheus.yaml (role: pod discovery).
        # The port is the HTTP surface, NOT the gRPC one: a scrape against gRPC
        # cannot succeed, and the result is a DOWN target rather than an error.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
    spec:
      # Drain budget: DERIVED, and deliberately not restated here. The arithmetic
      # this comment used to carry still read 27s long after the real figure had
      # grown past it (#264), so the number now lives in exactly one place:
      # test/arch/pod_disruption_and_drain_test.go recomputes the floor from the
      # source on every run and fails this file the moment 60 stops covering it.
      # See availability.yaml for what the floor is made of.
      terminationGracePeriodSeconds: 60
      serviceAccountName: audit
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # INFRA-01d: spread replicas across AZs.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: audit
      # INFRA-M6a: apply the schema BEFORE the service starts. All replicas run this
      # against one database simultaneously; kanz-migrate's advisory lock serializes
      # them, so one applies and the rest exit 0 with nothing to do.
      initContainers:
        - name: migrate
          image: ghcr.io/eighred/kanz-migrate@sha256:43799cfa71cb4ff6d5c290c2941d2f19d76b458d0c2ec0c110ee9294fc588334
          args: ["--dir", "/migrations/audit"]
          env:
            - { name: KANZ_MIGRATE_DATABASE_URL_FILE, value: /run/secrets/db/migrate-database-url }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: db, mountPath: /run/secrets/db, readOnly: true }
      containers:
        - name: audit
          # Pinned to a cosign-signed digest by the GitOps bump (CICD-01d).
          image: ghcr.io/eighred/audit@sha256:e7068fce73efb8641503b11175f2692bd9423f8f47820697613d01ebeffa0f50
          ports:
            # 8083 serves /metrics and the probes and NOTHING tenant-scoped;
            # allow-observability-scrape admits it. The /v1 compliance reads are
            # on 8102, which that rule does not admit and only the gateway may
            # reach (#627).
            - { containerPort: 8083, name: metrics }
            - { containerPort: 8102, name: api }
          env:
            # DSN from the SEC-01d CSI secret file, not a plaintext env.
            - { name: AUDIT_DATABASE_URL_FILE, value: /run/secrets/db/database-url }
            # WHO MAY READ THE ESTATE-WIDE CHAIN ATTESTATION (#118).
            #
            # /v1/audit/verify is the one read on this surface that is NOT
            # tenant-scoped, and cannot be: the hash chain is one sequence across
            # every tenant, so verifying a subset proves nothing about it. Its
            # attestation therefore carries an estate-wide RECORD COUNT, which
            # tells any authenticated caller how much other tenants' activity
            # this platform is carrying. A tenant sees its own vault; this figure
            # is not its own.
            #
            # ONE ROLE IS LOAD-BEARING AND ONE IS ASPIRATIONAL, and this comment
            # used to claim both were. The operator role is the human who
            # investigates. The monitoring role was granted because "the monitoring
            # role is what actually runs the check on a schedule" — and NOTHING IN
            # THIS REPOSITORY CALLS /v1/audit/verify, on a schedule or otherwise
            # (#665). The sentence describing the grant's purpose was the only
            # implementation of it, which is the failure it warned about — "tamper
            # detection depending on somebody remembering to look" — written down
            # as though it had been prevented.
            #
            # THE SCHEDULE NOW EXISTS, AND IT IS NOT THIS ROLE (#665). The tamper
            # check runs IN-PROCESS on AUDIT_VERIFY_INTERVAL (default 1h), and its
            # outcome leaves the pod as three metrics rather than as a log line:
            # kanz_audit_chain_verifications_total{outcome}, seeded for all three
            # outcomes, and kanz_audit_chain_last_verified_timestamp_seconds,
            # seeded at 0 so a pod that has NEVER verified is alertable rather than
            # invisible. AuditChainTampered / AuditChainNotBeingVerified /
            # AuditChainVerificationFailing in infra/observability/alerts are what
            # make it detection; each is proven to fire by the promtool harness
            # beside them.
            #
            # WHY IN-PROCESS AND NOT A JOB CALLING THIS ENDPOINT. Two reasons, and
            # the second is the substantive one. identity issues tokens through
            # POST /login — a subject and an Argon2 credential against a user store
            # — so a scheduled caller would need a pseudo-user holding a long-lived
            # password with estate-wide read authority, which is a new credential
            # pattern and a security decision rather than a wiring change. And the
            # gateway hop would add a TRIGGER, not TRUST: /v1/audit/verify is
            # computed by this service either way, so an external caller changes
            # who schedules the check and not who attests to it, while adding a
            # second failure mode (a CronJob that silently stops). The failure an
            # external runner IS better at — this pod dying and taking the check
            # with it — is what the staleness alert covers, and it covers the
            # never-started and wedged cases too.
            #
            # SO kanz-monitoring IS NOW A GRANT WITH NO CALLER, and that is stated
            # rather than quietly left. It is kept because the endpoint remains the
            # way a monitoring plane or an auditor takes an attestation ON DEMAND,
            # which is a different question from "is it being checked" — but if
            # nothing ever does, it should be dropped rather than kept for a use
            # nobody has. Reviewed with #665.
            #
            # The binary REFUSES TO START with neither this nor
            # AUDIT_ALLOW_UNRESTRICTED_VERIFY set, so a deployment that forgets
            # the grant fails loudly instead of serving estate-wide counts to
            # every tenant.
            - { name: AUDIT_VERIFY_ROLES, value: "kanz-operator,kanz-monitoring" }
            - { name: AUDIT_LISTEN, value: ":8083" }
            - { name: AUDIT_API_LISTEN, value: ":8102" }
            - { name: AUDIT_NATS_URL, value: "nats://nats.kanz-messaging.svc:4222" }
            - { name: SPIFFE_ENDPOINT_SOCKET, value: "unix:///run/spiffe/spire-agent.sock" }
          livenessProbe:
            httpGet: { path: /healthz, port: 8083 }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 8083 }
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: db, mountPath: /run/secrets/db, readOnly: true }
            - { name: spiffe, mountPath: /run/spiffe, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: db
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: audit-db
        - name: spiffe
          csi:
            driver: csi.spiffe.io
            readOnly: true
---
# INFRA-01d / #234 — audit had no disruption budget at all.
# The hash chain is serialized at the DATABASE, so losing one pod is safe; losing
# both stops the chain advancing. An audit window holding no records is
# indistinguishable from a window in which nothing happened — the one outcome this
# service exists to rule out.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: audit
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: audit

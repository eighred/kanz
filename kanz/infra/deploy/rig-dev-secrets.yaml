# DEV-ONLY. Do not apply to any cluster that trades real money.
#
# Production mounts every DSN and credential from Vault through
# secrets-store.csi.k8s.io (infra/security/secrets/secretproviderclass.yaml).
# The dev rig has no Vault and cannot reach one (ONBOARD-M6), so tools/rig-apply.sh
# rewrites each Vault CSI volume into a reference to a Secret OF THE SAME NAME as
# the SecretProviderClass it replaces, and this file declares those Secrets.
#
# Each Secret's KEYS are the SecretProviderClass's objectName values, because those
# are the filenames the workload reads. Getting this wrong produces a mount that is
# present and empty, which every service reports as a config error rather than a
# missing secret.
#
# oms-db is deliberately NOT here — postgres-dev.yaml already declares it.
#
# redis-auth is the one Secret below in kanz-messaging rather than kanz-services:
# its SecretProviderClass (and the redis.yaml StatefulSet that mounts it) both live
# in kanz-messaging, and a same-named Secret in the wrong namespace is invisible to
# the pod that needs it.
apiVersion: v1
kind: Secret
metadata:
  name: tv-sync-db
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
    kanz.eighred.com/posture: dev-only
type: Opaque
stringData:
  # tvsync, NOT kanzapp: tv-sync owns a SEPARATE database from the OMS (postgres-dev.yaml
  # creates it). They cannot share one — kanz-migrate keys schema_migrations by version
  # and both services' 0001 migrations claim version 1, so a shared database makes
  # tv-sync's migrate reject the OMS's 0001_orders as a modified 0001_fact_log. This
  # mirrors production, where each service has its own Vault DSN.
  database-url: postgres://kanzapp:kanz@postgres.kanz-services.svc:5432/tvsync?sslmode=disable
  migrate-database-url: postgres://kanzapp:kanz@postgres.kanz-services.svc:5432/tvsync?sslmode=disable
---
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secrets
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
    kanz.eighred.com/posture: dev-only
type: Opaque
stringData:
  # HS256 signing secret for the dev gateway token. A known value in a committed
  # dev file is acceptable ONLY because this rig trades against the simulator.
  signing-secret: dev-only-not-a-real-signing-secret
  # HS256 validator key for the dev auth path. Production authenticates with
  # OIDC/JWKS against the real IdP; the rig cannot reach it, so tools/rig_dev_patch.py
  # drops API_GATEWAY_OIDC_ISSUER and points the gateway at this key instead.
  # Without it the gateway authenticates nobody here and its order routes cannot
  # be exercised at all.
  jwt-secret: dev-only-not-a-real-jwt-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: webhook-ingest-redis
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
    kanz.eighred.com/posture: dev-only
type: Opaque
stringData:
  # Redis's Service lives in kanz-messaging (infra/messaging/redis.yaml), not
  # kanz-services — redis.kanz-services.svc can never resolve.
  #
  # Redis also REFUSES TO START unauthenticated (see redis.yaml's command block), so
  # this DSN must carry the SAME password as the redis-auth Secret below or the
  # connection never authenticates. TestRigDevSecretsShadowEverySecretProviderClassTheRigMounts
  # (rig_dev_posture_test.go) parses both out and fails if they ever drift apart —
  # do not change one without the other.
  redis-url: redis://:dev-only-not-a-real-redis-password@redis.kanz-messaging.svc:6379
---
apiVersion: v1
kind: Secret
metadata:
  # Namespace is kanz-messaging, NOT kanz-services like every other Secret in this
  # file — it shadows infra/security/secrets/secretproviderclass.yaml's redis-auth
  # SecretProviderClass, which infra/messaging/redis.yaml mounts and which is
  # declared in kanz-messaging. A Secret of this name in the wrong namespace mounts
  # nothing and Redis exits 1 rather than start unauthenticated.
  name: redis-auth
  namespace: kanz-messaging
  labels:
    app.kubernetes.io/part-of: kanz
    kanz.eighred.com/posture: dev-only
type: Opaque
stringData:
  # Must be byte-for-byte the password embedded in webhook-ingest-redis's redis-url
  # above — see that comment.
  password: dev-only-not-a-real-redis-password
---
apiVersion: v1
kind: Secret
metadata:
  name: webhook-ingest-config
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
    kanz.eighred.com/posture: dev-only
type: Opaque
stringData:
  # webhook-ingest refuses to start (exits 2) without this file — WEBHOOK_INGEST_CONFIG
  # points straight at it and the whole file is the bootstrap `config.bootstrap` struct,
  # not a single HMAC field. Field names taken from
  # kanz/services/webhook-ingest/internal/config/config.go (the `bootstrap` struct
  # unmarshalled by loadBootstrap): strategies maps a TradingView strategy_id to its
  # HMAC secret; symbols/prices/equity/funds drive the M1 simulation venue allocation
  # and are safe to leave empty here because this rig trades against the simulator,
  # not a real venue.
  config.json: |
    {
      "strategies": {"dev": "dev-only-not-a-real-hmac-secret"},
      "symbols": {"AAPL": "AAPL.XNAS"},
      "prices": {"AAPL.XNAS": "100"},
      "equity": {"fund-alpha": "1000000"},
      "funds": {"fund-alpha": [{"venue": "XNAS", "weight": "1"}]},
      "max_size": "1000000",
      "max_leverage": "10"
    }

---
# INFRA-M7a-3 — the OKX Spot exchange, as its own workload.
#
# This process holds the exchange API credentials, signs the requests, and runs
# the private websocket. The OMS holds none of that any more: it reaches this
# service over venue.v1/mTLS and links no OKX code at all. That is the whole
# point of the split — a compromise or a crash in vendor client code no longer
# shares an address space with the process that owns order state.
#
# THE SCALE INVARIANT: replicas: 1, and NOT for the reason the OMS was pinned.
#
#   The OMS's old pin was a correctness bug (a process-local admission gate).
#   This one is an exchange constraint, identical in shape to venue-binance's:
#   OKX's REST rate limit is per API KEY, not per process, while the connector's
#   weight budget is enforced per process. Two pods spend twice the budget against
#   one key and get the account RATE-LIMITED or BANNED — taking this venue down
#   entirely, not just one pod.
#
#   Fills themselves are safe to duplicate: fill_id is derived from the exchange
#   trade id (symbol-tradeId), so two pods publishing the same fill dedup on the
#   bus. It is the REST budget, not correctness, that makes this a singleton.
#
#   Scaling this service means sharding by symbol with a key per shard, or moving
#   the weight budget into a shared store. Do not simply raise the replica count.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: venue-okx
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
imagePullSecrets:
  - name: ghcr-pull
---
apiVersion: v1
kind: Service
metadata:
  name: venue-okx
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  selector:
    app: venue-okx
  ports:
    # venue.v1 — the OMS dials this. It can submit orders to a live exchange.
    - { name: grpc, port: 9000, targetPort: 9000 }
    - { name: http, port: 8092, targetPort: 8092 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: venue-okx
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
    # DR scales by this label, never `--all` (#149) — see infra/dr/failover.sh step 4.
    kanz.io/singleton: "true"
spec:
  # See THE SCALE INVARIANT above. Raising this without sharding the API key
  # exhausts the exchange weight budget and can get the account banned.
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    # Never run two pods at once, even briefly during a rollout — the overlap
    # would double the REST weight against one key.
    type: Recreate
  selector:
    matchLabels:
      app: venue-okx
  template:
    metadata:
      labels:
        app: venue-okx
        app.kubernetes.io/part-of: kanz
      annotations:
        # Scraped by infra/observability/prometheus.yaml (role: pod discovery).
        # The port is the HTTP surface, NOT the gRPC one: a scrape against gRPC
        # cannot succeed, and the result is a DOWN target rather than an error.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8092"
    spec:
      # Drain budget: DERIVED, and deliberately not restated here. The arithmetic
      # this comment used to carry still read 27s long after the real figure had
      # grown past it (#264), so the number now lives in exactly one place:
      # test/arch/pod_disruption_and_drain_test.go recomputes the floor from the
      # source on every run and fails this file the moment 60 stops covering it.
      # See availability.yaml for what the floor is made of.
      terminationGracePeriodSeconds: 60
      serviceAccountName: venue-okx
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # INFRA-M6a: the adapter's own order view schema, before it starts.
      initContainers:
        - name: migrate
          image: ghcr.io/eighred/kanz-migrate@sha256:43799cfa71cb4ff6d5c290c2941d2f19d76b458d0c2ec0c110ee9294fc588334
          args: ["--dir", "/migrations/venue-okx"]
          env:
            - { name: KANZ_MIGRATE_DATABASE_URL_FILE, value: /run/secrets/db/migrate-database-url }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: db, mountPath: /run/secrets/db, readOnly: true }
      containers:
        - name: venue-okx
          # Pinned to a cosign-signed digest by the GitOps bump (CICD-01d).
          image: ghcr.io/eighred/venue-okx@sha256:4747e03c9da06388c20df1030b65ff046cc63f9e304d89dd9badf48d7cfd7987
          ports:
            - { containerPort: 9000, name: grpc }
            - { containerPort: 8092, name: http }
          env:
            # Exchange credentials from the SEC-01d Vault/CSI secret FILES. These
            # can move the fund's money — they never ride in a pod's env block.
            - { name: OKX_API_KEY_FILE, value: /run/secrets/okx/api-key }
            - { name: OKX_API_SECRET_FILE, value: /run/secrets/okx/api-secret }
            # OKX's THIRD credential (OK-ACCESS-PASSPHRASE), chosen when the API
            # key was created. Without it EVERY signed request is rejected — it is
            # as load-bearing as the secret, and mounted the same way.
            - { name: OKX_API_PASSPHRASE_FILE, value: /run/secrets/okx/api-passphrase }
            # The adapter's own order view (INFRA-M7a-3). Without it the healing
            # watchdog goes blind across a restart.
            - { name: VENUE_OKX_DATABASE_URL_FILE, value: /run/secrets/db/database-url }
            - { name: VENUE_OKX_TENANT, value: "__system__" }
            # The ASYNC half of the venue contract. A resting order fills minutes
            # later on the websocket and this is the ONLY way that fill reaches the
            # OMS. The binary refuses to start without it, deliberately.
            - { name: VENUE_OKX_NATS_URL, value: "nats://nats.kanz-messaging.svc:4222" }
            - { name: VENUE_OKX_GRPC_LISTEN, value: ":9000" }
            - { name: VENUE_OKX_LISTEN, value: ":8092" }
            - { name: VENUE_OKX_SOURCE, value: "venue-okx" }
            - { name: OKX_MIC, value: "XOKX" }
            # The EXCHANGE ACCOUNT this adapter's API credential belongs to. Everything it
            # fills margins and liquidates against THIS account, whichever portfolio the
            # order was for — so it is the collateral boundary, and the OMS binds
            # portfolios to it by this name (OMS_VENUE_ACCOUNTS).
            - { name: OKX_VENUE_ACCOUNT, value: "okx-sub-1" }
            # ...and this is OKX'S OWN id (uid) for that account — the only thing that can
            # be CHECKED (SOV-02a). At startup the adapter asks OKX which account the
            # mounted API key belongs to (GET /api/v5/account/config) and REFUSES TO SERVE
            # ORDERS if the answer is not this. Without it the name above is a claim nobody
            # has ever tested, and a wrong one posts fills to another fund's ledger rows
            # while the exchange debits the right account.
            #
            # EMPTY, as shipped: nobody has bound the uid yet, so the adapter cannot prove
            # itself — and it would refuse to start, which is why the escape hatch below is
            # set. Fill this in with the uid of the account the mounted key belongs to,
            # then DELETE the escape hatch and set OMS_REQUIRE_VERIFIED_ACCOUNT on the OMS.
            - { name: OKX_VENUE_ACCOUNT_UID, value: "" }
            # The explicit admission that this adapter's account is UNPROVEN. It is not a
            # default and it is not an absence: without it the adapter refuses to start,
            # because absence of configuration must never quietly become trust. It does NOT
            # forgive a WRONG account — if OKX says the key belongs elsewhere, the adapter
            # refuses regardless. The OMS counts every adapter in this state
            # (kanz_oms_unverified_venue_account_total).
            - { name: OKX_ALLOW_UNVERIFIED_ACCOUNT, value: "true" }
            # OKX has no separate testnet host — this IS the live exchange, and the
            # credentials decide whether the account is a demo one. Treat a change
            # to the key mount as a change to what this pod can spend.
            # DEMO UNTIL SOMEONE DECIDES OTHERWISE (#147). OKX serves demo and
            # production from this SAME host and separates them by the
            # `x-simulated-trading: 1` header the adapter now sends, so this URL
            # is NOT evidence of either mode — OKX_TRADING_MODE below is.
            #
            # Changing that value to "live" is the entire act of going live. It
            # is one line, it is reviewable, and it is the line to look at in a
            # diff; before this the same decision was invisible because there
            # was no demo to be in.
            - { name: OKX_BASE_URL, value: "https://www.okx.com" }
            - { name: OKX_TRADING_MODE, value: "demo" }
            - { name: OKX_WS_BASE, value: "wss://ws.okx.com:8443" }
            - { name: OKX_SYMBOLS, value: "BTC-USDT=BTC-USDT,ETH-USDT=ETH-USDT" }
            # ARMED, NOW THAT THE ESTATE IS CORRECTED (#419). #407 fixed the map
            # above — BTC-USD=BTCUSDT recorded a USDT pair as dollars — and left
            # this control OFF by design, on the argument written at
            # quote_match_test.go: a check that refuses to start every adapter
            # nobody has corrected yet is a trading outage, so it "is armed WITH
            # the estate in hand". The estate is in hand: the map above is the
            # corrected one and TestTheCorrectedMappingPasses proves the check is
            # silent against it.
            #
            # WHAT IT STOPS IS THE SPLIT COMING BACK. An id whose quote the venue
            # does not trade means positions, currency exposure and every limit
            # checked against them are denominated in an asset the adapter does
            # not hold — and the rows written under it neither join to the rest of
            # the estate nor disappear. Unarmed, that is a log line at startup
            # nobody reads; armed, the adapter refuses to trade at all.
            - { name: OKX_REQUIRE_QUOTE_MATCH, value: "true" }
            - { name: SPIFFE_ENDPOINT_SOCKET, value: "unix:///run/spiffe/spire-agent.sock" }
            # WHO MAY SUBMIT ORDERS THROUGH THIS ADAPTER. Required whenever the
            # socket above is set: without it the process refuses to start.
            #
            # This listener used to authorize with AuthorizeMesh(), which admits any
            # peer holding a valid SVID in kanz.internal — and issuing SVIDs to every
            # workload is exactly what the trust domain does. So "only the OMS may
            # trade" rested entirely on the NetworkPolicy one layer down, with nothing
            # in this process refusing anyone. The NetworkPolicy is still there; it is
            # now defence in depth rather than the only control, which is the same
            # posture operator-deploy.yaml takes for OPERATOR_ALLOWED_CLIENTS.
            - name: VENUE_OKX_ALLOWED_CLIENTS
              value: "spiffe://kanz.internal/ns/kanz-services/sa/oms"
          livenessProbe:
            httpGet: { path: /healthz, port: 8092 }
            initialDelaySeconds: 5
            periodSeconds: 15
          # Not ready until it can actually work an order: credentials loaded,
          # order view open, bus connected, venue.v1 listening. A venue adapter
          # that reports ready before it can trade gets live orders routed into it.
          readinessProbe:
            httpGet: { path: /readyz, port: 8092 }
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: okx, mountPath: /run/secrets/okx, readOnly: true }
            - { name: db, mountPath: /run/secrets/db, readOnly: true }
            - { name: spiffe, mountPath: /run/spiffe, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: okx
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: venue-okx-keys
        - name: db
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: venue-okx-db
        - name: spiffe
          csi:
            driver: csi.spiffe.io
            readOnly: true
---
# INFRA-01d / #234 — venue-okx had no disruption budget at all.
# SINGLETON — zero allowed voluntary disruptions, deliberately (availability.yaml).
# Same failure as venue-binance: this pod holds the only session for the OKX account,
# and fills that land during a reschedule are not replayed to the OMS afterwards.
# Order state diverges silently, which no restart repairs.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: venue-okx
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: venue-okx

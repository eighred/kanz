---
# EXEC-M11 — the pre-trade mandate authority, which had no deployment.
#
# IT ENFORCES — BUT ONLY WHAT SOMEBODY PUT UNDER MANDATE (EXEC-M13).
#
#   A portfolio with no mandate is governed by nothing, and that is SILENT: the
#   engine takes the "no mandate governs this portfolio" branch and returns nil. It
#   is not an error, and it does not look like one.
#
#   So: `kanz-mandate` is the operator tool that puts a portfolio under mandate, and
#   it is the ONLY producer. Until it is run for a portfolio, that portfolio's orders
#   are unconstrained — by both this monitor and the OMS's pre-trade gate.
#
#   (Until EXEC-M13 there was no producer AT ALL: the publisher sat in a package no
#   other binary could import, every registry on the platform was permanently empty,
#   and two controls — one of them on the capital path — reported healthy while
#   permitting everything.)
#
# THE REPLICA INVARIANT: 1, AND IT IS A CORRECTNESS BOUND.
#
#   The monitor holds each portfolio's whole book in memory and computes NAV and
#   concentration by summing it. Its subscriptions use a CONSUMER GROUP, which
#   LOAD-BALANCES: each risk.position.changed FACT goes to exactly one pod. With two
#   replicas each pod sums only the positions IT happened to receive, so both
#   evaluate mandates against a partial book — WRONG NAV, WRONG RATIOS, MISSED
#   BREACHES AND PHANTOM ONES.
#
#   Breach emission is also per-pod: it fires on the TRANSITION into BREACH using an
#   in-process lastStatus map, so N replicas can emit N breach FACTs for one event —
#   distinct event_ids, so the bus will not collapse them.
#
#   Recreate, not RollingUpdate: an overlap of two pods is the same defect.
#
# COLD-START — FIXED (EXEC-M13). The mandate registry used to be fed by a durable
# consumer that resumes at its last ack, so a restarted pod replayed NOTHING and came
# back with an empty registry: a rolling restart silently DISARMED enforcement. It now
# arms by BROADCAST over the compacted MANDATE stream (one subject per portfolio,
# DeliverLastPerSubject), so a pod that boots — today or next year — comes up holding
# the mandate in force for every portfolio.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: compliance
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
imagePullSecrets:
  - name: ghcr-pull
---
apiVersion: v1
kind: Service
metadata:
  name: compliance
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  selector:
    app: compliance
  ports:
    - { name: http, port: 8091, targetPort: 8091 }
    # THE MANDATE-CHANGE API (#562, #410 act two) ON ITS OWN PORT.
    #
    # NOT A SECOND ROUTE ON :8091, and the reason is a security one rather than
    # tidiness. allow-observability-scrape admits :8091 from every pod in
    # kanz-observability because /metrics is there; these routes decide who governs
    # a portfolio from the principal header the api-gateway injects, so on that port
    # a pod in the monitoring namespace could send two self-chosen principals and
    # hold BOTH signatures. #232 named the fix as a second listener per service;
    # optimization (#409) and accounting (#447) made it first.
    - { name: mandate-api, port: 8095, targetPort: 8095 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
    # DR scales by this label, never `--all` (#149) — see infra/dr/failover.sh step 4.
    kanz.io/singleton: "true"
spec:
  # ONE. See THE REPLICA INVARIANT above.
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: compliance
  template:
    metadata:
      labels:
        app: compliance
        app.kubernetes.io/part-of: kanz
      annotations:
        # Scraped by infra/observability/prometheus.yaml (role: pod discovery).
        # The port is the HTTP surface, NOT the gRPC one: a scrape against gRPC
        # cannot succeed, and the result is a DOWN target rather than an error.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8091"
    spec:
      # Drain budget: DERIVED, and deliberately not restated here. The arithmetic
      # this comment used to carry still read 27s long after the real figure had
      # grown past it (#264), so the number now lives in exactly one place:
      # test/arch/pod_disruption_and_drain_test.go recomputes the floor from the
      # source on every run and fails this file the moment 60 stops covering it.
      # See availability.yaml for what the floor is made of.
      terminationGracePeriodSeconds: 60
      serviceAccountName: compliance
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: compliance
          # Pinned to a cosign-signed digest by the GitOps bump (CICD-01d).
          image: ghcr.io/eighred/compliance@sha256:6148aeb14b632d3429745c9992abcf2eaad55b3ec7d0ddd2c9c7bf489096b0d2
          ports:
            - { containerPort: 8091, name: http }
            - { containerPort: 8095, name: mandate-api }
          env:
            - { name: COMPLIANCE_LISTEN, value: ":8091" }
            # The mandate propose/approve/queue routes and NOTHING else. See the
            # Service above for why they are not on :8091, and
            # services/compliance/internal/config for the same argument in code.
            #
            # IT IS ONLY MOUNTED WHEN COMPLIANCE_NATS_URL IS SET: approving a
            # mandate change publishes a ConfigChanged FACT, and a route that took
            # a second signature with nowhere to publish it would be the silent
            # drop this control exists to end.
            - { name: COMPLIANCE_API_LISTEN, value: ":8095" }
            # WITHOUT THIS the service reports READY while consuming nothing at all —
            # it degrades to probes-only and says so in one log line. Readiness is
            # only meaningful when the spine is configured.
            - { name: COMPLIANCE_NATS_URL, value: "nats://nats.kanz-messaging.svc:4222" }
            - { name: COMPLIANCE_SOURCE, value: "compliance" }
            - { name: COMPLIANCE_CONSUMER_GROUP, value: "compliance" }
            # Must match DATAMASTER_TENANT on the instance named below: datamaster
            # serves one tenant and 404s every other caller.
            - { name: COMPLIANCE_TENANT, value: "__system__" }
            # WHAT THE POST-TRADE BOOK IS WORTH (#787).
            #
            # The monitor's own input is position FACTs, which carry holdings and
            # nothing else — no cash, and values the OMS recorded at AVERAGE COST.
            # Gross exposure is the sum of the same values, so a max_gross_leverage
            # cap scored exactly 1.0 for any long-only book and bound on nothing
            # (#780). These two folds are the rest of the equity: what accounting
            # says a portfolio can spend, and what its holdings are worth now.
            #
            # THE SUBJECTS ARE THE OMS'S, and that is not a coincidence to preserve
            # by hand: both default from internal/marketdata/mark.DefaultSubjects,
            # the fold's own consumption set. A leverage cap valued off one feed
            # before the trade and another after it would give two answers for
            # reasons no operator could see.
            #
            # SET IT TO "" TO RUN WITH NO PRICE FEED. That is a legal posture and it
            # is announced at startup: books cannot be valued, so gross-leverage
            # rules REFUSE rather than report a ratio, while concentration,
            # restriction and issuer rules are unaffected. Unlike the OMS — which
            # refuses to START on a blank list, because a pod folding no marks
            # rejects every MARKET/STOP order — this service degrades instead.
            - { name: COMPLIANCE_PRICE_SUBJECTS, value: "market.*.trade,market.*.quote" }
            # HOW OLD A MARK MAY BE AND STILL VALUE A BOOK. A SAFETY BOUND, not a
            # tuning knob: mark.Source treats a non-positive value as NEVER EXPIRES,
            # so widening this to quiet "cannot be valued" refusals does not fix the
            # feed — it enforces a leverage cap against a number that stopped
            # moving. Non-positive is refused at startup.
            #
            # IT MUST EQUAL OMS_PRICE_MAX_AGE, AND THE EQUALITY IS NOW CHECKED
            # (#1002). This is one control with two halves: the OMS values a book
            # from the same mark fold before the trade and this monitor values it
            # after, through the same JoinEquity and the same LeverageRule. Raise
            # this alone and the monitor reports a leverage ratio off prices the OMS
            # already refuses to trade on. LOWER IT ALONE AND IT IS WORSE, not
            # safer: one holding past the bound leaves the whole book unmarked,
            # LeverageRule refuses "leverage cannot be verified", and the monitor
            # emits that as a BREACH the autopilot halts and escalates on — an
            # automated halt on a feed gap the execution plane is trading through.
            # test/arch/the_mark_bound_agrees_across_planes_test.go fails the build
            # when either side moves alone.
            - { name: COMPLIANCE_PRICE_MAX_AGE, value: "30s" }
            # HOW OFTEN EVERY BOOK IS RE-CHECKED against the marks and cash in force
            # now (#787).
            #
            # IT IS WHAT MAKES A PASSIVE BREACH VISIBLE AT ALL. Every other path into
            # the monitor is woken by a FACT — a position change, a cash
            # announcement — and the breach this service exists to catch is the one
            # with NO FACT behind it: a financed book that falls 20% raises its gross
            # leverage with no order placed anywhere.
            #
            # It bounds WORK, not latency. The sweep costs one evaluation per book
            # per interval, which is why the monitor does not re-evaluate on every
            # market tick — that would couple compliance to market-data volume, the
            # one rate on this platform nobody controls. The cost of this number is
            # up to that much delay in noticing a passive breach.
            #
            # There is no off switch: non-positive is refused at startup, because a
            # monitor that never re-evaluates is the state #787 is about.
            - { name: COMPLIANCE_REEVALUATE_INTERVAL, value: "60s" }
            # THE INSTRUMENT CLASSIFIER (#640). datamaster is the estate's golden
            # security master and the only place a sector, an issuer or an asset class
            # can be resolved from. WITHOUT THIS LINE this pod starts cleanly, logs one
            # WARN, exports kanz_instrument_classifier_wired 0, and the post-trade monitor
            # REFUSES every SECTOR, ISSUER and ASSET_CLASS rule instead of evaluating it.
            #
            # It reads GET /v1/securities/{id} on a background cycle and answers from
            # memory, so nothing on the monitor's fold waits on datamaster.
            # allow-classifier-reads-datamaster in
            # infra/security/runtime/network-policies.yaml is the other half: without
            # that rule every lookup fails and the cache stays empty.
            - { name: COMPLIANCE_DATAMASTER_URL, value: "http://datamaster.kanz-services.svc:8080" }
            # SEC-01a. infra/nats/nats.yaml serves `tls { verify: true,
            # verify_and_map: true }` — the bus is mTLS-ONLY. Without this socket the
            # mesh is disabled (transport.NewMesh("").Enabled() == false), the client
            # still meets a TLS server, and every connection dies with
            #   nats connect: nats: tls error: x509: certificate signed by unknown authority
            # which reads like a CA distribution problem and is actually this line
            # missing. internal/config already reads it; only the manifest was silent.
            - { name: SPIFFE_ENDPOINT_SOCKET, value: "unix:///run/spiffe/spire-agent.sock" }
          livenessProbe:
            httpGet: { path: /healthz, port: 8091 }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 8091 }
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: spiffe, mountPath: /run/spiffe, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: {}
        # The SPIFFE Workload API socket the env above points at.
        - name: spiffe
          csi:
            driver: csi.spiffe.io
            readOnly: true
---
# INFRA-01d / #234 — compliance had no disruption budget at all.
# SINGLETON — zero allowed voluntary disruptions, deliberately (availability.yaml).
# This is the pre-trade mandate authority and it holds each portfolio's whole book in
# memory. While it is gone, orders are governed by nothing — and the engine's "no
# mandate governs this portfolio" branch returns nil, so a control that is ABSENT and
# a control that PASSED look identical.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: compliance
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: compliance

---
# EXEC-M11 — the pre-trade mandate authority, which had no deployment.
#
# IT ENFORCES — BUT ONLY WHAT SOMEBODY PUT UNDER MANDATE (EXEC-M13).
#
#   A portfolio with no mandate is governed by nothing, and that is SILENT: the
#   engine takes the "no mandate governs this portfolio" branch and returns nil. It
#   is not an error, and it does not look like one.
#
#   So: `kanz-mandate` is the operator tool that puts a portfolio under mandate, and
#   it is the ONLY producer. Until it is run for a portfolio, that portfolio's orders
#   are unconstrained — by both this monitor and the OMS's pre-trade gate.
#
#   (Until EXEC-M13 there was no producer AT ALL: the publisher sat in a package no
#   other binary could import, every registry on the platform was permanently empty,
#   and two controls — one of them on the capital path — reported healthy while
#   permitting everything.)
#
# THE REPLICA INVARIANT: 1, AND IT IS A CORRECTNESS BOUND.
#
#   The monitor holds each portfolio's whole book in memory and computes NAV and
#   concentration by summing it. Its subscriptions use a CONSUMER GROUP, which
#   LOAD-BALANCES: each risk.position.changed FACT goes to exactly one pod. With two
#   replicas each pod sums only the positions IT happened to receive, so both
#   evaluate mandates against a partial book — WRONG NAV, WRONG RATIOS, MISSED
#   BREACHES AND PHANTOM ONES.
#
#   Breach emission is also per-pod: it fires on the TRANSITION into BREACH using an
#   in-process lastStatus map, so N replicas can emit N breach FACTs for one event —
#   distinct event_ids, so the bus will not collapse them.
#
#   Recreate, not RollingUpdate: an overlap of two pods is the same defect.
#
# COLD-START — FIXED (EXEC-M13). The mandate registry used to be fed by a durable
# consumer that resumes at its last ack, so a restarted pod replayed NOTHING and came
# back with an empty registry: a rolling restart silently DISARMED enforcement. It now
# arms by BROADCAST over the compacted MANDATE stream (one subject per portfolio,
# DeliverLastPerSubject), so a pod that boots — today or next year — comes up holding
# the mandate in force for every portfolio.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: compliance
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
imagePullSecrets:
  - name: ghcr-pull
---
apiVersion: v1
kind: Service
metadata:
  name: compliance
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  selector:
    app: compliance
  ports:
    - { name: http, port: 8091, targetPort: 8091 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
    # DR scales by this label, never `--all` (#149) — see infra/dr/failover.sh step 4.
    kanz.io/singleton: "true"
spec:
  # ONE. See THE REPLICA INVARIANT above.
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: compliance
  template:
    metadata:
      labels:
        app: compliance
        app.kubernetes.io/part-of: kanz
      annotations:
        # Scraped by infra/observability/prometheus.yaml (role: pod discovery).
        # The port is the HTTP surface, NOT the gRPC one: a scrape against gRPC
        # cannot succeed, and the result is a DOWN target rather than an error.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8091"
    spec:
      # Drain budget: DERIVED, and deliberately not restated here. The arithmetic
      # this comment used to carry still read 27s long after the real figure had
      # grown past it (#264), so the number now lives in exactly one place:
      # test/arch/pod_disruption_and_drain_test.go recomputes the floor from the
      # source on every run and fails this file the moment 60 stops covering it.
      # See availability.yaml for what the floor is made of.
      terminationGracePeriodSeconds: 60
      serviceAccountName: compliance
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: compliance
          # Pinned to a cosign-signed digest by the GitOps bump (CICD-01d).
          image: ghcr.io/eighred/compliance@sha256:e15b44ed75d049fe76e4c13209e5270772e935abc7ee60511cb9bf22103cdf58
          ports:
            - { containerPort: 8091, name: http }
          env:
            - { name: COMPLIANCE_LISTEN, value: ":8091" }
            # WITHOUT THIS the service reports READY while consuming nothing at all —
            # it degrades to probes-only and says so in one log line. Readiness is
            # only meaningful when the spine is configured.
            - { name: COMPLIANCE_NATS_URL, value: "nats://nats.kanz-messaging.svc:4222" }
            - { name: COMPLIANCE_SOURCE, value: "compliance" }
            - { name: COMPLIANCE_CONSUMER_GROUP, value: "compliance" }
            # SEC-01a. infra/nats/nats.yaml serves `tls { verify: true,
            # verify_and_map: true }` — the bus is mTLS-ONLY. Without this socket the
            # mesh is disabled (transport.NewMesh("").Enabled() == false), the client
            # still meets a TLS server, and every connection dies with
            #   nats connect: nats: tls error: x509: certificate signed by unknown authority
            # which reads like a CA distribution problem and is actually this line
            # missing. internal/config already reads it; only the manifest was silent.
            - { name: SPIFFE_ENDPOINT_SOCKET, value: "unix:///run/spiffe/spire-agent.sock" }
          livenessProbe:
            httpGet: { path: /healthz, port: 8091 }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 8091 }
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: spiffe, mountPath: /run/spiffe, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: {}
        # The SPIFFE Workload API socket the env above points at.
        - name: spiffe
          csi:
            driver: csi.spiffe.io
            readOnly: true
---
# INFRA-01d / #234 — compliance had no disruption budget at all.
# SINGLETON — zero allowed voluntary disruptions, deliberately (availability.yaml).
# This is the pre-trade mandate authority and it holds each portfolio's whole book in
# memory. While it is gone, orders are governed by nothing — and the engine's "no
# mandate governs this portfolio" branch returns nil, so a control that is ABSENT and
# a control that PASSED look identical.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: compliance
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: compliance

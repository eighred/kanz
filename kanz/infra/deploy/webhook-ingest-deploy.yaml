---
# EXEC-M11 — the FIRST HOP OF THE TRADING LOOP, which had no deployment at all.
#
# This is the HMAC webhook that receives every TradingView signal. It had no
# manifest and no image, so nothing on this platform could accept a signal: the
# delivered loop had no entry point in production. It was invisible because the
# deployability check we were running compared images against MANIFESTS — a closed
# loop over the files that happened to exist (EXEC-M10).
#
# THE REPLICA INVARIANT: 1, AND IT IS NOT ABOUT CAPACITY.
#
#   THE REPLAY DEFENCE IS PER-POD, BECAUSE NO REDIS IS CONFIGURED. The nonce cache
#   (strategy_id + nonce) lives in one process. Two pods are two caches, so a
#   re-delivered TradingView alert that lands on the other pod is admitted a SECOND
#   time and fans out a SECOND set of SubmitOrder commands. The OMS's admission gate
#   dedups on order_id — but a fresh nonce mints a fresh order_id, so this is exactly
#   the gap that gate cannot close.
#
#   THE CODE NO LONGER FORCES THIS (EXEC-M17). The nonce store is cross-pod the moment
#   WEBHOOK_INGEST_REDIS_URL points at a Redis and the image is built with -tags redis;
#   then a re-delivered alert is a replay wherever it lands, and this pin comes off. What
#   remains is that the estate HAS no Redis yet (infra-gated), so the flag below is set
#   and the pod says so at WARN on every boot.
#
#   The pin and the flag are ONE decision, and they move together: point REDIS_URL at a
#   Redis, delete WEBHOOK_INGEST_ALLOW_INPROCESS_NONCE, raise replicas, drop Recreate. If
#   you raise replicas WITHOUT the first two, every extra pod is a double-trade machine —
#   which is why the binary REFUSES TO START without one of them.
#
#   Recreate, not RollingUpdate: two webhook-ingest processes must never be live at
#   once, for the reason above.
#
#   (The halt gate USED to be a second, independent reason: it was opened by a
#   ModeChanged FACT consumed through a CONSUMER GROUP, and a group load-balances —
#   so an operator's resume reached one replica while the other stayed latched closed
#   and 423'd half the signals. EXEC-M12 made that subscription a BROADCAST, so every
#   pod now learns the current mode, and a restarted pod learns it at startup instead
#   of coming back halted forever. That bound is lifted; the nonce cache is not.)
#
# THE CONFIG IS THE SECRET. WEBHOOK_INGEST_CONFIG points at a bootstrap JSON that
# carries the per-strategy HMAC SECRETS (the authority boundary for every signal
# this platform acts on) alongside the symbol map and the venue allocation. The
# service has no <VAR>_FILE convention because it does not need one: the whole file
# is mounted from Vault/CSI and read from disk. It is REQUIRED — the process exits 2
# without it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webhook-ingest
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-ingest
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  selector:
    app: webhook-ingest
  ports:
    - { name: http, port: 8090, targetPort: 8090 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-ingest
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  # ONE. See THE REPLICA INVARIANT above. This is a correctness bound, not a
  # capacity one: raising it silently breaks the kill switch and the replay guard.
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: webhook-ingest
  template:
    metadata:
      labels:
        app: webhook-ingest
        app.kubernetes.io/part-of: kanz
    spec:
      serviceAccountName: webhook-ingest
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook-ingest
          # Pinned to a cosign-signed digest by the GitOps bump (CICD-01d).
          image: ghcr.io/kanz-eng/webhook-ingest:latest
          ports:
            - { containerPort: 8090, name: http }
          env:
            # The bootstrap config — HMAC secrets, symbol map, venue allocation —
            # mounted from Vault/CSI. REQUIRED: the process exits 2 without it.
            - { name: WEBHOOK_INGEST_CONFIG, value: /run/secrets/webhook/config.json }
            - { name: WEBHOOK_INGEST_LISTEN, value: ":8090" }
            - { name: WEBHOOK_INGEST_NATS_URL, value: "nats://nats.kanz-messaging.svc:4222" }
            - { name: WEBHOOK_INGEST_SOURCE, value: "webhook-ingest" }
            # The nonce replay window. A signal replayed outside it is refused.
            - { name: WEBHOOK_INGEST_REPLAY_WINDOW, value: "5m" }
            # THE REPLAY DEFENCE'S STORE (EXEC-M17). Empty ⇒ the nonce cache is an
            # in-process map, which is correct for EXACTLY ONE REPLICA — see the replica
            # invariant at the top of this file. Point it at a Redis (and build the image
            # with -tags redis) and the defence becomes cross-pod.
            #
            # It carries a password, so in a real deployment it is a CSI/Vault file mount
            # (WEBHOOK_INGEST_REDIS_URL_FILE), never a plaintext value here.
            - { name: WEBHOOK_INGEST_REDIS_URL, value: "" }
            # The EXPLICIT admission that the replay defence is per-pod. Without it — and
            # without a Redis URL — the process REFUSES TO START, because a per-pod replay
            # defence reachable by FORGETTING to configure Redis is indistinguishable from
            # a correct one, and the deployment that forgot is the one an autoscaler will
            # quietly take to N pods. Delete this the day Redis lands, and lift replicas
            # in the same change.
            - { name: WEBHOOK_INGEST_ALLOW_INPROCESS_NONCE, value: "true" }
            # EMPTY, ON PURPOSE — and it is NOT an open door. See
            # webhook-ingest-ingress.yaml.
            #
            # This allowlist is checked against the CONNECTION PEER (r.RemoteAddr);
            # X-Forwarded-For is deliberately not trusted, because a client can forge
            # it. Behind the Ingress the peer is ALWAYS the ingress-nginx pod and
            # NEVER TradingView — so this variable used to name TradingView's four
            # egress ranges and would have 401'd EVERY SIGNAL the moment the service
            # was actually exposed. The loop's entry point, dead, with the pod
            # reporting healthy.
            #
            # The perimeter is therefore split across the layers that can each see
            # what they check: the CLIENT IP at the Ingress (whitelist-source-range),
            # the PEER by pod identity in NetworkPolicy (allow-ingress-to-webhook-
            # ingest, which admits only ingress-nginx), and the SENDER by HMAC over
            # the raw body + the nonce replay cache — the only one of the three that
            # authenticates anything.
            #
            # Set this ONLY in the Cloudflare-relay topology (WEBHOOK_INGEST_
            # CLOUDFLARE_ONLY=1, no Ingress), where the peer really is Cloudflare.
            - { name: WEBHOOK_INGEST_IP_ALLOWLIST, value: "" }
          livenessProbe:
            httpGet: { path: /healthz, port: 8090 }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 8090 }
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: webhook-config, mountPath: /run/secrets/webhook, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: webhook-config
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: webhook-ingest-config

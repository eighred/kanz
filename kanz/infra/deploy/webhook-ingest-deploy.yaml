---
# EXEC-M11 — the FIRST HOP OF THE TRADING LOOP, which had no deployment at all.
#
# This is the HMAC webhook that receives every TradingView signal. It had no
# manifest and no image, so nothing on this platform could accept a signal: the
# delivered loop had no entry point in production. It was invisible because the
# deployability check we were running compared images against MANIFESTS — a closed
# loop over the files that happened to exist (EXEC-M10).
#
# THE REPLICA PIN IS OFF (EXEC-M22): 2 REPLICAS, RollingUpdate.
#
#   It used to be 1/Recreate, and that was a CORRECTNESS bound, not a capacity one: the
#   replay defence was an IN-PROCESS map. Two pods were two caches, so a re-delivered
#   TradingView alert landing on the other pod was admitted a SECOND time and fanned out a
#   SECOND set of SubmitOrder commands. The OMS's admission gate dedups on order_id — but a
#   fresh nonce mints a fresh order_id, so that gate could never close this gap.
#
#   WHAT THE PIN COST: this is the FIRST HOP of the trading loop, the one service the
#   internet talks to. On `Recreate`, every deploy, node drain and pod eviction took it
#   FULLY OFFLINE, and a TradingView alert arriving in that window hit nothing — TradingView
#   does not reliably retry, so the fund silently missed the trade. The platform could not be
#   updated without a hole in its own entrance.
#
#   WHAT LIFTED IT: the nonce store is now Redis (infra/messaging/redis.yaml), so a
#   re-delivered alert is a replay WHEREVER IT LANDS. The image is built with `-tags redis`
#   and WEBHOOK_INGEST_REDIS_URL_FILE points at the DSN below.
#
#   THE THREE MOVE TOGETHER, ALWAYS: the Redis DSN, the `-tags redis` image, and replicas > 1.
#   Raising replicas without the first two makes every extra pod a double-trade machine —
#   which is why the binary REFUSES TO START if it has neither a reachable Redis nor the
#   explicit in-process admission, and refuses to start if the DSN is set but the binary was
#   built without the tag. The image and the manifest cannot silently disagree.
#
#   maxUnavailable: 0 — a surge pod passes readiness BEFORE an old one goes down, so there is
#   no instant with nothing listening. That is the point of the whole task.
#
#   IF REDIS IS DOWN, the store fails CLOSED: alerts are refused with a retryable 503, not
#   admitted with no replay defence. A refusal the sender can retry is recoverable; a double
#   trade against a live exchange is not. Redis is a single instance today (see its manifest)
#   — that residual is on the board, and it is a strictly better failure than the one it
#   replaced.
#
#   (The halt gate USED to be a second, independent reason: it was opened by a
#   ModeChanged FACT consumed through a CONSUMER GROUP, and a group load-balances —
#   so an operator's resume reached one replica while the other stayed latched closed
#   and 423'd half the signals. EXEC-M12 made that subscription a BROADCAST, so every
#   pod now learns the current mode, and a restarted pod learns it at startup instead
#   of coming back halted forever. Both bounds are now lifted.)
#
# THE CONFIG IS THE SECRET. WEBHOOK_INGEST_CONFIG points at a bootstrap JSON that
# carries the per-strategy HMAC SECRETS (the authority boundary for every signal
# this platform acts on) alongside the symbol map and the venue allocation. The
# service has no <VAR>_FILE convention because it does not need one: the whole file
# is mounted from Vault/CSI and read from disk. It is REQUIRED — the process exits 2
# without it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webhook-ingest
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
imagePullSecrets:
  - name: ghcr-pull
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-ingest
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  selector:
    app: webhook-ingest
  ports:
    - { name: http, port: 8090, targetPort: 8090 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-ingest
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  # TWO, and the pin is off (EXEC-M22).
  #
  # This was 1/Recreate — a CORRECTNESS bound, not a capacity one: the replay defence was an
  # in-process map, so a second pod was a second cache and a re-delivered alert traded twice.
  # The cost was that every deploy, drain and eviction took the platform's ENTRANCE fully
  # offline, and a TradingView alert arriving in that window hit nothing and was never
  # retried. The fund silently missed the trade.
  #
  # The defence is cross-pod now (Redis, above), so the bound is gone and the entrance
  # survives its own rollout.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never fewer than 2 live: a surge pod comes up and passes readiness BEFORE an old one
      # is taken down, so there is no instant at which nothing is listening for an alert.
      maxUnavailable: 0
      maxSurge: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: webhook-ingest
  template:
    metadata:
      labels:
        app: webhook-ingest
        app.kubernetes.io/part-of: kanz
    spec:
      serviceAccountName: webhook-ingest
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook-ingest
          # Pinned to a cosign-signed digest by the GitOps bump (CICD-01d).
          image: ghcr.io/kanz-eng/webhook-ingest:latest
          ports:
            - { containerPort: 8090, name: http }
          env:
            # The bootstrap config — HMAC secrets, symbol map, venue allocation —
            # mounted from Vault/CSI. REQUIRED: the process exits 2 without it.
            - { name: WEBHOOK_INGEST_CONFIG, value: /run/secrets/webhook/config.json }
            - { name: WEBHOOK_INGEST_LISTEN, value: ":8090" }
            - { name: WEBHOOK_INGEST_NATS_URL, value: "nats://nats.kanz-messaging.svc:4222" }
            - { name: WEBHOOK_INGEST_SOURCE, value: "webhook-ingest" }
            # SEC-01a. The bus is mTLS-ONLY (infra/nats/nats.yaml sets tls.verify).
            # Without this socket the mesh stays disabled and the dial fails with
            # "x509: certificate signed by unknown authority" — a CA-shaped error
            # whose actual cause is this missing line. internal/config already reads it.
            - { name: SPIFFE_ENDPOINT_SOCKET, value: "unix:///run/spiffe/spire-agent.sock" }
            # The nonce replay window. A signal replayed outside it is refused.
            - { name: WEBHOOK_INGEST_REPLAY_WINDOW, value: "5m" }
            # THE REPLAY DEFENCE'S STORE — now CROSS-POD (EXEC-M17 wrote it, EXEC-M22
            # landed the Redis it was waiting for).
            #
            # The nonce cache lives in Redis, so a re-delivered TradingView alert is a
            # replay WHEREVER IT LANDS. That is the whole reason this Deployment can run
            # more than one pod, and therefore the reason a deploy no longer takes the
            # platform's entrance offline.
            #
            # The DSN carries a password, so it is a CSI/Vault file mount (SEC-01d), never
            # a plaintext value in the pod spec.
            #
            # If Redis is unreachable the store FAILS CLOSED: the alert is refused with a
            # retryable 503 rather than admitted with no replay defence. A refusal the
            # sender can retry is recoverable; a double trade against a live exchange is not.
            - { name: WEBHOOK_INGEST_REDIS_URL_FILE, value: /run/secrets/redis/redis-url }
            #
            # WEBHOOK_INGEST_ALLOW_INPROCESS_NONCE IS DELETED, and must not come back.
            # It was the explicit admission that the replay defence was per-pod, and it is
            # what made `replicas: 1` mandatory. Re-adding it while replicas > 1 turns every
            # extra pod into a double-trade machine — which is why the binary refuses to
            # start with a REDIS_URL it cannot reach, and refuses to start with neither.
            # EMPTY, ON PURPOSE — and it is NOT an open door. See
            # webhook-ingest-ingress.yaml.
            #
            # This allowlist is checked against the CONNECTION PEER (r.RemoteAddr);
            # X-Forwarded-For is deliberately not trusted, because a client can forge
            # it. Behind the Ingress the peer is ALWAYS the ingress-nginx pod and
            # NEVER TradingView — so this variable used to name TradingView's four
            # egress ranges and would have 401'd EVERY SIGNAL the moment the service
            # was actually exposed. The loop's entry point, dead, with the pod
            # reporting healthy.
            #
            # The perimeter is therefore split across the layers that can each see
            # what they check: the CLIENT IP at the Ingress (whitelist-source-range),
            # the PEER by pod identity in NetworkPolicy (allow-ingress-to-webhook-
            # ingest, which admits only ingress-nginx), and the SENDER by HMAC over
            # the raw body + the nonce replay cache — the only one of the three that
            # authenticates anything.
            #
            # Set this ONLY in the Cloudflare-relay topology (WEBHOOK_INGEST_
            # CLOUDFLARE_ONLY=1, no Ingress), where the peer really is Cloudflare.
            - { name: WEBHOOK_INGEST_IP_ALLOWLIST, value: "" }
          livenessProbe:
            httpGet: { path: /healthz, port: 8090 }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 8090 }
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: webhook-config, mountPath: /run/secrets/webhook, readOnly: true }
            - { name: redis, mountPath: /run/secrets/redis, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            - { name: spiffe, mountPath: /run/spiffe, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: {}
        # The SPIFFE Workload API socket the env above points at.
        - name: spiffe
          csi:
            driver: csi.spiffe.io
            readOnly: true
        # Removing this volume does not degrade the replay defence — it stops the pod from
        # starting, because the binary refuses to run without a nonce store it can reach.
        - name: redis
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: webhook-ingest-redis
        - name: webhook-config
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: webhook-ingest-config

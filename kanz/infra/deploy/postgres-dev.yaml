# DEV-ONLY Postgres for the kind rig. NOT a production database.
#
# WHY THIS FILE EXISTS. The rig's Postgres was never declared anywhere. Somebody
# ran CREATE ROLE / CREATE DATABASE against a pod by hand on 2026-07-12 and wrote
# the DSN into a Secret. The pod has no volumes, so when it was recreated the role
# and the database went with it — and the OMS's migrate init container has been
# failing since with `password authentication failed for user "kanzapp"`, which
# reads like a wrong password and is really a missing role. The rig could not be
# rebuilt from source, because the source never described it.
#
# This is the same failure the NATS bootstrap had: a one-shot setup step with no
# re-run path. The fix has the same shape. Postgres's entrypoint runs every
# /docker-entrypoint-initdb.d/*.sql on a FRESH data directory, so the role and
# database are recreated by exactly the event that destroyed them.
#
# STORAGE IS DELIBERATELY EPHEMERAL. The goal is a rig that REBUILDS from this
# file, not one that retains state. A PVC would preserve the data and, with it,
# the next undeclared hand-edit — invisible again until the next restart.
# Consequently: everything in this database is disposable. Do not put anything
# here you would miss.
#
# THE PASSWORD IS COMMITTED ON PURPOSE. It is already plaintext in
# .github/workflows/kanz-ci.yml, it guards nothing but a local kind cluster, and
# a dev credential that lives only in somebody's shell history is precisely what
# produced this outage. Production credentials come from Vault via the CSI mounts
# in oms-deploy.yaml and tv-sync-deploy.yaml, which this file does not touch.
#
# THE APP ROLE'S VALUES COME FROM CI, NOT FROM TASTE. The kanzapp role, its
# password and its database are copied verbatim from kanz-ci.yml so that the rig
# and CI are one convention rather than two. test/arch/postgres_dev_convention_test.go
# fails if they drift apart in either direction. The bootstrap superuser below is
# NOT part of that pin — see the comment on POSTGRES_USER.
#
#   kubectl apply -f infra/deploy/postgres-dev.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-dev-initdb
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
    kanz.eighred.com/posture: dev-only
data:
  # Runs ONCE per fresh data directory, as the POSTGRES_USER superuser, before
  # the server accepts external connections.
  #
  # NOSUPERUSER IS LOAD-BEARING — it is not hardening decoration. Every tenant
  # table runs `FORCE  ROW LEVEL SECURITY` (13 occurrences across 11 migrations),
  # which makes the isolation policy bind even the table's OWNER. It does NOT
  # bind a superuser: Postgres exempts superusers from RLS unconditionally. So a
  # superuser DSN does not merely widen access, it makes every tenant-isolation
  # test pass while proving nothing.
  #
  # Because the tables FORCE RLS, one role owning its own database is safe, and
  # that is why there is no separate migrate role here: CI does not have one
  # either. A split would be a third convention.
  010-kanzapp.sql: |
    CREATE ROLE kanzapp LOGIN PASSWORD 'kanz' NOSUPERUSER;
    CREATE DATABASE kanzapp OWNER kanzapp;
    \connect kanzapp
    GRANT ALL ON SCHEMA public TO kanzapp;
  # tv-sync keeps its FACT LOG in a SEPARATE database from the OMS, the same shape
  # production has: each service holds its own Vault DSN (kv/kanz/tv-sync vs
  # kv/kanz/oms), i.e. its own database. They MUST NOT share one on the rig either:
  # kanz-migrate keys schema_migrations by version, and the OMS's 0001_orders and
  # tv-sync's 0001_fact_log BOTH claim version 1 — in one database tv-sync's migrate
  # reads the OMS's version-1 row and rejects it as a modified migration, and refuses
  # to start. Same kanzapp role (it owns this database too, so FORCE RLS still binds).
  020-tvsync.sql: |
    CREATE DATABASE tvsync OWNER kanzapp;
    \connect tvsync
    GRANT ALL ON SCHEMA public TO kanzapp;
  # venue-binance's ORDER VIEW (INFRA-M7a-2), for the same reason tv-sync has its
  # own above and with the same collision behind it: the adapter's migrations start
  # at 0001_venue_orders, the OMS's at 0001_orders, and kanz-migrate keys
  # schema_migrations by version — sharing kanzapp makes the adapter's migrate read
  # the OMS's version-1 row, reject it as a modified migration, and refuse to start.
  #
  # It is declared HERE rather than created by hand because this Deployment's data
  # volume is an emptyDir: a database typed into psql survives exactly until the pod
  # is rescheduled, and then venue-binance CrashLoopBackOffs on a database that
  # existed an hour ago. Anything the rig needs across a restart belongs in this
  # ConfigMap.
  #
  # The adapter is NOT part of the trading-loop subset tools/rig-apply.sh applies —
  # it needs real exchange credentials, which rig-dev-secrets.yaml is guarded to
  # forbid. This database costs nothing when unused, and its absence is what blocks
  # standing the adapter up against an exchange TESTNET, which is the one way to
  # exercise the out-of-process venue path at all.
  030-venuebinance.sql: |
    CREATE DATABASE venuebinance OWNER kanzapp;
    \connect venuebinance
    GRANT ALL ON SCHEMA public TO kanzapp;
---
apiVersion: v1
kind: Secret
metadata:
  name: oms-db
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
    kanz.eighred.com/posture: dev-only
type: Opaque
stringData:
  # Two keys because the deployments mount two: the migrate init container reads
  # migrate-database-url and the service reads database-url. In PRODUCTION these
  # differ — migrate holds a DDL-capable credential the service deliberately does
  # not have, so a compromised service cannot alter its own schema. Here they are
  # the SAME string, because CI's single role owns its database and can therefore
  # do both.
  #
  # That collapse is a dev simplification and must not be read as the production
  # shape. Production keeps them distinct via the Vault-backed CSI mounts in
  # oms-deploy.yaml; this file does not change that and does not apply there.
  database-url: postgres://kanzapp:kanz@postgres.kanz-services.svc:5432/kanzapp?sslmode=disable
  migrate-database-url: postgres://kanzapp:kanz@postgres.kanz-services.svc:5432/kanzapp?sslmode=disable
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  selector:
    app: postgres
  ports:
    - { name: postgres, port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
    kanz.eighred.com/posture: dev-only
    # DR scales by this label, never `--all` (#149) — see infra/dr/failover.sh step 4.
    kanz.io/singleton: "true"
spec:
  # One. Two replicas over one emptyDir each are two unrelated databases behind a
  # single Service name, handing out different answers per connection.
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: a rolling update would briefly run a second,
    # empty database serving the same Service.
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/part-of: kanz
    spec:
      # Dev rig only, but a SIGKILL mid-checkpoint still costs crash recovery on the
      # next start, which reads as a broken rig. Matches the estate — see
      # availability.yaml.
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:16-alpine
          # MAX_CONNECTIONS IS DERIVED, AND A GUARD RE-DERIVES IT (#228).
          #
          # It was never set here, so it was the postgres:16 default of 100 — a
          # number nobody chose, and one THIS RIG's demand exceeds by more than
          # three times, because the rig runs the WHOLE estate against ONE server.
          # That multiple is a fact about the rig and not about production: there
          # the demand is partitioned across five CNPG clusters and only kanz-books
          # exceeds 100. See infra/dr/postgres/cluster.yaml, which sizes each of
          # them, and do not read the number below as a production figure.
          # Meanwhile no pool was sized either, so
          # pgx used max(4, runtime.NumCPU()); with no CPU quota on any workload
          # that is the NODE's core count, and on a 16-core node every pod took 16.
          # Neither half fails at startup — pools are lazy — so the first symptom
          # was `FATAL: sorry, too many clients already` on a QUERY, in whichever
          # service happened to warm last.
          #
          # test/arch/pool_budget_test.go recomputes the whole sum from these
          # manifests plus internal/pg on every CI run, so raising a
          # maxReplicaCount, adding a second pool to a service, or raising
          # pg.ServiceMaxConns is a red build rather than an outage during the
          # market event the scale-out existed for:
          #
          #   ceiling(w) = max(spec.replicas, the KEDA ScaledObject's maxReplicaCount)
          #   pools(w)   = pg.New*Pool calls in that service's composition root
          #                (risk-engine opens TWO: its tenant-scoped state pool and
          #                the market-data price store)
          #   steady     = Σ ceiling(w) x pools(w) x pg.ServiceMaxConns(4) = 308
          #   surge      = the largest single rolling update WHILE at ceiling
          #                (risk-engine, 3 surge pods x 2 pools x 4)        =  24
          #   reserve    = superuser_reserved_connections (3, and Postgres's own
          #                default) + an operator, a DR restore and a human with
          #                psql. Without it the first thing to fail at the ceiling
          #                is the ability to log in and find out why       =  13
          #   need       = 345
          #
          # 400, not 345: the guard bounds this from above at 2x the derivation, and
          # a round number leaves room for the unmodelled without the value ceasing
          # to be a bound. kanz-migrate is NOT a term — its initContainer runs to
          # completion before its pod's app container starts, so its one connection
          # never coexists with the four already reserved for that same pod.
          args: ["postgres", "-c", "max_connections=400"]
          # 400 BACKENDS ARE NOT FREE, AND THE LIMITRANGE DEFAULT DOES NOT FUND THEM.
          # Every other container here takes availability.yaml's 512Mi/1Gi default;
          # at ~2-3MiB of private memory per idle backend plus shared_buffers, 400
          # connections would OOMKill this pod on a limit chosen for a service. This
          # is the one workload on the estate whose memory is a function of a number
          # in its own argv, so it is the one that states it. CPU is deliberately
          # left to the LimitRange: the rig never has 400 ACTIVE backends, and
          # changing it would move the quota's CPU derivation for no reason.
          resources:
            requests: { memory: 2Gi }
            limits: { memory: 4Gi }
          ports:
            - { containerPort: 5432, name: postgres }
          env:
            # The bootstrap superuser, used only by the initdb script above and
            # by operators. Services connect as kanzapp. This identity deliberately
            # differs from CI's Postgres service (POSTGRES_USER/PASSWORD/DB: kanz) —
            # it matches the postgres:16-alpine image default instead. Only the
            # kanzapp role/database/password/DSN are pinned as a shared convention
            # with CI; nothing depends on the bootstrap superuser's identity.
            - { name: POSTGRES_USER, value: "postgres" }
            - { name: POSTGRES_PASSWORD, value: "postgres" }
            - { name: POSTGRES_DB, value: "kanz" }
            # initdb writes into the data directory, and mounting a volume at
            # /var/lib/postgresql/data itself leaves a lost+found that initdb
            # refuses to start on. The subdirectory is the documented shape.
            - { name: PGDATA, value: "/var/lib/postgresql/data/pgdata" }
          volumeMounts:
            - { name: initdb, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "kanz"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "kanz"]
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: initdb
          configMap:
            name: postgres-dev-initdb
        # Ephemeral on purpose — see the header.
        - name: data
          emptyDir: {}

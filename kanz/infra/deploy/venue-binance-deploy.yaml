---
# INFRA-M7a-2 — the Binance Spot exchange, as its own workload.
#
# This process holds the exchange API credentials, signs the requests, and runs
# the private websocket. The OMS holds none of that any more: it reaches this
# service over venue.v1/mTLS and links no Binance code at all. That is the whole
# point of the split — a compromise or a crash in vendor client code no longer
# shares an address space with the process that owns order state.
#
# THE SCALE INVARIANT: replicas: 1, and NOT for the reason the OMS was pinned.
#
#   The OMS's old pin was a correctness bug (a process-local admission gate).
#   This one is an exchange constraint. Binance's REST weight limit is per API
#   KEY, not per process, but the connector's weight budget (1200) is enforced
#   per process. Two pods would spend 2400 weight against one key's 1200 and get
#   the account RATE-LIMITED or BANNED — taking every venue down, not just this
#   pod.
#
#   Fills themselves are safe to duplicate: fill_id is derived from the exchange
#   trade id (symbol-tradeId), so two pods publishing the same fill dedup on the
#   bus. It is the REST budget, not correctness, that makes this a singleton.
#
#   Scaling this service means sharding by symbol with a key per shard, or moving
#   the weight budget into a shared store. Do not simply raise the replica count.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: venue-binance
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
imagePullSecrets:
  - name: ghcr-pull
---
apiVersion: v1
kind: Service
metadata:
  name: venue-binance
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  selector:
    app: venue-binance
  ports:
    # venue.v1 — the OMS dials this. It can submit orders to a live exchange.
    - { name: grpc, port: 9000, targetPort: 9000 }
    - { name: http, port: 8091, targetPort: 8091 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: venue-binance
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
    # DR scales by this label, never `--all` (#149) — see infra/dr/failover.sh step 4.
    kanz.io/singleton: "true"
spec:
  # See THE SCALE INVARIANT above. Raising this without sharding the API key
  # exhausts the exchange weight budget and can get the account banned.
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    # Never run two pods at once, even briefly during a rollout — the overlap
    # would double the REST weight against one key.
    type: Recreate
  selector:
    matchLabels:
      app: venue-binance
  template:
    metadata:
      labels:
        app: venue-binance
        app.kubernetes.io/part-of: kanz
      annotations:
        # Scraped by infra/observability/prometheus.yaml (role: pod discovery).
        # The port is the HTTP surface, NOT the gRPC one: a scrape against gRPC
        # cannot succeed, and the result is a DOWN target rather than an error.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8091"
    spec:
      # Drain budget: 7s bus drain + 15s HTTP shutdown + 5s OTLP flush, run
      # SEQUENTIALLY after SIGTERM = 27s. The k8s default of 30 leaves three
      # seconds and SIGKILLs mid-drain. See availability.yaml for the derivation.
      terminationGracePeriodSeconds: 45
      serviceAccountName: venue-binance
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # INFRA-M6a: the adapter's own order view schema, before it starts.
      initContainers:
        - name: migrate
          image: ghcr.io/eighred/kanz-migrate@sha256:909865997d2e96fd9898c5c34a6f11ade3cd65b71a18f1424d0bcda118e0e689
          args: ["--dir", "/migrations/venue-binance"]
          env:
            - { name: KANZ_MIGRATE_DATABASE_URL_FILE, value: /run/secrets/db/migrate-database-url }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: db, mountPath: /run/secrets/db, readOnly: true }
      containers:
        - name: venue-binance
          # Pinned to a cosign-signed digest by the GitOps bump (CICD-01d).
          image: ghcr.io/eighred/venue-binance@sha256:d327962cd360e433e03b633165b39edcf71289ec8273ff8e3893229378b3fb82
          ports:
            - { containerPort: 9000, name: grpc }
            - { containerPort: 8091, name: http }
          env:
            # Exchange credentials from the SEC-01d Vault/CSI secret FILES. These
            # can move the fund's money — they never ride in a pod's env block.
            - { name: BINANCE_API_KEY_FILE, value: /run/secrets/binance/api-key }
            - { name: BINANCE_API_SECRET_FILE, value: /run/secrets/binance/api-secret }
            # The adapter's own order view (INFRA-M7a-2). Without it the healing
            # watchdog goes blind across a restart.
            - { name: VENUE_BINANCE_DATABASE_URL_FILE, value: /run/secrets/db/database-url }
            - { name: VENUE_BINANCE_TENANT, value: "__system__" }
            # The ASYNC half of the venue contract. A resting order fills minutes
            # later on the websocket and this is the ONLY way that fill reaches the
            # OMS. The binary refuses to start without it, deliberately.
            - { name: VENUE_BINANCE_NATS_URL, value: "nats://nats.kanz-messaging.svc:4222" }
            - { name: VENUE_BINANCE_GRPC_LISTEN, value: ":9000" }
            - { name: VENUE_BINANCE_LISTEN, value: ":8091" }
            - { name: VENUE_BINANCE_SOURCE, value: "venue-binance" }
            - { name: BINANCE_MIC, value: "XBIN" }
            # The EXCHANGE ACCOUNT this adapter's API credential belongs to. Everything it
            # fills margins and liquidates against THIS account, whichever portfolio the
            # order was for — so it is the collateral boundary, and the OMS binds
            # portfolios to it by this name (OMS_VENUE_ACCOUNTS).
            - { name: BINANCE_VENUE_ACCOUNT, value: "binance-main" }
            # ...and this is BINANCE'S OWN id (uid) for that account — the only thing that
            # can be CHECKED (SOV-02a). At startup the adapter asks Binance which account
            # the mounted API key belongs to (GET /api/v3/account) and REFUSES TO SERVE
            # ORDERS if the answer is not this. Without it the name above is a claim nobody
            # has ever tested, and a wrong one posts fills to another fund's ledger rows
            # while the exchange debits the right account.
            #
            # EMPTY, as shipped: nobody has bound the uid yet, so the adapter cannot prove
            # itself — and it would refuse to start, which is why the escape hatch below is
            # set. Fill this in with the uid of the account the mounted key belongs to,
            # then DELETE the escape hatch and set OMS_REQUIRE_VERIFIED_ACCOUNT on the OMS.
            - { name: BINANCE_VENUE_ACCOUNT_UID, value: "" }
            # The explicit admission that this adapter's account is UNPROVEN. It is not a
            # default and it is not an absence: without it the adapter refuses to start,
            # because absence of configuration must never quietly become trust. It does NOT
            # forgive a WRONG account — if Binance says the key belongs elsewhere, the
            # adapter refuses regardless. The OMS counts every adapter in this state
            # (kanz_oms_unverified_venue_account_total).
            - { name: BINANCE_ALLOW_UNVERIFIED_ACCOUNT, value: "true" }
            # Testnet by default. Pointing this at the live exchange is a
            # deliberate, reviewable edit — not a default.
            - { name: BINANCE_BASE_URL, value: "https://testnet.binance.vision" }
            - { name: BINANCE_WS_BASE, value: "wss://testnet.binance.vision" }
            - { name: BINANCE_SYMBOLS, value: "BTC-USD=BTCUSDT,ETH-USD=ETHUSDT" }
            - { name: SPIFFE_ENDPOINT_SOCKET, value: "unix:///run/spiffe/spire-agent.sock" }
          livenessProbe:
            httpGet: { path: /healthz, port: 8091 }
            initialDelaySeconds: 5
            periodSeconds: 15
          # Not ready until it can actually work an order: credentials loaded,
          # order view open, bus connected, venue.v1 listening. A venue adapter
          # that reports ready before it can trade gets live orders routed into it.
          readinessProbe:
            httpGet: { path: /readyz, port: 8091 }
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: binance, mountPath: /run/secrets/binance, readOnly: true }
            - { name: db, mountPath: /run/secrets/db, readOnly: true }
            - { name: spiffe, mountPath: /run/spiffe, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: binance
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: venue-binance-keys
        - name: db
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: venue-binance-db
        - name: spiffe
          csi:
            driver: csi.spiffe.io
            readOnly: true
---
# INFRA-01d / #234 — venue-binance had no disruption budget at all.
# SINGLETON — zero allowed voluntary disruptions, and this is the sharpest case on the
# estate (availability.yaml). Binance's user-data WebSocket carries NO replay: fills
# arriving while this pod reschedules are never delivered to the OMS, order state
# diverges from exchange state, and NOTHING reports the divergence. A `kubectl drain`
# at 03:00 must stall here and wait for a human, not proceed.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: venue-binance
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: venue-binance

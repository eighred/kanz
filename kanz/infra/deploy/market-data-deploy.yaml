---
# The durable price-history service — the last workload whose manifest was missing
# entirely.
#
# It folds market.v1 FACTs off the bus into price_observations: the store the risk
# engine marks positions against and the lakehouse reads. market-data-scaledobject.yaml
# has been pointing a KEDA ScaledObject at a Deployment named `market-data` that
# DID NOT EXIST — this is that Deployment.
#
# THE SCALE INVARIANT: safe to scale, and KEDA owns the count.
#
#   Unlike every other stateful workload on this board, this one genuinely scales.
#   Its write is idempotent AT THE ENGINE — INSERT ... ON CONFLICT (instrument_id,
#   observation_time, kind, knowledge_time) DO NOTHING — so a price redelivered to
#   any pod folds exactly once. All pods share one durable consumer group, so a FACT
#   goes to one of them; the idempotent insert is the backstop for redelivery, not
#   the primary path. There is no chain, no in-process sequence, and no per-key rate
#   limit.
#
#   replicas: 2 here is only the floor — market-data-scaledobject.yaml scales it
#   2..16 on bus backpressure (kanz_bus_pending_messages). Do not fight KEDA by
#   editing this number; change the ScaledObject.
#
# No RLS on price_observations (it is a universal price store, not tenant-owned —
# the linkstore rationale), so there is no app.tenant_id GUC to set. Contrast
# accounting, where forgetting that GUC silently emptied the ledger.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: market-data
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
imagePullSecrets:
  - name: ghcr-pull
---
apiVersion: v1
kind: Service
metadata:
  name: market-data
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  selector:
    app: market-data
  ports:
    - { name: http, port: 8082, targetPort: 8082 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-data
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  # The floor. KEDA (market-data-scaledobject.yaml) scales 2..16 on bus
  # backpressure and owns the live count.
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: market-data
  template:
    metadata:
      labels:
        app: market-data
        app.kubernetes.io/part-of: kanz
      annotations:
        # Scraped by infra/observability/prometheus.yaml (role: pod discovery).
        # The port is the HTTP surface, NOT the gRPC one: a scrape against gRPC
        # cannot succeed, and the result is a DOWN target rather than an error.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
    spec:
      # Drain budget: 7s bus drain + 15s HTTP shutdown + 5s OTLP flush, run
      # SEQUENTIALLY after SIGTERM = 27s. The k8s default of 30 leaves three
      # seconds and SIGKILLs mid-drain. See availability.yaml for the derivation.
      terminationGracePeriodSeconds: 45
      serviceAccountName: market-data
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # INFRA-01d: spread replicas across AZs.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: market-data
      # INFRA-M6a: apply 0001_price_history.sql before the pods start. Every replica
      # runs this against one database simultaneously; kanz-migrate's advisory lock
      # serializes them, so one applies and the rest exit 0 with nothing to do.
      initContainers:
        - name: migrate
          image: ghcr.io/eighred/kanz-migrate@sha256:909865997d2e96fd9898c5c34a6f11ade3cd65b71a18f1424d0bcda118e0e689
          args: ["--dir", "/migrations/market-data"]
          env:
            - { name: KANZ_MIGRATE_DATABASE_URL_FILE, value: /run/secrets/db/migrate-database-url }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: db, mountPath: /run/secrets/db, readOnly: true }
      containers:
        - name: market-data
          # Pinned to a cosign-signed digest by the GitOps bump (CICD-01d).
          image: ghcr.io/eighred/market-data@sha256:37d9cc8eacea3cbbb20e55b30e8510592f12607ba735aeb4ba02ca9db6683323
          ports:
            - { containerPort: 8082, name: http }
          env:
            # DSN from the SEC-01d CSI secret file, not a plaintext env. Without it
            # the service holds prices in memory and loses the history on restart.
            - { name: MARKET_DATA_DATABASE_URL_FILE, value: /run/secrets/db/database-url }
            - { name: MARKET_DATA_LISTEN, value: ":8082" }
            - { name: MARKET_DATA_SOURCE, value: "market-data" }
            - { name: MARKET_DATA_NATS_URL, value: "nats://nats.kanz-messaging.svc:4222" }
            # All replicas share ONE durable group, so a price FACT is delivered to
            # exactly one pod. The idempotent insert covers redelivery.
            - { name: MARKET_DATA_CONSUMER_GROUP, value: "market-data" }
            - { name: SPIFFE_ENDPOINT_SOCKET, value: "unix:///run/spiffe/spire-agent.sock" }
          livenessProbe:
            httpGet: { path: /healthz, port: 8082 }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 8082 }
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: db, mountPath: /run/secrets/db, readOnly: true }
            - { name: spiffe, mountPath: /run/spiffe, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: db
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: market-data-db
        - name: spiffe
          csi:
            driver: csi.spiffe.io
            readOnly: true
---
# INFRA-01d / #234 — market-data had no disruption budget at all.
# maxUnavailable, NOT minAvailable: 1. KEDA runs this 2..16 on bus backpressure, and
# minAvailable: 1 would let a drain evict fifteen of sixteen pods at once — during
# exactly the backlog that caused the scale-up. The risk engine marks positions
# against this store, so a price feed falling behind moves risk numbers.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: market-data
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: market-data

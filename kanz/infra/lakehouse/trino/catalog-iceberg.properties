# Trino Iceberg catalog for promoted lakehouse tables (LAKE-01d).
#
# A compaction/CDC-commit job rewrites the lake-sink NDJSON landing
# (catalog-hive.properties) into Iceberg tables: columnar Parquet, snapshot
# isolation, and schema evolution that tracks the EVT-16 payload schemas the
# lake-sink decoder already follows (LAKE-01a). Point-in-time-correct datasets
# (LAKE-01b) and the backtest harness (LAKE-01c) read these for reproducible
# research; Iceberg time-travel (FOR VERSION AS OF) complements the bitemporal
# AsOf reads.
connector.name=iceberg

iceberg.catalog.type=hive_metastore
hive.metastore.uri=thrift://hive-metastore.kanz-lakehouse.svc.cluster.local:9083

fs.native-s3.enabled=true
s3.endpoint=${ENV:LAKE_S3_ENDPOINT}
s3.region=${ENV:LAKE_S3_REGION}
s3.path-style-access=true

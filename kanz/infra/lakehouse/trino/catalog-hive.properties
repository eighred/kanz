# Trino Hive catalog over the lake-sink landing (LAKE-01d).
#
# lake-sink (LAKE-01a) writes Hive-partitioned NDJSON under
# {bucket}/{domain}/{entity}/dt=YYYY-MM-DD/part-*.ndjson. The Hive connector
# reads that layout directly as external tables (JSON format), so research can
# query the raw event log the moment it lands — no promotion step required. See
# example-queries.sql for the external-table DDL.
#
# A compaction job that rewrites NDJSON into Iceberg tables (smaller files,
# snapshot isolation, schema evolution) is served by catalog-iceberg.properties;
# this catalog is the always-available raw view.
connector.name=hive

# Hive Metastore Thrift endpoint (provisioned alongside; holds external-table
# definitions + partitions). Swap for a Glue catalog via hive.metastore=glue.
hive.metastore=thrift
hive.metastore.uri=thrift://hive-metastore.kanz-lakehouse.svc.cluster.local:9083

# S3-compatible object store holding the landing (the INFRA-01 bucket / MinIO).
# Endpoint + credentials come from the SEC-01d secret mount, not inline.
fs.native-s3.enabled=true
s3.endpoint=${ENV:LAKE_S3_ENDPOINT}
s3.region=${ENV:LAKE_S3_REGION}
s3.path-style-access=true

# Read-only research catalog: never let an ad-hoc query mutate the log of record.
hive.non-managed-table-writes-enabled=false
hive.storage-format=JSON

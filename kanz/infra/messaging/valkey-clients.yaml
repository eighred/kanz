apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey-clients
  namespace: kanz-messaging
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kanz-services
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [api-gateway, webhook-ingest]
      ports: [{protocol: TCP, port: 6379}]

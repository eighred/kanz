# The shared first-install cache serves gateway idempotency and webhook replay
# protection using their existing Redis protocol endpoints and secret mounts.
# A webhook claim acknowledged before a restart must keep its original expiry.
# AOF fsync on each write and no eviction preserve that property on this PVC.
# An unavailable store makes webhook ingest refuse a fresh alert. Gateway
# deduplication is best effort and remains independent of admission controls.
# The Tokyo testnet overlay pins its existing Redis runtime separately.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: kanz-messaging
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  selector:
    app: redis
  ports:
    - { name: redis, port: 6379, targetPort: 6379 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: kanz-messaging
  labels:
    app: redis
    app.kubernetes.io/part-of: kanz
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/part-of: kanz
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
          # The password is read from a FILE MOUNT at start (SEC-01d) and never appears as a
          # plaintext arg in the pod spec. Redis has no --requirepass-file directive — it
          # REJECTS one ("Bad directive") — so the value is interpolated here.
          #
          # AND IT REFUSES TO START WITHOUT ONE. `--requirepass "$(cat ...)"` with a missing or
          # empty file expands to `--requirepass ""`, and Redis then starts with NO PASSWORD AT
          # ALL — wide open on the pod network, holding the replay defence for a platform that
          # trades real money. A secret that fails to mount must take the pod DOWN, not silently
          # disarm the auth on it. (Found by RUNNING this command, not by reading it: the mount
          # failed in a local rehearsal and Redis came up unauthenticated.)
          #
          # `exec` replaces the shell, so redis stays PID 1 and still receives SIGTERM on drain.
          command:
            - "sh"
            - "-c"
            - |
              set -eu
              PW="$(cat /run/secrets/redis/password)"
              if [ -z "$PW" ]; then
                echo "redis: password file missing or empty - refusing to start UNAUTHENTICATED" >&2
                exit 1
              fi
              exec redis-server --appendonly yes --appendfsync always --maxmemory-policy noeviction --requirepass "$PW"
          ports:
            - { containerPort: 6379, name: redis }
          livenessProbe:
            exec:
              # A protocol error must produce a failing process status for the kubelet.
              command: &authenticatedPing
                - sh
                - -ec
                - |-
                  REDISCLI_AUTH="$(cat /run/secrets/redis/password)"
                  test -n "$REDISCLI_AUTH"
                  export REDISCLI_AUTH
                  exec redis-cli -e --raw ping
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            exec:
              command: *authenticatedPing
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: secret, mountPath: /run/secrets/redis, readOnly: true }
      volumes:
        - name: secret
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: redis-auth
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# A drain must not take the replay defence with it: while Redis is down, webhook-ingest fails
# closed and every TradingView alert gets a 503. That is safe, but it is still an outage of
# the entrance — so the node drain waits.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis
  namespace: kanz-messaging
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app: redis

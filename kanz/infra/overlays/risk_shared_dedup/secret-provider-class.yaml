apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: risk-engine-dedup
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  provider: vault
  parameters:
    vaultAddress: "https://vault.vault.svc:8200"
    vaultAuthMountPath: "kubernetes"
    roleName: "risk-engine-dedup"
    audience: "vault"
    vaultCACertPath: /run/spire/bundle/bundle.crt
    objects: |
      - objectName: "url"
        secretPath: "kv/data/kanz/risk-engine-dedup"
        secretKey: "url"

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - redis-service-account.yaml
  - ../../../dr/postgres/priorityclass.yaml
  - ../../../nats/namespace.yaml
  - ../../../nats/tenancy.yaml
  - ../../../nats/nats.yaml
  - ../../../nats/bootstrap-job.yaml
  - ../../../messaging/redis.yaml
  - postgres.yaml
  - postgres-provisioner.yaml
  - postgres-migrations.yaml
  - postgres-aliases.yaml
  - secret-provider-classes.yaml

commonAnnotations:
  kanz.io/availability: UNSUPPORTED
  kanz.io/environment: testnet-tokyo
  kanz.io/failure-domain: single-node

patches:
  - path: nats-config-patch.yaml
  - path: nats-bootstrap-patch.yaml
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: nats
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/metadata/labels/kanz.io~1availability
        value: UNSUPPORTED
      - op: add
        path: /spec/template/metadata/labels/kanz.io~1failure-domain
        value: single-node
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 4Gi
  - target:
      group: policy
      version: v1
      kind: PodDisruptionBudget
      name: nats
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 1
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: redis
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/kanz.io~1availability
        value: UNSUPPORTED
      - op: add
        path: /spec/template/metadata/labels/kanz.io~1failure-domain
        value: single-node
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { cpu: 250m, memory: 256Mi }
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: redis
      - op: replace
        path: /spec/template/spec/containers/0/command
        value:
          - sh
          - -c
          - |-
            set -eu
            PW="$(cat /run/secrets/redis/password)"
            if [ -z "$PW" ]; then
              echo "redis: password file missing or empty - refusing to start UNAUTHENTICATED" >&2
              exit 1
            fi
            exec redis-server --appendonly yes --appendfsync always --maxmemory-policy noeviction --requirepass "$PW"

images:
  - name: ghcr.io/spiffe/spiffe-helper
    newName: ghcr.io/spiffe/spiffe-helper
    digest: sha256:47f18fcd2bf1c99cbb9bdc6f4348b08fb74572f89ddd0bcf103de2a1b12ab6d9
  - name: nats
    newName: nats
    digest: sha256:d4ac35882ac65aff236cd65b9d3fa4d24332c681e1a85f94eedccd3cdd65b1da
  - name: natsio/nats-box
    newName: natsio/nats-box
    digest: sha256:ffce8bd103383f179f8c7f11cf645726acf5d17280706c530c3b342dbe16334c
  - name: redis
    newName: redis
    digest: sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
  - name: ghcr.io/cloudnative-pg/postgresql
    newName: ghcr.io/cloudnative-pg/postgresql
    newTag: 16.10-standard-bookworm
    digest: sha256:533e45e0a00c156bdab7c4d9a84fffa87259594725a3909c898e8645727d9555

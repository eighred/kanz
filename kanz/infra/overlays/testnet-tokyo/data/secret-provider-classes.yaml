apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: postgres-role-passwords
  namespace: kanz-data
spec:
  provider: vault
  parameters:
    vaultAddress: "https://vault.vault.svc:8200"
    vaultAuthMountPath: kubernetes
    roleName: postgres-provisioner
    audience: vault
    vaultCACertPath: /run/spire/bundle/bundle.crt
    objects: |
      - objectName: accounting-app
        secretPath: kv/data/kanz/testnet/postgres
        secretKey: accounting_app
      - objectName: accounting-migrate
        secretPath: kv/data/kanz/testnet/postgres
        secretKey: accounting_migrate
      - objectName: audit-app
        secretPath: kv/data/kanz/testnet/postgres
        secretKey: audit_app
      - objectName: audit-migrate
        secretPath: kv/data/kanz/testnet/postgres
        secretKey: audit_migrate
      - objectName: identity-app
        secretPath: kv/data/kanz/testnet/postgres
        secretKey: identity_app
      - objectName: identity-migrate
        secretPath: kv/data/kanz/testnet/postgres
        secretKey: identity_migrate
      - objectName: oms-app
        secretPath: kv/data/kanz/testnet/postgres
        secretKey: oms_app
      - objectName: oms-migrate
        secretPath: kv/data/kanz/testnet/postgres
        secretKey: oms_migrate
      - objectName: regulatory-app
        secretPath: kv/data/kanz/testnet/postgres
        secretKey: regulatory_app
      - objectName: regulatory-migrate
        secretPath: kv/data/kanz/testnet/postgres
        secretKey: regulatory_migrate
      - objectName: risk-engine-app
        secretPath: kv/data/kanz/testnet/postgres
        secretKey: risk_engine_app
      - objectName: risk-engine-migrate
        secretPath: kv/data/kanz/testnet/postgres
        secretKey: risk_engine_migrate
      - objectName: venue-binance-app
        secretPath: kv/data/kanz/testnet/postgres
        secretKey: venue_binance_app
      - objectName: venue-binance-migrate
        secretPath: kv/data/kanz/testnet/postgres
        secretKey: venue_binance_migrate
      - objectName: venue-okx-app
        secretPath: kv/data/kanz/testnet/postgres
        secretKey: venue_okx_app
      - objectName: venue-okx-migrate
        secretPath: kv/data/kanz/testnet/postgres
        secretKey: venue_okx_migrate
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: redis-auth
  namespace: kanz-messaging
spec:
  provider: vault
  parameters:
    vaultAddress: "https://vault.vault.svc:8200"
    vaultAuthMountPath: kubernetes
    roleName: redis
    audience: vault
    vaultCACertPath: /run/spire/bundle/bundle.crt
    objects: |
      - objectName: password
        secretPath: kv/data/kanz/redis
        secretKey: password

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: tv-sync-role-passwords
  namespace: kanz-data
spec:
  provider: vault
  parameters:
    vaultAddress: "https://vault.vault.svc:8200"
    vaultAuthMountPath: kubernetes
    roleName: postgres-provisioner
    audience: vault
    vaultCACertPath: /run/spire/bundle/bundle.crt
    objects: |
      - objectName: tv-sync-app
        secretPath: kv/data/kanz/testnet/postgres
        secretKey: tv_sync_app
      - objectName: tv-sync-migrate
        secretPath: kv/data/kanz/testnet/postgres
        secretKey: tv_sync_migrate

# Gateway egress is isolated by allow-gateway-identity-egress. Every required
# cold-start and configured upstream flow needs an explicit allowance (#1255).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-runtime-egress
  namespace: kanz-services
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kanz-messaging
          podSelector:
            matchLabels:
              app: nats
      ports:
        - { protocol: TCP, port: 4222 }
    # The release uses Redis for cross-pod idempotency claims. Its address is
    # mounted from Vault, so it does not appear among literal upstream env vars.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kanz-messaging
          podSelector:
            matchLabels:
              app: redis
      ports:
        - { protocol: TCP, port: 6379 }
    - to:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [risk-engine, oms] }
      ports:
        - { protocol: TCP, port: 9090 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kanz-operator
          podSelector:
            matchLabels:
              app: operator
      ports:
        - { protocol: TCP, port: 9090 }
    - to:
        - podSelector:
            matchLabels:
              app: compliance
      ports:
        - { protocol: TCP, port: 8095 }
    - to:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [wealth, datamaster, copilot] }
      ports:
        - { protocol: TCP, port: 8080 }
    - to:
        - podSelector:
            matchLabels:
              app: tv-sync
      ports:
        - { protocol: TCP, port: 8091 }
    - to:
        - podSelector:
            matchLabels:
              app: mcp
      ports:
        - { protocol: TCP, port: 8110 }
    - to:
        - podSelector:
            matchLabels:
              app: regulatory
      ports:
        - { protocol: TCP, port: 8103 }

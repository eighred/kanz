apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: venue-binance-account-proof
  namespace: kanz-services
  labels:
    app.kubernetes.io/part-of: kanz
spec:
  provider: vault
  parameters:
    vaultAddress: "https://vault.vault.svc:8200"
    vaultAuthMountPath: "kubernetes"
    roleName: "venue-binance"
    audience: "vault"
    vaultCACertPath: "/run/spire/bundle/bundle.crt"
    objects: |
      - objectName: "expected-account-uid"
        secretPath: "kv/data/kanz/account-master/binance"
        secretKey: "expected_uid"
---

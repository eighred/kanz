apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - account-proof-secret-provider-classes.yaml
  - ../../security/secrets/secretproviderclass.yaml
  - ../../deploy/analysis-template.yaml
  - ../../deploy/accounting-deploy.yaml
  - ../../deploy/api-gateway-deploy.yaml
  - ../../deploy/audit-deploy.yaml
  - ../../deploy/compliance-deploy.yaml
  - ../../deploy/identity-deploy.yaml
  - ../../deploy/oms-deploy.yaml
  - ../../deploy/risk-engine-rollout.yaml
  - ../../deploy/venue-binance-deploy.yaml
  - ../../deploy/venue-okx-deploy.yaml
  - governance-network-policies.yaml

commonAnnotations:
  kanz.io/release-commit: 39b37d989be503a3fe26556a07e3573db2060cb9
  kanz.io/testnet-region: ap-northeast-1

images:
  - name: ghcr.io/eighred/accounting
    newName: 012619468098.dkr.ecr.ap-northeast-1.amazonaws.com/accounting
    digest: sha256:57a62440f0a841483596a50cb2cdd876e25bcdb93212932145ecec018cc070fe
  - name: ghcr.io/eighred/api-gateway
    newName: 012619468098.dkr.ecr.ap-northeast-1.amazonaws.com/api-gateway
    digest: sha256:5b6432cfcabadc37e7742c93f9694aff41429c8c84f98188b06a14d45883266c
  - name: ghcr.io/eighred/audit
    newName: 012619468098.dkr.ecr.ap-northeast-1.amazonaws.com/audit
    digest: sha256:124bd73c8c4a9ad016d9a527ed975218424de983c300ec434a9a3b64b161cb41
  - name: ghcr.io/eighred/compliance
    newName: 012619468098.dkr.ecr.ap-northeast-1.amazonaws.com/compliance
    digest: sha256:c2dbb6a0417c5ca6d593a2d9fd780a29f340a8f6cb6b8e72a20ac7b1424aedad
  - name: ghcr.io/eighred/identity
    newName: 012619468098.dkr.ecr.ap-northeast-1.amazonaws.com/identity
    digest: sha256:9e7d37162e5af4f88c6954c8dfacf43a651860d7ed131206e7e3017c627be648
  - name: ghcr.io/eighred/kanz-migrate
    newName: 012619468098.dkr.ecr.ap-northeast-1.amazonaws.com/kanz-migrate
    digest: sha256:2024bbc091b2975e18436f5badb82075ddc5e46af55ad3feb4cf91b1a492b2ee
  - name: ghcr.io/eighred/oms
    newName: 012619468098.dkr.ecr.ap-northeast-1.amazonaws.com/oms
    digest: sha256:4dbd506d1a52a7a3707ea8464df6fe657dadf34d1b1b9c34996b9ce14e73c3ab
  - name: ghcr.io/eighred/risk-engine
    newName: 012619468098.dkr.ecr.ap-northeast-1.amazonaws.com/risk-engine
    digest: sha256:ad6455e88cc1eef0a9bc23fddd1129efef1c91ef00bc70c6fd9c785ed3a820b4
  - name: ghcr.io/eighred/venue-binance
    newName: 012619468098.dkr.ecr.ap-northeast-1.amazonaws.com/venue-binance
    digest: sha256:89beb1853a917bbc05a1dba5b6ac0cb10f972aff749b17e5a423c414418239c9
  - name: ghcr.io/eighred/venue-okx
    newName: 012619468098.dkr.ecr.ap-northeast-1.amazonaws.com/venue-okx
    digest: sha256:c3b06ae01b08e0e6471c5f3b37c1b5d1302a636ed123baf4815e56f99594180f

patches:
  # The canonical file is the sole owner of Vault paths and role bindings. This
  # overlay retains only classes mounted by its minimum capital-path graph.
  - target:
      kind: SecretProviderClass
      name: ^(redis-auth|alternatives-db|copilot-anthropic|datamaster-db|market-data-db|regulatory-db|schema-registry-db|tv-sync-db|wealth-db|webhook-ingest-config|webhook-ingest-redis)$
    patch: |-
      apiVersion: secrets-store.csi.x-k8s.io/v1
      kind: SecretProviderClass
      metadata:
        name: unused
      $patch: delete
  - target:
      kind: ServiceAccount
      name: ^(accounting|api-gateway|audit|compliance|identity|oms|risk-engine|venue-binance|venue-okx)$
    patch: |-
      - op: remove
        path: /imagePullSecrets
  - target:
      kind: Deployment
      name: ^(accounting|api-gateway|audit|compliance|identity|oms|venue-binance|venue-okx)$
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Rollout
      name: risk-engine
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # Trading remains startup-halted. These three controls can be armed before
  # their governed inventory exists because each missing input is an explicit
  # refusal. Exchange-account proof is intentionally absent here: the adapters
  # must first receive independently approved expected UIDs.
  - target:
      kind: Deployment
      name: oms
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: oms
      spec:
        template:
          spec:
            containers:
              - name: oms
                env:
                  - { name: OMS_REQUIRE_MANDATE, value: "true" }
                  - { name: OMS_REQUIRE_VENUE_ACCOUNT, value: "true" }
                  - { name: OMS_REQUIRE_VERIFIED_ACCOUNT, value: "true" }
                  - { name: OMS_REQUIRE_DUAL_CONTROL, value: "true" }
                  - { name: OMS_DUAL_CONTROL_MIN_NOTIONAL, value: "1 USD" }
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api-gateway
      spec:
        template:
          spec:
            containers:
              - name: api-gateway
                env:
                  - { name: API_GATEWAY_OMS_READ_ADDR, value: "oms.kanz-services.svc:9090" }
                  - { name: API_GATEWAY_APPROVE_ROLE, value: "kanz-order-approver" }
                  - { name: API_GATEWAY_COMPLIANCE_ADDR, value: "http://compliance.kanz-services.svc:8095" }
                  - { name: API_GATEWAY_MANDATE_ROLE, value: "kanz-mandate-signatory" }
  - target:
      kind: Deployment
      name: venue-binance
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: venue-binance
      spec:
        template:
          spec:
            containers:
              - name: venue-binance
                env:
                  - { name: BINANCE_VENUE_ACCOUNT_UID_FILE, value: "/run/secrets/account-proof/expected-account-uid" }
                  - { name: BINANCE_ALLOW_UNVERIFIED_ACCOUNT, value: "false" }
                volumeMounts:
                  - { name: account-proof, mountPath: /run/secrets/account-proof, readOnly: true }
            volumes:
              - name: account-proof
                csi:
                  driver: secrets-store.csi.k8s.io
                  readOnly: true
                  volumeAttributes:
                    secretProviderClass: venue-binance-account-proof
  - target:
      kind: Deployment
      name: venue-okx
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: venue-okx
      spec:
        template:
          spec:
            containers:
              - name: venue-okx
                env:
                  - { name: OKX_VENUE_ACCOUNT_UID_FILE, value: "/run/secrets/account-proof/expected-account-uid" }
                  - { name: OKX_ALLOW_UNVERIFIED_ACCOUNT, value: "false" }
                volumeMounts:
                  - { name: account-proof, mountPath: /run/secrets/account-proof, readOnly: true }
            volumes:
              - name: account-proof
                csi:
                  driver: secrets-store.csi.k8s.io
                  readOnly: true
                  volumeAttributes:
                    secretProviderClass: venue-okx-account-proof

patches:
  # The canonical file is the sole owner of Vault paths and role bindings. This
  # overlay retains only classes mounted by its minimum capital-path graph.
  - target:
      kind: SecretProviderClass
      name: ^(redis-auth|alternatives-db|copilot-anthropic|datamaster-db|market-data-db|regulatory-db|schema-registry-db|tv-sync-db|wealth-db|webhook-ingest-config|webhook-ingest-redis)$
    patch: |-
      apiVersion: secrets-store.csi.x-k8s.io/v1
      kind: SecretProviderClass
      metadata:
        name: unused
      $patch: delete
  - target:
      kind: ServiceAccount
      name: ^(accounting|api-gateway|audit|compliance|identity|oms|risk-engine|venue-binance|venue-okx|web-bff)$
    patch: |-
      - op: remove
        path: /imagePullSecrets
  - target:
      kind: Deployment
      name: ^(accounting|api-gateway|audit|compliance|identity|oms|venue-binance|venue-okx|web-bff)$
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Rollout
      name: risk-engine
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      # Replica-weighted 20% rounds to zero canary Pods at singleton scale, so
      # its hash can never produce the metrics the analysis requires. Keep the
      # stable Pod available until one real canary is Ready, then analyze that
      # canary before promotion. A failed analysis still restores the stable RS.
      - op: add
        path: /spec/strategy/canary/maxSurge
        value: 1
      - op: add
        path: /spec/strategy/canary/maxUnavailable
        value: 0
      - op: replace
        path: /spec/strategy/canary/steps
        value:
          - setWeight: 100
          - pause: { duration: 60s }
          - analysis:
              templates:
                - templateName: risk-engine-canary
              args:
                - name: canary-hash
                  valueFrom:
                    podTemplateHashValue: Latest
  # Trading remains startup-halted. These three controls can be armed before
  # their governed inventory exists because each missing input is an explicit
  # refusal. Exchange-account proof is intentionally absent here: the adapters
  # must first receive independently approved expected UIDs.
  - target:
      kind: Deployment
      name: oms
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: oms
      spec:
        template:
          spec:
            containers:
              - name: oms
                env:
                  - { name: OMS_REQUIRE_MANDATE, value: "true" }
                  - { name: OMS_REQUIRE_VENUE_ACCOUNT, value: "true" }
                  - { name: OMS_REQUIRE_VERIFIED_ACCOUNT, value: "true" }
                  - { name: OMS_REQUIRE_DUAL_CONTROL, value: "true" }
                  - { name: OMS_DUAL_CONTROL_MIN_NOTIONAL, value: "1 USD" }
                  # One reviewed portfolio, one collateral account at each venue.
                  # These are adapter-local logical labels, never exchange UIDs.
                  - { name: OMS_VENUE_ACCOUNTS, value: "__system__/PF1@XBIN=binance-main,__system__/PF1@XOKX=okx-sub-1" }
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api-gateway
      spec:
        template:
          spec:
            containers:
              - name: api-gateway
                env:
                  - { name: API_GATEWAY_OMS_READ_ADDR, value: "oms.kanz-services.svc:9090" }
                  - { name: API_GATEWAY_APPROVE_ROLE, value: "kanz-order-approver" }
                  - { name: API_GATEWAY_COMPLIANCE_ADDR, value: "http://compliance.kanz-services.svc:8095" }
                  - { name: API_GATEWAY_MANDATE_ROLE, value: "kanz-mandate-signatory" }
  - target:
      kind: Deployment
      name: venue-binance
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: venue-binance
      spec:
        template:
          spec:
            containers:
              - name: venue-binance
                env:
                  - { name: BINANCE_VENUE_ACCOUNT_UID_FILE, value: "/run/secrets/account-proof/expected-account-uid" }
                  - { name: BINANCE_ALLOW_UNVERIFIED_ACCOUNT, value: "false" }
                volumeMounts:
                  - { name: account-proof, mountPath: /run/secrets/account-proof, readOnly: true }
            volumes:
              - name: account-proof
                csi:
                  driver: secrets-store.csi.k8s.io
                  readOnly: true
                  volumeAttributes:
                    secretProviderClass: venue-binance-account-proof
  - target:
      kind: Deployment
      name: venue-okx
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: venue-okx
      spec:
        template:
          spec:
            containers:
              - name: venue-okx
                env:
                  - { name: OKX_VENUE_ACCOUNT_UID_FILE, value: "/run/secrets/account-proof/expected-account-uid" }
                  - { name: OKX_ALLOW_UNVERIFIED_ACCOUNT, value: "false" }
                volumeMounts:
                  - { name: account-proof, mountPath: /run/secrets/account-proof, readOnly: true }
            volumes:
              - name: account-proof
                csi:
                  driver: secrets-store.csi.k8s.io
                  readOnly: true
                  volumeAttributes:
                    secretProviderClass: venue-okx-account-proof

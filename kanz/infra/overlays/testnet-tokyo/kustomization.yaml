  - name: ghcr.io/eighred/risk-engine
    newName: 012619468098.dkr.ecr.ap-northeast-1.amazonaws.com/risk-engine
    digest: sha256:066a11e5b09748629df7dcf59fa5fdb1fc559a1556fb6f9842e621ca3d3cbfbb
  - name: ghcr.io/eighred/venue-binance
    newName: 012619468098.dkr.ecr.ap-northeast-1.amazonaws.com/venue-binance
    digest: sha256:f255c2aeb53b719cf58aad3241868514606d7d7a98473f53669af3c952e779ad
  - name: ghcr.io/eighred/venue-okx
    newName: 012619468098.dkr.ecr.ap-northeast-1.amazonaws.com/venue-okx
    digest: sha256:24020543cedb7e9d2fb84fc8fad32fd3a529758ad689b8460ead4d3726c8b930

patches:
  # The canonical file is the sole owner of Vault paths and role bindings. This
  # overlay retains only classes mounted by its minimum capital-path graph.
  - target:
      kind: SecretProviderClass
      name: ^(redis-auth|alternatives-db|copilot-anthropic|datamaster-db|market-data-db|regulatory-db|schema-registry-db|tv-sync-db|wealth-db|webhook-ingest-config|webhook-ingest-redis)$
    patch: |-
      apiVersion: secrets-store.csi.x-k8s.io/v1
      kind: SecretProviderClass
      metadata:
        name: unused
      $patch: delete
  - target:
      kind: ServiceAccount
      name: ^(accounting|api-gateway|audit|compliance|identity|oms|risk-engine|venue-binance|venue-okx)$
    patch: |-
      - op: remove
        path: /imagePullSecrets
  - target:
      kind: Deployment
      name: ^(accounting|api-gateway|audit|compliance|identity|oms|venue-binance|venue-okx)$
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Rollout
      name: risk-engine
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # Trading remains startup-halted. These three controls can be armed before
  # their governed inventory exists because each missing input is an explicit
  # refusal. Exchange-account proof is intentionally absent here: the adapters
  # must first receive independently approved expected UIDs.
  - target:
      kind: Deployment
      name: oms
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: oms
      spec:
        template:
          spec:
            containers:
              - name: oms
                env:
                  - { name: OMS_REQUIRE_MANDATE, value: "true" }
                  - { name: OMS_REQUIRE_VENUE_ACCOUNT, value: "true" }
                  - { name: OMS_REQUIRE_VERIFIED_ACCOUNT, value: "true" }
                  - { name: OMS_REQUIRE_DUAL_CONTROL, value: "true" }
                  - { name: OMS_DUAL_CONTROL_MIN_NOTIONAL, value: "1 USD" }
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api-gateway
      spec:
        template:
          spec:
            containers:
              - name: api-gateway
                env:
                  - { name: API_GATEWAY_OMS_READ_ADDR, value: "oms.kanz-services.svc:9090" }
                  - { name: API_GATEWAY_APPROVE_ROLE, value: "kanz-order-approver" }
                  - { name: API_GATEWAY_COMPLIANCE_ADDR, value: "http://compliance.kanz-services.svc:8095" }
                  - { name: API_GATEWAY_MANDATE_ROLE, value: "kanz-mandate-signatory" }
  - target:
      kind: Deployment
      name: venue-binance
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: venue-binance
      spec:
        template:
          spec:
            containers:
              - name: venue-binance
                env:
                  - { name: BINANCE_VENUE_ACCOUNT_UID_FILE, value: "/run/secrets/account-proof/expected-account-uid" }
                  - { name: BINANCE_ALLOW_UNVERIFIED_ACCOUNT, value: "false" }
                volumeMounts:
                  - { name: account-proof, mountPath: /run/secrets/account-proof, readOnly: true }
            volumes:
              - name: account-proof
                csi:
                  driver: secrets-store.csi.k8s.io
                  readOnly: true
                  volumeAttributes:
                    secretProviderClass: venue-binance-account-proof
  - target:
      kind: Deployment
      name: venue-okx
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: venue-okx
      spec:
        template:
          spec:
            containers:
              - name: venue-okx
                env:
                  - { name: OKX_VENUE_ACCOUNT_UID_FILE, value: "/run/secrets/account-proof/expected-account-uid" }
                  - { name: OKX_ALLOW_UNVERIFIED_ACCOUNT, value: "false" }
                volumeMounts:
                  - { name: account-proof, mountPath: /run/secrets/account-proof, readOnly: true }
            volumes:
              - name: account-proof
                csi:
                  driver: secrets-store.csi.k8s.io
                  readOnly: true
                  volumeAttributes:
                    secretProviderClass: venue-okx-account-proof

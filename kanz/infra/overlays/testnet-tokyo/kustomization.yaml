  - ../../security/secrets/secretproviderclass.yaml
  - ../../deploy/analysis-template.yaml
  - ../../deploy/accounting-deploy.yaml
  - ../../deploy/api-gateway-deploy.yaml
  - ../../deploy/audit-deploy.yaml
  - ../../deploy/compliance-deploy.yaml

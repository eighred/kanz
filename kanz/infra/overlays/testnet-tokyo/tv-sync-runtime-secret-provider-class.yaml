apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: tv-sync-runtime-db
  namespace: kanz-services
spec:
  provider: vault
  parameters:
    vaultAddress: "https://vault.vault.svc:8200"
    vaultAuthMountPath: kubernetes
    roleName: tv-sync
    audience: vault
    vaultCACertPath: /run/spire/bundle/bundle.crt
    objects: |
      - objectName: database-url
        secretPath: kv/data/kanz/tv-sync-runtime
        secretKey: dsn

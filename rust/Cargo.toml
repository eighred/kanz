[package]
name = "kanz-decimal-compat"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace]
members = ["crates/oms_recovery", "crates/order_core", "crates/market_feed", "crates/oms_store", "crates/proto_wire", "crates/oms_venue", "services/binance_depth", "services/okx_depth", "services/bond_risk_shadow", "services/oms_fold_shadow", "services/lake_snapshot", "crates/browser_render", "crates/ledger_replay", "crates/option_pricing", "crates/term_structure"]
resolver = "2"
exclude = ["temporal_sources/generated/*"]

[dependencies]
prost = "=0.14.6"

[build-dependencies]
prost-build = "=0.14.6"
protoc-bin-vendored = "=3.3.0"

[dev-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
overflow-checks = true

[patch.crates-io]
arrow = { package = "arrow", path = "temporal_sources/generated/arrow-58.4.1" }
arrow-arith = { package = "arrow-arith", path = "temporal_sources/generated/arrow-arith-58.4.1" }
arrow-array = { package = "arrow-array", path = "temporal_sources/generated/arrow-array-58.4.1" }

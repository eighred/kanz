[package]
name = "kanz-synthetic-oms"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
kanz-oms-store = { path = "../../crates/oms_store", features = ["synthetic-command"] }
base64 = "=0.22.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt", "time", "net"] }
tokio-postgres = "=0.7.18"

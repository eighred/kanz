syntax = "proto3";

// Package regulatory.v1 is the regulatory-capital & supervisory-stress schema
// (REG-01a) — the wire shape of FRTB market-risk capital, SA-CCR counterparty
// capital (XVA-01d), and CCAR/DFAST/Form-PF-style firmwide stress (ROI #35). It
// carries the CapitalCharge a framework produces, the RegulatoryScenario a stress
// run is driven by, and the RegReport (the signed, point-in-time regulatory
// filing of line items).
//
// # Money is Decimal, weights/correlations/shocks are double
//
// Capital charges and exposure amounts are money ⇒ common.v1.Decimal (EVT-14);
// risk weights, correlations, and macro shocks are dimensionless ⇒ double.
package regulatory.v1;

import "google/protobuf/timestamp.proto";
import "common/v1/decimal.proto";
import "domain/v1/measure.proto";
import "sustainability/v1/sustainability.proto";

// Framework is the regulatory regime a charge / report is computed under.
enum Framework {
  FRAMEWORK_UNSPECIFIED = 0;
  // FRTB: Fundamental Review of the Trading Book — market-risk capital.
  FRAMEWORK_FRTB = 1;
  // SA_CCR: the Basel standardized counterparty-credit exposure (XVA-01d).
  FRAMEWORK_SA_CCR = 2;
  // FORM_PF: the SEC private-fund report.
  FRAMEWORK_FORM_PF = 3;
  // AIFMD: the EU alternative-investment-fund-manager report.
  FRAMEWORK_AIFMD = 4;
  // The same live filing service assembles these climate disclosures.
  FRAMEWORK_TCFD = 5;
  FRAMEWORK_SFDR = 6;
}

// CapitalCharge is a capital requirement computed under one framework, optionally
// broken into components (FRTB delta/vega/curvature, by risk class).
message CapitalCharge {
  // framework is the regime. Required.
  Framework framework = 1;

  // as_of is the computation time — the point-in-time key. Required.
  google.protobuf.Timestamp as_of = 2;

  // total is the aggregate capital charge (money). Required.
  common.v1.Decimal total = 3;

  // components are the named sub-charges that aggregate into total. Optional.
  repeated CapitalComponent components = 4;
}

// CapitalComponent is one named piece of a CapitalCharge (e.g. "GIRR_DELTA").
message CapitalComponent {
  string name = 1;
  common.v1.Decimal amount = 2;
}

// RegulatoryScenario is a supervisory macro stress scenario — the macro factor
// shocks a CCAR/DFAST-style run expands into instrument shocks.
message RegulatoryScenario {
  // scenario_id is the canonical id (e.g. "CCAR_SEVERELY_ADVERSE_2026"). Required.
  string scenario_id = 1;

  // macro_shocks maps a macro factor (e.g. "GDP", "UNEMPLOYMENT", "EQUITY",
  // "RATES_10Y", "CREDIT_SPREAD") to its shock (a level change or return).
  // Required; non-empty.
  map<string, double> macro_shocks = 2;

  // severity is a multiplier scaling the macro shocks (1.0 == as specified) —
  // the dimension a reverse-stress search walks. Optional (defaults to 1).
  double severity = 3;
}

// RegReport is a point-in-time, signed regulatory report — a template of line
// items for one framework.
message RegReport {
  // report_id / framework / as_of identify the filing. Required.
  string report_id = 1;
  Framework framework = 2;
  google.protobuf.Timestamp as_of = 3;

  // line_items are the report's values, in template order. Required.
  repeated ReportLineItem line_items = 4;

  // Original canonical report signature/digest. FilingRecordBody.signature_kind
  // distinguishes its audit-chain position from a plain content hash; neither
  // identifies a cryptographic human signer. Required when signed.
  string signature = 5;

  // Present for a computed capital filing. Other frameworks make no charge claim.
  CapitalCharge capital_charge = 6;
}

// ReportLineItem is one row of a RegReport.
message ReportLineItem {
  // code is the template field code (e.g. "FRTB_TOTAL", "FORM_PF_GROSS_NAV").
  // Required.
  string code = 1;

  // label is the human-readable description. Advisory.
  string label = 2;

  // value is the line-item amount (money or a statistic). Required.
  common.v1.Decimal value = 3;

  // Declares the computation and retained input manifest, not data approval.
  domain.v1.MeasureProvenance provenance = 4;
}

enum FilingSignatureKind {
  FILING_SIGNATURE_KIND_UNSPECIFIED = 0;
  FILING_SIGNATURE_KIND_AUDIT_CHAIN = 1;
  FILING_SIGNATURE_KIND_CONTENT_HASH = 2;
}

// FilingRecordBody is the full immutable preimage of the context-chain binding,
// retained in the tenant-scoped artifact. The global chain stores only the
// explicitly versioned full-preimage byte length + SHA256 witness.
// The report's original signature still covers only filing.Report.Canonical.
// input_manifest is bounded canonical JSON of validated, known typed inputs;
// it never contains request headers, credentials or unrecognized JSON fields.
message FilingRecordBody {
  RegReport report = 1;
  string tenant_id = 2;
  string portfolio_id = 3;
  sustainability.v1.ObservationOrigin input_origin = 4;
  bytes input_manifest = 5;
  string input_manifest_digest = 6;
  string producer_version = 7;
  bytes filing_canonical = 8;
  FilingSignatureKind signature_kind = 9;
  repeated sustainability.v1.InstrumentObservation instrument_observations = 10;
  sustainability.v1.PortfolioObservation portfolio_observation = 11;

  // Scenarios are inputs, carried inline when the actual computation used one.
  // Absence makes no scenario/version declaration.
  RegulatoryScenario regulatory_scenario = 12;
  sustainability.v1.ClimateScenario climate_scenario = 13;
  // Original report-link predecessor, absent for a bare content-hash signature.
  string filing_prev_hash = 14;
  // Recording time sampled inside the transaction and committed with the
  // artifact, distinct from effective as_of; not an exact commit timestamp.
  google.protobuf.Timestamp recorded_at = 15;
}

// FilingRecorded is a FACT, not a supervisory submission or human approval.
// binding_hash is the audit-chain hash of the versioned byte length and SHA256
// of deterministic FilingRecordBody. Neither it nor wrappers' references to it
// are part of that preimage, so the binding is not self-referential.
message FilingRecorded {
  FilingRecordBody body = 1;
  uint32 binding_version = 2;
  string binding_prev_hash = 3;
  string binding_hash = 4;
}

# Package metadata for the generated Python SDK (EVT-15b).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kanz-schemas"
version = "0.0.0"  # replaced during package assembly
description = "Generated Python SDK for the Kanz event schemas"
requires-python = ">=3.10"
dependencies = ["protobuf>=7.36.2,<8", "grpcio>=1.85.1"]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"*" = ["*.pyi"]

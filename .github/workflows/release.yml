# Supply-chain release gate (CICD-01d). On a version tag, for each service:
# build → push → scan (trivy, fail on CRITICAL) → SBOM (syft) → sign + SBOM-
# attest (cosign, keyless) → verify. Only images that clear this gate carry a
# signature, and the cluster admission policy
# (kanz/infra/security/admission/cluster-image-policy.yaml) refuses to run
# anything unsigned by THIS workflow's identity.
#
# Signing is KEYLESS (OIDC → Fulcio short-lived cert, logged in Rekor): no
# private key to store or rotate, the signer's identity IS the workflow's OIDC
# subject — the same "identity, not a stored secret" stance as SEC-01.
name: kanz-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write    # push to ghcr.io
  id-token: write     # keyless cosign signing via GitHub OIDC

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # EVERY service build.yml builds. Held identical to build.yml's matrix by
          # TestReleaseMatrixCoversEveryBuiltService — a release that ships a subset
          # is worse than none, because the gap is invisible until a cluster pulls an
          # unsigned image the admission policy then refuses.
          - service: inference
            dockerfile: kanz-py/Dockerfile
          - service: risk-engine
            dockerfile: kanz/services/risk-engine/Dockerfile
          - service: schema-registry
            dockerfile: kanz/services/schema-registry/Dockerfile
          - service: oms
            dockerfile: kanz/services/oms/Dockerfile
          - service: kanz-migrate
            dockerfile: kanz/cmd/kanz-migrate/Dockerfile
          - service: kanz-halt
            dockerfile: kanz/cmd/kanz-halt/Dockerfile
          - service: venue-binance
            dockerfile: kanz/services/venue-binance/Dockerfile
          - service: venue-okx
            dockerfile: kanz/services/venue-okx/Dockerfile
          - service: market-ingest
            dockerfile: kanz/services/market-ingest/Dockerfile
          - service: accounting
            dockerfile: kanz/services/accounting/Dockerfile
          - service: audit
            dockerfile: kanz/services/audit/Dockerfile
          - service: regulatory
            dockerfile: kanz/services/regulatory/Dockerfile
          - service: copilot
            dockerfile: kanz/services/copilot/Dockerfile
          - service: market-data
            dockerfile: kanz/services/market-data/Dockerfile
          - service: wealth
            dockerfile: kanz/services/wealth/Dockerfile
          - service: alternatives
            dockerfile: kanz/services/alternatives/Dockerfile
          - service: datamaster
            dockerfile: kanz/services/datamaster/Dockerfile
          - service: optimization
            dockerfile: kanz/services/optimization/Dockerfile
          - service: webhook-ingest
            dockerfile: kanz/services/webhook-ingest/Dockerfile
          - service: tv-sync
            dockerfile: kanz/services/tv-sync/Dockerfile
          - service: compliance
            dockerfile: kanz/services/compliance/Dockerfile
          - service: api-gateway
            dockerfile: kanz/services/api-gateway/Dockerfile
          # The client stack (#364, #371) — see build.yml. Held identical to that
          # matrix by TestReleaseMatrixCoversEveryBuiltService: a release that
          # ships a subset is worse than none, because the gap is invisible until
          # a cluster pulls an unsigned image the admission policy then refuses.
          - service: identity
            dockerfile: kanz/services/identity/Dockerfile
          - service: web-bff
            dockerfile: kanz/services/web-bff/Dockerfile
          - service: archiver
            dockerfile: kanz/services/archiver/Dockerfile
          - service: lake-sink
            dockerfile: kanz/services/lake-sink/Dockerfile
          - service: operator
            dockerfile: kanz/services/operator/Dockerfile
          - service: kanz-provisioner
            dockerfile: kanz/cmd/kanz-provisioner/Dockerfile
          - service: nats-rebuild
            dockerfile: kanz/tools/natsrebuild/cmd/nats-rebuild/Dockerfile
    env:
      # eighred is canonical, written as a LITERAL rather than as
      # ${{ github.repository_owner }}. It equals the owner today, but a computed
      # value is exactly what let the publish side and the pull side diverge
      # silently before REL-P0a — so if this repository ever moves, the literal
      # makes TestImageOrgIsCanonical fail loudly and forces the manifests, the
      # admission policy and the workflows to move as one reviewed change.
      IMAGE: ghcr.io/eighred/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Generate the uncommitted Go SDK (EVT-15a) the image build COPYs — same
      # as build.yml / the kanz-ci Go job.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: kanz/go.mod
          cache-dependency-path: kanz/go.sum
      - uses: ./.github/actions/setup-buf
        with:
          version: 1.69.0
      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Generate kanz-schemas Go SDK
        working-directory: kanz-schemas
        env:
          GOFLAGS: -mod=mod
        run: |
          buf generate
          # `cd` on its own line, matching build.yml and kanz-ci.yml. This used to
          # read `cd gen/go && ...` on BOTH lines: the steps share one shell, so the
          # second cd ran from inside gen/go, tried gen/go/gen/go, and failed the
          # step. All 25 jobs of the first real release died here, before a single
          # image was built. No guard could have caught it — the shell is valid, it
          # is only wrong at runtime — and release.yml had never executed a job, so
          # nothing had ever run these three lines.
          cd gen/go
          go mod init github.com/eighred/kanz/kanz-schemas-go || true
          go mod tidy

      # THE BFF'S IMAGE MUST CONTAIN THE SPA (#371).
      #
      # web-bff serves the compiled application on its OWN origin and proxies
      # /api/* from the same hostname. That is not a packaging convenience: a
      # separate static host would be a second origin, which forces the session
      # cookie to SameSite=None — the setting that makes a cookie usable
      # cross-site and therefore the one CSRF defences exist to prevent — plus
      # CORS-with-credentials and a cookie domain kept in step with the edge.
      #
      # kanz-web/dist is a BUILD ARTIFACT and gitignored, so it is produced here
      # and lands in the docker context, exactly as the generated Go SDK above
      # does. Without this the image builds, starts, serves /api and /auth
      # perfectly, and returns nothing at / — an application that is finished,
      # green, and blank in a browser.
      #
      # Scoped to the one image that needs it: 29 matrix entries, one SPA.
      - name: Build the SPA into the docker context
        if: matrix.service == 'web-bff'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: kanz-web/.nvmrc
          cache: npm
          cache-dependency-path: kanz-web/package-lock.json
      - name: Compile kanz-web into dist
        if: matrix.service == 'web-bff'
        working-directory: kanz-web
        run: |
          npm ci
          npm run build
          test -f dist/index.html || { echo "::error::kanz-web/dist/index.html is missing after build — the BFF image would ship without the SPA"; exit 1; }
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # From the matrix, NOT kanz/services/<svc>/Dockerfile: inference lives in
          # kanz-py/ and kanz-migrate / kanz-halt / kanz-provisioner live in kanz/cmd/,
          # so the old hardcoded path could only ever have worked for the two services
          # the matrix used to list.
          file: ${{ matrix.dockerfile }}
          # Stamps internal/version into the binary, so telemetry and every FACT this
          # image publishes name the RELEASE TAG (#143). Without it a container build
          # has no .git to fall back on and reports "unstamped".
          build-args: |
            VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      # Everything below pins to the immutable digest, never a tag.
      - name: Vulnerability scan (fail on CRITICAL)
        # 0.28.0 was deleted by the GHSA-69fq-xp46-6x23 compromise remediation
        # (attacker force-pushed most version tags to credential-stealing
        # malware; the original tags were then removed). <0.35.0 is the
        # advisory's affected range, so this is pinned to v0.36.0's commit.
        # Scanner binary pinned too: the malicious artifacts were binaries,
        # not the action itself.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
          version: v0.72.0
          # A critical CVE fails the job before signing, so the image is pushed
          # but unsigned — admission then refuses it. Bump to HIGH once the base
          # images are clean.

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      # SEC-02b: a machine-readable vuln-scan record attached to the image, so
      # the admission policy can require every image to carry one (an image that
      # never ran a scan can't run) and the SEC-02c scheduled re-scan has a
      # baseline. cosign-vuln is the standard predicate format trivy emits.
      - name: Vulnerability attestation predicate
        # 0.28.0 was deleted by the GHSA-69fq-xp46-6x23 compromise remediation
        # (attacker force-pushed most version tags to credential-stealing
        # malware; the original tags were then removed). <0.35.0 is the
        # advisory's affected range, so this is pinned to v0.36.0's commit.
        # Scanner binary pinned too: the malicious artifacts were binaries,
        # not the action itself.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cosign-vuln
          output: vuln.json
          ignore-unfixed: true
          version: v0.72.0

      - name: Sign + attest SBOM and vuln scan (keyless)
        env:
          DIGEST_REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$DIGEST_REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$DIGEST_REF"
          cosign attest --yes --type vuln --predicate vuln.json "$DIGEST_REF"

      # Self-check: prove the signature verifies against THIS run's own OIDC
      # identity (${{ github.repository }}, i.e. whatever repo this workflow is
      # currently executing in). Understand what that does and does not buy:
      # a signature always matches the identity that produced it, so this step
      # cannot fail on an identity mismatch. It proves the signing machinery ran
      # and the artifact is verifiable — not that the cluster would admit it.
      #
      # As of REL-P0a (2026-07-27) the two DO agree: this repository is
      # eighred/kanz and the admission policy
      # (kanz/infra/security/admission/cluster-image-policy.yaml) pins
      # github.com/eighred/kanz. That agreement is enforced by
      # TestImageOrgIsCanonical, which checks the policy's subjectRegExp against
      # the same canonical org as every image reference — so it is that test,
      # not this step, that catches the two drifting apart. Before that fix the
      # policy pinned a "eighred" org which does not exist on GitHub, and this
      # step passed cheerfully throughout.
      # Hand this service's digest to the pinning job. An artifact rather than a job
      # output because matrix jobs cannot each contribute a distinct output key.
      - name: Record the digest for pinning
        run: |
          mkdir -p digests
          printf '%s' "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.service }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.service }}
          path: digests/${{ matrix.service }}
          retention-days: 1

      - name: Verify signature
        env:
          DIGEST_REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          cosign verify "$DIGEST_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/v.*"

  # One GitHub Release per tag, created only after EVERY service image has been
  # built, scanned, signed and attested. `needs` is the whole point: a release
  # published while one of the 25 failed would advertise a version the registry
  # cannot fully serve, and the gap would surface as an ErrImagePull in a cluster
  # rather than as a red workflow here.
  release-notes:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # narrower than a workflow-level grant: only this job writes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # notes are generated by diffing against the previous tag
      - name: Publish the release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # --verify-tag refuses to invent a tag: this workflow is tag-triggered, so
          # the tag must already exist, and creating one here would mean the release
          # and the images were built from something nobody tagged.
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag

  # THE SUPPLY CHAIN USED TO TERMINATE AT THE REGISTRY. Everything above pins to
  # the immutable digest — trivy, cosign, the SBOM all attest one specific image —
  # and then every manifest said :latest, so the cluster ran whatever :latest
  # resolved to at pull time. This job closes that: it rewrites the manifests to
  # the digests this release just produced.
  #
  # It opens a PULL REQUEST rather than pushing to main. main is branch-protected
  # with required status checks, so a direct push from a workflow is refused — and
  # a PR is the better shape anyway: a human sees exactly which digests the cluster
  # is about to run before Argo reconciles them.
  pin-digests:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: kanz/go.mod
          cache-dependency-path: kanz/go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests

      - name: Pin every manifest to the digests this release published
        working-directory: kanz
        run: |
          set -euo pipefail
          go run ./cmd/kanz-pin-digests -digests ../digests -infra infra | tee /tmp/pin-report.txt
          # oms-acme.yaml is GENERATED from oms-deploy.yaml and drift-checked by
          # TestTenantComputeGuard. Re-render it from the now-pinned base rather
          # than trusting two independent rewrites to agree.
          go run ./cmd/kanz-tenantgen -tenant acme

      - name: Open the pin pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="release/pin-${GITHUB_REF_NAME}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add kanz/infra
          if git diff --cached --quiet; then
            echo "no manifest changed — every image was already pinned to these digests"
            exit 0
          fi
          git commit -m "chore(release): pin manifests to ${GITHUB_REF_NAME} digests"
          git push origin "$branch"
          {
            echo "Digests published by the ${GITHUB_REF_NAME} release."
            echo
            echo "Merging this is what makes the cluster run the images that were signed."
            echo
            sed 's/^/    /' /tmp/pin-report.txt
          } > /tmp/pin-body.md
          gh pr create --base main --head "$branch"             --title "chore(release): pin manifests to ${GITHUB_REF_NAME} digests"             --body-file /tmp/pin-body.md

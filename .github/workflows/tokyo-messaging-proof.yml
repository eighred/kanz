name: tokyo-messaging-proof
on:
  pull_request:
    paths:
      - 'tools/tokyo_messaging_proof/**'
      - 'tools/feed_identity/**'
      - 'kanz/test/backing/up.sh'
      - 'kanz/test/backing/*postgres-nats.sh'
      - 'kanz/test/backing/nats-dev.conf'
      - 'kanz/test/backing/nats_topology.py'
      - 'tools/nats_gitops_proof/proof.py'
      - 'tools/testnet-data-plane-recovery.sh'
      - 'tools/tv-sync-restored-proof.sh'
      - 'tools/Invoke-TestnetDataPlaneRecovery.ps1'
      - 'kanz/infra/nats/**'
      - 'kanz/infra/security/spire/**'
      - 'kanz/infra/overlays/testnet_tokyo/**'
      - '.github/workflows/tokyo-messaging-proof.yml'
  push:
    branches: [main]
    paths:
      - 'tools/tokyo_messaging_proof/**'
      - 'tools/feed_identity/**'
      - 'kanz/test/backing/up.sh'
      - 'kanz/test/backing/*postgres-nats.sh'
      - 'kanz/test/backing/nats-dev.conf'
      - 'kanz/test/backing/nats_topology.py'
      - 'tools/nats_gitops_proof/proof.py'
      - 'tools/testnet-data-plane-recovery.sh'
      - 'tools/tv-sync-restored-proof.sh'
      - 'tools/Invoke-TestnetDataPlaneRecovery.ps1'
      - 'kanz/infra/nats/**'
      - 'kanz/infra/security/spire/**'
      - 'kanz/infra/overlays/testnet_tokyo/**'
      - '.github/workflows/tokyo-messaging-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  messaging-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 -B -m unittest discover -s tools/tokyo_messaging_proof -p 'test_*.py'
      - run: python3 -B -m unittest discover -s tools/feed_identity -p 'test_*.py'
      - name: Check named JetStream state after account restore
        run: bash tools/tokyo_messaging_proof/check_jetstream_restore.sh
      - name: Check complete PostgreSQL archive inventories for both restore modes
        run: bash tools/tokyo_messaging_proof/check_postgres_inventory.sh
      - name: Require an authenticated current Redis checkpoint before archiving
        run: bash tools/tokyo_messaging_proof/check_redis_backup.sh
      - name: Check local PostgreSQL and NATS with external loopback clients
        run: bash kanz/test/backing/check-postgres-nats.sh
      - run: bash tools/feed_identity/install.sh
      - name: Verify UID-scoped cleanup of the ordinary restore namespace
        run: bash tools/tokyo_messaging_proof/check_restore_namespace.sh
      - name: Prove staged messaging isolation with real dependencies
        run: python3 -B tools/tokyo_messaging_proof/proof.py
      - name: Remove disposable cluster after interruption
        if: always()
        run: |
          if command -v kind >/dev/null; then
            while IFS= read -r cluster; do
              if [[ "$cluster" =~ ^messaging-proof-[0-9a-f]{12}$ ]]; then
                kind delete cluster --name "$cluster"
              fi
            done < <(kind get clusters)
          fi
      - name: Preserve sanitized developmental evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tokyo-messaging-proof
          path: ${{ runner.temp }}/tokyo-messaging.json
          if-no-files-found: error

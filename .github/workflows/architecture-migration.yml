name: architecture-migration

on:
  pull_request:
    paths:
      - 'kanz-rs/**'
      - 'kanz-web/.nvmrc'
      - 'kanz-schemas/proto/**'
      - 'kanz/internal/dec/**'
      - 'kanz/tools/decimal-conformance/**'
      - 'kanz/tools/depth-conformance/**'
      - 'kanz/pkg/alpha/**'
      - 'kanz/services/market-ingest/**'
      - 'kanz/dev/**'
      - 'kanz/pkg/bus/**'
      - 'kanz/services/archiver/**'
      - 'kanz/services/lake-sink/**'
      - 'kanz/services/api-gateway/**'
      - 'kanz/cmd/kanz-lake-snapshot/**'
      - 'kanz/cmd/kanz-tenantgen/**'
      - 'kanz/infra/nats/**'
      - 'kanz/internal/lake/**'
      - 'kanz/internal/testidentity/**'
      - 'kanz/internal/outbox/**'
      - 'kanz/internal/pg/**'
      - 'kanz/pkg/auth/**'
      - 'kanz/pkg/transport/**'
      - 'kanz/go.mod'
      - 'kanz/go.sum'
      - '.github/scripts/*lake_snapshot_owner*'
      - '.github/scripts/envoy_evidence.py'
      - '.github/scripts/release_ci*.py'
      - 'kanz/tools/replay/**'
      - 'kanz/test/arch/**'
      - '.github/scripts/*migration_evidence.py'
      - '.github/scripts/*rust*audit*'
      - 'tools/rust-audit-tools/**'
      - '.github/scripts/*rust_release_evidence.py'
      - '.github/workflows/release.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/architecture-migration.yml'
  push:
    branches: [main]
    paths:
      - 'kanz-rs/**'
      - 'kanz-web/.nvmrc'
      - 'kanz-schemas/proto/**'
      - 'kanz/internal/dec/**'
      - 'kanz/tools/decimal-conformance/**'
      - 'kanz/tools/depth-conformance/**'
      - 'kanz/pkg/alpha/**'
      - 'kanz/services/market-ingest/**'
      - 'kanz/dev/**'
      - 'kanz/pkg/bus/**'
      - 'kanz/services/archiver/**'
      - 'kanz/services/lake-sink/**'
      - 'kanz/services/api-gateway/**'
      - 'kanz/cmd/kanz-lake-snapshot/**'
      - 'kanz/cmd/kanz-tenantgen/**'
      - 'kanz/infra/nats/**'
      - 'kanz/internal/lake/**'
      - 'kanz/internal/testidentity/**'
      - 'kanz/internal/outbox/**'
      - 'kanz/internal/pg/**'
      - 'kanz/pkg/auth/**'
      - 'kanz/pkg/transport/**'
      - 'kanz/go.mod'
      - 'kanz/go.sum'
      - '.github/scripts/*lake_snapshot_owner*'
      - '.github/scripts/envoy_evidence.py'
      - '.github/scripts/release_ci*.py'
      - 'kanz/tools/replay/**'
      - 'kanz/test/arch/**'
      - '.github/scripts/*migration_evidence.py'
      - '.github/scripts/*rust*audit*'
      - 'tools/rust-audit-tools/**'
      - '.github/scripts/*rust_release_evidence.py'
      - '.github/workflows/release.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/architecture-migration.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  GOFLAGS: -mod=mod

jobs:
  finite-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Bind snapshot fixture to exact source
        run: |
          mkdir -p snapshot-proof
          echo "KANZ_BUILD_VERSION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git rev-parse HEAD 'HEAD^{tree}' > snapshot-proof/source.txt
          printf '%s\n%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > snapshot-proof/run.txt
          rustc +1.90.0 --version > snapshot-proof/toolchain.txt
      - name: Build overflow-checked worker and separate kernel probe
        working-directory: kanz-rs
        run: |
          cargo +1.90.0 fmt --all -- --check
          cargo +1.90.0 build --release --locked -p kanz-lake-snapshot --bin kanz-lake-snapshot --example sandbox-probe
      - name: Execute actual finite queries and process confinement
        working-directory: kanz-rs
        run: |
          set -euo pipefail
          cargo +1.90.0 test --release --locked -p kanz-lake-snapshot --all-targets -- --test-threads=1 2>&1 | tee ../snapshot-proof/tests.txt
          cargo +1.90.0 clippy --release --locked -p kanz-lake-snapshot --all-targets -- -D warnings
      - name: Bind tested binaries and dependency inventory
        run: |
          sha256sum kanz-rs/target/release/kanz-lake-snapshot kanz-rs/target/release/examples/sandbox-probe kanz-rs/Cargo.lock > snapshot-proof/sha256.txt
          cargo +1.90.0 tree --manifest-path kanz-rs/Cargo.toml --locked -p kanz-lake-snapshot -e normal > snapshot-proof/dependencies.txt
      - name: Retain actual snapshot qualification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: finite-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: snapshot-proof/
          if-no-files-found: error

  finite-snapshot-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: kanz/go.mod
          cache-dependency-path: kanz/go.sum
      - uses: ./.github/actions/setup-buf
        with:
          version: 1.69.0
      - name: Generate canonical snapshot SDK
        run: |
          set -euo pipefail
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          export PATH="$(go env GOPATH)/bin:$PATH"
          make -C kanz generate
      - name: Build source-bound owner worker gateway archiver and CLI once
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lake-bin" snapshot-owner-proof
          git rev-parse HEAD 'HEAD^{tree}' > snapshot-owner-proof/source.txt
          printf '%s\n%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > snapshot-owner-proof/run.txt
          rustup toolchain install 1.90.0 --profile minimal
          KANZ_BUILD_VERSION="$(git rev-parse HEAD)" cargo +1.90.0 build --release --locked --manifest-path kanz-rs/Cargo.toml -p kanz-lake-snapshot --bin kanz-lake-snapshot
          sudo install -o root -g root -m 0555 kanz-rs/target/release/kanz-lake-snapshot "$RUNNER_TEMP/lake-bin/worker"
          sudo install -o root -g root -m 0555 kanz-rs/target/release/kanz-lake-snapshot "$RUNNER_TEMP/lake-bin/worker-swap"
          cd kanz
          stamp="-X github.com/eighred/kanz/internal/version.stamped=$(git rev-parse HEAD)"
          go test -p 1 -c -ldflags "$stamp" -o "$RUNNER_TEMP/lake-bin/owner.test" ./services/lake-sink/internal/snapshot
          go test -p 1 -c -ldflags "$stamp" -o "$RUNNER_TEMP/lake-bin/gateway.test" ./services/api-gateway/cmd/api-gateway
          go test -p 1 -c -ldflags "$stamp" -o "$RUNNER_TEMP/lake-bin/archiver.test" ./services/archiver/internal/archive
          go build -ldflags "$stamp" -o "$RUNNER_TEMP/lake-bin/kanz-lake-snapshot" ./cmd/kanz-lake-snapshot
          go vet ./services/lake-sink/... ./services/api-gateway/... ./services/archiver/... ./cmd/kanz-lake-snapshot ./infra/nats
      - name: Authenticate existing private image mirrors
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Warm the hybrid builder
        run: .github/scripts/warm-builder.sh ghcr.io/eighred/base/buildkit:buildx-stable-1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: lake-builder
        with:
          version: v0.37.1
          driver-opts: image=ghcr.io/eighred/base/buildkit:buildx-stable-1
      - name: Build actual hybrid lake image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: kanz/services/lake-sink/Dockerfile
          build-args: VERSION=${{ github.sha }}
          builder: ${{ steps.lake-builder.outputs.name }}
          tags: kanz-lake-sink:verification
          push: false
          load: true
          cache-from: type=gha,scope=lake-sink
      - name: Bind actual hybrid image identity
        id: lake-image
        run: |
          set -euo pipefail
          image=$(docker image inspect --format '{{.Id}}' kanz-lake-sink:verification)
          printf '%s\n' "$image" > snapshot-owner-proof/lake-image.txt
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Prove joint synthetic source and VERSION dependency cache reuse
        env:
          LAKE_IMAGE: ${{ steps.lake-image.outputs.image }}
          LAKE_BUILDER: ${{ steps.lake-builder.outputs.name }}
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s .github/scripts -p test_lake_cache_probe.py
          python3 .github/scripts/lake_cache_probe.py --source "$(git rev-parse HEAD)" --tree "$(git rev-parse HEAD^{tree})" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --image "$LAKE_IMAGE" --builder "$LAKE_BUILDER" --output snapshot-owner-proof
      - name: Catalog actual hybrid applications and native runtime
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: docker:${{ steps.lake-image.outputs.image }}
          format: spdx-json
          output-file: snapshot-owner-proof/hybrid.spdx.json
          syft-version: v1.56.0
          upload-artifact: false
      - name: Scan actual hybrid runtime before execution
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.lake-image.outputs.image }}
          format: json
          output: snapshot-owner-proof/hybrid-trivy.json
          exit-code: '1'
          severity: CRITICAL
          list-all-pkgs: true
          ignore-unfixed: true
          version: v0.72.0
      - name: Install pinned hybrid signature verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install reviewed hybrid audit tools
        run: |
          set -euo pipefail
          bash .github/scripts/install-rust-audit.sh
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Require hybrid binary provenance and fresh Rust and Go audits
        env:
          LAKE_IMAGE: ${{ steps.lake-image.outputs.image }}
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s .github/scripts -p test_rust_release_evidence.py
          python3 .github/scripts/rust_release_evidence.py --local --service lake-sink --image "$LAKE_IMAGE" --sbom snapshot-owner-proof/hybrid.spdx.json --output snapshot-owner-proof/hybrid
      - name: Install two checksum-pinned native brokers
        run: |
          set -euo pipefail
          for version in 2.12.6 2.14.5; do
            case "$version" in
              2.12.6) expected=77fe7dd69ff5144126026b78355900be0ab0bb4339dc61a7621dcc9b9e9d07a6 ;;
              2.14.5) expected=5e3b603d47c447bda1f77f9ac16dbf91c90aac4ff3681f8fbbc7201e4ed99355 ;;
              *) exit 1 ;;
            esac
            archive="$RUNNER_TEMP/nats-$version.tgz"
            curl --fail --location --proto '=https' --tlsv1.2 --retry 2 --max-time 60 "https://github.com/nats-io/nats-server/releases/download/v$version/nats-server-v$version-linux-amd64.tar.gz" -o "$archive"
            printf '%s  %s\n' "$expected" "$archive" | sha256sum --check --status
            mkdir "$RUNNER_TEMP/nats-$version"
            tar -xzf "$archive" -C "$RUNNER_TEMP/nats-$version"
            install -m 0555 "$RUNNER_TEMP/nats-$version/nats-server-v$version-linux-amd64/nats-server" "$RUNNER_TEMP/lake-bin/nats-$version"
            test "$("$RUNNER_TEMP/lake-bin/nats-$version" --version)" = "nats-server: v$version"
          done
          python3 .github/scripts/check_lake_snapshot_owner_evidence.py --binary-inventory --binaries "$RUNNER_TEMP/lake-bin" --proof snapshot-owner-proof
      - name: Provision disposable scoped PostgreSQL and canonical Redpanda
        run: |
          set -euo pipefail
          pg="kanz-lake-pg-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          project="kanz-lake-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          pg_before=$(timeout 10 docker ps -a --filter "name=^/$pg$" --format '{{.ID}}')
          compose_before=$(timeout 10 docker ps -a --filter "label=com.docker.compose.project=$project" --format '{{.ID}}')
          volumes_before=$(timeout 10 docker volume ls --filter "label=com.docker.compose.project=$project" --format '{{.Name}}')
          networks_before=$(timeout 10 docker network ls --filter "label=com.docker.compose.project=$project" --format '{{.ID}}')
          test -z "$pg_before$compose_before$volumes_before$networks_before"
          python3 -c 'import json,os; f=open("snapshot-owner-proof/owned.json","x"); json.dump({"run":os.environ["GITHUB_RUN_ID"],"attempt":os.environ["GITHUB_RUN_ATTEMPT"]},f); f.close()'
          docker run -d --name "$pg" --label "kanz.snapshot-run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -p 127.0.0.1:5432:5432 -e POSTGRES_USER=fixture -e POSTGRES_PASSWORD=fixture -e POSTGRES_DB=fixture postgres:16-alpine@sha256:1fb72075a1de85a1d39de23c2da81baef1b71bf5c0b61a14cbbfdb072a6246d9
          ready=false
          for attempt in $(seq 1 60); do
            if test "$(timeout 3 docker exec -e PGPASSWORD=fixture "$pg" psql -X -w -h 127.0.0.1 -U fixture -d fixture -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' 2>/dev/null)" = 1; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          timeout 10 docker exec -e PGPASSWORD=fixture "$pg" psql -X -w -h 127.0.0.1 -U fixture -d fixture -v ON_ERROR_STOP=1 -c "CREATE ROLE snapshot_fixture LOGIN PASSWORD 'snapshot_fixture' NOSUPERUSER NOBYPASSRLS; GRANT CREATE ON DATABASE fixture TO snapshot_fixture;"
          timeout 150 docker compose -p "$project" -f kanz/dev/docker-compose.yml up -d --wait --wait-timeout 120 kafka
          docker inspect --format '{{.Image}}' "$pg" > snapshot-owner-proof/postgres-image.txt
          kafka_id=$(docker compose -p "$project" -f kanz/dev/docker-compose.yml ps -q kafka)
          test -n "$kafka_id"
          docker inspect --format '{{.Image}}' "$kafka_id" > snapshot-owner-proof/redpanda-image.txt
      - name: Actual finite owner on both broker versions without skips
        env:
          TEST_POSTGRES_URL: postgres://snapshot_fixture:snapshot_fixture@127.0.0.1:5432/fixture?sslmode=disable
          TEST_LAKE_KAFKA_BROKER: 127.0.0.1:9092
          TEST_LAKE_WORKER_PATH: ${{ runner.temp }}/lake-bin/worker
          TEST_LAKE_WORKER_SWAP_PATH: ${{ runner.temp }}/lake-bin/worker-swap
          TEST_LAKE_GATEWAY_TEST_BIN: ${{ runner.temp }}/lake-bin/gateway.test
          TEST_LAKE_ARCHIVER_TEST_BIN: ${{ runner.temp }}/lake-bin/archiver.test
          TEST_LAKE_CLI_BIN: ${{ runner.temp }}/lake-bin/kanz-lake-snapshot
        run: |
          set -euo pipefail
          export TEST_LAKE_WORKER_SHA256="$(sha256sum "$TEST_LAKE_WORKER_PATH" | cut -d' ' -f1)"
          export TEST_LAKE_IMAGE_ID="$(cat snapshot-owner-proof/lake-image.txt)"
          export TEST_LAKE_IMAGE_VERSION="$(git rev-parse HEAD)"
          export TEST_LAKE_IMAGE_WORKER_SHA256="$(python3 -c 'import json; print(json.load(open("snapshot-owner-proof/hybrid/evidence.json"))["binarySHA256"])')"
          export TEST_LAKE_REDPANDA_IMAGE_ID="$(cat snapshot-owner-proof/redpanda-image.txt)"
          selection=$(python3 .github/scripts/check_lake_snapshot_owner_evidence.py --regex --root .)
          result=0
          for version in 2.12.6 2.14.5; do
            export TEST_LAKE_NATS_VERSION="$version" TEST_LAKE_NATS_SERVER="$RUNNER_TEMP/lake-bin/nats-$version"
            (cd kanz/services/lake-sink/internal/snapshot && go tool test2json -t -p github.com/eighred/kanz/services/lake-sink/internal/snapshot "$RUNNER_TEMP/lake-bin/owner.test" -test.v=test2json -test.count=1 -test.timeout=20m -test.run "$selection") | tee "snapshot-owner-proof/$version.jsonl" || result=1
          done
          exit "$result"
      - name: Stop owned snapshot fixture dependencies and prove absence
        if: always()
        run: |
          set -euo pipefail
          pg="kanz-lake-pg-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          project="kanz-lake-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if ! test -f snapshot-owner-proof/owned.json; then exit 0; fi
          python3 -c 'import json,os; assert json.load(open("snapshot-owner-proof/owned.json")) == {"run":os.environ["GITHUB_RUN_ID"],"attempt":os.environ["GITHUB_RUN_ATTEMPT"]}'
          found=$(timeout 10 docker ps -a --filter "name=^/$pg$" --format '{{.ID}}')
          if test -n "$found"; then
            test "$(docker inspect --format '{{index .Config.Labels "kanz.snapshot-run"}}' "$pg")" = "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            timeout 20 docker rm -f "$pg"
          fi
          timeout 30 docker compose -p "$project" -f kanz/dev/docker-compose.yml down --volumes
          # Exact run/attempt and per-case nonce ownership also reconciles a
          # Docker create that succeeded before its CLI reply was lost.
          image_resources=$(timeout 10 docker ps -a --filter "label=kanz.snapshot-image-run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --format '{{.ID}}')
          test "$(printf '%s\n' "$image_resources" | sed '/^$/d' | wc -l)" -le 8
          while IFS= read -r id; do
            test -n "$id" || continue
            nonce=$(docker inspect --format '{{index .Config.Labels "kanz.snapshot-image"}}' "$id")
            [[ "$nonce" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
            test "$(docker inspect --format '{{index .Config.Labels "kanz.snapshot-image-run"}}' "$id")" = "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            name=$(docker inspect --format '{{.Name}}' "$id")
            [[ "$name" =~ ^/kanz-lake-image-$nonce-[0-9]+$ ]]
            timeout 20 docker rm -f -v "$id"
          done <<< "$image_resources"
          image_volumes=$(timeout 10 docker volume ls --filter "label=kanz.snapshot-image-run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --format '{{.Name}}')
          test "$(printf '%s\n' "$image_volumes" | sed '/^$/d' | wc -l)" -le 8
          while IFS= read -r name; do
            test -n "$name" || continue
            nonce=$(docker volume inspect --format '{{index .Labels "kanz.snapshot-image"}}' "$name")
            [[ "$nonce" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
            test "$(docker volume inspect --format '{{index .Labels "kanz.snapshot-image-run"}}' "$name")" = "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            [[ "$name" =~ ^kanz-lake-image-$nonce-[0-9]+$ ]]
            timeout 15 docker volume rm "$name"
          done <<< "$image_volumes"
          image_after=$(timeout 10 docker ps -a --filter "label=kanz.snapshot-image-run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --format '{{.ID}}')
          image_volumes_after=$(timeout 10 docker volume ls --filter "label=kanz.snapshot-image-run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --format '{{.Name}}')
          test -z "$image_after$image_volumes_after"
          pg_after=$(timeout 10 docker ps -a --filter "name=^/$pg$" --format '{{.ID}}')
          compose_after=$(timeout 10 docker ps -a --filter "label=com.docker.compose.project=$project" --format '{{.ID}}')
          volumes_after=$(timeout 10 docker volume ls --filter "label=com.docker.compose.project=$project" --format '{{.Name}}')
          networks_after=$(timeout 10 docker network ls --filter "label=com.docker.compose.project=$project" --format '{{.ID}}')
          test -z "$pg_after$compose_after$volumes_after$networks_after"
          mkdir -p snapshot-owner-proof
          python3 -c 'import json,os,pathlib; pathlib.Path("snapshot-owner-proof/cleanup.json").write_text(json.dumps({"run":os.environ["GITHUB_RUN_ID"],"attempt":os.environ["GITHUB_RUN_ATTEMPT"],"postgres_absent":True,"compose_absent":True,"image_containers_absent":True,"image_volumes_absent":True})+"\n")'
      - name: Verify complete source-bound owner evidence
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s .github/scripts -p test_check_lake_snapshot_owner_evidence.py
          python3 .github/scripts/check_lake_snapshot_owner_evidence.py --seal --root . --proof snapshot-owner-proof --binaries "$RUNNER_TEMP/lake-bin" --sha "$(git rev-parse HEAD)" --tree "$(git rev-parse 'HEAD^{tree}')" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Retain source-bound finite owner proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: finite-snapshot-owner-${{ github.run_id }}-${{ github.run_attempt }}
          path: snapshot-owner-proof/
          if-no-files-found: error

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: kanz/go.mod
          cache-dependency-path: kanz/go.sum
      - uses: ./.github/actions/setup-buf
        with:
          version: 1.69.0
      - name: Generate existing canonical Go SDK
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          export PATH="$(go env GOPATH)/bin:$PATH"
          make -C kanz generate
      - name: Install pinned Rust toolchain
        working-directory: kanz-rs
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          rustup show active-toolchain
      - name: Verify migration boundary even on Rust-only changes
        working-directory: kanz
        run: go test -p 1 ./test/arch -run 'Test(Rust|EveryWorkflowGoTestIsSerialised|WorkflowGoTestMatcherDistinguishesCargo)' -count=1
      - name: Rust format, compile and unit tests
        working-directory: kanz-rs
        run: |
          cargo fmt --all -- --check
          KANZ_BUILD_VERSION="$(git rev-parse HEAD)" cargo check --locked --workspace --all-targets
          cargo test --locked --workspace --lib --bins
          cargo build --locked -p kanz-binance-depth -p kanz-okx-depth
          KANZ_BUILD_VERSION="$(git rev-parse HEAD)" cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Select pinned Node for actual WASM qualification
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: kanz-web/.nvmrc
      - name: Qualify actual browser rendering WASM
        working-directory: kanz-rs
        run: |
          set -euo pipefail
          cargo +1.90.0 test --locked --release -p kanz-browser-render
          rustup target add wasm32-unknown-unknown --toolchain 1.90.0
          bash crates/browser-render/tests/build-wasm.sh | tee "$RUNNER_TEMP/browser-render.json"
      - name: Preserve actual Node WASM evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-render-wasm
          path: |
            ${{ runner.temp }}/browser-render.json
            kanz-rs/target/wasm32-unknown-unknown/release/kanz_browser_render.wasm
          if-no-files-found: error
          retention-days: 7
      - name: Differential proof against current Go authority
        env:
          DECIMAL_CONFORMANCE_FIXTURE: ${{ runner.temp }}/kanz-decimal-conformance.json
        run: |
          (cd kanz && go test -p 1 ./internal/dec ./tools/decimal-conformance -count=1)
          (cd kanz && go run ./tools/decimal-conformance) > "$DECIMAL_CONFORMANCE_FIXTURE"
          cargo +1.90.0 test --locked --manifest-path kanz-rs/Cargo.toml --test go_conformance -- --ignored
      - name: Differential depth proof and ownership handoff tests
        env:
          KANZ_DEPTH_CORPUS: ${{ runner.temp }}/kanz-depth-conformance.json
          KANZ_OKX_DEPTH_CORPUS: ${{ runner.temp }}/kanz-okx-depth-conformance.json
        run: |
          (cd kanz && go test -p 1 ./tools/depth-conformance ./internal/marketedge/depth ./internal/marketedge/book ./pkg/alpha ./services/market-ingest/... -count=1)
          (cd kanz && go run ./tools/depth-conformance) > "$KANZ_DEPTH_CORPUS"
          (cd kanz && go run ./tools/depth-conformance --okx) > "$KANZ_OKX_DEPTH_CORPUS"
          cargo +1.90.0 test --locked --manifest-path kanz-rs/Cargo.toml -p kanz-binance-depth --test go_conformance
          cargo +1.90.0 test --locked --manifest-path kanz-rs/Cargo.toml -p kanz-market-feed --test go_okx_conformance
      - name: Start the actual local Redpanda and NATS configuration
        run: docker compose -f kanz/dev/docker-compose.yml up -d --wait --wait-timeout 120 kafka nats
      - name: Real protocol, archive, drain and replay compatibility
        working-directory: kanz
        env:
          TEST_KAFKA_BROKERS: 127.0.0.1:9092
          TEST_NATS_URL: nats://127.0.0.1:4222
          KANZ_BINANCE_DEPTH_BIN: ${{ github.workspace }}/kanz-rs/target/debug/kanz-binance-depth
          KANZ_OKX_DEPTH_BIN: ${{ github.workspace }}/kanz-rs/target/debug/kanz-okx-depth
        run: |
          set -o pipefail
          go test -race -p 1 ./pkg/bus ./services/archiver/internal/archive ./tools/replay ./services/lake-sink/internal/cdc ./tools/depth-conformance \
            -run '^(TestKafkaPublishSubscribe|TestBacklogPollerReportsKafkaLag|TestKafkaBacklogRefusesToReportZeroForAnUnreachableBroker|TestIntegration_KafkaHandlerFailureWithDeadDLQKeepsTheMessageReachable|TestArchiver_|TestDrain_|TestReaderRange|TestCrash_UnflushedRowsAreLostAndOffsetsAreCommitted|TestRustDepthProcessThroughJetStream|TestRustOKXDepthProcessThroughJetStream)' \
            -count=1 -json | tee "$RUNNER_TEMP/redpanda-tests.jsonl"
          python3 -B -m unittest discover -s ../.github/scripts -p test_check_migration_evidence.py
          python3 ../.github/scripts/check_migration_evidence.py "$RUNNER_TEMP/redpanda-tests.jsonl"
      - name: Authenticate for private mirrored bases
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Warm the buildx builder image (retried on a refused pull)
        run: .github/scripts/warm-builder.sh ghcr.io/eighred/base/buildkit:buildx-stable-1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1
          driver-opts: image=ghcr.io/eighred/base/buildkit:buildx-stable-1
      # Import the image workflow's dependency layers as well as this proof's
      # cache. Export into a separate scope so qualification cannot replace
      # the publication cache. Only main warms shared caches; disposable PR
      # exports would evict them. VERSION still invalidates final compilation.
      - name: Build the Binance feed container from pinned bases
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: kanz-rs/services/binance-depth/Dockerfile
          build-args: VERSION=${{ github.sha }}
          tags: kanz-binance-depth:verification
          push: false
          load: true
          cache-from: |
            type=gha,scope=binance-depth
            type=gha,scope=qualification-binance-depth
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,scope=qualification-binance-depth,mode=max' || '' }}
      - name: Build the OKX feed container from pinned bases
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: kanz-rs/services/okx-depth/Dockerfile
          build-args: VERSION=${{ github.sha }}
          tags: kanz-okx-depth:verification
          push: false
          load: true
          cache-from: |
            type=gha,scope=okx-depth
            type=gha,scope=qualification-okx-depth
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,scope=qualification-okx-depth,mode=max' || '' }}
      - name: Bind loaded image identities to fresh qualification
        id: rust-images
        run: |
          echo "binance=$(docker image inspect --format '{{.Id}}' kanz-binance-depth:verification)" >> "$GITHUB_OUTPUT"
          echo "okx=$(docker image inspect --format '{{.Id}}' kanz-okx-depth:verification)" >> "$GITHUB_OUTPUT"
      - name: Catalog actual Binance Rust image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: docker:${{ steps.rust-images.outputs.binance }}
          format: spdx-json
          output-file: binance.spdx.json
          syft-version: v1.56.0
          upload-artifact: false
      - name: Catalog actual OKX Rust image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: docker:${{ steps.rust-images.outputs.okx }}
          format: spdx-json
          output-file: okx.spdx.json
          syft-version: v1.56.0
          upload-artifact: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify signed tool consumer boundaries
        run: python3 -B -m unittest discover -s tools/rust-audit-tools -p test_consume.py
      - name: Install pinned Rust evidence tools
        run: bash .github/scripts/install-rust-audit.sh
      - name: Exercise actual-image Rust release gates without publishing
        env:
          BINANCE_IMAGE: ${{ steps.rust-images.outputs.binance }}
          OKX_IMAGE: ${{ steps.rust-images.outputs.okx }}
        run: |
          python3 -B -m unittest discover -s .github/scripts -p test_rust_release_evidence.py
          python3 .github/scripts/rust_release_evidence.py --local --service binance-depth --image "$BINANCE_IMAGE" --sbom binance.spdx.json --output rust-evidence-binance
          python3 .github/scripts/rust_release_evidence.py --local --service okx-depth --image "$OKX_IMAGE" --sbom okx.spdx.json --output rust-evidence-okx
      - name: Preserve Rust image audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-image-evidence
          path: |
            rust-evidence-*/
            *.spdx.json
            ${{ runner.temp }}/rust-audit-tools-installed.json
          if-no-files-found: warn
      - name: Preserve broker diagnostics on failure
        if: failure()
        run: docker compose -f kanz/dev/docker-compose.yml logs --no-color kafka nats
      - name: Stop disposable CI services
        if: always()
        run: docker compose -f kanz/dev/docker-compose.yml down

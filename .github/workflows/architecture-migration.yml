name: architecture-migration

on:
  pull_request:
    paths:
      - 'kanz-rs/**'
      - 'kanz-schemas/proto/**'
      - 'kanz/internal/dec/**'
      - 'kanz/tools/decimal-conformance/**'
      - 'kanz/tools/depth-conformance/**'
      - 'kanz/pkg/alpha/**'
      - 'kanz/services/market-ingest/**'
      - 'kanz/dev/**'
      - 'kanz/pkg/bus/**'
      - 'kanz/services/archiver/**'
      - 'kanz/services/lake-sink/**'
      - 'kanz/tools/replay/**'
      - 'kanz/test/arch/**'
      - '.github/scripts/*migration_evidence.py'
      - '.github/workflows/architecture-migration.yml'
  push:
    branches: [main]
    paths:
      - 'kanz-rs/**'
      - 'kanz-schemas/proto/**'
      - 'kanz/internal/dec/**'
      - 'kanz/tools/decimal-conformance/**'
      - 'kanz/tools/depth-conformance/**'
      - 'kanz/pkg/alpha/**'
      - 'kanz/services/market-ingest/**'
      - 'kanz/dev/**'
      - 'kanz/pkg/bus/**'
      - 'kanz/services/archiver/**'
      - 'kanz/services/lake-sink/**'
      - 'kanz/tools/replay/**'
      - 'kanz/test/arch/**'
      - '.github/scripts/*migration_evidence.py'
      - '.github/workflows/architecture-migration.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  GOFLAGS: -mod=mod

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: kanz/go.mod
          cache-dependency-path: kanz/go.sum
      - uses: ./.github/actions/setup-buf
        with:
          version: 1.69.0
      - name: Generate existing canonical Go SDK
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          export PATH="$(go env GOPATH)/bin:$PATH"
          make -C kanz generate
      - name: Install pinned Rust toolchain
        working-directory: kanz-rs
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          rustup show active-toolchain
      - name: Verify migration boundary even on Rust-only changes
        working-directory: kanz
        run: go test -p 1 ./test/arch -run 'Test(Rust|EveryWorkflowGoTestIsSerialised|WorkflowGoTestMatcherDistinguishesCargo)' -count=1
      - name: Rust format, compile and unit tests
        working-directory: kanz-rs
        run: |
          cargo fmt --all -- --check
          cargo check --locked --workspace --all-targets
          cargo test --locked --workspace --lib --bins
          cargo build --locked -p kanz-binance-depth -p kanz-okx-depth
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Differential proof against current Go authority
        env:
          DECIMAL_CONFORMANCE_FIXTURE: ${{ runner.temp }}/kanz-decimal-conformance.json
        run: |
          (cd kanz && go test -p 1 ./internal/dec ./tools/decimal-conformance -count=1)
          (cd kanz && go run ./tools/decimal-conformance) > "$DECIMAL_CONFORMANCE_FIXTURE"
          cargo +1.90.0 test --locked --manifest-path kanz-rs/Cargo.toml --test go_conformance -- --ignored
      - name: Differential depth proof and ownership handoff tests
        env:
          KANZ_DEPTH_CORPUS: ${{ runner.temp }}/kanz-depth-conformance.json
          KANZ_OKX_DEPTH_CORPUS: ${{ runner.temp }}/kanz-okx-depth-conformance.json
        run: |
          (cd kanz && go test -p 1 ./tools/depth-conformance ./internal/marketedge/depth ./internal/marketedge/book ./pkg/alpha ./services/market-ingest/... -count=1)
          (cd kanz && go run ./tools/depth-conformance) > "$KANZ_DEPTH_CORPUS"
          (cd kanz && go run ./tools/depth-conformance --okx) > "$KANZ_OKX_DEPTH_CORPUS"
          cargo +1.90.0 test --locked --manifest-path kanz-rs/Cargo.toml -p kanz-binance-depth --test go_conformance
          cargo +1.90.0 test --locked --manifest-path kanz-rs/Cargo.toml -p kanz-market-feed --test go_okx_conformance
      - name: Start the actual local Redpanda and NATS configuration
        run: docker compose -f kanz/dev/docker-compose.yml up -d --wait --wait-timeout 120 kafka nats
      - name: Real protocol, archive, drain and replay compatibility
        working-directory: kanz
        env:
          TEST_KAFKA_BROKERS: 127.0.0.1:9092
          TEST_NATS_URL: nats://127.0.0.1:4222
          KANZ_BINANCE_DEPTH_BIN: ${{ github.workspace }}/kanz-rs/target/debug/kanz-binance-depth
          KANZ_OKX_DEPTH_BIN: ${{ github.workspace }}/kanz-rs/target/debug/kanz-okx-depth
        run: |
          set -o pipefail
          go test -race -p 1 ./pkg/bus ./services/archiver/internal/archive ./tools/replay ./services/lake-sink/internal/cdc ./tools/depth-conformance \
            -run '^(TestKafkaPublishSubscribe|TestBacklogPollerReportsKafkaLag|TestKafkaBacklogRefusesToReportZeroForAnUnreachableBroker|TestIntegration_KafkaHandlerFailureWithDeadDLQKeepsTheMessageReachable|TestArchiver_|TestDrain_|TestReaderRange|TestCrash_UnflushedRowsAreLostAndOffsetsAreCommitted|TestRustDepthProcessThroughJetStream|TestRustOKXDepthProcessThroughJetStream)' \
            -count=1 -json | tee "$RUNNER_TEMP/redpanda-tests.jsonl"
          python3 -B -m unittest discover -s ../.github/scripts -p test_check_migration_evidence.py
          python3 ../.github/scripts/check_migration_evidence.py "$RUNNER_TEMP/redpanda-tests.jsonl"
      - name: Authenticate for private mirrored bases
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the Rust feed containers from pinned bases
        run: |
          docker build --build-arg VERSION=${{ github.sha }} --file kanz-rs/services/binance-depth/Dockerfile --tag kanz-binance-depth:verification .
          docker build --build-arg VERSION=${{ github.sha }} --file kanz-rs/services/okx-depth/Dockerfile --tag kanz-okx-depth:verification .
      - name: Preserve broker diagnostics on failure
        if: failure()
        run: docker compose -f kanz/dev/docker-compose.yml logs --no-color kafka nats
      - name: Stop disposable CI services
        if: always()
        run: docker compose -f kanz/dev/docker-compose.yml down

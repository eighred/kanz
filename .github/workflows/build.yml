# Per-service container builds (CICD-01c). Builds a distroless image for each
# service on every PR (validation, no push) and publishes to GHCR on push to
# main. SBOM + vulnerability scan + signing + admission verification layer on
# top in CICD-01d (the release.yml gate).
name: kanz-build

on:
  pull_request:
    paths:
      - 'kanz/**'
      - 'kanz-schemas/proto/**'
      - 'kanz-schemas/buf.yaml'
      - 'kanz-schemas/buf.gen.yaml'
      - '.github/workflows/build.yml'
  push:
    branches: [main]
    # DOCS DO NOT BUILD IMAGES.
    #
    # The pull_request trigger above is already path-filtered; this one was not, so a
    # commit touching only markdown ran the full matrix — for kanz-build, that is 19
    # Docker image builds to record that a board item moved. On a private repo billing per
    # minute, that is real money for zero signal.
    #
    # paths-ignore only skips a push when EVERY changed file matches, so a commit mixing
    # docs and code still runs the gate.
    paths-ignore:
      - '**/*.md'
      - '.gitignore'

permissions:
  contents: read
  packages: write   # push to ghcr.io on main

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # BOUND THE FAN-OUT, BECAUSE THE FLAKE IS A RATE LIMIT WEARING A 403 (#320).
      #
      # 27 images built with no cap means up to 27 runners simultaneously doing
      # the SAME burst of external-registry calls: a buf release download, a Go
      # module proxy fetch, `buf generate` against buf.build, a buildkit image
      # pull, a GHCR login, and a push. Three recent reds on main failed in three
      # DIFFERENT steps of that list —
      #
      #   e81b66c  Generate kanz-schemas Go SDK  (buf: permission_denied: 403)
      #   cf74a70  docker/setup-buildx-action
      #   d3358f7  Log in to GHCR
      #
      # — each on a random ONE of the 27, each green on an identical re-run, and
      # none of them the PUSH that push-with-retry.sh already covers. A single
      # service failing while 26 others succeed with the same token in the same
      # run is not an authorization problem; it is throttling surfaced as 403
      # rather than 429, which is exactly the cause #320's own investigation notes
      # flagged and nobody had tested.
      #
      # THIS REMOVES THE CAUSE RATHER THAN MASKING IT. #320 says so directly:
      # "bounding the matrix concurrency is a smaller fix than a retry, and it
      # removes the cause rather than masking it". Adding a retry to each of the
      # three steps above would be three retries hiding three symptoms, and every
      # new step in this job would need a fourth.
      #
      # IT DOES NOT COST BILLED MINUTES. Runners are billed per job-minute and the
      # total work is unchanged; only wall-clock grows, and only when more than
      # eight images actually need rebuilding.
      max-parallel: 8
      matrix:
        include:
          # THE AI LAYER'S FIRST IMAGE (AI-M1). kanz_inference had a servicer, a streaming
          # worker, a feature store, an explainer and a model registry — and no entrypoint,
          # no image and no model. It could not be deployed, so it never ran, so the Go
          # prediction seam had no server to call and zero importers.
          - service: inference
            dockerfile: kanz-py/Dockerfile
          - service: risk-engine
            dockerfile: kanz/services/risk-engine/Dockerfile
          - service: schema-registry
            dockerfile: kanz/services/schema-registry/Dockerfile
          # The OMS image its deploy manifest has been pointing at all along, and
          # which nothing built. NOTE: this is the vendor-free build — no Binance,
          # no OKX, SimVenue only (see the Dockerfile's GOTAGS section). It is a
          # SIMULATOR. A trading image is an explicit --build-arg GOTAGS=binance,okx
          # build and must not share this tag.
          - service: oms
            dockerfile: kanz/services/oms/Dockerfile
          # INFRA-M6a: the migration runner. Not a service — a job image that a
          # Deployment runs as an initContainer before its pods start. It carries
          # every service's migrations/ (see its Dockerfile) and is selected per
          # pod with --dir /migrations/<service>.
          - service: kanz-migrate
            dockerfile: kanz/cmd/kanz-migrate/Dockerfile
          # SEC-M3c: the kill-switch needs an image because it needs an IDENTITY.
          # The production broker requires a client SVID and SPIRE issues one to a
          # POD, from its ServiceAccount — so the operator plane runs in-cluster as
          # a Job (infra/operator/), and a Job needs an image. Until this existed,
          # kanz-halt could not connect to the production spine at all: the halt
          # gate is deny-by-default, so nothing could RESUME it and the platform
          # could not be brought live.
          - service: kanz-halt
            dockerfile: kanz/cmd/kanz-halt/Dockerfile
          # Issue #71: the one-shot physical capital-path certification image.
          # Exchange secrets remain in venue adapters; this image holds only a
          # gateway principal, read-only ledger reader, and workload SVID.
          - service: kanz-capitalpath
            dockerfile: kanz/test/live/capitalpath/Dockerfile
          # INFRA-M7a-2: the Binance exchange as its own process. Unlike the oms
          # image this needs no GOTAGS — it IS the connector, so there is no
          # variant of it that silently trades against nothing.
          - service: venue-binance
            dockerfile: kanz/services/venue-binance/Dockerfile
          - service: venue-okx
            dockerfile: kanz/services/venue-okx/Dockerfile
          # INFRA-M7a-4: the market-data edge. Public quotes, no credentials, one
          # image — the venue build tags (and the silent-simulator fallback behind
          # them) are gone.
          - service: market-ingest
            dockerfile: kanz/services/market-ingest/Dockerfile
          # The last four services with a database and no deployment. schema-registry
          # already had an image; these three did not.
          - service: accounting
            dockerfile: kanz/services/accounting/Dockerfile
          - service: audit
            dockerfile: kanz/services/audit/Dockerfile
          - service: regulatory
            dockerfile: kanz/services/regulatory/Dockerfile
          # The last two services whose manifests referenced an image nothing built.
          # copilot is built WITH -tags anthropic: an untagged copilot serves a stub
          # that fabricates analysis (see its Dockerfile).
          - service: copilot
            dockerfile: kanz/services/copilot/Dockerfile
          - service: market-data
            dockerfile: kanz/services/market-data/Dockerfile
          # The Phase-7 services. Their manifests referenced these images all along;
          # nothing built them, so the durable stores wired in 156ec19 could not deploy.
          - service: wealth
            dockerfile: kanz/services/wealth/Dockerfile
          - service: alternatives
            dockerfile: kanz/services/alternatives/Dockerfile
          - service: datamaster
            dockerfile: kanz/services/datamaster/Dockerfile
          # MODEL PORTFOLIOS (#409). Portfolio construction had a service and a
          # gateway route and no image at all, so the route could not reach
          # anything. It serves its API and its /metrics on SEPARATE ports —
          # the API decides whose name goes on an order from the injected
          # principal, and must not share a port the monitoring plane may open.
          - service: optimization
            dockerfile: kanz/services/optimization/Dockerfile
          # mcp (#743): the agent-facing MCP READ plane. It had no image because it
          # did not exist; it is here in the same change that creates it, so the
          # image/manifest parity check sees it from its first commit rather than
          # after somebody notices. Like optimization it serves its API and its
          # /metrics on SEPARATE ports — the API decides which TENANT's state an
          # agent may read from the injected principal, and must not share a port
          # the monitoring plane may open.
          - service: mcp
            dockerfile: kanz/services/mcp/Dockerfile
          # EXEC-M11: the trading loop's own services, which had no images at all.
          # webhook-ingest is the FIRST HOP (the HMAC webhook that receives every
          # TradingView signal) and tv-sync is the LAST (the Broker-API projection).
          # The loop was delivered end to end in code and could not run end to end in
          # a cluster, because two of its four hops had neither an image nor a
          # manifest — and the image/manifest parity check could not see them.
          - service: webhook-ingest
            dockerfile: kanz/services/webhook-ingest/Dockerfile
          - service: tv-sync
            dockerfile: kanz/services/tv-sync/Dockerfile
          # The pre-trade mandate authority the OMS consumes FACTs from.
          - service: compliance
            dockerfile: kanz/services/compliance/Dockerfile
          # The external REST edge. It had an image target and no deployment.
          - service: api-gateway
            dockerfile: kanz/services/api-gateway/Dockerfile
          # The client stack (#364, #371). Both were written, tested and merged
          # with no Dockerfile and no entry here, so the web application and the
          # credential authority it signs into were finished, green and
          # unshippable at the same time. test/arch's
          # TestEveryServiceCanBeBuiltIntoAnImage now fails the build when a
          # service with a main has no image.
          #
          # identity mints the ES256 tokens the gateway verifies; web-bff holds
          # the session so the browser never sees one.
          - service: identity
            dockerfile: kanz/services/identity/Dockerfile
          - service: web-bff
            dockerfile: kanz/services/web-bff/Dockerfile
          # DATA-M1 (Task 7): the durable-log producer. archiver drains the NATS
          # live spine into the Kafka log of record; it had a Dockerfile, a
          # single-writer deploy manifest and real-broker integration tests
          # (Task 5) but no entry here, so nothing built the image the manifest
          # referenced.
          - service: archiver
            dockerfile: kanz/services/archiver/Dockerfile
          # DATA-M2: the durable-log consumer. lake-sink reads the Kafka log of
          # record and lands it into the lakehouse (permanent history); it had a
          # deploy manifest and a PVC but no entry here, so nothing built the image
          # the manifest referenced.
          - service: lake-sink
            dockerfile: kanz/services/lake-sink/Dockerfile
          # The operator spine (F0+S1, SEC-M3c kanz-operator namespace): reads the
          # cluster's node inventory read-only and serves it over operator.v1 gRPC
          # for the universe TUI. It had a Dockerfile and a deploy manifest (Task
          # 5) but no entry here, so nothing built the image the manifest referenced.
          - service: operator
            dockerfile: kanz/services/operator/Dockerfile
          # S2a: the one-shot node-join Job the operator schedules to bring a bare host
          # into the cluster over SSH. It had no image, so AddNode had nothing to run.
          - service: kanz-provisioner
            dockerfile: kanz/cmd/kanz-provisioner/Dockerfile
          # DR-01c. The spine-rebuild Job has referenced this image since it was
          # written and nothing built it, so infra/dr/failover.sh waited 600s on
          # an ImagePullBackOff. A disaster-recovery path that cannot pull its
          # own image is not a disaster-recovery path.
          - service: nats-rebuild
            dockerfile: kanz/tools/natsrebuild/cmd/nats-rebuild/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image build COPYs kanz-schemas/gen/go (the generated SDK the kanz
      # go.mod `replace` points at, EVT-15a — never committed), so generate it
      # on the runner first, exactly as the kanz-ci Go job does. Cheaper here
      # than dragging buf + the protoc plugins into the Docker builder stage.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: kanz/go.mod
          cache-dependency-path: kanz/go.sum
      - uses: ./.github/actions/setup-buf
        with:
          version: 1.69.0
      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # GO-ONLY GENERATION TEMPLATE, AND IT IS NOT AN OPTIMISATION.
      #
      # The full buf.gen.yaml lists four REMOTE plugins — protocolbuffers/python,
      # protocolbuffers/pyi, grpc/python and bufbuild/es — which execute on the
      # Buf Schema Registry rather than locally. This job is a matrix of ~25
      # images that all run in parallel, so a plain `buf generate` fires roughly
      # a hundred BSR plugin executions in one burst, unauthenticated. The BSR
      # rate-limits that, and the job that loses answers:
      #
      #   Failure: permission_denied: 403 Forbidden
      #   plugin protoc-gen-go: signal: killed
      #
      # It killed `image (kanz-provisioner)` on main at 143117b while the other
      # 24 images passed — which is what a rate limit looks like, and why it
      # reads as a flake nobody can reproduce.
      #
      # NONE OF IT WAS EVER USED HERE. The image build COPYs kanz-schemas/gen/go
      # and nothing else; gen/python and gen/ts are consumed by the SDK-release
      # path, not by any Dockerfile in this matrix (kanz-py's own Dockerfile
      # copies the raw protos). So this generated three languages, discarded two,
      # and took a network dependency on a registry to do it.
      #
      # MANAGED MODE IS CARRIED OVER DELIBERATELY: the .proto files declare no
      # `option go_package`, so dropping the managed block would emit Go with no
      # package path and fail to compile. The prefix must stay in step with
      # buf.gen.yaml.
      #
      # Verified byte-identical: 53 generated .go files, same sha1 over the tree,
      # before and after.
      #
      # This mirrors the TS-only template kanz-ci.yml already uses for the same
      # reason in the other direction — that one avoids needing the Go plugins.
      - name: Generate kanz-schemas Go SDK
        working-directory: kanz-schemas
        env:
          GOFLAGS: -mod=mod
        run: |
          cat > /tmp/buf.gen.go.yaml <<'EOF'
          version: v2
          managed:
            enabled: true
            override:
              - file_option: go_package_prefix
                value: github.com/eighred/kanz/kanz-schemas-go
          plugins:
            - local: protoc-gen-go
              out: gen/go
              opt: paths=source_relative
            - local: protoc-gen-go-grpc
              out: gen/go
              opt: paths=source_relative
          EOF
          buf generate --template /tmp/buf.gen.go.yaml
          cd gen/go
          go mod init github.com/eighred/kanz/kanz-schemas-go || true
          go mod tidy


      # THE BFF'S IMAGE MUST CONTAIN THE SPA (#371).
      #
      # web-bff serves the compiled application on its OWN origin and proxies
      # /api/* from the same hostname. That is not a packaging convenience: a
      # separate static host would be a second origin, which forces the session
      # cookie to SameSite=None — the setting that makes a cookie usable
      # cross-site and therefore the one CSRF defences exist to prevent — plus
      # CORS-with-credentials and a cookie domain kept in step with the edge.
      #
      # kanz-web/dist is a BUILD ARTIFACT and gitignored, so it is produced here
      # and lands in the docker context, exactly as the generated Go SDK above
      # does. Without this the image builds, starts, serves /api and /auth
      # perfectly, and returns nothing at / — an application that is finished,
      # green, and blank in a browser.
      #
      # Scoped to the one image that needs it: 29 matrix entries, one SPA.
      - name: Build the SPA into the docker context
        if: matrix.service == 'web-bff'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: kanz-web/.nvmrc
          cache: npm
          cache-dependency-path: kanz-web/package-lock.json
      - name: Compile kanz-web into dist
        if: matrix.service == 'web-bff'
        working-directory: kanz-web
        run: |
          npm ci
          npm run build
          test -f dist/index.html || { echo "::error::kanz-web/dist/index.html is missing after build — the BFF image would ship without the SPA"; exit 1; }

      # A FORK PR CANNOT PULL A PRIVATE BASE, AND MUST SAY SO IN ITS FIRST STEP.
      #
      # Since #161 every FROM resolves to ghcr.io/eighred/base/*, which is
      # PRIVATE by policy. GITHUB_TOKEN on a pull_request from a FORK carries no
      # read access to this org's packages, so the base pull 403s. Without this
      # check that surfaces as a docker error twelve steps in, naming a registry
      # path and not a cause — which is the shape that sends people looking at
      # the Dockerfile.
      #
      # Same-repo branches (the normal workflow here) are unaffected: they get a
      # full GITHUB_TOKEN and authenticate below.
      - name: Fork PRs cannot pull the private base images
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error title=Fork PR cannot build images::Base images live in the PRIVATE" \
               "package namespace ghcr.io/eighred/base/* (#161). A pull_request from a fork" \
               "receives a GITHUB_TOKEN with no read access to this organisation's packages," \
               "so every FROM would fail with a 403 during the build." \
               "Push the branch to eighred/kanz and open the PR from there."
          exit 1

      # NOT `if: github.event_name == 'push'` ANY MORE (#161).
      #
      # That condition was correct while every FROM came from Docker Hub and
      # gcr.io anonymously — login was needed only to PUSH the built image, which
      # happens on push. Now the base images are pulled from a private namespace,
      # so authentication is required to BUILD at all. Leaving the condition
      # would have produced the worst available failure shape: main green because
      # pushes authenticate, every pull_request red on a base pull, and the cause
      # one layer below where anyone reads.
      # BEST-EFFORT, AND THE RETRY BELOW IS THE ONE THAT MUST SUCCEED (#320).
      #
      # This action stays for two reasons that are not stylistic. supplychain_test.go
      # requires every image-building workflow to contain an UNCONDITIONAL
      # docker/login-action — #161 shipped a conditional one and made main green
      # while every pull_request failed on a base pull — and the action removes the
      # credential in its post step, which a bare `docker login` would not.
      #
      # What it cannot do is retry. ~30 image jobs authenticate to ghcr.io within
      # the same second and one is periodically refused with
      # `Get "https://ghcr.io/v2/": denied: denied` — a different service each run,
      # green on re-run. So its failure is no longer fatal, and the step below owns
      # the outcome.
      - name: Log in to GHCR
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # THE AUTHORITATIVE LOGIN. A no-op first attempt when the action above
      # worked; the retry that rides out the refusal when it did not. Refused on
      # every attempt it FAILS the job rather than proceeding unauthenticated,
      # because every base image is private and the alternative is a red on the
      # base pull one layer below where anyone reads.
      - name: Authenticate to GHCR (retried on a refused login)
        id: login
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/login-with-retry.sh ghcr.io "${{ github.actor }}"

      # BUILDX COMES AFTER THE LOGIN NOW, AND THAT ORDER IS LOAD-BEARING (#320).
      #
      # It used to run first, which was fine while the builder image came from
      # Docker Hub anonymously. It does not any more: driver-opts pins it at
      # ghcr.io/eighred/base/buildkit, which is PRIVATE like every other mirrored
      # base, so creating the builder is now an authenticated pull. Leaving this
      # above the login would fail EVERY build on the builder pull — trading an
      # occasional upstream outage for a permanent one.
      #
      # WHY PIN IT AT ALL. #161 moved all 52 FROMs under ghcr.io/eighred/base/*
      # and the conclusion drawn was that the estate no longer needs Docker Hub
      # to build. main went red on 2026-08-08 disproving it:
      #
      #   #1 ERROR: Error response from daemon:
      #      Get "https://registry-1.docker.io/v2/": context deadline exceeded
      #
      # on image (oms, …), whose Dockerfile contains no Docker Hub reference at
      # all. setup-buildx-action creates the builder from moby/buildkit and with
      # no driver-opts takes it from Docker Hub — so the FROMs were mirrored and
      # the thing that RESOLVES them was not. It is also the failure the #320
      # push retry structurally cannot cover: that wraps the PUSH, and this
      # fails at buildx step #1, before any step this repo wrote.
      #
      # The tag is moving on purpose; base-image-mirror.yml's weekly refresh is
      # what stops a mirror becoming a supply-chain freeze.
      # WARM THE BUILDER ITSELF, WITH A RETRY (#320's third case).
      #
      # setup-buildx-action pulls the pinned builder image while creating the
      # builder, and that pull had no retry. It is the gap warm-bases.sh named in
      # its own header and declined to close — "Left alone deliberately" — on the
      # grounds that closing it meant replacing the action with a scripted
      # create+bootstrap. It does not: `docker pull` first, and the create below
      # finds the image already in the daemon.
      #
      # main's cousin went red on it on 2026-08-18, PR #547, image (venue-okx):
      #
      #   #1 pulling image ghcr.io/eighred/base/buildkit:buildx-stable-1
      #   #1 ERROR: Error response from daemon: manifest unknown
      #
      # one job of thirty, the other twenty-nine having pulled the same tag in the
      # same run. This step compiles nothing, so retrying it cannot retry a code
      # failure — the property every retry in this workflow is built on.
      #
      # THE IMAGE IS SPELLED TWICE, HERE AND IN driver-opts BELOW, AND AN ARCH
      # GUARD PINS THEM TOGETHER. Two literals that must agree is exactly how this
      # quietly stops working: the pin moves to a new tag, the warm keeps pulling
      # the old one, and the retry protects an image nothing boots.
      - name: Warm the buildx builder image (retried on a refused pull)
        id: warm_builder
        run: .github/scripts/warm-builder.sh ghcr.io/eighred/base/buildkit:buildx-stable-1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: image=ghcr.io/eighred/base/buildkit:buildx-stable-1

      # WARM THE BASES BEFORE BUILDING, WITH A RETRY (#320).
      #
      # The push retry below cannot cover this and build.yml already said so: it
      # "wraps the PUSH", while a base-image pull fails inside the build. main
      # went red on exactly that on 2026-08-11 — image (wealth), a 403 on a
      # distroless-static blob, kanz-ci green, Dockerfile unchanged.
      #
      # This step compiles nothing: it builds a Dockerfile consisting of the base
      # image and nothing else, so a code failure cannot reach it and retrying is
      # safe for the same structural reason the push retry is. See the script.
      - name: Warm base images (retried on a refused pull)
        id: warm
        run: .github/scripts/warm-bases.sh "${{ matrix.dockerfile }}"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Canonical org, not the computed owner — see release.yml's IMAGE comment.
          # Guarded by TestImageOrgIsCanonical.
          images: ghcr.io/eighred/${{ matrix.service }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      # BUILD AND PUSH ARE SEPARATE STEPS ON PURPOSE (#320).
      #
      # They used to be one `docker/build-push-action` with `push: true`, which
      # made a refused push and a broken Dockerfile the same event: one red step,
      # distinguishable only by reading the log. GHCR refuses ~2 pushes in 5 here
      # — random services, never the same one twice, green on an identical re-run
      # — so that shape reddened main regularly for no code reason, and each
      # occurrence still had to be diagnosed before it could be dismissed.
      #
      # Splitting them is what makes a retry SAFE rather than reckless. The retry
      # lives on the push alone, so a build failure — a compile error, a bad
      # Dockerfile, a missing SDK — fails immediately and is never retried. That
      # separation, not the retry itself, is the load-bearing part of this change.
      #
      # `load` only on push events: a pull_request builds for validation and has
      # nothing to publish, so exporting the image to the daemon there would be
      # pure cost.
      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # context: . uses the local checkout (incl. the generated gen/go),
          # not the git context which would omit the uncommitted SDK.
          context: .
          file: ${{ matrix.dockerfile }}
          # Not a release, so the commit SHA is the honest version (#143).
          build-args: |
            VERSION=${{ github.sha }}
          push: false
          load: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      # The retry, and the count that keeps the flake visible after it stops being
      # fatal. See .github/scripts/push-with-retry.sh for why it keys on the
      # outcome rather than on "403" — four spellings were observed in one day and
      # a string match already missed one of them.
      - name: Push (retried on a refused push)
        id: push
        if: github.event_name == 'push'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # shellcheck disable=SC2086 # TAGS is a newline-separated list, word splitting is intended
          .github/scripts/push-with-retry.sh $TAGS

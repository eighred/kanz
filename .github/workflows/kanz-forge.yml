name: kanz-forge

# Called exactly once by the always-present required CI gate.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  repository-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate marketplace, plugin, tracked skills and references
        run: python3 .agents/plugins/kanz-forge/scripts/validate.py --tracked
      - name: Verify imported source integrity
        run: python3 -B .agents/plugins/kanz-forge/scripts/provenance.py
      - name: Exercise offline audit validators on Linux
        run: node --test .agents/plugins/kanz-forge/skills/security-audit/*.test.cjs
      - name: Verify offline planner, collector, classification and package regressions
        run: python3 -B -m unittest discover -s .agents/plugins/kanz-forge/scripts -p 'test_*.py' -v

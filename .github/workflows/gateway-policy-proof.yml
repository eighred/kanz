name: gateway-policy-proof
on:
  pull_request:
    paths:
      - 'tools/gateway-policy-proof/**'
      - 'tools/Invoke-TokyoGatewayPolicy.ps1'
      - 'tools/feed-identity/**'
      - 'kanz/infra/overlays/testnet-tokyo/**'
      - 'kanz/infra/security/runtime/**'
      - '.github/workflows/gateway-policy-proof.yml'
  push:
    branches: [main]
    paths:
      - 'tools/gateway-policy-proof/**'
      - 'tools/Invoke-TokyoGatewayPolicy.ps1'
      - 'tools/feed-identity/**'
      - 'kanz/infra/overlays/testnet-tokyo/**'
      - 'kanz/infra/security/runtime/**'
      - '.github/workflows/gateway-policy-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 -B -m unittest discover -s tools/gateway-policy-proof -p 'test_*.py'
      - run: python3 -B -m unittest discover -s tools/feed-identity -p 'test_*.py'
      - run: bash tools/feed-identity/install.sh
      - name: Qualify actual rendered gateway-only policies
        run: python3 -B tools/gateway-policy-proof/proof.py
      - name: Validate exact source and attempt evidence
        run: >-
          python3 -B tools/gateway-policy-proof/check.py "$RUNNER_TEMP/gateway-policy.json"
          --source "$(git rev-parse HEAD)" --tree "$(git rev-parse 'HEAD^{tree}')"
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Qualify four-policy CAS and rollback on real Kubernetes
        run: python3 -B tools/gateway-policy-proof/transaction_fixture.py
      - name: Validate exact transaction evidence
        run: python3 -B tools/gateway-policy-proof/check_transaction.py "$RUNNER_TEMP/gateway-policy-transaction.json"
      - name: Remove only the owned cluster after interruption
        if: always()
        run: |
          python3 -B tools/gateway-policy-proof/cleanup.py
          python3 -B tools/gateway-policy-proof/cleanup.py --transaction
      - name: Preserve sanitized developmental evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gateway-policy-proof
          path: |
            ${{ runner.temp }}/gateway-policy.json
            ${{ runner.temp }}/gateway-policy-transaction.json
          if-no-files-found: error

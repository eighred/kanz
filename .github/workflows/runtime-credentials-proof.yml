name: runtime-credentials-proof

# Phase-1 source qualification only. This never contacts the deployed estate,
# changes active GitOps, rotates a credential, or dispatches held native lanes.
on:
  pull_request:
    paths:
      - 'tools/runtime_credentials/**'
      - 'tools/bootstrap-testnet-data-plane.sh'
      - 'kanz/internal/pg/**'
      - 'kanz/internal/migrate/**'
      - 'kanz/services/audit/**'
      - 'kanz/services/identity/**'
      - 'kanz/services/accounting/**'
      - '.github/workflows/runtime-credentials-proof.yml'
  push:
    branches: [main]
    paths:
      - 'tools/runtime_credentials/**'
      - 'tools/bootstrap-testnet-data-plane.sh'
      - 'kanz/internal/pg/**'
      - 'kanz/internal/migrate/**'
      - 'kanz/services/audit/**'
      - 'kanz/services/identity/**'
      - 'kanz/services/accounting/**'
      - '.github/workflows/runtime-credentials-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  isolated-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.18'
      - name: Bind canonical provisioning before executing its entrypoints
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          paths = ['kanz-schemas', 'kanz/go.mod', 'kanz/go.sum', '.github/actions/setup-buf', '.github/scripts/check_migration_evidence.py']
          def git(*args):
              return subprocess.check_output(['git', *args])
          canonical = git('rev-parse', 'origin/main').decode().strip()
          current = git('rev-parse', 'HEAD').decode().strip()
          inventory = git('ls-tree', '-rz', 'HEAD', '--', *paths)
          if inventory != git('ls-tree', '-rz', canonical, '--', *paths):
              raise SystemExit('canonical schema/tool/module/verifier inventory differs; refusing host provisioning')
          inputs = {}
          for entry in inventory.split(b'\0'):
              if not entry:
                  continue
              header, path = entry.split(b'\t', 1)
              mode, kind, blob = header.split()
              if mode not in (b'100644', b'100755') or kind != b'blob':
                  raise SystemExit('canonical provisioning requires regular source files')
              path = path.decode()
              content = pathlib.Path(path).read_bytes()
              expected = git('cat-file', 'blob', blob.decode())
              if content != expected:
                  raise SystemExit('worktree provisioning bytes differ from canonical inventory')
              inputs[path] = hashlib.sha256(content).hexdigest()
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'runtime-canonical-inputs.json'
          with target.open('x', encoding='utf-8') as stream:
              json.dump({'source_sha': current, 'canonical_sha': canonical, 'inputs': inputs,
                         'generators': {'buf': '1.69.0', 'protoc-gen-go': 'v1.36.11', 'protoc-gen-go-grpc': 'v1.5.1'}}, stream, indent=2)
          PY
      - uses: ./.github/actions/setup-buf
        with:
          version: 1.69.0
      - name: Provision the unchanged canonical SDK and dependency graph
        working-directory: kanz
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-provision/home" "$RUNNER_TEMP/runtime-provision/cache" "$RUNNER_TEMP/runtime-provision/modules" "$RUNNER_TEMP/runtime-provision/bin" "$RUNNER_TEMP/runtime-provision/tmp"
          export GOBIN="$RUNNER_TEMP/runtime-provision/bin" GOMODCACHE="$RUNNER_TEMP/runtime-provision/modules"
          export GOCACHE="$RUNNER_TEMP/runtime-provision/cache" GOTMPDIR="$RUNNER_TEMP/runtime-provision/tmp"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          export PATH="$GOBIN:$PATH"
          cd ../kanz-schemas
          buf generate
          bash bootstrap-go-sdk.sh
          cd ../kanz
          GOFLAGS=-mod=readonly go mod download
          python3 -m pip install --only-binary=:all: --no-deps --target "$RUNNER_TEMP/runtime-pyyaml" 'PyYAML==6.0.3'
      - name: Authenticate approved registry reads
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
      - name: Provision only existing immutable image inputs
        run: |
          set -euo pipefail
          docker pull ghcr.io/eighred/base/golang:1.26.10@sha256:eb36c1664dd974cde625f736e02c204383deebe03977365caaec5bf49f794348
          docker pull hashicorp/vault:1.21.4@sha256:6c77f568e6b6310d5bc68befb5711b9215c574de7da489e7c24332581176888b
          docker pull postgres:16-alpine@sha256:1fb72075a1de85a1d39de23c2da81baef1b71bf5c0b61a14cbbfdb072a6246d9
          docker pull python:3.13.18-alpine3.24@sha256:7712cfd23e0501f5cb58faa5e6e0d515c9939bdbce866921799b31e696a1d13c
      - name: Remove registry authentication before target execution
        run: docker logout ghcr.io
      - name: Execute bounded loopback-only source proof
        run: |
          python3 -B tools/runtime_credentials/proof.py \
            --modules "$RUNNER_TEMP/runtime-provision/modules" \
            --yaml-dependency "$RUNNER_TEMP/runtime-pyyaml" \
            --evidence "$RUNNER_TEMP/runtime-credentials-evidence" \
            --canonical-binding "$RUNNER_TEMP/runtime-canonical-inputs.json" \
            --run-id '${{ github.run_id }}-${{ github.run_attempt }}'
      - name: Remove only this run's disposable containers after interruption
        if: always()
        env:
          PROOF_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          run = os.environ['PROOF_RUN_ID']
          if not re.fullmatch(r'[0-9]{1,20}-[0-9]{1,8}', run):
              raise SystemExit('invalid cleanup run identity')
          def call(*args):
              return subprocess.check_output(['docker', *args], timeout=20)
          ids = call('ps', '-aq', '--no-trunc', '--filter', 'label=io.kanz.runtime-credentials-proof=true', '--filter', 'label=io.kanz.runtime-credentials-run=' + run).decode().split()
          results = []
          for identity in ids:
              if not re.fullmatch(r'[0-9a-f]{64}', identity):
                  raise SystemExit('invalid cleanup container identity')
              actual = json.loads(call('inspect', identity))[0]
              labels = actual.get('Config', {}).get('Labels', {})
              owner = labels.get('io.kanz.runtime-credentials-owner', '')
              owned = (actual.get('Id') == identity and labels.get('io.kanz.runtime-credentials-proof') == 'true'
                       and labels.get('io.kanz.runtime-credentials-run') == run
                       and re.fullmatch(r'kanz-runtime-credentials-[0-9a-f]{16}', owner)
                       and re.fullmatch('/' + re.escape(owner) + r'-[a-z0-9-]+', actual.get('Name', '')))
              if not owned:
                  results.append({'id': identity, 'status': 'refused ownership mismatch'})
                  continue
              removed = subprocess.run(['docker', 'rm', '-f', '-v', identity], capture_output=True, timeout=20).returncode == 0
              absent = not call('ps', '-aq', '--no-trunc', '--filter', 'id=' + identity).strip()
              results.append({'id': identity, 'status': 'removed and absent' if removed and absent else 'removal/absence failed'})
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'runtime-credentials-fallback-cleanup.json'
          with target.open('x', encoding='utf-8') as stream:
              json.dump({'run_id': run, 'containers': results}, stream, indent=2)
          if any(item['status'] != 'removed and absent' for item in results):
              raise SystemExit('owned cleanup did not complete safely')
          PY
      - name: Remove registry authentication
        if: always()
        run: docker logout ghcr.io
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: runtime-credentials-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/runtime-credentials-evidence/receipt.json
            ${{ runner.temp }}/runtime-credentials-fallback-cleanup.json
          if-no-files-found: error
          retention-days: 14

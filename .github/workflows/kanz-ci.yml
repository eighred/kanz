# kanz monorepo CI — the Go safety net for the `kanz` module (CICD-01a).
#
# The module depends on the kanz-schemas Go SDK via a local `replace` directive
# (kanz/go.mod → ../kanz-schemas/gen/go). That SDK is generated, never
# committed (EVT-15a), so every job must `buf generate` it first — including
# protoc-gen-go-grpc, which emits the inference.v1 gRPC stubs (PRED-06) that
# protoc-gen-go alone does not. GOFLAGS=-mod=mod lets the toolchain resolve and
# checksum the freshly generated local module.
#
# CICD-01b adds the Python (kanz-py, pytest) + TypeScript (kanz/ts, node:test
# via tsx — the runner the package actually uses; "vitest" in the task is loose
# shorthand) jobs plus a `buf lint`+`buf breaking` schema gate.
name: kanz-ci

on:
  pull_request:
    paths:
      - 'kanz/**'
      - 'kanz-py/**'
      - 'kanz-schemas/proto/**'
      - 'kanz-schemas/buf.yaml'
      - 'kanz-schemas/buf.gen.yaml'
      # sdk-guard: a committed generated tree must trigger the run that rejects it.
      - 'kanz-schemas/gen/**'
      - '.github/workflows/kanz-ci.yml'
  push:
    branches: [main]
    # DOCS DO NOT BUILD IMAGES.
    #
    # The pull_request trigger above is already path-filtered; this one was not, so a
    # commit touching only KANZ_TASKS.md ran the full matrix — for kanz-build, that is 19
    # Docker image builds to record that a board item moved. On a private repo billing per
    # minute, that is real money for zero signal.
    #
    # paths-ignore only skips a push when EVERY changed file matches, so a commit mixing
    # docs and code still runs the gate.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'

permissions:
  contents: read

env:
  # Required: the kanz-schemas-go dependency is a local `replace`, so the build
  # must be allowed to update go.mod/go.sum for it rather than failing readonly.
  GOFLAGS: -mod=mod

jobs:
  go:
    runs-on: ubuntu-latest
    # A live Postgres for the durable-store integration suites. Without it every
    # test gated on TEST_POSTGRES_URL silently SKIPS — including EXEC-M7c's
    # TestPostgresCreateIsAtomicAdmissionGate, the only automated proof that the
    # OMS admission gate holds across pods. That test is what makes
    # infra/deploy/oms-deploy.yaml's `replicas: 2` safe rather than a double-trade,
    # so a green pipeline that skipped it is not a green pipeline.
    services:
      # EXEC-M22 — webhook-ingest's cross-pod nonce store. The `redis` build tag was
      # NEVER COMPILED by this pipeline, so nonces_redis.go and pkg/redisadapter were
      # dead code as far as CI was concerned — and they are what makes the platform's
      # ENTRANCE safe to run on more than one pod. A real Redis runs here now, and the
      # tagged build is compiled, vetted and tested against it.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kanz
          POSTGRES_PASSWORD: kanz
          POSTGRES_DB: kanz
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The suites must connect as a NON-SUPERUSER. Postgres bypasses row-level
      # security for superusers, so the MT-01d tenant-isolation tests detect that
      # and skip (persist/postgres_test.go: "RLS is bypassed for superusers").
      # Running as the superuser would mean a green pipeline that never once
      # verified that one tenant cannot read another's rows. `kanzapp` owns its
      # database, so it can run the migrations' DDL while FORCE RLS still applies
      # to it — the same posture the services run under in production.
      - name: Provision non-superuser DB role (so RLS is enforced, not bypassed)
        env:
          PGPASSWORD: kanz
        run: |
          psql -h localhost -U kanz -d kanz -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE kanzapp LOGIN PASSWORD 'kanz' NOSUPERUSER;" \
            -c "CREATE DATABASE kanzapp OWNER kanzapp;"
          psql -h localhost -U kanz -d kanzapp -v ON_ERROR_STOP=1 \
            -c "GRANT ALL ON SCHEMA public TO kanzapp;"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Track the toolchain pinned in go.mod so CI never drifts from local.
          go-version-file: kanz/go.mod
          cache-dependency-path: kanz/go.sum

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: 1.69.0
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate kanz-schemas Go SDK
        working-directory: kanz-schemas
        run: |
          buf generate
          cd gen/go
          go mod init github.com/kanz-eng/kanz-schemas-go || true
          go mod tidy

      - name: Build
        working-directory: kanz
        run: go build ./...

      - name: Vet
        working-directory: kanz
        run: go vet ./...

      # ./... includes the arch (test/arch) + contract (test/contract) suites —
      # they are ordinary, untagged _test.go files. -race needs cgo (default-on
      # on ubuntu runners).
      #
      # TEST_POSTGRES_URL points at the non-superuser role above, so the durable
      # -store suites RUN here instead of skipping — the order-store admission
      # gate and the RLS tenant-isolation tests included.
      # The real-bus guards are worthless if they never run, and until now they
      # never did: CI provisioned Postgres but no broker, so TEST_NATS_URL was
      # unset and EVERY NATS integration test silently skipped — including the
      # EXEC-M7a guard, which exists precisely because a fake Publisher cannot fail
      # the way a broker fails, and the EXEC-M8 venue publish-health test, which is
      # the capital control that stops an adapter trading while nobody records it.
      #
      # A service container cannot pass the `-js` arg the image needs, so JetStream
      # is started as a step.
      - name: Start NATS (JetStream)
        run: |
          docker run -d --name kanz-ci-nats -p 4222:4222 nats:2 -js
          for i in $(seq 1 30); do
            docker logs kanz-ci-nats 2>&1 | grep -q "Server is ready" && exit 0
            sleep 1
          done
          echo "NATS did not become ready"; docker logs kanz-ci-nats; exit 1

      # DATA-M1 (Task 7) — the archiver's and pkg/bus's TEST_KAFKA_BROKERS-gated
      # integration tests had never run in CI: no Kafka existed here to point them
      # at, so they silently skipped on every run since the day they were written.
      # That is exactly the shape of the gap `-tags redis` sat in before EXEC-M22 —
      # a real guard that compiled clean and never once executed.
      #
      # A `services:` container cannot work for this image: it needs a FULL
      # single-node KRaft env set (partial env — e.g. only
      # KAFKA_AUTO_CREATE_TOPICS_ENABLE — switches the entrypoint from "use the
      # baked-in server.properties" to "assemble config purely from env" and it
      # then fails looking for zookeeper.connect). Started as a step, exactly like
      # NATS above, with the exact env this workflow's own archiver Task 5 proved
      # boots clean (see .superpowers/sdd/task-5-report.md). No `-js`-equivalent
      # flag is needed here, only env, but the boot-and-poll shape matches NATS's
      # for the same reason: neither image's readiness is visible to Docker's own
      # health-check without a broker-specific probe this workflow doesn't need.
      - name: Start Kafka (single-node KRaft)
        run: |
          docker run -d --name kanz-ci-kafka -p 9092:9092 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            -e KAFKA_AUTO_CREATE_TOPICS_ENABLE=false \
            apache/kafka:3.9.0
          for i in $(seq 1 60); do
            docker logs kanz-ci-kafka 2>&1 | grep -q "Kafka Server started" && exit 0
            sleep 2
          done
          echo "Kafka did not become ready"; docker logs kanz-ci-kafka; exit 1

      # Bootstrap the spine with THE SCRIPT PRODUCTION APPLIES — extracted from the
      # very ConfigMap infra/nats/bootstrap-job.yaml ships. A copy of the stream
      # list here would drift from that one, and the drift is invisible until a
      # service meets a real broker and finds its subject unbound: a JetStream
      # publish to an unbound subject is a hard failure, and a CONSUMER on one 404s
      # and takes the service's whole consumer group down with it. Both have already
      # happened here (EXEC-M7a, EXEC-M9). NATS_REPLICAS=1 because CI is one node.
      - name: Bootstrap the NATS topology (the script production applies)
        run: |
          awk '/^  bootstrap\.sh: \|/{f=1;next} f&&/^---/{exit} f{sub(/^    /,"");print}' \
            kanz/infra/nats/bootstrap-job.yaml > /tmp/bootstrap.sh
          test -s /tmp/bootstrap.sh || { echo "could not extract bootstrap.sh from the ConfigMap"; exit 1; }
          docker run --rm -i --network host \
            -e NATS_URL=nats://localhost:4222 -e NATS_REPLICAS=1 \
            natsio/nats-box:0.14.5 sh -s < /tmp/bootstrap.sh

      # The M1 loop certification (webhook-ingest's TestIntegration_LoopOverNATS)
      # drives a real SubmitOrder onto the real spine and asserts the OMS's
      # OrderFilled FACTs come back. It needs an OMS ON THE BUS, and it has never
      # had one — so it has never run anywhere but a developer's laptop, and the
      # first time it was run it failed for three separate production reasons.
      #
      # OMS_SIM_VENUE_MIC takes both MICs the allocation fans out to: the router
      # matches a leg to the venue whose MIC equals the leg's target, so a
      # single-venue simulator cannot work a multi-venue allocation at all.
      - name: Start the OMS on the bus (for the M1 loop certification)
        working-directory: kanz
        env:
          KANZ_MIGRATE_DATABASE_URL: postgres://kanzapp:kanz@localhost:5432/kanzapp?sslmode=disable
        run: |
          go run ./cmd/kanz-migrate --dir services/oms/migrations
          go build -o /tmp/oms ./services/oms/cmd/oms
          OMS_NATS_URL=nats://localhost:4222 \
          OMS_DATABASE_URL='postgres://kanzapp:kanz@localhost:5432/kanzapp?sslmode=disable' \
          OMS_TENANT=__system__ \
          OMS_SIM_VENUE_MIC=XNAS,XLON \
          /tmp/oms > /tmp/oms.log 2>&1 &
          for i in $(seq 1 30); do
            grep -q '"msg":"oms subscribing"' /tmp/oms.log && exit 0
            sleep 1
          done
          echo "the OMS never subscribed:"; cat /tmp/oms.log; exit 1

      # TEST_KAFKA_BROKERS points at the KRaft broker started above. Until now this
      # was unset, so every Kafka-gated integration test silently skipped:
      # pkg/bus/kafka_integration_test.go (the bus's own real-broker guard),
      # tools/replay/reader_integration_test.go (replay against the durable log),
      # and — the payoff — services/archiver/internal/archive's four
      # TestArchiver_* tests: the ordering guarantee, the outage-loses-nothing
      # proof, the ack-before-produce red twin, and the unprovisioned-tenant NACK.
      # Those are DATA-M1's entire reason to exist; a green pipeline that never
      # ran them was not proof of anything.
      # SEC-M3a — THE PRODUCTION BROKER CONTRACT. Every NATS step above runs a
      # broker with NO TLS, and that is why nobody saw SEC-M3: infra/nats/nats.yaml
      # requires a client SVID (`tls { verify: true, verify_and_map: true }`), and
      # not one bus.DialNATS call site in the repository set TLSConfig — so the
      # whole platform, kanz-halt included, was refused at the handshake by the
      # config it actually deploys, while CI stayed green against a broker
      # configured unlike production in the one dimension that decides whether a
      # connection is possible at all.
      #
      # This stands the REAL nats.conf + tenants.conf up (extracted from the
      # ConfigMaps production applies — the same stance as the bootstrap-script
      # extraction above; a copy would drift and the drift would be invisible).
      # It runs BESIDE the plaintext broker on its own port: the TEST_NATS_URL
      # suite proves bus SEMANTICS, this proves the production TRANSPORT, and
      # neither substitutes for the other. The script refuses to report success
      # unless the broker logs "TLS required for client connections" — a gate that
      # comes up without its gate armed proves nothing.
      - name: Start NATS (mTLS — the broker config production applies)
        run: kanz/test/mtls/up.sh /tmp/kanz-mtls 4223

      # SEC-M3b — CAN THE TOPOLOGY EVEN BE PROVISIONED? infra/nats/bootstrap-job.yaml
      # is the Job that creates every stream, and it dialed nats://nats:4222 with no
      # certs — so against the production broker it was refused exactly like the
      # services, and the cluster could not create the streams those services then
      # fail to find. It is not a Go client, so the M3a wire does not apply: it runs
      # the `nats` CLI, which is not SPIFFE-aware and does ordinary DNS hostname
      # verification (against a URI-SAN-only cert it fails outright). It needs a
      # client SVID via NATS_CERT/KEY/CA and a URL that MATCHES a DNS SAN.
      #
      # This runs THE SCRIPT PRODUCTION APPLIES against the mTLS broker, so the
      # bootstrap path is proven by execution rather than by reading the manifest —
      # which is the only reason any of this was ever wrong.
      - name: Bootstrap the topology over mTLS (the script production applies)
        run: |
          awk '/^  bootstrap\.sh: \|/{f=1;next} f&&/^---/{exit} f{sub(/^    /,"");print}' \
            kanz/infra/nats/bootstrap-job.yaml > /tmp/bootstrap-mtls.sh
          test -s /tmp/bootstrap-mtls.sh || { echo "could not extract bootstrap.sh"; exit 1; }
          docker run --rm -i --network host -v /tmp/kanz-mtls:/c:ro \
            -e NATS_URL=nats://localhost:4223 -e NATS_REPLICAS=1 \
            -e NATS_CERT=/c/client.pem -e NATS_KEY=/c/client.key -e NATS_CA=/c/bundle.pem \
            natsio/nats-box:0.14.5 sh -s < /tmp/bootstrap-mtls.sh

      - name: Test (race) — incl. arch + contract + Postgres + real-bus + M1 loop
        working-directory: kanz
        env:
          TEST_POSTGRES_URL: postgres://kanzapp:kanz@localhost:5432/kanzapp?sslmode=disable
          TEST_NATS_URL: nats://localhost:4222
          TEST_KAFKA_BROKERS: localhost:9092
          TEST_OMS_ON_BUS: "1"
          # Both are required by the mTLS suite; a test that gated on one alone
          # would FAIL rather than skip when the other went missing.
          TEST_NATS_MTLS_URL: nats://localhost:4223
          TEST_NATS_MTLS_CERT_DIR: /tmp/kanz-mtls
        run: go test -race ./...

      # THE `redis` BUILD (EXEC-M22). This tag is what webhook-ingest's production image is
      # built with, and it is the ONLY thing that makes `replicas: 2` on the platform's
      # entrance safe rather than a double-trade machine. It was never compiled here, so a
      # break in nonces_redis.go or pkg/redisadapter would have shipped silently — and the
      # only test that touched RedisNonces drove it against a FAKE, which cannot prove that
      # ClaimNX is really an atomic SET NX PX.
      #
      # Built, vetted and tested against a REAL Redis, so the tag cannot rot back into dead
      # code the next time someone changes the adapter.
      # THE `anthropic` TAG (AI-M1). copilot's PRODUCTION IMAGE is built with it
      # (build.yml), and this pipeline never vetted, tested or linted it — the same hole
      # `-tags redis` sat in until EXEC-M22, and the same hole that let the entire AI layer
      # rot: code that ships but is never exercised by any check on this repository.
      #
      # There is no Anthropic credential here and there does not need to be: compiling and
      # vetting the tag is what catches the break. A model call is not what rots — the
      # adapter around it is.
      - name: Build + vet the `anthropic` tag
        working-directory: kanz
        run: |
          go build -tags anthropic ./...
          go vet -tags anthropic ./services/copilot/...

      - name: Build + vet + test the `redis` tag (real Redis)
        working-directory: kanz
        env:
          TEST_REDIS_URL: redis://localhost:6379/0
          TEST_POSTGRES_URL: postgres://kanzapp:kanz@localhost:5432/kanzapp?sslmode=disable
          TEST_NATS_URL: nats://localhost:4222
          # This re-runs ./pkg/bus/..., which includes kafka_integration_test.go —
          # without this it would silently skip under the redis-tagged build too.
          TEST_KAFKA_BROKERS: localhost:9092
        run: |
          go build -tags redis ./...
          go vet -tags redis ./...
          go test -tags redis -race ./services/webhook-ingest/... ./pkg/redisadapter/... ./pkg/bus/...

      - name: OMS log (on failure)
        if: failure()
        run: cat /tmp/oms.log || true

      - name: golangci-lint
        # v7 is REQUIRED for golangci-lint v2: v6 only knows the v1 module path
        # (.../cmd/golangci-lint), and v2 lives behind .../v2/cmd/golangci-lint. That
        # mismatch is exactly why `version: latest` on v6 silently pinned us to v1.
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          # goinstall builds golangci-lint with this job's Go 1.26 toolchain, so
          # its parser always understands the module's language version.
          install-mode: goinstall
          # PINNED, AND ON PURPOSE.
          #
          # This said `latest`, which is not a version — it is a promise that the gate
          # can change without a commit. Worse, the action installs the v1 module path
          # (github.com/golangci/golangci-lint/cmd/golangci-lint), and v2 lives behind a
          # /v2 path — so `latest` silently resolved to the last v1 release FOREVER. The
          # gate was running a legacy major nobody chose, and a developer who installed
          # the actual latest locally got a different answer on identical code: 42 issues
          # against CI's 1.
          #
          # Pinned to v2, with the rules written down in kanz/.golangci.yml. Local and CI
          # now agree, and moving the gate is a reviewable change.
          version: v2.12.2
          working-directory: kanz
          args: --timeout=5m

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # The kanz-py tests import the generated Python schema SDK, which is not
      # committed (EVT-15a) and not yet published to an index (DEBT-01b). Rather
      # than buf + the remote python plugins (which would also drag in the Go
      # plugins to satisfy the full buf.gen.yaml), grpc_tools.protoc generates
      # the whole tree — messages, .pyi, AND the *_pb2_grpc.py service stubs.
      # That last one closes the gap where protoc-gen-python alone omits the
      # gRPC stub inference.v1 (PRED-08) needs; wiring it into the buf release
      # pipeline so the *published* SDK ships it stays a follow-up.
      - name: Install Python deps
        run: pip install grpcio-tools pytest pytest-asyncio nats-py aiokafka

      - name: Generate Python schema SDK
        run: |
          mkdir -p kanz-schemas/gen/python
          python -m grpc_tools.protoc \
            -I kanz-schemas/proto \
            --python_out=kanz-schemas/gen/python \
            --pyi_out=kanz-schemas/gen/python \
            --grpc_python_out=kanz-schemas/gen/python \
            $(find kanz-schemas/proto -name '*.proto')

      # pb2 modules are PEP-420 namespace packages (no __init__.py), so both the
      # SDK root and the package root go on PYTHONPATH. Integration tests
      # (test_*_integration.py) skip without live NATS/Kafka.
      - name: Test
        env:
          PYTHONPATH: ${{ github.workspace }}/kanz-schemas/gen/python:${{ github.workspace }}/kanz-py
        run: pytest kanz-py/tests -q

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: 1.69.0
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # TS-only generation template (Protobuf-ES) — avoids needing the Go
      # plugins the full buf.gen.yaml lists. Mirrors the bufbuild/es version
      # pinned there; keep them in sync.
      - name: Generate TypeScript schema SDK
        working-directory: kanz-schemas
        run: |
          cat > /tmp/buf.gen.ts.yaml <<'EOF'
          version: v2
          plugins:
            - remote: buf.build/bufbuild/es:v2.10.0
              out: gen/ts
              opt: target=js+dts
          EOF
          buf generate --template /tmp/buf.gen.ts.yaml
          # Make gen/ts an installable @kanz-eng/kanz-schemas package.
          cp packaging/ts/package.json gen/ts/package.json
          node -e "const fs=require('fs');const p='gen/ts/package.json';const j=JSON.parse(fs.readFileSync(p));j.version='0.1.0';fs.writeFileSync(p,JSON.stringify(j,null,2));"

      # Give the generated package its OWN node_modules.
      #
      # gen/ts/package.json declares @bufbuild/protobuf, and the consumer installs the
      # package with `file:` — which npm links as a SYMLINK. Node's ESM resolver then
      # resolves the REAL path, so it looks for node_modules starting at
      # kanz-schemas/gen/ts/… and walks UP — never reaching kanz/ts/kanz-bus/node_modules
      # where npm hoisted the dependency. Every import of the SDK died with
      # ERR_MODULE_NOT_FOUND: Cannot find package '@bufbuild/protobuf'.
      #
      # Installing inside gen/ts puts the dep where that upward walk will actually find
      # it. (This is the same class of failure a published SDK would not have — when
      # PARITY-07 publishes it for real, it installs as a normal copied package and the
      # hoist works. Until then, it is a symlink, and symlinks resolve differently.)
      - name: Install the generated SDK's dependencies
        working-directory: kanz-schemas/gen/ts
        run: npm install --omit=dev --no-audit --no-fund

      # The @kanz-eng/kanz-schemas dep isn't published (DEBT-01b); repoint it at
      # the freshly generated local package so npm resolves it from disk, not the
      # registry. The package.json edit is ephemeral (CI only).
      - name: Test
        working-directory: kanz/ts/kanz-bus
        run: |
          npm pkg set dependencies.@kanz-eng/kanz-schemas="file:../../../kanz-schemas/gen/ts"
          npm install
          npm test

  # DEBT-01d SDK-hygiene guard (PARITY-07a). First check is always-on: the SDKs
  # are generated and published, never committed (EVT-15a), so any tracked
  # generated file fails CI. Second check is DORMANT until the published SDK
  # exists (PARITY-07b/c): setting the repo variable KANZ_SDK_PUBLISHED=true
  # (done in PARITY-07d, when the `replace` directives are deleted) arms it, and
  # from then on any surviving local kanz-schemas replace fails CI so the module
  # stays pinned to published releases.
  sdk-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: No committed generated SDK files
        run: |
          set -euo pipefail
          tracked=$(git ls-files -- 'kanz-schemas/gen' '*.pb.go' '*_pb2.py' '*_pb2_grpc.py' '*_pb2.pyi' '*_pb.js' '*_pb.d.ts')
          if [ -n "$tracked" ]; then
            printf '::error::generated SDK files are committed (EVT-15a: generated code is published, never committed):\n%s\n' "$tracked"
            exit 1
          fi
      - name: No local replace once the SDK is published
        if: vars.KANZ_SDK_PUBLISHED == 'true'
        run: |
          set -euo pipefail
          # Catches single-line and block-form replace directives.
          if grep -En '=>.*kanz-schemas' kanz/go.mod; then
            echo '::error file=kanz/go.mod::local kanz-schemas replace survives after SDK publication — pin the published kanz-schemas-go (DEBT-01c)'
            exit 1
          fi

  buf-breaking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history so buf can resolve the main baseline for `breaking`.
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: 1.69.0
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint
        working-directory: kanz-schemas
        run: buf lint
      # Compares kanz-schemas/proto against its state on main. A no-op (passes)
      # when a PR touches no proto; on a proto PR it fails any wire-incompatible
      # change, enforcing the additive-only envelope discipline (EVT-21c).
      - name: Breaking-change check
        working-directory: kanz-schemas
        run: buf breaking --against '../.git#branch=main,subdir=kanz-schemas'

# kanz monorepo CI — the Go safety net for the `kanz` module (CICD-01a).
#
# The module depends on the kanz-schemas Go SDK via a local `replace` directive
# (kanz/go.mod → ../kanz-schemas/gen/go). That SDK is generated, never
# committed (EVT-15a), so every job must `buf generate` it first — including
# protoc-gen-go-grpc, which emits the inference.v1 gRPC stubs (PRED-06) that
# protoc-gen-go alone does not. GOFLAGS=-mod=mod lets the toolchain resolve and
# checksum the freshly generated local module.
#
# CICD-01b adds the Python (kanz-py, pytest) + TypeScript (kanz/ts, node:test
# via tsx — the runner the package actually uses; "vitest" in the task is loose
# shorthand) jobs plus a `buf lint`+`buf breaking` schema gate.
name: kanz-ci

on:
  pull_request:
    paths:
      - 'kanz/**'
      - 'kanz-py/**'
      - 'kanz-web/**'
      - 'kanz-schemas/proto/**'
      - 'kanz-schemas/buf.yaml'
      - 'kanz-schemas/buf.gen.yaml'
      # sdk-guard: a committed generated tree must trigger the run that rejects it.
      - 'kanz-schemas/gen/**'
      - '.github/workflows/kanz-ci.yml'
  push:
    branches: [main]
    # DOCS DO NOT BUILD IMAGES.
    #
    # The pull_request trigger above is already path-filtered; this one was not, so a
    # commit touching only markdown ran the full matrix — for kanz-build, that is 19
    # Docker image builds to record that a board item moved. On a private repo billing per
    # minute, that is real money for zero signal.
    #
    # paths-ignore only skips a push when EVERY changed file matches, so a commit mixing
    # docs and code still runs the gate.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'

permissions:
  contents: read

env:
  # Required: the kanz-schemas-go dependency is a local `replace`, so the build
  # must be allowed to update go.mod/go.sum for it rather than failing readonly.
  GOFLAGS: -mod=mod

jobs:
  go:
    runs-on: ubuntu-latest
    # A live Postgres for the durable-store integration suites. Without it every
    # test gated on TEST_POSTGRES_URL silently SKIPS — including EXEC-M7c's
    # TestPostgresCreateIsAtomicAdmissionGate, the only automated proof that the
    # OMS admission gate holds across pods. That test is what makes
    # infra/deploy/oms-deploy.yaml's `replicas: 2` safe rather than a double-trade,
    # so a green pipeline that skipped it is not a green pipeline.
    services:
      # EXEC-M22 — webhook-ingest's cross-pod nonce store. The `redis` build tag was
      # NEVER COMPILED by this pipeline, so nonces_redis.go and pkg/redisadapter were
      # dead code as far as CI was concerned — and they are what makes the platform's
      # ENTRANCE safe to run on more than one pod. A real Redis runs here now, and the
      # tagged build is compiled, vetted and tested against it.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kanz
          POSTGRES_PASSWORD: kanz
          POSTGRES_DB: kanz
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # The suites must connect as a NON-SUPERUSER. Postgres bypasses row-level
      # security for superusers, so the MT-01d tenant-isolation tests detect that
      # and skip (persist/postgres_test.go: "RLS is bypassed for superusers").
      # Running as the superuser would mean a green pipeline that never once
      # verified that one tenant cannot read another's rows. `kanzapp` owns its
      # database, so it can run the migrations' DDL while FORCE RLS still applies
      # to it — the same posture the services run under in production.
      - name: Provision non-superuser DB role (so RLS is enforced, not bypassed)
        env:
          PGPASSWORD: kanz
        run: |
          psql -h localhost -U kanz -d kanz -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE kanzapp LOGIN PASSWORD 'kanz' NOSUPERUSER;" \
            -c "CREATE DATABASE kanzapp OWNER kanzapp;"
          psql -h localhost -U kanz -d kanzapp -v ON_ERROR_STOP=1 \
            -c "GRANT ALL ON SCHEMA public TO kanzapp;"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Track the toolchain pinned in go.mod so CI never drifts from local.
          go-version-file: kanz/go.mod
          cache-dependency-path: kanz/go.sum

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: 1.69.0
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate kanz-schemas Go SDK
        working-directory: kanz-schemas
        run: |
          buf generate
          cd gen/go
          go mod init github.com/eighred/kanz/kanz-schemas-go || true
          # PIN the generated module's `go` directive to the CONSUMER's, instead
          # of letting `go mod init` stamp whatever toolchain happens to be
          # installed. Without this, a newer runner Go silently deletes kanz's
          # `toolchain` pin, and the SEC-M5 guard that protects it fails:
          #
          #   setup-go v7 reads go.mod's `toolchain` line (v5 read `go`), so it
          #   installs 1.26.5 not 1.26.1 → `go mod init` stamps `go 1.26.5` here
          #   → kanz `replace`s this module, so under GOFLAGS=-mod=mod Go raises
          #   kanz/go.mod's `go` to 1.26.5 to satisfy it → `toolchain go1.26.5`
          #   is no longer HIGHER than `go`, so Go deletes it as redundant.
          #
          # The failure is a rewrite of a TRACKED file mid-run, which is why it
          # looked like a phantom: the committed go.mod has the directive and
          # the tested one does not. Reproduced end to end locally.
          go mod edit -go="$(awk '/^go [0-9]/{print $2; exit}' ../../../kanz/go.mod)"
          go mod tidy

      - name: Build
        working-directory: kanz
        run: go build ./...

      - name: Vet
        working-directory: kanz
        run: go vet ./...

      # ./... includes the arch (test/arch) + contract (test/contract) suites —
      # they are ordinary, untagged _test.go files. -race needs cgo (default-on
      # on ubuntu runners).
      #
      # TEST_POSTGRES_URL points at the non-superuser role above, so the durable
      # -store suites RUN here instead of skipping — the order-store admission
      # gate and the RLS tenant-isolation tests included.
      # The real-bus guards are worthless if they never run, and until now they
      # never did: CI provisioned Postgres but no broker, so TEST_NATS_URL was
      # unset and EVERY NATS integration test silently skipped — including the
      # EXEC-M7a guard, which exists precisely because a fake Publisher cannot fail
      # the way a broker fails, and the EXEC-M8 venue publish-health test, which is
      # the capital control that stops an adapter trading while nobody records it.
      #
      # A service container cannot pass the `-js` arg the image needs, so JetStream
      # is started as a step.
      - name: Start NATS (JetStream)
        run: |
          # -c nats-dev.conf, not bare -js: MT-02 (#358/#360) publishes orders on
          # tenant.<t>.order.order.submit, and without the routing mappings in
          # that file they land on a subject nothing subscribes — the OMS goes
          # quiet and the M1 loop certification below fails with a publish that
          # reported success. Same config the local rig uses (test/backing/up.sh).
          docker run -d --name kanz-ci-nats -p 4222:4222             -v "$GITHUB_WORKSPACE/kanz/test/backing/nats-dev.conf":/etc/nats/nats-dev.conf:ro             nats:2 -c /etc/nats/nats-dev.conf
          for i in $(seq 1 30); do
            docker logs kanz-ci-nats 2>&1 | grep -q "Server is ready" && exit 0
            sleep 1
          done
          echo "NATS did not become ready"; docker logs kanz-ci-nats; exit 1

      # DATA-M1 (Task 7) — the archiver's and pkg/bus's TEST_KAFKA_BROKERS-gated
      # integration tests had never run in CI: no Kafka existed here to point them
      # at, so they silently skipped on every run since the day they were written.
      # That is exactly the shape of the gap `-tags redis` sat in before EXEC-M22 —
      # a real guard that compiled clean and never once executed.
      #
      # A `services:` container cannot work for this image: it needs a FULL
      # single-node KRaft env set (partial env — e.g. only
      # KAFKA_AUTO_CREATE_TOPICS_ENABLE — switches the entrypoint from "use the
      # baked-in server.properties" to "assemble config purely from env" and it
      # then fails looking for zookeeper.connect). Started as a step, exactly like
      # NATS above, with the exact env this workflow's own archiver Task 5 proved
      # boots clean (see .superpowers/sdd/task-5-report.md). No `-js`-equivalent
      # flag is needed here, only env, but the boot-and-poll shape matches NATS's
      # for the same reason: neither image's readiness is visible to Docker's own
      # health-check without a broker-specific probe this workflow doesn't need.
      - name: Start Kafka (single-node KRaft)
        run: |
          docker run -d --name kanz-ci-kafka -p 9092:9092 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            -e KAFKA_AUTO_CREATE_TOPICS_ENABLE=false \
            apache/kafka:3.9.0
          for i in $(seq 1 60); do
            docker logs kanz-ci-kafka 2>&1 | grep -q "Kafka Server started" && exit 0
            sleep 2
          done
          echo "Kafka did not become ready"; docker logs kanz-ci-kafka; exit 1

      # Bootstrap the spine with THE SCRIPT PRODUCTION APPLIES — extracted from the
      # very ConfigMap infra/nats/bootstrap-job.yaml ships. A copy of the stream
      # list here would drift from that one, and the drift is invisible until a
      # service meets a real broker and finds its subject unbound: a JetStream
      # publish to an unbound subject is a hard failure, and a CONSUMER on one 404s
      # and takes the service's whole consumer group down with it. Both have already
      # happened here (EXEC-M7a, EXEC-M9). NATS_REPLICAS=1 because CI is one node.
      - name: Bootstrap the NATS topology (the script production applies)
        run: |
          awk '/^  bootstrap\.sh: \|/{f=1;next} f&&/^---/{exit} f{sub(/^    /,"");print}' \
            kanz/infra/nats/bootstrap-job.yaml > /tmp/bootstrap.sh
          test -s /tmp/bootstrap.sh || { echo "could not extract bootstrap.sh from the ConfigMap"; exit 1; }
          docker run --rm -i --network host \
            -e NATS_URL=nats://localhost:4222 -e NATS_REPLICAS=1 \
            natsio/nats-box:0.14.5 sh -s < /tmp/bootstrap.sh

      # The M1 loop certification (webhook-ingest's TestIntegration_LoopOverNATS)
      # drives a real SubmitOrder onto the real spine and asserts the OMS's
      # OrderFilled FACTs come back. It needs an OMS ON THE BUS, and it has never
      # had one — so it has never run anywhere but a developer's laptop, and the
      # first time it was run it failed for three separate production reasons.
      #
      # OMS_SIM_VENUE_MIC takes both MICs the allocation fans out to: the router
      # matches a leg to the venue whose MIC equals the leg's target, so a
      # single-venue simulator cannot work a multi-venue allocation at all.
      - name: Start the OMS on the bus (for the M1 loop certification)
        working-directory: kanz
        env:
          KANZ_MIGRATE_DATABASE_URL: postgres://kanzapp:kanz@localhost:5432/kanzapp?sslmode=disable
        run: |
          go run ./cmd/kanz-migrate --dir services/oms/migrations
          go build -o /tmp/oms ./services/oms/cmd/oms
          OMS_NATS_URL=nats://localhost:4222 \
          OMS_DATABASE_URL='postgres://kanzapp:kanz@localhost:5432/kanzapp?sslmode=disable' \
          OMS_TENANT=__system__ \
          OMS_SIM_VENUE_MIC=XNAS,XLON \
          /tmp/oms > /tmp/oms.log 2>&1 &
          for i in $(seq 1 30); do
            grep -q '"msg":"oms subscribing"' /tmp/oms.log && exit 0
            sleep 1
          done
          echo "the OMS never subscribed:"; cat /tmp/oms.log; exit 1

      # TEST_KAFKA_BROKERS points at the KRaft broker started above. Until now this
      # was unset, so every Kafka-gated integration test silently skipped:
      # pkg/bus/kafka_integration_test.go (the bus's own real-broker guard),
      # tools/replay/reader_integration_test.go (replay against the durable log),
      # and — the payoff — services/archiver/internal/archive's four
      # TestArchiver_* tests: the ordering guarantee, the outage-loses-nothing
      # proof, the ack-before-produce red twin, and the unprovisioned-tenant NACK.
      # Those are DATA-M1's entire reason to exist; a green pipeline that never
      # ran them was not proof of anything.
      # SEC-M3a — THE PRODUCTION BROKER CONTRACT. Every NATS step above runs a
      # broker with NO TLS, and that is why nobody saw SEC-M3: infra/nats/nats.yaml
      # requires a client SVID (`tls { verify: true, verify_and_map: true }`), and
      # not one bus.DialNATS call site in the repository set TLSConfig — so the
      # whole platform, kanz-halt included, was refused at the handshake by the
      # config it actually deploys, while CI stayed green against a broker
      # configured unlike production in the one dimension that decides whether a
      # connection is possible at all.
      #
      # This stands the REAL nats.conf + tenants.conf up (extracted from the
      # ConfigMaps production applies — the same stance as the bootstrap-script
      # extraction above; a copy would drift and the drift would be invisible).
      # It runs BESIDE the plaintext broker on its own port: the TEST_NATS_URL
      # suite proves bus SEMANTICS, this proves the production TRANSPORT, and
      # neither substitutes for the other. The script refuses to report success
      # unless the broker logs "TLS required for client connections" — a gate that
      # comes up without its gate armed proves nothing.
      # This also PROVISIONS THE TOPOLOGY, by running the bootstrap script
      # production applies (SEC-M3b) over mTLS as the bootstrap Job's own SVID.
      # That used to be a second step here, duplicating up.sh's extraction — two
      # copies of one procedure, and the CI copy provisioned as risk-engine's
      # SVID rather than nats-bootstrap's, so it proved that *a* client can create
      # streams rather than that the bootstrap identity can. The script now owns
      # it, which also means a laptop and CI stand up the SAME broker: a harness
      # that only produces a working spine under CI is a harness nobody can
      # reproduce a failure with. It refuses to report success unless every stream
      # the script declares is present, and unless the broker logged "TLS required
      # for client connections" — a broker that comes up without its gate armed
      # proves nothing.
      - name: Start NATS (mTLS — the broker config production applies, and its topology)
        run: kanz/test/mtls/up.sh /tmp/kanz-mtls 4223

      # test/arch/rig_dev_posture_test.go shells out to `python3
      # tools/rig_dev_patch.py <manifest>` and parses its stdout as YAML — it
      # proves the digest -> :latest rewrite by running the real patcher, not
      # by reading its source. The patcher needs a real Python 3 with PyYAML;
      # this runner has neither by default (only the separate `python` job
      # below sets one up), and tools/rig-apply.sh already hard-requires
      # python3 for the same script, so the test refuses to skip when it is
      # missing — it would rather fail loudly here than pass having asserted
      # nothing.
      - name: Set up Python (PyYAML for tools/rig_dev_patch.py, exercised by test/arch)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Test (race) — incl. arch + contract + Postgres + real-bus + M1 loop
        working-directory: kanz
        env:
          TEST_POSTGRES_URL: postgres://kanzapp:kanz@localhost:5432/kanzapp?sslmode=disable
          TEST_NATS_URL: nats://localhost:4222
          TEST_KAFKA_BROKERS: localhost:9092
          TEST_OMS_ON_BUS: "1"
          # Both are required by the mTLS suite; a test that gated on one alone
          # would FAIL rather than skip when the other went missing.
          TEST_NATS_MTLS_URL: nats://localhost:4223
          TEST_NATS_MTLS_CERT_DIR: /tmp/kanz-mtls
        # -p 1 IS REQUIRED, NOT A THROUGHPUT PREFERENCE. Every Postgres-gated
        # package shares ONE database (TEST_POSTGRES_URL above, a single
        # `kanzapp`), and Go's default -p runs packages in parallel. CLAUDE.md
        # has said "run go test -p 1 ./..." for exactly this reason; this step
        # did not, and the failure it produced is a good illustration of why the
        # collision is not obvious:
        #
        #   services/alternatives/migrations/0002_tenant_scope_required.sql does
        #   not name the tables it hardens. It DISCOVERS them —
        #   `pg_class WHERE c.relrowsecurity AND n.nspname = current_schema()` —
        #   so run against a shared schema it reaches straight across service
        #   boundaries and starts applying policies to accounting's tables. When
        #   accounting's own test tore down `ledger_snapshots` between that
        #   SELECT and the CREATE POLICY, alternatives failed with
        #   `relation "ledger_snapshots" does not exist`, naming a table it has
        #   nothing to do with.
        #
        # The symptom is therefore both cross-service and INTERMITTENT — it
        # depends on which packages happen to overlap — which is the worst shape
        # for a signal people are supposed to trust. Do not remove -p 1 to make
        # this step faster; the correct way to buy back that time is to give
        # each package its own database, and until that exists this flag is the
        # only thing keeping the suite deterministic.
        # -v BECAUSE A SKIP AND A PASS LOOK IDENTICAL WITHOUT IT.
        #
        # Plain `go test` prints `ok <pkg> 1.8s` for a package whose gated tests
        # ALL skipped. CLAUDE.md names the trap — "TEST_POSTGRES_URL unset ⇒ 14
        # test files skip silently" — and this step is where it would bite: the
        # env block above is the only thing making those 52 gates run, and if a
        # variable were dropped, renamed, or a helper changed, every one of them
        # would skip and this job would stay green.
        #
        # That is not hypothetical. Three times in one session a Postgres-gated
        # claim could not be confirmed from a green run, because `ok` cannot
        # distinguish "ran" from "skipped". -v puts the SKIP lines and their
        # reasons in the log; the step below turns them into a failure.
        #
        # -v RATHER THAN -json, deliberately: -json would need rendering back to
        # text for a human to read the log, which means a jq dependency in the
        # one job that must never fail for its own reasons. -p 1 already runs
        # packages sequentially, so -v output cannot interleave.
        run: |
          set -euo pipefail
          go test -race -p 1 -v ./... | tee "$RUNNER_TEMP/gotest.txt"

      # A SKIP CITING A BACKING SERVICE THIS JOB PROVIDES IS A FAILURE.
      #
      # Every variable below is set in the env block above, so there is no
      # legitimate reason for a test to skip citing one — including the mTLS
      # pair, which this job also provides. There is deliberately NO exemption
      # list: an exemption here would be a test opting out of the only thing
      # that proves it ran.
      #
      # if: always() so it still reports when the suite failed for another
      # reason — a skipped gate is worth knowing about on a red run too.
      - name: Refuse a silently skipped backing-service test
        if: always()
        working-directory: kanz
        run: |
          set -euo pipefail
          render="$RUNNER_TEMP/gotest.txt"
          if [ ! -s "$render" ]; then
            echo "::error::no suite output at $render — the Test step did not run, so this check proved nothing"
            exit 1
          fi
          # -A3 keeps the SKIP line together with the indented reason beneath it,
          # so a bare mention of a variable elsewhere in the log is not a match.
          offenders="$(grep -A3 -- '--- SKIP' "$render" \
            | grep -E 'TEST_(POSTGRES_URL|NATS_URL|KAFKA_BROKERS|REDIS_URL|NATS_MTLS_URL|NATS_MTLS_CERT_DIR)' || true)"
          if [ -n "$offenders" ]; then
            echo "::error::a test skipped citing a backing service this job provides — it did not run, and the suite was green anyway"
            echo "$offenders"
            echo
            echo "Every one of those variables is set in the Test step's env block."
            echo "A skip means the gate stopped seeing it: a renamed variable, a"
            echo "changed helper, or a service container that failed to come up."
            exit 1
          fi
          printf 'no backing-service test skipped; %d SKIP line(s) total, all for other reasons\n' \
            "$(grep -c -- '--- SKIP' "$render" || true)"

      # THE `redis` BUILD (EXEC-M22). This tag is what webhook-ingest's production image is
      # built with, and it is the ONLY thing that makes `replicas: 2` on the platform's
      # entrance safe rather than a double-trade machine. It was never compiled here, so a
      # break in nonces_redis.go or pkg/redisadapter would have shipped silently — and the
      # only test that touched RedisNonces drove it against a FAKE, which cannot prove that
      # ClaimNX is really an atomic SET NX PX.
      #
      # Built, vetted and tested against a REAL Redis, so the tag cannot rot back into dead
      # code the next time someone changes the adapter.
      # THE `anthropic` TAG (AI-M1). copilot's PRODUCTION IMAGE is built with it
      # (build.yml), and this pipeline never vetted, tested or linted it — the same hole
      # `-tags redis` sat in until EXEC-M22, and the same hole that let the entire AI layer
      # rot: code that ships but is never exercised by any check on this repository.
      #
      # There is no provider credential here and there does not need to be: compiling and
      # vetting the tags is what catches the break. A model call is not what rots — the
      # adapter around it is.
      #
      # NOW BOTH TAGS, AND NOW WITH `go test` (#179). Two changes, each for its own
      # reason:
      #
      #   openrouter joined because the production image links it (copilot/Dockerfile)
      #   and a tag that ships without being compiled here is precisely the hole this
      #   step exists to close — the one the anthropic adapter already rotted in once.
      #
      #   `go test` joined because the openrouter adapter HAS tests behind its tag and
      #   build+vet would never run them. They are fully mocked — httptest fixtures, no
      #   key, no network — so unlike the redis step below this needs no service, and
      #   there is no reason not to run them. The anthropic tag has no tests of its own;
      #   including it here costs nothing and means adding one later is enough.
      - name: Build + vet + test the `anthropic,openrouter` tags
        working-directory: kanz
        run: |
          go build -tags anthropic,openrouter ./...
          go vet -tags anthropic,openrouter ./services/copilot/...
          go test -tags anthropic,openrouter -p 1 ./services/copilot/...

      - name: Build + vet + test the `redis` tag (real Redis)
        working-directory: kanz
        env:
          TEST_REDIS_URL: redis://localhost:6379/0
          TEST_POSTGRES_URL: postgres://kanzapp:kanz@localhost:5432/kanzapp?sslmode=disable
          TEST_NATS_URL: nats://localhost:4222
          # This re-runs ./pkg/bus/..., which includes kafka_integration_test.go —
          # without this it would silently skip under the redis-tagged build too.
          TEST_KAFKA_BROKERS: localhost:9092
        # -p 1 FOR THE SAME REASON AS THE STEP ABOVE, AND IT WAS MISSING HERE (#239).
        # This step sets TEST_POSTGRES_URL against the SAME single `kanzapp` database,
        # and names THREE package trees — webhook-ingest and pkg/bus both reach it — so
        # Go's default -p ran them concurrently against one database. That is the exact
        # cross-package, intermittent collision the long comment above documents; the
        # rule was written there as prose and nothing carried it here.
        # test/arch/ci_test_parallelism_test.go now enforces it on every invocation.
        run: |
          go build -tags redis ./...
          go vet -tags redis ./...
          go test -tags redis -p 1 -race ./services/webhook-ingest/... ./pkg/redisadapter/... ./pkg/bus/...

      - name: OMS log (on failure)
        if: failure()
        run: cat /tmp/oms.log || true

      - name: golangci-lint
        # v7 is REQUIRED for golangci-lint v2: v6 only knows the v1 module path
        # (.../cmd/golangci-lint), and v2 lives behind .../v2/cmd/golangci-lint. That
        # mismatch is exactly why `version: latest` on v6 silently pinned us to v1.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # goinstall builds golangci-lint with this job's Go 1.26 toolchain, so
          # its parser always understands the module's language version.
          install-mode: goinstall
          # PINNED, AND ON PURPOSE.
          #
          # This said `latest`, which is not a version — it is a promise that the gate
          # can change without a commit. Worse, the action installs the v1 module path
          # (github.com/golangci/golangci-lint/cmd/golangci-lint), and v2 lives behind a
          # /v2 path — so `latest` silently resolved to the last v1 release FOREVER. The
          # gate was running a legacy major nobody chose, and a developer who installed
          # the actual latest locally got a different answer on identical code: 42 issues
          # against CI's 1.
          #
          # Pinned to v2, with the rules written down in kanz/.golangci.yml. Local and CI
          # now agree, and moving the gate is a reviewable change.
          version: v2.12.2
          working-directory: kanz
          args: --timeout=5m

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # The kanz-py tests import the generated Python schema SDK, which is not
      # committed (EVT-15a) and not yet published to an index (DEBT-01b). Rather
      # than buf + the remote python plugins (which would also drag in the Go
      # plugins to satisfy the full buf.gen.yaml), grpc_tools.protoc generates
      # the whole tree — messages, .pyi, AND the *_pb2_grpc.py service stubs.
      # That last one closes the gap where protoc-gen-python alone omits the
      # gRPC stub inference.v1 (PRED-08) needs; wiring it into the buf release
      # pipeline so the *published* SDK ships it stays a follow-up.
      # prometheus-client is a RUNTIME dependency, not a test one: kanz_inference's
      # servicer and streaming worker import kanz_inference.observability.metrics
      # at module scope (#241), so without it every kanz-py test that touches the
      # inference package fails at collection. It is unpinned here for the same
      # reason the rest of this line is — these are the TEST toolchain, and what
      # the image installs is kanz-py/requirements.txt, hash-pinned.
      # cryptography is TEST-ONLY and deliberately not in requirements.txt: it mints
      # the throwaway SVID-shaped certificates tests/test_bus_mtls.py completes real
      # TLS handshakes against (#241). Those handshakes are the only way to tell a
      # client context that VERIFIES the broker from one that merely encrypts —
      # asserting on ssl flags cannot. The image itself never needs it.
      - name: Install Python deps
        run: pip install grpcio-tools pytest pytest-asyncio nats-py aiokafka prometheus-client cryptography

      - name: Generate Python schema SDK
        run: |
          mkdir -p kanz-schemas/gen/python
          python -m grpc_tools.protoc \
            -I kanz-schemas/proto \
            --python_out=kanz-schemas/gen/python \
            --pyi_out=kanz-schemas/gen/python \
            --grpc_python_out=kanz-schemas/gen/python \
            $(find kanz-schemas/proto -name '*.proto')

      # pb2 modules are PEP-420 namespace packages (no __init__.py), so both the
      # SDK root and the package root go on PYTHONPATH. Integration tests
      # (test_*_integration.py) skip without live NATS/Kafka.
      - name: Test
        env:
          PYTHONPATH: ${{ github.workspace }}/kanz-schemas/gen/python:${{ github.workspace }}/kanz-py
        run: pytest kanz-py/tests -q

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read the version from .nvmrc rather than repeating it here, so CI and
          # a developer's local shell cannot drift apart — the file IS the pin.
          #
          # It says 24: Node 24 (Krypton) is the ACTIVE LTS, and Node 20 (Iron)
          # went end-of-life in April 2026 (last release v20.20.2, 2026-03-24),
          # so CI had been building on an unsupported runtime receiving no
          # security fixes. @types/node's major must move WITH it — the types
          # describe the runtime's API surface, and `tsc` is the only thing that
          # checks them (tsx strips types), so a types major ahead of the runtime
          # lets tsc accept an API that does not exist in production. That is why
          # dependabot.yml ignores @types/node majors.
          node-version-file: kanz/ts/kanz-bus/.nvmrc

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: 1.69.0
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # TS-only generation template (Protobuf-ES) — avoids needing the Go
      # plugins the full buf.gen.yaml lists. Mirrors the bufbuild/es version
      # pinned there; keep them in sync.
      - name: Generate TypeScript schema SDK
        working-directory: kanz-schemas
        run: |
          cat > /tmp/buf.gen.ts.yaml <<'EOF'
          version: v2
          plugins:
            - remote: buf.build/bufbuild/es:v2.10.0
              out: gen/ts
              opt: target=js+dts
          EOF
          buf generate --template /tmp/buf.gen.ts.yaml
          # Make gen/ts an installable @eighred/kanz-schemas package.
          cp packaging/ts/package.json gen/ts/package.json
          node -e "const fs=require('fs');const p='gen/ts/package.json';const j=JSON.parse(fs.readFileSync(p));j.version='0.1.0';fs.writeFileSync(p,JSON.stringify(j,null,2));"

      # Give the generated package its OWN node_modules.
      #
      # gen/ts/package.json declares @bufbuild/protobuf, and the consumer installs the
      # package with `file:` — which npm links as a SYMLINK. Node's ESM resolver then
      # resolves the REAL path, so it looks for node_modules starting at
      # kanz-schemas/gen/ts/… and walks UP — never reaching kanz/ts/kanz-bus/node_modules
      # where npm hoisted the dependency. Every import of the SDK died with
      # ERR_MODULE_NOT_FOUND: Cannot find package '@bufbuild/protobuf'.
      #
      # Installing inside gen/ts puts the dep where that upward walk will actually find
      # it. (This is the same class of failure a published SDK would not have — when
      # PARITY-07 publishes it for real, it installs as a normal copied package and the
      # hoist works. Until then, it is a symlink, and symlinks resolve differently.)
      - name: Install the generated SDK's dependencies
        working-directory: kanz-schemas/gen/ts
        run: npm install --omit=dev --no-audit --no-fund

      # The @eighred/kanz-schemas dep isn't published (DEBT-01b); repoint it at
      # the freshly generated local package so npm resolves it from disk, not the
      # registry. The package.json edit is ephemeral (CI only).
      - name: Install
        working-directory: kanz/ts/kanz-bus
        run: |
          npm pkg set dependencies.@eighred/kanz-schemas="file:../../../kanz-schemas/gen/ts"
          npm install

      # Typecheck, and it must run BEFORE the tests rather than instead of them.
      # `npm test` is `tsx --test`, and tsx is esbuild-based: it STRIPS types and
      # never checks them. So until this step existed the compiler never ran in
      # CI at all — a genuine type violation in kanz-bus, including one in the
      # .d.ts public surface other code consumes, kept every check green.
      # `tsc` is the only thing that reads tsconfig's strict/noUncheckedIndexedAccess.
      - name: Typecheck
        working-directory: kanz/ts/kanz-bus
        run: npm run build

      - name: Test
        working-directory: kanz/ts/kanz-bus
        run: npm test

  # THE OPERATOR SURFACE (#371). Nothing guarded kanz-web until this job: it was
  # absent from every workflow, and the paths filter above did not even list it,
  # so a pull request touching only the SPA ran NO checks whatsoever — a type
  # error or a broken build reached main unremarked.
  #
  # There is no linter step because the repository has no JS/TS linter anywhere;
  # the compiler is the quality gate, exactly as it is for kanz/ts/kanz-bus.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Its OWN .nvmrc, not kanz-bus's: two independently versioned
          # workspaces sharing one pin means bumping either one silently moves
          # the other's runtime.
          node-version-file: kanz-web/.nvmrc

      # npm ci, not npm install: the lockfile is tracked, and ci fails on a
      # lockfile that disagrees with package.json rather than quietly resolving
      # something the developer never ran.
      - name: Install
        working-directory: kanz-web
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: kanz-web
        run: npm run typecheck

      - name: Test
        working-directory: kanz-web
        run: npm test

      # Build LAST and separately, so a failure here is distinguishable from a
      # type error above — the BFF serves this output, and a bundle that does
      # not build is a blank operator surface.
      - name: Build
        working-directory: kanz-web
        run: npm run build

  # DEBT-01d SDK-hygiene guard (PARITY-07a). First check is always-on: the SDKs
  # are generated and published, never committed (EVT-15a), so any tracked
  # generated file fails CI. Second check is DORMANT until the published SDK
  # exists (PARITY-07b/c): setting the repo variable KANZ_SDK_PUBLISHED=true
  # (done in PARITY-07d, when the `replace` directives are deleted) arms it, and
  # from then on any surviving local kanz-schemas replace fails CI so the module
  # stays pinned to published releases.
  sdk-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: No committed generated SDK files
        run: |
          set -euo pipefail
          tracked=$(git ls-files -- 'kanz-schemas/gen' '*.pb.go' '*_pb2.py' '*_pb2_grpc.py' '*_pb2.pyi' '*_pb.js' '*_pb.d.ts')
          if [ -n "$tracked" ]; then
            printf '::error::generated SDK files are committed (EVT-15a: generated code is published, never committed):\n%s\n' "$tracked"
            exit 1
          fi
      - name: No local replace once the SDK is published
        if: vars.KANZ_SDK_PUBLISHED == 'true'
        run: |
          set -euo pipefail
          # Catches single-line and block-form replace directives.
          if grep -En '=>.*kanz-schemas' kanz/go.mod; then
            echo '::error file=kanz/go.mod::local kanz-schemas replace survives after SDK publication — pin the published kanz-schemas-go (DEBT-01c)'
            exit 1
          fi

  # THE SLO RULES HAD NEVER BEEN EXECUTED BY ANYTHING (#61).
  #
  # slo/ ships slo.recording.rules.yaml, slo.alerts.rules.yaml and a promtool
  # unit-test harness in slo_test.yaml that pins the burn-rate wiring — and every
  # reference to promtool in this repository was a COMMENT telling a human to run
  # it. Nothing in this workflow and nothing in the Makefile did. So the tests
  # that prove the error ratio is computed right and the budget join points at
  # the correct threshold had never run, in exactly the same way the metrics they
  # compute over had never been gathered.
  #
  # A test harness nobody executes is not a weaker test. It is a claim of
  # coverage with nothing behind it.
  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # PINNED BY VERSION AND SHA256. promtool ships as a release tarball, not an
      # action, so the SHA-pinning this workflow applies to actions does not
      # reach it — the checksum is the only thing making this download
      # reproducible, and a tarball fetched by tag alone is a supply-chain hole
      # of the same shape the mirror (#55) exists to close.
      #
      # The version matches the image infra/observability/prometheus.yaml
      # deploys, deliberately: the parser that validates the config here is then
      # the parser that loads it in the cluster. Validating with a different
      # version proves the config parses somewhere, not that it parses where it
      # runs. Bump both together.
      - name: Install promtool
        env:
          PROM_VERSION: 3.1.0
          PROM_SHA256: 9a9d1e115d1745826b13aec3f1409780b9fcf1d4206746cb4faee46ca5add70c
        run: |
          set -euo pipefail
          tarball="prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/${tarball}"
          echo "${PROM_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" --strip-components=1 "prometheus-${PROM_VERSION}.linux-amd64/promtool"
          sudo install -m 0755 promtool /usr/local/bin/promtool
          promtool --version

      # The scrape config lives INSIDE the ConfigMap so that `kubectl apply -f`
      # is self-sufficient for the whole manifest. Validating it means lifting it
      # back out. The extractor fails loudly if there is not exactly one such
      # ConfigMap: silently picking the first of several would validate a file
      # that is not the one deployed.
      # setup-python rather than the runner's system python: `pip install` into
      # the system interpreter is refused under PEP 668 on current runners. This
      # is the same pair of steps the `go` job already uses for PyYAML.
      - name: Set up Python (PyYAML, to lift the config out of the ConfigMap)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Extract the embedded prometheus.yml
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml
          docs = list(yaml.safe_load_all(open('kanz/infra/observability/prometheus.yaml')))
          cms = [d for d in docs
                 if d and d.get('kind') == 'ConfigMap' and 'prometheus.yml' in (d.get('data') or {})]
          if len(cms) != 1:
              raise SystemExit(
                  f'expected exactly one ConfigMap carrying prometheus.yml, found {len(cms)}')
          open('/tmp/prometheus.yml', 'w').write(cms[0]['data']['prometheus.yml'])
          PY

      # The rules are staged at the path the manifest mounts them on, so this
      # checks the config AS WRITTEN — including that the rules it loads parse —
      # rather than a copy with the paths rewritten to suit CI.
      #
      # NOTE what this does NOT catch: promtool accepts a rule_files glob that
      # matches nothing, so a renamed rule file would pass here while loading
      # zero rules in the cluster. That case is covered by
      # TestPrometheusConfigMatchesTheEstate in kanz/test/arch/, which compares
      # the glob against the files actually on disk. Neither check subsumes the
      # other.
      # Staged via apply-rules.sh --list, NOT a second glob. The cluster's rule
      # set comes from that script; a `cp slo/*.rules.yaml` here would validate a
      # DIFFERENT set, so a rule file outside slo/ would deploy unchecked while
      # this step stayed green (#230). One list, two consumers.
      - name: promtool check config and every rule file
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/prometheus/rules
          # `bash <script>`, not the script directly: the exec bit is a property of
          # the index, and a contributor on a filesystem that does not carry one
          # commits 100644 without noticing. That is not a hypothetical — the first
          # push of this step did exactly that.
          #
          # And the count is checked EXPLICITLY because `set -e` does not see a
          # failure inside a process substitution: when the script could not run,
          # mapfile simply produced an empty array and the step reported "staging 0
          # rule file(s)" and carried on. An empty rule set must be fatal here for
          # the same reason apply-rules.sh refuses to build an empty ConfigMap —
          # zero rules validate perfectly.
          mapfile -t rules < <(bash kanz/infra/observability/apply-rules.sh --list)
          if [ "${#rules[@]}" -eq 0 ]; then
            echo "::error::apply-rules.sh listed no rule files — nothing would be validated" >&2
            exit 1
          fi
          printf 'staging %d rule file(s)\n' "${#rules[@]}"
          printf '  %s\n' "${rules[@]}"
          sudo cp "${rules[@]}" /etc/prometheus/rules/
          # check rules on each file directly as well as through the config: the
          # config check loads them via the mount glob, which passes over a file
          # that failed to stage at all.
          promtool check rules "${rules[@]}"
          promtool check config /tmp/prometheus.yml

      # EVERY promtool HARNESS IN THE TREE, DISCOVERED — not named (#230).
      #
      # This step used to be `promtool test rules slo_test.yaml` with
      # working-directory pinned to slo/. That is the same shape as the rule-file
      # glob one step above: a hand-written list of what gets executed, which
      # silently omits anything added anywhere else. A second harness written
      # beside a new rules file would sit in the repository unrun, and an unrun
      # harness is a claim of coverage with nothing behind it — the defect #61
      # fixed here, which the #230 rules would have reproduced.
      #
      # So the harnesses are found, and each is run FROM ITS OWN DIRECTORY,
      # because a test file names its rule_files by RELATIVE path (both do) and
      # cannot resolve them from anywhere else.
      #
      # `promtool check rules` is not repeated here: the step above already
      # checks every *.rules.yaml apply-rules.sh lists, which is all of them.
      # This step is only about executing the tests.
      #
      # The count is fatal for the same reason it is fatal above — a `find` that
      # matches nothing produces a step that passes having tested nothing, which
      # is precisely the state this is here to end.
      # test/arch/observability_rules_reachable_test.go fails the build if this
      # goes back to naming files.
      - name: promtool test every rule harness
        run: |
          set -euo pipefail
          mapfile -t harnesses < <(find kanz/infra/observability -type f -name '*_test.yaml' | sort)
          if [ "${#harnesses[@]}" -eq 0 ]; then
            echo "::error::found no *_test.yaml under kanz/infra/observability — no alert rule is proven to fire" >&2
            exit 1
          fi
          printf 'running %d promtool harness(es)\n' "${#harnesses[@]}"
          for h in "${harnesses[@]}"; do
            printf '  %s\n' "$h"
            ( cd "$(dirname "$h")" && promtool test rules "$(basename "$h")" )
          done

  buf-breaking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # Full history so buf can resolve the main baseline for `breaking`.
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: 1.69.0
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint
        working-directory: kanz-schemas
        run: buf lint
      # Compares kanz-schemas/proto against its state on main. A no-op (passes)
      # when a PR touches no proto; on a proto PR it fails any wire-incompatible
      # change, enforcing the additive-only envelope discipline (EVT-21c).
      #
      # Resolve the baseline as `origin/main`, NOT `branch=main`. A PR checkout is
      # detached at refs/remotes/pull/N/merge and fetch-depth:0 populates only
      # refs/remotes/origin/*, so no LOCAL `main` branch exists and buf fails with
      # "fatal: couldn't find remote ref main" — on every PR, while still passing
      # on push-to-main (where checkout does create the local branch). That split
      # is why this guard was inert on exactly the changes it exists to gate.
      - name: Breaking-change check
        working-directory: kanz-schemas
        run: buf breaking --against '../.git#ref=origin/main,subdir=kanz-schemas'

# Security CI (SEC-02c/d/e). Three gates:
#   gitleaks              — secret scanning on every PR + push (SEC-02d)
#   secret-scan-selftest  — proves the gitleaks gate actually catches a secret (SEC-02e)
#   dependency-scan       — scheduled govulncheck + trivy fs over deps (SEC-02c)
# The remediation SLA for what these surface is SECURITY.md. Dependency UPDATE
# PRs come from .github/dependabot.yml; this workflow is the active detector.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC — weekly dependency scan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0 # full history so `git` scans every commit, not just the tip
      - name: gitleaks (secret scan)
        # PINNED, AND ON THE NON-DEPRECATED SUBCOMMAND (#155).
        #
        # This said `:latest` with `detect --source=/repo`. Both halves were a
        # problem, and the second is why the first mattered here more than
        # anywhere else. This is the one job whose SILENT SUCCESS IS
        # INDISTINGUISHABLE FROM A REAL PASS: a scanner that stops matching
        # still exits 0. An upstream release that removed `detect` would be
        # loud; one that changed default rules or allowlist semantics would be
        # quiet and permissive, and nothing in the repo would have moved.
        #
        # `detect` is not gone at v8.30.1 — it is `Hidden: true`, and its own
        # source file carries the migration table upstream wants read:
        #   OLD: gitleaks detect --source={repo}   NEW: gitleaks git {repo}
        # `--source` does NOT exist on `git`; the repo is positional. Staying on
        # a hidden alias means the gate's invocation and the tool's supported
        # surface drift apart silently, which is the same failure one level up.
        #
        # Moving this version is now a reviewable commit. Keep it in step with
        # gitleaks-planted-secret.sh, which must run the SAME build to prove it.
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --config=/repo/.gitleaks.toml --redact --no-banner --verbose

  secret-scan-selftest:
    # SEC-02e: a planted secret must be detected. Guards against a misconfigured
    # gitleaks (over-broad allowlist, broken rules) silently passing everything.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: planted-secret detection self-test
        run: sh kanz/infra/security/test/gitleaks-planted-secret.sh

  dependency-scan:
    # Heavy scans run on the weekly schedule + on demand, not on every PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: kanz/go.mod
          cache-dependency-path: kanz/go.sum
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: 1.69.0
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Generate kanz-schemas Go SDK
        working-directory: kanz-schemas
        run: |
          buf generate
          cd gen/go
          go mod init github.com/eighred/kanz/kanz-schemas-go || true
          go mod tidy
      # govulncheck is reachability-aware (flags a CVE only if the vulnerable
      # symbol is actually called) — the right Go gate, low false positives.
      #
      # PINNED (#155's argument, applied to the last unpinned tool in CI). This
      # said `@latest`, which is the same defect the container images had and one
      # the rest of this repository had already rejected: every other `go install`
      # across all seven workflows names an explicit version (protoc-gen-go
      # @v1.36.11, protoc-gen-go-grpc @v1.5.1), and #141 pinned golangci-lint for
      # exactly this reason — "latest is not a version, it is a promise that the
      # gate can change without a commit". 14 pinned installs, 1 floating, and the
      # floating one was a SECURITY gate.
      #
      # The failure mode is the vulnerability-scanner version of the gitleaks one:
      # a govulncheck that changes its database schema, its reachability analysis
      # or its exit-code behaviour under us either breaks the build loudly (fine)
      # or reports clean on something it no longer inspects (not fine, and
      # indistinguishable from a genuine pass).
      #
      # Moving this is now a reviewable commit. Bumping it deliberately is the
      # supported way to pick up new advisories — the vulnerability DATABASE is
      # fetched at run time and is not pinned by this, so pinning the binary does
      # not freeze the advisories it checks against.
      - name: govulncheck (Go)
        working-directory: kanz
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      # trivy fs covers the other ecosystems' lockfiles (npm, pip, go.sum) in one
      # pass. Fail on HIGH/CRITICAL with a fix available (the SECURITY.md SLA tiers).
      - name: trivy filesystem (deps)
        # 0.28.0 was deleted by the GHSA-69fq-xp46-6x23 compromise remediation
        # (attacker force-pushed most version tags to credential-stealing
        # malware; the original tags were then removed). <0.35.0 is the
        # advisory's affected range, so this is pinned to v0.36.0's commit.
        # Scanner binary pinned too: the malicious artifacts were binaries,
        # not the action itself.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          version: v0.72.0

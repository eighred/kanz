name: valkey-migration
on:
  pull_request:
    paths:
      - 'tools/valkey_migration/**'
      - 'tools/rig_dev_patch.py'
      - 'tools/rig-apply.sh'
      - 'tools/feed_identity/install.sh'
      - 'tools/feed_identity/proof.py'
      - 'tools/tokyo_messaging_proof/proof.py'
      - 'tools/tokyo_messaging_proof/bootstrap-labels.yaml'
      - 'kanz/infra/security/spire/crds/*.yaml'
      - 'kanz/infra/security/spire/namespaces.yaml'
      - 'kanz/infra/security/spire/rbac.yaml'
      - 'kanz/infra/security/spire/registration.yaml'
      - 'kanz/infra/security/spire/spire-agent.yaml'
      - 'kanz/infra/security/spire/spire-server.yaml'
      - 'kanz/infra/nats/namespace.yaml'
      - 'kanz/infra/nats/nats.yaml'
      - 'kanz/infra/nats/tenancy.yaml'
      - 'kanz/infra/nats/bootstrap-job.yaml'
      - 'kanz/infra/overlays/testnet_tokyo/data/nats-config-patch.yaml'
      - 'kanz/services/webhook_ingest/**'
      - 'kanz/services/api_gateway/**'
      - 'kanz/infra/deploy/identity-deploy.yaml'
      - 'kanz/infra/messaging/valkey-clients.yaml'
      - 'kanz/infra/deploy/rig-dev-secrets.yaml'
      - 'kanz/infra/deploy/api-gateway-deploy.yaml'
      - 'kanz/infra/deploy/webhook-ingest-deploy.yaml'
      - 'kanz/infra/messaging/redis.yaml'
      - 'kanz/infra/overlays/testnet_tokyo/data/kustomization.yaml'
      - 'kanz/test/backing/nats-dev.conf'
      - 'kanz/test/backing/valkey.sh'
      - 'kanz/test/backing/up.sh'
      - '.github/workflows/valkey-migration.yml'
  push:
    branches: [main]
    paths:
      - 'tools/valkey_migration/**'
      - 'tools/rig_dev_patch.py'
      - 'tools/rig-apply.sh'
      - 'tools/feed_identity/install.sh'
      - 'tools/feed_identity/proof.py'
      - 'tools/tokyo_messaging_proof/proof.py'
      - 'tools/tokyo_messaging_proof/bootstrap-labels.yaml'
      - 'kanz/infra/security/spire/crds/*.yaml'
      - 'kanz/infra/security/spire/namespaces.yaml'
      - 'kanz/infra/security/spire/rbac.yaml'
      - 'kanz/infra/security/spire/registration.yaml'
      - 'kanz/infra/security/spire/spire-agent.yaml'
      - 'kanz/infra/security/spire/spire-server.yaml'
      - 'kanz/infra/nats/namespace.yaml'
      - 'kanz/infra/nats/nats.yaml'
      - 'kanz/infra/nats/tenancy.yaml'
      - 'kanz/infra/nats/bootstrap-job.yaml'
      - 'kanz/infra/overlays/testnet_tokyo/data/nats-config-patch.yaml'
      - 'kanz/services/webhook_ingest/**'
      - 'kanz/services/api_gateway/**'
      - 'kanz/infra/deploy/identity-deploy.yaml'
      - 'kanz/infra/messaging/valkey-clients.yaml'
      - 'kanz/infra/deploy/rig-dev-secrets.yaml'
      - 'kanz/infra/deploy/api-gateway-deploy.yaml'
      - 'kanz/infra/deploy/webhook-ingest-deploy.yaml'
      - 'kanz/infra/messaging/redis.yaml'
      - 'kanz/infra/overlays/testnet_tokyo/data/kustomization.yaml'
      - 'kanz/test/backing/nats-dev.conf'
      - 'kanz/test/backing/valkey.sh'
      - 'kanz/test/backing/up.sh'
      - '.github/workflows/valkey-migration.yml'
  workflow_dispatch:
    inputs:
      qualification:
        description: Valkey fixture to run
        type: choice
        options: [retained-state, shared-risk]
        default: retained-state
      expected_sha:
        description: Full reviewed commit SHA for shared-risk
        type: string
permissions:
  contents: read
jobs:
  webhook-cache-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install PyYAML==6.0.3
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: kanz/go.mod
          cache: false
      - uses: ./.github/actions/setup_buf
        with:
          version: 1.69.0
      - name: Generate the Go SDK and build the webhook and gateway entry points
        shell: bash
        run: |
          set -euo pipefail
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          export PATH="$(go env GOPATH)/bin:$PATH"
          cd schemas
          python3 -c 'import yaml; t=yaml.safe_load(open("buf.gen.yaml")); t["plugins"]=[p for p in t["plugins"] if p.get("local") in ("protoc-gen-go","protoc-gen-go-grpc")]; assert len(t["plugins"]) == 2; print(yaml.safe_dump(t))' > "$RUNNER_TEMP/buf.gen.go.yaml"
          buf generate --template "$RUNNER_TEMP/buf.gen.go.yaml"
          bash bootstrap-go-sdk.sh
          cd ../kanz
          mkdir "$RUNNER_TEMP/valkey-webhook-build" "$RUNNER_TEMP/valkey-gateway-build"
          CGO_ENABLED=0 go build -trimpath -mod=readonly -buildvcs=false -tags redis -p 2 -o "$RUNNER_TEMP/valkey-webhook-build/webhook-ingest" ./services/webhook_ingest/cmd/webhook_ingest
          CGO_ENABLED=0 go build -trimpath -mod=readonly -buildvcs=false -tags redis -p 2 -o "$RUNNER_TEMP/valkey-gateway-build/api-gateway" ./services/api_gateway/cmd/api_gateway
      - run: bash tools/feed_identity/install.sh
      - run: python3 -B -m tools.valkey_migration.webhook
      - name: Exercise the default rig gateway with the isolated simulator broker
        run: python3 -B -m tools.valkey_migration.webhook --simulator-gateway
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: valkey-webhook
          path: |
            ${{ runner.temp }}/valkey-webhook.json
            ${{ runner.temp }}/valkey-simulator-gateway.json
          if-no-files-found: error
  rig-cache-ingress:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install PyYAML==6.0.3
      - run: bash tools/feed_identity/install.sh
      - run: python3 -B -m tools.valkey_migration.network
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rig-cache-ingress
          path: ${{ runner.temp }}/rig-cache-ingress.json
          if-no-files-found: error
  shared-risk:
    if: github.event_name == 'workflow_dispatch' && inputs.qualification == 'shared-risk'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      packages: read
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Bind the dispatch to the reviewed source
        run: '[[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_SHA" == "$EXPECTED_SHA" ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.dockerignore
            /kanz/
            /schemas/
            /tools/risk_shared_dedup_proof/
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-flags: --oci-worker-gc=true
          driver-opts: |
            image=ghcr.io/eighred/base/buildkit:buildx-stable-1
            memory=3500m
            memory-swap=3500m
            cpu-period=100000
            cpu-quota=200000
      - name: Build the canonical default and selected service images and fixture driver
        run: python3 -I -B tools/risk_shared_dedup_proof/fixture.py build
      - name: Verify shared dispatch, persisted state, outage and recovery
        timeout-minutes: 6
        run: python3 -I -B tools/risk_shared_dedup_proof/fixture.py run
  retained-state:
    if: github.event_name != 'workflow_dispatch' || inputs.qualification != 'shared-risk'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 -B -m unittest discover -s tools/valkey_migration -p 'test_*.py'
      - name: Qualify the local backing endpoint on a non-default port
        shell: bash
        run: |
          set -euo pipefail
          name="kanz-ci-redis-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          exports="$(REDIS_PORT=16379 bash kanz/test/backing/valkey.sh "$name")"
          id="$(docker inspect -f '{{.Id}}' "$name")"
          trap 'docker rm -fv "$id" >/dev/null' EXIT
          eval "$exports"
          test "$TEST_REDIS_URL" = 'redis://127.0.0.1:16379/0'
          test "$TEST_VALKEY_VERSION" = '9.1.3'
          image="$(docker inspect -f '{{.Image}}' "$id")"
          cli=(docker run --rm --network host "$image" valkey-cli --raw -u "$TEST_REDIS_URL")
          test "$("${cli[@]}" PING)" = PONG
          "${cli[@]}" INFO server | tr -d '\r' | grep -Fx "valkey_version:$TEST_VALKEY_VERSION"
          retry="${name}-retry"
          bash tools/valkey_migration/backing_collision.sh "$id" 16379 "$retry"
          docker rm -fv "$id"
          trap - EXIT
          exports="$(REDIS_PORT=16379 bash kanz/test/backing/valkey.sh "$retry")"
          id="$(docker inspect -f '{{.Id}}' "$retry")"
          trap 'docker rm -fv "$id" >/dev/null' EXIT
          eval "$exports"
          test "$("${cli[@]}" PING)" = PONG
      - name: Preserve replay claims through Valkey migration and Redis rollback
        run: python3 -B tools/valkey_migration/proof.py
      - name: Preserve sanitized migration evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: valkey-migration
          path: ${{ runner.temp }}/valkey-migration.json
          if-no-files-found: error

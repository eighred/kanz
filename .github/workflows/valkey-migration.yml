name: valkey-migration
on:
  pull_request:
    paths:
      - 'tools/valkey-migration/**'
      - '.github/workflows/valkey-migration.yml'
  push:
    branches: [main]
    paths:
      - 'tools/valkey-migration/**'
      - '.github/workflows/valkey-migration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retained-state:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python3 -B -m unittest discover -s tools/valkey-migration -p 'test_*.py'
      - name: Preserve replay claims through Valkey migration and Redis rollback
        run: python3 -B tools/valkey-migration/proof.py
      - name: Preserve sanitized migration evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: valkey-migration
          path: ${{ runner.temp }}/valkey-migration.json
          if-no-files-found: error

# DEVX-01d — build the per-PR images an Argo preview environment deploys.
#
# On a PR labeled `preview` (and each push to it), build + push the service
# images tagged :pr-{number} to GHCR. The Argo CD PullRequest generator
# (kanz/infra/gitops/preview-applicationset.yaml) then syncs a namespace
# kanz-preview-{number} pinned to those images + the PR's head commit. Teardown
# is automatic: closing the PR drops the Argo Application (prune), so this
# workflow only builds — it never has to clean up.
name: preview

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  build-images:
    # Only run for the `preview` label (the gate the ApplicationSet also filters on).
    if: contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [risk-engine, api-gateway]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: 1.69.0
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: Generate schema SDK
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          cd kanz-schemas && buf generate

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: kanz/services/${{ matrix.service }}/Dockerfile
          # A preview image must not claim to be a release. The SHA is what it is
          # (#143) — an unstamped preview would report "unstamped" instead.
          build-args: |
            VERSION=${{ github.sha }}
          push: true
          tags: ghcr.io/eighred/${{ matrix.service }}:pr-${{ github.event.pull_request.number }}

  comment:
    needs: build-images
    if: contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    steps:
      - name: Comment the preview namespace
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const ns = `kanz-preview-${context.issue.number}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: `🚀 Preview environment building → namespace \`${ns}\` (Argo CD syncs it once the images are pushed).`,
            });

name: rust-oms-fold

on:
  pull_request:
    paths:
      - 'kanz-rs/**'
      - 'kanz-schemas/proto/**'
      - 'kanz/internal/dec/**'
      - 'kanz/internal/shadowprocess/**'
      - 'kanz/services/oms/**'
      - 'kanz/test/arch/**'
      - '.github/scripts/*migration_evidence.py'
      - '.github/scripts/check_oms_fold_evidence.py'
      - '.github/scripts/test_check_oms_fold_evidence.py'
      - '.github/scripts/check_oms_recovery_evidence.py'
      - '.github/scripts/test_check_oms_recovery_evidence.py'
      - '.github/workflows/rust-oms-fold.yml'
  push:
    branches: [main]
    paths:
      - 'kanz-rs/**'
      - 'kanz-schemas/proto/**'
      - 'kanz/internal/dec/**'
      - 'kanz/internal/shadowprocess/**'
      - 'kanz/services/oms/**'
      - 'kanz/test/arch/**'
      - '.github/scripts/*migration_evidence.py'
      - '.github/scripts/check_oms_fold_evidence.py'
      - '.github/scripts/test_check_oms_fold_evidence.py'
      - '.github/scripts/check_oms_recovery_evidence.py'
      - '.github/scripts/test_check_oms_recovery_evidence.py'
      - '.github/workflows/rust-oms-fold.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GOFLAGS: -mod=mod

jobs:
  fill-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Official postgres:16-alpine OCI index, resolved 2026-11-05 (16.15).
        image: postgres:16-alpine@sha256:1fb72075a1de85a1d39de23c2da81baef1b71bf5c0b61a14cbbfdb072a6246d9
        env:
          POSTGRES_USER: kanz
          POSTGRES_PASSWORD: kanz
          POSTGRES_DB: kanz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kanz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provision disposable non-bypass transaction owner
        env:
          PGPASSWORD: kanz
        run: |
          psql -h localhost -U kanz -d kanz -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE kanzapp LOGIN PASSWORD 'kanz' NOSUPERUSER NOBYPASSRLS;" \
            -c "CREATE DATABASE kanzapp OWNER kanzapp;"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: kanz/go.mod
          cache-dependency-path: kanz/go.sum
      - uses: ./.github/actions/setup-buf
        with:
          version: 1.69.0
      - name: Generate canonical Go contracts
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          export PATH="$(go env GOPATH)/bin:$PATH"
          make -C kanz generate
      - name: Build and verify the pinned Rust transition kernel
        working-directory: kanz-rs
        env:
          KANZ_BUILD_VERSION: ${{ github.sha }}
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          cargo fmt --all -- --check
          cargo test --locked -p kanz-order-core --all-targets
          cargo clippy --locked -p kanz-order-core --all-targets -- -D warnings
          cargo build --locked -p kanz-order-core --example order-aggregate-fixture
          cargo test --locked -p kanz-oms-fold-shadow
          cargo clippy --locked -p kanz-oms-fold-shadow --all-targets -- -D warnings
          cargo build --locked -p kanz-oms-fold-shadow
          cargo test --locked -p kanz-oms-store --all-targets
          cargo clippy --locked -p kanz-oms-store --all-targets -- -D warnings
          cargo build --locked -p kanz-oms-store --example fixture
          cargo test --locked -p kanz-proto-wire
          cargo test --locked -p kanz-oms-venue --all-targets
          cargo clippy --locked -p kanz-oms-venue --all-targets -- -D warnings
          cargo build --locked -p kanz-oms-venue --example oms-venue-fixture
      - name: Verify source boundaries and Go transition owners
        working-directory: kanz
        run: |
          go test -p 1 ./test/arch -run 'Test(Rust|Julia|BondCanonicalClone|EveryWorkflowGoTestIsSerialised|WorkflowGoTestMatcherDistinguishesCargo)' -count=1
          go test -p 1 ./internal/dec ./services/oms/internal/order ./services/oms/internal/config ./services/oms/cmd/oms -count=1
      - name: Start isolated pinned relay broker
        run: |
          docker run -d --name oms-relay-nats --memory=256m --cpus=1 --pids-limit=128 --read-only \
            --tmpfs /data:rw,noexec,nosuid,size=128m -p 127.0.0.1:4222:4222 \
            nats:2.12.6-alpine@sha256:1cfc36e2e5e638243d8c722f72c954cd0ec4b15ee82fadbc718ce12e2b3c1652 -js -sd /data
          for attempt in $(seq 1 30); do
            if (echo >/dev/tcp/127.0.0.1/4222) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Bootstrap canonical disposable position streams
        run: |
          set -euo pipefail
          awk '/^  bootstrap\.sh: \|/{f=1;next} f&&/^---/{exit} f{sub(/^    /,"");print}' \
            kanz/infra/nats/bootstrap-job.yaml > "$RUNNER_TEMP/oms-bootstrap.sh"
          test -s "$RUNNER_TEMP/oms-bootstrap.sh"
          docker run --rm -i --network host --memory=256m --cpus=1 --pids-limit=128 \
            -e NATS_URL=nats://127.0.0.1:4222 -e NATS_REPLICAS=1 \
            natsio/nats-box@sha256:ffce8bd103383f179f8c7f11cf645726acf5d17280706c530c3b342dbe16334c \
            sh -s < "$RUNNER_TEMP/oms-bootstrap.sh"
      - name: Compare actual stamped worker through the OMS supervisor
        working-directory: kanz
        env:
          KANZ_ORDER_AGGREGATE_BIN: ${{ github.workspace }}/kanz-rs/target/debug/examples/order-aggregate-fixture
          KANZ_ORDER_AGGREGATE_VERSION: ${{ github.sha }}
          KANZ_OMS_FOLD_BIN: ${{ github.workspace }}/kanz-rs/target/debug/kanz-oms-fold-shadow
          KANZ_OMS_FOLD_VERSION: ${{ github.sha }}
          KANZ_OMS_STORE_BIN: ${{ github.workspace }}/kanz-rs/target/debug/examples/fixture
          KANZ_OMS_STORE_VERSION: ${{ github.sha }}
          KANZ_OMS_VENUE_BIN: ${{ github.workspace }}/kanz-rs/target/debug/examples/oms-venue-fixture
          KANZ_OMS_VENUE_VERSION: ${{ github.sha }}
          TEST_POSTGRES_URL: postgres://kanzapp:kanz@localhost:5432/kanzapp?sslmode=disable
          TEST_NATS_URL: nats://127.0.0.1:4222
        run: |
          set -o pipefail
          go test -race -p 1 ./services/oms/tools/fill-conformance ./services/oms/internal/foldshadow ./internal/shadowprocess ./services/oms/internal/position ./services/oms/tools/store-conformance ./services/oms/tools/venue-conformance ./services/oms/tools/aggregate-conformance -count=1 -json | tee "$RUNNER_TEMP/oms-fold.jsonl"
          python3 -B -m unittest discover -s ../.github/scripts -p test_check_migration_evidence.py
          python3 -B -m unittest discover -s ../.github/scripts -p test_check_oms_fold_evidence.py
          python3 ../.github/scripts/check_oms_fold_evidence.py "$RUNNER_TEMP/oms-fold.jsonl"
      - name: Remove isolated relay broker
        if: always()
        run: docker rm -f oms-relay-nats
      - name: Preserve transition execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oms-fold-evidence
          path: ${{ runner.temp }}/oms-fold.jsonl
          if-no-files-found: warn

  recovery-coordinator:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: kanz/go.mod
          cache-dependency-path: kanz/go.sum
      - uses: ./.github/actions/setup-buf
        with:
          version: 1.69.0
      - name: Generate recovery canonical contracts
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          export PATH="$(go env GOPATH)/bin:$PATH"
          make -C kanz generate
      - name: Compile the actual recovery owner and fixture
        working-directory: kanz-rs
        env:
          KANZ_BUILD_VERSION: ${{ github.sha }}
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          cargo fmt --all -- --check
          cargo test --locked -p kanz-oms-recovery --all-targets
          cargo clippy --locked -p kanz-oms-recovery --all-targets -- -D warnings
          cargo build --release --locked -p kanz-oms-recovery --example recovery-coordinator-fixture
      - name: Verify recovery source and evidence guards
        working-directory: kanz
        run: |
          go test -p 1 ./test/arch -run 'Test(Rust|SyntheticIdentityCannotBecomeRuntimeAuthority|EveryWorkflowGoTestIsSerialised|WorkflowGoTestMatcherDistinguishesCargo)' -count=1
          python3 -B -m unittest discover -s ../.github/scripts -p test_check_oms_recovery_evidence.py
      - name: Start separate owned recovery dependencies
        run: |
          set -euo pipefail
          image=postgres:16-alpine@sha256:1fb72075a1de85a1d39de23c2da81baef1b71bf5c0b61a14cbbfdb072a6246d9
          # Keep every alias lock and one financial commit; capacity belongs only
          # to this disposable qualifier, never to production configuration.
          docker run -d --name oms-recovery-pg --label "kanz.fixture.run=$GITHUB_RUN_ID" --label "kanz.fixture.attempt=$GITHUB_RUN_ATTEMPT" \
            --memory=2g --cpus=1 --pids-limit=256 --shm-size=256m \
            --tmpfs /var/lib/postgresql/data:rw,nosuid,size=1g \
            -e POSTGRES_USER=fixture -e POSTGRES_PASSWORD=fixture -e POSTGRES_DB=fixture \
            -p 127.0.0.1:55432:5432 "$image" \
            -c max_locks_per_transaction=1024 -c max_connections=100 -c max_prepared_transactions=0
          docker run -d --name oms-recovery-default-pg --label "kanz.fixture.run=$GITHUB_RUN_ID" --label "kanz.fixture.attempt=$GITHUB_RUN_ATTEMPT" \
            --memory=1g --cpus=1 --pids-limit=256 --shm-size=128m \
            --tmpfs /var/lib/postgresql/data:rw,nosuid,size=512m \
            -e POSTGRES_USER=fixture -e POSTGRES_PASSWORD=fixture -e POSTGRES_DB=fixture \
            -p 127.0.0.1:55433:5432 "$image"
          docker run -d --name oms-recovery-constrained-pg --label "kanz.fixture.run=$GITHUB_RUN_ID" --label "kanz.fixture.attempt=$GITHUB_RUN_ATTEMPT" \
            --memory=1g --cpus=1 --pids-limit=256 --shm-size=128m \
            --tmpfs /var/lib/postgresql/data:rw,nosuid,size=512m \
            -e POSTGRES_USER=fixture -e POSTGRES_PASSWORD=fixture -e POSTGRES_DB=fixture \
            -p 127.0.0.1:55434:5432 "$image" \
            -c max_locks_per_transaction=10 -c max_connections=100 -c max_prepared_transactions=0
          for container in oms-recovery-pg oms-recovery-default-pg oms-recovery-constrained-pg; do
            ready=false
            for attempt in $(seq 1 60); do
              # The image's temporary init server is Unix-only; server readiness
              # alone does not prove that the requested database exists yet.
              if test "$(docker exec -e PGPASSWORD=fixture -e PGCONNECT_TIMEOUT=2 -e 'PGOPTIONS=-c statement_timeout=2000' "$container" \
                psql -X -w -h 127.0.0.1 -U fixture -d fixture -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' 2>/dev/null)" = 1; then ready=true; break; fi
              sleep 1
            done
            test "$ready" = true
            docker exec -e PGPASSWORD=fixture -e PGCONNECT_TIMEOUT=2 "$container" psql -X -w -h 127.0.0.1 -U fixture -d fixture -v ON_ERROR_STOP=1 \
              -c "CREATE ROLE recoveryapp LOGIN PASSWORD 'fixture' NOSUPERUSER NOBYPASSRLS;" \
              -c "CREATE DATABASE recoveryapp OWNER recoveryapp;"
          done
          docker run -d --name oms-recovery-nats --label "kanz.fixture.run=$GITHUB_RUN_ID" --label "kanz.fixture.attempt=$GITHUB_RUN_ATTEMPT" \
            --memory=256m --cpus=1 --pids-limit=128 --read-only \
            --tmpfs /data:rw,noexec,nosuid,size=128m -p 127.0.0.1:44222:4222 \
            nats:2.12.6-alpine@sha256:1cfc36e2e5e638243d8c722f72c954cd0ec4b15ee82fadbc718ce12e2b3c1652 -js -sd /data
          ready=false
          for attempt in $(seq 1 30); do
            if (echo >/dev/tcp/127.0.0.1/44222) 2>/dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          awk '/^  bootstrap\.sh: \|/{f=1;next} f&&/^---/{exit} f{sub(/^    /,"");print}' \
            kanz/infra/nats/bootstrap-job.yaml > "$RUNNER_TEMP/recovery-bootstrap.sh"
          test -s "$RUNNER_TEMP/recovery-bootstrap.sh"
          docker run --rm -i --network host --memory=256m --cpus=1 --pids-limit=128 \
            -e NATS_URL=nats://127.0.0.1:44222 -e NATS_REPLICAS=1 \
            natsio/nats-box@sha256:ffce8bd103383f179f8c7f11cf645726acf5d17280706c530c3b342dbe16334c \
            sh -s < "$RUNNER_TEMP/recovery-bootstrap.sh"
      - name: Qualify actual recovery and complete large histories
        working-directory: kanz
        env:
          KANZ_OMS_RECOVERY_BIN: ${{ github.workspace }}/kanz-rs/target/release/examples/recovery-coordinator-fixture
          KANZ_OMS_RECOVERY_VERSION: ${{ github.sha }}
          TEST_POSTGRES_URL: postgres://recoveryapp:fixture@127.0.0.1:55432/recoveryapp?sslmode=disable
          TEST_POSTGRES_DEFAULT_LOCK_URL: postgres://recoveryapp:fixture@127.0.0.1:55433/recoveryapp?sslmode=disable
          TEST_POSTGRES_CONSTRAINED_LOCK_URL: postgres://recoveryapp:fixture@127.0.0.1:55434/recoveryapp?sslmode=disable
          TEST_NATS_URL: nats://127.0.0.1:44222
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oms-recovery-evidence"
          sha256sum "$KANZ_OMS_RECOVERY_BIN" | cut -d " " -f 1 > "$RUNNER_TEMP/oms-recovery-evidence/binary.sha256"
          qualification_status=0
          go test -race -p 1 ./services/oms/tools/recovery-conformance -skip '^TestRustRecoveryComplete8000History$' -timeout 20m -count=1 -json | tee "$RUNNER_TEMP/oms-recovery-evidence/recovery.jsonl" || qualification_status=1
          go test -race -p 1 ./services/oms/tools/recovery-conformance -run '^TestRustRecoveryComplete8000History/go$' -timeout 20m -count=1 -json | tee "$RUNNER_TEMP/oms-recovery-evidence/large-go.jsonl" || qualification_status=1
          go test -race -p 1 ./services/oms/tools/recovery-conformance -run '^TestRustRecoveryComplete8000History/rust$' -timeout 20m -count=1 -json | tee "$RUNNER_TEMP/oms-recovery-evidence/large-rust.jsonl" || qualification_status=1
          python3 ../.github/scripts/check_oms_recovery_evidence.py "$RUNNER_TEMP/oms-recovery-evidence" \
            --create --source "$GITHUB_SHA" --tree "$(git rev-parse HEAD^{tree})" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" || qualification_status=1
          exit "$qualification_status"
      - name: Remove only owned recovery dependencies
        if: always()
        run: |
          set -euo pipefail
          for container in oms-recovery-pg oms-recovery-default-pg oms-recovery-constrained-pg oms-recovery-nats; do
            found=$(docker ps -aq --filter "name=^/$container$")
            if test -z "$found"; then continue; fi
            test "$(docker inspect --format '{{ index .Config.Labels "kanz.fixture.run" }}' "$container")" = "$GITHUB_RUN_ID"
            test "$(docker inspect --format '{{ index .Config.Labels "kanz.fixture.attempt" }}' "$container")" = "$GITHUB_RUN_ATTEMPT"
            docker rm -f "$container"
            remaining=$(docker ps -aq --filter "name=^/$container$")
            test -z "$remaining"
          done
      - name: Preserve source-bound recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oms-recovery-evidence
          path: ${{ runner.temp }}/oms-recovery-evidence/
          if-no-files-found: warn

name: rust-oms-fold

on:
  pull_request:
    paths:
      - 'kanz-rs/**'
      - 'kanz-schemas/proto/**'
      - 'kanz/internal/dec/**'
      - 'kanz/internal/shadowprocess/**'
      - 'kanz/services/oms/**'
      - 'kanz/test/arch/**'
      - '.github/scripts/*migration_evidence.py'
      - '.github/scripts/check_oms_fold_evidence.py'
      - '.github/scripts/test_check_oms_fold_evidence.py'
      - '.github/workflows/rust-oms-fold.yml'
  push:
    branches: [main]
    paths:
      - 'kanz-rs/**'
      - 'kanz-schemas/proto/**'
      - 'kanz/internal/dec/**'
      - 'kanz/internal/shadowprocess/**'
      - 'kanz/services/oms/**'
      - 'kanz/test/arch/**'
      - '.github/scripts/*migration_evidence.py'
      - '.github/scripts/check_oms_fold_evidence.py'
      - '.github/scripts/test_check_oms_fold_evidence.py'
      - '.github/workflows/rust-oms-fold.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GOFLAGS: -mod=mod

jobs:
  fill-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Official postgres:16-alpine OCI index, resolved 2026-11-05 (16.15).
        image: postgres:16-alpine@sha256:1fb72075a1de85a1d39de23c2da81baef1b71bf5c0b61a14cbbfdb072a6246d9
        env:
          POSTGRES_USER: kanz
          POSTGRES_PASSWORD: kanz
          POSTGRES_DB: kanz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kanz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provision disposable non-bypass transaction owner
        env:
          PGPASSWORD: kanz
        run: |
          psql -h localhost -U kanz -d kanz -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE kanzapp LOGIN PASSWORD 'kanz' NOSUPERUSER NOBYPASSRLS;" \
            -c "CREATE DATABASE kanzapp OWNER kanzapp;"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: kanz/go.mod
          cache-dependency-path: kanz/go.sum
      - uses: ./.github/actions/setup-buf
        with:
          version: 1.69.0
      - name: Generate canonical Go contracts
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          export PATH="$(go env GOPATH)/bin:$PATH"
          make -C kanz generate
      - name: Build and verify the pinned Rust transition kernel
        working-directory: kanz-rs
        env:
          KANZ_BUILD_VERSION: ${{ github.sha }}
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          cargo fmt --all -- --check
          cargo test --locked -p kanz-oms-fold-shadow
          cargo clippy --locked -p kanz-oms-fold-shadow --all-targets -- -D warnings
          cargo build --locked -p kanz-oms-fold-shadow
          cargo test --locked -p kanz-oms-store --all-targets
          cargo clippy --locked -p kanz-oms-store --all-targets -- -D warnings
          cargo build --locked -p kanz-oms-store --example fixture
      - name: Verify source boundaries and Go transition owners
        working-directory: kanz
        run: |
          go test -p 1 ./test/arch -run 'Test(Rust|Julia|BondCanonicalClone|EveryWorkflowGoTestIsSerialised|WorkflowGoTestMatcherDistinguishesCargo)' -count=1
          go test -p 1 ./internal/dec ./services/oms/internal/order ./services/oms/internal/config ./services/oms/cmd/oms -count=1
      - name: Start isolated pinned relay broker
        run: |
          docker run -d --name oms-relay-nats --memory=256m --cpus=1 --pids-limit=128 --read-only \
            --tmpfs /data:rw,noexec,nosuid,size=128m -p 127.0.0.1:4222:4222 \
            nats:2.12.6-alpine@sha256:1cfc36e2e5e638243d8c722f72c954cd0ec4b15ee82fadbc718ce12e2b3c1652 -js -sd /data
          for attempt in $(seq 1 30); do
            if (echo >/dev/tcp/127.0.0.1/4222) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Compare actual stamped worker through the OMS supervisor
        working-directory: kanz
        env:
          KANZ_OMS_FOLD_BIN: ${{ github.workspace }}/kanz-rs/target/debug/kanz-oms-fold-shadow
          KANZ_OMS_FOLD_VERSION: ${{ github.sha }}
          KANZ_OMS_STORE_BIN: ${{ github.workspace }}/kanz-rs/target/debug/examples/fixture
          KANZ_OMS_STORE_VERSION: ${{ github.sha }}
          TEST_POSTGRES_URL: postgres://kanzapp:kanz@localhost:5432/kanzapp?sslmode=disable
          TEST_NATS_URL: nats://127.0.0.1:4222
        run: |
          set -o pipefail
          go test -race -p 1 ./services/oms/tools/fill-conformance ./services/oms/internal/foldshadow ./internal/shadowprocess ./services/oms/tools/store-conformance -count=1 -json | tee "$RUNNER_TEMP/oms-fold.jsonl"
          python3 -B -m unittest discover -s ../.github/scripts -p test_check_migration_evidence.py
          python3 -B -m unittest discover -s ../.github/scripts -p test_check_oms_fold_evidence.py
          python3 ../.github/scripts/check_oms_fold_evidence.py "$RUNNER_TEMP/oms-fold.jsonl"
      - name: Remove isolated relay broker
        if: always()
        run: docker rm -f oms-relay-nats
      - name: Preserve transition execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oms-fold-evidence
          path: ${{ runner.temp }}/oms-fold.jsonl
          if-no-files-found: warn

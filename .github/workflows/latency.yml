# LATENCY-01a — continuous load-test gate.
#
# Per-PR: bring up the ephemeral load stack (kanz/test/load/docker-compose.yml —
# NATS + risk-engine + api-gateway), seed one portfolio, and run a ~60s k6 smoke
# (smoke.js) that fails the pipeline on a LATENCY-01 p99/error-budget breach
# (config.js budgetThresholds). The full multi-minute capacity ramp (baseline.js)
# is a manual workflow_dispatch run — slow + p99-noisy as a per-PR gate (see
# kanz/test/load/README.md). The in-process micro-benchmark guard is LATENCY-01d.
#
# Both jobs reuse the kanz-ci buf-generate prelude: the kanz module replaces
# github.com/eighred/kanz/kanz-schemas-go => ../kanz-schemas/gen/go, which is
# generated-not-committed (EVT-15a), so the SDK is generated before the service
# images build (Dockerfiles COPY kanz-schemas/gen/go) and before `go run`.
name: latency

on:
  pull_request:
    paths:
      - 'kanz/internal/risk/**'
      - 'kanz/pkg/bus/**'
      - 'kanz/services/risk-engine/**'
      - 'kanz/services/api-gateway/**'
      - 'kanz/test/load/**'
      - 'kanz-schemas/proto/**'
      - '.github/workflows/latency.yml'
  workflow_dispatch:
    inputs:
      base_url:
        description: >-
          Target the full baseline.js capacity ramp at this gateway URL (e.g.
          https://gw.kanz.example). Leave empty to run it against a freshly
          spun-up ephemeral stack.
        required: false
        default: ''

permissions:
  contents: read
  # READ, NOT WRITE (#161). This workflow builds images but never publishes one —
  # the load stack is ephemeral. It needs the scope only because every Dockerfile
  # FROM now resolves to the private ghcr.io/eighred/base/* namespace, so the
  # compose build below cannot pull its base without a credential.
  packages: read

env:
  GOFLAGS: -mod=mod

jobs:
  load-smoke:
    # Per-PR gate; also runs the smoke on a manual dispatch with no base_url.
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.base_url == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: kanz/go.mod
          cache-dependency-path: kanz/go.sum

      - uses: ./.github/actions/setup-buf
        with:
          version: 1.69.0

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate kanz-schemas Go SDK
        working-directory: kanz-schemas
        run: |
          buf generate
          cd gen/go
          go mod init github.com/eighred/kanz/kanz-schemas-go || true
          go mod tidy

      # THIS WORKFLOW BUILDS IMAGES TOO, and had no ghcr login at all (#161).
      #
      # Easy to miss: there is no build-push-action here, just `compose up
      # --build`, so it does not look like an image-building workflow — but it
      # builds risk-engine and api-gateway from the same Dockerfiles, whose bases
      # are now private. Without this the load stack fails on a base pull and
      # reports itself as "gateway did not become ready", two layers from the
      # cause. See build.yml for why fork PRs cannot work here either;
      # test/arch/supplychain_test.go enforces that every workflow building a
      # mirror-based image authenticates first.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + start load stack
        run: docker compose -f kanz/test/load/docker-compose.yml up -d --build

      - name: Wait for gateway ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/readyz >/dev/null 2>&1; then
              echo "gateway ready"; exit 0
            fi
            echo "waiting for gateway ($i)..."; sleep 2
          done
          echo "gateway did not become ready"; exit 1

      - name: Seed a portfolio
        working-directory: kanz
        run: go run ./test/load/seed

      # THE GATEWAY REQUIRES A TOKEN, AND THIS JOB NEVER MINTED ONE.
      #
      # SEC-M1 stopped the gateway starting unauthenticated, and the compose file
      # sets API_GATEWAY_JWT_SECRET + API_GATEWAY_REQUIRED_ROLE accordingly — but
      # neither the readiness poll below nor the k6 step was updated, so every
      # request to /v1 got a 401 and the job reported "seeded portfolio never
      # became queryable". It has failed on every recorded run since (#132).
      #
      # The tenant is LOAD-TEST, matching SEED_TENANT in test/load/seed and
      # RISK_ENGINE_TENANT in the compose file. It is not cosmetic: the token's
      # tenant is the RLS scope the query runs under, so a mismatched one
      # authenticates fine and then finds nothing — which would look exactly like
      # the failure this job was already reporting. (The compose comment's
      # example says `--tenant PF1-tenant`; that is stale, and PF1 is the
      # PORTFOLIO id, not the tenant.)
      - name: Mint a gateway token
        working-directory: kanz
        run: |
          set -euo pipefail
          token="$(go run ./cmd/kanz-devtoken --secret load-secret --tenant load-test --role kanz-user)"
          if [ -z "$token" ]; then echo "devtoken produced nothing"; exit 1; fi
          echo "::add-mask::$token"
          echo "TOKEN=$token" >> "$GITHUB_ENV"

      - name: Wait for seeded state to be queryable
        run: |
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              http://localhost:8080/v1/portfolios/PF1/exposure)
            if [ "$code" = "200" ]; then echo "portfolio queryable"; exit 0; fi
            echo "exposure http $code ($i)..."; sleep 2
          done
          # Say WHICH failure this is. "Never became queryable" describes the
          # symptom two layers above the cause, and it sent the last several
          # investigations at the seed and the projection when the request was
          # simply not authenticated.
          case "$code" in
            401) echo "gateway rejected the token (401) — check the secret/tenant/role passed to kanz-devtoken against the compose environment" ;;
            403) echo "authenticated but forbidden (403) — the token's roles do not include API_GATEWAY_REQUIRED_ROLE" ;;
            404) echo "authenticated, but PF1 is not there (404) — the seed or the projection did not land" ;;
            *)   echo "seeded portfolio never became queryable (last http $code)" ;;
          esac
          exit 1

      - name: Run k6 smoke (p99/error budget gate)
        run: |
          # TOKEN is read by test/load/config.js, which sets the Authorization
          # header only when it is non-empty. Without it every request 401s and
          # the run fails on its error-budget threshold rather than saying why.
          # PINNED (#155). k6 crossed a MAJOR while this said `:latest` — v2.0.0
          # shipped 2026-05-11 — so this gate has already changed engine major
          # underneath a p99/error-budget threshold with no commit to review.
          # A perf gate that silently changes its own runtime cannot distinguish
          # "the code regressed" from "the tool did".
          docker run --rm --network host \
            -e BASE_URL=http://localhost:8080 -e PORTFOLIO=PF1 -e TOKEN="$TOKEN" \
            -v "$PWD/kanz/test/load:/scripts" \
            grafana/k6:2.1.0 run /scripts/smoke.js

      - name: Stack logs (on failure)
        if: failure()
        run: docker compose -f kanz/test/load/docker-compose.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f kanz/test/load/docker-compose.yml down -v

  benchmarks:
    # LATENCY-01d — run the compute hot-path benchmarks in CI. The deterministic
    # allocation-regression GUARD is the `testing.AllocsPerRun` cases in
    # compute/regression_test.go, executed by the kanz-ci `go test -race ./...`
    # gate (no flaky timing baseline). This job additionally runs the `testing.B`
    # benchmarks (-benchtime=10x, fast) so they stay compilable + their numbers
    # surface per PR for trend-watching.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: kanz/go.mod
          cache-dependency-path: kanz/go.sum
      - uses: ./.github/actions/setup-buf
        with:
          version: 1.69.0
      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Generate kanz-schemas Go SDK
        working-directory: kanz-schemas
        run: |
          buf generate
          cd gen/go
          go mod init github.com/eighred/kanz/kanz-schemas-go || true
          go mod tidy
      - name: Run compute benchmarks
        working-directory: kanz
        run: go test -run '^$' -bench . -benchmem -benchtime=10x -p 1 ./internal/risk/compute/...

      # The wall-clock p99 budget (`-tags perf`). It lives HERE and not in the kanz-ci
      # `go test -race ./...` gate because a latency budget under the race detector
      # measures the detector, and a latency budget sharing a machine with the rest of
      # the suite measures the scheduler: it blew its 250ms budget at 482ms and 852ms for
      # exactly those reasons, on a box with nothing wrong with it. Here it runs alone
      # and unraced, which is the only condition under which its number means anything.
      - name: Run the compute latency budget
        working-directory: kanz
        run: go test -tags perf -run TestComputeMeasuresP99UnderBurst -p 1 ./internal/risk/compute/...

  capacity-baseline:
    # Manual only. The multi-minute ramp to the capacity knee — against a real
    # deployed env (base_url) or, with no input, a fresh ephemeral stack.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.base_url != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run k6 baseline against ${{ github.event.inputs.base_url }}
        run: |
          # PINNED (#155) — keep in step with the smoke step above. This is also
          # the image that receives LOAD_TEST_TOKEN, so "whatever :latest is
          # today" was an unreviewed third party handling a live credential.
          docker run --rm \
            -e BASE_URL='${{ github.event.inputs.base_url }}' -e PORTFOLIO=PF1 \
            -e TOKEN='${{ secrets.LOAD_TEST_TOKEN }}' \
            -v "$PWD/kanz/test/load:/scripts" \
            grafana/k6:2.1.0 run /scripts/baseline.js

name: Windows developer process cleanup
on:
  pull_request:
    paths:
      - 'kanz/dev/check.py'
      - 'kanz/dev/test_check.py'
      - '.github/scripts/go_shard_evidence.py'
      - '.github/workflows/dev-process-cleanup.yml'
  push:
    branches: [main]
    paths:
      - 'kanz/dev/check.py'
      - 'kanz/dev/test_check.py'
      - '.github/scripts/go_shard_evidence.py'
      - '.github/workflows/dev-process-cleanup.yml'

permissions:
  contents: read

jobs:
  windows-timeout:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Observe timeout cleanup of three Windows processes
        working-directory: kanz/dev
        run: python -B -m unittest -v test_check.TimeoutTests

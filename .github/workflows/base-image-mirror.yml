# Base-image mirror (M0.1). Copies the estate's base images into a registry it
# OWNS, so a build no longer depends on a third party answering.
#
# WHY THIS EXISTS. Every one of the 25 Dockerfiles pulled its base from Docker
# Hub or gcr.io. On 2026-07-27 that produced seven registry-1.docker.io
# timeouts, three of them on consecutive PRs (#46, #48, #49) each needing a
# manual re-run. A build system that cannot build unless someone else's registry
# answers is not a build system; it is a dependency with a queue in front of it.
#
# THE CUTOVER HAS HAPPENED (#161). Every FROM in the repository — 52 of them
# across 26 Dockerfiles — now resolves under ghcr.io/eighred/base/*. This
# workflow is no longer an instrument nobody reads: it is on the critical path of
# every image build, and a failure here means the next build has no base.
#
# Populating the mirror and pointing the Dockerfiles at it were SEPARATE changes,
# in that order, on purpose — rewriting first would have repointed 26 builds at
# tags that did not exist yet.
#
# "CONFIRM THE PACKAGES ARE THERE" WAS NOT THE WHOLE PRECONDITION, and this
# comment used to say it was. Being there is necessary and not sufficient: the
# packages must also be PULLABLE BY EVERY CONTEXT THAT BUILDS AN IMAGE.
# ghcr.io/eighred/base/* is PRIVATE and stays private — company policy forbids
# publishing internal packages or mirrors — so the resolution was to
# authenticate, not to expose:
#
#   build.yml    login was `if: github.event_name == 'push'`; now unconditional,
#                because the credential is needed to BUILD, not only to publish.
#   latency.yml  had no login at all and `compose up --build`s two services.
#   preview.yml  already logged in unconditionally; unchanged.
#
# THE COST OF STAYING PRIVATE, recorded rather than discovered later: a
# pull_request from a FORK cannot build an image, because its GITHUB_TOKEN has no
# read access to this org's packages. build.yml fails such a PR in its first step
# with a message naming that cause. Same-repo branches — the workflow this team
# actually uses — are unaffected.
#
# A DEVELOPER BUILDING LOCALLY MUST `docker login ghcr.io` FIRST. `make dev-up`
# and the load stack both build from these Dockerfiles. See kanz/infra/README.md.
#
# test/arch/supplychain_test.go enforces the invariant this all rests on: no
# workflow may build a mirror-based image without authenticating first.
name: base-image-mirror

on:
  # A MIRROR WITHOUT A REFRESH PATH SILENTLY AGES, and that is worse than not
  # mirroring at all. `golang:1.26.5` is a MUTABLE tag: upstream rebuilds it
  # with OS security patches under the same name. Copy it once and the estate
  # stops receiving those patches while every Dockerfile still points at the
  # tag, believing it current — so the mirror converts a supply-chain
  # dependency into a supply-chain freeze, and nothing anywhere says so.
  #
  # Weekly rather than daily. The upstream cadence for base-image patch
  # rebuilds is roughly that, and a daily run that almost always finds nothing
  # trains its reader to ignore it — which matters here because the ONE thing
  # this workflow needs someone to notice is the run where a digest moved.
  schedule:
    - cron: '17 4 * * 1'   # Mondays 04:17 UTC; off the hour to avoid the stampede
  # Manual trigger for the first population and for an out-of-band refresh
  # (a CVE that cannot wait for Monday).
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Resolve and print digests without pushing'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/base-image-mirror.yml'

permissions:
  contents: read
  packages: write   # push to ghcr.io/eighred/base/*

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      # NOT fail-fast. One upstream registry being unavailable is precisely the
      # condition this mirror exists to survive, and it must not stop the other
      # images being copied — a partial mirror is strictly better than none, and
      # the failed entry is obvious in the run.
      fail-fast: false
      matrix:
        include:
          # SOURCE AND TARGET ARE BOTH EXPLICIT, and the target name is not
          # derived from the source. Deriving it would put a string-manipulation
          # step between "what we meant to mirror" and "what we pushed", and the
          # failure mode of getting that wrong is an image silently mirrored to
          # the wrong name — which looks identical to a successful run until a
          # build cannot find its base.
          #
          # The tag is part of the target on purpose: the mirror is not "latest
          # golang", it is the exact version the estate builds on. A bump means
          # a new entry here AND a Dockerfile change, together.
          - source: docker.io/library/golang:1.26.5
            target: ghcr.io/eighred/base/golang:1.26.5
          - source: gcr.io/distroless/static:nonroot
            target: ghcr.io/eighred/base/distroless-static:nonroot
          # kanz-py's base. OUTSIDE issue #55's original scope — its acceptance
          # grep is `grep -rE '^FROM ' kanz`, which never reaches
          # kanz-py/Dockerfile — but ghcr.io/eighred/inference is built and
          # deployed like any other image and carries exactly the same Docker Hub
          # exposure. Mirroring it here rather than leaving it to be noticed
          # later. See test/arch/baseimage_mirror_test.go, which flags it.
          - source: docker.io/library/python:3.12-slim
            target: ghcr.io/eighred/base/python:3.12-slim

          # --- CI SERVICE IMAGES -------------------------------------------
          #
          # A SECOND DOCKER HUB DEPENDENCY, ON THE SAME CRITICAL PATH, THAT THE
          # DOCKERFILE MIRROR DOES NOT COVER. These are pulled by `services:`
          # blocks and `docker run` steps in kanz-ci.yml and latency.yml, not by
          # any FROM, so #55's acceptance grep never sees them and
          # test/arch/baseimage_mirror_test.go does not either.
          #
          # It is not theoretical. On 2026-07-29 `kanz-ci` failed on main at step
          # 12 of 28 with
          #
          #   docker: Error response from daemon: Head
          #   "https://registry-1.docker.io/v2/apache/kafka/manifests/3.9.0":
          #   received unexpected HTTP status: 502 Bad Gateway
          #
          # The job died before running a single test, on a commit whose PR had
          # been fully green. Mirroring the Dockerfile bases would not have saved
          # it, because none of these is a base image.
          - source: docker.io/library/postgres:16-alpine
            target: ghcr.io/eighred/base/postgres:16-alpine
          - source: docker.io/library/redis:7-alpine
            target: ghcr.io/eighred/base/redis:7-alpine
          - source: docker.io/library/nats:2
            target: ghcr.io/eighred/base/nats:2
          - source: docker.io/apache/kafka:3.9.0
            target: ghcr.io/eighred/base/kafka:3.9.0
          - source: docker.io/natsio/nats-box:0.14.5
            target: ghcr.io/eighred/base/nats-box:0.14.5
          # THE CUTOVER THIS ENTRY WAS WAITING FOR HAS HAPPENED (#155). This
          # read "mirroring a moving tag is a compromise, not an oversight:
          # pinning it belongs with the cutover" — both latency.yml steps now
          # pin 2.1.0, so the compromise has no remaining premise. Mirroring
          # `:latest` past that point would reintroduce the moving tag on the
          # mirror side while the workflows believed themselves pinned, which is
          # worse than the original: the drift would arrive through the registry
          # the estate OWNS and therefore trusts.
          #
          # Bumping k6 is now two edits in one commit — here and latency.yml —
          # exactly like golang above.
          - source: docker.io/grafana/k6:2.1.0
            target: ghcr.io/eighred/base/k6:2.1.0

    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # crane copies MANIFESTS, not layers-through-a-daemon. That matters for
      # more than speed: `docker pull && docker tag && docker push` on a
      # multi-arch base silently keeps only the runner's own architecture, so
      # the mirror would serve amd64 to an arm64 builder and fail in a way that
      # looks like a corrupt image. crane copy preserves the full index.
      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Resolve the upstream digest
        id: resolve
        run: |
          set -euo pipefail
          digest="$(crane digest '${{ matrix.source }}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "::notice title=Mirroring::${{ matrix.source }} @ $digest -> ${{ matrix.target }}"

      # WHAT THE MIRROR SERVES RIGHT NOW, read BEFORE the copy overwrites it.
      #
      # This is the whole reason the refresh is not just a cron. A scheduled
      # copy silently changes the bytes behind `FROM ghcr.io/eighred/base/...`
      # for every build in the estate — which is exactly what you want for a
      # security patch, and exactly what you do not want to happen unannounced.
      # Production manifests are digest-pinned (test/arch enforces it); base
      # images are tag-pinned, so this is the one place where what a build
      # compiles against can move without a commit.
      #
      # An absent tag is not an error here: on the first population there is
      # nothing to compare against, so `|| true` and an empty value mean "new",
      # not "broken".
      - name: Read what the mirror currently serves
        id: before
        run: |
          set -uo pipefail
          current="$(crane digest '${{ matrix.target }}' 2>/dev/null || true)"
          echo "digest=$current" >> "$GITHUB_OUTPUT"

      - name: Copy to the mirror
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          crane copy '${{ matrix.source }}' '${{ matrix.target }}'

      # PROVE THE COPY, do not assume it. crane copy exiting 0 says the push was
      # accepted; it does not say the mirror now serves the same bytes. A digest
      # comparison does, and it is the only check here that would catch a copy
      # that silently landed on the wrong tag or lost its multi-arch index.
      #
      # This repository has been bitten by exactly this shape before — a green
      # step standing in for a property nobody measured — so the verification is
      # a distinct step with its own failure message rather than a flag on the
      # copy.
      - name: Verify the mirrored digest matches upstream
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          want='${{ steps.resolve.outputs.digest }}'
          got="$(crane digest '${{ matrix.target }}')"
          if [ "$want" != "$got" ]; then
            echo "::error title=Mirror mismatch::${{ matrix.target }} is $got, upstream ${{ matrix.source }} is $want"
            echo "The push reported success but the mirror does not serve the same image."
            echo "Do NOT point any Dockerfile at this tag until it does — a build would"
            echo "silently use different bytes from the ones that were reviewed."
            exit 1
          fi
          echo "::notice title=Verified::${{ matrix.target }} == $want"

      # SAY WHEN THE BASE MOVED. A refresh that changes what every build
      # compiles against, and reports the same "success" as one that changed
      # nothing, is a silent supply-chain event. This is the line someone
      # should be able to find after the fact when a build starts behaving
      # differently and no commit explains it.
      #
      # It writes to the job summary rather than only the log, because a
      # scheduled run nobody opened is precisely the case this exists for.
      - name: Report whether the base image moved
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          before='${{ steps.before.outputs.digest }}'
          after='${{ steps.resolve.outputs.digest }}'
          if [ -z "$before" ]; then
            echo "::notice title=New in mirror::${{ matrix.target }} first published at $after"
            echo "- 🆕 \`${{ matrix.target }}\` — first published, \`$after\`" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$before" != "$after" ]; then
            echo "::warning title=Base image MOVED::${{ matrix.target }} $before -> $after. Every build using this base now compiles against different bytes."
            {
              echo "- ⚠️ **\`${{ matrix.target }}\` MOVED**"
              echo "    - was: \`$before\`"
              echo "    - now: \`$after\`"
              echo "    - Upstream \`${{ matrix.source }}\` was rebuilt. Every image built from this base now differs, with no commit explaining it — which is the point of mirroring, and worth knowing on the day it happens rather than during an incident."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=Unchanged::${{ matrix.target }} still $after"
            echo "- ✅ \`${{ matrix.target }}\` unchanged (\`$after\`)" >> "$GITHUB_STEP_SUMMARY"
          fi

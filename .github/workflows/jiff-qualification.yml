name: jiff-qualification

on:
  pull_request:
    paths:
      - 'rust/services/lake_snapshot/**'
      - 'rust/Cargo.lock'
      - 'schemas/proto/envelope/**'
      - 'schemas/proto/lake/**'
      - 'tools/jiff_qualification/**'
      - '.github/workflows/jiff-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'rust/services/lake_snapshot/**'
      - 'rust/Cargo.lock'
      - 'schemas/proto/envelope/**'
      - 'schemas/proto/lake/**'
      - 'tools/jiff_qualification/**'
      - '.github/workflows/jiff-qualification.yml'

permissions:
  contents: read
  packages: read

jobs:
  temporal-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.4'
      - name: Pull the pinned Linux compiler
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          export DOCKER_CONFIG
          DOCKER_CONFIG="$(mktemp -d "$RUNNER_TEMP/jiff-ghcr.XXXXXXXX")"
          trap 'rm -f -- "$DOCKER_CONFIG/config.json" && rmdir -- "$DOCKER_CONFIG"' EXIT
          # A nonempty auths map prevents Docker from selecting a native credential store.
          printf '%s\n' '{"auths":{"ghcr.io":{}}}' > "$DOCKER_CONFIG/config.json"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          unset GHCR_TOKEN
          docker pull --platform linux/amd64 ghcr.io/eighred/base/rust@sha256:3914072ca0c3b8aad871db9169a651ccfce30cf58303e5d6f2db16d1d8a7e58f
      - name: Compare Jiff timestamps and durations
        run: python -B tools/jiff_qualification/run.py
      - name: Exercise combined duration and timezone backports in the lake worker
        run: python -B tools/jiff_qualification/object_store.py
      - name: Test published temporal package advisory refusals
        run: python -B -m unittest discover -s tools/jiff_qualification -p test_chrono_advisories.py
      - name: Exercise the published temporal package across both Arrow versions
        id: bridge
        run: python -B tools/jiff_qualification/object_store.py --published-bridge "$RUNNER_TEMP/chrono-advisories.json"
      - name: Retain the advisory inputs used for the published package
        if: always() && steps.bridge.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-temporal-advisories
          path: ${{ runner.temp }}/chrono-advisories.json
          if-no-files-found: error

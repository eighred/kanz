name: Set up buf
description: >-
  Installs a pinned buf release from its official GitHub release, verified
  against the checksum published alongside it.

# WHY THIS EXISTS RATHER THAN bufbuild/buf-setup-action (#680).
#
# That action declares `using: "node20"`, and v1.50.0 — the version this replaced
# — is its LATEST release. So GitHub's Node-20 deprecation warning had no upgrade
# path: there was no newer tag to move the pin to. A composite action declares no
# Node runtime at all, so this class of deprecation cannot recur here.
#
# THREE THINGS IMPROVE BY ACCIDENT OF THE MOVE, and they are the reason this is
# not merely a warning suppressant:
#
#   - THE VERSION IS PINNED ONCE. It was written out at ten call sites across
#     seven workflows. They agreed on 1.69.0 today; nothing made them.
#   - THE DOWNLOAD IS VERIFIED. buf publishes sha256.txt with every release and
#     this checks the binary against it. A tarball fetched over HTTPS with no
#     checksum is trusted on transport alone.
#   - NO THIRD PARTY IS HANDED A TOKEN. All ten sites passed
#     `github_token: ${{ secrets.GITHUB_TOKEN }}` to a third-party action so it
#     could avoid API rate limits. release.yml grants `packages: write` and
#     `id-token: write`; supplychain_test.go's own header explains what a
#     compromised action can do there. This asks GitHub for a release asset over
#     unauthenticated HTTPS and needs no token at all.
#
# test/arch/supplychain_test.go exempts local actions from SHA pinning by design
# ("a local composite action is in-repo, not a supply-chain edge"), so moving here
# does not weaken that guard.

inputs:
  version:
    description: The buf release to install, without a leading "v" (e.g. 1.69.0).
    required: true

runs:
  using: composite
  steps:
    - name: Install buf ${{ inputs.version }}
      shell: bash
      env:
        BUF_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        # buf's release assets are named by uname's own output, so this derives
        # the asset name rather than assuming the runner is x86_64 Linux. A
        # future arm64 runner then works instead of silently downloading the
        # wrong binary and failing at exec time with a confusing error.
        os="$(uname -s)"
        arch="$(uname -m)"
        asset="buf-${os}-${arch}"
        base="https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}"

        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT

        # --retry-all-errors ON TOP OF --retry-connrefused, because the failure
        # that actually turns a good commit red here is neither a refused
        # connection nor an HTTP error: it is `curl: (35) Recv failure:
        # Connection reset by peer` — the transfer STARTS and dies mid-stream.
        # --retry alone covers transient HTTP codes and timeouts, and
        # --retry-connrefused extends it to a refused connect; neither covers a
        # reset, so `--retry 3` retried nothing and the job failed on the first
        # attempt. Seen on 2026-08-31, red-lighting two jobs on a merged PR.
        #
        # It does not weaken the verification below. The sha256 check is what
        # makes the download safe, and it runs on whatever bytes finally arrive —
        # retrying changes how many attempts are made, never whether the result
        # is checked.
        #
        # THE BUDGET MATTERS AS MUCH AS THE COUNT (#776). `--retry 3` at curl's
        # default backoff spends about SEVEN SECONDS in total — measured on PR
        # #902, where four attempts ran 15:43:55 → 15:44:02 and the job still
        # failed. A 504 from GitHub's release CDN routinely outlasts that, and
        # that one did: a manual re-run of the same job succeeded, which is the
        # definition of a retry that was too short to be worth having.
        #
        # --retry-max-time IS NOT OPTIONAL ALONGSIDE A RAISED COUNT. Without a
        # deadline a higher --retry can hang the job rather than fail it, trading
        # a red build for a stuck one — and a job that fails gets read while a job
        # that hangs gets waited on.
        curl --fail --silent --show-error --location \
          --retry 5 --retry-connrefused --retry-all-errors --retry-max-time 60 \
          -o "$tmp/$asset" "$base/$asset"
        curl --fail --silent --show-error --location \
          --retry 5 --retry-connrefused --retry-all-errors --retry-max-time 60 \
          -o "$tmp/sha256.txt" "$base/sha256.txt"

        # VERIFIED BEFORE IT IS EXECUTED, and the grep is anchored to the exact
        # asset name: sha256.txt lists every asset for the release, so an
        # unanchored match could verify the binary against another file's digest
        # and pass.
        line="$(grep -E "  ${asset}\$" "$tmp/sha256.txt" || true)"
        if [ -z "$line" ]; then
          echo "::error::no checksum for ${asset} in buf v${BUF_VERSION}'s sha256.txt — refusing to install an unverified binary"
          exit 1
        fi
        ( cd "$tmp" && printf '%s\n' "$line" | sha256sum --check --status ) || {
          echo "::error::checksum mismatch for ${asset} at buf v${BUF_VERSION} — refusing to install"
          exit 1
        }

        install -m 0755 "$tmp/$asset" "$RUNNER_TEMP/buf"
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

        # Prove the thing that was installed is the thing that was asked for. A
        # release whose asset does not match its tag would otherwise be found by
        # whichever job first depends on a version-specific behaviour.
        got="$("$RUNNER_TEMP/buf" --version)"
        if [ "$got" != "$BUF_VERSION" ]; then
          echo "::error::installed buf reports ${got}, expected ${BUF_VERSION}"
          exit 1
        fi
        echo "buf ${got} installed and checksum-verified"

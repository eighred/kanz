# Dependency hygiene (SEC-02c). Dependabot opens grouped update PRs across every
# ecosystem in the monorepo on a weekly cadence; the security-scan workflow
# (.github/workflows/security.yml) is the active vuln detector, and the
# remediation SLA lives in SECURITY.md. Grouped so routine bumps land as one PR
# per ecosystem (less review churn) while SECURITY updates always come alone +
# promptly.
#
# EVERY PR HERE COSTS A FULL CI MATRIX. Each one triggers kanz-ci AND kanz-build —
# and kanz-build is 19 Docker image builds, one per service. The first time this
# repository ever had a remote, Dependabot opened nine PRs at once and they queued
# ~114 image builds ahead of main's own gate; the push that actually mattered waited
# 45 minutes behind dependency bumps.
#
# So the unit to minimize is NOT the cadence (weekly is right — stale deps are a
# security problem). It is the NUMBER OF PRs. Every ungrouped ecosystem below is a
# separate PR and therefore a separate 19-job matrix, which is why the three Docker
# entries are now ONE multi-directory entry and every ecosystem carries a group.
version: 2

updates:
  # Go monorepo module.
  - package-ecosystem: gomod
    directory: /kanz
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      go-deps:
        patterns: ["*"]
        update-types: [minor, patch]

  # The standalone schema-ingest tool module (its own go.mod, EVT-16b). Grouped: it
  # was the one ecosystem that could open a PR per dependency, and each one paid for
  # 19 image builds to bump a tool that ships in no image.
  - package-ecosystem: gomod
    directory: /kanz-schemas/tools/registry-ingest
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups:
      registry-ingest-deps:
        patterns: ["*"]
        update-types: [minor, patch]

  # Python inference package.
  - package-ecosystem: pip
    directory: /kanz-py
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      py-deps:
        patterns: ["*"]
        update-types: [minor, patch]

  # TypeScript bus client.
  - package-ecosystem: npm
    directory: /kanz/ts/kanz-bus
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      ts-deps:
        patterns: ["*"]
        update-types: [minor, patch]

  # GitHub Actions pinned in the workflows (keep the supply chain of CI itself
  # current — the actions are part of the build's trust base).
  #
  # Both directories, not just root: SUPPLY-M1 pinned every `uses:` to an
  # immutable commit SHA, in both .github/workflows and
  # kanz-schemas/.github/workflows. A pin is only as fresh as whatever can move
  # it, and Dependabot is now the ONLY thing that can — a floating tag used to
  # absorb upstream security fixes silently, a SHA never will. Scanning just "/"
  # leaves the 14 pins under kanz-schemas frozen forever with no updater
  # watching them. (If kanz-schemas is ever split into its own mirrored repo,
  # its own Dependabot config would cover its workflows there — but today its
  # workflows live, and run, in this monorepo, so they're covered here.)
  - package-ecosystem: github-actions
    directories: ["/", "/kanz-schemas"]
    schedule: { interval: weekly }
    groups:
      ci-actions:
        patterns: ["*"]

  # Container base images in the service Dockerfiles.
  #
  # ONE entry over several directories, not one entry per directory. These were three
  # separate blocks, so a single distroless base bump opened THREE PRs and paid for
  # three 19-job image matrices — 57 Docker builds to move one base image tag. They
  # share the same base images, so they should move together anyway: a base bump that
  # lands on one service and not the others is drift.
  - package-ecosystem: docker
    directories:
      - /kanz/services/risk-engine
      - /kanz/services/schema-registry
      - /kanz/services/api-gateway
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups:
      base-images:
        patterns: ["*"]

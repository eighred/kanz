[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kanz-bus"
version = "0.0.0"
description = "Python bus client for the Kanz event backbone (NATS JetStream + Kafka)"
requires-python = ">=3.10"
dependencies = [
    "nats-py>=2.7.0",
    "aiokafka>=0.10.0",
    "kanz-schemas>=0.1.0",
    "protobuf>=5.29",
    "grpcio>=1.62",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
# Both subtrees shipped under one distribution for now. A future task
# (likely paired with PRED-09 model-registry packaging) will split
# kanz-inference into its own distribution with its own pyproject.
include = ["kanz_bus*", "kanz_inference*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

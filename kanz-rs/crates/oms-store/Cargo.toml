[package]
name = "kanz-oms-store"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[features]
default = []
qualification-diagnostics = []

[dependencies]
kanz-order-core = { path = "../order-core" }
kanz-decimal-compat = { path = "../.." }
kanz-proto-wire = { path = "../proto-wire" }
prost = "=0.14.4"
prost-types = "=0.14.4"
prost-reflect = "=0.16.5"
uuid = { version = "=1.29.1", features = ["v7"] }
sha2 = "=0.10.9"
num-bigint = "=0.4.6"
num-rational = "=0.4.2"
num-traits = "=0.2.19"
tokio-postgres = "=0.7.18"
tokio = { version = "=1.54.1", features = ["rt", "time"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
base64 = "=0.22.1"
async-nats = { version = "=0.51.0", default-features = false, features = ["ring", "jetstream", "nuid"] }

[package]
name = "kanz-lake-snapshot"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
bytes = "=1.12.1"
datafusion = { version = "=54.1.0", default-features = false }
parquet = { version = "=58.4.1", default-features = false, features = ["arrow"] }
prost = "=0.14.1"
prost-types = "=0.14.1"
sha2 = "=0.10.9"
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.191"

[build-dependencies]
prost-build = "=0.14.1"
protoc-bin-vendored = "=3.2.0"

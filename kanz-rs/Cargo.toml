[package]
name = "kanz-decimal-compat"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace]
members = ["crates/market-feed", "crates/oms-store", "services/binance-depth", "services/okx-depth", "services/bond-risk-shadow", "services/oms-fold-shadow"]
resolver = "2"

[dependencies]
prost = "=0.14.4"

[build-dependencies]
prost-build = "=0.14.1"
protoc-bin-vendored = "=3.3.0"

[dev-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
overflow-checks = true

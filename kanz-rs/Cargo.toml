[package]
name = "kanz-decimal-compat"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace]
members = ["crates/oms-recovery", "crates/order-core", "crates/market-feed", "crates/oms-store", "crates/proto-wire", "crates/oms-venue", "services/binance-depth", "services/okx-depth", "services/bond-risk-shadow", "services/oms-fold-shadow", "services/lake-snapshot", "crates/browser-render", "crates/option_pricing"]
resolver = "2"

[dependencies]
prost = "=0.14.1"

[build-dependencies]
prost-build = "=0.14.1"
protoc-bin-vendored = "=3.2.0"

[dev-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
overflow-checks = true

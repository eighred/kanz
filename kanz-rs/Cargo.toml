[package]
name = "kanz-decimal-compat"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
prost = "=0.14.4"

[build-dependencies]
prost-build = "=0.14.4"
protoc-bin-vendored = "=3.3.0"

[dev-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
overflow-checks = true
